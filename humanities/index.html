<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📖 肥鱼人文区</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh;
    background:radial-gradient(120% 90% at 50% 0%, #2a2418 0%, #16120a 55%, #0a0804 100%);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#e8dcc0; padding:22px 14px 48px; user-select:none;
  }
  .back { display:inline-block; text-decoration:none; color:#b0a06a; font-size:10px; margin-bottom:6px;
    padding:6px 12px; border:1px solid #4a4022; border-radius:20px; }
  .back:active { background:#241e10; }
  h1 { font-size:12px; text-align:center; color:#e0c060; font-weight:700; letter-spacing:2px; margin:4px 0 6px; }
  .sub { text-align:center; color:#9a8f6a; font-size:10px; margin-bottom:8px; line-height:1.7; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:6px; max-width:720px; margin:0 auto; }
  a.tool {
    display:block; text-decoration:none; color:inherit;
    background:linear-gradient(160deg,#2a2410,#181208);
    border:1px solid #6a5a2a; border-radius:14px; padding: 12px 10px; transition:.18s;
    box-shadow:0 4px 20px rgba(100,80,20,.22);
  }
  a.tool:active { transform:scale(.96); background:#342c14; }
  a.tool .icon { font-size:20px; display:block; margin-bottom:8px; }
  a.tool .name { font-size:10px; font-weight:700; color:#e0c060; }
  a.tool .desc { font-size:10px; color:#b0a06a; margin-top:4px; line-height:1.55; }
  .more { max-width:720px; margin:22px auto 0; text-align:center; color:#5a5030; font-size:10px;
    border:1px dashed #3a3220; border-radius:12px; padding:16px; line-height:1.9; }
  .foot { text-align:center; color:#5a5030; font-size:10px; margin-top:24px; line-height:1.9; }
  .ver { text-align:center; color:#3a3220; font-size:10px; margin-top:10px; }
</style>
</head>
<body>
  <a class="back" href="../">← 回游戏厅</a>
  <h1>📖 人 文 区</h1>
  <div class="sub">古文字 · 民俗 · 人类文化<br>从哪儿来，怎么活，怎么想</div>

  <div class="grid">
    <a class="tool" href="../tools/runes/">
      <span class="icon">ᚠ</span>
      <span class="name">卢恩符文</span>
      <span class="desc">北欧 24 符 · 日耳曼古文字</span>
    </a>
    <a class="tool" href="../tools/ogham/">
      <span class="icon">🌳</span>
      <span class="name">欧甘树文</span>
      <span class="desc">凯尔特 20 树符 · 德鲁伊自然符号</span>
    </a>
    <a class="tool" href="../tools/omikuji/">
      <span class="icon">🎋</span>
      <span class="name">御神签</span>
      <span class="desc">日本神社民俗 · おみくじ文化</span>
    </a>
    <a class="tool" href="../tools/raml/">
      <span class="icon">⚖️</span>
      <span class="name">阿拉伯地占</span>
      <span class="desc">点阵推演 · 北非中东古老占术</span>
    </a>
    <a class="tool" href="../tools/tarot/">
      <span class="icon">🃏</span>
      <span class="name">塔罗牌</span>
      <span class="desc">78 张 · 欧洲神秘学文化</span>
    </a>
  </div>

  <div class="more">
    ✨ 更多文化内容，未来开启……<br>
    <span style="font-size:10px">（神话・文字・民俗・历史……想加啥就说）</span>
  </div>

  <div class="foot">🐳 大肥鱼出品 · 文化是人的来处<br>本区含古文化占术，供了解与娱乐</div>
  <div class="ver">v3-统一紧凑 20261016</div>
</body>
</html>
