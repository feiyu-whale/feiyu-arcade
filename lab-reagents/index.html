<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>🧪 试剂库 · 颜色/毒性/禁忌</title>
<style>
  :root{
    --bg:#0a1018; --card:#101a26; --line:#1c2f42;
    --txt:#d3e2f0; --dim:#7c99b5; --acc:#4dd0e1;
    --danger:#ff5f6d; --warn:#ffb74d; --ok:#66d9a0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:radial-gradient(900px 480px at 50% -8%,#16303f,transparent 62%),var(--bg);
    color:var(--txt);
    font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:14px 12px 40px;
  }
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:19px;margin:0 0 3px;letter-spacing:1px}
  .sub{font-size:12px;color:var(--dim);margin:0 0 4px}
  .banner{
    margin:10px 0 14px;padding:9px 13px;border-radius:10px;font-size:12.5px;
    background:rgba(255,95,109,.1);border:1px solid rgba(255,95,109,.32);color:#ff9aa4;
    line-height:1.65;
  }
  .bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
  .chip{
    padding:5px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;
    background:#12202e;border:1px solid var(--line);color:var(--dim);
    transition:.15s;user-select:none;
  }
  .chip:hover{border-color:var(--acc);color:var(--txt)}
  .chip.on{background:rgba(77,208,225,.15);border-color:var(--acc);color:var(--acc);font-weight:600}
  .search{
    width:100%;padding:10px 14px;border-radius:10px;margin-bottom:13px;
    background:#0d1826;border:1px solid var(--line);color:var(--txt);font-size:14.5px;outline:none;
  }
  .search:focus{border-color:var(--acc)}

  .card{
    background:linear-gradient(180deg,rgba(20,34,48,.96),rgba(13,22,33,.96));
    border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px;
  }
  .hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:3px}
  .nm{font-size:16.5px;font-weight:700}
  .fm{font-size:12.5px;color:var(--acc);font-family:ui-monospace,Consolas,monospace}
  .cat{font-size:10.5px;padding:2px 8px;border-radius:20px;background:rgba(77,208,225,.1);color:var(--acc)}
  .st{font-size:11.5px;color:var(--dim);margin-bottom:9px}

  .row{display:flex;gap:8px;margin-bottom:6px;font-size:13px;line-height:1.6}
  .k{flex:0 0 46px;color:var(--dim);font-size:12px;padding-top:1px}
  .v{flex:1;min-width:0}

  .tox{
    display:inline-block;padding:2px 9px;border-radius:6px;font-size:11.5px;font-weight:600;
  }
  .tox1{background:rgba(102,217,160,.14);color:#7ee0ae}
  .tox2{background:rgba(102,217,160,.1);color:#8ecf9f}
  .tox3{background:rgba(255,183,77,.14);color:#ffc971}
  .tox4{background:rgba(255,140,80,.16);color:#ffab7b}
  .tox5{background:rgba(255,95,109,.18);color:#ff8a95}

  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .tg{font-size:10.5px;padding:2px 8px;border-radius:5px;background:#172635;color:#8fb0c9}

  .forbid{
    margin-top:10px;padding:9px 12px;border-radius:9px;
    background:rgba(255,95,109,.08);border-left:3px solid var(--danger);
  }
  .forbid .t{font-size:11.5px;color:#ff8a95;font-weight:700;margin-bottom:4px}
  .forbid ul{margin:0;padding-left:17px;font-size:12.5px;color:#ffb3ba;line-height:1.75}

  .conflict{
    margin-top:8px;padding:9px 12px;border-radius:9px;
    background:rgba(255,183,77,.07);border-left:3px solid var(--warn);
    font-size:12.5px;line-height:1.7;color:#ffd08a;
  }
  .conflict .t{font-weight:700;color:#ffb74d;font-size:11.5px;margin-bottom:3px}

  .use{margin-top:8px;font-size:12.5px;color:var(--dim);line-height:1.65}
  .use b{color:#a9c6dd;font-weight:600}

  .empty{text-align:center;color:var(--dim);padding:40px 0;font-size:13.5px}
  .cnt{font-size:11.5px;color:var(--dim);margin-bottom:9px}
  #ver{position:fixed;right:10px;bottom:8px;font-size:10px;color:#33506b}
  .back{display:inline-block;margin-bottom:10px;color:var(--dim);font-size:12.5px;text-decoration:none}
  .back:hover{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="../pro-tools/">← 回专业工具</a>
  <h1>🧪 试剂库</h1>
  <p class="sub">颜色 · 毒性 · 禁忌 —— 常见试剂与溶液速查</p>

  <div class="banner">
    ⚠️ <b>本表只作识别与防护参考。</b>实验室所有试剂一律<b>禁止入口、禁止擅自混合</b>。
    「气味」栏只转录教材记载，不代表可以品尝。拿不准的组合，一律不混。
  </div>

  <input class="search" id="q" placeholder="搜索名称 / 化学式 / 用途，如「硫酸铜」「NaOH」">
  <div class="bar" id="bar"></div>
  <div class="cnt" id="cnt"></div>
  <div id="list"></div>

</div>
<div id="ver">v1.0.0-试剂库 20261102</div>

<script>
(function(){
  'use strict';
  var DATA = [];
  var curCat = '全部';
  var kw = '';

  function $(id){ return document.getElementById(id); }

  function toxClass(n){ return 'tox' + (n >= 1 && n <= 5 ? n : 3); }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function render(){
    var cats = ['全部'];
    var seen = {};
    DATA.forEach(function(d){
      if (!seen[d.cat]) { seen[d.cat] = 1; cats.push(d.cat); }
    });

    var bar = $('bar');
    bar.innerHTML = '';
    cats.forEach(function(c){
      var el = document.createElement('div');
      el.className = 'chip' + (c === curCat ? ' on' : '');
      el.textContent = c;
      el.onclick = function(){ curCat = c; render(); };
      bar.appendChild(el);
    });

    var list = DATA.filter(function(d){
      if (curCat !== '全部' && d.cat !== curCat) return false;
      if (!kw) return true;
      var hay = (d.name + ' ' + d.formula + ' ' + d.uses + ' ' + d.state).toLowerCase();
      return hay.indexOf(kw.toLowerCase()) >= 0;
    });

    $('cnt').textContent = '共 ' + list.length + ' 种' +
      (curCat === '全部' ? '' : '（' + curCat + '）') +
      (kw ? ' · 搜索「' + kw + '」' : '');

    var box = $('list');
    if (!list.length){
      box.innerHTML = '<div class="empty">没有匹配的试剂</div>';
      return;
    }

    box.innerHTML = list.map(function(d){
      var forbid = (d.forbid || []).map(function(f){ return '<li>' + esc(f) + '</li>'; }).join('');
      var tags = (d.tags || []).map(function(t){ return '<span class="tg">' + esc(t) + '</span>'; }).join('');
      return '' +
        '<div class="card">' +
          '<div class="hd">' +
            '<span class="nm">' + esc(d.name) + '</span>' +
            '<span class="fm">' + esc(d.formula) + '</span>' +
            '<span class="cat">' + esc(d.cat) + '</span>' +
          '</div>' +
          '<div class="st">' + esc(d.state) + ' ｜ <span class="' + toxClass(d.tox) + ' tox">' + esc(d.toxLabel) + '</span></div>' +
          '<div class="row"><div class="k">颜色</div><div class="v">' + esc(d.color) + '</div></div>' +
          '<div class="row"><div class="k">气味</div><div class="v">' + esc(d.odor) + '</div></div>' +
          (tags ? '<div class="tags">' + tags + '</div>' : '') +
          (forbid ? '<div class="forbid"><div class="t">🚫 禁止</div><ul>' + forbid + '</ul></div>' : '') +
          (d.conflict ? '<div class="conflict"><div class="t">⚠️ 混合风险</div>' + esc(d.conflict) + '</div>' : '') +
          (d.uses ? '<div class="use"><b>用途：</b>' + esc(d.uses) + '</div>' : '') +
        '</div>';
    }).join('');
  }

  $('q').addEventListener('input', function(e){
    kw = e.target.value.trim();
    render();
  });

  fetch('data.json').then(function(r){ return r.json(); }).then(function(d){
    DATA = d || [];
    render();
  }).catch(function(e){
    $('list').innerHTML = '<div class="empty">数据加载失败：' + esc(e.message) + '</div>';
  });
})();
</script>
</body>
</html>
