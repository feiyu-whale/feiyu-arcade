<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌌 肥鱼天文地理区</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh;
    background:radial-gradient(120% 90% at 50% 0%, #101a38 0%, #080d1e 55%, #04060e 100%);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#c8d8f8; padding:22px 14px 48px; user-select:none;
  }
  .back { display:inline-block; text-decoration:none; color:#6a83b3; font-size:10px; margin-bottom:6px;
    padding:6px 12px; border:1px solid #22324c; border-radius:20px; }
  .back:active { background:#101c2e; }
  h1 { font-size:12px; text-align:center; color:#80b0ff; font-weight:700; letter-spacing:2px; margin:4px 0 6px; }
  .sub { text-align:center; color:#5b7a99; font-size:10px; margin-bottom:8px; line-height:1.7; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:6px; max-width:720px; margin:0 auto; }
  a.tool {
    display:block; text-decoration:none; color:inherit;
    background:linear-gradient(160deg,#12203c,#0a1224);
    border:1px solid #2e4a7a; border-radius:14px; padding: 12px 10px; transition:.18s;
    box-shadow:0 4px 20px rgba(30,60,140,.25);
  }
  a.tool:active { transform:scale(.96); background:#182a4a; }
  a.tool .icon { font-size:20px; display:block; margin-bottom:8px; }
  a.tool .name { font-size:10px; font-weight:700; color:#a8c8ff; }
  a.tool .desc { font-size:10px; color:#7a93c8; margin-top:4px; line-height:1.55; }
  .foot { text-align:center; color:#3a4a6a; font-size:10px; margin-top:32px; line-height:1.9; }
  .ver { text-align:center; color:#26324a; font-size:10px; margin-top:10px; }
</style>
</head>
<body>
  <a class="back" href="../">← 回游戏厅</a>
  <h1>🌌 天 文 地 理</h1>
  <div class="sub">观星象 · 量大地<br>看得见的宇宙与脚下的土地</div>

  <div class="grid">
    <a class="tool" href="../tools/celestial-star/">
      <span class="icon">🌌</span>
      <span class="name">星空图</span>
      <span class="desc">真实星空 · 星座连线 · 亮星 · 拖动旋转</span>
    </a>
    <a class="tool" href="../tools/astrology/">
      <span class="icon">🪐</span>
      <span class="name">本命星盘</span>
      <span class="desc">行星 · 十二宫位 · 相位连线 · 尊贵</span>
    </a>
    <a class="tool" href="../tools/ancient-astro/">
      <span class="icon">🏛️</span>
      <span class="name">古代天文学换算</span>
      <span class="desc">四柱干支 · 十二时辰 · 二十八宿 · 节气</span>
    </a>
    <a class="tool" href="../tools/geo-distance/">
      <span class="icon">🌍</span>
      <span class="name">经纬度测距</span>
      <span class="desc">Haversine 球面距离 · 地图点选两点</span>
    </a>
    <a class="tool" href="../tools/moon-phase/">
      <span class="icon">🌙</span>
      <span class="name">月相盘</span>
      <span class="desc">儒略日 · 动态月相 · 月龄</span>
    </a>
    <a class="tool" href="../emergence/">
      <span class="icon">🌠</span>
      <span class="name">涌现实验室</span>
      <span class="desc">数学玩具 · 简单规则长出复杂</span>
    </a>
  </div>

  <div class="foot">🐳 大肥鱼出品 · 星象天文可作科普<br>星盘命理向内容仅供娱乐</div>
  <div class="ver">v3-统一紧凑 20261016</div>
</body>
</html>
