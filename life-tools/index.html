<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>🧪 生活工具箱</title>
<script>
/* 2026-11-05 开屏引导：本次会话没看过 → 跳 startup/；看过 → 直接进 */
try {
  if (!sessionStorage.getItem('feiyuEntered_life-tools')) { location.replace('./startup/'); }
} catch (e) { /* 隐私模式禁存储时直接进 */ }
</script>

<style>
  :root{
    --bg:#0b1118; --txt:#d5e3ef; --dim:#7d97ad; --acc:#4fa8e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:14px 10px 40px;
    background:radial-gradient(900px 480px at 50% -8%,#12303f,transparent 62%),var(--bg);
    color:var(--txt);
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:19px;margin:0 0 3px;letter-spacing:1px;text-align:center}
  .sub{font-size:11.5px;color:var(--dim);text-align:center;margin:0 0 14px}
  .back{display:inline-block;margin-bottom:10px;color:var(--dim);font-size:12px;text-decoration:none}
  .back:hover{color:var(--acc)}

  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  }
  .zone{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:11px 4px;border-radius:10px;
    background:linear-gradient(180deg,rgba(23,33,45,.95),rgba(16,24,33,.95));
    border:1px solid #1f2f3f;text-decoration:none;color:var(--txt);
    transition:.15s;
  }
  .zone:hover{border-color:var(--acc);transform:translateY(-2px)}
  .zone .icon{font-size:19px;line-height:1.1}
  .zone .name{font-size:12px;font-weight:600}
  .zone .desc{font-size:9.5px;color:var(--dim);text-align:center;line-height:1.35;padding:0 2px}
  #ver{position:fixed;right:8px;bottom:6px;font-size:10px;color:#37506a}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 回首页</a>
  <h1>🧪 生活工具箱</h1>
  <p class="sub">化学 · 调酒 · 文件转换 · 全程本地</p>

  <div class="grid">
    <a class="zone" href="../element-burn/">
      <span class="icon">⚗️</span>
      <span class="name">元素周期表</span>
      <span class="desc">变种・燃烧能量・用途</span>
    </a>
    <a class="zone" href="../lab-reagents/">
      <span class="icon">🧪</span>
      <span class="name">试剂库</span>
      <span class="desc">颜色・毒性・禁忌</span>
    </a>
    <a class="zone" href="../cocktail/">
      <span class="icon">🍸</span>
      <span class="name">调酒工具</span>
      <span class="desc">配方・原料反查・百科</span>
    </a>
    <a class="zone" href="../file-tools/">
      <span class="icon">🗂️</span>
      <span class="name">文件工具箱</span>
      <span class="desc">拖拽转换・图片・PDF・数据</span>
    </a>
  </div>
</div>
<div id="ver">v1.0.0-生活工具箱 20261102</div>
</body>
</html>
