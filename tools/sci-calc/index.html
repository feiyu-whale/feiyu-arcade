<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧮 科学计算器</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }
  html,body { height:100%; background:#0b0f14; overflow:hidden; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#dbeafe;
    display:flex; align-items:center; justify-content:center; user-select:none; }
  #wrap { width:100%; max-width:420px; height:100%; max-height:100vh; display:flex; flex-direction:column; }
  .bar { display:flex; align-items:center; gap:8px; padding:8px 12px 4px; }
  .bar .back { text-decoration:none; color:#6b8fb3; font-size:12.5px; padding:4px 10px; border:1px solid #22384c; border-radius:16px; }
  .bar .ttl { color:#9fe0ff; font-size:14px; font-weight:700; }
  .bar .spacer { flex:1; }
  .screen { background:#060a10; padding:16px 18px 12px; border-bottom:1px solid #1c2a38; }
  .expr { font-size:14px; color:#5b7a99; min-height:20px; word-break:break-all; text-align:right; }
  .out { font-size:14px; font-weight:700; color:#9fe0ff; text-align:right; word-break:break-all; min-height:48px; margin-top:4px; }
  .out.err { color:#ff6b6b; font-size:12px; }
  .pad { flex:1 1 auto; display:grid; gap:7px; padding:10px; overflow:auto; }
  .row { display:grid; gap:7px; }
  button {
    padding:14px 4px; font-size:11px; font-weight:600; color:#cfe9ff;
    background:#16273a; border:1px solid #24384c; border-radius:12px;
    cursor:pointer; font-family:inherit; transition:.1s; white-space:nowrap;
  }
  button:active { transform:scale(.94); background:#1e3a52; }
  button.op { color:#ffd479; background:#1c2a1e; border-color:#34502e; }
  button.eq { background:linear-gradient(160deg,#2e6ea8,#1b4670); color:#fff; border-color:#4d8fc9; font-size:12px; }
  button.fn { color:#a3c8ff; font-size:14px; background:#111d28; }
  button.ac { color:#ff8fa3; }
  .ver { position:absolute; bottom:4px; right:10px; font-size:10px; color:#2b3f52; }
</style>
</head>
<body>
<div id="wrap">
  <div class="bar"><a class="back" href="../">← 回工具区</a><span class="ttl">🧮 科学计算器</span><span class="spacer"></span></div>
  <div class="screen">
    <div class="expr" id="expr"></div>
    <div class="out" id="out">0</div>
  </div>
  <div class="pad" id="pad"></div>
  <div class="ver">v3-补回标题与返回键 20261016</div>
</div>
<script>
(function(){
  'use strict';
  // 依据：基础数学函数定义（三角函数/对数/幂/开方）；角度-弧度换算 π/180。
  var exprEl=document.getElementById('expr'), outEl=document.getElementById('out');
  var expr='';       // 表达式（用可读符号）
  var DEG=true;      // 角度/弧度

  // 按钮布局：{t:显示, v:插入/动作, c:样式}
  var LAYOUT=[
    [ {t:'DEG',a:'deg',c:'fn'},{t:'sin',v:'sin(',c:'fn'},{t:'cos',v:'cos(',c:'fn'},{t:'tan',v:'tan(',c:'fn'},{t:'π',v:'π',c:'fn'} ],
    [ {t:'asin',v:'asin(',c:'fn'},{t:'acos',v:'acos(',c:'fn'},{t:'atan',v:'atan(',c:'fn'},{t:'ln',v:'ln(',c:'fn'},{t:'e',v:'e',c:'fn'} ],
    [ {t:'(',v:'(',c:'fn'},{t:')',v:')',c:'fn'},{t:'√',v:'√(',c:'fn'},{t:'x²',v:'^2',c:'fn'},{t:'xʸ',v:'^',c:'fn'} ],
    [ {t:'7',v:'7'},{t:'8',v:'8'},{t:'9',v:'9'},{t:'÷',v:'÷',c:'op'},{t:'AC',a:'ac',c:'ac'} ],
    [ {t:'4',v:'4'},{t:'5',v:'5'},{t:'6',v:'6'},{t:'×',v:'×',c:'op'},{t:'⌫',a:'del',c:'ac'} ],
    [ {t:'1',v:'1'},{t:'2',v:'2'},{t:'3',v:'3'},{t:'−',v:'-',c:'op'},{t:'log',v:'log(',c:'fn'} ],
    [ {t:'0',v:'0'},{t:'.',v:'.'},{t:'%',v:'%',c:'op'},{t:'+',v:'+',c:'op'},{t:'=',a:'eq',c:'eq'} ]
  ];

  function build(){
    var pad=document.getElementById('pad');
    pad.innerHTML='';
    LAYOUT.forEach(function(row){
      var rd=document.createElement('div');
      rd.className='row';
      rd.style.gridTemplateColumns='repeat('+row.length+',1fr)';
      row.forEach(function(b){
        var el=document.createElement('button');
        el.textContent=b.t; if(b.c) el.className=b.c;
        el.onclick=function(){ press(b); };
        rd.appendChild(el);
      });
      pad.appendChild(rd);
    });
  }

  function press(b){
    if(b.a==='ac'){ expr=''; outEl.textContent='0'; outEl.classList.remove('err'); exprEl.textContent=''; return; }
    if(b.a==='del'){ expr=expr.slice(0,-1); exprEl.textContent=expr; return; }
    if(b.a==='deg'){ DEG=!DEG; this && 0; updateDegBtn(); return; }
    if(b.a==='eq'){ evaluate(); return; }
    if(b.v!==undefined){ expr+=b.v; exprEl.textContent=expr; }
  }

  function updateDegBtn(){
    document.querySelectorAll('.pad button').forEach(function(x){
      if(x.textContent==='DEG') x.textContent = DEG?'DEG':'RAD';
    });
  }

  // 数值格式化：防超长甩科学计数法 + 防静默丢精度
  function fmt(val){
    var HALF=2.220446049250313e-16;
    // 极小/极大：保留科学计数法（否则字符串长得离谱）
    var a=Math.abs(val);
    if(a!==0 && (a<1e-9 || a>=1e21)){
      return val.toExponential(10).replace(/\.?0+e/,'e');
    }
    // 整数
    if(Number.isInteger(val)){
      if(Number.isSafeInteger(val)) return String(val);
      // 超出安全整数：尽力打印完整位数，并标注不精确
      return val.toFixed(0)+' (近似)';
    }
    // 小数：修掉浮点尾差（0.1+0.2）
    var r=Math.round(val*1e12)/1e12;
    if(Number.isInteger(r)) return String(r);
    var str=r.toFixed(12).replace(/0+$/,'').replace(/\.$/,'');
    return str;
  }

  // 求值：把可读表达式转成 JS 可算的
  function evaluate(){
    var e=expr;
    if(!e){ return; }
    try{
      var js=e
        .replace(/π/g,'(Math.PI)')
        .replace(/e(?![a-z])/g,'(Math.E)')
        .replace(/√/g,'Math.sqrt')
        .replace(/×/g,'*').replace(/÷/g,'/')
        .replace(/\^/g,'**')
        .replace(/%/g,'/100');
      // 函数包装
      js=js.replace(/\bsin\(/g,'__sin(').replace(/\bcos\(/g,'__cos(').replace(/\btan\(/g,'__tan(')
           .replace(/\basin\(/g,'__asin(').replace(/\bacos\(/g,'__acos(').replace(/\batan\(/g,'__atan(')
           .replace(/\blog\(/g,'Math.log10(').replace(/\bln\(/g,'Math.log(');
      var fn={
        __sin:function(x){return Math.sin(DEG?x*Math.PI/180:x);},
        __cos:function(x){return Math.cos(DEG?x*Math.PI/180:x);},
        __tan:function(x){return Math.tan(DEG?x*Math.PI/180:x);},
        __asin:function(x){var r=Math.asin(x);return DEG?r*180/Math.PI:r;},
        __acos:function(x){var r=Math.acos(x);return DEG?r*180/Math.PI:r;},
        __atan:function(x){var r=Math.atan(x);return DEG?r*180/Math.PI:r;},
        Math:Math
      };
      // 用 Function 求值（表达式由本页按钮拼出，无外部输入，安全）
      var val=Function.apply(null,Object.keys(fn).concat('return ('+js+');')).apply(null,Object.values(fn));
      if(typeof val!=='number' || !isFinite(val)){ throw new Error('non-finite'); }
      var s=fmt(val);
      outEl.textContent=s;
      outEl.classList.remove('err');
      exprEl.textContent=e+' =';
      // 只有普通十进制数字才回填继续算；科学计数法（含e）回填会污染表达式
      expr=/^-?\d+(\.\d+)?$/.test(s)?s:'';
    }catch(err){
      outEl.textContent='格式错误';
      outEl.classList.add('err');
    }
  }

  // 键盘支持
  document.addEventListener('keydown',function(ev){
    var k=ev.key;
    if(/[0-9.]/.test(k)){ expr+=k; }
    else if(k==='+'){ expr+='+'; }
    else if(k==='-'){ expr+='-'; }
    else if(k==='*'){ expr+='×'; }
    else if(k==='/'){ ev.preventDefault(); expr+='÷'; }
    else if(k==='('||k===')'){ expr+=k; }
    else if(k==='^'){ expr+='^'; }
    else if(k==='Enter'||k==='='){ ev.preventDefault(); evaluate(); return; }
    else if(k==='Backspace'){ expr=expr.slice(0,-1); }
    else if(k==='Escape'){ expr=''; outEl.textContent='0'; exprEl.textContent=''; }
    else return;
    exprEl.textContent=expr;
  });

  build();
})();
</script>
</body>
</html>
