<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✝️ 东正教历</title>
<link rel="stylesheet" href="../../assets/themes/skins.css">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body { min-height:100%; background:var(--bg); }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text);
    padding:6px 6px 12px; user-select:none; display:flex; justify-content:center; position:relative; }
  #wrap { width:100%; max-width:520px; position:relative; z-index:1; }
  h1 { font-size:12px; color:var(--accent); margin-bottom:4px; text-align:center; letter-spacing:3px;
    text-shadow:0 0 18px rgba(212,175,55,.32); }
  .sub { color:var(--text-mute); font-size:12px; margin-bottom:16px; text-align:center; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
  .card h3 { font-size:14px; color:var(--text-dim); margin-bottom:10px; font-weight:700; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:14px; border-bottom:1px solid var(--border); }
  .row:last-child { border-bottom:none; }
  .k { color:var(--text-mute); } .v { color:var(--text); font-weight:600; }
  .big { font-size:12px; font-weight:800; color:var(--accent); letter-spacing:1px; }
  button { padding:11px; font-size:14px; font-weight:700; color:var(--text); background:rgba(0,0,0,.25);
    border:1px solid var(--border); border-radius:10px; cursor:pointer; font-family:inherit; }
  button:active { transform:scale(.96); }
  button.go { background:linear-gradient(160deg,#1e3a8a,#12244e); color:#fff; border-color:#4d7ac9; }
  input[type=date] { width:100%; background:rgba(0,0,0,.3); border:1px solid var(--border); border-radius:9px; padding:10px;
    font-size:15px; color:var(--text); outline:none; font-family:inherit; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; }
  .tabs button.on { background:#1e3a8a; border-color:#4d7ac9; color:#fff; }
  .hint { color:var(--text-mute); font-size:11px; margin-top:6px; line-height:1.7; }
  .ver { color:var(--text-mute); font-size:10px; margin-top:10px; text-align:center; opacity:.6; }
  .err { color:#ff9f9f; font-size:13px; padding:8px 0; }
</style>
</head>
<body class="theme-orthodox">
<div id="wrap">
  <h1>✝️ 东 正 教 历</h1>
  <div class="sub">儒略历（旧历）· 公历换算 · 复活节算法</div>

  <div class="tabs">
    <button id="tabG2J" class="on">公历 → 旧历</button>
    <button id="tabEaster">复活节</button>
  </div>

  <div id="panelG2J">
    <div class="card">
      <h3>选一个公历日期</h3>
      <input type="date" id="gDate">
      <div style="display:flex;gap:8px;margin-top:10px">
        <button id="todayBtn" style="flex:1" class="go">📍 今天</button>
        <button id="convBtn" style="flex:1" class="go">换算 →</button>
      </div>
    </div>
    <div id="result"></div>
  </div>

  <div id="panelEaster" style="display:none">
    <div class="card">
      <h3>查某一年的复活节</h3>
      <div style="display:flex;gap:8px">
        <input type="date" id="eastDate">
      </div>
      <div style="margin-top:10px">
        <button id="eastBtn" class="go" style="width:100%">查复活节 →</button>
      </div>
      <div class="hint">东正教复活节（儒略历计算）通常比天主教/新教晚 1~5 周。</div>
    </div>
    <div id="easterResult"></div>
  </div>

  <div class="hint" style="text-align:center;margin-top:14px">
    儒略历（旧历）· 复活节 = Meeus 算法 · 纯数学零依赖<br>
    历史文化参考 · 非科学预测
  </div>
  <div class="ver">v1.0.0-东正教历 20261016</div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  function pad(n){ return String(n).padStart(2,'0'); }

  // ---------- 儒略历 ⇄ 儒略日 ----------
  function gregToJDN(y,m,d){
    var a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;
    var g=(y>1582)||(y===1582&&(m>10||(m===10&&d>=15)));
    return g ? (d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045)
             : (d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-32083);
  }
  function julianToJDN(y,m,d){
    var a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;
    return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-32083;
  }
  function jdnToJulian(jdn){
    var c=jdn+32082;
    var d=Math.floor((4*c+3)/1461);
    var e=c-Math.floor((1461*d)/4);
    var m=Math.floor((5*e+2)/153);
    var day=e-Math.floor((153*m+2)/5)+1;
    var month=m+3-12*Math.floor(m/10);
    var year=d-4800+Math.floor(m/10);
    return {year:year,month:month,day:day};
  }

  // ---------- Meeus 儒略历复活节算法 ----------
  // 返回儒略历日期 {month, day}（东正教按其计算，再加偏移转公历）
  function orthodoxEasterJulian(year){
    var a = year % 4;
    var b = year % 7;
    var c = year % 19;
    var d = (19*c + 15) % 30;
    var e = (2*a + 4*b - d + 34) % 7;
    var month = Math.floor((d + e + 114) / 31);
    var day = ((d + e + 114) % 31) + 1;
    // 该月为儒略历的月份
    return {month: month, day: day};
  }

  // 儒略历日期 → 公历日期（按实际天文对应）
  function julianToGregorian(jy, jm, jd){
    var jdn = julianToJDN(jy, jm, jd);
    // JDN → 公历
    var a = jdn + 32044;
    var b = Math.floor((4*a+3)/146097);
    var c = a - Math.floor((146097*b)/4);
    var d2 = Math.floor((4*c+3)/1461);
    var e = c - Math.floor((1461*d2)/4);
    var m = Math.floor((5*e+2)/153);
    var day = e - Math.floor((153*m+2)/5) + 1;
    var month = m + 3 - 12*Math.floor(m/10);
    var year = 100*b + d2 - 4800 + Math.floor(m/10);
    return {year:year, month:month, day:day};
  }

  // 公历 → 儒略历（旧历）
  function gregToJulian(y,m,d){
    var jdn = gregToJDN(y,m,d);
    return jdnToJulian(jdn);
  }

  // ---------- 渲染 ----------
  function renderG2J(gy,gm,gd){
    var j = gregToJulian(gy,gm,gd);
    // 计算新旧历差：同一个“年月日”，按儒略历算 vs 按公历算，差值即新旧历偏移
    // 例：2026-10-16，儒略JDN比公历JDN小13天 → 旧历比公历慢13天
    var dayDiff = gregToJDN(gy,gm,gd) - julianToJDN(gy,gm,gd);

    var h = '';
    h += '<div class="card"><h3>📅 公历</h3>';
    h += '<div class="row"><span class="k">公历（格里高利历）</span><span class="v">'+gy+' 年 '+gm+' 月 '+gd+' 日</span></div>';
    h += '</div>';
    h += '<div class="card"><h3>✝️ 东正教历（儒略历·旧历）</h3>';
    h += '<div class="row"><span class="k">旧历日期</span><span class="v big">'+j.year+' 年 '+j.month+' 月 '+j.day+' 日</span></div>';
    h += '<div class="row"><span class="k">新旧历差</span><span class="v">'+dayDiff+' 天</span></div>';
    h += '</div>';

    h += '<div class="card"><h3>🎄 著名对应</h3><div style="font-size:13px;color:#9fb0d8;line-height:1.8">';
    h += '<p><b>圣诞节</b>：公历 <b>1 月 7 日</b> = 东正教历 <b>12 月 25 日</b>（俄罗斯、塞尔维亚等东正教国家过这一天）。</p>';
    h += '<p>东正教用的是<b>儒略历</b>（旧历），比我们日常用的公历（格里高利历）<b>慢若干天</b>——这个差值是<b>随世纪变化</b>的。</p>';
    h += '</div></div>';

    h += '<div class="card"><h3>💡 白话解读</h3><div style="font-size:13px;color:#9fb0d8;line-height:1.8">';
    h += '<p><b>· 什么是旧历</b>：1582 年天主教改用了更准的"格里高利历"（公历），但<b>东正教没改</b>，一直沿用老的"儒略历"。</p>';
    h += '<p><b>· 差多少天</b>：目前（1900–2099 年）儒略历比公历<b>慢 13 天</b>；<b>每过一个世纪，差值会变</b>（2100 年后变 14 天）。</p>';
    h += '<p><b>· 为什么重要</b>：东正教的圣诞节、复活节都按旧历算，所以跟西方教会常常<b>不在同一天</b>。</p>';
    h += '<p style="color:#5b6a99;font-size:12px;margin-top:6px">※ 本工具用纯数学换算（儒略历 ⇄ 儒略日），新旧历差值按实际世纪自动计算，不写死 13。</p>';
    h += '</div></div>';
    $('result').innerHTML = h;
  }

  function renderEaster(gy){
    var je = orthodoxEasterJulian(gy);   // 儒略历复活节
    var ge = julianToGregorian(gy, je.month, je.day);  // 转公历
    // 天主教/新教复活节（格里高利历版 Meeus）对照
    var cath = catholicEaster(gy);

    var h = '';
    h += '<div class="card"><h3>✝️ '+gy+' 年 复活节</h3>';
    h += '<div class="row"><span class="k">东正教复活节（公历）</span><span class="v big">'+ge.year+' 年 '+ge.month+' 月 '+ge.day+' 日</span></div>';
    h += '<div class="row"><span class="k">（旧历）</span><span class="v">'+gy+' 年 '+je.month+' 月 '+je.day+' 日</span></div>';
    h += '<div class="row"><span class="k">天主教/新教复活节</span><span class="v">'+(cath? cath.year+' 年 '+cath.month+' 月 '+cath.day+' 日':'—')+'</span></div>';
    if(cath){
      var dOrth = new Date(ge.year, ge.month-1, ge.day);
      var dCath = new Date(cath.year, cath.month-1, cath.day);
      var days = Math.round((dOrth - dCath)/86400000);
      h += '<div class="row"><span class="k">相差</span><span class="v">'+(days>0?'东正教晚 '+days+' 天':days<0?'东正教早 '+(-days)+' 天':'同一天')+'</span></div>';
    }
    h += '</div>';
    h += '<div class="card"><h3>💡 说明</h3><div style="font-size:13px;color:#9fb0d8;line-height:1.8">';
    h += '<p><b>东正教复活节</b>按儒略历计算，并且规定<b>必须在犹太逾越节之后</b>，所以通常比天主教/新教晚 1~5 周。</p>';
    h += '<p style="color:#5b6a99;font-size:12px;margin-top:6px">※ 复活节采用 Meeus 算法（儒略历版）。历史文化参考。</p>';
    h += '</div></div>';
    $('easterResult').innerHTML = h;
  }

  // 天主教复活节（格里高利历 Meeus 算法，用于对照）
  function catholicEaster(year){
    var a=year%19, b=Math.floor(year/100), c=year%100;
    var d=Math.floor(b/4), e=b%4;
    var f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3);
    var h=(19*a+b-d-g+15)%30;
    var i=Math.floor(c/4), k=c%4;
    var l=(32+2*e+2*i-h-k)%7;
    var m=Math.floor((a+11*h+22*l)/451);
    var month=Math.floor((h+l-7*m+114)/31);
    var day=((h+l-7*m+114)%31)+1;
    return {year:year, month:month, day:day};
  }

  function convertG2J(){
    var v=$('gDate').value;
    if(!v){ $('result').innerHTML='<div class="err">请选一个公历日期</div>'; return; }
    var p=v.split('-').map(Number);
    renderG2J(p[0],p[1],p[2]);
  }
  function doEaster(){
    var v=$('eastDate').value;
    if(!v){ $('easterResult').innerHTML='<div class="err">请选一个日期（取其中年份）</div>'; return; }
    var y=Number(v.split('-')[0]);
    renderEaster(y);
  }

  var now=new Date();
  $('gDate').value=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  $('eastDate').value=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  $('todayBtn').addEventListener('click',function(){var n=new Date();$('gDate').value=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate());convertG2J();});
  $('convBtn').addEventListener('click',convertG2J);
  $('gDate').addEventListener('change',convertG2J);
  $('eastBtn').addEventListener('click',doEaster);
  $('tabG2J').addEventListener('click',function(){$('tabG2J').classList.add('on');$('tabEaster').classList.remove('on');$('panelG2J').style.display='';$('panelEaster').style.display='none';});
  $('tabEaster').addEventListener('click',function(){$('tabEaster').classList.add('on');$('tabG2J').classList.remove('on');$('panelEaster').style.display='';$('panelG2J').style.display='none';});

  convertG2J();
})();
</script>
</body>
</html>
