<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 智能图表</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(120% 90% at 50% 0%, #14283a 0%, #0a1622 55%, #060a10 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #dbeafe; padding: 16px 12px 40px;
  }
  .back { display:inline-block; text-decoration:none; color:#6b8fb3; font-size:10px; margin-bottom:8px;
    padding:6px 12px; border:1px solid #22384c; border-radius:20px; }
  h1 { font-size:14px; text-align:center; color:#8fe0c0; font-weight:700; letter-spacing:2px; margin:4px 0 4px; }
  .sub { text-align:center; color:#5b7a99; font-size:10px; margin-bottom:12px; line-height:1.7; }
  .wrap { max-width: 880px; margin: 0 auto; }

  #drop {
    border: 2px dashed #2e6a5e; border-radius: 14px; padding: 26px 16px; text-align: center;
    background: linear-gradient(160deg,#123040,#0b1c28); cursor: pointer; transition: .18s;
  }
  #drop.drag { border-color:#6fe0b0; background:#163d4a; }
  #drop .big { font-size: 30px; display:block; margin-bottom:8px; }
  #drop .t1 { font-size: 13px; color:#8fe0c0; font-weight:700; }
  #drop .t2 { font-size: 10.5px; color:#6b9f93; margin-top:6px; }

  .panel { background:#0d1c26; border:1px solid #22384c; border-radius:12px; padding:12px; margin-top:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .row + .row { margin-top:10px; }
  label { font-size:11px; color:#7fa8c8; }
  select, input[type=text] {
    background:#122430; border:1px solid #2a4a5e; color:#dbeafe; border-radius:8px;
    padding:7px 9px; font-size:12px; outline:none; min-width:110px;
  }
  select:focus, input[type=text]:focus { border-color:#4a9a80; }
  button {
    background: linear-gradient(160deg,#1d6a54,#0e3a2c); border:1px solid #2e8a6a; color:#c8f5e0;
    border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #chart { width:100%; height:430px; margin-top:12px; background:#0b1620; border-radius:12px; border:1px solid #1e3444; }
  #msg { font-size:11px; color:#6b9f93; margin-top:8px; line-height:1.6; min-height:16px; }
  #msg.err { color:#ff9a9a; }
  #info { font-size:10.5px; color:#5b7a99; margin-top:8px; line-height:1.7; }
  #info b { color:#8fe0c0; }
  .foot { text-align:center; color:#2f4a52; font-size:10px; margin-top:26px; line-height:1.9; }
  .ver { text-align:center; color:#22383c; font-size:10px; margin-top:8px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 回工具区</a>
  <h1>📊 智能图表</h1>
  <div class="sub">拖个表格进来，直接出图 · 数据不出浏览器，不联网</div>

  <div id="drop">
    <span class="big">📂</span>
    <span class="t1">点这里选文件，或把表格拖进来</span>
    <span class="t2">支持 CSV / TSV / Excel(xlsx, xls) / JSON / TXT</span>
    <input type="file" id="file" accept=".csv,.tsv,.txt,.xlsx,.xls,.json" class="hidden">
  </div>

  <div class="panel hidden" id="panel">
    <div class="row">
      <label>图表类型</label>
      <select id="ctype"></select>
      <label>主题</label>
      <select id="theme">
        <option value="default">默认</option>
        <option value="classic">经典</option>
        <option value="dark">深色</option>
      </select>
    </div>
    <div class="row">
      <label>分类列</label>
      <select id="xcol"></select>
      <label>数值列</label>
      <select id="ycol" multiple size="1" style="min-width:140px"></select>
      <label>标题</label>
      <input type="text" id="title" placeholder="可不填">
    </div>
    <div class="row">
      <button id="draw">画图</button>
      <button id="save">保存图片</button>
      <button id="again">换个文件</button>
    </div>
    <div id="msg"></div>
  </div>

  <div id="chart" class="hidden"></div>
  <div id="info" class="hidden"></div>

  <div class="foot">🐳 大肥鱼出品 · 数据只在你的浏览器里流转</div>
  <div class="ver">v1.0.0-首版 20261019</div>
</div>

<script src="assets/echarts.min.js"></script>
<script src="assets/echarts-wordcloud.min.js"></script>
<script src="assets/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
