<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🃏 塔罗牌</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body { min-height:100%; background:#0d0a14; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",serif; color:#e8d8f0;
    padding:16px 12px 40px; user-select:none; display:flex; justify-content:center; }
  #wrap { width:100%; max-width:560px; }
  h1 { font-size:12px; text-align:center; color:#c9a0ff; margin-bottom:4px; letter-spacing:3px; }
  .sub { text-align:center; color:#8a7399; font-size:12px; margin-bottom:16px; line-height:1.6; }
  .card { background:linear-gradient(160deg,#251a38,#171024); border:1px solid #4a3a6a;
    border-radius:12px; padding:14px; margin-bottom:11px; }
  .card h3 { font-size:13px; color:#b090e0; margin-bottom:10px; border-left:3px solid #b090e0; padding-left:8px; }
  button.go { width:100%; padding:14px; font-size:11px; font-weight:700; color:#1a1024;
    background:linear-gradient(160deg,#c9a0ff,#9060d0); border:none; border-radius:11px;
    cursor:pointer; font-family:inherit; letter-spacing:2px; }
  button.go:active { transform:scale(.98); }
  .modes { display:flex; gap:8px; margin-bottom:10px; }
  .modes button { flex:1; padding:9px; font-size:13px; background:#1a1228; color:#b090e0;
    border:1px solid #4a3a6a; border-radius:9px; cursor:pointer; font-family:inherit; }
  .modes button.active { background:#33244a; color:#e0c0ff; border-color:#9060d0; }
  .cards { display:flex; justify-content:center; gap:12px; margin:14px 0; flex-wrap:wrap; }
  .tcard { width:96px; height:160px; border-radius:10px; perspective:600px; cursor:pointer; }
  .tcard .inner { width:100%; height:100%; position:relative; transition:transform .5s;
    transform-style:preserve-3d; }
  .tcard.flipped .inner { transform:rotateY(180deg); }
  .tcard .face { position:absolute; inset:0; border-radius:10px; backface-visibility:hidden;
    display:flex; align-items:center; justify-content:center; text-align:center; }
  .tcard .back { background:repeating-linear-gradient(45deg,#3a2a5a,#3a2a5a 6px,#2a1e44 6px,#2a1e44 12px);
    border:2px solid #6a4aa0; color:#c9a0ff; font-size:14px; }
  .tcard .front { background:linear-gradient(160deg,#2a1e44,#1a1230); border:2px solid #9060d0;
    transform:rotateY(180deg); flex-direction:column; padding:8px; }
  .tcard .front .nm { font-size:14px; color:#e0c0ff; font-weight:700; margin-bottom:4px; }
  .tcard .front .ic { font-size:14px; margin:4px 0; }
  .tcard .front .pos { font-size:11px; color:#b090e0; }
  .tcard .front.rev .pos { color:#e08080; }
  .sect { color:#b090e0; font-size:14px; font-weight:700; margin:14px 0 8px; }
  .interp { background:#1a1228; border:1px solid #4a3a6a; border-radius:10px; padding:12px 14px;
    font-size:13px; line-height:1.8; color:#c8b8e0; }
  .interp b { color:#d0b0ff; }
  .interp ul { margin:0 0 8px; padding-left:18px; }
  .interp li { margin-bottom:5px; color:#b8a8d0; }
  .interp .disclaim { color:#ffb3c1; background:#2a0f1a; border:1px solid #5a2a3a; border-radius:8px; padding:8px 10px; font-size:11.5px; margin-bottom:8px; }
  .interp .note { color:#8a7399; font-size:11px; margin-top:6px; }
  .hint { text-align:center; color:#5a4a70; font-size:11px; margin-top:10px; line-height:1.7; }
  .ver { text-align:center; color:#3a2e4c; font-size:10px; margin-top:8px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🃏 塔 罗 牌</h1>
  <div class="sub">静心默想你的问题 · 抽牌<br>纯本地随机 · 无网络</div>

  <div class="card">
    <h3>选择牌阵</h3>
    <div class="modes">
      <button data-n="1" class="active">单张（每日指引）</button>
      <button data-n="3">三张（过去/现在/未来）</button>
    </div>
    <button class="go" id="draw">洗 牌 抽 牌</button>
  </div>

  <div id="result"></div>

  <div class="hint">塔罗为西洋神秘学文化，属娱乐参考，非科学预测 🐳<br>请勿据此做重大决定</div>
  <div class="ver">v5-正统牌库 20261016</div>
</div>

    // ── 权杖 Wands（火：行动、热情、事业）──
    '权杖A':['一个新起点、灵感进发、潜能与行动力','拖延、缺乏动力、计划流产'],

    '权杖3':['拓展视野、初步成果、等待回报','延误、短视、外部阻碍'],
    '权杖4':['庆祝、稳定、和谐的家庭与阶段达成','缺乏安全感、过渡期、表面和谐'],

    '权杖6':['胜利、认可、凯旋归来','骄傲自满、认可延迟、虚名'],
    '权杖7':['坚守立场、捍卫成果、以寡敌众','力不从心、放弃抵抗、疲于应付'],

    '圣杯A':['情感新起点、真爱降临、内心的喜悦','情感阻塞、空虚、爱意枯竭'],
    '圣杯2':['结合、伙伴、彼此吸引与互信','关系失衡、分手、误解'],
    '圣杯3':['共庆、友谊、团聚、社群','孤立、三角关系、过度放纵'],
    '圣杯4':['厌倦、冷漠、错失眼前的机会','觉醒、抓住机会、走出困局'],
    '圣杯5':['失落、哀伤、专注于损失','释怀、接受、重拾余下的美好'],
    '圣杯6':['怀旧、纯真、旧日情谊、馈赠','沉溺过去、无法前行、成长阵痛'],
    '圣杯7':['幻想、抉择繁多、不切实际的选择','看清现实、定心、过滤干扰'],
    '圣杯8':['离开、追寻更深的意义、放手','恐惧改变、原地徘徊、无法割舍'],
    '圣杯9':['心愿达成、满足、情感丰盈','沾沾自喜、贪求、满足表象下空虚'],
    '圣杯10':['圆满的情感、家庭幸福、和谐','关系裂痕、理想幻灭、家不和'],
    '圣杯侍从':['感性、灵感、好消息、初萌的情意','情绪化、逃避现实、多愁善感'],
    '圣杯骑士':['浪漫、追求、理想主义的行动','善变、空头承诺、情绪驱动'],

  function buildDeck(){
    var deck=[];
    MAJOR.forEach(function(c){ deck.push({type:'major', id:c[0], name:c[1], icon:c[2], up:c[3], rev:c[4]}); });
    SUITS.forEach(function(s){
      RANKS.forEach(function(r){
        var nm=s[0]+r;
        var m=MINOR[nm]||['',''];
        deck.push({type:'minor', name:nm, icon:s[1], suit:s[0], rank:r,
          up:m[0], rev:m[1]});
      });
    });
    return deck; // 78 张
  }

  var mode=1;
  document.querySelectorAll('.modes button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.modes button').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active'); mode=parseInt(b.dataset.n,10);
    });
  });

  // 2026-10-16 改用真随机源 crypto.getRandomValues（操作系统熵池），老浏览器回退 Math.random
  // ⚠️ 只改本页随机源，不动其他逻辑！
  function secureRand(){
    if(window.crypto && window.crypto.getRandomValues){
      var a=new Uint32Array(1); window.crypto.getRandomValues(a);
      return a[0]/4294967296; // [0,1)
    }
    return Math.random();
  }
  // 2026-10-16 趣味彩蛋：会话内连10次一模一样 → 弹窗（纯内存，不存储）
  // ⚠️ 只改本页展示逻辑，不动其他逻辑！
  var _eggStreak={sig:'',n:0};
  function streakCheck(sig){
    if(_eggStreak.sig===sig){ _eggStreak.n++; } else { _eggStreak.sig=sig; _eggStreak.n=1; }
    return _eggStreak.n===10 ? '你的运气过于奇特' : '';
  }
  function showEgg(msg){
    setTimeout(function(){
      var mask=document.createElement('div');
      mask.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:pointer';
      mask.innerHTML='<div style="background:#2a2030;border:1px solid #6a4a7a;border-radius:14px;padding:26px 30px;text-align:center;max-width:80%"><div style="font-size:12px;font-weight:700;color:#c0a0f0;margin-bottom:10px">'+msg+'</div><div style="font-size:13px;color:#a090b0;margin-bottom:16px">连抽 10 次一模一样的签，天意难测啊 🌀</div><div style="font-size:12px;color:#807090">（点任意处关闭）</div></div>';
      mask.onclick=function(){ mask.remove(); };
      document.body.appendChild(mask);
    }, 400);
  }
  function drawCards(n){
    var deck=buildDeck();
    // Fisher-Yates
    for(var i=deck.length-1;i>0;i--){ var j=Math.floor(secureRand()*(i+1)); var t=deck[i];deck[i]=deck[j];deck[j]=t; }
    return deck.slice(0,n).map(function(c){ return {card:c, reversed:secureRand()<0.5}; });
  }

  function calc(){
    var n=mode;
    var picked=drawCards(n);
    var res=document.getElementById('result');
    var h='<div class="card"><h3>你的牌</h3><div class="cards">';
    picked.forEach(function(p,i){
      var c=p.card;
      h+='<div class="tcard" data-i="'+i+'"><div class="inner">';
      h+='<div class="face back">✦</div>';
      h+='<div class="face front'+(p.reversed?' rev':'')+'">';
      h+='<div class="ic">'+c.icon+'</div>';
      h+='<div class="nm">'+c.name+'</div>';
      h+='<div class="pos">'+(p.reversed?'逆位':'正位')+'</div>';
      h+='</div></div></div>';
    });
    h+='</div><div style="text-align:center;color:#8a7399;font-size:11px">点击牌面翻开</div></div>';

    // 解读（2026-10-16 改为「全翻完才显示」，防剧透：未翻牌时先藏起来）
    h+='<div id="interpBox" style="display:none">';
    h+='<div class="sect">📖 解读</div><div class="interp">';
    h+='<div class="disclaim">⚠️ 塔罗属西洋神秘学文化，以下为传统牌义，非科学预测，仅供娱乐参考。</div>';
    var labels = n===1?['今日指引']:['过去','现在','未来'];
    picked.forEach(function(p,i){
      var c=p.card;
      h+='<p><b>'+labels[i]+'：'+c.name+'（'+(p.reversed?'逆位':'正位')+'）</b></p>';
      h+='<ul><li>'+(p.reversed? c.rev : c.up)+'</li></ul>';
    });
    h+='<p class="note">塔罗是象征性的自省工具，解读因人而异；请当娱乐与思考引子，勿作命运断言。</p>';
    h+='</div></div>';
    // 未翻牌时的遮罩提示（翻完后隐藏）
    h+='<div id="interpLock" class="interp" style="text-align:center;color:#8a7399">🔒 翻开全部牌面后，显示解读</div>';

    // 2026-10-16 趣味彩蛋：会话内连10次抽到一模一样的牌 → 弹窗（纯内存，不存储）
    var _sig=picked.map(function(p){return p.card.name+(p.reversed?'R':'U');}).join('|');
    var blow=streakCheck(_sig);
    if(blow) showEgg(blow);

    res.innerHTML=h;
    // 点击翻牌
    res.querySelectorAll('.tcard').forEach(function(el){
      el.addEventListener('click',function(){ el.classList.toggle('flipped'); checkReveal(); });
    });
    // 2026-10-16 全翻完才显示解读（防剧透）
    function checkReveal(){
      var all=res.querySelectorAll('.tcard');
      var flipped=res.querySelectorAll('.tcard.flipped');
      var box=document.getElementById('interpBox'), lock=document.getElementById('interpLock');
      if(all.length>0 && flipped.length===all.length){ if(box)box.style.display=''; if(lock)lock.style.display='none'; }
      else { if(box)box.style.display='none'; if(lock)lock.style.display=''; }
    }
    // 2026-10-16 改为纯手动翻牌：移除原「延迟 500ms 自动翻开」，抽牌后需手动点牌才翻（老爹指定）
  }

  document.getElementById('draw').addEventListener('click',calc);
  calc();
})();
</script>
</body>
</html>
