<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎬 视频剪辑 · 选版本</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(160deg, #0a1628 0%, #123 60%, #0a1f33 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #dbeafe; padding: 14px 10px 24px; user-select: none;
  }
  h1 { font-size: 21px; text-align: center; color: #8fd0ff; font-weight: 700; letter-spacing: 2px; margin: 8px 0 4px; }
  .sub { text-align: center; color: #5b7a99; font-size: 12px; margin-bottom: 18px; line-height: 1.6; }
  .wrap { max-width: 640px; margin: 0 auto; }
  a.card {
    display: block; text-decoration: none; color: inherit; position: relative;
    background: linear-gradient(160deg, #16304a, #0f2233);
    border: 1px solid #2e5f8e; border-radius: 14px;
    padding: 16px 16px 15px; margin-bottom: 14px; transition: .18s;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  a.card:active { transform: scale(.98); background: #1c3d5a; }
  .card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card .icon { font-size: 24px; line-height: 1; }
  .card .title { font-size: 17px; font-weight: 700; color: #9fd8ff; }
  .card .tag { font-size: 10px; color: #0a1628; background: #8fd0ff; border-radius: 6px; padding: 1px 7px; font-weight: 700; margin-left: 4px; }
  .card .tag.simple { background: #7fe0b0; }
  .card .desc { font-size: 12.5px; color: #a8c6e0; line-height: 1.7; margin-bottom: 9px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { font-size: 12px; color: #7da4c4; line-height: 1.85; }
  .card .go { margin-top: 10px; font-size: 12px; color: #8fd0ff; font-weight: 700; }
  .back { display: block; text-align: center; color: #5b7a99; font-size: 12px; margin-top: 16px;
    text-decoration: none; border-top: 1px solid #1a2836; padding-top: 12px; }
  .ver { text-align: center; color: #2e4a63; font-size: 10px; margin-top: 14px; letter-spacing: .5px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🎬 视频剪辑</h1>
    <div class="sub">两个版本都能用，按你的需求挑一个<br>手机、电脑都支持</div>

    <a class="card" href="../video-studio-dist/">
      <div class="head">
        <span class="icon">🎞️</span>
        <span class="title">专业版</span>
        <span class="tag">功能全</span>
      </div>
      <div class="desc">想认真剪片子，做多轨、加字幕、调色、导出成片，选这个。</div>
      <ul>
        <li>多轨编辑 · 可叠画面和声音</li>
        <li>嵌套序列 · 大工程不卡</li>
        <li>字幕、滤镜、调色一整套</li>
        <li>导出后台合成 · 剪的时候界面不卡死</li>
      </ul>
      <div class="go">进入专业版 →</div>
    </a>

    <a class="card" href="../video-simple-dist/">
      <div class="head">
        <span class="icon">✂️</span>
        <span class="title">普通版</span>
        <span class="tag simple">上手快</span>
      </div>
      <div class="desc">就想快速剪一刀、拼个片段、导出来发给别人，选这个。</div>
      <ul>
        <li>界面简单 · 打开就能剪</li>
        <li>裁剪、拼接、导出一步到位</li>
        <li>手机上也顺手</li>
      </ul>
      <div class="go">进入普通版 →</div>
    </a>

    <a class="back" href="../">← 回游戏厅</a>
    <div class="ver">v1.0.0-剪辑选版页 20261104</div>
  </div>
</body>
</html>
