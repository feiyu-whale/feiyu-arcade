<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>医疗 · 🔬 理科</title><style>
:root{--bg:#0b1220;--panel:#111c30;--panel2:#162338;--line:#22314b;
--txt:#e6edf7;--dim:#a9bdd8;--accent:#4aa8ff;--warn:#ffb347;--ok:#3fb27f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.6;
padding:16px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:21px;margin:0 0 5px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:18px}
.crumb{font-size:12px;color:var(--dim);margin-bottom:12px}
.crumb a{color:var(--accent);text-decoration:none}
.crumb a:hover{text-decoration:underline}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}

a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);
border:1px solid var(--line);border-radius:12px;padding:15px 16px;transition:.16s;position:relative;overflow:hidden}
a.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 22px rgba(74,168,255,.18)}
a.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent))}
.card .ico{font-size:24px;line-height:1;margin-bottom:8px;display:block}
.card .nm{font-size:15px;font-weight:700;margin-bottom:3px}
.card .cnt{font-size:11.5px;color:var(--dim)}
.card .tds{font-size:11px;color:#7d92ae;margin-top:7px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:820px){.items{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.items{grid-template-columns:1fr}}
a.item{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;
background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;transition:.14s}
a.item:hover{border-color:var(--accent);background:var(--panel2)}
a.item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
a.item .ok{background:var(--ok)}
a.item .no{background:var(--warn)}
a.item .tx{font-size:12.5px;line-height:1.4}

.legend{font-size:11.5px;color:var(--dim);margin:16px 0 0;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.ver{text-align:right;color:#6f84a2;font-size:11px;margin-top:22px}
.back{display:inline-block;text-decoration:none;color:var(--dim);font-size:12px;
border:1px solid var(--line);border-radius:16px;padding:5px 12px;margin-bottom:14px}
.back:hover{color:var(--txt);border-color:var(--accent)}
</style></head>
<body><div class="wrap"><a class="back" href="../">← 回🔬 理科</a>
<h1>🩺 医疗</h1><div class="sub">🔬 理科 · 共 3 个工具</div>
<div class="items"><a class="item" href="../../../pro-tools/unverified/tpn-osmolarity/"><span class="dot no"></span><span class="tx"> 肠外营养渗透压估算工具</span></a><a class="item" href="../../../pro-tools/unverified/aa-gradient/"><span class="dot no"></span><span class="tx"> 肺泡-动脉氧分压差(A-a Gradient)计算器</span></a><a class="item" href="../../../pro-tools/verified/pet-age/"><span class="dot ok"></span><span class="tx">✅ 宠物年龄</span></a></div>
<div class="legend"><span><i style="background:var(--ok)"></i>已审查</span>
<span><i style="background:var(--warn)"></i>未审查</span></div>
<div class="ver">v1.0.0-三层目录 20261028</div></div></body></html>
