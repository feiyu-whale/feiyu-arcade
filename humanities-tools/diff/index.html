<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔀 文本对比</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body { min-height:100%; background:linear-gradient(160deg,#1a1428 0%,#241a33 55%,#120e1c 100%); }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#e8e0f0;
    padding:6px 6px 12px; display:flex; justify-content:center; user-select:none; }
  #wrap { width:100%; max-width:720px; }
  .back { display:inline-block; text-decoration:none; color:#9a8fc0; font-size:13px; margin-bottom:12px;
    padding:6px 12px; border:1px solid #3a3050; border-radius:20px; }
  h1 { font-size:12px; color:#c8b3ff; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#8a7fb0; font-size:12px; margin-bottom:16px; }
  .card { background:#1c1530; border:1px solid #3a3050; border-radius:12px; padding:14px; margin-bottom:12px; }
  .lbl { font-size:11px; color:#8a7fb0; margin-bottom:9px; letter-spacing:1px; }
  textarea { width:100%; background:#100b1c; border:1px solid #3a3050; border-radius:9px; padding:11px 12px;
    color:#e8e0f0; font-size:13.5px; font-family:inherit; resize:vertical; min-height:90px; line-height:1.7; }
  textarea:focus { outline:none; border-color:#7a5fc0; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .del { background:#5a1f30; color:#ffb3c8; text-decoration:line-through; padding:0 2px; border-radius:3px; }
  .add { background:#1f4a2e; color:#a8f0c0; padding:0 2px; border-radius:3px; }
  .btn { background:linear-gradient(160deg,#5a4a9a,#3a2d70); color:#fff; border:1px solid #7a5fc0;
    border-radius:9px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .diff { font-size:13.5px; line-height:2; word-break:break-word; color:#c8b3ff; }
  .ver { text-align:center; color:#2a2440; font-size:10px; margin-top:22px; }
</style>
</head>
<body>
<div id="wrap">
  <a class="back" href="../">← 回文科专区</a>
  <h1>🔀 文本对比</h1>
  <div class="sub">逐字对比两段文字 · 标出增删</div>

  <div class="card">
    <div class="two">
      <div><div class="lbl">原文 A</div><textarea id="a" placeholder="原版…"></textarea></div>
      <div><div class="lbl">改后 B</div><textarea id="b" placeholder="新版…"></textarea></div>
    </div>
    <div style="margin-top:10px"><button class="btn" id="go">对比</button></div>
  </div>

  <div class="card">
    <div class="lbl">差异（红=删除 · 绿=新增）</div>
    <div class="diff" id="out"></div>
  </div>
  <div class="ver">v1.0.0-文本对比 20261016</div>
</div>
<script>
// 【diff】两段文本逐字对比（LCS diff）。依赖：无（自实现 LCS）。输入：原文A+改后B；输出：红删绿增高亮。
// 本文件为单页工具，IIFE 隔离，无全局污染。
// 依据：LCS（最长公共子序列）逐字 diff 算法；经典文本对比实现，无外部数据。
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  function diffLCS(a, b){
    // 逐字 LCS 表
    var n = a.length, m = b.length;
    // 为控制内存，超过 2000 字用逐行简化
    if(n*m > 4e6){
      return simpleDiff(a, b);
    }
    var dp = [];
    for(var i=0;i<=n;i++){ dp.push(new Uint16Array(m+1)); }
    for(var i=1;i<=n;i++){
      for(var j=1;j<=m;j++){
        if(a[i-1] === b[j-1]) dp[i][j] = dp[i-1][j-1] + 1;
        else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
      }
    }
    // 回溯
    var out = [];
    var i = n, j = m;
    while(i>0 && j>0){
      if(a[i-1] === b[j-1]){ out.unshift(["same", a[i-1]]); i--; j--; }
      else if(dp[i-1][j] >= dp[i][j-1]){ out.unshift(["del", a[i-1]]); i--; }
      else { out.unshift(["add", b[j-1]]); j--; }
    }
    while(i>0){ out.unshift(["del", a[i-1]]); i--; }
    while(j>0){ out.unshift(["add", b[j-1]]); j--; }
    return out;
  }
  function simpleDiff(a,b){
    // 退化：整段标记（超长文本）
    return [["del", a], ["add", b]];
  }

  function esc(s){ return s.replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

  function run(){
    var a = $("a").value, b = $("b").value;
    if(!a && !b){ $("out").innerHTML = "<span style='color:#8a7fb0'>两栏都空着</span>"; return; }
    var d = diffLCS(a, b);
    var html = "";
    d.forEach(function(x){
      var t = esc(x[1]).replace(/\n/g, "<br>");
      if(x[0] === "same") html += "<span>"+t+"</span>";
      else if(x[0] === "del") html += "<span class='del'>"+t+"</span>";
      else html += "<span class='add'>"+t+"</span>";
    });
    var delN = d.filter(function(x){return x[0]==="del";}).length;
    var addN = d.filter(function(x){return x[0]==="add";}).length;
    $("out").innerHTML = html + "<div style='margin-top:10px;font-size:12px;color:#8a7fb0'>删除 "+delN+" 字 · 新增 "+addN+" 字</div>";
  }
  $("go").onclick = run;
})();
</script>
</body>
</html>
