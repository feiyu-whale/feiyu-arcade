<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🦠 康威生命游戏</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #06050e; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; color: #dbeafe;
    display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 100%; max-width: 720px; height: 100%; max-height: 100vh; display: flex; flex-direction: column; }
  canvas { display: block; width: 100%; flex: 1 1 auto; touch-action: none; image-rendering: pixelated; background: #06050e; }
  .hud { position: absolute; top: 10px; left: 14px; right: 14px; display: flex; justify-content: space-between;
    font-size: 14px; font-weight: 700; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.9); z-index: 5; }
  .hud .gen { color: #a3e0ff; } .hud .gen small, .hud .alive small { display:block; font-size:10px; font-weight:400; color:#5b7a99; }
  .hud .alive { color: #7dffb0; text-align: right; }
  .controls { flex: 0 0 auto; padding: 7px 10px calc(7px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg,#0d141c,#0b0f14); border-top: 1px solid #1c2a38; }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .row:last-child { margin-bottom: 0; }
  .lbl { font-size: 12px; color: #7fa8c8; min-width: 42px; }
  input[type=range] { flex: 1; accent-color: #5de8a0; height: 22px; }
  .val { font-size: 13px; font-weight: 700; color: #7dffb0; min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  button { flex: 1; padding: 7px 5px; font-size: 13px; font-weight: 700; color: #cfe9ff; background: #16273a;
    border: 1px solid #2e5f8e; border-radius: 9px; cursor: pointer; font-family: inherit; transition: .15s; white-space: nowrap; }
  button:active { transform: scale(.96); }
  button.primary { background: linear-gradient(160deg,#2e9e68,#1b6a44); border-color:#4dc98a; color:#fff; }
  button.on { background: linear-gradient(160deg,#9fffcf,#5de8a0); color: #06121f; border-color: #9fffcf; }
  .presets { display: flex; gap: 5px; }
  .presets button { padding: 6px 3px; font-size: 11.5px; flex: 1; }
  .ver { position: absolute; bottom: calc(4px + env(safe-area-inset-bottom)); right: 10px; font-size: 10px; color: #2b3f52; z-index: 6; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="gen"><span id="gen">0</span><small>世代</small></div>
    <div class="alive"><span id="alive">0</span><small>存活细胞</small></div>
  </div>
  <div class="controls">
    <div class="row presets">
      <button data-pat="glider">滑翔机</button>
      <button data-pat="gosper">高斯帕枪</button>
      <button data-pat="pulsar">脉冲星</button>
      <button data-pat="random">随机</button>
      <button data-pat="clear">清空</button>
    </div>
    <div class="row">
      <span class="lbl">速度</span>
      <input type="range" id="slider" min="1" max="60" value="12">
      <span class="val" id="spdVal">12 代/秒</span>
    </div>
    <div class="row">
      <button class="primary" id="playBtn">▶ 开始</button>
      <button id="stepBtn">⏭ 单步</button>
      <button id="zoomOutBtn">➖</button>
      <button id="zoomInBtn">➕</button>
    </div>
  </div>
  <div class="ver">v1.0.0-生命游戏 20261015</div>
</div>
<script>
(function(){
  'use strict';
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W=0,H=0,DPR=1;
  var COLS=0, ROWS=0, CELL=8, baseCell=8;
  var grid, next, gen=0, alive=0;
  var STATE='paused', speed=12, acc=0;

  // 无限网格用相对固定尺寸（视口决定），够玩
  function resize(){
    var r = cv.getBoundingClientRect();
    W=r.width; H=r.height;
    DPR=Math.min(window.devicePixelRatio||1,2);
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    rebuild();
  }
  function rebuild(){
    COLS=Math.ceil(W/CELL); ROWS=Math.ceil(H/CELL);
    var g = grid, ng;
    grid = new Uint8Array(COLS*ROWS);
    if (g){ // 尽量保留
      var oc = Math.round(W/CELL), orr = Math.round(H/CELL);
      // 简单起见重建时清空
    }
    next = new Uint8Array(COLS*ROWS);
    draw();
  }
  window.addEventListener('resize', resize);

  function idx(x,y){ return y*COLS + x; }
  function get(x,y){ if(x<0||y<0||x>=COLS||y>=ROWS) return 0; return grid[idx(x,y)]; }
  function setCell(x,y,v){ if(x<0||y<0||x>=COLS||y>=ROWS) return; grid[idx(x,y)]=v?1:0; }

  function step(){
    alive=0;
    for (var y=0;y<ROWS;y++){
      for (var x=0;x<COLS;x++){
        var n = get(x-1,y-1)+get(x,y-1)+get(x+1,y-1)+get(x-1,y)+get(x+1,y)+get(x-1,y+1)+get(x,y+1)+get(x+1,y+1);
        var c = get(x,y);
        var nv = (c && (n===2||n===3)) || (!c && n===3) ? 1 : 0;
        next[idx(x,y)] = nv;
        if (nv) alive++;
      }
    }
    var t=grid; grid=next; next=t;
    gen++;
  }

  function draw(){
    ctx.fillStyle='#06050e'; ctx.fillRect(0,0,W,H);
    // 网格线（格子大才画）
    if (CELL>=7){
      ctx.strokeStyle='rgba(30,50,70,.5)'; ctx.lineWidth=1;
      for (var x=0;x<=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,H); ctx.stroke(); }
      for (var y=0;y<=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(W,y*CELL); ctx.stroke(); }
    }
    ctx.fillStyle='#5de8a0';
    var gap = CELL>=6?1:0;
    for (var yy=0;yy<ROWS;yy++){
      for (var xx=0;xx<COLS;xx++){
        if (grid[idx(xx,yy)]) ctx.fillRect(xx*CELL, yy*CELL, CELL-gap, CELL-gap);
      }
    }
  }

  function updateHUD(){
    document.getElementById('gen').textContent = gen;
    document.getElementById('alive').textContent = alive;
  }

  // ---- 图案 ----
  function placePattern(pat){
    grid = new Uint8Array(COLS*ROWS); gen=0;
    function on(x,y){ setCell(x,y,1); }
    if (pat==='glider'){
      var cx=Math.floor(COLS/2), cy=Math.floor(ROWS/2);
      on(cx,cy-1); on(cx+1,cy); on(cx-1,cy+1); on(cx,cy+1); on(cx+1,cy+1);
    } else if (pat==='pulsar'){
      var cx=Math.floor(COLS/2)-6, cy=Math.floor(ROWS/2)-6;
      var P=[[2,0],[3,0],[4,0],[8,0],[9,0],[10,0],[0,2],[5,2],[7,2],[12,2],[0,3],[5,3],[7,3],[12,3],[0,4],[5,4],[7,4],[12,4],[2,5],[3,5],[4,5],[8,5],[9,5],[10,5],[2,7],[3,7],[4,7],[8,7],[9,7],[10,7],[0,8],[5,8],[7,8],[12,8],[0,9],[5,9],[7,9],[12,9],[0,10],[5,10],[7,10],[12,10],[2,12],[3,12],[4,12],[8,12],[9,12],[10,12]];
      P.forEach(function(p){ on(cx+p[0],cy+p[1]); });
    } else if (pat==='gosper'){
      // 高斯帕滑翔机枪
      if (COLS<40||ROWS<20){ for(var i=0;i<COLS*ROWS*0.15;i++) setCell(Math.floor(Math.random()*COLS),Math.floor(Math.random()*ROWS),1); }
      else {
        var ox=3, oy=3;
        var G=[[0,4],[0,5],[1,4],[1,5],[10,4],[10,5],[10,6],[11,3],[11,7],[12,2],[12,8],[13,2],[13,8],[14,5],[15,3],[15,7],[16,4],[16,5],[16,6],[17,5],[20,2],[20,3],[20,4],[21,2],[21,3],[21,4],[22,1],[22,5],[24,0],[24,1],[24,5],[24,6],[34,2],[34,3],[35,2],[35,3]];
        G.forEach(function(p){ on(ox+p[0], oy+p[1]); });
      }
    } else if (pat==='random'){
      for (var i=0;i<COLS*ROWS*0.18;i++) grid[i] = Math.random()<0.5?1:0;
    } // clear -> 全空
    alive=0; for (var i=0;i<grid.length;i++) if(grid[i]) alive++;
    draw(); updateHUD();
  }

  // ---- 输入（点/拖画细胞）----
  var painting=false, paintVal=1;
  function cellAt(e){
    var r=cv.getBoundingClientRect();
    var x=Math.floor((e.clientX-r.left)/CELL), y=Math.floor((e.clientY-r.top)/CELL);
    return [x,y];
  }
  cv.addEventListener('pointerdown', function(e){ e.preventDefault(); painting=true;
    var c=cellAt(e); paintVal = grid[idx(c[0],c[1])]?0:1; setCell(c[0],c[1],paintVal); draw(); });
  cv.addEventListener('pointermove', function(e){ if(!painting) return; e.preventDefault();
    var c=cellAt(e); setCell(c[0],c[1],paintVal); draw(); });
  cv.addEventListener('pointerup', function(){ painting=false; });
  cv.addEventListener('pointercancel', function(){ painting=false; });
  cv.addEventListener('pointerleave', function(){ painting=false; });

  // ---- 控件 ----
  var playBtn=document.getElementById('playBtn');
  playBtn.addEventListener('click', function(){
    STATE = STATE==='playing'?'paused':'playing';
    playBtn.textContent = STATE==='playing'?'⏸ 暂停':'▶ 开始';
    playBtn.classList.toggle('on', STATE==='playing');
  });
  document.getElementById('stepBtn').addEventListener('click', function(){ step(); draw(); updateHUD(); });
  document.querySelectorAll('.presets button').forEach(function(b){
    b.addEventListener('click', function(){ placePattern(b.dataset.pat);
      if (b.dataset.pat!=='clear'){ STATE='playing'; playBtn.textContent='⏸ 暂停'; playBtn.classList.add('on'); } });
  });
  var slider=document.getElementById('slider');
  slider.addEventListener('input', function(){ speed=+slider.value; document.getElementById('spdVal').textContent=speed+' 代/秒'; });
  document.getElementById('zoomInBtn').addEventListener('click', function(){ CELL=Math.min(24,CELL+2); rebuild(); });
  document.getElementById('zoomOutBtn').addEventListener('click', function(){ CELL=Math.max(3,CELL-2); rebuild(); });

  // ---- 主循环 ----
  var last=performance.now();
  function loop(now){
    var dt=now-last; last=now;
    if (STATE==='playing'){
      acc += dt/1000;
      var per = 1/speed;
      var guard=0;
      while (acc>=per && guard<20){ step(); acc-=per; guard++; }
      draw(); updateHUD();
    }
    requestAnimationFrame(loop);
  }

  // ---- init ----
  resize();
  placePattern('glider');
  requestAnimationFrame(function(t){ last=t; loop(t); });
})();
</script>
</body>
</html>
