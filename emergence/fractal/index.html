<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌀 分形 · 曼德博 / 朱利亚</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #05060c; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; color: #dbeafe;
    display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 100%; max-width: 640px; height: 100%; max-height: 100vh; display: flex; flex-direction: column; }
  canvas { display: block; width: 100%; flex: 1 1 auto; touch-action: none; background: #05060c; }
  .hud { position: absolute; top: 10px; left: 14px; right: 14px; display: flex; justify-content: space-between;
    font-size: 13px; font-weight: 700; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.9); z-index: 5; }
  .hud .mode { color: #ffb0e0; } .hud .zoom { color: #9fd8ff; text-align: right; }
  .hud small { display:block; font-size:10px; font-weight:400; color:#5b7a99; }
  .controls { flex: 0 0 auto; padding: 7px 10px calc(7px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg,#0d141c,#0b0f14); border-top: 1px solid #1c2a38; }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .row:last-child { margin-bottom: 0; }
  .lbl { font-size: 12px; color: #7fa8c8; min-width: 46px; }
  input[type=range] { flex: 1; accent-color: #ff8fd0; height: 22px; }
  .val { font-size: 13px; font-weight: 700; color: #ffb0e0; min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
  button { flex: 1; padding: 8px 5px; font-size: 13px; font-weight: 700; color: #cfe9ff; background: #16273a;
    border: 1px solid #2e5f8e; border-radius: 9px; cursor: pointer; font-family: inherit; transition: .15s; white-space: nowrap; }
  button:active { transform: scale(.96); }
  button.primary { background: linear-gradient(160deg,#c94dc0,#7a2a8a); border-color:#ff8fd0; color:#fff; }
  button.on { background: linear-gradient(160deg,#ffb0e0,#ff8fd0); color:#06121f; border-color:#ffb0e0; }
  .modes { display: flex; gap: 5px; }
  .modes button { padding: 6px 3px; font-size: 11.5px; flex: 1; }
  .benchResult { font-size: 11.5px; color: #9fd8ff; flex: 1; padding-left: 6px; line-height: 1.3; }
  .benchResult.run { color: #ffd479; }
  .ver { position: absolute; bottom: calc(4px + env(safe-area-inset-bottom)); right: 10px; font-size: 10px; color: #2b3f52; z-index: 6; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="mode"><span id="modeName">曼德博集合</span><small>拖动平移 · 滚轮/捏合缩放</small></div>
    <div class="zoom">×<span id="zoomLvl">1</span><small>缩放倍率</small></div>
  </div>
  <div class="controls">
    <div class="row modes">
      <button data-mode="mandel" class="on">曼德博</button>
      <button data-mode="julia">朱利亚</button>
      <button data-mode="seahorse">海马谷</button>
      <button data-mode="reset">⟲ 复位</button>
    </div>
    <div class="row">
      <button class="primary" id="benchBtn">⏱ 性能自测</button>
      <span class="benchResult" id="benchResult">点一下，看你的设备能扛几秒</span>
    </div>
    <div class="row">
      <span class="lbl">迭代</span>
      <input type="range" id="iter" min="30" max="500" value="120">
      <span class="val" id="iterVal">120</span>
    </div>
    <div class="row">
      <span class="lbl">朱利亚c</span>
      <input type="range" id="jc" min="0" max="100" value="28">
      <span class="val" id="jcVal">-0.7</span>
    </div>
  </div>
  <div class="ver">v11-修卡100 20261015</div>
</div>
<script>
(function(){
  'use strict';
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1;
  // 视图：中心 + 缩放尺度（x 方向半宽）
  var cx=-0.5, cy=0.0, viewW=3.2;
  var maxIter=120;
  var mode='mandel';
  var juliaC={re:-0.7, im:0.27};

  function resize(){
    var r=cv.getBoundingClientRect(); W=r.width; H=r.height;
    DPR=Math.min(window.devicePixelRatio||1,1.5); // 分形计算重，DPR 压到 1.5
    cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
    ctx.setTransform(1,0,0,1,0,0);
    render();
  }
  window.addEventListener('resize', resize);

  function colorFor(m, i){
    if (i>=m){ return [5,6,12]; }
    // 平滑配色（HSL 近似）
    var t = i/m;
    var r = Math.floor(255*Math.pow(t,0.42));
    var g = Math.floor(180*Math.pow(t,0.7)*(0.5+0.5*Math.sin(i*0.15)));
    var b = Math.floor(220*Math.pow(1-t,0.6)+60);
    return [r,g,b];
  }

  function render(){
    var iw=cv.width, ih=cv.height;
    var img=ctx.createImageData(iw,ih);
    var data=img.data;
    var aspect = ih/iw;
    var viewH = viewW*aspect;
    var minX = cx - viewW/2, maxX = cx + viewW/2;
    var minY = cy - viewH/2, maxY = cy + viewH/2;

    for (var py=0; py<ih; py++){
      var y0 = minY + (maxY-minY)*py/ih;
      for (var px=0; px<iw; px++){
        var x0 = minX + (maxX-minX)*px/iw;
        var zr, zi, cr, ci;
        if (mode==='mandel'){ zr=0; zi=0; cr=x0; ci=y0; }
        else { zr=x0; zi=y0; cr=juliaC.re; ci=juliaC.im; }
        var i=0;
        while (zr*zr+zi*zi <= 4 && i < maxIter){
          var t = zr*zr - zi*zi + cr;
          zi = 2*zr*zi + ci;
          zr = t;
          i++;
        }
        var col = colorFor(maxIter, i);
        var o=(py*iw+px)*4;
        data[o]=col[0]; data[o+1]=col[1]; data[o+2]=col[2]; data[o+3]=255;
      }
    }
    ctx.putImageData(img,0,0);
    document.getElementById('zoomLvl').textContent = (3.2/viewW).toFixed(viewW>0.5?1:0);
  }

  // 颜色重算节流
  var renderTimer=null;
  function scheduleRender(){
    if (renderTimer) cancelAnimationFrame(renderTimer);
    renderTimer=requestAnimationFrame(render);
  }

  // ---- 平移 / 缩放 ----
  var dragging=false, lastX=0, lastY=0, moved=false;
  cv.addEventListener('pointerdown', function(e){ e.preventDefault(); dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY; cv.setPointerCapture&&cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', function(e){
    if (!dragging) return; e.preventDefault(); moved=true;
    var dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    var r=cv.getBoundingClientRect();
    cx -= dx/r.width*viewW;
    cy -= dy/r.height*viewW*(r.height/r.width);
    scheduleRender();
  });
  cv.addEventListener('pointerup', function(){ dragging=false; });
  cv.addEventListener('pointercancel', function(){ dragging=false; });
  cv.addEventListener('wheel', function(e){ e.preventDefault();
    var f = e.deltaY<0 ? 0.8 : 1.25;
    viewW*=f; scheduleRender();
  }, {passive:false});

  // 捏合
  var pd=0;
  cv.addEventListener('touchstart', function(e){ if(e.touches.length===2){ var t=e.touches; pd=Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);} }, {passive:true});
  cv.addEventListener('touchmove', function(e){
    if (e.touches.length===2){ e.preventDefault(); var t=e.touches; var d=Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
      if (pd>0){ viewW *= pd/d; scheduleRender(); } pd=d; }
  }, {passive:false});

  // 双击放大
  var lastTap=0;
  cv.addEventListener('pointerup', function(e){
    var now=Date.now();
    if (!moved && now-lastTap<300){
      var r=cv.getBoundingClientRect();
      var mx=e.clientX-r.left, my=e.clientY-r.top;
      var aspect=r.height/r.width, viewH=viewW*aspect;
      cx = cx - viewW/2 + mx/r.width*viewW;
      cy = cy - viewH/2 + my/r.height*viewH;
      viewW*=0.5; scheduleRender();
    }
    lastTap=now;
  });

  // ---- 控件 ----
  document.querySelectorAll('.modes button').forEach(function(b){
    b.addEventListener('click', function(){
      var m=b.dataset.mode;
      if (m==='reset'){ mode='mandel'; cx=-0.5; cy=0; viewW=3.2;
        document.querySelectorAll('.modes button').forEach(function(x){x.classList.remove('on');});
        document.querySelector('[data-mode="mandel"]').classList.add('on');
        document.getElementById('modeName').textContent='曼德博集合';
      } else {
        mode=m;
        document.querySelectorAll('.modes button').forEach(function(x){x.classList.toggle('on', x===b);});
        if (m==='julia'){ cx=0; cy=0; viewW=3.4; document.getElementById('modeName').textContent='朱利亚集合'; }
        if (m==='seahorse'){ cx=-0.743643887; cy=0.131825904; viewW=0.006;
          maxIter=500; document.getElementById('iter').value=500; document.getElementById('iterVal').textContent='500';
          document.getElementById('modeName').textContent='海马谷（深处·迭代500）'; }
        if (m==='mandel'){ cx=-0.5; cy=0; viewW=3.2; document.getElementById('modeName').textContent='曼德博集合'; }
      }
      scheduleRender();
    });
  });
  var iter=document.getElementById('iter');
  iter.addEventListener('input', function(){ maxIter=+iter.value; document.getElementById('iterVal').textContent=maxIter; scheduleRender(); });
  var jc=document.getElementById('jc');
  jc.addEventListener('input', function(){
    var v=+jc.value/100; // 0..1 -> -1..0.5 实部
    juliaC.re = -1 + v*1.5;
    juliaC.im = 0.27 + (v-0.28)*0.6;
    document.getElementById('jcVal').textContent = juliaC.re.toFixed(2);
    if (mode==='julia') scheduleRender();
  });

  // ===== 性能自测（跑分）：真渲染一屏海马谷 =====
  // 与“点进去卡几秒”完全同一份计算，测真机真实性能
  var benchBtn=document.getElementById('benchBtn');
  var benchResult=document.getElementById('benchResult');
  var BENCH_ITER=1000;
  var benchRunning=false;
  function benchWork(){
    // 按当前画布真实分辨率跑一屏海马谷
    var iw=cv.width, ih=cv.height;
    var cx0=-0.743643887, cy0=0.131825904, span=0.006;
    var aspect=ih/iw;
    var minX=cx0-span/2, maxX=cx0+span/2;
    var minY=cy0-span*aspect/2, maxY=cy0+span*aspect/2;
    var acc=0;
    for (var py=0; py<ih; py++){
      var ci=minY+(maxY-minY)*py/ih;
      for (var px=0; px<iw; px++){
        var cr=minX+(maxX-minX)*px/iw;
        var zr=0, zi=0, i=0;
        while (zr*zr+zi*zi<=4 && i<BENCH_ITER){
          var t=zr*zr-zi*zi+cr; zi=2*zr*zi+ci; zr=t; i++;
        }
        acc+=i;
      }
    }
    benchSink=acc;
    return acc;
  }
  function runBench(){
    if (benchRunning) return;
    benchRunning=true;
    benchBtn.disabled=true;
    benchResult.classList.add('run');
    benchResult.textContent='渲染中… 0%';
    // 固定分辨率（不与屏幕 DPR 挂钩）：公平且不卡
    var CAP=600000;
    var iw=cv.width, ih=cv.height;
    var tot=iw*ih;
    if (tot>CAP){ var k=Math.sqrt(CAP/tot); iw=Math.floor(iw*k); ih=Math.floor(ih*k); }
    // 按当前画布区域（海马谷）
    var cx0=-0.743643887, cy0=0.131825904, span=0.006;
    var aspect=ih/iw;
    var minX=cx0-span/2, maxX=cx0+span/2;
    var minY=cy0-span*aspect/2, maxY=cy0+span*aspect/2;
    var acc=0, py=0;
    var CHUNK=Math.max(1, Math.floor(ih/50)); // 分 50 条
    var t0=performance.now();
    function finish(){
      var sec=(performance.now()-t0)/1000;
      benchSink=acc;
      var totalPx=iw*ih;
      var score=Math.round(totalPx*BENCH_ITER/(sec*1000000)/100);
      var grade = sec<1?'旗舰':(sec<3?'中端':(sec<8?'入门':'老机/吃力'));
      benchResult.textContent='海马谷 '+iw+'×'+ih+'：用时 '+sec.toFixed(2)+'s · 跑分 '+score+' · '+grade;
      benchResult.classList.remove('run');
      benchBtn.disabled=false;
      benchRunning=false;
    }
    if (ih<=0){ finish(); return; }
    function chunk(){
      if (py>=ih){ finish(); return; }   // 先判结束，杜绝卡 100%
      var end=Math.min(ih, py+CHUNK);
      for (; py<end; py++){
        var ci=minY+(maxY-minY)*py/ih;
        for (var px=0; px<iw; px++){
          var cr=minX+(maxX-minX)*px/iw;
          var zr=0, zi=0, i=0;
          while (zr*zr+zi*zi<=4 && i<BENCH_ITER){ var t=zr*zr-zi*zi+cr; zi=2*zr*zi+ci; zr=t; i++; }
          acc+=i;
        }
      }
      var pct=Math.min(99, Math.round(py/ih*100));  // 真正完成前最多显示 99%
      benchResult.textContent='渲染中… '+pct+'%';
      setTimeout(chunk, 0);
    }
    setTimeout(chunk, 40);
  }
  benchBtn.addEventListener('click', runBench);

  resize();
})();
</script>
</body>
</html>
