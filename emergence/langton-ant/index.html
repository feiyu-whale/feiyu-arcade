<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐜 兰顿蚂蚁 · 高速公路</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0b0f14; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none; color: #cfe9ff;
    display: flex; align-items: center; justify-content: center;
  }
  #wrap { position: relative; width: 100%; max-width: 560px; height: 100%; max-height: 100vh; display: flex; flex-direction: column; }
  canvas { display: block; width: 100%; flex: 1 1 auto; touch-action: none; image-rendering: pixelated; }
  .hud {
    position: absolute; top: 10px; left: 14px; right: 14px;
    display: flex; justify-content: space-between; align-items: flex-start;
    font-size: 14px; font-weight: 700; pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,.8); z-index: 5;
  }
  .hud .steps { color: #9fe0ff; }
  .hud .steps small { display:block; font-size:10px; font-weight:400; color:#5b7a99; }
  .hud .speed { color: #ffd479; text-align: right; }
  .hud .speed small { display:block; font-size:10px; font-weight:400; color:#7a6a4a; }

  .controls {
    flex: 0 0 auto; padding: 7px 10px calc(7px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, #0d141c, #0b0f14);
    border-top: 1px solid #1c2a38;
  }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .row:last-child { margin-bottom: 0; }
  .speedLabel { font-size: 12px; color: #7fa8c8; min-width: 34px; }
  input[type=range] { flex: 1; accent-color: #5db4e8; height: 22px; }
  .speedVal { font-size: 13px; font-weight: 700; color: #ffd479; min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; }

  button {
    flex: 1; padding: 7px 5px; font-size: 13px; font-weight: 700;
    color: #cfe9ff; background: #16273a;
    border: 1px solid #2e5f8e; border-radius: 9px; cursor: pointer;
    font-family: inherit; transition: .15s; white-space: nowrap;
  }
  button:active { transform: scale(.96); }
  button.primary { background: linear-gradient(160deg,#2e6ea8,#1b4670); border-color: #4d8fc9; color: #fff; }
  button.on { background: linear-gradient(160deg,#9fe0ff,#5db4e8); color: #06121f; border-color: #9fe0ff; }
  .presets { display: flex; gap: 5px; }
  .presets button { padding: 6px 3px; font-size: 12px; flex: 1; }
  .ver { position: absolute; bottom: calc(4px + env(safe-area-inset-bottom)); right: 10px; font-size: 10px; color: #2b3f52; z-index: 6; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="steps"><span id="steps">0</span><small>步数</small></div>
    <div class="speed"><span id="spd">×1</span><small>速度</small></div>
  </div>

  <div class="controls">
    <div class="row presets">
      <button data-spd="1">×1</button>
      <button data-spd="10">×10</button>
      <button data-spd="100">×100</button>
      <button data-spd="1000">×1000</button>
      <button data-spd="10000">×10000</button>
    </div>
    <div class="row">
      <span class="speedLabel">速度</span>
      <input type="range" id="slider" min="0" max="100" value="0">
      <span class="speedVal" id="spdVal">×1</span>
    </div>
    <div class="row">
      <button class="primary" id="playBtn">▶ 开始</button>
      <button id="resetBtn">⟲ 重置</button>
      <button id="centerBtn">🎯 归位</button>
    </div>
    <div class="row">
      <button id="zoomOutBtn">➖ 缩小</button>
      <button id="zoomInBtn">➕ 放大</button>
      <button id="zoomResetBtn">⤢ 缩放复位</button>
    </div>
  </div>
  <div class="ver">v2-加缩放 20261015</div>
</div>
<script>
(function(){
  'use strict';
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  // ---- 世界坐标（无限网格）----
  // 用 Map 稀疏存储 "x,y" -> 1（黑格）。白格 = 不存在。
  var cells = Object.create(null); // 用普通对象存稀疏格，避免 Map 开销
  var cellCount = 0;
  var ant = { x: 0, y: 0, dir: 0 }; // dir: 0上 1右 2下 3左
  var steps = 0;

  // 摄像机（世界坐标 -> 屏幕像素），居中于 ant 或视图中心
  var camX = 0, camY = 0;      // 世界坐标中心
  var scale = 6;               // 每格像素
  var baseScale = 6;           // 基准缩放（缩放复位用）
  var follow = true;

  var STATE = 'paused';
  var speedMultiplier = 1;
  var stepsPerFrame = 1;
  var frameAccum = 0;

  var MAX_SPEED = 10000;
  // 滑块 0..100 -> 非线性映射到 1..10000
  function sliderToSpeed(v){
    v = Math.max(0, Math.min(100, v)) / 100;
    // 指数映射：1 * (10000)^v
    return Math.round(Math.pow(MAX_SPEED, v));
  }
  function speedToSlider(s){
    s = Math.max(1, Math.min(MAX_SPEED, s));
    return Math.round(Math.log(s) / Math.log(MAX_SPEED) * 100);
  }

  // ---- 尺寸 ----
  function resize(){
    var r = cv.parentElement.getBoundingClientRect();
    var controls = document.querySelector('.controls').getBoundingClientRect().height;
    var rect = cv.getBoundingClientRect();
    W = rect.width; H = rect.height;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    adaptScale();
    redraw();
  }
  function adaptScale(){
    // 默认一屏约 22 格宽（格子够大看得清）
    baseScale = Math.max(8, Math.floor(W / 22));
    scale = baseScale;
  }
  window.addEventListener('resize', resize);

  // ---- 蚂蚁规则：白右黑左 ----
  var DX = [0, 1, 0, -1]; // 上 右 下 左
  var DY = [-1, 0, 1, 0];
  function step(){
    var key = ant.x + ',' + ant.y;
    var isBlack = cells[key];
    if (isBlack){
      // 黑格 → 左转，涂白
      ant.dir = (ant.dir + 3) & 3;
      delete cells[key]; cellCount--;
    } else {
      // 白格 → 右转，涂黑
      ant.dir = (ant.dir + 1) & 3;
      cells[key] = 1; cellCount++;
    }
    ant.x += DX[ant.dir];
    ant.y += DY[ant.dir];
    steps++;
  }

  // ---- 绘制 ----
  function w2s(wx, wy){
    // 世界坐标 -> 屏幕：以 camX,camY 为中心
    var sx = (wx - camX) * scale + W / 2;
    var sy = (wy - camY) * scale + H / 2;
    return [sx, sy];
  }

  function redraw(){
    // 深色背景
    ctx.fillStyle = '#0b0f14';
    ctx.fillRect(0, 0, W, H);

    if (!follow){
      camX = 0; camY = 0;
    } else {
      camX = ant.x; camY = ant.y;
    }

    // 只画视野内的格
    var halfW = Math.ceil((W / 2) / scale) + 2;
    var halfH = Math.ceil((H / 2) / scale) + 2;
    var minX = Math.floor(camX - halfW), maxX = Math.ceil(camX + halfW);
    var minY = Math.floor(camY - halfH), maxY = Math.ceil(camY + halfH);

    // 黑格
    ctx.fillStyle = '#16324a';
    var gap = scale >= 4 ? 1 : 0; // 留缝，格子更清楚像棋盘
    var anyDrawn = false;
    if (cellCount < 200000){
      for (var x = minX; x <= maxX; x++){
        for (var y = minY; y <= maxY; y++){
          if (cells[x + ',' + y]){
            var p = w2s(x, y);
            ctx.fillRect(p[0], p[1], scale - gap, scale - gap);
            anyDrawn = true;
          }
        }
      }
    } else {
      // 格子太多时降级：直接遍历已有格（可能慢，但为了不卡死遍历视野仍是上策）
      for (var x2 = minX; x2 <= maxX; x2++){
        for (var y2 = minY; y2 <= maxY; y2++){
          if (cells[x2 + ',' + y2]){
            var p2 = w2s(x2, y2);
            ctx.fillRect(p2[0], p2[1], scale, scale);
          }
        }
      }
    }

    // 蚂蚁
    var ap = w2s(ant.x, ant.y);
    ctx.save();
    ctx.translate(ap[0] + scale/2, ap[1] + scale/2);
    ctx.rotate(ant.dir * Math.PI / 2);
    var r = Math.max(scale * 0.7, 4);
    ctx.fillStyle = '#ff6b6b';
    ctx.shadowColor = '#ff6b6b'; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.ellipse(0, 0, r*0.55, r*0.85, 0, 0, 6.283);
    ctx.fill();
    // 头朝向（局部 -y 为前方）
    ctx.beginPath();
    ctx.ellipse(0, -r*0.7, r*0.42, r*0.42, 0, 0, 6.283);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    // 坐标提示（小字）
    ctx.fillStyle = '#1f3345';
    ctx.font = '10px monospace';
    ctx.fillText('(' + ant.x + ', ' + ant.y + ')', 8, H - 6);
  }

  // ---- 主循环 ----
  var last = performance.now();
  function loop(now){
    var dt = Math.min(now - last, 50); last = now;

    if (STATE === 'playing'){
      // 按速度决定这一帧跑多少步
      var budget = Math.round(speedMultiplier / 60); // 目标 60fps
      if (budget < 1) {
        // 低速：累积器，凑够 1 步再走
        frameAccum += speedMultiplier / 60;
        budget = Math.floor(frameAccum);
        frameAccum -= budget;
      } else {
        frameAccum = 0;
        // 大速度时分片，避免单帧太久卡 UI
        budget = Math.min(budget, 120000);
      }
      for (var i = 0; i < budget; i++){ step(); }
      updateHUD();
      redraw();
    }
    requestAnimationFrame(loop);
  }

  function fmt(n){
    if (n < 1000) return String(n);
    if (n < 1e6) return (n/1000).toFixed(n<10000?1:0) + 'K';
    if (n < 1e9) return (n/1e6).toFixed(n<1e7?1:0) + 'M';
    return (n/1e9).toFixed(2) + 'G';
  }
  function updateHUD(){
    document.getElementById('steps').textContent = fmt(steps);
    document.getElementById('spd').textContent = '×' + fmt(speedMultiplier);
  }

  // ---- 控件 ----
  var slider = document.getElementById('slider');
  var spdVal = document.getElementById('spdVal');
  var playBtn = document.getElementById('playBtn');

  function applySpeed(s){
    speedMultiplier = Math.max(1, Math.min(MAX_SPEED, s));
    slider.value = speedToSlider(speedMultiplier);
    spdVal.textContent = '×' + fmt(speedMultiplier);
    document.querySelectorAll('.presets button').forEach(function(b){
      b.classList.toggle('on', +b.dataset.spd === speedMultiplier);
    });
    updateHUD();
  }

  slider.addEventListener('input', function(){
    applySpeed(sliderToSpeed(+slider.value));
  });
  document.querySelectorAll('.presets button').forEach(function(b){
    b.addEventListener('click', function(){ applySpeed(+b.dataset.spd); });
  });

  playBtn.addEventListener('click', function(){
    STATE = (STATE === 'playing') ? 'paused' : 'playing';
    playBtn.textContent = STATE === 'playing' ? '⏸ 暂停' : '▶ 开始';
    playBtn.classList.toggle('on', STATE === 'playing');
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    cells = Object.create(null); cellCount = 0;
    ant = { x: 0, y: 0, dir: 0 }; steps = 0;
    STATE = 'paused';
    playBtn.textContent = '▶ 开始'; playBtn.classList.remove('on');
    updateHUD(); redraw();
  });

  document.getElementById('centerBtn').addEventListener('click', function(){
    follow = !follow;
    this.classList.toggle('on', !follow);
    this.textContent = follow ? '🎯 归位' : '🖐 自由';
    redraw();
  });

  // ---- 缩放 ----
  var baseScale = 6;   // adaptScale 算出的基准格大小
  var MIN_SCALE = 1, MAX_SCALE = 60;
  function setScale(s){
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, s));
    redraw();
  }
  document.getElementById('zoomInBtn').addEventListener('click', function(){ setScale(scale * 1.4); });
  document.getElementById('zoomOutBtn').addEventListener('click', function(){ setScale(scale / 1.4); });
  document.getElementById('zoomResetBtn').addEventListener('click', function(){ setScale(baseScale); });

  // 滚轮缩放
  cv.addEventListener('wheel', function(e){
    e.preventDefault();
    setScale(scale * (e.deltaY < 0 ? 1.12 : 0.89));
  }, { passive: false });

  // 双指捏合缩放
  var pinchDist = 0, pinching = false;
  function touchDist(t){
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  cv.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){ pinching = true; pinchDist = touchDist(e.touches); }
  }, { passive: true });
  cv.addEventListener('touchmove', function(e){
    if (pinching && e.touches.length === 2){
      e.preventDefault();
      var d = touchDist(e.touches);
      if (pinchDist > 0){ setScale(scale * (d / pinchDist)); }
      pinchDist = d;
    }
  }, { passive: false });
  cv.addEventListener('touchend', function(e){
    if (e.touches.length < 2){ pinching = false; pinchDist = 0; }
  }, { passive: true });

  // 空格 播放/暂停
  document.addEventListener('keydown', function(e){
    if (e.code === 'Space'){ e.preventDefault(); playBtn.click(); }
  });

  // ---- 初始化 ----
  // 用控制区的实际高度反推 canvas 高度
  setTimeout(function(){
    resize();
    applySpeed(1);
    updateHUD();
    redraw();
  }, 0);
  requestAnimationFrame(function(t){ last = t; loop(t); });
})();
</script>
</body>
</html>
