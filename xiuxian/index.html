<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>一介散修 · 修仙肉鸽</title>
<style>
/* ============================================================
   一介散修 —— 轻量修仙肉鸽 · 样式主题
   配色：墨底 + 玉青 + 鎏金
   ============================================================ */
:root{
  --bg:#101218; --bg2:#171b26; --panel:#1c2130; --panel2:#232a3d;
  --line:#313a52; --ink:#d8d3c8; --ink2:#8f96a8; --dim:#5a6175;
  --jade:#6fc7a6; --gold:#e8c46a; --red:#d9634f; --blue:#6da8e8;
  --purple:#b48ce8; --green:#8fce6a; --white:#f2ede2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#07080c radial-gradient(ellipse at 50% 0%, #161b2c 0%, #07080c 70%);
  color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  user-select:none;
}
#app{
  width:min(420px,100vw); height:760px; max-height:100vh; background:var(--bg);
  border:1px solid var(--line); border-radius:12px; overflow:hidden;
  display:flex; flex-direction:column; position:relative;
  box-shadow:0 0 60px rgba(111,199,166,.08), 0 20px 60px rgba(0,0,0,.6);
}
/* ---------- 顶栏 ---------- */
#topbar{
  height:58px; flex:none; background:linear-gradient(180deg,#1d2334,#171b26);
  border-bottom:1px solid var(--line); display:none; align-items:center;
  padding:0 12px; gap:10px; font-size:12px;
}
#topbar.on{display:flex}
.tb-name{font-size:13px;color:var(--gold);font-weight:bold;white-space:nowrap}
.tb-col{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.bar{height:10px;background:#0d1017;border:1px solid var(--line);border-radius:5px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .25s}
.bar>span{position:absolute;inset:0;font-size:9px;line-height:10px;text-align:center;color:#fff;text-shadow:0 1px 2px #000}
.hp>i{background:linear-gradient(90deg,#c94a3c,#e07856)}
.qi>i{background:linear-gradient(90deg,#3f8f74,#6fc7a6)}
.tb-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;color:var(--ink2)}
.tb-right b{color:var(--gold)}
.tb-realm{font-size:12px;color:var(--purple);font-weight:bold}
/* ---------- 画布 ---------- */
#cvwrap{flex:none;position:relative;border-bottom:1px solid var(--line);background:#0c0f16}
canvas{display:block;width:100%;height:auto}
/* ---------- 面板 ---------- */
#panel{flex:1;overflow-y:auto;padding:12px;background:var(--bg);position:relative}
#panel::-webkit-scrollbar{width:5px}
#panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
h2.title{
  font-size:17px;color:var(--gold);text-align:center;letter-spacing:6px;margin:6px 0 2px;
  text-shadow:0 0 18px rgba(232,196,106,.35)
}
p.sub{text-align:center;color:var(--ink2);font-size:12px;margin-bottom:10px}
.btn{
  display:block;width:100%;padding:11px;margin:8px 0;background:linear-gradient(180deg,#2a3348,#222941);
  border:1px solid #3d4a6b;border-radius:8px;color:var(--ink);font-size:14px;cursor:pointer;
  text-align:center;font-family:inherit;transition:all .15s;letter-spacing:2px;
}
.btn:hover{border-color:var(--jade);color:var(--jade);box-shadow:0 0 12px rgba(111,199,166,.15)}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#40361c,#2b2413);border-color:#7a6531;color:var(--gold)}
.btn.gold:hover{border-color:var(--gold);color:#ffe9a8;box-shadow:0 0 12px rgba(232,196,106,.2)}
.btn.red{border-color:#6b3a34;background:linear-gradient(180deg,#402220,#2b1513);color:#e0968a}
.btn.red:hover{border-color:var(--red);color:#ffb0a0}
.btn.small{display:inline-block;width:auto;padding:6px 14px;margin:4px;font-size:12px}
.btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.row{display:flex;gap:8px}
.row>*{flex:1}
/* ---------- 卡片 ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;
  cursor:pointer;transition:all .15s;position:relative;overflow:hidden;
}
.card:hover{border-color:var(--jade);transform:translateY(-1px)}
.card.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(232,196,106,.25)}
.card h4{font-size:14px;margin-bottom:3px}
.card p{font-size:11.5px;color:var(--ink2);line-height:1.55}
.card .q{float:right;font-size:11px;font-weight:bold}
.card.dis{opacity:.55;pointer-events:none}
.q0{color:#b9c0cf}.q1{color:var(--green)}.q2{color:var(--blue)}.q3{color:var(--purple)}.q4{color:var(--gold)}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:8px;border:1px solid var(--line);color:var(--ink2);margin:2px 3px 0 0}
.tag.jade{color:var(--jade);border-color:#2e5a4b}
.tag.gold{color:var(--gold);border-color:#6b5a2c}
.tag.red{color:var(--red);border-color:#6b3a34}
.tag.purple{color:var(--purple);border-color:#5a4373}
/* ---------- 日志 ---------- */
#blog{
  height:92px;overflow-y:auto;background:#0d1017;border:1px solid var(--line);border-radius:8px;
  padding:6px 9px;font-size:11px;line-height:1.7;color:var(--ink2);margin-top:8px;
}
#blog .dmg{color:#e8a49a}.blog .crit{color:var(--gold)}
#blog b{color:var(--gold)} #blog .heal{color:var(--green)} #blog .sys{color:var(--blue)}
/* ---------- 弹窗 ---------- */
#modal{
  position:absolute;inset:0;background:rgba(5,6,10,.78);display:flex;align-items:center;justify-content:center;
  z-index:50;backdrop-filter:blur(2px);
}
#modal.hidden{display:none}
#modalBox{
  width:88%;max-height:80%;overflow-y:auto;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:16px;font-size:13px;line-height:1.7;animation:pop .2s;
}
#modalBox h3{color:var(--gold);text-align:center;margin-bottom:8px;letter-spacing:3px}
@keyframes pop{from{transform:scale(.85);opacity:0}}
/* ---------- 提示 ---------- */
#toast{
  position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:60;pointer-events:none;
  background:rgba(20,26,40,.95);border:1px solid var(--line);color:var(--gold);border-radius:20px;
  padding:7px 20px;font-size:13px;opacity:0;transition:opacity .3s;white-space:nowrap;
}
#toast.show{opacity:1}
/* ---------- 图鉴/天赋网格 ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .card{margin:0}
.locked{opacity:.4;filter:grayscale(1)}
.codex-count{text-align:center;color:var(--ink2);font-size:12px;margin:4px 0}
/* ---------- 战斗操作 ---------- */
.bt-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.bt-grid .btn{margin:4px 0;padding:9px 4px;font-size:12px;letter-spacing:0}
.speed-tag{position:absolute;top:8px;right:8px;z-index:5;display:flex;gap:5px}
.speed-tag span{
  background:rgba(13,16,23,.8);border:1px solid var(--line);border-radius:6px;padding:3px 9px;
  font-size:11px;color:var(--ink2);cursor:pointer;
}
.speed-tag span.on{color:var(--gold);border-color:#6b5a2c}
/* ---------- 动效 ---------- */
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-46px);opacity:0}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#app.shake{animation:shakeX .3s}
.pulse{animation:pul 1.6s infinite}
@keyframes pul{0%,100%{box-shadow:0 0 6px rgba(232,196,106,.2)}50%{box-shadow:0 0 20px rgba(232,196,106,.55)}}
.flash{animation:fl .5s}
@keyframes fl{0%{background:#3a2c1c}}
/* ---------- 开局 ---------- */
.rarity-heaven{color:var(--gold);text-shadow:0 0 10px rgba(232,196,106,.6)}
.rarity-normal{color:var(--jade)}
.rarity-mixed{color:var(--purple)}
.bigroot{text-align:center;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0}
.bigroot h1{font-size:30px;letter-spacing:4px;margin:6px 0}
.bigroot p{font-size:12px;color:var(--ink2)}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:10px 0}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:2px 4px}
.kv b{color:var(--ink)}
.small-note{font-size:11px;color:var(--dim);text-align:center;margin-top:4px}
.flex-ctl{display:flex;align-items:center;gap:8px;margin:8px 0}
.flex-ctl .btn{margin:0}
.victory-title{
  font-size:34px;text-align:center;color:var(--gold);letter-spacing:10px;margin:20px 0 8px;
  text-shadow:0 0 30px rgba(232,196,106,.8);animation:pop .6s;
}
.death-title{font-size:34px;text-align:center;color:var(--red);letter-spacing:10px;margin:20px 0 8px;text-shadow:0 0 30px rgba(217,99,79,.5);animation:pop .6s}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-name" id="tbName">散修</div>
    <div class="tb-col">
      <div class="bar hp"><i id="tbHpBar" style="width:100%"></i><span id="tbHpText">100/100</span></div>
      <div class="bar qi"><i id="tbQiBar" style="width:0%"></i><span id="tbQiText">灵气 0/50</span></div>
    </div>
    <div class="tb-right">

      <span>灵石 <b id="tbStones">0</b> · 功德 <b id="tbDao">0</b></span>
    </div>
  </div>
  <div id="cvwrap">
    <canvas id="cv" width="420" height="420"></canvas>

      <span data-sp="1" class="on">1x</span><span data-sp="2">2x</span><span data-sp="0">跳过</span>
    </div>

  <div id="panel"></div>
  <div id="modal" class="hidden"><div id="modalBox"></div></div>

</div>

   模块二：DATA —— 内容表（文案策划只改这里）

/* ---------- 玩家词条（肉鸽随机核心） ---------- */

/* ============================================================
   模块三：RNG —— 随机工具
   ============================================================ */
const R = {
  rand:(a,b)=>a+Math.random()*(b-a),
  irand:(a,b)=>Math.floor(a+Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  chance:p=>Math.random()<p,
  shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; },
  sample(arr,n){ return R.shuffle(arr.slice()).slice(0,n); },
  weighted(list,wf){ let s=0; for(const it of list)s+=it[wf]; let r=Math.random()*s;
    for(const it of list){ r-=it[wf]; if(r<=0)return it; } return list[list.length-1]; },
};

let run = null;
function p(){ return run.p; }
const SKILL_SLOTS=3, PASSIVE_SLOTS=3;

const NAMES1=['云','林','苏','叶','陆','白','秦','顾','沈','裴','萧','洛','楚','温'];
const NAMES2=['尘','痕','舟','野','川','寒','霄','岳','风','月','渡','时'];
const NAMES3=['子','真人','散人','道人','居士','生'];
function genName(){ return R.pick(NAMES1)+R.pick(NAMES2)+(R.chance(.7)?R.pick(NAMES3):''); }

function rollRoot(){
  const rar = R.weighted(ROOT_RARITY,'w');
  const elem = R.pick(ELEMS);
  const info = ROOT_DESC[elem];
  const bon={};
  for(const k in info.b) bon[k] = +(info.b[k]*rar.mul).toFixed(3);
  for(const k in rar.extra) bon[k] = (bon[k]||0)+rar.extra[k];
  return { elem, rar:rar.rar, rarName:rar.t,
    name: rar.rar==='mixed' ? '杂灵根' : (rar.rar==='heaven' ? '天·'+info.n : info.n),
    desc: rar.text, bonusText: info.t, bon, daoMul: rar.rar==='mixed'?BAL.dao.mixedMul:1 };
}

function computeBase(pv){
  const mul = BAL.realmMul[pv.realm];
  const rb = pv.root.bon;
  const base = {
    hp:  Math.round(BAL.base.hp*mul*(1+(rb.hpP||0)) + (pv.bonusHp||0)),
    atk: +(BAL.base.atk*mul*(1+(rb.atkP||0)) + (pv.bonusAtk||0)).toFixed(1),
    def: Math.round(BAL.base.def + pv.realm*2 + (rb.defA||0) + (pv.bonusDef||0)),
    spd: +(BAL.base.spd + BAL.realmSpd[pv.realm]*(1+(rb.spdP||0)*.5) + (pv.bonusSpd||0)).toFixed(1),
    crit: Math.min(.95, BAL.base.crit + (rb.critA||0)),
    cdmg: BAL.base.cdmg, dodge: Math.min(.6, BAL.base.dodge + (rb.dodgeA||0)),
  };
  pv.base = base;
}

function collectBon(pv){
  const b={};
  const add=(k,v)=>{ if(v)b[k]=(b[k]||0)+v; };
  const find=(list,id)=>list.find(x=>x.id===id);
  for(const id of pv.passives){ const s=find(PASSIVES,id); if(s)for(const k in s.bon)add(k,s.bon[k]); }
  for(const id in pv.affixes){ const a=find(AFFIXES,id); if(a)for(const k in a.bon)add(k,a.bon[k]*pv.affixes[id]); }
  for(const id of pv.treasures){ const t=find(TREASURES,id); if(t&&t.bon)for(const k in t.bon)add(k,t.bon[k]); }
  return b;
}
function playerEff(){
  const b=collectBon(p()), bs=p().base;
  return {
    hp: Math.round(bs.hp*(1+(b.hpP||0))),
    atk: +(bs.atk*(1+(b.atkP||0))).toFixed(1),
    def: Math.round(bs.def+(b.defA||0)),
    spd: +(bs.spd*(1+(b.spdP||0))).toFixed(1),
    crit: Math.min(.95, bs.crit+(b.critA||0)),
    cdmg: bs.cdmg+(b.cdmgA||0),
    dodge: Math.min(.6, bs.dodge+(b.dodgeA||0)),
    drainP:b.drainP||0, penP:b.penP||0, thornP:b.thornP||0, comboCh:b.comboCh||0,
    execP:b.execP||0, bossP:b.bossP||0, regenP:b.regenP||0, growAtk:b.growAtk||0,
    burnOnHit:Math.round(b.burnOnHit||0), poisonOnHit:Math.round(b.poisonOnHit||0),
    thunderCh:b.thunderCh||0, iceCh:b.iceCh||0, stunCh:b.stunCh||0,
    firstblood:Math.round(b.firstblood||0), dmgReduce:Math.min(.8,b.dmgReduce||0),
    cdCut:Math.round(b.cdCut||0),
  };
}
function maxHp(){ return playerEff().hp; }
function refreshHp(){ const m=maxHp(); const old=p().hpMax||0;
  if(m>old) p().hp += (m-old); p().hp=Math.min(p().hp,m); p().hpMax=m; }

function hasFlag(f){ return p().treasures.some(id=>{const t=TREASURES.find(x=>x.id===id); return t&&t.flag===f;}); }
function pillSlots(){ return 6 + (Meta.hasT('yaonang')?1:0) + (hasFlag('pillSlot2')?2:0); }
function treSlots(){ return 3 + (Meta.hasT('qiankunxiu')?1:0) + (hasFlag('treSlot1')?1:0); }

/* ---------- 资源增减 ---------- */
function gainStones(n){ const v=Math.round(n*p().stonesMul*(hasFlag('stonesUp')?1.3:1)); p().stones+=v; return v; }
function gainQi(n){ const mul=(Meta.hasT('tanlang')?1.2:1); p().qi+=Math.round(n*mul); }
function healPct(x){ const m=maxHp(); p().hp=Math.min(m, p().hp+Math.round(m*x)); }
function fullHeal(){ p().hp=maxHp(); }
function hurtPct(x){ p().hp=Math.max(1, p().hp-Math.round(maxHp()*x)); }

/* ---------- 掉落/获取 ---------- */
function qualityRoll(floor){
  const W=[[52,32,12,4,0],[34,36,20,9,1],[18,30,32,16,4],[8,22,34,26,10]][Math.min(floor,3)];
  let r=Math.random()*100, acc=0;
  for(let i=0;i<5;i++){ acc+=W[i]; if(r<acc) return i; } return 0;
}
function addRandomPill(id){
  const slots=pillSlots();
  if(p().pills.length>=slots) return null;
  const pid = id || R.pick(PILLS).id;
  p().pills.push(pid); return PILLS.find(x=>x.id===pid);
}
function addRandomSkill(minQ){
  const pool=[...SKILLS,...PASSIVES].filter(s=> !p().skills.includes(s.id) && !p().passives.includes(s.id));
  if(!pool.length) return null;
  let q=qualityRoll(run.floor); if(minQ!=null) q=Math.max(q,minQ);
  let cand=pool.filter(s=>s.q===q);
  let guard=8; while(!cand.length&&guard-->0){ q=Math.max(0,q-1); cand=pool.filter(s=>s.q===q); }
  const s=R.pick(cand.length?cand:pool);
  if(s.type==='active'){ if(p().skills.length<SKILL_SLOTS){p().skills.push(s.id); refreshHp();} else pendingSkill=s; }
  else { if(p().passives.length<PASSIVE_SLOTS){p().passives.push(s.id); refreshHp();} else pendingSkill=s; }
  Meta.codex('skill', s.id);
  return s;
}
function addRandomTreasure(){
  const pool=TREASURES.filter(t=> !p().treasures.includes(t.id));
  if(!pool.length){ gainStones(40); return null; }
  const t=R.pick(pool);
  if(p().treasures.length>=treSlots()) pendingTreasure=t; else { p().treasures.push(t.id); afterTreasure(t); }
  Meta.codex('treasure', t.id);
  return t;
}
function afterTreasure(t){
  if(t.flag==='pillSlot2'||t.flag==='treSlot1') refreshHp();
}
function addRandomAffix(){
  const pool=AFFIXES;
  const a=R.pick(pool);
  p().affixes[a.id]=(p().affixes[a.id]||0)+1;
  refreshHp();
  return a;
}
function loseRandomSkill(){
  if(p().skills.length<=1) return null;
  const idx=R.irand(0,p().skills.length-1);
  const [s]=p().skills.splice(idx,1);
  return SKILLS.find(x=>x.id===s);
}
/* ---------- 怪物生成 ---------- */
function makeMonster(kind, floor, forcedId){
  let tpl;
  if(forcedId) tpl=MONSTERS.find(m=>m.id===forcedId);
  else{
    let pool=MONSTERS.filter(m=>m.realm===floor && m.kind===(kind||'normal'));
    if(!pool.length) pool=MONSTERS.filter(m=>m.realm===floor && m.kind==='normal');
    if(!pool.length) pool=MONSTERS.filter(m=>m.kind==='normal');
    tpl=R.pick(pool);
  }
  const mul=BAL.monsterMul[floor]*R.rand(.92,1.12);
  const m={
    tplId:tpl.id, name:tpl.name, shape:tpl.shape, color:tpl.color, kind:tpl.kind,
    realm:floor, desc:tpl.d, affixes:[],
    hpMax: Math.max(8, Math.round(BAL.monsterBase.hp*tpl.hpM*mul)),
    atk: +(BAL.monsterBase.atk*tpl.atkM*mul).toFixed(1),
    def: Math.max(0, Math.round(BAL.monsterBase.def*tpl.defM*(1+floor*1.1))),
    spd: +(BAL.monsterBase.spd*tpl.spdM + floor*1.5).toFixed(1),
    crit:.03, skill:{...tpl.skill},
  };
  if(tpl.kind==='elite'||tpl.kind==='boss'){
    const keys=Object.keys(MAFFIX);
    const n = tpl.kind==='boss'?2: R.chance(.5)?2:1;
    R.sample(keys,n).forEach(k=>m.affixes.push(k));
    if(m.affixes.includes('m_armor')) m.def=Math.round(m.def*1.6);
    if(m.affixes.includes('m_swift')) m.spd=+(m.spd*1.35).toFixed(1);
    if(m.affixes.includes('m_crit')) m.crit+=.15;
  }
  m.hp=m.hpMax;
  m.qi = Math.round((10+floor*15)*(tpl.kind==='boss'?3.5:tpl.kind==='elite'?2:1)*R.rand(.9,1.15));
  m.stone = Math.round((12+floor*10)*(tpl.kind==='boss'?4:tpl.kind==='elite'?2.2:1)*R.rand(.9,1.15));
  return m;
}

/* ---------- 悟道点结算 ---------- */
function calcDao(){
  const d=BAL.dao;
  let pts = p().realm*d.realm + p().kills*d.kill + p().bossKills*d.boss + (run.won?d.win:0);
  pts = Math.round(pts * p().root.daoMul);
  return pts;
}

/* ============================================================
   模块六：MAPGEN —— 节点地图生成（4大层，层内6列分支）
   ============================================================ */
const NODE_ICON={battle:'⚔️',elite:'💀',event:'❓',shop:'🏪',herb:'🌿',chest:'🎁',boss:'👑',final:'🌟'};
const NODE_NAME={battle:'妖兽',elite:'精英妖兽',event:'奇遇',shop:'坊市',herb:'药园',chest:'宝箱',boss:'妖王',final:'天劫'};
const NODE_TYPES=[
  {t:'battle',w:44},{t:'elite',w:13},{t:'event',w:17},{t:'shop',w:9},{t:'herb',w:8},{t:'chest',w:9},
];
function genMap(floor){
  const rowsPer=[1,2,3,2,3];
  const cols=[];
  for(let c=0;c<6;c++){
    const arr=[];
    if(c===5){
      arr.push({id:floor+'-5-0',col:5,row:0,type:floor===3?'final':'boss',next:[],done:false});
    }else{
      for(let r=0;r<rowsPer[c];r++)
        arr.push({id:floor+'-'+c+'-'+r,col:c,row:r,type:c===0?'battle':null,next:[],done:false});
    }
    cols.push(arr);
  }
  const mid=cols.slice(1,5).flat();
  mid.forEach(nd=>nd.type=R.weighted(NODE_TYPES,'w').t);
  if(!mid.some(n=>n.type==='event')) R.pick(mid).type='event';
  if(!mid.some(n=>n.type==='shop')){
    const cand=mid.filter(n=>n.type!=='event');
    R.pick(cand.length?cand:mid).type='shop';
  }
  for(let c=0;c<5;c++){
    const from=cols[c], to=cols[c+1];
    from.forEach(f=>{
      const near=to.filter(t=>Math.abs(t.row-f.row)<=1);
      const base=near.length?near:to;
      const k=to.length===1?1:(R.chance(.6)?1:2);
      R.sample(base,Math.min(k,base.length)).forEach(t=>{ if(!f.next.includes(t.id)) f.next.push(t.id); });
    });
    to.forEach(t=>{ if(!from.some(f=>f.next.includes(t.id))){ const f=R.pick(from); f.next.push(t.id); } });
  }
  return {floor, cols, cur:cols[0][0].id};
}
function mapNode(id){ for(const col of run.map.cols){ const n=col.find(x=>x.id===id); if(n) return n; } return null; }

   一次 step() = 一个单位的完整行动，返回事件流供 UI 播放
   ============================================================ */
const MITIG=40;   // 防御减伤常数：dmg×MITIG/(MITIG+def)
const Combat = {
  st:null,
  build(monster, ctx){
    const e=playerEff();
    const pl={
      side:'pl', name:p().name, hp:p().hp, hpMax:e.hp,
      atk:e.atk, def:e.def, spd:e.spd, crit:e.crit, cdmg:e.cdmg, dodge:e.dodge,
      drainP:e.drainP, penP:e.penP, thornP:e.thornP, comboCh:e.comboCh, execP:e.execP,
      bossP:e.bossP, regenP:e.regenP, growAtk:e.growAtk, burnOnHit:e.burnOnHit,
      poisonOnHit:e.poisonOnHit, thunderCh:e.thunderCh, iceCh:e.iceCh, stunCh:e.stunCh,
      firstblood:e.firstblood, dmgReduce:e.dmgReduce, elem:p().root.elem,
      statuses:{}, cds:{}, revives:e.firstblood, growAcc:0,
      skills:(ctx.pillAtk||ctx.pillDef)?p().skills.slice():p().skills.slice(),
    };
    if(ctx.pillAtk) pl.atk=+(pl.atk*(1+ctx.pillAtk)).toFixed(1);
    if(ctx.pillDef) pl.def=Math.round(pl.def*(1+ctx.pillDef));
    const en={
      side:'en', name:monster.name, hp:monster.hp, hpMax:monster.hpMax,
      atk:monster.atk, def:monster.def, spd:monster.spd, crit:monster.crit, cdmg:1.5, dodge:.02,
      drainP:monster.affixes.includes('m_drain')?.2:0, penP:0, thornP:monster.affixes.includes('m_thorn')?.2:0,
      comboCh:0, execP:0, bossP:0, regenP:0, growAtk:0,
      burnOnHit:monster.affixes.includes('m_burn')?2:0, poisonOnHit:monster.affixes.includes('m_poison')?2:0,
      thunderCh:0, iceCh:0, stunCh:0, firstblood:0, dmgReduce:0, elem:null,
      statuses:{}, revives:0, growAcc:0, skills:[], skill:monster.skill, turns:0,
      tplId:monster.tplId, kind:monster.kind, affixes:monster.affixes, color:monster.color, shape:monster.shape,
    };
    if(hasFlag('slowEnemy')) en.spd=+(en.spd*.9).toFixed(1);
    this.st={ pl, en, round:0, queue:[], over:false, winner:null, ctx:ctx||{}, started:false, pillRound:false };
    return this.st;
  },
  effSpd(u){ const sl=u.statuses.slow; return u.spd*(sl&&sl.t>0?.7:1); },
  newRound(){
    const st=this.st;
    st.round++; st.pillRound=false;
    st.queue=[st.pl,st.en].sort((a,b)=>this.effSpd(b)-this.effSpd(a)||(R.chance(.5)?1:-1));
  },
  step(){
    const st=this.st;
    if(st.over) return null;
    const ev=[];
    if(!st.started){
      st.started=true; this.newRound();
      if(hasFlag('openThunder')){
        const dmg=Math.round(st.pl.atk*.3);
        this.hitRaw(st.pl,st.en,dmg,{kind:'thunder'},ev);
      }
      if(st.over) return ev;
    }
    let guard=0;
    while(guard++<50){
      if(st.over) return ev;
      if(!st.queue.length){ this.newRound(); continue; }
      const u=st.queue.shift();
      if(u.hp<=0) continue;
      this.act(u, ev);
      return ev;
    }
    return ev;
  },
  /* —— 一个单位的完整行动 —— */
  act(u, ev){
    const st=this.st, foe=u.side==='pl'?st.en:st.pl;
    // 回合开始：状态结算
    const su=u.statuses;
    if(su.stun&&su.stun.t>0){ su.stun.t--; ev.push({k:'stun',side:u.side}); this.endTurn(u); return; }
    if(su.slow&&su.slow.t>0) su.slow.t--;
    for(const key of ['burn','poison']){
      if(su[key]&&su[key].t>0){
        const d=Math.max(1,Math.round(su[key].src*(key==='burn'?.18:.12)));
        this.hitRaw(foe,u,d,{kind:key,noCrit:true,noOnhit:true,noDrain:true,noThorn:true},ev);
        su[key].t--;
        if(u.hp<=0){ this.checkDeath(u,ev); return; }
      }
    }
    if(u.regenP&&u.hp<u.hpMax){ const h=Math.round(u.hpMax*u.regenP); u.hp=Math.min(u.hpMax,u.hp+h); ev.push({k:'heal',side:u.side,v:h}); }
    // 行动
    let act=null;
    if(u.side==='pl'){
      const ready=u.skills.map(id=>SKILLS.find(s=>s.id===id)).filter(s=>s&&!u.cds[s.id]);
      ready.sort((a,b)=>b.q-a.q||b.mult-a.mult);
      act=ready[0]||null;
    }else{
      u.turns++;
      if(u.skill&&u.turns%u.skill.cd===0) act=u.skill;
    }
    if(act){
      ev.push({k:'skill',side:u.side,name:act.name});
      const fx=Object.assign({},act.fx||{});
      if(u.side==='pl'&&act.elem) fx.elem=act.elem;
      let mult = u.side==='pl' ? act.mult/100 : act.mult;
      if(u.side!=='pl'&&u.affixes&&u.affixes.includes('m_rage')&&u.hp<u.hpMax*.4) mult*=1.5;
      if(act.mult>0) this.strike(u,foe,mult,fx,ev);
      if(act.fx&&act.fx.healP){ const h=Math.round(u.hpMax*act.fx.healP); u.hp=Math.min(u.hpMax,u.hp+h); ev.push({k:'heal',side:u.side,v:h}); }
      if(act.fx&&act.fx.shieldP){ const v=Math.round(u.hpMax*act.fx.shieldP); u.statuses.shield={v:(u.statuses.shield?u.statuses.shield.v:0)+v}; ev.push({k:'shield',side:u.side,v}); }
      if(act.fx&&act.fx.thornP) u.statuses.thornBoost=(u.statuses.thornBoost||0)+act.fx.thornP;
      if(u.side==='pl'){ u.cds[act.id]=Math.max(1,act.cd-(u===st.pl?playerEff().cdCut:0)); }
    }else{
      this.strike(u,foe,1,{},ev);
    }
    this.endTurn(u);
  },
  endTurn(u){
    for(const k in u.cds) if(u.cds[k]>0)u.cds[k]--;
    const st=this.st;
    if(u.growAtk){ u.growAcc+=u.growAtk; }
  },
  /* —— 一次攻击（含命中/暴击/词条结算） —— */
  strike(u,foe,mult,fx,ev){
    // 命中
    if(R.chance(foe.dodge)){ ev.push({k:'miss',side:foe.side}); return; }
    let dmg=u.atk*(1+u.growAcc)*mult*R.rand(1-BAL.variance,1+BAL.variance);
    // 暴击
    let crit=false;
    if(!fx.noCrit&&R.chance(u.crit+(fx.critA||0))){ crit=true; dmg*=u.cdmg; }
    // 斩杀/增伤
    if(u.execP&&foe.hp<foe.hpMax*.4) dmg*=(1+u.execP);
    if(u.bossP&&(foe.kind==='elite'||foe.kind==='boss')) dmg*=(1+u.bossP);
    // 元素亲和
    if(u.side==='pl'&&u.elem&&fx.elem===u.elem) dmg*=1.2;
    // 狂暴
    if(foe.affixes&&foe.affixes.includes('m_rage')&&foe.hp<foe.hpMax*.4) {} // 只影响敌方出手，见 monsterAtk
    this.hitRaw(u,foe,Math.max(1,Math.round(dmg)),{...fx,crit},ev);
    // 连击
    if(u.comboCh&&R.chance(u.comboCh)&&foe.hp>0){
      ev.push({k:'combo',side:u.side});
      this.hitRaw(u,foe,Math.max(1,Math.round(dmg*.5)),{noOnhit:true},ev);
    }
  },
  hitRaw(src,tgt,dmg,opts,ev){
    // 减伤
    let d=dmg;
    if(tgt.dmgReduce) d*=(1-tgt.dmgReduce);
    if(tgt.side==='pl'&&hasFlag('earlyGuard')&&this.st.round<=2) d*=.7;
    if(tgt.side==='en'&&tgt.affixes&&tgt.affixes.includes('m_rage')===false){} // placeholder
    // 防御
    const def=tgt.def*(1-(src.penP||opts.penP||0));
    d*=MITIG/(MITIG+def);
    d=Math.max(1,Math.round(d));
    // 护盾
    const sh=tgt.statuses.shield;
    if(sh&&sh.v>0){ const ab=Math.min(sh.v,d); sh.v-=ab; d-=ab;
      if(sh.v<=0) delete tgt.statuses.shield;
      if(ab>0) ev.push({k:'absorb',side:tgt.side,v:ab}); }
    tgt.hp=Math.max(0,tgt.hp-d);
    ev.push({k:opts.crit?'crit':'hit',side:tgt.side,v:d,kind:opts.kind});
    // 吸血
    if(!opts.noDrain&&(src.drainP||opts.drainFx)&&src.hp<src.hpMax){
      const h=Math.round(d*((src.drainP||0)+(opts.drainFx||0)));
      if(h>0){ src.hp=Math.min(src.hpMax,src.hp+h); ev.push({k:'heal',side:src.side,v:h}); }
    }
    // 反震
    const thorn=opts.noThorn?0:((tgt.thornP||0)+(tgt.statuses.thornBoost||0));
    if(thorn>0&&src.hp>0&&tgt.hp>0){
      const r=Math.max(1,Math.round(d*thorn));
      src.hp=Math.max(0,src.hp-r);
      ev.push({k:'thorn',side:src.side,v:r});
      if(src.hp<=0) this.checkDeath(src,ev);
    }
    // 攻击附带效果
    if(!opts.noOnhit&&tgt.hp>0){
      if(src.burnOnHit) tgt.statuses.burn={t:src.burnOnHit,src:src.atk};
      if(src.poisonOnHit) tgt.statuses.poison={t:src.poisonOnHit,src:src.atk};
      if(src.thunderCh&&R.chance(src.thunderCh)){
        const td=Math.max(1,Math.round(src.atk*.8));
        tgt.hp=Math.max(0,tgt.hp-td);
        ev.push({k:'thunder',side:tgt.side,v:td});
      }
      if(src.iceCh&&R.chance(src.iceCh)){ tgt.statuses.slow={t:2}; ev.push({k:'slow',side:tgt.side}); }
      if(src.stunCh&&R.chance(src.stunCh)){ tgt.statuses.stun={t:1}; ev.push({k:'stunned',side:tgt.side}); }
    }
    this.checkDeath(tgt,ev);
  },
  checkDeath(u,ev){
    const st=this.st;
    if(u.hp>0) return;
    if(u.revives>0){
      u.revives--; u.hp=Math.max(1,Math.round(u.hpMax*(u.side==='pl'?.35:.01)));
      ev.push({k:'revive',side:u.side});
      return;
    }
    if(u.side==='pl'&&hasFlag('revive')&&!p().reviveUsed){
      p().reviveUsed=true; u.hp=Math.round(u.hpMax*.5);
      ev.push({k:'revive',side:'pl',lamp:true});
      return;
    }
    st.over=true; st.winner=u.side==='pl'?'en':'pl';
    ev.push({k:'die',side:u.side});
  },
  fleeChance(){
    const st=this.st;
    return Math.min(.9, Math.max(.15, (BAL.fleeBase+(playerEff().spd-st.en.spd)*BAL.fleePerSpd+ (p().fleeBonus||0))/100));
  },
  /* —— 逃跑失败 / 丹药 引发的敌方追加行动 —— */
  enemyStrike(ev){
    const st=this.st;
    if(st.over) return;
    this.actEnemyOnly(st.en,ev);
  },
  actEnemyOnly(en,ev){
    const st=this.st, foe=st.pl;
    const su=en.statuses;
    if(su.stun&&su.stun.t>0){ su.stun.t--; ev.push({k:'stun',side:'en'}); return; }
    en.turns++;
    let mult=1, fx={};
    if(en.skill&&en.turns%en.skill.cd===0){ mult=en.skill.mult; fx=en.skill.fx||{}; ev.push({k:'skill',side:'en',name:en.skill.name}); }
    this.strike(en,foe,mult,fx,ev);
  },
};

const $=id=>document.getElementById(id);

let speed=1;

/* ---------- 通用 UI ---------- */
function toast(txt){ const t=$('toast'); t.textContent=txt; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1400); }
function showModal(html){ $('modalBox').innerHTML=html; $('modal').classList.remove('hidden'); }
function hideModal(){ $('modal').classList.add('hidden'); }

function updateTopbar(){

/* ---------- 画布：通用 ---------- */
let T0=performance.now();
const FX={floaters:[],shake:0,lunge:{side:null,t0:0},banner:null};
function floater(side,txt,color){ FX.floaters.push({side,txt,color,t0:performance.now()}); }
function shake(){ FX.shake=performance.now(); }
function drawCanvas(t){
  g.clearRect(0,0,cv.width,cv.height);
  if(scene==='title') drawTitleBG(t);
  else if(scene==='map') drawMapScene(t);
  else if(scene==='battle') drawBattleScene(t);
  else if(scene==='prebattle'||scene==='event') drawSceneBG(t);
  else drawSceneBG(t);
  // floaters (battle only)
  if(scene==='battle'){
    FX.floaters=FX.floaters.filter(f=>t-f.t0<900);
    for(const f of FX.floaters){
      const pgr=(t-f.t0)/900;
      const pos=f.side==='pl'?{x:110,y:270}:{x:310,y:270};
      g.globalAlpha=1-pgr;
      g.font='bold 22px "Microsoft YaHei"';
      g.fillStyle=f.color; g.textAlign='center';
      g.fillText(f.txt, pos.x, pos.y-pgr*46);
      g.globalAlpha=1;
    }
  }
}
function drawSceneBG(t){
  const grd=g.createLinearGradient(0,0,0,cv.height);
  grd.addColorStop(0,'#131826'); grd.addColorStop(1,'#0b0e15');
  g.fillStyle=grd; g.fillRect(0,0,cv.width,cv.height);
  // 远山
  g.fillStyle='rgba(111,199,166,.05)';
  g.beginPath(); g.moveTo(0,300); g.lineTo(90,190); g.lineTo(200,300); g.fill();
  g.beginPath(); g.moveTo(150,300); g.lineTo(280,150); g.lineTo(420,300); g.fill();
  // 月
  g.fillStyle='rgba(232,196,106,.13)';
  g.beginPath(); g.arc(340,80,34,0,7); g.fill();
}
function drawTitleBG(t){
  drawSceneBG(t);
  g.fillStyle='rgba(232,196,106,.9)'; g.textAlign='center';
  g.font='bold 52px "Microsoft YaHei"';
  g.shadowColor='rgba(232,196,106,.6)'; g.shadowBlur=26;
  g.fillText('一介散修',210,150);
  g.shadowBlur=0;
  g.font='15px "Microsoft YaHei"'; g.fillStyle='rgba(143,150,168,.9)';
  g.fillText('—— 修 仙 肉 鸽 · 灵 根 问 道 ——',210,190);
  // 飘过的星星
  for(let i=0;i<14;i++){
    const x=(i*67+((t/40)%420))%420, y=(i*53)%160+30;
    g.fillStyle=`rgba(216,211,200,${.08+((i*37)%10)/60})`;
    g.fillRect(x,y,2,2);

}
/* ---------- 画布：地图 ---------- */
const NODE_X=c=>42+c*67.2;
function nodeY(n){ const rows=run.map.cols[n.col].length; return 210+((n.row-(rows-1)/2)*95); }
function drawMapScene(t){
  drawSceneBG(t);
  const map=run.map;
  // 层标签
  g.font='13px "Microsoft YaHei"'; g.fillStyle='rgba(180,140,232,.85)'; g.textAlign='left';
  g.fillText(`第${['一','二','三','四'][map.floor]}层 · ${BAL.realmName[map.floor]}试炼`,14,26);
  // 连线
  for(const col of map.cols) for(const n of col) for(const nid of n.next){
    const m2=mapNode(nid); if(!m2) continue;
    const done=n.done&&m2.done;
    g.strokeStyle=done?'rgba(111,199,166,.35)':'rgba(90,97,117,.3)';
    g.lineWidth=done?2.5:1.5;
    g.beginPath(); g.moveTo(NODE_X(n.col)+16,nodeY(n)); g.lineTo(NODE_X(m2.col)-16,nodeY(m2)); g.stroke();
  }
  // 节点
  const cur=mapNode(map.cur);
  const reachable=cur?cur.next:[];
  for(const col of map.cols) for(const n of col){
    const x=NODE_X(n.col), y=nodeY(n), r=17;
    // 可达脉冲
    if(reachable.includes(n.id)){
      const pl=(Math.sin(t/300)+1)/2;
      g.beginPath(); g.arc(x,y,r+4+pl*3,0,7);
      g.strokeStyle=`rgba(232,196,106,${.7-pl*.4})`; g.lineWidth=2; g.stroke();
    }
    g.beginPath(); g.arc(x,y,r,0,7);
    g.fillStyle=n.done?'#232a3d':'#1a2030';
    g.fill();
    g.strokeStyle=n.id===map.cur?'#e8c46a':(reachable.includes(n.id)?'#6fc7a6':'#313a52');
    g.lineWidth=n.id===map.cur?2.5:1.5; g.stroke();
    g.font='15px serif'; g.textAlign='center';
    g.fillText(NODE_ICON[n.type],x,y+5);
  }
  // 小人在当前节点旁
  if(cur){
    const x=NODE_X(cur.col)+22, y=nodeY(cur)-34;
    g.font='16px serif'; g.textAlign='center'; g.fillText('🧙',x,y);
  }
}
/* ---------- 画布：战斗 ---------- */
function drawFigure(x,y,side,t){
  const bob=Math.sin(t/(side==='pl'?420:340))*4;
  if(side==='pl'){
    // 道袍修士
    g.fillStyle='#3f8f74';

    g.fillStyle='#e8d5b5';
    g.beginPath(); g.arc(x,y-56+bob,14,0,7); g.fill();
    g.fillStyle='#2b2413'; g.beginPath(); g.arc(x,y-62+bob,14,Math.PI,0); g.fill(); // 发髻
    g.fillStyle='#e8c46a'; g.fillRect(x-3,y-74+bob,6,7);
    g.fillStyle='rgba(111,199,166,.85)'; g.font='13px serif'; g.textAlign='center';
    g.fillText('🗡️',x+22,y-40+bob);
  }else{
    drawBeast(run._monShape,run._monColor,x,y+18+bob,run._monSize||1);
  }
}
function drawBeast(shape,color,x,y,s){
  g.fillStyle=color; g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=2;
  const K=(a)=>a*s;
  if(shape==='beast'){
    g.beginPath(); g.ellipse(x,y,K(34),K(20),0,0,7); g.fill();
    g.beginPath(); g.arc(x+K(30),y-K(14),K(13),0,7); g.fill();
    g.beginPath(); g.moveTo(x+K(22),y-K(22)); g.lineTo(x+K(26),y-K(34)); g.lineTo(x+K(33),y-K(24)); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(x-K(30),y); g.quadraticCurveTo(x-K(48),y-K(10),x-K(44),y-K(22)); g.lineWidth=K(6); g.strokeStyle=color; g.stroke();
  }else if(shape==='serpent'){
    g.lineWidth=K(11); g.strokeStyle=color; g.beginPath();
    for(let i=0;i<=30;i++){ const px=x-K(40)+i*K(2.6), py=y-Math.sin(i/4)*K(9)-K(4); i?g.lineTo(px,py):g.moveTo(px,py); }
    g.stroke();
    g.fillStyle=color; g.beginPath(); g.ellipse(x+K(42),y-K(6),K(14),K(9),.4,0,7); g.fill();
  }else if(shape==='insect'){
    g.beginPath(); g.ellipse(x,y,K(24),K(16),0,0,7); g.fill();
    for(let i=-2;i<=2;i++){ g.beginPath(); g.moveTo(x+i*K(9),y-K(4)); g.lineTo(x+i*K(13),y+K(16)); g.lineWidth=K(3); g.strokeStyle=color; g.stroke(); }
    g.beginPath(); g.moveTo(x+K(20),y); g.lineTo(x+K(38),y-K(4)); g.lineWidth=K(5); g.strokeStyle=color; g.stroke();
  }else if(shape==='bird'){
    g.beginPath(); g.ellipse(x,y,K(20),K(13),0,0,7); g.fill();
    const fl=Math.sin(Date.now()/160)*K(10);
    g.beginPath(); g.moveTo(x,y-K(4)); g.lineTo(x-K(30),y-K(18)-fl); g.lineTo(x-K(6),y+K(4)); g.closePath(); g.fill();
    g.beginPath(); g.arc(x+K(18),y-K(10),K(9),0,7); g.fill();
    g.beginPath(); g.moveTo(x+K(24),y-K(12)); g.lineTo(x+K(34),y-K(8)); g.lineTo(x+K(24),y-K(4)); g.closePath(); g.fill();
  }else if(shape==='ghost'){
    g.beginPath(); g.arc(x,y-K(8),K(24),Math.PI,0);
    g.lineTo(x+K(24),y+K(12));
    for(let i=0;i<4;i++){ g.arc(x+K(18-i*12),y+K(12),K(6),0,Math.PI,true); }
    g.closePath(); g.fill();
  }else if(shape==='humanoid'){
    g.fillRect(x-K(14),y-K(26),K(28),K(40));
    g.beginPath(); g.arc(x,y-K(34),K(11),0,7); g.fill();
    g.fillRect(x-K(26),y-K(22),K(10),K(28)); g.fillRect(x+K(16),y-K(22),K(10),K(28));
  }else if(shape==='plant'){
    g.fillStyle='#6b5136'; g.fillRect(x-K(6),y-K(10),K(12),K(28));
    g.fillStyle=color;
    g.beginPath(); g.arc(x,y-K(22),K(20),0,7); g.fill();
    g.beginPath(); g.arc(x-K(16),y-K(10),K(13),0,7); g.fill();
    g.beginPath(); g.arc(x+K(16),y-K(12),K(13),0,7); g.fill();
  }else if(shape==='turtle'){
    g.beginPath(); g.arc(x,y,K(26),Math.PI,0); g.fill();
    g.fillStyle='#3d6152';
    g.beginPath(); g.ellipse(x+K(28),y-K(6),K(11),K(8),0,0,7); g.fill();
  }else if(shape==='dragon'){
    g.lineWidth=K(13); g.strokeStyle=color; g.beginPath();
    for(let i=0;i<=30;i++){ const px=x-K(36)+i*K(2.4), py=y-Math.abs(Math.sin(i/5))*K(16)-K(8); i?g.lineTo(px,py):g.moveTo(px,py); }
    g.stroke();
    const fl=Math.sin(Date.now()/170)*K(8);
    g.fillStyle='rgba(232,196,106,.5)';
    g.beginPath(); g.moveTo(x-K(6),y-K(10)); g.lineTo(x-K(26),y-K(30)-fl); g.lineTo(x+K(8),y-K(14)); g.closePath(); g.fill();
    g.fillStyle=color; g.beginPath(); g.arc(x+K(38),y-K(16),K(12),0,7); g.fill();
  }
  // 眼睛
  g.fillStyle='#ffdf8a';
  g.beginPath(); g.arc(x+K(26),y-K(16),K(2.6),0,7); g.fill();
}
function unitBar(u, x, y, w){
  g.fillStyle='#0d1017'; g.fillRect(x,y,w,9);
  const pct=Math.max(0,u.hp/u.hpMax);
  g.fillStyle=u.side==='pl'?'#c94a3c':'#8fce6a';
  g.fillRect(x,y,w*pct,9);
  g.strokeStyle='#313a52'; g.strokeRect(x+.5,y+.5,w-1,8);
  // 护盾
  if(u.statuses.shield&&u.statuses.shield.v>0){
    g.fillStyle='rgba(109,168,232,.8)'; g.fillRect(x,y-4,w*Math.min(1,u.statuses.shield.v/u.hpMax),3);
  }
  g.font='11px "Microsoft YaHei"'; g.fillStyle='#d8d3c8'; g.textAlign='center';
  g.fillText(`${u.name}  ${Math.ceil(u.hp)}/${u.hpMax}`, x+w/2, y-6);
  // 状态
  let sx=x+w/2-((Object.keys(u.statuses).length-1)*8);
  for(const k in u.statuses){
    const icon={burn:'🔥',poison:'☠️',stun:'💫',slow:'❄️',shield:'🛡️'}[k];
    if(icon){ g.font='10px serif'; g.fillText(icon,sx,y+22); sx+=16; }
  }
}
function drawBattleScene(t){
  const st=Combat.st; if(!st){ drawSceneBG(t); return; }
  drawSceneBG(t);
  // 震屏
  let ox=0,oy=0;
  if(t-FX.shake<220){ const a=(1-(t-FX.shake)/220)*7; ox=R.rand(-a,a); oy=R.rand(-a,a); }
  g.save(); g.translate(ox,oy);
  // 突进动画
  let plx=95, enx=325;
  const lt=t-FX.lunge.t0;
  if(lt<260&&FX.lunge.side){ const off=Math.sin(lt/260*Math.PI)*38;
    if(FX.lunge.side==='pl') plx+=off; else enx-=off; }
  drawFigure(plx,240,'pl',t);
  drawFigure(enx,240,'en',t);
  unitBar(st.pl, 35,300,120);
  unitBar(st.en, 265,300,120);
  // 回合数
  g.font='12px "Microsoft YaHei"'; g.fillStyle='rgba(143,150,168,.8)'; g.textAlign='center';
  g.fillText(`第 ${st.round} 回合`,210,26);
  // 战斗横幅（功法名）
  if(FX.banner&&t-FX.banner.t0<700){
    const a=1-(t-FX.banner.t0)/700;
    g.globalAlpha=a; g.font='bold 20px "Microsoft YaHei"';
    g.fillStyle='#e8c46a'; g.shadowColor='rgba(232,196,106,.8)'; g.shadowBlur=14;
    g.fillText(FX.banner.txt,210,120); g.shadowBlur=0; g.globalAlpha=1;
  }else if(FX.banner&&t-FX.banner.t0>=700) FX.banner=null;
  g.restore();
}

function maybeOfferPending(done){
  window._pendCb=done||null;
  if(pendingSkill){
    const s=pendingSkill, isAct=s.type==='active';
    const cur=isAct?p().skills:p().passives;
    showModal(`<h3>${isAct?'功法位':'心法位'}已满</h3>
      <p>新功法 <b class="${QCOLOR[s.q]}">【${s.name}】</b>——${s.d}<br>选择替换其一，或放弃：</p>
      ${cur.map((id,i)=>{const c=findSkill(id);return `<div class="card" onclick="replacePending(${i})"><h4>${c.name} ${qTag(c.q)}</h4><p>${c.d}</p></div>`;}).join('')}
      <button class="btn" onclick="discardPending()">放弃新功法</button>`);
    return;
  }
  if(pendingTreasure){
    const t=pendingTreasure;
    showModal(`<h3>法宝位已满</h3>
      <p>新法宝 <b>【${t.icon}${t.name}】</b>——${t.d}<br>选择替换其一，或放弃：</p>
      ${p().treasures.map((id,i)=>{const c=TREASURES.find(x=>x.id===id);return `<div class="card" onclick="replacePendingT(${i})"><h4>${c.icon} ${c.name} ${qTag(c.q)}</h4><p>${c.d}</p></div>`;}).join('')}
      <button class="btn" onclick="discardPendingT()">放弃新法宝</button>`);
    return;
  }
  if(window._pendCb){ const cb=window._pendCb; window._pendCb=null; cb(); }
}
function replacePending(i){
  const s=pendingSkill;
  if(s.type==='active') p().skills[i]=s.id; else p().passives[i]=s.id;
  pendingSkill=null; hideModal(); refreshHp();
  toast(`已替换为【${s.name}】`);
  if(window._pendCb){ const cb=window._pendCb; window._pendCb=null; cb(); }
}
function discardPending(){ pendingSkill=null; hideModal(); toast('机缘留待下次');
  if(window._pendCb){ const cb=window._pendCb; window._pendCb=null; cb(); } }
function replacePendingT(i){
  const t=pendingTreasure;
  p().treasures[i]=t.id; afterTreasure(t);
  pendingTreasure=null; hideModal(); refreshHp();

  const pv=p();

  const usable = where==='pre' ? ['heal40','heal85','gamble','qi40','atkUp','defUp'] : ['heal40','heal85','atkUp','defUp','cure','gamble','qi40'];
  showModal(`<h3>丹药（${where==='pre'?'战前服用':'战斗中服用'}）</h3>`+

function takePill(i,where){
  const pv=p(), pid=pv.pills[i], pill=PILLS.find(x=>x.id===pid);
  if(where==='battle'){
    const st=Combat.st;
    if(st.pillRound&&pill.use!=='gamble'&&pill.use!=='qi40'){ hideModal(); toast('本回合已服过丹药'); return; }
    if(pill.use==='heal40'){ st.pl.hp=Math.min(st.pl.hpMax,st.pl.hp+Math.round(st.pl.hpMax*.4)); floater('pl','回血','#8fce6a'); }
    else if(pill.use==='heal85'){ st.pl.hp=Math.min(st.pl.hpMax,st.pl.hp+Math.round(st.pl.hpMax*.85)); floater('pl','大还丹!','#8fce6a'); }
    else if(pill.use==='atkUp'){ st.pl.atk=+(st.pl.atk*1.25).toFixed(1); floater('pl','攻升25%','#ff9a56'); }
    else if(pill.use==='defUp'){ st.pl.def=Math.round(st.pl.def*1.5); floater('pl','防升50%','#6da8e8'); }
    else if(pill.use==='cure'){ st.pl.statuses={}; floater('pl','神清气爽','#9ad0ff'); }
    else if(pill.use==='gamble'){ pv.gambleStack++; }
    else if(pill.use==='qi40'){ gainQi(40); }
    if(pill.use!=='gamble'&&pill.use!=='qi40') st.pillRound=true;
  }else{
    if(pill.use==='heal40'||pill.use==='heal85'){ healPct(pill.use==='heal40'?.4:.85); toast('丹入腹中，气血回涌'); }
    else if(pill.use==='gamble'){ pv.gambleStack++; toast(`破境丹之力蕴养经脉（搏命成功率+${pv.gambleStack*15}%）`); }
    else if(pill.use==='qi40'){ gainQi(40); toast('灵气+40'); }
    else if(pill.use==='atkUp'){ battleCtx.pillAtk=.25; toast('聚力丹已服，出战后攻升25%'); }
    else if(pill.use==='defUp'){ battleCtx.pillDef=.5; toast('玄武丹已服，出战后防升50%'); }
    else { toast('此刻服用并无大用'); return; }
  }
  pv.pills.splice(i,1);
  hideModal(); updateTopbar();
  if(scene==='battle') renderBattlePanel();
}

/* ============================================================
   场景：战斗
   ============================================================ */
function startBattle(){
  const m=run.mon;
  run._monShape=m.shape; run._monColor=m.color;
  run._monSize=m.kind==='boss'||m.kind==='final'?1.5:m.kind==='elite'?1.2:1;
  Combat.build(m, Object.assign({kind:run.curKind}, battleCtx));
  show('battle');
  renderBattlePanel();
  battleLog(`<span class="sys">遭遇 ${m.name}！战斗自动进行……</span>`);
  battleLoop();
}
function renderBattlePanel(){
  const st=Combat.st;
  if(!st){ renderMap(); return; }
  const pv=p();
  if(st.over){
    return; // endBattle 会重绘
  }
  $('panel').innerHTML=`
    <div class="bt-grid" id="pillBtns">
      ${pv.pills.slice(0,4).map((id,i)=>{const pl=PILLS.find(x=>x.id===id);
        return `<button class="btn" onclick="openPillMenu('battle')">💊${pl.name}</button>`;}).join('')}
    </div>
    <button class="btn red" onclick="tryFlee()">🏃 尝试逃跑（${Math.round(Combat.fleeChance()*100)}%）</button>
    <div id="blog"></div>`;
  battleLogHtml('');
}
function battleLogHtml(html){ const b=$('blog'); if(b){ b.innerHTML+=html; b.scrollTop=b.scrollHeight; } }
function battleLog(html){ if($('blog')) battleLogHtml(html); else { (run._pendingLog=run._pendingLog||[]).push(html); } }
function flushLog(){ if(run&&run._pendingLog&&$('blog')){ run._pendingLog.forEach(h=>battleLogHtml(h)); run._pendingLog=[]; } }
function evText(ev){
  const st=Combat.st;
  const enName=st.en.name, plName=p().name;
  const atkN=ev.side==='pl'?enName:plName;   // 被打的一方
  switch(ev.k){
    case 'hit': return `${atkN} 受到 <span class="dmg">${ev.v}</span> 伤害`;
    case 'crit': return `<b>暴击！</b>${atkN} 受到 <span class="dmg">${ev.v}</span> 伤害`;
    case 'thunder': return `雷霆轰落！${atkN} 受到 <span class="dmg">${ev.v}</span> 雷伤`;
    case 'thorn': return `反震之力，${atkN} 受到 <span class="dmg">${ev.v}</span> 伤害`;
    case 'miss': return `${atkN} 身形一晃，闪避了攻击`;
    case 'heal': return `${atkN} 回复 <span class="heal">${ev.v}</span> 气血`;
    case 'shield': return `${atkN} 凝聚护盾 <span class="heal">${ev.v}</span>`;
    case 'absorb': return `护盾抵消 <span class="heal">${ev.v}</span> 伤害`;
    case 'combo': return `<b>连击！</b>`;
    case 'skill': return `<b>${ev.side==='pl'?plName:enName} 施展【${ev.name}】</b>`;
    case 'stun': return `${atkN} 眩晕中……`;
    case 'stunned': return `${atkN} 被眩晕！`;
    case 'slow': return `${atkN} 被冰缓`;
    case 'revive': return `<b>${atkN} ${ev.lamp?'长生灯护主':'金蝉脱壳'}，重新站起！</b>`;
    case 'die': return `<b>${atkN} 轰然倒地！</b>`;
  }
  return '';
}
function appendLog(ev){ const t=evText(ev); if(t) battleLog(t+'<br>'); }
async function playEvents(evs){
  const delay=speed===2?220:470;
  for(const ev of evs){
    applyEvVisual(ev); appendLog(ev);
    await wait(delay);
  }
}
function applyEvVisual(ev){
  switch(ev.k){
    case 'hit': case 'crit':
      floater(ev.side, '-'+ev.v, ev.k==='crit'?'#ffd76a':(ev.kind==='burn'?'#ff9a56':ev.kind==='poison'?'#9ae07a':'#ff8a7a'));
      if(ev.k==='crit') shake();
      FX.lunge={side:ev.side==='pl'?'en':'pl', t0:performance.now()};
      break;
    case 'miss': floater(ev.side,'闪避','#8fd0e8'); break;
    case 'heal': floater(ev.side,'+'+ev.v,'#8fce6a'); break;
    case 'shield': floater(ev.side,'盾+'+ev.v,'#6da8e8'); break;
    case 'absorb': floater(ev.side,'抵消'+ev.v,'#6da8e8'); break;
    case 'thunder': floater(ev.side,'⚡'+ev.v,'#ffe98a'); shake(); break;
    case 'thorn': floater(ev.side,'反'+ev.v,'#e8a49a'); break;
    case 'skill': FX.banner={txt:ev.name, t0:performance.now()}; break;
    case 'stun': floater(ev.side,'眩晕','#b48ce8'); break;
    case 'stunned': floater(ev.side,'被眩晕!','#b48ce8'); break;
    case 'slow': floater(ev.side,'冰缓','#9ad0ff'); break;
    case 'revive': floater(ev.side,ev.lamp?'长生灯护主!':'金蝉脱壳!','#e8c46a'); shake(); break;
    case 'die': floater(ev.side,'倒下','#ff6a5a'); break;
  }
}
let battleRunning=false;
async function battleLoop(){
  if(battleRunning||!Combat.st||Combat.st.over) return;
  battleRunning=true;
  try{
    const st=Combat.st;
    flushLog();
    while(!st.over){
      if(speed===0){
        let guard=0, evs;
        while(!st.over&&guard++<600){ evs=Combat.step(); if(evs) evs.forEach(appendLog); }
        break;
      }
      const evs=Combat.step();
      if(!evs||!evs.length){ if(st.over) break; continue; }
      await playEvents(evs);
    }
    if(st.over) endBattle();
  }finally{ battleRunning=false; }
}
function tryFlee(){
  const st=Combat.st;
  if(!st||st.over) return;
  if(st.en.kind==='boss'||st.en.kind==='final'){ toast('妖王威压锁天，逃无可逃！'); return; }
  if(R.chance(Combat.fleeChance())){
    st.over=true; st.winner='fled';
    battleLog('<span class="sys">遁光一闪，成功脱身！</span>');
    endBattle();
  }else{
    toast('逃跑失败，被追上一击！');
    const ev=[]; Combat.enemyStrike(ev);
    (async()=>{ await playEvents(ev); if(st.over) endBattle(); })();
  }
}
function endBattle(){
  const st=Combat.st;
  p().hp=Math.max(1,Math.ceil(st.pl.hp));
  $('speedTag').style.display='none';
  if(st.winner==='pl') battleWin();
  else if(st.winner==='fled') fledPanel();
  else battleLose();
}
function fledPanel(){
  $('panel').innerHTML=`
    <h2 class="title">成功脱身</h2>
    <p class="sub">留得青山在，不怕没柴烧。此地的妖兽与宝物，就留给有缘人吧。</p>
    <button class="btn" onclick="finishNode()">继续赶路</button>`;
}
function battleWin(){
  const st=Combat.st, m=run.mon, ctx=st.ctx;
  if(ctx.spar){
    const a=addRandomAffix();
    $('panel').innerHTML=`
      <h2 class="title" style="color:var(--jade)">切磋获胜</h2>
      <p class="sub">同侪抱拳心服："道友高明，佩服佩服。"</p>
      <div class="card" style="cursor:default"><h4>领悟词条：${a.name}</h4><p>${a.d}</p></div>
      <button class="btn" onclick="afterBattleNext()">继续赶路</button>`;
    maybeOfferPending(); updateTopbar(); return;
  }
  const stones=gainStones(m.stone*(ctx.bounty?2:1));
  gainQi(m.qi); p().kills++;
  if(m.kind==='boss'||m.kind==='final') p().bossKills++;
  healPct(BAL.killHeal);
  const isNew=Meta.codex('monster',m.tplId);
  if(isNew) toast(`图鉴解锁：${m.name}（悟道点+${BAL.dao.codex}）`);
  const drops=[];
  if(R.chance(BAL.pillDrop)){ const pi=addRandomPill(); if(pi) drops.push({t:'pill',o:pi}); }
  if((m.kind==='elite'&&R.chance(BAL.eliteDrop))||(m.kind==='boss')){
    const s=addRandomSkill(m.kind==='boss'?1:null); if(s) drops.push({t:'skill',o:s});
  }
  if((m.kind==='elite'&&R.chance(BAL.treasureElite))||(m.kind==='boss'&&R.chance(BAL.treasureBoss))){
    const tr=addRandomTreasure(); if(tr) drops.push({t:'treasure',o:tr});
  }
  if(hasFlag('killGrow')) addBonusHp(6);
  refreshHp();
  const dropHtml=drops.map(d=>{
    if(d.t==='pill'){ const o=d.o; return `<div class="card" style="cursor:default"><h4>${o.icon} ${o.name} ${qTag(o.q)}</h4><p>${o.d}</p></div>`; }
    if(d.t==='skill') return skillCard(d.o);
    return `<div class="card" style="cursor:default"><h4>${d.o.icon} ${d.o.name} ${qTag(d.o.q)}</h4><p>${d.o.d}</p></div>`;
  }).join('');
  $('panel').innerHTML=`
    <h2 class="title" style="color:var(--jade)">战 胜</h2>
    <p class="sub">${m.name} 化作灵光消散</p>
    <div class="kv"><span>灵石</span><b style="color:var(--gold)">+${stones}</b></div>
    <div class="kv"><span>灵气</span><b style="color:var(--jade)">+${m.qi}</b></div>
    ${drops.length?`<div class="hr"></div>${dropHtml}`:''}
    <button class="btn gold" onclick="afterBattleNext()">继续</button>`;
  flushPendingFromLog(); maybeOfferPending(); updateTopbar();
}
function battleLose(){
  const st=Combat.st;
  if(st.ctx.spar){
    p().hp=Math.max(1,Math.round(maxHp()*.3));
    $('panel').innerHTML=`
      <h2 class="title" style="color:var(--red)">切磋落败</h2>
      <p class="sub">对方收势及时："道友承让了。"你调息片刻，伤势无碍。（气血保留三成）</p>
      <button class="btn" onclick="finishNode()">继续赶路</button>`;
    updateTopbar(); return;
  }
  death();
}
function afterBattleNext(){
  pendingSkill=null; pendingTreasure=null;
  const m=run.mon;
  if(m&&(m.kind==='boss'||m.kind==='final')){
    if(run.floor===3){ victory(); return; }
    openBreakthrough(true); return;
  }
  finishNode();
}

function chooseEventOpt(i){

function eventBattleGo(kind){

  else if(kind==='bounty'){ run.mon=makeMonster('elite',run.floor); startBattleWith({bounty:true}); }

function startBattleWith(ctx){

function openShop(){
  if(!run.shopStock) run.shopStock=genShop();
  show('shop');
}
function shopPrice(base){ return Math.max(5,Math.round(base*p().shopDis)); }
function genShop(){
  const f=run.floor, pm=BAL.shop.priceMul[f];
  const sq=Math.max(0,Math.min(4,qualityRoll(f)+1));
  let pool=[...SKILLS,...PASSIVES].filter(s=>!p().skills.includes(s.id)&&!p().passives.includes(s.id));
  let cand=pool.filter(s=>s.q>=sq); if(!cand.length) cand=pool;
  const s1=cand.length?R.pick(cand):null;
  const tpool=TREASURES.filter(t=>!p().treasures.includes(t.id));
  const t1=tpool.length?R.pick(tpool):null;
  const p1=R.pick(PILLS), p2=R.pick(PILLS);
  return [
    {kind:'skill', item:s1, price:Math.round((45+s1.q*50)*pm)},
    {kind:'treasure', item:t1, price:Math.round((110+t1.q*55)*pm)},
    {kind:'pill', item:p1, price:Math.round((24+p1.q*18)*pm)},
    {kind:'pill', item:p2, price:Math.round((24+p2.q*18)*pm)},
    {kind:'affix', item:null, price:Math.round(75*pm)},
  ];
}
function renderShop(){
  const st=run.shopStock;
  const rerollCost=shopPrice(BAL.shop.reroll*(run.floor+1));
  $('panel').innerHTML=`
    <h2 class="title">🏪 散修坊市</h2>
    <p class="sub">灵石 ${p().stones} · 买卖不问出处</p>
    ${st.map((s,i)=>{
      if(!s.item) return '';
      if(s.kind==='skill') return `<div class="card" onclick="buyShop(${i})"><h4>${s.item.name} ${qTag(s.item.q)}<span class="q q4">￥${shopPrice(s.price)}</span></h4><p>${s.item.d}</p></div>`;
      if(s.kind==='treasure') return `<div class="card" onclick="buyShop(${i})"><h4>${s.item.icon} ${s.item.name} ${qTag(s.item.q)}<span class="q q4">￥${shopPrice(s.price)}</span></h4><p>${s.item.d}</p></div>`;
      if(s.kind==='pill') return `<div class="card" onclick="buyShop(${i})"><h4>${s.item.icon} ${s.item.name} ${qTag(s.item.q)}<span class="q q4">￥${shopPrice(s.price)}</span></h4><p>${s.item.d}</p></div>`;
      return `<div class="card" onclick="buyShop(${i})"><h4>💠 洗髓石<span class="q q4">￥${shopPrice(s.price)}</span></h4><p>服用后随机领悟一条词条。</p></div>`;
    }).join('')}
    <div class="row">
      <button class="btn small" onclick="rerollShop()">🔄 换一批（￥${rerollCost}）</button>
      <button class="btn small" onclick="finishNode()">离开坊市</button>
    </div>`;
  updateTopbar();
}
function buyShop(i){
  const s=run.shopStock[i];
  const cost=shopPrice(s.price);
  if(p().stones<cost){ toast('灵石不足'); return; }
  if(s.kind==='skill'){
    p().stones-=cost;
    Meta.codex('skill',s.item.id);
    if(s.item.type==='active'){ if(p().skills.length<SKILL_SLOTS){p().skills.push(s.item.id); toast(`习得【${s.item.name}】`);} else { pendingSkill=s.item; } }
    else { if(p().passives.length<PASSIVE_SLOTS){p().passives.push(s.item.id); toast(`领悟【${s.item.name}】`);} else { pendingSkill=s.item; } }
  }else if(s.kind==='treasure'){
    p().stones-=cost;
    Meta.codex('treasure',s.item.id);
    if(p().treasures.length<treSlots()){ p().treasures.push(s.item.id); afterTreasure(s.item); toast(`祭炼法宝【${s.item.name}】`); }
    else pendingTreasure=s.item;
  }else if(s.kind==='pill'){
    const got=addRandomPill(s.item.id);
    if(!got){ toast('丹药格已满'); return; }
    p().stones-=cost; toast(`购得【${s.item.name}】`);
  }else{
    p().stones-=cost; const a=addRandomAffix(); toast(`洗髓成功，领悟词条【${a.name}】`);
  }
  s.item=null; s.sold=true;
  refreshHp(); maybeOfferPending(); renderShop();
}
function rerollShop(){
  const cost=shopPrice(BAL.shop.reroll*(run.floor+1));
  if(p().stones<cost){ toast('灵石不足'); return; }
  p().stones-=cost; run.shopStock=genShop(); renderShop();
}

function gambleRate(){ return Math.min(95, BAL.gambleBase+p().gambleBonus+p().gambleStack*15); }
function openBreakthrough(fromBoss){

function renderBreakthrough(){
  const pv=p();
  $('panel').innerHTML=`
    <h2 class="title">⚡ 境界突破</h2>
    <p class="sub">天地灵气灌体，经脉如江河奔涌——</p>
    <div class="bigroot">
      <p style="letter-spacing:4px;color:var(--ink2)">当前境界</p>
      <h1 style="color:var(--purple)">${BAL.realmName[pv.realm]}</h1>
      <p>↓ 突破后 <b style="color:var(--gold)">${BAL.realmName[pv.realm+1]||'——'}</b> · 全属性大幅提升并疗愈至圆满</p>
    </div>
    <div class="card" onclick="doBreakthrough(false)">
      <h4>🧘 稳健突破 <span class="tag jade">100% 成功</span></h4>
      <p>水磨工夫，稳扎稳打。突破后领悟 1 条随机词条。</p>
    </div>
    <div class="card" onclick="doBreakthrough(true)">
      <h4>🔥 搏命突破 <span class="tag red">${gambleRate()}% 成功</span>${pv.gambleStack?`<span class="tag gold">破境丹×${pv.gambleStack}</span>`:''}</h4>
      <p>逆天而行！成功则领悟 <b>2 条</b>词条；失败则重伤（气血-60%）并可能遗忘一门功法。</p>
    </div>`;
}
let btPicks=0;
function doBreakthrough(gamble){
  const pv=p();
  if(gamble){
    if(R.chance(gambleRate()/100)){
      btPicks=2;
      showModal(`<h3>突破成功！</h3><p>冥冥中有天音颂道——你赌赢了！<b>可领悟两条词条！</b></p>`);
      setTimeout(affixPickModal,350);
    }else{
      pv.hp=Math.max(1,Math.round(pv.hp*BAL.gambleFailHp));
      const lost=loseRandomSkill();
      btPicks=1;
      hideModal();
      showModal(`<h3 style="color:var(--red)">突破失败！</h3>
        <p>灵气反噬，经脉剧痛！你重重跌落，气血只剩四成。${lost?`<b>功法【${lost.name}】随之散佚。</b>`:''}<br>万幸道基未损，仍可领悟一条词条。</p>
        <button class="btn" onclick="hideModal();affixPickModal()">唉声叹气</button>`);
      updateTopbar();
    }
    pv.gambleStack=0;
  }else{
    btPicks=1; affixPickModal();
  }
}
function affixPickModal(){
  const opts=R.sample(AFFIXES,3);
  showModal(`<h3>天道酬勤 · 领悟词条</h3>
    <p class="small-note">选择一条刻入道基（剩余 ${btPicks} 条）</p>
    ${opts.map((a,i)=>`<div class="card" onclick="pickAffix(${i})"><h4>${a.name}</h4><p>${a.d}</p></div>`).join('')}`);
  window._affixOpts=opts;
}
function pickAffix(i){
  const a=window._affixOpts[i];
  p().affixes[a.id]=(p().affixes[a.id]||0)+1;
  btPicks--;
  refreshHp();
  if(btPicks>0){ affixPickModal(); return; }
  hideModal(); completeBreakthrough();
}
function completeBreakthrough(){
  const pv=p();
  pv.qi=Math.max(0,pv.qi-BAL.qiNeed[pv.realm]);
  pv.realm++;
  computeBase(pv); refreshHp(); fullHeal();
  toast(`突破成功！当前境界：${BAL.realmName[pv.realm]}`);
  if(run.breakFromBoss){
    run.floor++; run.map=genMap(run.floor); run.shopStock=null; run.breakFromBoss=false;
    Run.save(); show('map');
  }else{
    Run.save(); show('map');
  }
}

/* ============================================================
   场景：道陨 / 飞升 结算
   ============================================================ */
function death(){
  run.won=false;
  const pts=calcDao();
  Meta.d.dao+=pts;
  Meta.d.stats.bestRealm=Math.max(Meta.d.stats.bestRealm,p().realm);
  Meta.d.stats.killBest=Math.max(Meta.d.stats.killBest,p().kills);
  if(Meta.hasT('renxing')) Meta.d.keepStones=Math.round(p().stones*.1); else Meta.d.keepStones=0;
  Meta.save(); Run.clear();
  const s=p().stones, k=p().kills, realm=BAL.realmName[p().realm], name=p().name;
  run=null;
  scene='death';
  $('speedTag').style.display='none';
  $('panel').innerHTML=`
    <div class="death-title">道 陨</div>
    <p class="sub">${name} 兵解于 ${realm}，一身修为化为齑粉。</p>
    <div class="kv"><span>最终境界</span><b>${realm}</b></div>
    <div class="kv"><span>斩杀妖兽</span><b>${k}</b></div>
    <div class="kv"><span>结余灵石</span><b>${s}</b></div>
    <div class="hr"></div>
    <div class="kv"><span>参悟天道</span><b style="color:var(--gold)">悟道点 +${pts}</b></div>
    ${Meta.d.keepStones?`<div class="kv"><span>韧性天赋</span><b>下局继承灵石 ${Meta.d.keepStones}</b></div>`:''}
    <p class="small-note">肉鸽轮回：局内数据已清空，悟道点与图鉴永久保留。</p>
    <button class="btn gold" onclick="show('title')">转世重修</button>`;
}
function victory(){
  run.won=true;
  const pts=calcDao();
  Meta.d.dao+=pts; Meta.d.stats.wins++;
  Meta.d.stats.bestRealm=Math.max(Meta.d.stats.bestRealm,3);
  Meta.save(); Run.clear();
  const k=p().kills, s=p().stones, name=p().name;
  run=null;
  scene='victory';
  $('speedTag').style.display='none';
  $('panel').innerHTML=`
    <div class="victory-title">飞 升</div>
    <p class="sub">劫雷散尽，天门大开。${name} 踏光而去，位列仙班！</p>
    <div class="kv"><span>斩杀妖兽</span><b>${k}</b></div>
    <div class="kv"><span>结余灵石</span><b>${s}</b></div>
    <div class="hr"></div>
    <div class="kv"><span>功德圆满</span><b style="color:var(--gold)">悟道点 +${pts}</b></div>
    <button class="btn gold" onclick="show('title')">再入轮回</button>`;
}

/* ============================================================
   场景：传承天赋 / 图鉴 / 指南
   ============================================================ */
function openTalents(){ scene='talents'; renderTalents(); $('topbar').classList.toggle('on',!!run); }
function renderTalents(){
  $('panel').innerHTML=`
    <h2 class="title">传 承 天 赋</h2>
    <p class="sub">悟道点 ${Meta.d.dao} · 天赋永久生效，影响每次开局</p>
    <div class="grid">
      ${TALENTS.map(t=>{
        const owned=Meta.hasT(t.id), can=Meta.d.dao>=t.cost&&!owned;
        return `<div class="card ${owned?'sel':can?'':'dis'}" onclick="${owned?'':`buyTalent('${t.id}')`}">
          <h4>${t.icon} ${t.name} ${owned?'<span class="tag jade">已领悟</span>':`<span class="q q4">◈${t.cost}</span>`}</h4>
          <p>${t.d}</p></div>`;}).join('')}
    </div>
    <button class="btn" onclick="show('title')">返回</button>`;
}
function buyTalent(id){
  const t=TALENTS.find(x=>x.id===id);
  if(Meta.buyTalent(t)){ toast(`天赋【${t.name}】已领悟！`); renderTalents(); }
  else toast('悟道点不足');
}
function openCodex(){ scene='codex'; codexTab='monster'; codexFrom=run?'map':'title'; renderCodex(); }
let codexTab='monster', codexFrom='title';
function codexBack(){ show(run?'map':'title'); }
function renderCodex(){
  const tabs=[['monster','妖兽'],['skill','功法'],['treasure','法宝'],['event','奇遇']];
  const list=codexTab==='monster'?MONSTERS: codexTab==='skill'?[...SKILLS,...PASSIVES]: codexTab==='treasure'?TREASURES:EVENTS;
  const unlocked=Meta.d.codex[codexTab]||[];
  $('panel').innerHTML=`
    <h2 class="title">修 行 图 鉴</h2>
    <p class="sub">已解锁 ${unlocked.length} / ${list.length}（首次解锁悟道点+${BAL.dao.codex}）</p>
    <div class="row">${tabs.map(([k,n])=>`<button class="btn small ${k===codexTab?'gold':''}" onclick="switchCodex('${k}')">${n}</button>`).join('')}</div>
    <div class="grid">
      ${list.map(it=>{
        const has=unlocked.includes(it.id);
        if(codexTab==='monster') return `<div class="card ${has?'':'locked'}" style="cursor:default">
          <h4>${has?it.name:'？？？'} <span class="tag">${BAL.realmName[it.realm]}</span></h4>
          <p>${has?it.d:'尚未遭遇'}</p></div>`;
        if(codexTab==='skill') return `<div class="card ${has?'':'locked'}" style="cursor:default">
          <h4>${has?it.name:'？？？'} ${has?qTag(it.q):''}</h4><p>${has?it.d:'尚未习得'}</p></div>`;
        if(codexTab==='treasure') return `<div class="card ${has?'':'locked'}" style="cursor:default">
          <h4>${has?it.icon+' '+it.name:'？？？'} ${has?qTag(it.q):''}</h4><p>${has?it.d:'尚未获得'}</p></div>`;
        return `<div class="card ${has?'':'locked'}" style="cursor:default">
          <h4>${has?it.icon+' '+it.name:'？？？'}</h4><p>${has?it.t:'尚未触发'}</p></div>`;
      }).join('')}
    </div>
    <button class="btn" onclick="codexBack()">返回</button>`;
}
function switchCodex(k){ codexTab=k; renderCodex(); }
function openHelp(){
  scene='help';
  $('panel').innerHTML=`
    <h2 class="title">修 行 指 南</h2>
    <div class="card" style="cursor:default"><h4>🎯 目标</h4><p>从炼气一路斩妖突破，历四层试炼，斩杀天劫兽即飞升。中途道陨则本局清空，悟道点与图鉴永久保留。</p></div>
    <div class="card" style="cursor:default"><h4>⚔️ 战斗</h4><p>自动回合制：按速度轮流出手，功法冷却好了自动施展。战前可看预估、服丹药；战中每回合可服一次丹药；打不过可以跑（妖王除外）。</p></div>
    <div class="card" style="cursor:default"><h4>⚡ 突破</h4><p>击杀得灵气，灵气圆满可就地突破，属性暴涨。突破时敢选<b>搏命突破</b>：成功率约七成，成功双词条，失败重伤！破境丹可提高成功率。</p></div>
    <div class="card" style="cursor:default"><h4>🗺️ 地图</h4><p>每层随机生成。⚔️妖兽 / 💀精英(掉宝率高) / ❓奇遇(赌) / 🏪坊市 / 🌿药园 / 🎁宝箱，层末👑妖王必战。</p></div>
    <div class="card" style="cursor:default"><h4>💠 Build</h4><p>灵根决定五行功法加成（同属性功法伤害+20%）；词条可叠加成流派：暴击流、吸血流、反伤流、灼烧流……功法3格+心法3格+法宝若干，自由取舍。</p></div>
    <button class="btn" onclick="show('title')">返回</button>`;
}

/* ============================================================
   RENDER 映射 / 事件绑定 / 入口
   ============================================================ */
const RENDER={
  title:renderTitle, chargen:renderChargen, map:renderMap, prebattle:renderPrebattle,
  battle:()=>{}, event:renderEvent, shop:renderShop, breakthrough:renderBreakthrough,
  herb:renderHerb, chest:renderChest,
  talents:renderTalents, codex:renderCodex,
};
function flushPendingFromLog(){ flushLog(); }
cv.addEventListener('click',clickMap);
$('speedTag').addEventListener('click',e=>{
  const sp=e.target.dataset.sp;
  if(sp==null) return;
  speed=+sp;
  [...$('speedTag').children].forEach(c=>c.classList.toggle('on',+c.dataset.sp===speed));
  if(speed===0&&Combat.st&&!Combat.st.over) battleLoop(); // 跳过模式立即结算
});

/* ---------- DEBUG（控制台使用：DEBUG.heal() 等） ---------- */
window.DEBUG={
  stones(n=999){ if(p())p().stones+=n; updateTopbar(); },
  heal(){ if(p())fullHeal(); updateTopbar(); },
  qi(n=999){ if(p())p().qi+=n; updateTopbar(); },
  realm(n=3){ if(!p())return; p().realm=n; computeBase(p()); refreshHp(); fullHeal(); updateTopbar(); },
  goto(f){ if(!run)return; run.floor=Math.min(3,Math.max(0,f)); run.map=genMap(run.floor); show('map'); },
  win(){ if(run)victory(); },
  affix(){ if(p()){addRandomAffix(); refreshHp();} },
  treasure(){ if(p())addRandomTreasure(); },
  sim(n=200){ // 快速平衡模拟：当前面板 vs 本层随机怪
    let w=0;
    for(let i=0;i<n;i++){
      const st=Combat.build(makeMonster('normal',run?run.floor:0),{});
      st.pl.hp=st.pl.hpMax; st.pl.revives=0; st.en.revives=0;
      let guard=0; while(!st.over&&guard++<300) Combat.step();
      if(st.winner==='pl') w++;
    }
    return `胜率 ${Math.round(w/n*100)}%`;
  },
};

/* ---------- 启动 ---------- */
Meta.load();
if(Meta.d.keepStones===undefined) Meta.d.keepStones=0;
requestAnimationFrame(loop);
show('title');
