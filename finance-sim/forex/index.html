<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh;
    background:radial-gradient(120% 90% at 50% 0%, #16241a 0%, #0a120c 55%, #050805 100%);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;

  .pair .px { font-size:12px; color:#8aa06a; margin-top:2px; }

  .lev .lr { color:#e0a060; font-weight:700; }

  .lev button { padding:5px 10px; font-size:12px; margin-left:6px; }
  .chart-wrap { position:relative; height:170px; background:#0a1408; border:1px solid #2e4a20;
    border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .idx { font-size:12px; color:#8aa06a; background:#12200e; border:1px solid #2e4a20;
    border-radius:8px; padding:8px 11px; margin-bottom:10px; line-height:1.7; }
  .idx b { color:#e0f0c0; font-size:14px; }
  .idx .up { color:#e07070; }
  .idx .down { color:#70c070; }
  .row2 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .row2 label { font-size:12px; color:#8aa06a; }
  .order { background:#0f1c0c; border:1px solid #2e4a20; border-radius:10px; padding:12px; margin-top:10px; }
  .order .orow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:9px; }
  .order .orow span { font-size:12px; color:#8aa06a; min-width:52px; }
  .tag { display:inline-block; font-size:10px; padding:1px 6px; border-radius:4px;
    background:#2a3a1a; color:#a8c080; margin-left:5px; }
  .tag.long { background:#3a1a1a; color:#e09090; }
  .tag.short { background:#1a2a3a; color:#90b0e0; }
  .ver { text-align:center; font-size:10px; color:#4a5a4a; margin-top:18px; }
  .pop { position:fixed; inset:0; background:rgba(0,0,0,.78); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:100; }
  .pop .box { background:linear-gradient(160deg,#1a2814,#0e1610); border:1px solid #4a6a2a;
    border-radius:14px; padding:20px 18px; max-width:380px; width:100%; line-height:1.8; font-size:13px; }
  .pop .box h3 { margin-top:0; font-size:16px; color:#a8d060; }
  .pop .box button { width:100%; margin-top:14px; }

<body>
<a class="back" href="../">← 回理财模拟</a>
<h1>💱 时光机炒外汇</h1>
<div class="sub">2000 年开局 · 真实历史汇率回放 · 虚拟资金</div>
<div class="warn">⚠️ 本游戏模拟的是：<b>加杠杆会死人</b>。真实外汇市场不讲情面——<b>别拿生活费去赌</b>。</div>

<div class="panel">
  <div class="toprow">
    <div class="date" id="curDate">—</div>
    <div style="text-align:right">
      <div class="cash">现金 <b id="cash">¥10,000</b></div>
      <div class="asset">净资产 <b id="netWorth">¥10,000</b></div>
      <div class="asset">已用保证金 <b id="usedMargin">¥0</b></div>
    </div>
  </div>
  <div class="ctrl">
    <button id="stepBtn">▶ 下一天</button>
    <select id="stepMode">
      <option value="day">每次 +1 天</option>
      <option value="week">每次 +1 周</option>
      <option value="month">每次 +1 月</option>
    </select>
    <button id="resetBtn">↻ 重开</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="panel">
  <h3>📉 行情</h3>
  <div class="idx" id="idxBox">—</div>
  <div class="chart-wrap"><canvas id="chart" style="width:100%;height:100%"></canvas></div>
  <div id="pairList"></div>
  <div class="order" id="orderBox" style="display:none">
    <div class="orow">
      <span>方向</span>
      <select id="dirSel"><option value="long">做多</option><option value="short">做空</option></select>
      <span>杠杆</span>
      <select id="levSel">
        <option value="1">1 倍（全款）</option>
        <option value="5">5 倍</option>
        <option value="10">10 倍</option>
        <option value="25">25 倍（日本法定上限）</option>
        <option value="50">50 倍</option>
        <option value="56">56 倍</option>
      </select>
    </div>
    <div class="orow">
      <span>保证金</span>
      <input id="marginAmt" type="number" min="1" placeholder="人民币金额" style="flex:1">
      <button id="maxBtn">全部</button>
    </div>
    <div class="orow">
      <button id="openBtn" style="flex:1">开仓</button>
    </div>
    <div style="font-size:11px;color:#6a7a4a;line-height:1.7">
      名义仓位 = 保证金 × 杠杆。强平价按维持保证金率分档计算。<br>
      融资利息按日计（年化 12%），从保证金里扣，扣光即爆仓。
    </div>
  </div>
</div>

<div class="panel">
  <h3>⚡ 持仓 <span style="font-size:11px;color:#a08080;font-weight:400">（借来的钱也在打，赢十倍、输光光）</span></h3>
  <div id="levBody"><div style="color:#6a7a4a;font-size:13px">暂无持仓</div></div>
</div>

<div class="ver">v1.0.0-真实版 20261024</div>

<script>
(function(){
'use strict';

/* ============ 数据加载 ============ */
var FX = null;
var PAIRS = [];
var state = { i:0, cash:10000, pos:[], log:[], over:false };

var LEV_RATE_YEAR = 0.12;
var LEV_RATE_DAY = LEV_RATE_YEAR / 365;
var LIQ_FEE = 0.005;

function levMR(L){
  if(L<=1)  return 0.05;
  if(L<=5)  return 0.02;
  if(L<=10) return 0.01;
  if(L<=25) return 0.005;
  if(L<=50) return 0.0025;
  return 0.002;      // 56 倍
}

function fmt(n, d){
  if(!isFinite(n)) return '—';
  return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d==null?2:d, maximumFractionDigits:d==null?2:d});
}
function pct(n){ return (n>=0?'+':'') + (n*100).toFixed(2) + '%'; }

/* ============ 加载数据 ============ */
fetch('fx-data.json').then(function(r){ return r.json(); }).then(function(d){
  FX = d.pairs;
  PAIRS = Object.keys(FX);
  initState();
  renderAll();
}).catch(function(e){
  document.getElementById('msg').textContent = '数据加载失败：' + e.message;
});

function initState(){
  state = { i:0, cash:10000, pos:[], log:[], over:false };
  document.getElementById('msg').textContent = '';
}

/* 当前日期（真实版 = 数据里的真实日期） */
function curDate(){
  var p = FX[PAIRS[0]];
  if(!p || !p.dates.length) return '';
  return p.dates[Math.min(state.i, p.dates.length-1)];
}

/* 某货币对在 index 处的价格 */
function priceAt(pairCode, idx){
  var p = FX[pairCode];
  if(!p) return null;
  idx = Math.max(0, Math.min(idx, p.rates.length-1));
  return p.rates[idx];
}

/* 某货币对在第 idx 天的涨跌幅 */
function changeAt(pairCode, idx){
  if(idx <= 0) return 0;
  var a = priceAt(pairCode, idx-1), b = priceAt(pairCode, idx);
  if(!a) return 0;
  return (b-a)/a;
}

/* ============ 渲染 ============ */
function renderAll(){
  renderTop();
  renderIndex();
  renderPairs();
  renderChart();
  renderPositions();
}

function renderTop(){
  document.getElementById('curDate').textContent = curDate();
  document.getElementById('cash').textContent = '¥' + fmt(state.cash);
  document.getElementById('netWorth').textContent = '¥' + fmt(netWorth());
  var used = 0;
  for(var i=0;i<state.pos.length;i++) used += state.pos[i].margin;
  document.getElementById('usedMargin').textContent = '¥' + fmt(used);
}

function netWorth(){
  var v = state.cash;
  for(var i=0;i<state.pos.length;i++){
    var p = state.pos[i];
    v += p.margin + pnl(p);
  }
  return v;
}

function pnl(p){
  var cur = priceAt(p.pair, state.i);
  if(cur == null) return 0;
  var diff = cur - p.entry;
  if(p.dir === 'short') diff = -diff;
  return p.units * diff;
}

function renderIndex(){
  var box = document.getElementById('idxBox');
  if(!PAIRS.length){ box.textContent = '—'; return; }
  // 显示选中的货币对，默认第一个
  var code = curPairCode || PAIRS[0];
  var p = FX[code];
  var cur = priceAt(code, state.i);
  var chg = changeAt(code, state.i);
  var cls = chg > 0 ? 'up' : (chg < 0 ? 'down' : '');
  box.innerHTML = '<b>' + code + '</b>　<span class="' + cls + '">' + fmt(cur, code.indexOf('JPY')>0?3:5) + '　' +
    (chg>=0?'▲':'▼') + pct(chg) + '</span>' +
    '<br><span style="font-size:11px">区间 ' + fmt(p.min,4) + ' ~ ' + fmt(p.max,4) + '　共 ' + p.count + ' 个交易日</span>';
}

var curPairCode = null;

function renderPairs(){
  var box = document.getElementById('pairList');
  if(!PAIRS.length){ box.innerHTML = ''; return; }
  var html = '';
  for(var i=0;i<PAIRS.length;i++){
    var code = PAIRS[i];
    var cur = priceAt(code, state.i);
    var chg = changeAt(code, state.i);
    var cls = chg > 0 ? 'up' : (chg < 0 ? 'down' : '');
    var sel = (curPairCode === code) ? ' sel' : '';
    html += '<div class="pair' + sel + '" data-code="' + code + '">' +
      '<div><div class="nm">' + code + '</div>' +
      '<div class="px">现价 <b>' + fmt(cur, code.indexOf('JPY')>0?3:5) + '</b></div></div>' +
      '<div class="chg ' + cls + '">' + (chg>=0?'+':'') + (chg*100).toFixed(2) + '%</div></div>';
  }
  box.innerHTML = html;
  var els = box.querySelectorAll('.pair');
  for(var j=0;j<els.length;j++){
    els[j].addEventListener('click', function(){
      curPairCode = this.getAttribute('data-code');
      renderAll();
      document.getElementById('orderBox').style.display = '';
    });
  }
}

/* 简单走势图（最近 90 天） */
function renderChart(){
  var cv = document.getElementById('chart');
  if(!cv) return;
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  var code = curPairCode || PAIRS[0];
  if(!code) return;
  var p = FX[code];
  var N = 90;
  var start = Math.max(0, state.i - N + 1);
  var vals = [];
  for(var i=start;i<=state.i;i++) vals.push(p.rates[i]);
  if(vals.length < 2) return;

  var mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals);
  var pad = (mx-mn) * 0.15 || 0.001;
  mx += pad; mn -= pad;

  ctx.beginPath();
  for(var k=0;k<vals.length;k++){
    var x = (k/(vals.length-1)) * (w-8) + 4;
    var y = h - 8 - ((vals[k]-mn)/(mx-mn)) * (h-16);
    if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  var rising = vals[vals.length-1] >= vals[0];
  ctx.strokeStyle = rising ? '#e07070' : '#70c070';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  // 填充
  ctx.lineTo(w-4, h-8); ctx.lineTo(4, h-8); ctx.closePath();
  ctx.fillStyle = rising ? 'rgba(224,112,112,0.12)' : 'rgba(112,192,112,0.12)';
  ctx.fill();

  // 价格刻度
  ctx.fillStyle = '#6a7a4a';
  ctx.font = '10px sans-serif';
  ctx.fillText(fmt(mx,4), 6, 12);
  ctx.fillText(fmt(mn,4), 6, h-4);
}

function renderPositions(){
  var box = document.getElementById('levBody');
  if(!state.pos.length){
    box.innerHTML = '<div style="color:#6a7a4a;font-size:13px">暂无持仓</div>';
    return;
  }
  var html = '';
  for(var i=0;i<state.pos.length;i++){
    var p = state.pos[i];
    var cur = priceAt(p.pair, state.i);
    var g = pnl(p);
    var rate = g / p.margin;
    var dirTxt = p.dir === 'long' ? '<span class="tag long">做多</span>' : '<span class="tag short">做空</span>';
    html += '<div class="lev">' + p.pair + ' ' + dirTxt + ' <span class="lr">' + p.L + '×</span>　' +
      '保证金 ¥' + fmt(p.margin) + '<br>' +
      '开仓 ' + fmt(p.entry, p.pair.indexOf('JPY')>0?3:5) + ' → 现价 ' + fmt(cur, p.pair.indexOf('JPY')>0?3:5) + '<br>' +
      '浮动 <b style="color:' + (g>=0?'#90d070':'#e07070') + '">' + (g>=0?'+':'') + '¥' + fmt(g) + '（' + pct(rate) + '）</b><br>' +
      '<span class="liq">强平价 ' + fmt(liqPrice(p), p.pair.indexOf('JPY')>0?3:5) + '</span>' +
      '<button data-close="' + i + '">平仓</button></div>';
  }
  box.innerHTML = html;
  var btns = box.querySelectorAll('button[data-close]');
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener('click', function(){
      closePos(parseInt(this.getAttribute('data-close'),10));
    });
  }
}

/* 强平价：多 = 开仓价 × (1 − 1/L + MR)；空 = 开仓价 × (1 + 1/L − MR) */
function liqPrice(p){
  var mr = levMR(p.L);
  if(p.dir === 'long') return p.entry * (1 - 1/p.L + mr);
  return p.entry * (1 + 1/p.L - mr);
}

/* ============ 操作 ============ */
function setMsg(t, cls){
  var el = document.getElementById('msg');
  el.textContent = t;
  el.className = 'msg' + (cls?' '+cls:'');
}

function openPos(){
  if(state.over){ setMsg('已经爆仓出局，请重开','err'); return; }
  if(!curPairCode){ setMsg('先选一个货币对','err'); return; }
  var dir = document.getElementById('dirSel').value;
  var L = parseInt(document.getElementById('levSel').value,10) || 1;
  var margin = parseFloat(document.getElementById('marginAmt').value);
  if(!isFinite(margin) || margin <= 0){ setMsg('请输入有效的保证金金额','err'); return; }
  if(margin > state.cash + 0.001){ setMsg('保证金不能超过现金 ¥' + fmt(state.cash),'err'); return; }

  var entry = priceAt(curPairCode, state.i);
  var units = (margin * L) / entry;     // 名义仓位 / 价格 = 单位数

  state.cash -= margin;
  state.pos.push({
    pair: curPairCode, dir: dir, L: L, margin: margin,
    entry: entry, units: units, lastDay: state.i
  });
  document.getElementById('marginAmt').value = '';
  setMsg('已用 ' + L + ' 倍杠杆' + (dir==='long'?'做多':'做空') + ' ' + curPairCode +
    '，保证金 ¥' + fmt(margin) + '；强平价 ' + fmt(liqPrice(state.pos[state.pos.length-1]),5), 'ok');
  renderAll();
}

function closePos(idx){
  var p = state.pos[idx];
  if(!p) return;
  var g = pnl(p);
  var back = p.margin + g - Math.abs(p.margin * LIQ_FEE);
  state.cash += Math.max(0, back);
  state.pos.splice(idx,1);
  setMsg('平仓 ' + p.pair + '，结算 ¥' + fmt(back) + '（浮动 ' + (g>=0?'+':'') + '¥' + fmt(g) + '）', g>=0?'ok':'');
  renderAll();
}

/* 推进 */
function advance(){
  if(state.over) return;
  var mode = document.getElementById('stepMode').value;
  var step = 1;
  if(mode === 'week') step = 5;
  else if(mode === 'month') step = 21;

  var maxLen = 1e9;
  for(var i=0;i<PAIRS.length;i++) maxLen = Math.min(maxLen, FX[PAIRS[i]].rates.length);

  var target = Math.min(state.i + step, maxLen - 1);

  // 逐日推进（逐日结算利息、检查爆仓）
  while(state.i < target && !state.over){
    state.i++;
    settleDay();
  }
  renderAll();
}

function settleDay(){
  // 1) 融资利息
  for(var i=state.pos.length-1;i>=0;i--){
    var p = state.pos[i];
    if(p.L <= 1 && p.dir === 'long') continue;
    var days = state.i - (p.lastDay || state.i);
    if(days <= 0) continue;
    var notional = p.margin * p.L;
    var interest = notional * LEV_RATE_DAY * days;
    p.margin -= interest;
    p.lastDay = state.i;
    if(p.margin <= 0){
      state.pos.splice(i,1);
      setMsg(curDate() + ' 【利息爆仓】' + p.pair + ' · 融资利息吃光保证金','err');
    }
  }

  // 2) 检查强平
  for(var j=state.pos.length-1;j>=0;j--){
    var q = state.pos[j];
    var cur = priceAt(q.pair, state.i);
    var liq = liqPrice(q);
    var hit = (q.dir === 'long') ? (cur <= liq) : (cur >= liq);
    if(hit){
      state.pos.splice(j,1);
      // 强平：本金归零，还要扣违约金
      state.cash = Math.max(0, state.cash - q.margin * LIQ_FEE);
      setMsg(curDate() + ' 【爆仓·强平】' + q.pair + ' ' + q.L + '× · 触发强平价 ' +
        fmt(liq,5) + '，保证金 ¥' + fmt(q.margin) + ' 全部亏光','err');
    }
  }

  // 3) 破产判定
  if(state.cash <= 0 && state.pos.length === 0){
    state.over = true;
    setMsg('💀 资金归零，游戏结束。点「重开」再来一局。','err');
    document.getElementById('stepBtn').disabled = true;
  }
}

/* ============ 事件 ============ */
document.getElementById('stepBtn').addEventListener('click', advance);
document.getElementById('resetBtn').addEventListener('click', function(){
  initState();
  state.i = 0;
  curPairCode = null;
  document.getElementById('stepBtn').disabled = false;
  document.getElementById('orderBox').style.display = 'none';
  renderAll();
  setMsg('已重开，2000 年出发');
});
document.getElementById('openBtn').addEventListener('click', openPos);
document.getElementById('maxBtn').addEventListener('click', function(){
  document.getElementById('marginAmt').value = Math.floor(state.cash);
});

window.addEventListener('resize', renderChart);

})();
