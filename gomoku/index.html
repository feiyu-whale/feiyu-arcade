<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>肥鱼五子棋 🐳</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(160deg, #0a1628 0%, #123 60%, #0a1f33 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #dbeafe; padding: 12px; user-select: none;
  }
  h1 { font-size: 20px; margin: 4px 0 10px; color: #8fd0ff; font-weight: 600; letter-spacing: 1px; }
  #status { min-height: 26px; font-size: 15px; margin-bottom: 10px; color: #bcdcff; display: flex; align-items: center; gap: 6px; }
  #status b { color: #ffd86b; }
  #board-wrap { position: relative; background: #e8b96a; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.5), inset 0 0 0 2px #c99a4e; padding: 14px; max-width: 96vw; }
  /* 地狱档：扭曲的天使恶魔在棋盘顶部盯着 */
  .spirit {
    position: absolute; top: -30px; width: 46px; height: 70px; z-index: 3;
    opacity: 0; pointer-events: none; transition: opacity .8s;
  }
  .spirit.show { opacity: .9; }
  .spirit-demon { left: 8%; animation: spiritWarp 2.2s ease-in-out infinite; }
  .spirit-angel { right: 8%; animation: spiritWarp 2.6s ease-in-out infinite reverse; }
  .spirit svg { overflow: visible; }
  .spirit .halo {
    position: absolute; top: -6px; left: 50%; width: 26px; height: 8px;
    transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(circle, #fff, rgba(255,255,255,0));
    box-shadow: 0 0 12px #cfe9ff;
    animation: haloPulse 2.6s ease-in-out infinite;
  }
  @keyframes spiritWarp {
    0%   { transform: skewX(0deg) scale(1); filter: blur(0) drop-shadow(0 0 6px rgba(0,0,0,.6)); }
    50%  { transform: skewX(6deg) scale(1.06,0.96); filter: blur(1px) drop-shadow(0 0 10px rgba(160,0,0,.7)); }
    100% { transform: skewX(0deg) scale(1); filter: blur(0) drop-shadow(0 0 6px rgba(0,0,0,.6)); }
  }
  @keyframes haloPulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  /* 旧日污染：难度档逐个消失 */
  .diff.vanish { animation: diffVanish .5s forwards; }
  @keyframes diffVanish {
    0% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
    60% { transform: scale(1.2) rotate(-6deg); filter: blur(1px); }
    100% { opacity: 0; transform: scale(.1) rotate(20deg); filter: blur(6px) hue-rotate(120deg); }
  }
  .diff.gone, #undoBtn.gone { display: none !important; }
  /* 天堂?地狱? 档：其他难度被“血”盖住，不可点（位置不变） */
  #diffBar.blood-locked button.diff {
    pointer-events: none; cursor: not-allowed;
    filter: grayscale(.3) brightness(.6);
  }
  #diffBar.blood-locked button.diff::after {
    content: ''; position: absolute; inset: 0; border-radius: 8px; pointer-events: none;
    background: linear-gradient(180deg, rgba(120,0,0,.15), rgba(140,0,0,.75));
    box-shadow: inset 0 0 12px rgba(120,0,0,.9);
    animation: bloodSeep 2.2s ease-in-out infinite;
  }
  #diffBar.blood-locked { position: relative; }
  #diffBar.blood-locked button.diff { position: relative; }
  @keyframes bloodSeep { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  #diffBar.blood-locked::before {
    content: '🩸'; position: absolute; right: -4px; top: -14px; font-size: 14px; z-index: 5;
    animation: bloodDrop 2.2s ease-in infinite;
  }
  @keyframes bloodDrop { 0% { transform: translateY(-6px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(10px); opacity: 0; } }
  /* 悔棋按钮污染消失 */
  #undoBtn.polluted { animation: diffVanish .5s forwards; pointer-events: none; }
  /* 认输按钮：触手爬写 */
  #resignBtn { position: relative; overflow: hidden; }
  #resignBtn .tentacle {
    position: absolute; color: #7a1a8a; font-size: 12px; line-height: 1;
    pointer-events: none; opacity: 0; text-shadow: 0 0 6px #a020c0;
  }
  #resignBtn .tentacle.on { animation: tentacleCrawl .6s ease-out forwards; }
  @keyframes tentacleCrawl {
    0% { opacity: 0; transform: translateY(14px) scale(.5); }
    40% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: .9; transform: translateY(-2px) scale(1); }
  }
  #resignBtn.rewritten {
    background: #2a0a2a !important; border-color: #a020c0 !important; color: #e0a0ff !important;
    text-shadow: 0 0 8px #a020c0; letter-spacing: 2px;
    animation: resignGlow 1.6s ease-in-out infinite;
  }
  @keyframes resignGlow { 0%,100% { box-shadow: 0 0 6px #a020c0; } 50% { box-shadow: 0 0 18px #c040e0; } }
  /* 白饭彩蛋 */
  #riceEgg {
    position: absolute; left: 8px; top: 8px; z-index: 6; width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    cursor: grab; user-select: none; touch-action: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
  }
  #riceEgg:active { cursor: grabbing; }
  #riceEgg.gone { opacity: 0; pointer-events: none; transition: opacity .3s; }
  #riceEgg.hidden { opacity: 0; pointer-events: none; }
  /* 旧日：理智 + 呓语 + 渗血 */
  #elderOverlay {
    position: fixed; inset: 0; z-index: 97; display: none; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #1a0a1a 0%, #05000a 70%, #000 100%);
    --bleed: 0%;
  }
  #elderOverlay.on { display: block; animation: elderShake 0.15s steps(2) infinite; }
  #elderOverlay::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0;
    height: var(--bleed); transition: height .7s;
    background: linear-gradient(180deg, rgba(120,0,0,.1), rgba(120,0,0,.85));
  }
  @keyframes elderShake { 0% { transform: translate(0,0); } 50% { transform: translate(1px,-1px); } 100% { transform: translate(-1px,1px); } }
  #elderOverlay .elder-eye {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%,-50%);
    width: 200px; height: 130px; z-index: 2;
  }
  #elderOverlay .elder-eye svg { width: 100%; height: 100%; overflow: visible; }
  #elderOverlay .eye-sclera {
    animation: eyePulse 2.4s ease-in-out infinite;
    transform-origin: 100px 65px;
  }
  #elderOverlay .eye-pupil {
    animation: pupilWander 5s ease-in-out infinite;
    transition: transform .8s;
  }
  #elderOverlay .eye-iris { animation: irisSpin 8s linear infinite; transform-origin: 100px 65px; }
  @keyframes eyePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04,0.92); } }
  @keyframes pupilWander {
    0%   { transform: translate(0,0) scaleY(1); }
    25%  { transform: translate(-14px,-4px) scaleY(1); }
    50%  { transform: translate(12px,3px) scaleY(1.1); }
    75%  { transform: translate(-6px,6px) scaleY(.9); }
    100% { transform: translate(0,0) scaleY(1); }
  }
  @keyframes irisSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #elderOverlay .elder-title {
    position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
    color: #d0a0d0; font-size: 22px; letter-spacing: 8px; font-weight: 900;
    text-shadow: 0 0 16px #706;
  }
  #elderOverlay #elderGo {
    position: absolute; top: 62%; left: 50%; transform: translateX(-50%);
    padding: 14px 34px; font-size: 16px; letter-spacing: 3px; font-weight: 700;
    color: #fff; background: linear-gradient(90deg, #4a0a4a, #7a0a3a);
    border: 2px solid #b07ab0; border-radius: 30px; cursor: pointer; font-family: inherit;
    box-shadow: 0 0 20px rgba(160,0,160,.5); z-index: 3;
  }
  #elderOverlay #elderGo:active { transform: translateX(-50%) scale(.95); }
  #elderOverlay .whisper {
    position: absolute; color: #c8a8c8; font-size: 15px; letter-spacing: 2px;
    text-shadow: 0 0 10px #606; pointer-events: none; white-space: nowrap;
    animation: whisperFade 1.8s ease-out forwards;
  }
  @keyframes whisperFade {
    0% { opacity: 0; transform: scale(.8); filter: blur(2px); }
    30% { opacity: 1; transform: scale(1); filter: blur(0); }
    100% { opacity: 0; transform: scale(1.15) translateY(-16px); filter: blur(3px); }
  }
  #elderOverlay .san-wrap {
    position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
    width: 70%; max-width: 320px; text-align: center;
  }
  #elderOverlay .san-label { color: #e0b0b0; font-size: 14px; letter-spacing: 2px; margin-bottom: 6px; text-shadow: 0 0 8px #700; }
  #elderOverlay .san-track { height: 12px; border-radius: 6px; background: #2a0a0a; border: 1px solid #703; overflow: hidden; }
  #elderOverlay .san-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #a00, #f55); transition: width .7s; }
  @media (max-width: 420px){
    .spirit { width: 34px; height: 54px; top: -24px; }
    .spirit-demon { left: 6%; }
    .spirit-angel { right: 6%; }
  }
  canvas { display: block; touch-action: manipulation; cursor: pointer; max-width: 100%; height: auto; }
  .btns { margin-top: 14px; display: flex; gap: 10px; }
  .btns2 { margin-top: 8px; display: flex; gap: 10px; }
  button { background: #1c3d5a; color: #9fd8ff; border: 1px solid #2e6f9e; padding: 9px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: .15s; font-family: inherit; }
  button:active { background: #2a5a82; transform: scale(.96); }
  button.on { background: #2a6a3a; border-color: #48b06a; color: #b6f0c8; }
  button.diff.cur { background: #6a4a9a; border-color: #9a6ae0; color: #e0ccff; }
  button.diff { padding: 8px 12px; font-size: 13px; }
  .foot { margin-top: 12px; font-size: 12px; color: #5b7a99; }
  /* 广告弹窗（同三国那套） */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal.on { display: flex; }
  .adbox { width: 100%; max-width: 420px; background: #f4ecd8; color: #2a2015; border-radius: 14px; padding: 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .adbox h2 { margin: 0 0 6px; font-size: 22px; color: #b5542e; }
  .adbox .sub { font-size: 13px; color: #6a5a40; margin-bottom: 14px; }
  .adbox .body { font-size: 16px; line-height: 1.8; margin: 10px 0 16px; }
  .adbox .count { font-size: 13px; color: #8a7a5a; margin-bottom: 10px; }
  .adbox button { padding: 12px 20px; border-radius: 8px; border: none; background: #b5542e; color: #fff; font-size: 16px; cursor: pointer; width: 100%; font-family: inherit; }
  .adbox button:disabled { background: #bbb; cursor: not-allowed; }
  .adbox .tag { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: #e8dcc0; color: #7a5a2a; margin-bottom: 8px; }
  /* 结算弹窗 */
  #resultModal .adbox { background: #0f2233; color: #dbeafe; }
  #resultModal .adbox h2 { color: #ffd86b; }
  #resultModal .adbox .body { color: #bcdcff; }
  #resultModal .adbox button { background: #2a6a9e; }
  /* 地狱难度开场：半蓝天堂 / 半红地狱 */
  #hellOverlay {
    position: fixed; inset: 0; z-index: 80; display: none;
    align-items: center; justify-content: center;
    background: linear-gradient(90deg, #0a2a5a 0%, #123a7a 49%, #7a0000 51%, #3a0000 100%);
    opacity: 0; transition: opacity .35s;
  }
  #hellOverlay.on { display: flex; opacity: 1; }
  #hellOverlay::after {
    content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px;
    transform: translateX(-2px);
    background: linear-gradient(180deg, #9fd8ff, #fff, #ff8a8a);
    box-shadow: 0 0 20px rgba(255,255,255,.8);
  }
  #hellOverlay .hell-text { position: relative; text-align: center; animation: hellPulse .9s ease-in-out infinite alternate; padding: 0 20px; z-index: 2; }
  #hellOverlay .hell-half {
    position: absolute; top: 0; bottom: 0; width: 50%; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 7vh; opacity: .6; pointer-events: none;
  }
  #hellOverlay .hell-left  { left: 0;  background: linear-gradient(180deg, #1a2f52, #24406b); }
  #hellOverlay .hell-right { right: 0; background: linear-gradient(180deg, #5a1f1f, #3f2020); }
  #hellOverlay .hell-icon { font-size: 60px; filter: drop-shadow(0 0 12px rgba(255,255,255,.5)); }
  #hellOverlay .hell-label { margin-top: 6px; font-size: 18px; letter-spacing: 6px; font-weight: 700; }
  #hellOverlay .hell-left .hell-label { color: #c5d8ee; text-shadow: 0 0 10px #5a8fd0; }
  #hellOverlay .hell-right .hell-label { color: #ecc5c5; text-shadow: 0 0 10px #c05a5a; }
  #hellOverlay::after {
    content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 120px;
    transform: translateX(-60px);
    background: linear-gradient(90deg, rgba(60,90,160,0), rgba(140,120,170,.55), rgba(160,90,90,0));
    pointer-events: none;
  }
  #hellOverlay .hell-title {
    font-size: 28px; font-weight: 900; letter-spacing: 3px;
    color: #fff; text-shadow: 0 0 12px #6a9ad0, 0 0 24px #b06a6a, 0 2px 4px #000; font-family: inherit;
  }
  #hellOverlay .hell-sub { margin-top: 12px; font-size: 16px; letter-spacing: 4px; color: #ffe08a; text-shadow: 0 0 10px #a80; }
  #hellOverlay .hell-note { margin-top: 10px; font-size: 13px; letter-spacing: 2px; color: #cfe3ff; opacity: .85; }
  #hellStart {
    margin-top: 24px; padding: 14px 40px; font-size: 17px; letter-spacing: 4px;
    border-radius: 30px; cursor: pointer; font-family: inherit; font-weight: 700;
    color: #fff; border: 2px solid #fff;
    background: linear-gradient(90deg, #3a6aa0, #8a5a8a, #a05a5a);
    box-shadow: 0 0 16px rgba(180,150,180,.5); transition: .2s;
  }
  #hellStart:active { transform: scale(.95); filter: brightness(1.2); }
  /* 扭曲：半蓝半天堂 / 半红半地狱，相互拉扯抖动 */
  #hellWarp {
    position: fixed; inset: 0; z-index: 94; display: none; overflow: hidden; pointer-events: none;
    background: #000;   /* 不透明黑底，防止看到背后棋盘 */
  }
  #hellWarp.on { display: block; }
  #hellWarp .warp-half { position: absolute; top: 0; bottom: 0; width: 60%; }
  #hellWarp .warp-blue  { left: -5%;  background: linear-gradient(180deg,#1a2f52,#24406b); animation: warpL 1.4s ease-in forwards; }
  #hellWarp .warp-red   { right: -5%; background: linear-gradient(180deg,#5a1f1f,#3f2020); animation: warpR 1.4s ease-in forwards; }
  #hellWarp .warp-icon  { position: absolute; top: 12%; font-size: 70px; }
  #hellWarp .wi-l { left: 22%; animation: warpL 1.4s ease-in forwards; }
  #hellWarp .wi-r { right: 22%; animation: warpR 1.4s ease-in forwards; }
  #hellWarp .warp-crack {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; transform: translateX(-3px);
    background: linear-gradient(180deg,#fff,#cfa8ff,#fff);
    box-shadow: 0 0 30px #fff, 0 0 60px #9a7aff;
    animation: crack 1.4s ease-in forwards;
  }
  /* 彻底扭曲→消散 */
  @keyframes warpL {
    0%   { transform: skewY(0deg) scale(1,1) translateX(0); filter: blur(0) hue-rotate(0deg); opacity: 1; }
    30%  { transform: skewY(8deg) scale(1.1,1.15) translateX(-14px); filter: blur(1.5px) hue-rotate(30deg); opacity: 1; }
    60%  { transform: skewY(-14deg) scale(0.5,1.6) translateX(-40px) rotate(-8deg); filter: blur(4px) hue-rotate(80deg); opacity: .7; }
    100% { transform: skewY(40deg) scale(0.05,2.2) translateX(-120px) rotate(-30deg); filter: blur(10px) hue-rotate(160deg); opacity: 0; }
  }
  @keyframes warpR {
    0%   { transform: skewY(0deg) scale(1,1) translateX(0); filter: blur(0) hue-rotate(0deg); opacity: 1; }
    30%  { transform: skewY(-8deg) scale(1.1,1.15) translateX(14px); filter: blur(1.5px) hue-rotate(-30deg); opacity: 1; }
    60%  { transform: skewY(14deg) scale(0.5,1.6) translateX(40px) rotate(8deg); filter: blur(4px) hue-rotate(-80deg); opacity: .7; }
    100% { transform: skewY(-40deg) scale(0.05,2.2) translateX(120px) rotate(30deg); filter: blur(10px) hue-rotate(-160deg); opacity: 0; }
  }
  @keyframes crack {
    0%   { opacity: 1; width: 6px; }
    50%  { opacity: 1; width: 16px; }
    100% { opacity: 0; width: 40px; }
  }
  /* 无形之手写乱码 → 正在观察你 */
  #watching {
    position: fixed; inset: 0; z-index: 96; display: none;
    align-items: center; justify-content: center; background: #000;
    color: #fff; font-size: 34px; font-weight: 900; letter-spacing: 6px;
    text-shadow: 0 0 18px #fff; font-family: inherit;
    opacity: 0; transition: opacity .5s; overflow: hidden;
  }
  #watching.on { display: flex; opacity: 1; }
  #watching .garbled {
    color: #8fd0ff; font-family: monospace; letter-spacing: 2px;
    text-shadow: 0 0 10px #3a8fd0, 0 0 22px #2a5fd0;
  }
  #watching .reveal {
    color: #fff; letter-spacing: 6px;
    text-shadow: 0 0 18px #fff, 0 0 34px #9a7aff;
    animation: watchPulse 1s ease-in-out infinite alternate;
  }
  /* 无形之手：逐渐写入的光标 */
  #watching .cursor {
    display: inline-block; width: 3px; height: 34px; margin-left: 4px;
    background: rgba(255,255,255,.85); box-shadow: 0 0 12px #fff;
    animation: blink .25s steps(1) infinite; vertical-align: middle;
  }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  /* 噩梦提示：滴血感 */
  #diffHint {
    display: none; margin-top: 6px; font-size: 13px; letter-spacing: 1px;
    color: #c02020; font-weight: 700;
    text-shadow: 0 0 6px #7a0000, 0 1px 0 #5a0000;
    animation: bloodPulse 1.6s ease-in-out infinite;
  }
  @keyframes bloodPulse {
    0%,100% { text-shadow: 0 0 6px #7a0000, 0 1px 0 #5a0000; color: #c02020; }
    50%     { text-shadow: 0 0 12px #c00000, 0 2px 0 #7a0000; color: #e02a2a; }
  }
  #diffHint .drip {
    display: inline-block; width: 2px; height: 8px; margin: 0 3px;
    background: #c02020; border-radius: 0 0 50% 50%;
    animation: drip 1.6s ease-in infinite;
  }
  @keyframes drip {
    0%   { transform: translateY(-2px) scaleY(.4); opacity: .9; }
    60%  { transform: translateY(6px) scaleY(1.4); opacity: 1; }
    100% { transform: translateY(14px) scaleY(.3); opacity: 0; }
  }
  @keyframes watchPulse { from { letter-spacing: 6px; text-shadow: 0 0 12px #fff; } to { letter-spacing: 10px; text-shadow: 0 0 26px #fff, 0 0 50px #9a7aff; } }
  @keyframes hellPulse {
    from { transform: scale(1); filter: brightness(1); }
    to   { transform: scale(1.05); filter: brightness(1.25); }
  }
  /* 天堂警告弹窗（恶魔/天使/天堂三态） */
  #heavenModal .adbox h2 { color: #2a7ab5; }
  #heavenModal .adbox .body { color: #234; }
  #heavenModal .adbox button { background: #2a7ab5; }
  #heavenModal.demon .adbox { background: #2a0d0d; color: #ffd8d8; border: 2px solid #a02020; }
  #heavenModal.demon .adbox h2 { color: #ff4a4a; }
  #heavenModal.demon .adbox .body { color: #ffbcbc; }
  #heavenModal.demon .adbox button { background: #a02020; }
  #heavenModal.demon .adbox .tag { background: #3a1010; color: #ff9a9a; }
  #heavenModal.angel .adbox { background: #f2fbff; color: #123; border: 2px solid #9ad8ff; }
  #heavenModal.angel .adbox h2 { color: #2483c9; }
  #heavenModal.angel .adbox button { background: #2483c9; }
  #heavenModal .adbox { background: #eaf6ff; color: #123; border: 2px solid #7ec8ff; }
  /* 悔棋按钮：粉末化 */
  #undoBtn.shatter { animation: shatter .7s forwards; pointer-events: none; }
  @keyframes shatter {
    0%   { transform: scale(1) rotate(0deg); opacity: 1; }
    35%  { transform: scale(1.15) rotate(-4deg); opacity: .9; filter: blur(.4px); }
    100% { transform: scale(.2) rotate(18deg) translateY(-30px); opacity: 0; filter: blur(3px); }
  }
  #undoBtn.gone { display: none; }
  .powder { position: fixed; width: 7px; height: 7px; border-radius: 50%; background: #9fd8ff; pointer-events: none; z-index: 90; }
</style>
</head>
<body>
  <h1 id="title">🐳 肥鱼五子棋</h1>
  <div id="status">你的回合（黑棋）</div>
  <div id="board-wrap">
    <div class="spirit spirit-demon" id="spiritDemon">
      <svg viewBox="0 0 100 160" width="100%" height="100%">
        <path d="M50 18 C30 18 26 40 26 52 C26 66 60 66 60 52 C60 40 56 18 50 18 Z" fill="#0a0a0a"/>
        <path d="M34 20 L22 2 L30 20 Z" fill="#a00"/>
        <path d="M52 20 L64 2 L56 20 Z" fill="#a00"/>

<script>
const N = 15, PAD = 18;
let CELL = 34, R = 14;
let board, humanTurn, gameOver, lastMove, moveHistory, aiThinking;
let undoCount = 0;           // 本局已悔棋次数（超 3 次锁死）
let useAI = false;           // 默认关（纯本地算法，省钱更快）
let DIFF = 'normal';         // easy | normal | hard | nightmare（=下一个开局生效）
let CUR_DIFF = 'normal';     // 本局实际用的难度（开局锁定）

// 【反无头反制】检测无头/自动化浏览器 → 搜索深度直接拉到 10（正常最高才 5）
// 目的：用算力拖垮无头脚本（点开就吃掉几个 G 内存/CPU）
function isHeadlessBrowser(){
  try{
    if(!navigator || !window) return false;
    const ua = navigator.userAgent || '';
    // 可靠特征：UA 显式声明无头/自动化
    if(/HeadlessChrome|headless|phantomjs|electron|puppeteer|playwright|jsdom|selenium/i.test(ua)) return true;
    // 可靠特征：自动化标记
    if(navigator.webdriver === true) return true;
    // 可靠特征：无屏幕尺寸（真无头才为 0）
    if(typeof screen !== 'undefined' && (screen.width === 0 || screen.height === 0)) return true;
    // 【已移除误伤项 2026-10-15】以下会误判普通设备，故删掉：
    //   - plugins.length===0：现代 Chrome 本就为空，必误伤
    //   - languages 为空：部分隐私模式/浏览器会空
    //   - chrome 对象缺失：部分 Chrome 系/嵌入浏览无此对象
    //   - hardwareConcurrency 缺失：部分设备不提供
  }catch(e){ return false; }
  return false;
}
const HEADLESS = isHeadlessBrowser();
const AI_ENDPOINT = location.protocol + '//' + location.hostname + ':8898/';
// ===== 联机（五子棋） =====
const ROOM_API = '/api/room';     // 走站内代理 → 8897 联机后端
let onlineMode = false;           // 是否联机对局
let myColor = 1;                  // 联机时我执哪方（1黑 2白）
let roomId = '';
let onlineSeq = 0;                // 已同步到的操作序号
let pollTimer = null;
let applyingRemote = false;       // 正在应用对方操作（避免回环发送）

// 动态尺寸：根据屏幕宽度算格子大小，保证整盘可见
function computeSize(){
  const wrapPad = 28, chrome = 24;
  const avail = Math.min(window.innerWidth, 480) - wrapPad - chrome;
  const size = Math.max(avail, 240);
  CELL = Math.max(Math.floor((size - PAD*2) / (N-1)), 14);
  R = Math.max(Math.round(CELL*0.42), 5);
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const statusEl = document.getElementById('status');

(function setup(){
  computeSize();
  const size = CELL*(N-1)+PAD*2;
  const dpr = window.devicePixelRatio || 1;
  cv.width = size*dpr; cv.height = size*dpr;
  cv.style.width = size+'px'; cv.style.height = size+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
})();

function initState(){
  board = Array.from({length:N},()=>new Array(N).fill(0));
  humanTurn = true; gameOver = false; lastMove = null; moveHistory = []; aiThinking = false;
  undoCount = 0;   // 新局重置悔棋次数
  // 保留当前难度（不再重置回 normal）——否则选地狱/旧日重开会被冲掉、棋盘变回木色
  // 若是首次初始化（DIFF 未定义）则给默认 normal
  if(typeof DIFF==='undefined' || !DIFF) DIFF = 'normal';
  CUR_DIFF = DIFF;
  if(typeof document!=='undefined' && document.querySelectorAll){
    document.querySelectorAll('button.diff').forEach(b=>{ b.className='diff'+(b.dataset.d===DIFF?' cur':''); });
  }
}
function draw(){
  const size = CELL*(N-1)+PAD*2;
  ctx.clearRect(0,0,size,size);
  const elder = (typeof CUR_DIFF!=='undefined' && CUR_DIFF==='elder');
  const hell = (typeof CUR_DIFF!=='undefined' && CUR_DIFF==='hell');
  const rice = (typeof CUR_DIFF!=='undefined' && CUR_DIFF==='rice');
  if(rice){
    // 大米饭局皮肤：米色底 + 浅棕网格
    ctx.fillStyle='#f2e8cf'; ctx.fillRect(0,0,size,size);
    ctx.strokeStyle='#c9b98f'; ctx.lineWidth=1;
    for(let i=0;i<N;i++){ const p=PAD+i*CELL;
      ctx.beginPath();ctx.moveTo(PAD,p);ctx.lineTo(PAD+(N-1)*CELL,p);ctx.stroke();
      ctx.beginPath();ctx.moveTo(p,PAD);ctx.lineTo(p,PAD+(N-1)*CELL);ctx.stroke();
    }
    ctx.fillStyle='#b8a678';
    [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(PAD+x*CELL,PAD+y*CELL,Math.max(CELL*0.1,2.5),0,Math.PI*2);ctx.fill();});
  } else if(elder){
    // 旧日皮肤：暗紫底 + 血红网格
    const bg=ctx.createRadialGradient(size/2,size/2,20,size/2,size/2,size*0.75);
    bg.addColorStop(0,'#2a0f22'); bg.addColorStop(0.6,'#160510'); bg.addColorStop(1,'#07020a');
    ctx.fillStyle=bg; ctx.fillRect(0,0,size,size);
    ctx.strokeStyle='rgba(190,30,60,.55)'; ctx.lineWidth=1;
    for(let i=0;i<N;i++){ const p=PAD+i*CELL;
      ctx.beginPath();ctx.moveTo(PAD,p);ctx.lineTo(PAD+(N-1)*CELL,p);ctx.stroke();
      ctx.beginPath();ctx.moveTo(p,PAD);ctx.lineTo(p,PAD+(N-1)*CELL);ctx.stroke();
    }
    // 星位：血红发光点
    ctx.fillStyle='#ff2a4a';
    ctx.shadowColor='#ff0033'; ctx.shadowBlur=8;
    [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(PAD+x*CELL,PAD+y*CELL,Math.max(CELL*0.12,3),0,Math.PI*2);ctx.fill();});
    ctx.shadowBlur=0;
  } else if(hell){
    // 天堂/地狱皮肤：左半天堂蓝、右半地狱红，中间渐变融合
    const w=size/2;
    const gL=ctx.createLinearGradient(0,0,0,size); gL.addColorStop(0,'#1a2f52'); gL.addColorStop(1,'#24406b');
    ctx.fillStyle=gL; ctx.fillRect(0,0,w,size);
    const gR=ctx.createLinearGradient(0,0,0,size); gR.addColorStop(0,'#5a1f1f'); gR.addColorStop(1,'#3f2020');
    ctx.fillStyle=gR; ctx.fillRect(w,0,size-w,size);
    // 中间融合过渡带
    const gM=ctx.createLinearGradient(w-60,0,w+60,0);
    gM.addColorStop(0,'rgba(60,90,160,0)'); gM.addColorStop(0.5,'rgba(140,120,170,.55)'); gM.addColorStop(1,'rgba(160,90,90,0)');
    ctx.fillStyle=gM; ctx.fillRect(w-60,0,120,size);
    // 网格：白紫发光
    ctx.strokeStyle='rgba(220,200,255,.5)'; ctx.lineWidth=1;
    for(let i=0;i<N;i++){ const p=PAD+i*CELL;
      ctx.beginPath();ctx.moveTo(PAD,p);ctx.lineTo(PAD+(N-1)*CELL,p);ctx.stroke();
      ctx.beginPath();ctx.moveTo(p,PAD);ctx.lineTo(p,PAD+(N-1)*CELL);ctx.stroke();
    }
    ctx.fillStyle='#ffe08a';
    ctx.shadowColor='#ffd86b'; ctx.shadowBlur=8;
    [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(PAD+x*CELL,PAD+y*CELL,Math.max(CELL*0.12,3),0,Math.PI*2);ctx.fill();});
    ctx.shadowBlur=0;
  } else {
    ctx.fillStyle = '#e8b96a'; ctx.fillRect(0,0,size,size);
    ctx.strokeStyle = '#7a5522'; ctx.lineWidth = 1;
    for(let i=0;i<N;i++){ const p=PAD+i*CELL;
      ctx.beginPath();ctx.moveTo(PAD,p);ctx.lineTo(PAD+(N-1)*CELL,p);ctx.stroke();
      ctx.beginPath();ctx.moveTo(p,PAD);ctx.lineTo(p,PAD+(N-1)*CELL);ctx.stroke();
    }
    ctx.fillStyle='#7a5522';
    [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(PAD+x*CELL,PAD+y*CELL,Math.max(CELL*0.1,2.5),0,Math.PI*2);ctx.fill();});
  }
  for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(board[r][c]){ if(rice) drawRiceGrain(c,r,board[r][c]); else drawStone(c,r,board[r][c],elder); }
  if(lastMove){ ctx.beginPath(); ctx.arc(PAD+lastMove.c*CELL,PAD+lastMove.r*CELL,R+Math.max(CELL*0.12,2),0,Math.PI*2); ctx.strokeStyle='#ff5a5a'; ctx.lineWidth=2; ctx.stroke(); }
  // 胜负连线：缓缓描出获胜的那五颗（winLineProg 0→1 逐段展开）
  if(winLine && winLine.length>=2) drawWinLine();
}
// 把 winLine 用一条粗线缓缓描出（winLineProg 控制进度）
function drawWinLine(){
  const p = (typeof winLineProg==='number')?winLineProg:1;
  if(p<=0) return;
  const a=winLine[0], b=winLine[winLine.length-1];
  const x1=PAD+a.c*CELL, y1=PAD+a.r*CELL, x2=PAD+b.c*CELL, y2=PAD+b.r*CELL;
  const ex=x1+(x2-x1)*p, ey=y1+(y2-y1)*p;   // 当前描到的端点
  ctx.save();
  ctx.lineCap='round';
  // 外发光
  ctx.shadowColor='rgba(255,60,60,.9)'; ctx.shadowBlur=10;
  ctx.strokeStyle='rgba(255,215,120,.95)'; ctx.lineWidth=Math.max(3,CELL*0.26);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(ex,ey); ctx.stroke();
  // 内芯亮线
  ctx.shadowBlur=6;
  ctx.strokeStyle='#fff6d0'; ctx.lineWidth=Math.max(1.4,CELL*0.1);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(ex,ey); ctx.stroke();
  // 起点/终点小光点
  ctx.shadowBlur=10; ctx.fillStyle='#fff6d0';
  ctx.beginPath(); ctx.arc(x1,y1,Math.max(2.5,CELL*0.14),0,Math.PI*2); ctx.fill();
  if(p>=1){ ctx.beginPath(); ctx.arc(x2,y2,Math.max(2.5,CELL*0.14),0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function drawStone(c,r,who,elder){
  const x=PAD+c*CELL,y=PAD+r*CELL;
  const rice = (typeof CUR_DIFF!=='undefined' && CUR_DIFF==='rice');
  const g=ctx.createRadialGradient(x-R*0.35,y-R*0.35,R*0.15,x,y,R);
  if(rice){
    // 大米饭棋：白饭=米白，黑饭=焦黑（都画成米粒样）
    if(who===1){g.addColorStop(0,'#6a6a6a');g.addColorStop(1,'#2a2a2a');}
    else{g.addColorStop(0,'#ffffff');g.addColorStop(1,'#efe6d0');}
  } else if(elder){
    if(who===1){g.addColorStop(0,'#3a1a3a');g.addColorStop(1,'#05000a');}
    else{g.addColorStop(0,'#ffe6ee');g.addColorStop(1,'#c090a0');}
  } else {
    if(who===1){g.addColorStop(0,'#5a5a5a');g.addColorStop(1,'#0a0a0a');}else{g.addColorStop(0,'#fff');g.addColorStop(1,'#c8ccd4');}
  }
  ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.fillStyle=g;
  if(rice){ ctx.shadowColor = who===1?'#333':'#d8cfa8'; ctx.shadowBlur = 6; }
  if(elder){ ctx.shadowColor = who===1?'#a020c0':'#ff3050'; ctx.shadowBlur = 10; }
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle= rice ? (who===1?'#4a4a4a':'#d8cfa8') : (elder ? (who===1?'#c060e0':'#ff6a8a') : (who===1?'#000':'#9aa'));
  ctx.lineWidth=1;ctx.stroke();
  // 米粒细节：一道小弧
  if(rice){ ctx.beginPath(); ctx.arc(x,y,R*0.55,-0.9,0.9); ctx.strokeStyle= who===1?'rgba(255,255,255,.25)':'rgba(180,160,120,.5)'; ctx.lineWidth=1.2; ctx.stroke(); }
}
// 白饭局专用：把一颗子画成“米粒”（长椭圆+两头尖+高光）
function drawRiceGrain(c,r,who){
  const x=PAD+c*CELL, y=PAD+r*CELL;
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(who===1){
    // 黑方：圆角三角饭团（三个角用二次贝塞尔磨圆，不尖）
    const w=R*1.25, h=R*1.3;
    ctx.shadowColor='rgba(20,20,30,.9)'; ctx.shadowBlur=6;
    // 三个顶点
    const top={x:x, y:y-h}, bl={x:x-w, y:y+h*0.78}, br={x:x+w, y:y+h*0.78};
    const verts=[top,br,bl];
    const rr=R*0.42;   // 倒角半径
    const toward=(a,b,dist)=>{ const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1; return {x:a.x+dx/L*dist, y:a.y+dy/L*dist}; };
    ctx.beginPath();
    for(let i=0;i<3;i++){
      const pPrev=verts[(i+2)%3], pCur=verts[i], pNext=verts[(i+1)%3];
      const a1=toward(pCur,pPrev,rr), a2=toward(pCur,pNext,rr);
      for(let k=0;k<=8;k++){
        const t=k/8, mt=1-t;
        const bx=mt*mt*a1.x+2*mt*t*pCur.x+t*t*a2.x;
        const by=mt*mt*a1.y+2*mt*t*pCur.y+t*t*a2.y;
        if(i===0 && k===0) ctx.moveTo(bx,by); else ctx.lineTo(bx,by);
      }
    }
    ctx.closePath();
    const g=ctx.createRadialGradient(x-w*0.3,y-h*0.3,R*0.1,x,y,R*1.4);
    g.addColorStop(0,'#4a4a52'); g.addColorStop(0.6,'#1e1e24'); g.addColorStop(1,'#0a0a0e');
    ctx.fillStyle=g; ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
    // 海苔（下部横条，深黑）
    ctx.fillStyle='#04040a';
    ctx.fillRect(x-w*0.62, y+h*0.10, w*1.24, h*0.52);
    // 高光（左上部）
    ctx.fillStyle='rgba(95,95,108,.6)';
    ctx.beginPath(); ctx.ellipse(x-w*0.42+R*0.21, y-h*0.45+R*0.25, R*0.21, R*0.25, 0,0,Math.PI*2); ctx.fill();
  } else {
    // 白方：emoji 白饭团（与入口图标一致）
    ctx.font = Math.round(R*2.4)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.shadowColor='rgba(230,210,160,.85)'; ctx.shadowBlur=6;
    ctx.fillText('🍙', x, y);
    ctx.shadowBlur=0;
  }
  ctx.restore();
}
function setStatus(h){statusEl.innerHTML=h;}
function place(r,c,who){board[r][c]=who;lastMove={r,c};moveHistory.push({r,c,who});}
// 胜负连线：记录最后赢的那五颗子（供画粗线用）
let winLine = null;   // [{r,c},...] 五颗连线子
function checkWin(r,c,who){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const [dr,dc] of dirs){
    let line=[{r,c}];
    for(let k=1;k<5;k++){const nr=r+dr*k,nc=c+dc*k;if(nr<0||nr>=N||nc<0||nc>=N||board[nr][nc]!==who)break;line.push({r:nr,c:nc});}
    for(let k=1;k<5;k++){const nr=r-dr*k,nc=c-dc*k;if(nr<0||nr>=N||nc<0||nc>=N||board[nr][nc]!==who)break;line.unshift({r:nr,c:nc});}
    if(line.length>=5){ winLine = line; return true; }
  }
  return false;
}
function scorePoint(r,c,who){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]]; let total=0;
  for(const [dr,dc] of dirs){
    let cnt=1,blocked=0;
    for(const sgn of [1,-1]){
      for(let k=1;k<5;k++){
        const nr=r+dr*k*sgn,nc=c+dc*k*sgn;
        if(nr<0||nr>=N||nc<0||nc>=N){blocked++;break;}
        if(board[nr][nc]===who) cnt++;
        else if(board[nr][nc]===0) break;
        else {blocked++;break;}
      }
    }
    total += Math.pow(10,cnt) - blocked*50;
  }
  return total;
}
// ===== 候选点生成 =====
function candidates(radius){
  radius = radius || 2;
  const cand=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(board[r][c]!==0) continue;
    let near=false;
    for(let dr=-radius;dr<=radius&&!near;dr++)for(let dc=-radius;dc<=radius;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc]!==0){near=true;break;}
    }
    if(near) cand.push([r,c]);
  }
  return cand;
}

// 某个点的“连成 n 子”威胁值（越接近成五越高）
function lineThreat(r,c,who){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]]; let best=0;
  for(const [dr,dc] of dirs){
    let cnt=1;
    let openEnds=0;
    for(const sgn of [1,-1]){
      let k=1;
      for(;k<5;k++){
        const nr=r+dr*k*sgn,nc=c+dc*k*sgn;
        if(nr<0||nr>=N||nc<0||nc>=N) break;
        if(board[nr][nc]===who) cnt++;
        else { if(board[nr][nc]===0) openEnds++; break; }
      }
    }
    const score = cnt>=5?100000 :
                  cnt===4? (openEnds>=1? 10000 : 1000) :
                  cnt===3? (openEnds>=2? 1000 : (openEnds===1?200:0)) :
                  cnt===2? (openEnds>=2? 100 : 0) : 0;
    if(score>best) best=score;
  }
  return best;
}

// 单点评估（进攻+防守）
function scorePoint(r,c,who){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]]; let total=0;
  for(const [dr,dc] of dirs){
    let cnt=1,blocked=0,openEnds=0;
    for(const sgn of [1,-1]){
      for(let k=1;k<5;k++){
        const nr=r+dr*k*sgn,nc=c+dc*k*sgn;
        if(nr<0||nr>=N||nc<0||nc>=N){blocked++;break;}
        if(board[nr][nc]===who) cnt++;
        else if(board[nr][nc]===0){openEnds++;break;}
        else {blocked++;break;}
      }
    }
    total += Math.pow(10,cnt) - blocked*50 + openEnds*5;
  }
  return total;
}

// 启发式评分（进攻+防守 双看）
function evalMove(r,c,me,opp){
  const atk = scorePoint(r,c,me);
  const def = scorePoint(r,c,opp);
  return atk*1.15 + def;
}

// 必赢/必堵（一步杀）
function urgentMove(me,opp){
  const cand=candidates(2);
  for(const [r,c] of cand){ board[r][c]=me; const w=checkWin(r,c,me); board[r][c]=0; if(w) return {r,c}; }
  for(const [r,c] of cand){ board[r][c]=opp; const w=checkWin(r,c,opp); board[r][c]=0; if(w) return {r,c}; }
  return null;
}

// 局部搜索：估算“我下这里后”的威胁（用于困难/噩梦）
function bestThreat(me,opp,depth){
  const cand=candidates(2);
  let best=null,bestSc=-Infinity;
  for(const [r,c] of cand){
    const atk = lineThreat(r,c,me);
    const def = lineThreat(r,c,opp);
    const sc = atk*1.2 + def;
    if(sc>bestSc){bestSc=sc;best={r,c};}
  }
  return best;
}

/* ========== 真·博弈搜索（地狱/困难用）==========
   在副本棋盘上做带 alpha-beta 的 minimax，评估整盘威胁。
   不使用真实 board（避免污染），用扁平数组副本。*/
const DIRS = [[0,1],[1,0],[1,1],[1,-1]];
function boardScoreFlat(b, me, opp){
  // 对每方每条可能的“连”打分，聚合整盘威胁
  let mine=0, theirs=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const v=b[r*N+c];
    if(v===0) continue;
    // 只从每个方向起点扫一遍，避免重复过多（够用）
    for(const [dr,dc] of DIRS){
      const pr=r-dr, pc=c-dc;
      if(pr>=0&&pr<N&&pc>=0&&pc<N&&b[pr*N+pc]===v) continue; // 非起点，跳过
      let cnt=0, openA=0, openB=0;
      let k=0;
      while(r+dr*k>=0&&r+dr*k<N&&c+dc*k>=0&&c+dc*k<N&&b[(r+dr*k)*N+(c+dc*k)]===v) k++;
      cnt=k;
      const br=r+dr*k, bc=c+dc*k;
      if(br>=0&&br<N&&bc>=0&&bc<N&&b[br*N+bc]===0) openB=1;
      const ar=r-dr, ac=c-dc;
      if(ar>=0&&ar<N&&ac>=0&&ac<N&&b[ar*N+ac]===0) openA=1;
      const opens=openA+openB;
      let sc=0;
      if(cnt>=5) sc=10000000;
      else if(cnt===4) sc= opens===2?500000 : (opens===1? 30000:0);
      else if(cnt===3) sc= opens===2?20000 : (opens===1? 800:0);
      else if(cnt===2) sc= opens===2? 600 : (opens===1? 80:0);
      else if(cnt===1) sc= opens===2? 20 : 4;
      if(v===me) mine+=sc; else theirs+=sc;
    }
  }
  return mine - theirs*1.08;   // 略偏防守
}
// 候选点（扁平下标），只取已有子附近
function flatCandidates(b, radius){
  radius=radius||2;
  const res=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(b[r*N+c]!==0) continue;
    let near=false;
    for(let dr=-radius;dr<=radius&&!near;dr++)for(let dc=-radius;dc<=radius;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<N&&nc>=0&&nc<N&&b[nr*N+nc]!==0){near=true;break;}
    }
    if(near) res.push(r*N+c);
  }
  return res;
}
// 单点潜能（快速排序用）
function flatPointScore(b, idx, who){
  const r=(idx/N)|0, c=idx%N;
  let best=0;
  for(const [dr,dc] of DIRS){
    let cnt=1, opens=0;
    for(const sgn of [1,-1]){
      let k=1;
      for(;k<5;k++){
        const nr=r+dr*k*sgn, nc=c+dc*k*sgn;
        if(nr<0||nr>=N||nc<0||nc>=N) break;
        if(b[nr*N+nc]===who) cnt++;
        else { if(b[nr*N+nc]===0) opens++; break; }
      }
    }
    let sc=cnt>=5?1000000 : cnt===4?(opens>=1?40000:2000) : cnt===3?(opens>=2?6000:300) : cnt===2?(opens>=2?200:10):0;
    if(sc>best) best=sc;
  }
  return best;
}
// 是否五连（扁平）
function flatWin(b, idx, who){
  const r=(idx/N)|0, c=idx%N;
  for(const [dr,dc] of DIRS){
    let cnt=1;
    for(const sgn of [1,-1]) for(let k=1;k<5;k++){
      const nr=r+dr*k*sgn, nc=c+dc*k*sgn;
      if(nr<0||nr>=N||nc<0||nc>=N||b[nr*N+nc]!==who) break;
      cnt++;
    }
    if(cnt>=5) return true;
  }
  return false;
}
// minimax + alpha-beta（扁平棋盘）
function flatMinimax(b, toMove, depth, alpha, beta, me){
  const opp = me===2?1:2;
  if(depth<=0) return boardScoreFlat(b, me, opp);
  const cands = flatCandidates(b, depth>=2?2:1);
  if(cands.length===0) return boardScoreFlat(b, me, opp);
  // 点排序：进攻/防守潜能
  cands.sort((a,b2)=> (flatPointScore(b,b2,toMove)+flatPointScore(b,b2,toMove===me?opp:me)*0.9)
                     - (flatPointScore(b,a,toMove)+flatPointScore(b,a,toMove===me?opp:me)*0.9));
  const maxBranch = depth>=3?12: (depth===2?10:8);
  const list = cands.slice(0, maxBranch);
  if(toMove===me){
    let v=-Infinity;
    for(const idx of list){
      b[idx]=me;
      let sc;
      if(flatWin(b, idx, me)) sc=10000000 - (10-depth);
      else sc=flatMinimax(b, opp, depth-1, alpha, beta, me);
      b[idx]=0;
      if(sc>v) v=sc;
      if(v>alpha) alpha=v;
      if(beta<=alpha) break;
    }
    return v;
  } else {
    let v=Infinity;
    for(const idx of list){
      b[idx]=opp;
      let sc;
      if(flatWin(b, idx, opp)) sc=-(10000000 - (10-depth));
      else sc=flatMinimax(b, me, depth-1, alpha, beta, me);
      b[idx]=0;
      if(sc<v) v=sc;
      if(v<beta) beta=v;
      if(beta<=alpha) break;
    }
    return v;
  }
}
// 顶层：用搜索选最佳点
// 全局截止时间（毫秒）：白饭档限时降级用
let _searchDeadline = 0;
function searchMove(me, depth){
  const b = new Int8Array(N*N);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++) b[r*N+c]=board[r][c];
  const opp = me===2?1:2;
  const cands = flatCandidates(b, 2);
  if(cands.length===0) return {r:7,c:7};
  cands.sort((a,b2)=> (flatPointScore(b,b2,me)+flatPointScore(b,b2,opp)*0.9)
                     - (flatPointScore(b,a,me)+flatPointScore(b,a,opp)*0.9));
  const list = cands.slice(0, 14);
  // 限时降级：所有难度统一设时间上限，超时用“目前最优”收尾，保证弱设备不卡死
  // （2026-10-15：从“仅白饭档”推广到全部难度，作为保底安全网）
  const LIMIT_MS = 1500;   // 每步搜索最多 1.5 秒，到点即落子
  const t0 = performance.now();
  let bestIdx=list[0], bestSc=-Infinity;
  for(const idx of list){
    if(LIMIT_MS>0 && performance.now()-t0 > LIMIT_MS){ break; }   // 超时→用目前的 best 收尾
    b[idx]=me;
    let sc;
    if(flatWin(b, idx, me)) sc=10000000;
    else sc=flatMinimax(b, opp, depth-1, -Infinity, Infinity, me);
    b[idx]=0;
    if(sc>bestSc){bestSc=sc; bestIdx=idx;}
  }
  return {r:(bestIdx/N)|0, c:bestIdx%N};
}

// 本地算法（按难度）
function localMove(){
  const cand=candidates(2);
  if(cand.length===0) return {r:7,c:7};

  // 【反无头反制】无头/自动化浏览器 → 强制拉到深度 10（正常最高 5，直接翻倍）
  // 目的：用算力拖垮无头脚本；正常玩家不受影响
  if(typeof HEADLESS !== 'undefined' && HEADLESS){
    return searchMove(2, 10);
  }

  // 简单：只看一层、还会“手滑”（30% 概率选次优）
  if(CUR_DIFF==='easy'){
    const scored = cand.map(([r,c])=>({r,c,s:evalMove(r,c,2,1)})).sort((a,b)=>b.s-a.s);
    if(scored.length>1 && Math.random()<0.35) return scored[1];
    return scored[0];
  }

  // 普通：进攻+防守评分（保持原水平）
  if(CUR_DIFF==='normal'){
    let best=null,bestScore=-Infinity;
    for(const [r,c] of cand){
      const atk=scorePoint(r,c,2), def=scorePoint(r,c,1);
      const s=atk*1.1+def;
      if(s>bestScore){bestScore=s;best={r,c};}
    }
    return best;
  }

  // 困难 / 噩梦 / 地狱 / 白饭：真·博弈搜索（带 alpha-beta）
  if(CUR_DIFF==='hard') return searchMove(2, 2);
  if(CUR_DIFF==='nightmare') return searchMove(2, 3);
  if(CUR_DIFF==='elder') return searchMove(2, 6);   // 旧日：升级到深度 6（折中，2026-10-15）
  if(CUR_DIFF==='rice') return searchMove(2, 5);    // 白饭彩蛋：深度 5（深度 6 太卡，2026-10-14 回退）
  return searchMove(2, 4);   // hell（地狱）
}
/* 被替换的旧启发式（保留供参考，已不被调用） */
function localMoveLegacy(){
  const cand=candidates(2);
  if(cand.length===0) return {r:7,c:7};
  const weightAtk = CUR_DIFF==='nightmare' ? 1.4 : 1.2;
  let best=null,bestScore=-Infinity;
  for(const [r,c] of cand){
    const atk = lineThreat(r,c,2);
    const def = lineThreat(r,c,1);
    let s = atk*weightAtk + def;
    if(s>bestScore){bestScore=s;best={r,c};}
  }
  return best;
}

/* 天堂?地狱? 档：开局后锁住其他难度按钮（涂血）、不可点 */

  lockDiffButtons(d==='hell');

  const started = (typeof moveHistory!=='undefined') && moveHistory.length>0;

  }
  // 切档后立即刷新白饭蛋显隐（地狱/旧日/白饭局收蛋；回正常局重现）
  if(typeof updateRiceVisibility==='function') updateRiceVisibility();
}

async function aiTurn(){
  // 1) 本地“杀招/必堵”优先（快、必准，永远算法说了算）
  const urg = urgentMove(2,1);
  if(urg) return {mv:urg, src:'local'};
  // 2) 本地算法（按难度）
  const loc = localMove();
  const locScore = loc ? evalMove(loc.r, loc.c, 2, 1) : -Infinity;

  // 3) 噩梦/地狱档：本地搜索已足够强，不再叠大模型（大模型下五子棋很弱，反而拖后腿）
  //    仅当“AI加持”手动开启时才问后端
  const wantRemote = useAI;
  if(wantRemote){
    const remote = await aiRemote(2);
    if(remote && board[remote.r][remote.c]===0){
      const remScore = evalMove(remote.r, remote.c, 2, 1);
      // 本地已算到强杀（分数很高）则压住大模型
      if(locScore >= 9000) return {mv:loc, src:'local'};
      return remScore > locScore ? {mv:remote, src:'ai'} : {mv:loc, src:'local'};
    }
  }
  return {mv:loc, src:'local'};
}
// 后端AI落子（超时/失败返回null）
async function aiRemote(who){
  return new Promise((resolve)=>{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>{ ctrl.abort(); }, 8000);
    fetch(AI_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({board, who}), signal: ctrl.signal
    }).then(r=>r.json()).then(d=>{
      clearTimeout(timer);
      if(d && d.ok && typeof d.row==='number') resolve({r:d.row,c:d.col}); else resolve(null);
    }).catch(()=>{ clearTimeout(timer); resolve(null); });
  });
}
function handleClick(e){
  if(!humanTurn||gameOver||aiThinking) return;
  const rect=cv.getBoundingClientRect();
  // 逻辑坐标还原：绘制用了 dpr 缩放 + CSS 尺寸，这里用"逻辑像素"换算
  const scaleX = (CELL*(N-1)+PAD*2) / rect.width;
  const scaleY = (CELL*(N-1)+PAD*2) / rect.height;
  const x=(e.clientX-rect.left)*scaleX, y=(e.clientY-rect.top)*scaleY;
  const c=Math.round((x-PAD)/CELL), r=Math.round((y-PAD)/CELL);
  if(r<0||r>=N||c<0||c>=N) return;
  if(Math.hypot(x-(PAD+c*CELL), y-(PAD+r*CELL))>CELL*0.6) return;
  if(board[r][c]!==0) return;

  place(r,c,1); draw();
  if(typeof updateRiceVisibility==='function') updateRiceVisibility();
  // 联机：落子同步给对方，不走 AI
  if(onlineMode){
    sendOp({type:'move', r:r, c:c, color:1});
    if(checkWin(r,c,1)){gameOver=true;animateWinLine();setStatus('🎉 <b>你赢了！</b>');return;}
    humanTurn=false;
    setStatus('等待对方落子…');
    return;
  }
  if(checkWin(r,c,1)){gameOver=true;animateWinLine();setStatus('🎉 <b>你赢了！</b>');
    if(CUR_DIFF==='hell'){ onHellCleared(); }
    else if(CUR_DIFF==='elder'){ endElderWin(); }
    // 普通档：不弹窗（弹窗遮挡棋盘，只留连线），重开走「再来一局」按钮
    return;}
  humanTurn=false; aiThinking=true;
  setStatus('肥鱼思考中…');
  aiTurn().then(({mv,src})=>{
    aiThinking=false;
    if(mv){ place(mv.r,mv.c,2); draw();
      if(checkWin(mv.r,mv.c,2)){gameOver=true;animateWinLine();setStatus('😤 <b>肥鱼赢了！</b>');return;} }
    humanTurn=true;
    setStatus('你的回合（黑棋）' + (src==='ai'?' · AI助谋':''));
  });
}
// 缓缓描出胜负连线（winLineProg 0→1，约 0.6 秒描完）
let winLineProg = 0, winLineTimer = null;
function animateWinLine(){
  if(!winLine){ draw(); return; }
  if(winLineTimer){ clearInterval(winLineTimer); winLineTimer=null; }
  winLineProg = 0; draw();
  const steps = 24;   // 24 帧
  let n = 0;
  winLineTimer = setInterval(()=>{
    n++;
    winLineProg = Math.min(1, n/steps);
    draw();
    if(n>=steps){
      clearInterval(winLineTimer); winLineTimer=null;
      // 线描完后定格 2 秒，自动开新局
      setTimeout(()=>{ if(STATE==='play' || gameOver) backToPlay(); }, 2000);
    }
  }, 25);   // 25ms × 24 ≈ 0.6 秒
}
/* ============================================================
   剧情/UI 状态机（统一收编，避免定时器踩踏）
   STATE: 'play' | 'result' | 'hellCleared' | 'elderIntro' | 'elderGame' | 'ended'
   - 所有按钮只调 goto(...)
   - 所有定时器登记进 TIMERS，切状态时统一清空
   ============================================================ */
let STATE = 'play';

// 返回 true = 当前局处于特殊模式（特殊档 or 剧情进行中），原则上应拦下劫持操作

  const badState = (typeof STATE!=='undefined') && (STATE==='elderIntro' || STATE==='elderGame' || STATE==='ended' || STATE==='hellCleared');

}

function clearTimers(){ TIMERS.forEach(t=>clearTimeout(t)); TIMERS=[]; }

function toggleOnline(){
  if(onlineMode){ leaveRoom(); return; }
  if(isSpecialMode()){ setStatus('⚠️ 特殊局不能开联机，先回普通局'); return; }
  fetch(ROOM_API+'/create',{method:'POST'}).then(r=>r.json()).then(d=>{
    if(!d.ok) throw 0;
    roomId = d.id; myColor = 1;      // 创建者执黑
    enterRoom();
    const url = location.protocol+'//'+location.hostname+':8899/vd6x59t6ff/?room='+roomId;
    setOnlineBar('🐟 房间 <b>'+roomId+'</b> · 你执黑<br>把网址发对方：<br><span style="color:#ffd86b;word-break:break-all">'+url+'</span>');
  }).catch(()=>{ setOnlineBar('⚠️ 创建房间失败（联机服务没开？）'); });
}
function joinRoom(id){
  fetch(ROOM_API+'/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})})
    .then(r=>r.json()).then(d=>{
      if(!d.ok) throw 0;
      roomId=id; myColor=2; onlineSeq=d.seq||0;   // 加入者执白，从当前同步
      enterRoom();
      setOnlineBar('🐟 已加入房间 <b>'+id+'</b> · 你执白，等待黑方落子…');
    }).catch(()=>{ setOnlineBar('⚠️ 房间不存在或已过期'); });

function startPolling(){
  stopPolling();
  pollTimer = setInterval(()=>{
    fetch(ROOM_API+'/poll?id='+roomId+'&since='+onlineSeq).then(r=>r.json()).then(d=>{
      if(!d.ok) return;

        d.ops.forEach(op=>applyRemoteOp(op));
        onlineSeq = d.seq;
      }
    }).catch(()=>{});
  }, 800);

function sendOp(op){
  if(!onlineMode) return;
  fetch(ROOM_API+'/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:roomId,op})})
    .then(r=>r.json()).then(d=>{ if(d.ok) onlineSeq=d.seq; }).catch(()=>{});
}
function applyRemoteOp(op){
  if(!op || !op.type) return;
  applyingRemote = true;
  if(op.type==='move'){
    if(board[op.r]!==undefined && board[op.r][op.c]===0){ place(op.r,op.c,op.color); }
    if(checkWin(op.r,op.c,op.color)){
      gameOver=true; draw();
      setStatus(op.color===myColor?'🎉 <b>你赢了！</b>':'😤 <b>对方赢了！</b>');
      applyingRemote=false; return;
    }
    humanTurn = (op.color!==myColor);
  } else if(op.type==='undo'){
    for(let k=0;k<2&&moveHistory.length>0;k++){const m=moveHistory.pop();board[m.r][m.c]=0;}
    lastMove=moveHistory.length?{r:moveHistory[moveHistory.length-1].r,c:moveHistory[moveHistory.length-1].c}:null;
    gameOver=false; humanTurn=true;
  } else if(op.type==='reset'){
    initState();
  } else if(op.type==='resign'){
    gameOver=true;
    setStatus(op.color===myColor?'🏁 <b>你认输了</b>':'🏁 <b>对方认输，你胜！</b>');
  }
  applyingRemote=false;
  draw();
  if(!gameOver) setStatus((humanTurn?'你的回合':'等待对方落子…') + (onlineMode?' · 联机':''));
}

  document.getElementById('adBody').textContent = AD.b;
  document.getElementById('adCount').textContent = left + ' 秒后关闭';
  const btn = document.getElementById('adClose');
  btn.disabled = true; btn.textContent = '看完才能悔棋（' + left + '）';
  document.getElementById('modal').classList.add('on');
  clearInterval(adTimer);
  adTimer = setInterval(()=>{
    left--;
    document.getElementById('adCount').textContent = left>0 ? left + ' 秒后关闭' : '看完啦！';
    btn.textContent = left>0 ? ('看完才能悔棋（' + left + '）') : '悔一步';
    if(left<=0){ clearInterval(adTimer); btn.disabled=false; }
  }, 1000);
  btn.onclick = () => {
    document.getElementById('modal').classList.remove('on');
    clearInterval(adTimer);
    if(onDone) onDone();
  };
}

// 无形之手：从左到右缓慢“写”出乱码，再揭示「正在观察你」
let _handTimers=[];
function startHandWriting(el){
  if(!el) return;
  _handTimers.forEach(t=>clearTimeout(t)); _handTimers=[];
  const GLYPHS='▓▒░⣿◢◣✦✧◤◥▚▞◇◆◈❖⁂∷⁝⁞≡≠≈∽∾≋⌁⌇〄〆㉿㊣';
  const N1=14;                 // 乱码字符数
  let buf='';
  // 逐字“写”乱码
  for(let i=0;i<N1;i++){
    _handTimers.push(setTimeout(()=>{
      buf += GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
      el.innerHTML = '<span class="garbled">'+buf+'</span><span class="cursor"></span>';
    }, i*90));
  }
  // 写完乱码 → 清掉，揭示正在观察你
  _handTimers.push(setTimeout(()=>{
    el.innerHTML = '<span class="reveal">正在观察你</span>';
  }, N1*90 + 420));
  // 停留后收起
  _handTimers.push(setTimeout(()=>{
    const wt=document.getElementById('watching');
    if(wt) wt.classList.remove('on');
  }, N1*90 + 420 + 1700));
}
// 地狱常驻提示：天堂和地狱同时盯上了你（只在地狱档显示）

// 悔棋按钮粉末化
function shatterUndoBtn(){
  const b=document.getElementById('undoBtn');
  if(!b || b.classList.contains('gone')) return;
  const rect=b.getBoundingClientRect();
  b.classList.add('shatter');
  // 生成粉末粒子
  for(let i=0;i<26;i++){
    const p=document.createElement('div');
    p.className='powder';
    p.style.left=(rect.left+Math.random()*rect.width)+'px';
    p.style.top=(rect.top+Math.random()*rect.height)+'px';
    p.style.background = ['#9fd8ff','#cfe9ff','#7ec8ff','#e8f4ff'][i%4];
    document.body.appendChild(p);
    const dx=(Math.random()-0.5)*220;
    const dy=-40-Math.random()*120;
    const dur=900+Math.random()*700;
    p.animate([
      { transform:'translate(0,0) scale(1)', opacity:1 },
      { transform:`translate(${dx}px,${dy}px) scale(0)`, opacity:0 }
    ], { duration:dur, easing:'cubic-bezier(.2,.7,.3,1)' }).onfinish=()=>p.remove();
  }
  setTimeout(()=>{ b.classList.remove('shatter'); b.classList.add('gone'); }, 700);
}

// ===== 白饭彩蛋：拖走白饭 → 激怒大肥鱼 → 直接上旧日 =====
(function riceEgg(){
  const el = document.getElementById('riceEgg');
  if(!el) return;
  let dragging=false, sx=0, sy=0, moved=0;
  const start=(x,y)=>{ if(el.classList.contains('hidden')) return; dragging=true; sx=x; sy=y; moved=0; el.style.cursor='grabbing'; };
  const move=(x,y)=>{ if(!dragging) return; const dx=x-sx, dy=y-sy; moved=Math.hypot(dx,dy); el.style.transform='translate('+dx+'px,'+dy+'px)'; };
  const end=()=>{ if(!dragging) return; dragging=false; el.style.cursor='grab';
    if(moved>60){ triggerRiceAnger(); }
    else { el.style.transform=''; }
  };
  el.addEventListener('mousedown', e=>{ e.preventDefault(); start(e.clientX,e.clientY); });
  window.addEventListener('mousemove', e=>move(e.clientX,e.clientY));
  window.addEventListener('mouseup', end);
  el.addEventListener('touchstart', e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); }, {passive:true});
  el.addEventListener('touchmove', e=>{ const t=e.touches[0]; move(t.clientX,t.clientY); }, {passive:true});
  el.addEventListener('touchend', end);
})();
// 白饭可见性：只有“未落子”时露出，开局后自动隐藏（防中途拖拽搅局）
function updateRiceVisibility(){
  const el=document.getElementById('riceEgg');

  const specialDiff = (typeof CUR_DIFF!=='undefined') && (CUR_DIFF==='hell' || CUR_DIFF==='elder' || CUR_DIFF==='rice');
  el.classList.toggle('hidden', started || specialDiff);
}
