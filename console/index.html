<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐳 控制台</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; background:linear-gradient(160deg,#0a1628,#123 60%,#0a1f33);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#dbeafe; padding:14px; }
  h1 { font-size:11px; color:#8fd0ff; text-align:center; margin:8px 0 4px; letter-spacing:1px; }
  .sub { text-align:center; color:#5b7a99; font-size:12px; margin-bottom:14px; }
  #login { max-width:340px; margin:40px auto; text-align:center; }
  #login input { width:100%; padding:12px; border-radius:8px; border:1px solid #2e6f9e;
                 background:#0f2233; color:#dbeafe; font-size:15px; margin-bottom:10px; }
  button { background:#1c3d5a; color:#9fd8ff; border:1px solid #2e6f9e; padding:10px 18px;
           border-radius:8px; font-size:14px; cursor:pointer; font-family:inherit; }
  button:active { transform:scale(.96); }
  .bar { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
  .state { text-align:center; font-size:13px; margin-bottom:10px; }
  .state .on { color:#7ee89a; } .state .off { color:#ff8f8f; }
  #rooms { max-width:820px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
  .card { background:linear-gradient(160deg,#16304a,#0f2233); border:1px solid #2e5f8e; border-radius:12px; padding:12px; }
  .card h3 { margin:0 0 8px; font-size:14px; color:#9fd8ff; display:flex; justify-content:space-between; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; }
  .badge.thinking { background:#7a5a1c; color:#ffd86b; }
  .badge.idle { background:#1c4a2a; color:#7ee89a; }
  .badge.resting { background:#4a1c1c; color:#ff8f8f; }
  canvas { display:block; width:100%; height:auto; background:#e8b96a; border-radius:6px; touch-action:manipulation; cursor:crosshair; }
  .foot { text-align:center; color:#3f5a75; font-size:11px; margin-top:20px; }
  .empty { text-align:center; color:#5b7a99; padding:40px 0; }
</style>
</head>
<body>
<div id="pagesNotice" style="display:none;margin:8px auto;max-width:520px;padding:8px 12px;border-radius:8px;background:#2b2320;border:1px solid #7a5a3a;color:#e8c89a;font-size:12px;line-height:1.6;text-align:left">
🐳 <b>联机暂不可用</b><br>
当前是 GitHub Pages 静态版，没有房间服务器，联机对战开不了。<br>
<b>单机部分完全正常</b>——本地对战照常玩。要联机请回本机站点。
</div>
<script>
(function(){
  // 只有在 GitHub Pages（无 /api/ 后端）时才提示
  if(location.hostname.endsWith('.github.io')){
    document.addEventListener('DOMContentLoaded', function(){
      var el = document.getElementById('pagesNotice');
      if(!el) return;
      el.style.display = 'block';
      // 禁用联机按钮，改为点击即提示
      var btn = document.getElementById('onlineBtn');
      if(btn){
        btn.dataset.origText = btn.textContent;
        btn.textContent = '联机：不可用（静态版）';
        btn.style.opacity = '0.6';
        btn.onclick = function(e){
          e.preventDefault(); e.stopPropagation();
          alert('🐳 联机暂不可用\n\n这是 GitHub Pages 静态版，没有房间服务器。\n单机对战完全正常，联机请回本机站点。');
          return false;
        };
      }
    });
  }
})();
</script>

  <h1>🐳 后台控制台</h1>
  <div class="sub">只有你知道这个地方 · AI 的秘密后厨</div>

  <div id="login">
    <input id="keyInput" type="password" placeholder="密钥" autocomplete="off">
    <button onclick="login()">进入</button>
  </div>

  <div id="panel" style="display:none;">
    <div class="bar">
      <button id="restBtn" onclick="toggleRest()">状态：在线</button>
      <button onclick="loadRooms()">刷新</button>
    </div>
    <div class="state" id="stateLine">等待检测…</div>
    <div style="font-size:11px;color:#3a5a7a;opacity:.7;text-align:right;margin:-2px 0 4px">v3-提子同步</div>
    <div id="rooms"></div>
  </div>

  <div class="foot">🐳 大肥鱼出品 · 别被玩家发现</div>

<script>
const API = '/api/room';
let KEY = '';
let REST = false;
let cards = {};     // roomId -> { canvas, ctx, seq, room }

function login(){
  KEY = document.getElementById('keyInput').value.trim();
  if(!KEY){ return; }
  fetch(API+'/admin/rooms?key='+encodeURIComponent(KEY)).then(r=>r.json()).then(d=>{
    if(!d.ok){ alert('密钥不对'); return; }
    document.getElementById('login').style.display='none';
    document.getElementById('panel').style.display='block';
    loadRooms();
    // 用返回值探测全局休息状态（默认在线）
    setRest(false, true);
    setInterval(loadRooms, 1500);
  }).catch(()=>{ alert('连不上服务'); });
}

function setRest(v, silent){
  REST = v;
  const b = document.getElementById('restBtn');
  if(b){ b.textContent = '状态：' + (v?'休息中':'在线'); b.className = v?'':'on'; b.style.background = v?'#5a1c1c':''; }
  const s = document.getElementById('stateLine');
  if(s) s.innerHTML = '当前：<span class="'+(v?'off':'on')+'">'+(v?'休息中（所有对局拒收）':'在线（可接管落子）')+'</span>';
  if(!silent){
    fetch(API+'/ai/rest',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({key:KEY, rest:v})}).catch(()=>{});
  }
}
function toggleRest(){ setRest(!REST); }

function loadRooms(){
  fetch(API+'/admin/rooms?key='+encodeURIComponent(KEY)).then(r=>r.json()).then(d=>{
    if(!d.ok) return;
    const rooms = d.rooms || [];
    document.getElementById('stateLine').innerHTML =
      '活跃 AI 对局：<b>'+rooms.length+'</b> 局 · 自动休息阈值 '+(d.idleTimeout||90)+' 秒 · 当前状态：<span class="'+(REST?'off':'on')+'">'+(REST?'休息中':'在线')+'</span>';
    renderRooms(rooms);
  }).catch(()=>{});
}

function renderRooms(rooms){
  const box = document.getElementById('rooms');
  if(rooms.length===0){ box.innerHTML = '<div class="empty">暂无活跃对局 🐟</div>'; cards={}; return; }
  const seen = {};
  rooms.forEach(r=>{
    seen[r.id]=true;
    if(!cards[r.id]){
      const el = document.createElement('div');
      el.className='card';
      el.innerHTML = '<h3><span>房间 '+r.id+'</span><span class="badge" id="bd_'+r.id+'">—</span></h3>'+
                     '<div style="text-align:right;margin:-4px 0 6px"><button onclick="delRoom(\''+r.id+'\')" style="padding:4px 10px;font-size:12px;background:#5a1c1c;color:#ffb3b3;border-color:#8a3333">关闭此房</button></div>';
      const cv = document.createElement('canvas'); cv.width=342; cv.height=342;
      el.appendChild(cv);
      box.appendChild(el);
      cards[r.id] = { el, cv, ctx: cv.getContext('2d'), seq: 0, drawn: 0 };
      cv.addEventListener('click', (e)=>onBoardClick(r.id, e));
    }
  });
  // 清理已结束的
  for(const id in cards){ if(!seen[id]){ cards[id].el.remove(); delete cards[id]; } }
  // 更新每局
  rooms.forEach(r=>{
    const c = cards[r.id];
    const bd = document.getElementById('bd_'+r.id);
    if(bd){ bd.className='badge '+r.aiState; bd.textContent = r.aiState==='thinking'?'等你落子':(r.aiState==='resting'?'休息中':'空闲'); }
    if(c && r.seq !== c.drawn){ drawBoard(c, r.moves); c.seq = r.seq; c.drawn = r.seq; c.moves = r.moves; c.bid = r.id; }
    if(c) c.moves = r.moves;
  });
}

// 画棋盘（从 moves 序列重放）
const N=19, PAD=18;
function drawBoard(c, moves){
  const ctx=c.ctx, W=c.cv.width, CELL=(W-PAD*2)/(N-1);
  ctx.clearRect(0,0,W,W);
  ctx.fillStyle='#e8b96a'; ctx.fillRect(0,0,W,W);
  ctx.strokeStyle='#6b4a1e'; ctx.lineWidth=1;
  for(let i=0;i<N;i++){
    ctx.beginPath(); ctx.moveTo(PAD, PAD+i*CELL); ctx.lineTo(W-PAD, PAD+i*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD+i*CELL, PAD); ctx.lineTo(PAD+i*CELL, W-PAD); ctx.stroke();
  }
  // 星位（与玩家端一致）
  const stars=[[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]];
  ctx.fillStyle='#6a4a1e';
  stars.forEach(([x,y])=>{ ctx.beginPath(); ctx.arc(PAD+x*CELL, PAD+y*CELL, Math.max(CELL*0.12,2), 0, Math.PI*2); ctx.fill(); });
  const board=[];
  for(let r=0;r<N;r++){ board.push(new Array(N).fill(0)); }
  (moves||[]).forEach(m=>{
    if(m.type==='move'){
      board[m.r][m.c] = (m.color==='B'||m.color===1)?1:2;
      // 提子：把这一手被提的子从盘上抹掉（同步玩家端 captured）
      if(m.captured && m.captured.length){
        m.captured.forEach(p=>{
          const sr=Array.isArray(p)?p[0]:p.r, sc=Array.isArray(p)?p[1]:p.c;
          if(sr>=0&&sr<N&&sc>=0&&sc<N) board[sr][sc]=0;
        });
      }
    }
    else if(m.type==='reset'){ for(let r=0;r<N;r++)for(let cc=0;cc<N;cc++) board[r][cc]=0; }
  });
  for(let r=0;r<N;r++)for(let cc=0;cc<N;cc++){
    if(!board[r][cc]) continue;
    const x=PAD+cc*CELL, y=PAD+r*CELL;
    ctx.beginPath(); ctx.arc(x,y,CELL*0.44,0,6.28);
    ctx.fillStyle = board[r][cc]===1?'#111':'#f5f5f5'; ctx.fill();
    ctx.strokeStyle='#444'; ctx.stroke();
  }
}

// 删除（关闭）一个房间：调后端 /ai/close，玩家端会被踢出并提示
function delRoom(rid){
  if(!confirm('关闭房间 '+rid+' ？玩家会被踢出。')) return;
  fetch(API+'/ai/close',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:rid})}).then(r=>r.json()).then(d=>{
      loadRooms();
    }).catch(()=>{ alert('关闭失败'); });
}

// 点棋盘 → 代 AI 落子（AI 执白）
function onBoardClick(rid, e){
  const c = cards[rid]; if(!c) return;
  const rect = c.cv.getBoundingClientRect();
  const W = c.cv.width, CELL=(W-PAD*2)/(N-1);
  const x=(e.clientX-rect.left)*(W/rect.width), y=(e.clientY-rect.top)*(W/rect.height);
  const col=Math.round((x-PAD)/CELL), row=Math.round((y-PAD)/CELL);
  if(row<0||row>=N||col<0||col>=N) return;
  // 是否为空（从 c.moves 判断）
  let occupied=false;
  (c.moves||[]).forEach(m=>{ if(m.type==='move'&&m.r===row&&m.c===col) occupied=true; });
  if(occupied){ return; }
  // 默认白（AI），不再弹窗询问
  const color = 2;
  fetch(API+'/ai/move',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key:KEY, id:rid, op:{type:'move', r:row, c:col, color:'W'}})})
    .then(r=>r.json()).then(d=>{ if(d.ok) loadRooms(); else alert('落子失败（可能没轮到你）'); });
}
</script>
</body>
</html>
