<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肥鱼游戏厅</title>
<!--
  startup/index.html —— 游戏厅开屏
  干什么：播 dsh-startup-screen 的开机动画，动画放完自动进游戏厅（无按钮）
  用了什么：
    · splash.js / splash.css —— dsh-startup-screen (MIT, © 2026 沈宏宏)
    · 3D 档案环（彩蛋）见 ../rhine-lab/，入口在游戏厅首页
  输入：无（纯前端）
  输出：动画结束自动跳转 ../arcade.html（Esc 可提前跳）
  版本：v1.1-自动跳转·去按钮 20261105
-->
<link rel="stylesheet" href="./lib/splash.css">
<style>
  html, body { margin: 0; padding: 0; background: #0a0e15; }
</style>
</head>
<body>

<script>
(function () {
  function goArcade() {
    try { sessionStorage.setItem('feiyuEntered', '1'); } catch (e) {}
    location.href = '../arcade.html';
  }

  /* 2026-11-05 老爹要求：动画放完直接进，不要按钮。
     原来的「进入游戏厅 / 跳过动画」两个按钮已移除 —— 会在动画尾巴上闪一下。 */
  window.addEventListener('dsh-startup:done', goArcade);

  /* 极端兜底：脚本压根没跑起来（90 秒还停在开屏）才直接跳，不显示按钮 */
  setTimeout(goArcade, 90000);

  /* Esc 直接进 */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') goArcade();
  });
})();
</script>

<script src="./lib/splash.js"></script>
</body>
</html>
