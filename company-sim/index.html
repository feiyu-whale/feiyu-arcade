<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏢 公司经营模拟</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh;
    background:radial-gradient(120% 90% at 50% 0%, #1a2430 0%, #0d141c 55%, #05080c 100%);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#c8d8e8; padding:16px 12px 60px; user-select:none;
  }
  .back { display:inline-block; text-decoration:none; color:#6a8aaa; font-size:10px; margin-bottom:8px;
    padding:6px 12px; border:1px solid #2a4055; border-radius:20px; }
  h1 { font-size:13px; text-align:center; color:#60a0e0; font-weight:700; letter-spacing:2px; margin:4px 0 4px; }
  .sub { text-align:center; color:#7a94ac; font-size:10px; margin-bottom:12px; line-height:1.7; }
  .wrap { max-width:760px; margin:0 auto; }

  /* 开局选择 */
  #setup { background:linear-gradient(160deg,#16202c,#0a1018); border:1px solid #24405a; border-radius:14px; padding:16px; }
  .setup-title { font-size:11px; color:#80b8e8; margin-bottom:12px; font-weight:700; }
  .segopt { display:block; margin-bottom:8px; padding:10px 12px; border:1px solid #24405a; border-radius:10px;
    cursor:pointer; transition:.15s; }
  .segopt:active { background:#162430; }
  .segopt input { display:none; }
  .segopt input:checked + .segbox { color:#80d0ff; }
  .segopt input:checked ~ * { }
  .segbox { display:flex; align-items:center; gap:10px; }
  .segname { font-size:12px; font-weight:700; }
  .segdesc { font-size:10px; color:#7a94ac; }
  .segdata { font-size:9px; color:#6a8aa8; margin-top:4px; line-height:1.6; }
  .segdiff { margin-left:auto; font-size:10px; color:#c0a050; }
  .startbtn { width:100%; margin-top:12px; padding:12px; background:linear-gradient(160deg,#1e4a6a,#0e2a40);
    border:1px solid #3060a0; border-radius:10px; color:#a0d8ff; font-size:12px; font-weight:700; cursor:pointer; }
  .startbtn:active { transform:scale(.98); }

  /* 状态栏 */
  #game { display:none; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px; }
  .stat { background:linear-gradient(160deg,#14202c,#0a1018); border:1px solid #1e3448; border-radius:9px;
    padding:8px 6px; text-align:center; }
  .stat .k { font-size:9px; color:#7a94ac; margin-bottom:3px; }
  .stat .v { font-size:12px; font-weight:700; color:#a0c8e8; }
  .v.bad { color:#e05050; }
  .v.warn { color:#d0a040; }
  .good { color:#50c080; }
  .bad { color:#e05050; }

  .actions { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px; }
  .tbtn { padding:9px 4px; background:linear-gradient(160deg,#1a2c3c,#0c1620); border:1px solid #28485f;
    border-radius:8px; color:#80b0d0; font-size:10px; cursor:pointer; font-weight:600; }
  .tbtn:active { transform:scale(.96); background:#203848; }
  .tbtn:disabled { opacity:.35; cursor:not-allowed; }
  .tbtn.primary { background:linear-gradient(160deg,#1e5a3a,#0e3020); border-color:#30a060; color:#80e0a0; }

  /* 日志 */
  #log { background:linear-gradient(160deg,#141e28,#080e14); border:1px solid #1e3448; border-radius:12px;
    padding:12px; min-height:100px; margin-bottom:10px; font-size:10px; line-height:1.8; }
  .logtitle { font-size:11px; color:#80b8e8; font-weight:700; margin-bottom:8px; }
  table.detail { width:100%; border-collapse:collapse; font-size:10px; }
  table.detail td { padding:3px 4px; }
  table.detail td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  table.detail tr.total { border-top:1px solid #2a4055; font-weight:700; }
  .event { background:#1c1a10; border:1px solid #4a3a18; border-radius:9px; padding:9px 11px; margin-top:10px; }
  .evtitle { color:#e0b050; font-size:10px; font-weight:700; margin-bottom:4px; }
  .evtext { color:#a09070; font-size:10px; line-height:1.7; }
  .evresult { margin-top:8px; padding:7px 10px; background:#0e1a12; border-left:2px solid #30a060;
    border-radius:4px; font-size:10px; color:#80c8a0; line-height:1.7; }
  .evresult.bad { background:#1a0e0e; border-color:#c04040; color:#e08080; }
  .evresult.warn { background:#1a1608; border-color:#c0a040; color:#e0c080; }
  .choices { display:grid; gap:6px; margin-top:9px; }
  .choice { padding:9px 11px; background:#16283a; border:1px solid #2a4a68; border-radius:8px;
    color:#90c0e0; font-size:10px; cursor:pointer; text-align:left; }
  .choice:active { background:#1e3850; }

  /* 换赛道面板 */
  #switchPanel { display:none; background:#101820; border:1px solid #3a2a4a; border-radius:12px; padding:12px; margin-bottom:10px; }
  .switem { padding:10px; border:1px solid #2a3a4a; border-radius:9px; margin-bottom:8px; }
  .switem.disabled { opacity:.5; }
  .swname { font-size:11px; font-weight:700; color:#a0b8d0; }
  .swdesc { font-size:9px; color:#5a7090; margin:3px 0; }
  .swcost { font-size:10px; color:#c0a050; margin:5px 0; }
  .swcost.bad { color:#c06060; }

  /* 历史 */
  .hist-wrap { background:linear-gradient(160deg,#141e28,#080e14); border:1px solid #1e3448;
    border-radius:12px; padding:10px; }
  .hist-title { font-size:10px; color:#7a94ac; margin-bottom:6px; }
  table.hist { width:100%; border-collapse:collapse; font-size:9px; }
  table.hist th { color:#40607a; font-weight:400; padding:3px; text-align:right; }
  table.hist th:first-child { text-align:left; }
  table.hist td { padding:3px; text-align:right; font-variant-numeric:tabular-nums; }
  table.hist td:first-child { text-align:left; color:#5a7090; }

  .over { text-align:center; font-size:16px; color:#e05050; padding:20px; font-weight:700; }
  .ver { text-align:center; color:#4a6070; font-size:9px; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../finance-sim/">← 回模拟金融</a>
  <h1>🏢 公司经营模拟</h1>
  <div class="sub">规则与成本结构全部来自真实上市公司财报<br>随机只决定"什么时候来"，不决定"合不合理"</div>

  <!-- 开局 -->
  <div id="setup">
    <div class="setup-title">选择你要开的店</div>
    <label class="segopt">
      <input type="radio" name="seg" value="zhengcan" checked>
      <div class="segbox"><div>
        <div class="segname">🍽️ 正餐</div>
        <div class="segdesc">家常菜 / 地方菜 / 老字号</div>
        <div class="segdata">全聚德、同庆楼、西安饮食真实数据</div>
      </div><div class="segdiff">难度 ★★★☆☆</div></div>
    </label>
    <label class="segopt">
      <input type="radio" name="seg" value="huoguo">
      <div class="segbox"><div>
        <div class="segname">🍲 火锅</div>
        <div class="segdesc">火锅 / 川渝 / 潮汕</div>
        <div class="segdata">海底捞、呷哺呷哺、九毛九真实数据</div>
      </div><div class="segdiff">难度 ★★☆☆☆</div></div>
    </label>
    <label class="segopt">
      <input type="radio" name="seg" value="kuaican">
      <div class="segbox"><div>
        <div class="segname">🍔 快餐</div>
        <div class="segdesc">中式快餐 / 西式连锁</div>
        <div class="segdata">百胜中国真实数据</div>
      </div><div class="segdiff">难度 ★★☆☆☆</div></div>
    </label>
    <label class="segopt">
      <input type="radio" name="seg" value="chayin">
      <div class="segbox"><div>
        <div class="segname">🧋 茶饮</div>
        <div class="segdesc">奶茶 / 果茶 / 加盟模式</div>
        <div class="segdata">蜜雪冰城、古茗、茶百道真实数据</div>
      </div><div class="segdiff">难度 ★☆☆☆☆</div></div>
    </label>
    <button class="startbtn" onclick="startGame()">开始经营</button>
  </div>

  <!-- 游戏主体 -->
  <div id="game">
    <div class="stats">
      <div class="stat"><div class="k">现金</div><div class="v" id="cash">-</div></div>
      <div class="stat"><div class="k">负债</div><div class="v" id="debt">-</div></div>
      <div class="stat"><div class="k">月份</div><div class="v" id="month">0</div></div>
      <div class="stat"><div class="k">门店</div><div class="v" id="stores">1</div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">品类</div><div class="v" id="seg">-</div></div>
      <div class="stat"><div class="k">阶段</div><div class="v" id="stage">-</div></div>
      <div class="stat"><div class="k">口碑</div><div class="v" id="rep">50</div></div>
      <div class="stat"><div class="k">士气</div><div class="v" id="morale">70</div></div>
    </div>

    <div class="actions">
      <button class="tbtn primary" id="btnNext" onclick="doSettle()">▶ 下一个月</button>
      <button class="tbtn" id="btnOpen" onclick="doOpen()">开新店</button>
      <button class="tbtn" onclick="doBorrow()">贷款 20万</button>
      <button class="tbtn" onclick="showSwitch()">换赛道</button>
    </div>

    <div id="status"></div>
    <div id="switchPanel"></div>
    <div id="log"></div>

    <div class="hist-wrap">
      <div class="hist-title">最近 12 个月</div>
      <table class="hist">
        <thead><tr><th>月</th><th>营收</th><th>净利</th><th>月末现金</th></tr></thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </div>

  <div class="ver">v1.0.0-首版单店 20261024</div>
</div>

<script src="params.js"></script>
<script src="engine.js"></script>
<script src="events.js"></script>
<script src="ui.js"></script>
</body>
</html>
