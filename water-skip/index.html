<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐳 打水漂</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0a1626;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#dcecff; user-select:none; }
  #cv { display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  .hud { position:fixed; top:10px; left:12px; font-size:13px; line-height:1.7; pointer-events:none;
    text-shadow:0 2px 8px rgba(0,0,0,.8); }
  .hud b { color:#7fd4ff; font-size:20px; }
  .hud .sub { font-size:11px; color:#8fa8c4; }
  .right { position:fixed; top:10px; right:12px; text-align:right; font-size:11px; line-height:1.8;
    color:#8fa8c4; pointer-events:none; text-shadow:0 2px 8px rgba(0,0,0,.8); }
  .right b { color:#ffd479; }
  .pow { position:fixed; left:12px; bottom:14px; width:140px; pointer-events:none; }
  .pow .bar { height:7px; background:rgba(110,160,210,.28); border:1px solid rgba(127,212,255,.35); border-radius:4px; overflow:hidden; }
  .pow .fill { height:100%; width:0%; background:linear-gradient(90deg,#3fa9f5,#7fd4ff,#ffd479); transition:width .05s; }
  .pow .lab { font-size:10px; color:#8fa8c4; margin-bottom:4px; }
  .tip { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); font-size:11px;
    color:#8fa8c4; pointer-events:none; text-align:center; line-height:1.8; }
  .ver { position:fixed; right:10px; bottom:8px; font-size:10px; color:#4a6a90; pointer-events:none; }
  .center { position:fixed; left:50%; top:42%; transform:translate(-50%,-50%); text-align:center;
    pointer-events:none; opacity:0; transition:opacity .25s; }
  .center.show { opacity:1; }
  .center .big { font-size:56px; font-weight:800; color:#ffd479; text-shadow:0 4px 24px rgba(255,180,60,.6); }
  .center .txt { font-size:15px; color:#dcecff; margin-top:6px; }
  .center .rec { font-size:12px; color:#7fd4ff; margin-top:10px; letter-spacing:1px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud">
  本局 <b id="score">0</b> 跳<br>
  <span class="sub">最高 <span id="best">0</span> · 本回合 <span id="round">1</span>/5</span>
</div>
<div class="right">
  抛射角度 <b id="ang">20°</b><br>
  出手速度 <b id="spd">0</b>
</div>
<div class="pow">
  <div class="lab">力度（按住蓄力，松手飞出）</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
</div>
<div class="tip" id="tip">按住蓄力 → 松手甩出 · 石子贴着水面才跳得远</div>

<div class="center" id="center">
  <div class="big" id="cbig">0 跳</div>
  <div class="txt" id="ctxt"></div>
  <div class="rec" id="crec"></div>
</div>

<div class="ver">v2.4.3-影子贴近才画 20261027</div>

<script src="physics.js"></script>
<script src="waterfield.js"></script>
<script>
(() => {
'use strict';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  computeWater();
  recalcScale();
}

function initWater() {
  const cols = 200, rows = 100;
  const c = 18;                       // 波速（格/秒）
  WATER = new WaterField(cols, rows, c);
  WATER.dtMax = 0.7071 / c;
}
addEventListener('resize', () => { resize(); initWater(); });

// ===== 场景参数 =====
let horizon = 0, waterTop = 0;
function computeWater() {
  horizon = H * 0.30;
  waterTop = horizon;
}
computeWater();

// ===== 状态 =====
// ===== 单位换算：物理世界(米/秒) → 画面(像素) =====
let PPM = 320;                // pixels per meter（每米多少像素），随屏高自适应
function recalcScale() { PPM = Math.max(180, Math.min(520, H * 0.34)); }
const G = PHYS.g * PPM;       // 重力 px/s^2（由真重力换算）
const ROUNDS = 5;
let stone = null;
let ripples = [];
let splashes = [];
let skips = 0;
let best = +(localStorage.getItem('skipping_best') || 0);
let round = 1;
let charging = false, chargeStart = 0, power = 0;
let lastAngle = 20, lastSpeed = 0;
let camShake = 0;
let WATER = null;          // 水面波动场
let waveTime = 0;
let trail = [];
let gameOver = false;
let waitingTap = false;

const el = {
  score: document.getElementById('score'),
  best: document.getElementById('best'),
  round: document.getElementById('round'),
  ang: document.getElementById('ang'),
  spd: document.getElementById('spd'),
  fill: document.getElementById('fill'),
  center: document.getElementById('center'),
  cbig: document.getElementById('cbig'),
  ctxt: document.getElementById('ctxt'),
  crec: document.getElementById('crec'),
  tip: document.getElementById('tip'),
};
el.best.textContent = best;

// ===== 音效（WebAudio 现算，零文件） =====
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC || null;
}
function blip(freq, dur, vol, type) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq * 0.55, a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, vol) {
  const a = ac(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain(); g.gain.value = vol;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.8;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start();
}

// ===== 水面渲染数据 =====
const farWaves = [];
for (let i = 0; i < 40; i++) farWaves.push({ x: Math.random(), y: Math.random(), s: 0.3 + Math.random() * 0.8 });

// ===== 石子 =====
function resetStone() {
  // 物理量（米/秒/弧度），绘制时乘 PPM
  stone = {
    mx: 1.0,                                  // 米：距左边界
    my: 0.12,                                 // 米：贴水面出手（12cm）
    vx: 0, vy: 0,                             // m/s
    theta: 0.12,                              // 姿态角 rad（盘面与水平夹角）
    omega: 0,                                 // 自旋 rad/s
    flying: false, done: false,
    bounces: 0,
    inWater: false,
    contactCooldown: 0
  };
  // 画面坐标（由物理量换算）
  stone.x = stone.mx * PPM;
  stone.y = waterTop - stone.my * PPM;
  stone.r = Math.max(16, PHYS.stone.r * PPM);   // 视觉最小 16px，太小看不见
  stone.rot = 0;
  stone.spin = 0;
  skips = 0;
  trail = [];
  if (WATER) WATER.clear();
}

function launch(powerRatio) {
  // 真实量级：人手甩石子 12~28 m/s，仰角 5°~25°，自旋 40~120 rad/s
  const angleDeg = 3 + powerRatio * 11;           // 3°~14°（打水漂要压得平）
  const speedMs = 12 + powerRatio * 16;           // m/s
  const a = angleDeg * Math.PI / 180;

  stone.vx = Math.cos(a) * speedMs;
  stone.vy = -Math.sin(a) * speedMs;              // 物理坐标 y 向下为正
  stone.theta = -a * 0.55;                        // 出手时盘面略抬头
  stone.omega = -(18 + powerRatio * 26);         // 自旋 18~44 rad/s（约每秒 3~7 圈）
  stone.flying = true;
  stone.done = false;
  stone.inWater = false;
  stone.contactCooldown = 0;

  lastAngle = angleDeg;
  lastSpeed = speedMs.toFixed(1);
  el.ang.textContent = angleDeg.toFixed(0) + '°';
  el.spd.textContent = lastSpeed + ' m/s';

  noise(0.12, 0.10);
  noise(0.08, 0.06);
}

// ===== 水面碰撞 =====
function waterY(x) {
  // 轻微起伏，让水面有生命
  return waterTop + Math.sin(x * 0.008 + performance.now() * 0.0009) * 2.2;
}

function doBounceFX(x) {
  const y = waterY(x);
  // 水花（物理坐标速度 → 像素速度）
  for (let i = 0; i < 7; i++) {
    splashes.push({
      x: x, y: y,
      vx: (Math.random() - 0.35) * 90 + Math.abs(stone.vx) * PPM * 0.06,
      vy: -(60 + Math.random() * 170),
      r: 1 + Math.random() * 2.2,
      life: 1
    });
  }
  blip(520 + stone.bounces * 46, 0.09, 0.09, 'sine');
  noise(0.06, 0.05);
  camShake = Math.min(6, 1.6 + stone.bounces * 0.25);
}

function sink() {
  if (stone.done) return;
  stone.done = true;
  stone.flying = false;
  const y = waterY(stone.x);
  // 沉没时给水面一个较大冲量
  if (WATER) {
    const vImpact = Math.hypot(stone.vx, stone.vy) || 3;
    const gcol = (stone.mx * PPM / W) * WATER.cols;
    WATER.impulseSmooth(gcol, 2, Math.min(9, vImpact * 0.3), 4.0, 10);
  }
  ripples.push({ x: stone.x, y: y, r: 2, maxR: 46, a: 0.6, life: 1 });
  for (let i = 0; i < 14; i++) {
    splashes.push({
      x: stone.x, y: y,
      vx: (Math.random() - 0.5) * 130,
      vy: -(90 + Math.random() * 230),
      r: 1 + Math.random() * 2.6,
      life: 1
    });
  }
  blip(220, 0.28, 0.12, 'sine');
  noise(0.22, 0.09);
  camShake = 5;
  endRound();
}

// ===== 回合 =====
function endRound() {
  const newBest = skips > best;
  if (newBest) { best = skips; localStorage.setItem('skipping_best', best); el.best.textContent = best; }

  el.cbig.textContent = skips + ' 跳';
  let msg;
  if (skips === 0) msg = '直接沉了……再来一次';
  else if (skips < 3) msg = '石头没吃住水，角度再压低些';
  else if (skips < 6) msg = '有点样子了';
  else if (skips < 10) msg = '漂亮！这块石头认水';
  else if (skips < 16) msg = '厉害，鱼都服了';
  else msg = '大师级！水面都被你打穿了';
  el.ctxt.textContent = msg;
  el.crec.textContent = newBest ? '★ 新纪录 ★' : '最高 ' + best;
  el.center.classList.add('show');

  if (round >= ROUNDS) {
    gameOver = true;
    waitingTap = true;
    el.ctxt.textContent = msg + ' · 点一下重开';
  } else {
    round++;
    el.round.textContent = round;
    setTimeout(() => {
      el.center.classList.remove('show');
      resetStone();
    }, 1250);
  }
}

function restart() {
  round = 1; el.round.textContent = 1;
  gameOver = false; waitingTap = false;
  el.score.textContent = 0;
  el.center.classList.remove('show');
  resetStone();
}

// ===== 输入 =====
function pointerDown(e) {
  e.preventDefault();
  ac();
  if (waitingTap) { restart(); return; }
  if (stone.done || stone.flying) return;
  charging = true;
  chargeStart = performance.now();
}
function pointerUp(e) {
  e.preventDefault();
  if (!charging) return;
  charging = false;
  const p = Math.min(1, power);
  el.fill.style.width = '0%';
  power = 0;
  launch(p);
}
cv.addEventListener('pointerdown', pointerDown);
cv.addEventListener('pointerup', pointerUp);
cv.addEventListener('pointercancel', () => { charging = false; power = 0; el.fill.style.width = '0%'; });

// 键盘：空格蓄力
let keyCharge = false;
addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (keyCharge) return;
  if (waitingTap) { restart(); return; }
  if (stone.done || stone.flying) return;
  keyCharge = true; charging = true; chargeStart = performance.now(); ac();
});
addEventListener('keyup', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (!keyCharge) return;
  keyCharge = false;
  pointerUp(e);
});

// ===== 更新 =====
function update(dt) {
  // 蓄力
  if (charging) {
    const t = (performance.now() - chargeStart) / 1000;
    power = Math.min(1, t / 1.15);
    el.fill.style.width = (power * 100).toFixed(0) + '%';
    const a = 8 + power * 26;
    el.ang.textContent = a.toFixed(0) + '°';
    el.spd.textContent = Math.round(620 + power * 780);
  }

  // 石子飞行（真实物理积分）
  if (stone.flying && !stone.done) {
    // 物理子步：用小步长保证稳定
    const SUB = 4;
    const sdt = dt / SUB;
    for (let k = 0; k < SUB; k++) {
      const prevMy = stone.my;
      // 是否接触水面（物理坐标：水面 y=0，向下为正）
      const touching = stone.my <= 0;

      if (touching && stone.contactCooldown <= 0) {
        // 入水：把速度给水面，产生真实的波
        const vImpact = Math.hypot(stone.vx, stone.vy);
        const strength = Math.min(6, vImpact * 0.22);
        const gcol = Math.min(WATER.cols - 3, Math.max(2, (stone.x / W) * WATER.cols));
        const grow = 2;   // 入水点靠近地平线（水面顶部一行）
        WATER.impulseSmooth(gcol, grow, strength, 3.2 + vImpact * 0.14, 6);

        const res = contact(stone.vx, stone.vy, stone.theta, stone.omega);
        if (res.bounce) {
          stone.vx = res.vx;
          stone.vy = res.vy;
          stone.omega = res.omega;
          stone.my = 0.004;              // 抬离水面一点
          stone.bounces++;
          skips++;
          el.score.textContent = skips;
          doBounceFX(stone.x);
          stone.contactCooldown = PHYS.contactTime;
        } else {
          sink();
          return;
        }
      } else {
        // 空中/水下：用真实水动力（贴水面滑行时）
        // 浸入比例：石子中心越深，浸入越多（半径 0.03m）
        let immersion = 0;
        if (touching) {
          immersion = Math.min(0.35, (Math.abs(stone.my) / PHYS.stone.r) * 0.35);
        }
        const hf = touching ? hydroForce(stone.vx, stone.vy, stone.theta, immersion) : null;
        let ax = 0, ay = -PHYS.g;        // 重力：物理坐标向上为正，重力取负
        if (hf) {
          ax += hf.fx / PHYS.stone.mass;
          ay += hf.fy / PHYS.stone.mass;
        }
        stone.vx += ax * sdt;
        stone.vy += ay * sdt;
        stone.my += stone.vy * sdt;      // vy<0 表示向上 → my 减小 = 往下落
        stone.mx += stone.vx * sdt;
        // 姿态角跟着速度方向走（气流水流作用），不由自旋直接推
        // 飞行中盘面趋于跟随速度方向，但陀螺稳定让它保持较平
        const velAng = Math.atan2(stone.vy, Math.abs(stone.vx));
        const targetTheta = velAng * 0.35;          // 只跟一部分，保持盘面较平
        const spinStab = Math.min(1, Math.abs(stone.omega) / 40);  // 自旋越稳越不易偏
        const follow = 2.2 * (1 - spinStab * 0.65);  // 自旋快 → 姿态更稳
        stone.theta += (targetTheta - stone.theta) * follow * sdt;
        // 自旋本身只转不翻，不改变姿态角
        stone.omega *= Math.pow(0.997, sdt * 1000);
      }

      if (stone.contactCooldown > 0) stone.contactCooldown -= sdt;

      // 姿态崩了 / 自旋不够 / 速度没了 → 沉
      if (stone.my < -0.05 || Math.abs(stone.theta) > PHYS.criticalAngle) {
        sink(); return;
      }

      // 画面坐标换算
      stone.x = stone.mx * PPM;
      stone.y = waterTop - stone.my * PPM;
      stone.rot += stone.omega * sdt;
      stone.r = Math.max(16, PHYS.stone.r * PPM);

      // 出界
      if (stone.x > W + 100) { if (!stone.done) { stone.done = true; stone.flying = false; endRound(); } return; }
    }

    trail.push({ x: stone.x, y: stone.y, a: 1 });
    if (trail.length > 26) trail.shift();
  }

  // 尾迹衰减
  for (let i = trail.length - 1; i >= 0; i--) {
    trail[i].a -= dt * 2.2;
    if (trail[i].a <= 0) trail.splice(i, 1);
  }

  // 涟漪
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    rp.life -= dt * 0.85;
    rp.r += (rp.maxR - rp.r) * dt * 4.5;
    if (rp.life <= 0) ripples.splice(i, 1);
  }

  // 水花
  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i];
    s.life -= dt * 1.5;
    s.vy += 900 * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.life <= 0 || s.y > waterY(s.x) + 6) splashes.splice(i, 1);
  }

  camShake *= Math.pow(0.001, dt);
  if (camShake < 0.1) camShake = 0;
}

// ===== 绘制 =====
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, '#0d2038');
  g.addColorStop(0.55, '#1b3a5c');
  g.addColorStop(1, '#3d6a8f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizon + 2);

  // 月亮
  const mx = W * 0.78, my = horizon * 0.32, mr = Math.min(34, W * 0.055);
  const mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 3.4);
  mg.addColorStop(0, 'rgba(220,240,255,.35)');
  mg.addColorStop(1, 'rgba(220,240,255,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, my, mr * 3.4, 0, 7); ctx.fill();
  // 月面
  const moonG = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr);
  moonG.addColorStop(0, '#ffffff');
  moonG.addColorStop(0.7, '#eef6ff');
  moonG.addColorStop(1, '#dbe6f2');
  ctx.fillStyle = moonG;
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.fill();
  // 环形山（固定位置，不闪）
  ctx.save();
  ctx.globalAlpha = 0.13;
  ctx.fillStyle = '#8090a8';
  const craters = [[-0.30, -0.18, 0.26], [0.22, 0.10, 0.19], [-0.08, 0.34, 0.16], [0.34, -0.28, 0.12], [-0.40, 0.22, 0.10]];
  for (const [dx, dy, dr] of craters) {
    ctx.beginPath();
    ctx.arc(mx + dx * mr, my + dy * mr, dr * mr, 0, 7);
    ctx.fill();
  }
  ctx.restore();

  // 星
  ctx.fillStyle = 'rgba(220,240,255,.55)';
  for (let i = 0; i < 60; i++) {
    const sx = (i * 197.3) % W;
    const sy = (i * 83.7) % (horizon * 0.85);
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(performance.now() * 0.001 + i));
    ctx.globalAlpha = tw * 0.6;
    ctx.fillRect(sx, sy, 1.4, 1.4);
  }
  ctx.globalAlpha = 1;
}

function drawWater() {
  // 底色
  const g = ctx.createLinearGradient(0, horizon, 0, H);
  g.addColorStop(0, '#2f5e85');
  g.addColorStop(0.35, '#1c3f60');
  g.addColorStop(1, '#0b1d30');
  ctx.fillStyle = g;
  ctx.fillRect(0, horizon, W, H - horizon);

  // ===== 水面渲染 v2.3.0：稳定版（正弦波 + 透视 + 波光明暗） =====
  // 不用离屏画布、不用法线反射，只做能看懂的波形。
  const wH = H - horizon;
  const t = waveTime;

  // --- 1) 横向波纹：按透视行距画正弦线，近处疏、远处密 ---
  ctx.save();
  const LINES = 46;                        // 水面横线数
  for (let i = 0; i < LINES; i++) {
    const tv = i / LINES;                  // 0=远 1=近
    const y = horizon + Math.pow(tv, 1.75) * wH;
    if (y > H) break;

    // 近处的波更高、更明显
    const amp = 0.6 + tv * 5.5;
    const freq = 0.010 + tv * 0.006;
    const speed = 0.9 + tv * 0.5;
    const phase = tv * 9;

    ctx.beginPath();
    for (let x = 0; x <= W; x += 6) {
      const wy = y + Math.sin(x * freq + t * speed + phase) * amp
                   + Math.sin(x * freq * 2.3 - t * speed * 0.7 + phase * 1.7) * amp * 0.35;
      if (x === 0) ctx.moveTo(x, wy);
      else ctx.lineTo(x, wy);
    }

    // 近处线更亮、更粗
    const lum = 0.30 + tv * 0.55;
    const alpha = 0.055 + tv * 0.13;
    ctx.strokeStyle = 'rgba(' + Math.round(120 + lum * 70) + ',' +
                                 Math.round(170 + lum * 60) + ',' +
                                 Math.round(215 + lum * 40) + ',' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 0.7 + tv * 1.6;
    ctx.stroke();
  }
  ctx.restore();

  // --- 2) 月光带：月亮正下方一条柔和的竖带 ---
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const moonX = W * 0.78;
  const bandW = Math.min(W * 0.09, 68);
  const mg = ctx.createLinearGradient(0, horizon, 0, H);
  mg.addColorStop(0, 'rgba(200,232,255,.16)');
  mg.addColorStop(0.35, 'rgba(195,228,255,.11)');
  mg.addColorStop(1, 'rgba(185,220,255,.03)');
  // 用径向渐变做柔边（中心亮、边缘淡）
  const mgRad = ctx.createRadialGradient(moonX, horizon + wH * 0.4, 0, moonX, horizon + wH * 0.4, Math.max(W * 0.30, wH));
  mgRad.addColorStop(0, 'rgba(200,232,255,.20)');
  mgRad.addColorStop(0.35, 'rgba(195,228,255,.11)');
  mgRad.addColorStop(1, 'rgba(180,218,255,0)');
  ctx.fillStyle = mgRad;
  ctx.beginPath();
  ctx.moveTo(moonX - bandW * 0.22, horizon);
  for (let y = horizon; y <= H; y += 8) {
    const tv = (y - horizon) / wH;
    const w = bandW * (0.25 + Math.pow(tv, 1.3) * 1.5);
    // 用真实波高扰动边缘
    const colF = Math.max(0, Math.min(WATER.cols - 1, Math.round((moonX / W) * (WATER.cols - 1))));
    const rowF = Math.max(0, Math.min(WATER.rows - 1, Math.round(tv * (WATER.rows - 1))));
    const hgt = WATER.total(colF, rowF, t);
    const wob = Math.sin(y * 0.028 + t * 1.1) * w * 0.16 + hgt * w * 0.45;
    ctx.lineTo(moonX + w + wob, y);
  }
  for (let y = H; y >= horizon; y -= 8) {
    const tv = (y - horizon) / wH;
    const w = bandW * (0.25 + Math.pow(tv, 1.3) * 1.5);
    const colF2 = Math.max(0, Math.min(WATER.cols - 1, Math.round((moonX / W) * (WATER.cols - 1))));
    const rowF2 = Math.max(0, Math.min(WATER.rows - 1, Math.round(tv * (WATER.rows - 1))));
    const hgt2 = WATER.total(colF2, rowF2, t);
    const wob = Math.sin(y * 0.028 - t * 1.1) * w * 0.16 + hgt2 * w * 0.45;
    ctx.lineTo(moonX - w + wob, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 地平线：上下双向渐变，消掉硬边
  const fogUp = ctx.createLinearGradient(0, horizon - 26, 0, horizon + 2);
  fogUp.addColorStop(0, 'rgba(110,155,195,0)');
  fogUp.addColorStop(1, 'rgba(118,162,200,.78)');
  ctx.fillStyle = fogUp;
  ctx.fillRect(0, horizon - 34, W, 38);

  const fogDown = ctx.createLinearGradient(0, horizon, 0, horizon + 100);
  fogDown.addColorStop(0, 'rgba(118,162,200,.78)');
  fogDown.addColorStop(0.3, 'rgba(105,150,190,.26)');
  fogDown.addColorStop(1, 'rgba(90,140,180,0)');
  ctx.fillStyle = fogDown;
  ctx.fillRect(0, horizon, W, 100);
}

function drawRipples() {
  if (!ripples.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const rp of ripples) {
    ctx.strokeStyle = 'rgba(170,220,255,' + (rp.a * rp.life * 0.75) + ')';
    ctx.lineWidth = 1.6 * Math.max(0.3, rp.life);
    ctx.beginPath();
    ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.34, 0, 0, 7);
    ctx.stroke();
  }
  ctx.restore();
}

function drawSplashes() {
  ctx.save();
  ctx.fillStyle = 'rgba(200,235,255,.9)';
  for (const s of splashes) {
    ctx.globalAlpha = Math.max(0, s.life) * 0.9;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawTrail() {
  if (!trail.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (let i = 1; i < trail.length; i++) {
    const p0 = trail[i - 1], p1 = trail[i];
    ctx.strokeStyle = 'rgba(150,215,255,' + (p1.a * 0.45) + ')';
    ctx.lineWidth = 1 + p1.a * 2.4;
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
  }
  ctx.restore();
}

function drawStone() {
  if (!stone) return;
  const s = stone;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot);

  // 影子投在水面
  if (s.y < waterY(s.x) - 2 && s.y > waterY(s.x) - 16) {   // 只在离水面 16px 以内画影子
    ctx.save();
    ctx.rotate(-s.rot);
    const wy = waterY(s.x) - s.y;
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = '#08131f';
    ctx.beginPath();
    ctx.ellipse(0, wy, s.r * 1.9, s.r * 0.7, 0, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  ctx.beginPath();
  ctx.ellipse(0, 0, s.r * 1.35, s.r * 0.78, 0, 0, 7);
  const g = ctx.createLinearGradient(-s.r, -s.r, s.r, s.r);
  g.addColorStop(0, '#cfd8e0');
  g.addColorStop(0.5, '#8d9aa8');
  g.addColorStop(1, '#4e5a68');
  ctx.fillStyle = g;
  ctx.fill();
  // 外发光，让石子在海面上看得见
  ctx.shadowColor = 'rgba(160,215,255,.9)';
  ctx.shadowBlur = 12;
  ctx.strokeStyle = 'rgba(230,245,255,.85)';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 高光
  ctx.beginPath();
  ctx.ellipse(-s.r * 0.35, -s.r * 0.22, s.r * 0.42, s.r * 0.22, -0.4, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fill();

  ctx.restore();
}

function drawAim() {
  if (!charging || stone.flying || stone.done) return;
  // 用真实物理参数预览：角度 3~14°，速度 12~28 m/s
  const aDeg = 3 + power * 11;
  const a = aDeg * Math.PI / 180;
  const speedMs = 12 + power * 16;

  // 物理坐标（米）里模拟，再换算到屏幕
  let mx = stone.mx, my = stone.my;
  let vx = Math.cos(a) * speedMs;
  let vy = -Math.sin(a) * speedMs;
  const ddt = 0.006;

  ctx.save();
  ctx.setLineDash([3, 6]);
  ctx.strokeStyle = 'rgba(127,212,255,' + (0.28 + power * 0.45) + ')';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(mx * PPM, waterTop - my * PPM);
  for (let i = 0; i < 200; i++) {
    vy += PHYS.g * ddt;
    mx += vx * ddt;
    my -= vy * ddt;
    if (my <= 0) break;                       // 到水面就停
    if (mx * PPM > W) break;
    ctx.lineTo(mx * PPM, waterTop - my * PPM);
  }
  ctx.stroke();
  ctx.restore();
}

function drawOverlay() {
  if (!gameOver) return;
  ctx.fillStyle = 'rgba(4,10,18,.35)';
  ctx.fillRect(0, 0, W, H);
}

// ===== 主循环 =====
let prev = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  update(dt);

  // 水面波动场演化（固定步长，保证稳定）
  if (WATER) {
    waveTime += dt;
    const wdt = Math.min(WATER.dtMax, 1 / 90);
    WATER.applyPending();
    WATER.step(wdt);
  }

  ctx.save();
  if (camShake > 0) {
    ctx.translate((Math.random() - 0.5) * camShake, (Math.random() - 0.5) * camShake);
  }
  drawSky();
  drawWater();
  drawRipples();
  drawTrail();
  drawSplashes();
  drawStone();
  drawAim();
  ctx.restore();

  drawOverlay();
  requestAnimationFrame(loop);
}

resize();
initWater();      // ← 必须初始化水面场，否则 drawWater 直接 return（水面永远是空壳）
resetStone();
requestAnimationFrame(loop);

// 防止滚动/长按菜单
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
</html>
