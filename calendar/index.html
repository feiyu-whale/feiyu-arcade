<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌍 历法区</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh;
    background:radial-gradient(120% 90% at 50% 0%, #2a2418 0%, #14100a 55%, #060a10 100%);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#dbeafe; padding:22px 14px 48px; user-select:none;
  }
  .back { display:inline-block; text-decoration:none; color:#8a7a5b; font-size:10px; margin-bottom:6px;
    padding:6px 12px; border:1px solid #3c3420; border-radius:20px; }
  .back:active { background:#211c10; }
  h1 { font-size:12px; text-align:center; color:#ffd479; font-weight:700; letter-spacing:2px; margin:4px 0 6px; }
  .sub { text-align:center; color:#8a7a5b; font-size:10px; margin-bottom:8px; line-height:1.7; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:6px; max-width:720px; margin:0 auto; }
  a.tool {
    display:block; text-decoration:none; color:inherit;
    background:linear-gradient(160deg,#2a2418,#1a1408);
    border:1px solid #6a5a2e; border-radius:14px; padding: 12px 10px; transition:.18s;
    box-shadow:0 4px 20px rgba(120,90,30,.2); position:relative; overflow:hidden;
  }
  a.tool:active { transform:scale(.96); background:#3d3420; }
  a.tool .icon { font-size:20px; display:block; margin-bottom:8px; }
  a.tool .name { font-size:10px; font-weight:700; color:#ffd479; }
  a.tool .desc { font-size:10px; color:#9f8f6a; margin-top:4px; line-height:1.55; }
  .soon { opacity:.42; cursor:not-allowed; }
  .soon .name { color:#8a7a5b; }
  .foot { text-align:center; color:#4a3f28; font-size:10px; margin-top:32px; line-height:1.9; }
  .ver { text-align:center; color:#38301e; font-size:10px; margin-top:10px; }
</style>
</head>
<body>
  <a class="back" href="../">← 回游戏厅</a>
  <h1>🌍 历 法 区</h1>
  <div class="sub">古今中外的历法换算 · 编年史<br>看日子怎么算，不算吉凶</div>

  <div class="grid">
    <a class="tool" href="huangli/">
      <span class="icon">📅</span>
      <span class="name">黄历</span>
      <span class="desc">农历 · 干支 · 节气 · 公历换算</span>
    </a>
    <a class="tool" href="../tools/maya/">
      <span class="icon">🌽</span>
      <span class="name">玛雅历</span>
      <span class="desc">长计历 · 卓尔金 · 哈布 · 双向换算</span>
    </a>
    <a class="tool" href="../tools/hijri/">
      <span class="icon">🌙</span>
      <span class="name">回历</span>
      <span class="desc">伊斯兰历 · 希吉来历 · 双向换算</span>
    </a>
    <a class="tool" href="../tools/tibetan/">
      <span class="icon">🏔️</span>
      <span class="name">藏历</span>
      <span class="desc">时轮历 · 饶迥周期 · 闰月闰日</span>
    </a>
    <a class="tool" href="../tools/orthodox/">
      <span class="icon">✝️</span>
      <span class="name">东正教历</span>
      <span class="desc">儒略旧历 · 公历换算 · 复活节</span>
    </a>
  </div>

  <div class="foot">🐳 大肥鱼出品 · 历法编年<br>纯前端 · 零依赖 · 零服务器</div>
  <div class="ver">v3-统一紧凑 20261016</div>
</body>
</html>
