<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1628">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>历法区 · 开屏</title>
  <!--
    历法区开屏 —— 雾玻璃擦除
    干什么：播雾玻璃开屏，用户擦开后看到「历法区」标题，点 ENTER 或擦够自动进历法首页
    用了什么：
      · Mist (© eveninwinter, MIT) —— 雾玻璃擦除动效，lib/splash.js + lib/splash.css
      · 背景图来源 Unsplash（免费商用），lib/bg.jpg
      · 字体 OFL-NotoSerifSC / OFL-PinyonScript（见 LICENSE 说明）
    输入：无（纯前端）
    输出：跳转 ../index.html
    版本：v1.0-历法区开屏 20261105
  -->
  <link rel="stylesheet" href="./lib/splash.css">
  <script src="./lib/quotes.js" defer></script>
  <script src="./lib/go.js" defer></script>
  <script src="./lib/splash.js" defer></script>
</head>
<body>
  <div id="mist-living-water">
    <div class="alw-screen">
      <img class="alw-photo" src="./lib/bg.jpg" alt="云海山峦">
      <canvas class="alw-canvas" aria-label="在雾玻璃上滑动，擦开这一页"></canvas>
      <div class="alw-intro"><div class="alw-en">CALENDAR</div><div class="alw-cn">指间擦开，是一整年的节气。</div></div>
      <button class="alw-enter" type="button" aria-label="进入历法区">进入</button>
      <span class="alw-access" aria-live="polite"></span>
    </div>
  </div>
</body>
</html>
