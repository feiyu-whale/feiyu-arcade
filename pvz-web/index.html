<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>GodotPVZ-Dream_me</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-percent {
	font-size: 22px;
	font-weight: 700;
	color: #8fd8ff;
	margin: 4px 0 2px;
	letter-spacing: 1px;
}

#status-tip {
	font-size: 12px;
	color: #7f9ab8;
	margin-bottom: 6px;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas" style="touch-action:none;">
			Your browser does not support the canvas tag.
		</canvas>

		<script>
		// 【2026-10-29】触屏 -> 鼠标事件转发
		// 说明：部分手机浏览器对 WebGL/EMSCRIPTEN 的指针事件支持不全，导致
		// Godot 收不到 InputEventScreenTouch，点卡片无反应。这里把 touch 转成 mouse 再派发。
		(function () {
			var cv = document.getElementById('canvas');
			if (!cv) return;
			var lastTouch = null;

			function dispatch(type, touch, buttons) {
				var rect = cv.getBoundingClientRect();
				var x = touch.clientX - rect.left;
				var y = touch.clientY - rect.top;
				var ev = new MouseEvent(type, {
					bubbles: true,
					cancelable: true,
					view: window,
					clientX: touch.clientX,
					clientY: touch.clientY,
					screenX: touch.screenX,
					screenY: touch.screenY,
					button: 0,
					buttons: buttons,
					detail: 1
				});
				// 部分实现读 offsetX/offsetY，补上
				try {
					Object.defineProperty(ev, 'offsetX', { get: function () { return x; } });
					Object.defineProperty(ev, 'offsetY', { get: function () { return y; } });
				} catch (e) {}
				return cv.dispatchEvent(ev);
			}

			cv.addEventListener('touchstart', function (e) {
				if (e.touches.length > 1) return;   // 多指交给浏览器（缩放等）
				var t = e.changedTouches[0];
				lastTouch = t.identifier;
				cv.focus && cv.focus();
				dispatch('mousemove', t, 0);
				dispatch('mousedown', t, 1);
				e.preventDefault();
			}, { passive: false });

			cv.addEventListener('touchmove', function (e) {
				var t = null;
				for (var i = 0; i < e.changedTouches.length; i++) {
					if (e.changedTouches[i].identifier === lastTouch) { t = e.changedTouches[i]; break; }
				}
				if (!t) return;
				dispatch('mousemove', t, 1);
				e.preventDefault();
			}, { passive: false });

			cv.addEventListener('touchend', function (e) {
				var t = null;
				for (var i = 0; i < e.changedTouches.length; i++) {
					if (e.changedTouches[i].identifier === lastTouch) { t = e.changedTouches[i]; break; }
				}
				if (!t) return;
				dispatch('mouseup', t, 0);
				dispatch('click', t, 0);
				lastTouch = null;
				e.preventDefault();
			}, { passive: false });

			cv.addEventListener('touchcancel', function () {
				lastTouch = null;
			});
		}());
		</script>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-percent">0%</div>
			<div id="status-tip">正在加载游戏资源…（首次约 120MB，请用 WiFi 耐心等待）</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":124847884,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusPercent = document.getElementById('status-percent');
	const statusTip = document.getElementById('status-tip');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// 【2026-10-29】非 HTTPS 环境兼容：过滤掉 Secure Context 检查
	// 说明：这是放宽检查，不是真的变安全；非多线程模式对跨域隔离无硬性要求
	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	}).filter(function (f) {
		return !/Secure\s*Context/i.test(String(f));
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					const pct = Math.min(100, Math.floor(current / total * 100));
					if (statusPercent) statusPercent.textContent = pct + '%';
					if (statusTip) {
						const got = (current / 1048576).toFixed(1);
						const all = (total / 1048576).toFixed(1);
						statusTip.textContent = '已加载 ' + got + ' MB / ' + all + ' MB';
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					if (statusPercent) statusPercent.textContent = '';
					if (statusTip) statusTip.textContent = '正在准备…';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
