<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📜 历史大事年表</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body { min-height:100%; background:linear-gradient(160deg,#1a1428 0%,#241a33 55%,#120e1c 100%); }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#e8e0f0;
    padding:6px 6px 12px; display:flex; justify-content:center; user-select:none; }
  #wrap { width:100%; max-width:680px; }
  .back { display:inline-block; text-decoration:none; color:#9a8fc0; font-size:13px; margin-bottom:12px;
    padding:6px 12px; border:1px solid #3a3050; border-radius:20px; }
  h1 { font-size:12px; color:#c8b3ff; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#8a7fb0; font-size:12px; margin-bottom:16px; }
  .card { background:#1c1530; border:1px solid #3a3050; border-radius:12px; padding:14px; margin-bottom:12px; }
  .lbl { font-size:11px; color:#8a7fb0; margin-bottom:9px; letter-spacing:1px; }
  .f { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .f label { font-size:13px; color:#c8b3ff; flex-shrink:0; }
  .f input { flex:1; min-width:0; background:#100b1c; border:1px solid #3a3050; border-radius:9px;
    padding:10px 11px; color:#e8e0f0; font-size:14px; font-family:inherit; }
  .f input:focus { outline:none; border-color:#7a5fc0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .btn { background:#241a3a; border:1px solid #4a3d70; color:#c8b3ff; border-radius:9px;
    padding:7px 12px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .btn.on { background:linear-gradient(160deg,#5a4a9a,#3a2d70); color:#fff; border-color:#7a5fc0; }
  .ev { position:relative; padding-left:16px; margin-bottom:8px; }
  .ev::before { content:""; position:absolute; left:4px; top:6px; width:7px; height:7px; border-radius:50%;
    background:#7a5fc0; box-shadow:0 0 0 3px #241a33; }
  .ev::after { content:""; position:absolute; left:7px; top:14px; bottom:-8px; width:1px; background:#3a3050; }
  .ev:last-child::after { display:none; }
  .ev .yr { font-size:12px; color:#8a7fb0; font-family:ui-monospace,monospace; }
  .ev .tx { font-size:14px; color:#d8ccff; line-height:1.55; }
  .pc { background:#100b1c; border-radius:9px; padding:10px 12px; margin-bottom:8px; border-left:3px solid #5a4a9a; }
  .pc .t { font-size:14px; color:#c8b3ff; margin-bottom:3px; }
  .pc .d { font-size:12.5px; color:#9a8fc0; line-height:1.6; }
  .pc .fig { font-size:12.5px; color:#8a7fb0; margin-top:3px; }
  .hint { font-size:12px; color:#6a5f90; line-height:1.6; margin-top:6px; }
  .err { color:#ff8fa3; font-size:13px; padding:10px; }
  .ver { text-align:center; color:#2a2440; font-size:10px; margin-top:22px; }
</style>
</head>
<body>
<div id="wrap">
  <a class="back" href="../">← 回历史专区</a>
  <h1>📜 历史大事年表</h1>
  <div class="sub">中国史大事节点 + 中外时期对照</div>

  <div class="card">
    <div class="lbl">① 大事节点</div>
    <div class="row" id="eraBtns"></div>
    <div id="evList"></div>
  </div>

  <div class="card">
    <div class="lbl">② 时期 · 中外对照</div>
    <div class="f"><label>搜索</label><input id="q" placeholder="如：唐 / 罗马 / 秦"></div>
    <div id="pcList"><div class="hint">输入关键词筛选时期（留空看全部）</div></div>
  </div>
  <div class="ver">v1.0.0-大事年表 20261017</div>
</div>
<script>
// 【events】历史大事年表。依赖：data/events.json（源自 yansheng836/parallel-histories，MIT）。输入：筛选；输出：事件+时期对照。
// 本文件为单页工具，IIFE 隔离，无全局污染。
// 数据来源：yansheng836/parallel-histories (MIT)。事件/时期为通行分期，供参考。
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var DATA = null;
  function yl(y){ return y < 0 ? ("前" + (-y)) : ("" + y); }
  function clean(s){ return (s || "").replace(/<[^>]*>/g, ""); }

  function load(){
    if(DATA) return Promise.resolve(DATA);
    return fetch("../data/events.json").then(function(r){ return r.json(); }).then(function(j){ DATA = j; return j; });
  }

  function renderEvents(range){
    load().then(function(){
      var list = DATA.events;
      if(range !== "all"){
        list = list.filter(function(e){ return range === "ancient" ? e.year < 581 : e.year >= 581; });
      }
      $("evList").innerHTML = list.map(function(e){
        return '<div class="ev"><span class="yr">'+yl(e.year)+' 年</span><div class="tx">'+clean(e.label)+'</div></div>';
      }).join("") || "<div class='err'>无</div>";
    });
  }

  function renderPeriods(q){
    load().then(function(){
      var list = DATA.cards.filter(function(c){ return c.side === "cn"; });
      // 按 cn 卡片配对最近的 west（同序），展示成对
      var cn = DATA.cards.filter(function(c){ return c.side === "cn"; });
      var west = DATA.cards.filter(function(c){ return c.side === "west"; });
      q = (q || "").trim();
      var html = "";
      var used = 0;
      cn.forEach(function(c, i){
        var w = west[i] || null;
        var hay = (c.title + " " + (w ? w.title : "")).toLowerCase();
        if(q && hay.indexOf(q.toLowerCase()) < 0) return;
        used++;
        html += '<div class="pc"><div class="t">🇨🇳 '+c.title+'</div>' +
          (c.fig ? '<div class="fig">'+c.fig+'</div>' : '') +
          (w ? '<div class="d" style="margin-top:5px">🌍 '+w.title+'</div>' : '') +
          (w && w.fig ? '<div class="fig">'+w.fig+'</div>' : '') +
          '</div>';
      });
      $("pcList").innerHTML = html || "<div class='hint'>无匹配（试试：唐 / 罗马 / 秦 / 明清）</div>";
    });
  }

  function buildBtns(){
    var opts = [["all","全部"],["ancient","上古~隋前"],["modern","隋唐~今"]];
    $("eraBtns").innerHTML = opts.map(function(o, i){
      return '<button class="btn'+(i===0?' on':'')+'" data-r="'+o[0]+'">'+o[1]+'</button>';
    }).join("");
    $("eraBtns").querySelectorAll("[data-r]").forEach(function(b){
      b.onclick = function(){
        $("eraBtns").querySelectorAll(".btn").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on");
        renderEvents(b.getAttribute("data-r"));
      };
    });
  }

  function debounce(fn){ var t; return function(){ clearTimeout(t); t = setTimeout(fn, 200); }; }
  $("q").addEventListener("input", debounce(function(){ renderPeriods($("q").value); }));
  buildBtns(); renderEvents("all"); renderPeriods("");
})();
</script>
</body>
</html>
