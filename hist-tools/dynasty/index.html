<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏯 朝代纪年查询</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body { min-height:100%; background:linear-gradient(160deg,#1a1428 0%,#241a33 55%,#120e1c 100%); }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#e8e0f0;
    padding:6px 6px 12px; display:flex; justify-content:center; user-select:none; }
  #wrap { width:100%; max-width:680px; }
  .back { display:inline-block; text-decoration:none; color:#9a8fc0; font-size:13px; margin-bottom:12px;
    padding:6px 12px; border:1px solid #3a3050; border-radius:20px; }
  h1 { font-size:12px; color:#c8b3ff; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#8a7fb0; font-size:12px; margin-bottom:16px; }
  .card { background:#1c1530; border:1px solid #3a3050; border-radius:12px; padding:14px; margin-bottom:12px; }
  .lbl { font-size:11px; color:#8a7fb0; margin-bottom:9px; letter-spacing:1px; }
  .f { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .f label { width:76px; font-size:13px; color:#c8b3ff; flex-shrink:0; }
  .f input { flex:1; min-width:0; background:#100b1c; border:1px solid #3a3050; border-radius:9px;
    padding:10px 11px; color:#e8e0f0; font-size:14px; font-family:inherit; }
  .f input:focus { outline:none; border-color:#7a5fc0; }
  .tl { position:relative; padding-left:14px; }
  .tl .row { padding:8px 11px; background:#100b1c; border-radius:8px; margin-bottom:6px;
    font-size:13.5px; color:#c8b3ff; line-height:1.6; border-left:3px solid #5a4a9a; }
  .tl .row.cur { border-left-color:#a8f0c0; background:#12201a; }
  .tl .row .span { color:#8a7fb0; font-size:12px; }
  .hint { font-size:12px; color:#6a5f90; line-height:1.6; margin-top:6px; }
  .err { color:#ff8fa3; font-size:13px; padding:10px; }
  .legend { font-size:11px; color:#6a5f90; line-height:1.5; margin-top:8px; }
  .ver { text-align:center; color:#2a2440; font-size:10px; margin-top:22px; }
</style>
</head>
<body>
<div id="wrap">
  <a class="back" href="../">← 回文科专区</a>
  <h1>🏯 朝代纪年查询</h1>
  <div class="sub">公元年 → 所属朝代（纪元时间线）</div>

  <div class="card">
    <div class="lbl">输入公元年份</div>
    <div class="f"><label>公元年</label><input id="yearIn" type="text" inputmode="numeric" value="2026"></div>
    <div class="hint">公元前用负数（如 -221 = 公元前221年 秦统一）</div>
    <div id="res"></div>
  </div>

  <div class="card">
    <div class="lbl">朝代年表（点击定位）</div>
    <div class="tl" id="timeline"></div>
    <div class="legend">共 <span id="cnt">0</span> 条。数据源：上海图书馆开放数据平台（经 SongshGeoLab/chinese_history_toolkits 清洗，MIT）。上古纪年存学术分歧，采「夏商周断代工程/上图」口径。</div>
  </div>
  <div class="ver">v1.0.0-朝代纪年 20261017</div>
</div>
<script>
// 【dynasty】公元年→朝代纪年。依赖：data/dynasties.json（源自上海图书馆开放数据平台，MIT）。输入：年份；输出：所属朝代+时间线。
// 本文件为单页工具，IIFE 隔离，无全局污染。
// 数据来源：SongshGeoLab/chinese_history_toolkits (MIT)，原始 © 上海图书馆开放数据平台。上古纪年采断代工程/上图口径。
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var DYN = null;
  function yl(y){ return y < 0 ? ("前" + (-y)) : ("" + y); }

  function load(){
    if(DYN) return Promise.resolve(DYN);
    return fetch("../data/dynasties.json").then(function(r){ return r.json(); }).then(function(j){ DYN = j; return j; });
  }

  function render(){
    var raw = $("yearIn").value.trim();
    var box = $("res");
    if(!/^-?\d+$/.test(raw)){ box.innerHTML = "<div class='hint'>输入年份</div>"; return; }
    var y = parseInt(raw, 10);
    load().then(function(){
      // 命中所有覆盖该年的朝代条目
      var hits = DYN.filter(function(d){ return y >= d.begin && y <= d.end; });
      if(!hits.length){
        var last = DYN[DYN.length-1];
        var tail = (last && y > last.end) ? '（'+last.name+'之后，非朝代纪年）' : '';
        box.innerHTML = "<div class='err'>该年无收录朝代"+tail+"</div>"; return;
      }
      // 取跨度最小的（最精确）
      hits.sort(function(a,b){ return (a.end-a.begin)-(b.end-b.begin); });
      box.innerHTML = '<div class="row" style="border-left-color:#a8f0c0;background:#12201a;font-size:15px;margin-top:10px">'+
        '公元 '+yl(y)+' 年<span class="span"> · 属「'+hits[0].name+'」（'+yl(hits[0].begin)+'~'+yl(hits[0].end)+'）</span></div>' +
        (hits.length > 1 ? '<div class="legend">同时覆盖该年的其他条目：'+
          hits.slice(1).map(function(d){ return d.name+'（'+yl(d.begin)+'~'+yl(d.end)+'）'; }).join('、')+'</div>' : '');
    });
  }

  function buildTimeline(){
    load().then(function(){
      $("cnt").textContent = DYN.length;
      var now = (new Date()).getFullYear();
      $("timeline").innerHTML = DYN.map(function(d, i){
        var cur = (now >= d.begin && now <= d.end);
        return '<div class="row'+(cur?' cur':'')+'" data-y="'+d.begin+'">'+d.name+
          '<span class="span"> ｜ '+yl(d.begin)+' ~ '+yl(d.end)+'</span></div>';
      }).join("");
      $("timeline").querySelectorAll("[data-y]").forEach(function(el){
        el.onclick = function(){ $("yearIn").value = el.getAttribute("data-y"); render(); };
      });
    });
  }

  function debounce(fn){ var t; return function(){ clearTimeout(t); t = setTimeout(fn, 180); }; }
  $("yearIn").addEventListener("input", debounce(render));
  buildTimeline(); render();
})();
</script>
</body>
</html>
