<script>
(function(){
  function run(){
    var box=document.getElementById('fanResult');
    var Q=parseFloat(document.getElementById('fanQ').value);
    var p=parseFloat(document.getElementById('fanP').value);
    var eta=parseFloat(document.getElementById('fanEta').value);
    var K=parseFloat(document.getElementById('fanK').value);
    if(!isFinite(Q)||!isFinite(p)||!isFinite(eta)||!isFinite(K)){ box.innerHTML='<span style="color:#e74c3c">请填写完整的参数</span>'; return; }
    if(Q<0){ box.innerHTML='<span style="color:#e74c3c">风量不能为负</span>'; return; }
    if(p<0){ box.innerHTML='<span style="color:#e74c3c">全压不能为负</span>'; return; }
    if(eta<=0||eta>1){ box.innerHTML='<span style="color:#e74c3c">效率需在 0–1 之间</span>'; return; }
    if(K<1){ box.innerHTML='<span style="color:#e74c3c">储备系数 K 不应小于 1</span>'; return; }
    var Qs=Q/3600;
    var Pshaft=(Qs*p)/(1000*eta);
    var Pmotor=K*Pshaft;
    var s='';
    s+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e3e9ef"><span style="color:#666">风量（换算）</span><b>'+Qs.toFixed(4)+' m³/s</b></div>';
    s+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e3e9ef"><span style="color:#666">轴功率</span><b style="color:#2980b9;font-size:16px">'+Pshaft.toFixed(3)+' kW</b></div>';
    s+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e3e9ef"><span style="color:#666">电机功率（×K）</span><b style="color:#27ae60;font-size:16px">'+Pmotor.toFixed(3)+' kW</b></div>';
    s+='<div style="display:flex;justify-content:space-between;padding:5px 0"><span style="color:#666">折合马力</span><b>'+(Pmotor*1.35962).toFixed(2)+' PS</b></div>';
    box.innerHTML=s;
  }
  ['fanQ','fanP','fanEta','fanK'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.addEventListener('input',run);
  });
  run();
})();
</script>

<script>
// ============================================================
// 第一部分：核心算法源码
// ============================================================

/**
 * @module FanPowerCalculator
 * @description 风机功率计算与相似定律工具库
 * 参考标准：
 *   - GB/T 1236-2017《工业通风机 用标准化风道进行性能试验》（ISO 5801:2007 IDT）
 *   - GB/T 10178-2006《工业通风机 现场性能试验》（ISO 5802:2001 IDT）
 *
 * 有限精准声明：
 *   本工具基于理想气体模型与经典风机相似定律，不承诺绝对精确。
 *   计算结果仅供工程估算参考，实际选型须以风机厂家性能曲线和实测数据为准。
 */

/**
 * 计算空气密度（理想气体模型，含湿度修正）
 *
 * 公式：ρ = (p_atm - p_vapor) / (R_d × T) + p_vapor / (R_v × T)
 * 其中 p_vapor = phi × p_sat(T)
 *
 * @param {number} T - 空气温度，单位 ℃（摄氏度），有效范围 -40 ~ 80
 * @param {number} p_atm - 当地大气压，单位 Pa（帕斯卡），典型值 101325
 * @param {number} [phi=0] - 相对湿度，范围 0 ~ 1（0 表示干燥空气）
 * @returns {number} 空气密度，单位 kg/m³
 * @throws {Error} 参数超出物理合理范围时抛出异常
 *
 * @example
 * calcAirDensity(20, 101325, 0.5); // ≈ 1.199 kg/m³
 * calcAirDensity(20, 101325, 0);   // ≈ 1.204 kg/m³（干空气）
 */
function calcAirDensity(T, p_atm, phi) {
  if (phi === undefined || phi === null) phi = 0;
  if (typeof T !== 'number' || typeof p_atm !== 'number' || typeof phi !== 'number') {
    throw new Error('calcAirDensity: 所有参数必须为数字');
  }
  if (T < -40 || T > 80) {
    throw new Error('calcAirDensity: 温度 T 超出合理范围 [-40, 80] ℃');
  }
  if (p_atm <= 0) {
    throw new Error('calcAirDensity: 大气压必须大于 0');
  }
  if (phi < 0 || phi > 1) {
    throw new Error('calcAirDensity: 相对湿度 phi 必须在 [0, 1] 范围内');
  }

  var T_K = T + 273.15; // 转换为开尔文
  var R_d = 287.05;     // 干空气气体常数 J/(kg·K)
  var R_v = 461.5;      // 水蒸气气体常数 J/(kg·K)

  // 饱和水蒸气压（Magnus 公式，适用于 -40~50℃ 范围，精度约 ±0.3%）
  // 注意：超过 50℃ 时 Magnus 公式精度下降，此处仍使用但需知晓局限
  var p_sat = 610.78 * Math.exp(17.2694 * T / (T + 238.3));

  var p_vapor = phi * p_sat;
  var p_dry = p_atm - p_vapor;

  if (p_dry < 0) {
    throw new Error('calcAirDensity: 水蒸气分压超过大气压，参数不合理');
  }

  var rho = p_dry / (R_d * T_K) + p_vapor / (R_v * T_K);
  return rho;
}

/**
 * 计算动压（速度压）
 *
 * 公式：p_v = 0.5 × ρ × v²
 *
 * @param {number} rho - 空气密度，单位 kg/m³，必须 > 0
 * @param {number} v - 风速，单位 m/s，必须 >= 0
 * @returns {number} 动压，单位 Pa
 * @throws {Error} 参数非法时抛出异常
 *
 * @example
 * calcVelocityPressure(1.2, 10); // = 60 Pa
 */
function calcVelocityPressure(rho, v) {
  if (typeof rho !== 'number' || typeof v !== 'number') {
    throw new Error('calcVelocityPressure: 参数必须为数字');
  }
  if (rho <= 0) {
    throw new Error('calcVelocityPressure: 密度必须大于 0');
  }
  if (v < 0) {
    throw new Error('calcVelocityPressure: 风速不能为负');
  }
  return 0.5 * rho * v * v;
}

/**
 * 计算风机轴功率（ Shaft Power ）
 *
 * 公式：P_shaft = (Q × p) / (1000 × η)
 *   其中 Q 单位为 m³/s，p 单位为 Pa，η 为风机效率（小数），P_shaft 单位为 kW
 *
 * 若 Q 以 m³/h 输入，内部自动转换：Q_m3s = Q_m3h / 3600
 *
 * @param {number} Q - 风量，单位 m³/s（当 useHour 为 true 时为 m³/h）
 * @param {number} p - 风压（全压或静压，取决于需求），单位 Pa
 * @param {number} eta - 风机效率，范围 (0, 1]，例如 0.75 表示 75%
 * @param {boolean} [useHour=false] - 若为 true，Q 的单位为 m³/h
 * @returns {number} 轴功率，单位 kW
 * @throws {Error} 参数非法时抛出异常
 *
 * @example
 * calcShaftPower(10, 500, 0.75);       // Q=10m³/s, p=500Pa, η=75% → ≈ 6.667 kW
 * calcShaftPower(36000, 500, 0.75, true); // Q=36000m³/h → 同上
 */
function calcShaftPower(Q, p, eta, useHour) {
  if (typeof Q !== 'number' || typeof p !== 'number' || typeof eta !== 'number') {
    throw new Error('calcShaftPower: 参数必须为数字');
  }
  if (Q < 0) {
    throw new Error('calcShaftPower: 风量不能为负');
  }
  if (eta <= 0 || eta > 1) {
    throw new Error('calcShaftPower: 效率必须在 (0, 1] 范围内');
  }

  var Q_m3s = useHour ? Q / 3600 : Q;
  if (Q_m3s < 0) {
    throw new Error('calcShaftPower: 转换后的风量不能为负');
  }

  return (Q_m3s * p) / (1000 * eta);
}

/**
 * 计算电机所需功率（Motor Power）
 *
 * 公式：P_motor = K × P_shaft / η_trans
 *   K 为电机储备系数（安全系数），η_trans 为传动效率
 *
 * @param {number} P_shaft - 风机轴功率，单位 kW，必须 >= 0
 * @param {number} [eta_trans=1] - 传动效率，范围 (0, 1]
 *   - 直联（联轴器）：0.98 ~ 1.0
 *   - 皮带传动：0.90 ~ 0.95
 *   - 齿轮箱：需查厂家数据
 * @param {number} [K=1.15] - 电机储备系数，通常 1.1 ~ 1.3
 * @returns {number} 电机所需功率，单位 kW
 * @throws {Error} 参数非法时抛出异常
 *
 * @example
 * calcMotorPower(6.667, 0.98, 1.15); // ≈ 7.83 kW → 选 11 kW 标准电机
 */
function calcMotorPower(P_shaft, eta_trans, K) {
  if (typeof P_shaft !== 'number') {
    throw new Error('calcMotorPower: P_shaft 必须为数字');
  }
  if (P_shaft < 0) {
    throw new Error('calcMotorPower: 轴功率不能为负');
  }
  if (eta_trans === undefined || eta_trans === null) eta_trans = 1;
  if (K === undefined || K === null) K = 1.15;
  if (typeof eta_trans !== 'number' || typeof K !== 'number') {
    throw new Error('calcMotorPower: 参数必须为数字');
  }
  if (eta_trans <= 0 || eta_trans > 1) {
    throw new Error('calcMotorPower: 传动效率必须在 (0, 1] 范围内');
  }
  if (K < 1) {
    throw new Error('calcMotorPower: 储备系数 K 不应小于 1');
  }
  return (K * P_shaft) / eta_trans;
}

/**
 * 风机相似定律 —— 风量换算
 *
 * 公式：Q₂ = Q₁ × (n₂/n₁) × (D₂/D₁)³
 *
 * @param {number} Q1 - 已知风量，单位任意（结果同单位）
 * @param {number} n1 - 已知转速，单位 rpm（或任意一致单位）
 * @param {number} n2 - 目标转速
 * @param {number} D1 - 已知叶轮直径，单位任意（与 D2 一致即可）
 * @param {number} D2 - 目标叶轮直径
 * @returns {number} 换算后的风量 Q₂
 * @throws {Error} 参数非法时抛出异常
 *
 * @example
 * fanLaw_flow(10000, 1450, 960, 0.5, 0.5); // 同直径变速 → ≈ 6621 m³/h
 */
function fanLaw_flow(Q1, n1, n2, D1, D2) {
  if ([Q1, n1, n2, D1, D2].some(function(v) { return typeof v !== 'number'; })) {
    throw new Error('fanLaw_flow: 所有参数必须为数字');
  }
  if (n1 <= 0) throw new Error('fanLaw_flow: n1 必须大于 0');
  if (D1 <= 0) throw new Error('fanLaw_flow: D1 必须大于 0');
  if (Q1 < 0) throw new Error('fanLaw_flow: Q1 不能为负');

  return Q1 * (n2 / n1) * Math.pow(D2 / D1, 3);
}

/**
 * 风机相似定律 —— 风压换算
 *
 * 公式：p₂ = p₁ × (n₂/n₁)² × (D₂/D₁)² × (ρ₂/ρ₁)
 *
 * @param {number} p1 - 已知风压，单位 Pa
 * @param {number} n1 - 已知转速
 * @param {number} n2 - 目标转速
 * @param {number} D1 - 已知叶轮直径
 * @param {number} D2 - 目标叶轮直径
 * @param {number} [rho1=1.2] - 已知工况空气密度 kg/m³
 * @param {number} [rho2=1.2] - 目标工况空气密度 kg/m³
 * @returns {number} 换算后的风压 p₂，单位同 p1
 * @throws {Error} 参数非法时抛出异常
 */
function fanLaw_pressure(p1, n1, n2, D1, D2, rho1, rho2) {
  if (rho1 === undefined || rho1 === null) rho1 = 1.2;
  if (rho2 === undefined || rho2 === null) rho2 = 1.2;
  if ([p1, n1, n2, D1, D2, rho1, rho2].some(function(v) { return typeof v !== 'number'; })) {
    throw new Error('fanLaw_pressure: 所有参数必须为数字');
  }
  if (n1 <= 0) throw new Error('fanLaw_pressure: n1 必须大于 0');
  if (D1 <= 0) throw new Error('fanLaw_pressure: D1 必须大于 0');
  if (rho1 <= 0) throw new Error('fanLaw_pressure: rho1 必须大于 0');

  return p1 * Math.pow(n2 / n1, 2) * Math.pow(D2 / D1, 2) * (rho2 / rho1);
}

/**
 * 风机相似定律 —— 功率换算
 *
 * 公式：P₂ = P₁ × (n₂/n₁)³ × (D₂/D₁)⁵ × (ρ₂/ρ₁)
 *
 * @param {number} P1 - 已知功率，单位 kW
 * @param {number} n1 - 已知转速
 * @param {number} n2 - 目标转速
 * @param {number} D1 - 已知叶轮直径
 * @param {number} D2 - 目标叶轮直径
 * @param {number} [rho1=1.2] - 已知工况空气密度 kg/m³
 * @param {number} [rho2=1.2] - 目标工况空气密度 kg/m³
 * @returns {number} 换算后的功率 P₂，单位同 P1
 * @throws {Error} 参数非法时抛出异常
 */
function fanLaw_power(P1, n1, n2, D1, D2, rho1, rho2) {
  if (rho1 === undefined || rho1 === null) rho1 = 1.2;
  if (rho2 === undefined || rho2 === null) rho2 = 1.2;
  if ([P1, n1, n2, D1, D2, rho1, rho2].some(function(v) { return typeof v !== 'number'; })) {
    throw new Error('fanLaw_power: 所有参数必须为数字');
  }
  if (n1 <= 0) throw new Error('fanLaw_power: n1 必须大于 0');
  if (D1 <= 0) throw new Error('fanLaw_power: D1 必须大于 0');
  if (rho1 <= 0) throw new Error('fanLaw_power: rho1 必须大于 0');
  if (P1 < 0) throw new Error('fanLaw_power: P1 不能为负');

  return P1 * Math.pow(n2 / n1, 3) * Math.pow(D2 / D1, 5) * (rho2 / rho1);
}

/**
 * 根据标准状态功率换算到实际工况功率
 *
 * 标准状态定义：ρ₀ = 1.2 kg/m³（GB/T 1236-2017 中标准空气密度参考值）
 * 实际密度由 calcAirDensity 计算
 *
 * 公式：P_actual = P_std × (ρ_actual / ρ_std)
 * 注意：此简化仅适用于同风机、同转速、仅密度变化的场景
 *
 * @param {number} P_std - 标准状态下的功率，单位 kW
 * @param {number} rho_actual - 实际工况空气密度，单位 kg/m³
 * @param {number} [rho_std=1.2] - 标准空气密度，默认 1.2 kg/m³
 * @returns {number} 实际工况功率，单位 kW
 * @throws {Error} 参数非法时抛出异常
 */
function convertPowerByDensity(P_std, rho_actual, rho_std) {
  if (rho_std === undefined || rho_std === null) rho_std = 1.2;
  if (typeof P_std !== 'number' || typeof rho_actual !== 'number' || typeof rho_std !== 'number') {
    throw new Error('convertPowerByDensity: 参数必须为数字');
  }
  if (P_std < 0) throw new Error('convertPowerByDensity: 功率不能为负');
  if (rho_actual <= 0) throw new Error('convertPowerByDensity: 实际密度必须大于 0');
  if (rho_std <= 0) throw new Error('convertPowerByDensity: 标准密度必须大于 0');

  return P_std * (rho_actual / rho_std);
}

/**
 * 选择标准电机功率（向上取到标准电机功率等级）
 *
 * 标准电机功率等级参考 GB/T 4772 系列及 IEC 60072 系列：
 * 0.06, 0.09, 0.12, 0.18, 0.25, 0.37, 0.55, 0.75, 1.1, 1.5, 2.2, 3, 4, 5.5,
 * 7.5, 11, 15, 18.5, 22, 30, 37, 45, 55, 75, 90, 110, 132, 160, 200, 250, 315, 400, 500, 630, 800
 *
 * @param {number} P_required - 所需电机功率，单位 kW
 * @returns {number} 不小于 P_required 的最小标准电机功率，单位 kW
 * @throws {Error} 参数非法或超出标准范围时抛出异常
 */
function selectStandardMotor(P_required) {
  if (typeof P_required !== 'number') {
    throw new Error('selectStandardMotor: 参数必须为数字');
  }
  if (P_required < 0) {
    throw new Error('selectStandardMotor: 功率不能为负');
  }

  var standardLevels = [
    0.06, 0.09, 0.12, 0.18, 0.25, 0.37, 0.55, 0.75,
    1.1, 1.5, 2.2, 3, 4, 5.5, 7.5, 11, 15, 18.5, 22,
    30, 37, 45, 55, 75, 90, 110, 132, 160, 200, 250,
    315, 400, 500, 630, 800
  ];

  for (var i = 0; i < standardLevels.length; i++) {
    if (standardLevels[i] >= P_required - 1e-9) {
      return standardLevels[i];
    }
  }
  throw new Error('selectStandardMotor: 所需功率 ' + P_required + ' kW 超出标准电机范围（最大 800 kW）');
}

/**
 * 计算风机全压效率
 *
 * 公式：η = (Q × p) / (1000 × P_shaft)
 *   即效率 = 有效功率 / 轴功率
 *
 * @param {number} Q - 风量，单位 m³/s
 * @param {number} p - 全压，单位 Pa
 * @param {number} P_shaft - 轴功率，单位 kW
 * @returns {number} 全压效率，范围 (0, 1]
 * @throws {Error} 参数非法时抛出异常
 */
function calcFanEfficiency(Q, p, P_shaft) {
  if (typeof Q !== 'number' || typeof p !== 'number' || typeof P_shaft !== 'number') {
    throw new Error('calcFanEfficiency: 参数必须为数字');
  }
  if (Q <= 0) throw new Error('calcFanEfficiency: 风量必须大于 0');
  if (P_shaft <= 0) throw new Error('calcFanEfficiency: 轴功率必须大于 0');

  var eta = (Q * p) / (1000 * P_shaft);
  if (eta <= 0 || eta > 1) {
    throw new Error('calcFanEfficiency: 计算得到的效率 ' + eta.toFixed(4) + ' 不在合理范围 (0, 1]，请检查输入参数');
  }
  return eta;
}

/**
 * 计算管道内风速
 *
 * 公式：v = Q / A
 *   其中 A = π × (D/2)² 为圆形管道截面积
 *
 * @param {number} Q - 风量，单位 m³/s
 * @param {number} D - 管道内径，单位 m
 * @returns {number} 风速，单位 m/s
 * @throws {Error} 参数非法时抛出异常
 */
function calcDuctVelocity(Q, D) {
  if (typeof Q !== 'number' || typeof D !== 'number') {
    throw new Error('calcDuctVelocity: 参数必须为数字');
  }
  if (Q < 0) throw new Error('calcDuctVelocity: 风量不能为负');
  if (D <= 0) throw new Error('calcDuctVelocity: 管道直径必须大于 0');

  var A = Math.PI * Math.pow(D / 2, 2);
  return Q / A;
}

/**
 * 计算圆形管道截面积
 *
 * @param {number} D - 管道内径，单位 m
 * @returns {number} 截面积，单位 m²
 * @throws {Error} 参数非法时抛出异常
 */
function calcCircularArea(D) {
  if (typeof D !== 'number') {
    throw new Error('calcCircularArea: 参数必须为数字');
  }
  if (D <= 0) throw new Error('calcCircularArea: 直径必须大于 0');
  return Math.PI * Math.pow(D / 2, 2);
}

/**
 * 计算矩形管道截面积
 *
 * @param {number} a - 管道一边长度，单位 m
 * @param {number} b - 管道另一边长度，单位 m
 * @returns {number} 截面积，单位 m²
 * @throws {Error} 参数非法时抛出异常
 */
function calcRectArea(a, b) {
  if (typeof a !== 'number' || typeof b !== 'number') {
    throw new Error('calcRectArea: 参数必须为数字');
  }
  if (a <= 0 || b <= 0) throw new Error('calcRectArea: 边长必须大于 0');
  return a * b;
}

// 导出到全局（浏览器环境）
if (typeof window !== 'undefined') {
  window.FanCalc = {
    calcAirDensity: calcAirDensity,
    calcVelocityPressure: calcVelocityPressure,
    calcShaftPower: calcShaftPower,
    calcMotorPower: calcMotorPower,
    fanLaw_flow: fanLaw_flow,
    fanLaw_pressure: fanLaw_pressure,
    fanLaw_power: fanLaw_power,
    convertPowerByDensity: convertPowerByDensity,
    selectStandardMotor: selectStandardMotor,
    calcFanEfficiency: calcFanEfficiency,
    calcDuctVelocity: calcDuctVelocity,
    calcCircularArea: calcCircularArea,
    calcRectArea: calcRectArea
  };
}

var _testResults = [];

/**
 * 断言函数：判断值是否在容差范围内
 * @param {string} name - 测试名称
 * @param {number} actual - 实际值
 * @param {number} expected - 期望值
 * @param {number} [tolerance=1e-6] - 容差
 */
function assertApprox(name, actual, expected, tolerance) {
  _testTotal++;
  if (tolerance === undefined) tolerance = 1e-6;
  var diff = Math.abs(actual - expected);
  if (diff <= tolerance) {
    _testPassed++;
    _testResults.push({ pass: true, name: name, msg: '✓ ' + name + ' → ' + actual.toFixed(6) + ' ≈ ' + expected });
  } else {
    _testResults.push({ pass: false, name: name, msg: '✗ ' + name + ' → 得到 ' + actual + '，期望 ' + expected + '，差值 ' + diff });
  }
}

/**
 * 断言函数：判断是否抛出异常
 * @param {string} name - 测试名称
 * @param {Function} fn - 待测函数
 */
function assertThrows(name, fn) {
  _testTotal++;
  try {
    fn();
    _testResults.push({ pass: false, name: name, msg: '✗ ' + name + ' → 期望抛出异常但未抛出' });
  } catch (e) {
    _testPassed++;
    _testResults.push({ pass: true, name: name, msg: '✓ ' + name + ' → 正确抛出异常: ' + e.message });
  }
}

/**
 * 断言函数：判断值是否严格相等
 * @param {string} name - 测试名称
 * @param {*} actual - 实际值
 * @param {*} expected - 期望值
 */
function assertEqual(name, actual, expected) {
  _testTotal++;

  } else {
    _testResults.push({ pass: false, name: name, msg: '✗ ' + name + ' → 得到 ' + actual + '，期望 ' + expected });
  }
}
