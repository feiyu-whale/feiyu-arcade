/**
 * 按名称精确查询典故
 * @param {string} name - 典故名称（如"高山流水"）
 * @returns {Object|null} 匹配的典故对象，未找到返回 null
 * @throws {TypeError} 参数非字符串时抛出
 * @example
 * queryAllusion("高山流水");
 * // => { name: "高山流水", source: "《列子·汤问》", ... }
 * @example
 * queryAllusion("不存在的典故");
 * // => null
 */
function queryAllusion(name) {
  if (typeof name !== "string") {
    throw new TypeError("queryAllusion: 参数 name 必须为字符串");
  }
  const trimmed = name.trim();
  if (!trimmed) return null;
  const found = ALLUSION_DB.find(item => item.name === trimmed);
  return found ? Object.assign({}, found) : null;
}

/**
 * 按关键词模糊搜索典故（匹配名称、释义、引申义、出处、原文）
 * @param {string} keyword - 搜索关键词
 * @returns {Array<Object>} 匹配的典故数组，无匹配返回空数组
 * @throws {TypeError} 参数非字符串时抛出
 * @example
 * searchAllusions("史记");
 * // => 返回所有出处含"史记"的典故
 * @example
 * searchAllusions("");
 * // => []
 */
function searchAllusions(keyword) {
  if (typeof keyword !== "string") {
    throw new TypeError("searchAllusions: 参数 keyword 必须为字符串");
  }
  const kw = keyword.trim();
  if (!kw) return [];
  return ALLUSION_DB.filter(item =>
    item.name.includes(kw) ||
    item.meaning.includes(kw) ||
    item.extended.includes(kw) ||
    item.source.includes(kw) ||
    item.original.includes(kw) ||
    item.era.includes(kw) ||
    (item.related && item.related.some(r => r.includes(kw)))
  ).map(item => Object.assign({}, item));
}

/**
 * 按出处古籍查询典故
 * @param {string} source - 古籍名称（如"史记"、"列子"）
 * @returns {Array<Object>} 匹配的典故数组
 * @throws {TypeError} 参数非字符串时抛出
 * @example
 * getAllusionsBySource("史记");
 * // => 返回所有出自《史记》的典故
 */
function getAllusionsBySource(source) {
  if (typeof source !== "string") {
    throw new TypeError("getAllusionsBySource: 参数 source 必须为字符串");
  }
  const s = source.trim();
  if (!s) return [];
  return ALLUSION_DB.filter(item => item.source.includes(s))
    .map(item => Object.assign({}, item));
}

/**
 * 按时代查询典故
 * @param {string} era - 时代名称（如"先秦"、"西汉"、"北宋"）
 * @returns {Array<Object>} 匹配的典故数组
 * @throws {TypeError} 参数非字符串时抛出
 * @example
 * getAllusionsByEra("先秦");
 * // => 返回所有先秦时代的典故
 */
function getAllusionsByEra(era) {
  if (typeof era !== "string") {
    throw new TypeError("getAllusionsByEra: 参数 era 必须为字符串");
  }
  const e = era.trim();
  if (!e) return [];
  return ALLUSION_DB.filter(item => item.era.includes(e))
    .map(item => Object.assign({}, item));
}

/**
 * 获取全部典故列表
 * @returns {Array<Object>} 全部典故数组的副本
 * @example
 * getAllAllusions().length;
 * // => 30（当前数据库典故总数）
 */
function getAllAllusions() {
  return ALLUSION_DB.map(item => Object.assign({}, item));
}

/**
 * 获取典故总数
 * @returns {number} 典故数量
 * @example
 * getAllusionCount();
 * // => 30
 */
function getAllusionCount() {
  return ALLUSION_DB.length;
}

/**
 * 随机获取指定数量的典故
 * @param {number} count - 要获取的数量
 * @returns {Array<Object>} 随机典故数组
 * @throws {TypeError} 参数非数字时抛出
 * @throws {RangeError} 数量超出范围时抛出
 * @example
 * getRandomAllusions(3);
 * // => 返回 3 个随机典故
 */
function getRandomAllusions(count) {
  if (typeof count !== "number" || Number.isNaN(count)) {
    throw new TypeError("getRandomAllusions: 参数 count 必须为数字");
  }
  if (!Number.isInteger(count)) {
    throw new RangeError("getRandomAllusions: count 必须为整数");
  }
  if (count < 0) {
    throw new RangeError("getRandomAllusions: count 不能为负数");
  }
  if (count > ALLUSION_DB.length) {
    throw new RangeError("getRandomAllusions: count 超出典故总数");
  }
  const shuffled = ALLUSION_DB.slice().sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count).map(item => Object.assign({}, item));
}

/**
 * 获取所有不重复的时代列表
 * @returns {Array<string>} 时代名称数组
 * @example
 * getAllEras();
 * // => ["先秦", "西汉（典出春秋）", ...]
 */
function getAllEras() {
  return Array.from(new Set(ALLUSION_DB.map(item => item.era)));
}

/**
 * 获取所有不重复的出处古籍列表
 * @returns {Array<string>} 古籍名称数组
 * @example
 * getAllSources();
 * // => ["《列子·汤问》", "《吕氏春秋·察今》", ...]
 */
function getAllSources() {
  return Array.from(new Set(ALLUSION_DB.map(item => item.source)));
}

let testPassed = 0;

/**
 * 断言函数
 * @param {string} desc - 测试描述
 * @param {any} actual - 实际值
 * @param {any} expected - 期望值
 */
function assert(desc, actual, expected) {
  testTotal++;
  let pass = false;
  if (typeof expected === "function") {
    pass = expected(actual);
  } else {
    pass = JSON.stringify(actual) === JSON.stringify(expected);
  }
  if (pass) {
    testPassed++;
    testLogs.push({ pass: true, desc });
  } else {
    testLogs.push({
      pass: false,
      desc,
      actual: JSON.stringify(actual),
      expected: JSON.stringify(expected)
    });
  }
}

/**
 * 断言抛出异常
 * @param {string} desc - 测试描述
 * @param {Function} fn - 被测函数
 * @param {Function} errorChecker - 检查错误的函数
 */
function assertThrows(desc, fn, errorChecker) {
  testTotal++;
  try {
    fn();
    testLogs.push({ pass: false, desc, actual: "未抛出异常", expected: "应抛出异常" });
  } catch (e) {
    if (errorChecker(e)) {
      testPassed++;
      testLogs.push({ pass: true, desc });
    } else {
      testLogs.push({ pass: false, desc, actual: e.message, expected: "符合检查器的异常" });
    }
  }
}

// 查询
function doSearch() {
  const input = document.getElementById('searchInput').value;
  const mode = document.getElementById('searchMode').value;
  const area = document.getElementById('resultArea');
  let results = [];

  try {
    if (mode === 'name') {
      const r = queryAllusion(input);
      if (r) results = [r];
    } else if (mode === 'keyword') {
      results = searchAllusions(input);
    } else if (mode === 'source') {
      results = getAllusionsBySource(input);
    } else if (mode === 'era') {
      results = getAllusionsByEra(input);
    }
  } catch (e) {
    area.innerHTML = `<div class="empty" style="color:#c00;">查询出错：${e.message}</div>`;
    return;
  }

  if (results.length === 0) {
    area.innerHTML = `<div class="empty">未找到匹配的典故，请检查输入或尝试其他查询方式。</div>`;
  } else {
    area.innerHTML = `<div style="margin-bottom:12px;color:#666;">共找到 ${results.length} 条结果</div>` +
      results.map(renderCard).join('');
  }
}

/**

 * 数据来源：《史记》《战国策》《吕氏春秋》《列子》《韩非子》《山海经》《淮南子》《晋书》《西京杂记》《列女传》等

const ALLUSION_DB = [ /* 共 ${ALLUSION_DB.length} 条，结构见下 */
  {

  },
  // ... 共 ${ALLUSION_DB.length} 条

/**
 * 按名称精确查询典故
 * @param {string} name - 典故名称
 * @returns {Object|null} 匹配的典故对象，未找到返回 null
 * @throws {TypeError} 参数非字符串时抛出
 */
function queryAllusion(name) {
  if (typeof name !== "string") {
    throw new TypeError("queryAllusion: 参数 name 必须为字符串");
  }
  const trimmed = name.trim();
  if (!trimmed) return null;
  const found = ALLUSION_DB.find(item => item.name === trimmed);
  return found ? Object.assign({}, found) : null;
}

/**
 * 按关键词模糊搜索典故
 * @param {string} keyword - 搜索关键词
 * @returns {Array<Object>} 匹配的典故数组
 * @throws {TypeError} 参数非字符串时抛出
 */
function searchAllusions(keyword) {
  if (typeof keyword !== "string") {
    throw new TypeError("searchAllusions: 参数 keyword 必须为字符串");
  }
  const kw = keyword.trim();
  if (!kw) return [];
  return ALLUSION_DB.filter(item =>
    item.name.includes(kw) ||
    item.meaning.includes(kw) ||
    item.extended.includes(kw) ||
    item.source.includes(kw) ||
    item.original.includes(kw) ||
    item.era.includes(kw) ||
    (item.related && item.related.some(r => r.includes(kw)))
  ).map(item => Object.assign({}, item));
}

/**
 * 按出处古籍查询典故
 * @param {string} source - 古籍名称
 * @returns {Array<Object>} 匹配的典故数组
 * @throws {TypeError} 参数非字符串时抛出
 */
function getAllusionsBySource(source) {
  if (typeof source !== "string") {
    throw new TypeError("getAllusionsBySource: 参数 source 必须为字符串");
  }
  const s = source.trim();
  if (!s) return [];
  return ALLUSION_DB.filter(item => item.source.includes(s))
    .map(item => Object.assign({}, item));
}

/**
 * 按时代查询典故
 * @param {string} era - 时代名称
 * @returns {Array<Object>} 匹配的典故数组
 * @throws {TypeError} 参数非字符串时抛出
 */
function getAllusionsByEra(era) {
  if (typeof era !== "string") {
    throw new TypeError("getAllusionsByEra: 参数 era 必须为字符串");
  }
  const e = era.trim();
  if (!e) return [];
  return ALLUSION_DB.filter(item => item.era.includes(e))
    .map(item => Object.assign({}, item));
}

/**
 * 获取全部典故列表
 * @returns {Array<Object>} 全部典故数组的副本
 */
function getAllAllusions() {
  return ALLUSION_DB.map(item => Object.assign({}, item));
}

/**
 * 获取典故总数
 * @returns {number} 典故数量
 */
function getAllusionCount() {
  return ALLUSION_DB.length;
}

/**
 * 随机获取指定数量的典故
 * @param {number} count - 要获取的数量
 * @returns {Array<Object>} 随机典故数组
 * @throws {TypeError} 参数非数字时抛出
 * @throws {RangeError} 数量超出范围时抛出
 */
function getRandomAllusions(count) {
  if (typeof count !== "number" || Number.isNaN(count)) {
    throw new TypeError("getRandomAllusions: 参数 count 必须为数字");
  }
  if (!Number.isInteger(count)) {
    throw new RangeError("getRandomAllusions: count 必须为整数");
  }
  if (count < 0) {
    throw new RangeError("getRandomAllusions: count 不能为负数");
  }
  if (count > ALLUSION_DB.length) {
    throw new RangeError("getRandomAllusions: count 超出典故总数");
  }
  const shuffled = ALLUSION_DB.slice().sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count).map(item => Object.assign({}, item));
}
