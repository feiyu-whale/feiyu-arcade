<script id="mainScript">
/* ============================================================
 *  六十甲子表工具 · 核心算法
 *  依据：通行六十甲子纳音表（传统历法）
 * ============================================================ */

/**
 * 天干序列（索引 0-9）
 * @type {string[]}
 */
const TIAN_GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];

/**
 * 地支序列（索引 0-11）
 * @type {string[]}
 */
const DI_ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

/**
 * 生肖序列（与地支一一对应）
 * @type {string[]}
 */
const SHENG_XIAO = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

/**
 * 纳音五行表（30 组，每组对应两个干支）
 * 顺序：甲子乙丑、丙寅丁卯、戊辰己巳……壬戌癸亥
 * @type {string[]}
 */
const NA_YIN = [
  '海中金','炉中火','大林木','路旁土','剑锋金','山头火',
  '涧下水','城头土','白蜡金','杨柳木','泉中水','屋上土',
  '霹雳火','松柏木','长流水','沙中金','山下火','平地木',
  '壁上土','金箔金','覆灯火','天河水','大驿土','钗钏金',
  '桑柘木','大溪水','沙中土','天上火','石榴木','大海水'
];

/**
 * 校验年份是否为有效整数
 * @param {*} year - 待校验值
 * @returns {number} 校验通过的整数年份
 * @throws {TypeError} 非数字类型
 * @throws {RangeError} 超出安全整数范围或非整数
 */
function validateYear(year) {
  if (year === null || year === undefined) {
    throw new TypeError('年份不能为 null 或 undefined');
  }
  if (typeof year === 'string') {
    if (year.trim() === '') throw new TypeError('年份不能为空字符串');
    year = Number(year);
  }
  if (typeof year !== 'number' || Number.isNaN(year)) {
    throw new TypeError('年份必须是数字，收到: ' + year);
  }
  if (!Number.isInteger(year)) {
    throw new RangeError('年份必须是整数，收到: ' + year);
  }
  if (!Number.isSafeInteger(year)) {
    throw new RangeError('年份超出安全整数范围');
  }
  return year;
}

/**
 * 校验六十甲子序号
 * @param {*} index - 序号（1-60）
 * @returns {number} 校验通过的序号
 * @throws {TypeError} 非法类型
 * @throws {RangeError} 超出 1-60 范围
 */
function validateIndex(index) {
  if (index === null || index === undefined) {
    throw new TypeError('序号不能为 null 或 undefined');
  }
  if (typeof index === 'string') {
    if (index.trim() === '') throw new TypeError('序号不能为空字符串');
    index = Number(index);
  }
  if (typeof index !== 'number' || Number.isNaN(index)) {
    throw new TypeError('序号必须是数字');
  }
  if (!Number.isInteger(index)) {
    throw new RangeError('序号必须是整数');
  }
  if (index < 1 || index > 60) {
    throw new RangeError('序号必须在 1-60 之间，收到: ' + index);
  }
  return index;
}

/**
 * 根据公历年份计算该年的干支（以立春为界，本函数按"农历年近似=公历年"处理，立春前需另行校正）
 *
 * 算法：以公元 4 年为甲子年（历史推算基准），则
 *   天干索引 = (year - 4) mod 10
 *   地支索引 = (year - 4) mod 12
 *   甲子序号 = (year - 4) mod 60 + 1
 *
 * @param {number|string} year - 公历年份（整数）
 * @returns {{year:number, ganZhi:string, gan:string, zhi:string, index:number, naYin:string, zodiac:string}}
 * @throws {TypeError} 参数类型错误
 * @throws {RangeError} 非整数
 * @example
 * getGanZhiByYear(1984);
 * // => { year:1984, ganZhi:'甲子', gan:'甲', zhi:'子', index:1, naYin:'海中金', zodiac:'鼠' }
 * @example
 * getGanZhiByYear(2024);
 * // => { year:2024, ganZhi:'甲辰', ..., naYin:'覆灯火', zodiac:'龙' }
 */
function getGanZhiByYear(year) {
  year = validateYear(year);
  // 处理负数年份（公元前）：使用数学取模保证非负
  const mod = ((year - 4) % 60 + 60) % 60;
  const index = mod + 1;
  const ganIdx = ((year - 4) % 10 + 10) % 10;
  const zhiIdx = ((year - 4) % 12 + 12) % 12;
  const naYinIdx = Math.floor(mod / 2);
  return {
    year: year,
    ganZhi: TIAN_GAN[ganIdx] + DI_ZHI[zhiIdx],
    gan: TIAN_GAN[ganIdx],
    zhi: DI_ZHI[zhiIdx],
    index: index,
    naYin: NA_YIN[naYinIdx],
    zodiac: SHENG_XIAO[zhiIdx]
  };
}

/**
 * 根据六十甲子序号（1-60）获取完整信息
 * @param {number|string} index - 序号，1 为甲子，60 为癸亥
 * @returns {{index:number, ganZhi:string, gan:string, zhi:string, naYin:string, zodiac:string}}
 * @throws {TypeError} 非法类型
 * @throws {RangeError} 超出 1-60
 * @example
 * getGanZhiByIndex(1);
 * // => { index:1, ganZhi:'甲子', gan:'甲', zhi:'子', naYin:'海中金', zodiac:'鼠' }
 * @example
 * getGanZhiByIndex(60);
 * // => { index:60, ganZhi:'癸亥', ..., naYin:'大海水', zodiac:'猪' }
 */
function getGanZhiByIndex(index) {
  index = validateIndex(index);
  const mod = index - 1;
  const ganIdx = mod % 10;
  const zhiIdx = mod % 12;
  const naYinIdx = Math.floor(mod / 2);
  return {
    index: index,
    ganZhi: TIAN_GAN[ganIdx] + DI_ZHI[zhiIdx],
    gan: TIAN_GAN[ganIdx],
    zhi: DI_ZHI[zhiIdx],
    naYin: NA_YIN[naYinIdx],
    zodiac: SHENG_XIAO[zhiIdx]
  };
}

/**
 * 根据干支名称反查近百年内对应的公历年份列表
 * @param {string} ganZhi - 干支名称，如 '甲子'、'癸亥'
 * @param {number} [baseYear=2024] - 基准年份，返回该年前后约 60 年范围内的匹配
 * @returns {number[]} 公历年份数组（升序）
 * @throws {TypeError} 参数类型错误
 * @throws {Error} 干支名称不合法
 * @example
 * getYearByGanZhi('甲子', 2024);
 * // => [1984, 2044]
 * @example
 * getYearByGanZhi('甲辰', 2024);
 * // => [1964, 2024]
 */
function getYearByGanZhi(ganZhi, baseYear) {
  if (ganZhi === null || ganZhi === undefined) {
    throw new TypeError('干支不能为 null 或 undefined');
  }
  if (typeof ganZhi !== 'string' || ganZhi.length !== 2) {
    throw new TypeError('干支必须是两个汉字的字符串');
  }
  const gan = ganZhi[0];
  const zhi = ganZhi[1];
  const ganIdx = TIAN_GAN.indexOf(gan);
  const zhiIdx = DI_ZHI.indexOf(zhi);
  if (ganIdx === -1 || zhiIdx === -1) {
    throw new Error('非法干支名称: ' + ganZhi);
  }
  // 天干地支奇偶必须相同（阳干配阳支、阴干配阴支）
  if (ganIdx % 2 !== zhiIdx % 2) {
    throw new Error('非法干支组合（阴阳不配）: ' + ganZhi);
  }
  baseYear = baseYear === undefined ? 2024 : validateYear(baseYear);
  // 解同余方程：year ≡ ganIdx+4 (mod 10), year ≡ zhiIdx+4 (mod 12)
  // 等价于 year ≡ target (mod 60)
  let target = -1;
  for (let y = 0; y < 60; y++) {
    if (((y - 4) % 10 + 10) % 10 === ganIdx && ((y - 4) % 12 + 12) % 12 === zhiIdx) {
      target = y;
      break;
    }
  }
  const results = [];
  const start = baseYear - 60;
  const end = baseYear + 60;
  for (let y = start; y <= end; y++) {
    if (((y - 4) % 60 + 60) % 60 === target) {
      results.push(y);
    }
  }
  return results;
}

/**
 * 根据干支获取纳音五行
 * @param {string} ganZhi - 干支名称
 * @returns {string} 纳音五行名称
 * @throws {TypeError} 参数类型错误
 * @throws {Error} 干支不合法
 * @example
 * getNaYin('甲子'); // => '海中金'
 * @example
 * getNaYin('癸亥'); // => '大海水'
 */
function getNaYin(ganZhi) {
  if (ganZhi === null || ganZhi === undefined) {
    throw new TypeError('干支不能为 null 或 undefined');
  }
  if (typeof ganZhi !== 'string' || ganZhi.length !== 2) {
    throw new TypeError('干支必须是两个汉字的字符串');
  }
  const ganIdx = TIAN_GAN.indexOf(ganZhi[0]);
  const zhiIdx = DI_ZHI.indexOf(ganZhi[1]);
  if (ganIdx === -1 || zhiIdx === -1) {
    throw new Error('非法干支名称: ' + ganZhi);
  }
  if (ganIdx % 2 !== zhiIdx % 2) {
    throw new Error('非法干支组合: ' + ganZhi);
  }
  // 计算该干支在 60 甲子中的序号 mod 60
  let mod = -1;
  for (let i = 0; i < 60; i++) {
    if (i % 10 === ganIdx && i % 12 === zhiIdx) { mod = i; break; }
  }
  return NA_YIN[Math.floor(mod / 2)];
}

/**
 * 根据公历年份获取生肖（简化规则：以公历年近似，未考虑立春分界）
 * @param {number|string} year - 公历年份
 * @returns {string} 生肖名称
 * @throws {TypeError} 参数类型错误
 * @throws {RangeError} 非整数
 * @example
 * getZodiac(2024); // => '龙'
 * @example
 * getZodiac(2023); // => '兔'
 */
function getZodiac(year) {
  year = validateYear(year);
  const zhiIdx = ((year - 4) % 12 + 12) % 12;
  return SHENG_XIAO[zhiIdx];
}

/**
 * 生成完整的六十甲子表
 * @returns {Array<{index:number, ganZhi:string, gan:string, zhi:string, naYin:string, zodiac:string}>}
 * @example
 * const table = getJiaZiTable();
 * // table.length === 60
 * // table[0].ganZhi === '甲子'
 * // table[59].ganZhi === '癸亥'
 */
function getJiaZiTable() {
  const result = [];
  for (let i = 1; i <= 60; i++) {
    result.push(getGanZhiByIndex(i));
  }
  return result;
}

/**
 * 查询某干支在近百年内对应的公历年份（默认以当前年份为基准）
 * @param {string} ganZhi - 干支名称
 * @param {number} [centerYear] - 中心年份，默认当前年
 * @param {number} [range=100] - 前后各多少年
 * @returns {number[]} 年份数组
 * @throws {TypeError} 参数错误
 * @throws {Error} 干支非法
 * @example
 * getRecentYears('甲子', 2024, 100);
 * // => [1984, 2044]
 */
function getRecentYears(ganZhi, centerYear, range) {
  if (ganZhi === null || ganZhi === undefined) {
    throw new TypeError('干支不能为 null 或 undefined');
  }
  if (typeof ganZhi !== 'string' || ganZhi.length !== 2) {
    throw new TypeError('干支必须是两个汉字的字符串');
  }
  const ganIdx = TIAN_GAN.indexOf(ganZhi[0]);
  const zhiIdx = DI_ZHI.indexOf(ganZhi[1]);
  if (ganIdx === -1 || zhiIdx === -1) throw new Error('非法干支: ' + ganZhi);
  if (ganIdx % 2 !== zhiIdx % 2) throw new Error('非法干支组合: ' + ganZhi);

  centerYear = centerYear === undefined ? new Date().getFullYear() : validateYear(centerYear);
  range = range === undefined ? 100 : validateYear(range);
  if (range < 0) throw new RangeError('范围不能为负');

  let target = -1;
  for (let y = 0; y < 60; y++) {
    if (((y - 4) % 10 + 10) % 10 === ganIdx && ((y - 4) % 12 + 12) % 12 === zhiIdx) {
      target = y; break;
    }
  }
  const results = [];
  for (let y = centerYear - range; y <= centerYear + range; y++) {
    if (((y - 4) % 60 + 60) % 60 === target) results.push(y);
  }
  return results;
}
</script>

<script>
/* ============================================================
 *  单元测试（纯 JS，自实现 assert）
 * ============================================================ */
let _pass = 0, _fail = 0, _log = [];

function assertEqual(actual, expected, msg) {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  if (a === e) {
    _pass++;
    _log.push('<span class="pass">✓ PASS</span> ' + msg);
  } else {
    _fail++;
    _log.push('<span class="fail">✗ FAIL</span> ' + msg +
      ' | 期望: ' + e + ' | 实际: ' + a);
  }
}

function assertThrows(fn, errType, msg) {
  try {
    fn();
    _fail++;
    _log.push('<span class="fail">✗ FAIL</span> ' + msg + ' | 期望抛出异常但未抛出');
  } catch (e) {
    if (errType && !(e instanceof errType)) {
      _fail++;
      _log.push('<span class="fail">✗ FAIL</span> ' + msg + ' | 期望 ' + errType.name + '，实际 ' + e.constructor.name);
    } else {
      _pass++;
      _log.push('<span class="pass">✓ PASS</span> ' + msg + ' (抛出: ' + e.message + ')');
    }
  }
}

function runAllTests() {
  _pass = 0; _fail = 0; _log = [];

  /* ---------- getGanZhiByYear 正常值 ---------- */
  // 1. 1984 甲子年
  assertEqual(getGanZhiByYear(1984).ganZhi, '甲子', 'getGanZhiByYear(1984) → 甲子');
  assertEqual(getGanZhiByYear(1984).index, 1, 'getGanZhiByYear(1984).index → 1');
  assertEqual(getGanZhiByYear(1984).naYin, '海中金', 'getGanZhiByYear(1984).naYin → 海中金');
  assertEqual(getGanZhiByYear(1984).zodiac, '鼠', 'getGanZhiByYear(1984).zodiac → 鼠');

  // 2. 2024 甲辰年
  assertEqual(getGanZhiByYear(2024).ganZhi, '甲辰', 'getGanZhiByYear(2024) → 甲辰');
  assertEqual(getGanZhiByYear(2024).naYin, '覆灯火', 'getGanZhiByYear(2024).naYin → 覆灯火');
  assertEqual(getGanZhiByYear(2024).zodiac, '龙', 'getGanZhiByYear(2024).zodiac → 龙');

  // 3. 2023 癸卯年
  assertEqual(getGanZhiByYear(2023).ganZhi, '癸卯', 'getGanZhiByYear(2023) → 癸卯');
  assertEqual(getGanZhiByYear(2023).naYin, '金箔金', 'getGanZhiByYear(2023).naYin → 金箔金');

  // 4. 1911 辛亥年
  assertEqual(getGanZhiByYear(1911).ganZhi, '辛亥', 'getGanZhiByYear(1911) → 辛亥');
  assertEqual(getGanZhiByYear(1911).naYin, '钗钏金', 'getGanZhiByYear(1911).naYin → 钗钏金');

  // 5. 字符串数字
  assertEqual(getGanZhiByYear('1984').ganZhi, '甲子', 'getGanZhiByYear("1984") → 甲子');

  /* ---------- getGanZhiByYear 边界值 ---------- */
  // 6. 公元 4 年（甲子基准）
  assertEqual(getGanZhiByYear(4).ganZhi, '甲子', 'getGanZhiByYear(4) → 甲子');
  // 7. 公元 3 年（癸亥）
  assertEqual(getGanZhiByYear(3).ganZhi, '癸亥', 'getGanZhiByYear(3) → 癸亥');
  // 8. 公元 1 年（辛酉）
  assertEqual(getGanZhiByYear(1).ganZhi, '辛酉', 'getGanZhiByYear(1) → 辛酉');
  // 9. 公元 0 年（不存在，但算法可算）
  assertEqual(getGanZhiByYear(0).ganZhi, '庚申', 'getGanZhiByYear(0) → 庚申');
  // 10. 负数年份
  assertEqual(getGanZhiByYear(-1).ganZhi, '己未', 'getGanZhiByYear(-1) → 己未');
  // 11. 2044 甲子
  assertEqual(getGanZhiByYear(2044).ganZhi, '甲子', 'getGanZhiByYear(2044) → 甲子');

  /* ---------- getGanZhiByYear 异常输入 ---------- */
  // 12. null
  assertThrows(() => getGanZhiByYear(null), TypeError, 'getGanZhiByYear(null) 抛 TypeError');
  // 13. undefined
  assertThrows(() => getGanZhiByYear(undefined), TypeError, 'getGanZhiByYear(undefined) 抛 TypeError');
  // 14. NaN
  assertThrows(() => getGanZhiByYear(NaN), TypeError, 'getGanZhiByYear(NaN) 抛 TypeError');
  // 15. 空字符串
  assertThrows(() => getGanZhiByYear(''), TypeError, 'getGanZhiByYear("") 抛 TypeError');
  // 16. 浮点数
  assertThrows(() => getGanZhiByYear(1984.5), RangeError, 'getGanZhiByYear(1984.5) 抛 RangeError');
  // 17. 布尔
  assertThrows(() => getGanZhiByYear(true), TypeError, 'getGanZhiByYear(true) 抛 TypeError');

  /* ---------- getGanZhiByIndex ---------- */
  // 18. 序号 1
  assertEqual(getGanZhiByIndex(1).ganZhi, '甲子', 'getGanZhiByIndex(1) → 甲子');
  // 19. 序号 30
  assertEqual(getGanZhiByIndex(30).ganZhi, '癸巳', 'getGanZhiByIndex(30) → 癸巳');
  // 20. 序号 60
  assertEqual(getGanZhiByIndex(60).ganZhi, '癸亥', 'getGanZhiByIndex(60) → 癸亥');
  // 21. 序号 60 纳音
  assertEqual(getGanZhiByIndex(60).naYin, '大海水', 'getGanZhiByIndex(60).naYin → 大海水');
  // 22. 序号 0 越界
  assertThrows(() => getGanZhiByIndex(0), RangeError, 'getGanZhiByIndex(0) 抛 RangeError');
  // 23. 序号 61 越界
  assertThrows(() => getGanZhiByIndex(61), RangeError, 'getGanZhiByIndex(61) 抛 RangeError');
  // 24. 负数序号
  assertThrows(() => getGanZhiByIndex(-5), RangeError, 'getGanZhiByIndex(-5) 抛 RangeError');
  // 25. null
  assertThrows(() => getGanZhiByIndex(null), TypeError, 'getGanZhiByIndex(null) 抛 TypeError');

  /* ---------- getYearByGanZhi ---------- */
  // 26. 甲子
  const y1 = getYearByGanZhi('甲子', 2024);
  assertEqual(y1.includes(1984) && y1.includes(2044), true, 'getYearByGanZhi("甲子",2024) 包含 1984 和 2044');
  // 27. 甲辰
  const y2 = getYearByGanZhi('甲辰', 2024);
  assertEqual(y2.includes(2024) && y2.includes(1964), true, 'getYearByGanZhi("甲辰",2024) 包含 1964 和 2024');
  // 28. 癸亥
  const y3 = getYearByGanZhi('癸亥', 2024);
  assertEqual(y3.includes(1983) && y3.includes(2043), true, 'getYearByGanZhi("癸亥",2024) 包含 1983 和 2043');
  // 29. 非法干支
  assertThrows(() => getYearByGanZhi('甲丑', 2024), Error, 'getYearByGanZhi("甲丑") 阴阳不配抛错');
  // 30. 空字符串
  assertThrows(() => getYearByGanZhi('', 2024), TypeError, 'getYearByGanZhi("") 抛 TypeError');
  // 31. null
  assertThrows(() => getYearByGanZhi(null, 2024), TypeError, 'getYearByGanZhi(null) 抛 TypeError');
  // 32. 非汉字
  assertThrows(() => getYearByGanZhi('AB', 2024), Error, 'getYearByGanZhi("AB") 抛错');

  /* ---------- getNaYin ---------- */
  // 33. 甲子
  assertEqual(getNaYin('甲子'), '海中金', 'getNaYin("甲子") → 海中金');
  // 34. 乙丑（同组）
  assertEqual(getNaYin('乙丑'), '海中金', 'getNaYin("乙丑") → 海中金');
  // 35. 癸亥
  assertEqual(getNaYin('癸亥'), '大海水', 'getNaYin("癸亥") → 大海水');
  // 36. 壬戌
  assertEqual(getNaYin('壬戌'), '大海水', 'getNaYin("壬戌") → 大海水');
  // 37. 非法
  assertThrows(() => getNaYin('甲丑'), Error, 'getNaYin("甲丑") 抛错');
  // 38. null
  assertThrows(() => getNaYin(null), TypeError, 'getNaYin(null) 抛 TypeError');

  /* ---------- getZodiac ---------- */
  // 39. 2024 龙
  assertEqual(getZodiac(2024), '龙', 'getZodiac(2024) → 龙');
  // 40. 2023 兔
  assertEqual(getZodiac(2023), '兔', 'getZodiac(2023) → 兔');
  // 41. 2020 鼠
  assertEqual(getZodiac(2020), '鼠', 'getZodiac(2020) → 鼠');
  // 42. 1984 鼠
  assertEqual(getZodiac(1984), '鼠', 'getZodiac(1984) → 鼠');
  // 43. 浮点
  assertThrows(() => getZodiac(2024.5), RangeError, 'getZodiac(2024.5) 抛 RangeError');

  /* ---------- getJiaZiTable ---------- */
  // 44. 表长度
  assertEqual(getJiaZiTable().length, 60, 'getJiaZiTable().length === 60');
  // 45. 首项
  assertEqual(getJiaZiTable()[0].ganZhi, '甲子', '表首项 → 甲子');
  // 46. 末项
  assertEqual(getJiaZiTable()[59].ganZhi, '癸亥', '表末项 → 癸亥');

  /* ---------- getRecentYears ---------- */
  // 47. 甲子近百年
  const r1 = getRecentYears('甲子', 2024, 100);
  assertEqual(r1.includes(1984) && r1.includes(2044), true, 'getRecentYears("甲子",2024,100) 含 1984/2044');
  // 48. 范围 0
  const r2 = getRecentYears('甲子', 1984, 0);
  assertEqual(r2, [1984], 'getRecentYears("甲子",1984,0) → [1984]');
  // 49. 负范围
  assertThrows(() => getRecentYears('甲子', 2024, -10), RangeError, 'getRecentYears 负范围抛错');

  /* ---------- 精度/浮点相关 ---------- */
  // 50. 大整数年份
  assertEqual(getGanZhiByYear(10004).ganZhi, '甲子', 'getGanZhiByYear(10004) → 甲子（大整数）');
  // 51. 公元前大数
  assertEqual(getGanZhiByYear(-1000).ganZhi, '辛酉', 'getGanZhiByYear(-1000) → 辛酉');

  /* ---------- 输出汇总 ---------- */
  const total = _pass + _fail;
  const summary = '\n\n<span class="summary">通过 ' + _pass + ' / 共 ' + total +
    (_fail > 0 ? ' （失败 ' + _fail + '）' : ' ✓ 全部通过') + '</span>';
  document.getElementById('testResult').innerHTML = _log.join('\n') + summary;
}
