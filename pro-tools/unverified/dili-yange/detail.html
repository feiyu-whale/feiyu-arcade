 * lookupByName("长安");

 * @example
 * lookupByName("建业");
 * // => [{ ancient: "金陵", aliases: ["建业", ...], modern: "南京", ... }]
 */

  if (typeof name !== "string") {
    throw new TypeError("lookupByName: name 必须是字符串");
  }
  const trimmed = name.trim();
  if (trimmed === "") return [];
  return DATA.filter(item =>
    item.ancient === trimmed || item.aliases.includes(trimmed)

/**

 *
 * @param {string} keyword - 搜索关键词
 * @returns {Array<Object>} 匹配的条目数组
 * @throws {TypeError} 当 keyword 不是字符串时抛出
 * @example
 * fuzzySearch("都");
 * // => 返回所有备注或名称中含"都"的条目
 */
function fuzzySearch(keyword) {
  if (typeof keyword !== "string") {
    throw new TypeError("fuzzySearch: keyword 必须是字符串");
  }
  const kw = keyword.trim();
  if (kw === "") return [];
  return DATA.filter(item =>
    item.ancient.includes(kw) ||
    item.modern.includes(kw) ||
    item.aliases.some(a => a.includes(kw)) ||
    (item.note && item.note.includes(kw))
  );
}

/**
 * 获取所有朝代列表
 *
 * @returns {string[]} 朝代名称数组（按时间顺序）
 * @example
 * getDynasties();
 * // => ["夏", "商", "西周", ..., "民国"]
 */
function getDynasties() {
  return DYNASTIES.slice();
}

/**
 * 获取所有省份列表
 *
 * @returns {string[]} 省级行政区名称数组
 * @example
 * getProvinces();
 * // => ["北京", "天津", ..., "澳门"]
 */
function getProvinces() {
  return PROVINCES.slice();
}

/**
 * 验证单条地名数据是否合法
 *
 * @param {Object} entry - 待验证的条目
 * @returns {{ valid: boolean, errors: string[] }} 验证结果
 * @throws {TypeError} 当 entry 不是对象时抛出
 * @example
 * validateEntry({ ancient: "长安", modern: "西安", dynasty: ["唐"], province: "陕西" });
 * // => { valid: true, errors: [] }
 */
function validateEntry(entry) {
  if (entry === null || typeof entry !== "object") {
    throw new TypeError("validateEntry: entry 必须是对象");
  }
  const errors = [];
  if (typeof entry.ancient !== "string" || entry.ancient.trim() === "") {
    errors.push("ancient 必须是非空字符串");
  }
  if (typeof entry.modern !== "string" || entry.modern.trim() === "") {
    errors.push("modern 必须是非空字符串");
  }
  if (!Array.isArray(entry.dynasty) || entry.dynasty.length === 0) {
    errors.push("dynasty 必须是非空数组");
  } else {
    entry.dynasty.forEach(d => {
      if (!DYNASTIES.includes(d)) errors.push("未知朝代: " + d);
    });
  }
  if (typeof entry.province !== "string" || !PROVINCES.includes(entry.province)) {
    errors.push("province 不在已知省份列表中: " + entry.province);
  }
  if (entry.aliases !== undefined && !Array.isArray(entry.aliases)) {
    errors.push("aliases 必须是数组");
  }
  return { valid: errors.length === 0, errors: errors };
}

/**
 * 格式化单条地名为可读字符串
 *
 * @param {Object} entry - 地名条目
 * @param {string} [format="full"] - 格式类型："full"（完整）| "brief"（简要）| "csv"
 * @returns {string} 格式化后的字符串
 * @throws {TypeError} 当 entry 不是对象时抛出
 * @throws {RangeError} 当 format 不在允许范围内时抛出
 * @example
 * formatEntry(DATA[0], "full");
 * // => "长安（别名：大兴）→ 西安，朝代：西汉、新、隋、唐，今属：陕西。备注：汉唐都城"
 */
function formatEntry(entry, format) {
  if (entry === null || typeof entry !== "object") {
    throw new TypeError("formatEntry: entry 必须是对象");
  }
  const fmt = (format === undefined) ? "full" : format;
  if (!["full", "brief", "csv"].includes(fmt)) {
    throw new RangeError("formatEntry: format 必须是 full/brief/csv 之一");
  }
  const aliasStr = (entry.aliases && entry.aliases.length)
    ? "（别名：" + entry.aliases.join("、") + "）" : "";
  if (fmt === "brief") {
    return entry.ancient + " → " + entry.modern;
  }
  if (fmt === "csv") {
    return [
      entry.ancient,
      (entry.aliases || []).join("|"),
      entry.modern,
      entry.dynasty.join("|"),
      entry.province,
      entry.note || ""
    ].join(",");
  }
  // full
  let s = entry.ancient + aliasStr + " → " + entry.modern;
  s += "，朝代：" + entry.dynasty.join("、");
  s += "，今属：" + entry.province;
  if (entry.note) s += "。备注：" + entry.note;
  return s;
}

/**
 * 获取数据集统计信息
 *
 * @returns {{ total: number, dynastyCount: Object<string,number>, provinceCount: Object<string,number> }}
 * @example
 * getStatistics();
 * // => { total: 60, dynastyCount: { "唐": 15, ... }, provinceCount: { "陕西": 3, ... } }
 */
function getStatistics() {
  const dynastyCount = {};
  const provinceCount = {};
  DATA.forEach(item => {
    item.dynasty.forEach(d => {
      dynastyCount[d] = (dynastyCount[d] || 0) + 1;
    });
    provinceCount[item.province] = (provinceCount[item.province] || 0) + 1;
  });
  return {
    total: DATA.length,
    dynastyCount: dynastyCount,
    provinceCount: provinceCount
  };
}

/**
 * 导出数据为指定格式
 *
 * @param {string} [format="json"] - 导出格式："json" | "csv" | "text"
 * @returns {string} 导出后的字符串
 * @throws {RangeError} 当 format 不在允许范围内时抛出
 * @example
 * exportData("csv");
 * // => "古名,别名,今名,朝代,省份,备注\\n长安,大兴,西安,西汉|新|隋|唐,陕西,汉唐都城\\n..."
 */
function exportData(format) {
  const fmt = (format === undefined) ? "json" : format;
  if (!["json", "csv", "text"].includes(fmt)) {
    throw new RangeError("exportData: format 必须是 json/csv/text 之一");
  }
  if (fmt === "json") {
    return JSON.stringify(DATA, null, 2);
  }
  if (fmt === "csv") {
    const header = "古名,别名,今名,朝代,省份,备注";
    const rows = DATA.map(item => formatEntry(item, "csv"));
    return header + "\\n" + rows.join("\\n");
  }
  // text
  return DATA.map(item => formatEntry(item, "full")).join("\\n");
}
`;

  if (condition) {

function assertEqual(actual, expected, desc) {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  assert(a === e, desc, "期望 " + e + "，实际 " + a);
}

function assertThrows(fn, desc) {
  let threw = false;
  try { fn(); } catch (e) { threw = true; }
  assert(threw, desc);
}

//   note: "六朝古都"
// }]</pre>
<p>结论：金陵即今江苏南京，历史上还叫过建业、建康、应天、集庆。</p>

<h4>场景 2：研究北宋涉及的城市</h4>
<p>想了解北宋时期本工具收录了哪些地名。</p>
<pre>lookupByDynasty("北宋").map(i => i.ancient + " → " + i.modern);
// 返回：
// ["汴梁 → 开封", "临安 → 杭州", "庐州 → 合肥", "潭州 → 长沙",
//  "明州 → 宁波", "江州 → 九江", "巴陵 → 岳阳", ...]</pre>
<p>结论：北宋时期本工具收录 8 条相关地名，都城在汴梁（今开封）。</p>

<h4>场景 3：梳理陕西的历史地名</h4>
<p>想了解今天陕西省境内历史上用过哪些地名。</p>
<pre>lookupByProvince("陕西").map(i => formatEntry(i, "brief"));
// 返回：
// ["长安 → 西安", "镐京 → 西安", "咸阳 → 咸阳"]</pre>
<p>结论：今西安一地，历史上曾名长安（汉唐）、镐京（西周）；咸阳沿用至今。</p>

<h4>场景 4：反向查询——今名查古名</h4>
<p>已知今天某地叫"武汉"，想知道历史上叫什么。</p>
<pre>lookupByModern("武汉");
// 返回：
// [{ ancient: "江夏", aliases: ["鄂州"], modern: "武汉",
//    dynasty: ["汉","三国","唐","宋"], province: "湖北",
//    note: "今武昌一带" }]</pre>
<p>结论：今武汉在历史上主要称江夏（或鄂州），对应今武昌一带。</p>

<h4>场景 5：批量导出为 CSV 供其他系统使用</h4>
<p>需要将数据导入 Excel 或数据库。</p>
<pre>const csv = exportData("csv");
console.log(csv);
// 输出：
// 古名,别名,今名,朝代,省份,备注
// 长安,大兴,西安,西汉|新|隋|唐,陕西,汉唐都城
// 金陵,建业|建康|应天|集庆,南京,东吴|东晋|南朝|明,江苏,六朝古都
// ...</pre>
<p>结论：CSV 格式可直接粘贴到 Excel，列分隔符为逗号，多值字段用竖线分隔。</p>

<h3 id="s5">5. 常见错误与排查</h3>
<table>
  <tr><th>错误现象</th><th>原因</th><th>解决办法</th></tr>
  <tr>
    <td><code>TypeError: lookupByName: name 必须是字符串</code></td>
    <td>传入了 null、undefined、数字、对象等非字符串值</td>
    <td>确保传入 string 类型；必要时先 <code>String(x)</code> 转换</td>
  </tr>
  <tr>
    <td><code>RangeError: lookupByDynasty: 未知朝代 "XX"</code></td>
    <td>传入的朝代名不在 DYNASTIES 列表中（如写成"唐朝"而非"唐"）</td>
    <td>用 <code>getDynasties()</code> 查看合法朝代名</td>
  </tr>
  <tr>
    <td><code>RangeError: lookupByProvince: 未知省份 "XX"</code></td>
    <td>传入的省份名不在 PROVINCES 列表中（如写成"广西省"而非"广西"）</td>
    <td>用 <code>getProvinces()</code> 查看合法省份名，不带"省/市/区"后缀</td>
  </tr>
  <tr>
    <td>查询返回空数组</td>
    <td>该地名未收录在本工具的 60 条数据中</td>
    <td>本工具仅收录代表性条目，非全量历史地名；详见第 7 节局限性</td>
  </tr>
  <tr>
    <td><code>RangeError: formatEntry: format 必须是 full/brief/csv 之一</code></td>
    <td>format 参数传入了非法值</td>
    <td>仅接受 "full"、"brief"、"csv" 三种</td>
  </tr>
</table>

<h3 id="s6">6. 数据来源与标准依据</h3>
<p><strong>主要数据来源：</strong></p>
<ul>
  <li>谭其骧 主编.《中国历史地图集》（全 8 册）. 中国地图出版社, 1982—1988.</li>
  <li>该图集是中国历史地理学最权威的参考工具，由复旦大学历史地理研究所主持编绘，
      覆盖从原始社会到清末的全部历史时期政区与地名。</li>
</ul>
<p><strong>相关国家/行业标准：</strong></p>
<ul>
  <li>GB/T 2260—2007《中华人民共和国行政区划代码》：本工具"今属省份"字段采用该标准中的省级名称。</li>
  <li>GB/T 17693 系列《外语地名汉字译写导则》：本工具不涉及外语译写，未直接引用。</li>
  <li>民政部《中国地名汉语拼音字母拼写规则》：本工具不涉及拼音，未直接引用。</li>
</ul>
<div class="note">
  <strong>说明：</strong>本工具中的朝代归属、地名对应关系，均依据《中国历史地图集》各册的图幅与释文。
  由于历史地名存在"一地多名""一名多地""同名异实"等复杂情况，本工具仅给出主流、代表性的对应关系，
  不代表该地名在全部历史时期都如此对应。如需精确到某一年份的政区归属，请查阅《中国历史地图集》原图。
</div>

<h3 id="s7">7. 局限性说明</h3>
<div class="warn">
  <strong>本工具不能做什么，请务必知悉：</strong>
</div>
<ol>
  <li><strong>数据量有限：</strong>仅收录 60 条代表性条目，远非中国历史地名的全量。
      中国历史上出现过的县级以上地名数以万计，本工具无法覆盖。</li>
  <li><strong>时间精度不足：</strong>每条数据只给出"主要使用朝代"的数组，无法精确到具体年份。
      例如"长安"作为都城，在西汉、隋、唐的具体年份范围本工具未给出。</li>
  <li><strong>空间精度不足：</strong>古今地名并非严格一一对应。古代"荆州"辖区远大于今荆州市，
      古代"扬州"辖区也远大于今扬州市。本工具仅给出治所（行政中心）对应的今地，不代表辖区等同。</li>
  <li><strong>不处理同名异地：</strong>历史上存在大量同名异地（如多个"荆州"、多个"扬州"），
      本工具未做区分，可能产生歧义。</li>
  <li><strong>不处理少数民族语言地名：</strong>如藏语、蒙古语、维吾尔语地名的音译、
      不同时期的汉字写法差异，本工具未系统处理。</li>
  <li><strong>不处理政区沿革细节：</strong>如"州—郡—县"层级变化、"路—府—州—军—监"
      等宋代特殊政区，本工具未体现。</li>
  <li><strong>不保证 100% 无争议：</strong>部分地名的古今对应在学术界仍有争议
      （如"古赤壁"具体位置），本工具采用主流说法，不代表定论。</li>
  <li><strong>非实时数据：</strong>本工具数据为静态快照，不随新考古发现或学术进展更新。</li>
  <li><strong>不支持繁体/异体字查询：</strong>输入需使用规范简体字，
      如输入"長安"将无法匹配"长安"。</li>
  <li><strong>无离线地图能力：</strong>本工具仅提供文本对照，不提供地图可视化。
      如需地图展示，请配合《中国历史地图集》原图或 CHGIS（中国历史地理信息系统）使用。</li>
</ol>

<div class="note">
  <strong>如需更深入的研究，推荐参考：</strong>
  <ul style="margin:8px 0 0;">
    <li>《中国历史地图集》（谭其骧 主编）—— 最权威的历史政区地图</li>
    <li>CHGIS（China Historical GIS）—— 复旦大学与哈佛合作的数字历史地理项目</li>
    <li>《读史方舆纪要》（清·顾祖禹）—— 传统历史地理名著</li>
    <li>《中国古今地名大词典》（戴均良 等）—— 现代地名工具书</li>
  </ul>
</div>
`;
