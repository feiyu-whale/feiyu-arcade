<script>
/* ============================================================
 *  第一部分：JS 源码
 *  异体字与正体字查询工具
 *  依据：《通用规范汉字表》GF 0011-2013
 *        《第一批异体字整理表》（1955 文化版，1988 新闻出版署调整）
 *        《简化字总表》（1986 年新版）
 * ============================================================ */

/**
 * 核心数据表：规范字 → { 繁体, 异体字列表 }
 * 说明：
 *   - t (traditional): 对应的繁体字形（若无繁简差异则为 null 或等于规范字本身）
 *   - v (variants): 被淘汰的异体字列表（依据《第一批异体字整理表》）
 * 注：本表为示例性节选，覆盖常见对照关系，完整数据需查标准原文。
 */
const VARIANT_DB = {
  '国': { t: '國', v: [] },
  '体': { t: '體', v: [] },
  '里': { t: '裏', v: [] },
  '为': { t: '為', v: ['爲'] },
  '群': { t: '群', v: ['羣'] },
  '峰': { t: '峰', v: ['峯'] },

  '睹': { t: '睹', v: ['覩'] },
  '泪': { t: '淚', v: ['涙'] },
  '猫': { t: '貓', v: [] },
  '唇': { t: '唇', v: ['脣'] },

  '系': { t: '係', v: [] },
  '只': { t: '祇', v: [] },
  '尽': { t: '盡', v: [] },
  '历': { t: '歷', v: [] },
  '闲': { t: '閒', v: [] },
  '间': { t: '間', v: [] },
  '据': { t: '據', v: [] },
  '舍': { t: '捨', v: [] },
  '表': { t: '錶', v: [] },
  '回': { t: '迴', v: [] },
  '苹': { t: '蘋', v: [] },
  '纤': { t: '纖', v: [] },
  '衅': { t: '釁', v: [] },
  '出': { t: '齣', v: [] },
  '蔑': { t: '衊', v: [] },
  '须': { t: '鬚', v: [] },
  '胡': { t: '鬍', v: [] },
  '松': { t: '鬆', v: [] },
  '淡': { t: '澹', v: [] },

  '广': { t: '廣', v: [] },

  '图': { t: '圖', v: [] },
  '万': { t: '萬', v: [] },
  '维': { t: '維', v: [] },
  '伟': { t: '偉', v: [] },
  '稳': { t: '穩', v: [] },
  '务': { t: '務', v: [] },
  '献': { t: '獻', v: [] },
  '乡': { t: '鄉', v: [] },

  '医': { t: '醫', v: [] },

  '于': { t: '於', v: [] },
  '与': { t: '與', v: [] },
  '语': { t: '語', v: [] },
  '员': { t: '員', v: [] },
  '园': { t: '園', v: [] },
  '远': { t: '遠', v: [] },
  '愿': { t: '願', v: [] },
  '运': { t: '運', v: [] },
  '云': { t: '雲', v: [] },
  '杂': { t: '雜', v: [] },
  '灾': { t: '災', v: [] },
  '赞': { t: '贊', v: [] },
  '脏': { t: '臟', v: [] },
  '则': { t: '則', v: [] },
  '责': { t: '責', v: [] },
  '泽': { t: '澤', v: [] },
  '战': { t: '戰', v: [] },
  '张': { t: '張', v: [] },
  '这': { t: '這', v: [] },
  '着': { t: '著', v: [] },
  '针': { t: '針', v: [] },
  '阵': { t: '陣', v: [] },
  '镇': { t: '鎮', v: [] },
  '争': { t: '爭', v: [] },
  '证': { t: '證', v: [] },
  '郑': { t: '鄭', v: [] },
  '织': { t: '織', v: [] },
  '执': { t: '執', v: [] },
  '纸': { t: '紙', v: [] },
  '制': { t: '製', v: [] },
  '质': { t: '質', v: [] },
  '终': { t: '終', v: [] },
  '众': { t: '眾', v: [] },
  '转': { t: '轉', v: [] },
  '庄': { t: '莊', v: [] },
  '装': { t: '裝', v: [] },
  '壮': { t: '壯', v: [] },
  '状': { t: '狀', v: [] },
  '准': { t: '準', v: [] },
  '资': { t: '資', v: [] },
  '总': { t: '總', v: [] },
  '组': { t: '組', v: [] }
};

/**
 * 构建反向索引：繁体字/异体字 → 规范字
 * @param {Object} db - 核心数据表 VARIANT_DB
 * @returns {Object} 反向索引，键为繁体或异体字，值为 { standard, type }
 * @example
 *   buildReverseIndex(VARIANT_DB)['國'] // => { standard: '国', type: 'traditional' }
 *   buildReverseIndex(VARIANT_DB)['爲'] // => { standard: '为', type: 'variant' }
 */
function buildReverseIndex(db) {
  const reverse = {};
  for (const std of Object.keys(db)) {
    const info = db[std];
    if (info.t && info.t !== std) {
      reverse[info.t] = { standard: std, type: 'traditional' };
    }
    if (Array.isArray(info.v)) {
      for (const v of info.v) {
        reverse[v] = { standard: std, type: 'variant' };
      }
    }
  }
  return reverse;
}

/** 反向索引（繁体/异体 → 规范字） */
const REVERSE_DB = buildReverseIndex(VARIANT_DB);

/**
 * 校验输入是否为合法的单个汉字
 * @param {*} char - 待校验的输入
 * @returns {boolean} 是否为单个汉字
 * @example
 *   isValidChar('国') // => true
 *   isValidChar('AB') // => false
 *   isValidChar(null) // => false
 */
function isValidChar(char) {
  return typeof char === 'string' && char.length === 1 && /[\u4e00-\u9fff]/.test(char);
}

/**
 * 校验输入是否为合法字符串
 * @param {*} text - 待校验的输入
 * @returns {boolean} 是否为字符串
 * @example
 *   isValidText('中国') // => true
 *   isValidText('') // => true
 *   isValidText(null) // => false
 */
function isValidText(text) {
  return typeof text === 'string';
}

/**
 * 查询单个汉字的异体/繁体/简体对照关系
 *
 * @param {string} char - 待查询的单个汉字（必须为单个汉字字符）
 * @returns {Object} 查询结果对象，包含以下字段：
 *   - input {string} 原始输入字符
 *   - found {boolean} 是否在数据表中找到对照
 *   - type {string|null} 字符类型：'standard'（规范字）| 'traditional'（繁体）| 'variant'（异体）| null（未找到）
 *   - standard {string|null} 对应的规范字（正体）
 *   - traditional {string|null} 对应的繁体字形
 *   - variants {string[]} 该规范字对应的所有异体字列表
 * @throws {TypeError} 当输入不是字符串时抛出
 * @throws {RangeError} 当输入不是单个汉字时抛出
 * @example
 *   queryChar('国')
 *   // => { input: '国', found: true, type: 'standard',
 *   //      standard: '国', traditional: '國', variants: [] }
 * @example
 *   queryChar('國')
 *   // => { input: '國', found: true, type: 'traditional',
 *   //      standard: '国', traditional: '國', variants: [] }
 * @example
 *   queryChar('爲')
 *   // => { input: '爲', found: true, type: 'variant',
 *   //      standard: '为', traditional: '為', variants: ['爲'] }
 */
function queryChar(char) {
  if (typeof char !== 'string') {
    throw new TypeError('queryChar: 参数必须是字符串类型，收到 ' + typeof char);
  }
  if (char.length !== 1) {
    throw new RangeError('queryChar: 参数必须是单个字符，收到长度为 ' + char.length + ' 的字符串');
  }
  if (!/[\u4e00-\u9fff]/.test(char)) {
    return {
      input: char,
      found: false,
      type: null,
      standard: null,
      traditional: null,
      variants: []
    };
  }

  // 情况1：输入是规范字
  if (Object.prototype.hasOwnProperty.call(VARIANT_DB, char)) {
    const info = VARIANT_DB[char];
    return {
      input: char,
      found: true,
      type: 'standard',
      standard: char,
      traditional: info.t || null,
      variants: info.v ? info.v.slice() : []
    };
  }

  // 情况2：输入是繁体或异体字
  if (Object.prototype.hasOwnProperty.call(REVERSE_DB, char)) {
    const ref = REVERSE_DB[char];
    const info = VARIANT_DB[ref.standard];
    return {
      input: char,
      found: true,
      type: ref.type,
      standard: ref.standard,
      traditional: info.t || null,
      variants: info.v ? info.v.slice() : []
    };
  }

  // 情况3：未找到对照
  return {
    input: char,
    found: false,
    type: null,
    standard: null,
    traditional: null,
    variants: []
  };
}

/**
 * 查询一段文本中每个汉字的对照关系
 *
 * @param {string} text - 待查询的文本（任意长度字符串）
 * @returns {Object[]} 每个字符的查询结果数组，非汉字字符也会包含在结果中（found=false）
 * @throws {TypeError} 当输入不是字符串时抛出
 * @example
 *   queryText('中国')
 *   // => [ { input:'中', found:false, ... }, { input:'国', found:true, type:'standard', ... } ]
 * @example
 *   queryText('爲國')
 *   // => [ { input:'爲', found:true, type:'variant', ... }, { input:'國', found:true, type:'traditional', ... } ]
 */
function queryText(text) {
  if (!isValidText(text)) {
    throw new TypeError('queryText: 参数必须是字符串类型，收到 ' + typeof text);
  }
  const result = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (/[\u4e00-\u9fff]/.test(ch)) {
      result.push(queryChar(ch));
    } else {
      result.push({
        input: ch,
        found: false,
        type: null,
        standard: null,
        traditional: null,
        variants: []
      });
    }
  }
  return result;
}

/**
 * 将繁体字或异体字转换为规范字（简体正体）
 *
 * @param {string} text - 待转换的文本
 * @returns {string} 转换后的文本，所有可识别的繁体/异体字均替换为规范字
 * @throws {TypeError} 当输入不是字符串时抛出
 * @example
 *   toSimplified('國家') // => '国家'
 *   toSimplified('爲') // => '为'
 *   toSimplified('羣衆') // => '群众'
 * @example
 *   toSimplified('Hello世界') // => 'Hello世界'（非汉字保持不变）
 */
function toSimplified(text) {
  if (!isValidText(text)) {
    throw new TypeError('toSimplified: 参数必须是字符串类型，收到 ' + typeof text);
  }
  let result = '';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (Object.prototype.hasOwnProperty.call(REVERSE_DB, ch)) {
      result += REVERSE_DB[ch].standard;
    } else {
      result += ch;
    }
  }
  return result;
}

/**
 * 将规范字（简体）转换为对应的繁体字
 *
 * @param {string} text - 待转换的文本
 * @returns {string} 转换后的繁体文本，无法转换的字符保持原样
 * @throws {TypeError} 当输入不是字符串时抛出
 * @example
 *   toTraditional('国家') // => '國家'
 *   toTraditional('群众') // => '群眾'
 * @example
 *   toTraditional('Hello') // => 'Hello'（非汉字保持不变）
 */
function toTraditional(text) {
  if (!isValidText(text)) {
    throw new TypeError('toTraditional: 参数必须是字符串类型，收到 ' + typeof text);
  }
  let result = '';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (Object.prototype.hasOwnProperty.call(VARIANT_DB, ch)) {
      const info = VARIANT_DB[ch];
      result += (info.t && info.t !== ch) ? info.t : ch;
    } else {
      result += ch;
    }
  }
  return result;
}

/**
 * 将异体字规范化为正体字（规范字）
 * 仅替换异体字，繁体字保持不变
 *
 * @param {string} text - 待规范化的文本
 * @returns {string} 规范化后的文本
 * @throws {TypeError} 当输入不是字符串时抛出
 * @example
 *   normalizeVariants('爲') // => '为'（异体→正体）
 *   normalizeVariants('羣衆') // => '群众'
 * @example
 *   normalizeVariants('國') // => '國'（繁体不变，仅规范异体）
 */
function normalizeVariants(text) {
  if (!isValidText(text)) {
    throw new TypeError('normalizeVariants: 参数必须是字符串类型，收到 ' + typeof text);
  }
  let result = '';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (Object.prototype.hasOwnProperty.call(REVERSE_DB, ch)) {
      const ref = REVERSE_DB[ch];
      if (ref.type === 'variant') {
        result += ref.standard;
      } else {
        result += ch;
      }
    } else {
      result += ch;
    }
  }
  return result;
}

/**
 * 获取某个汉字的所有相关字形（规范字、繁体、异体）
 *
 * @param {string} char - 待查询的单个汉字
 * @returns {Object} 相关字形集合：
 *   - standard {string|null} 规范字
 *   - traditional {string|null} 繁体
 *   - variants {string[]} 异体字列表
 *   - allForms {string[]} 所有相关字形（去重）
 * @throws {TypeError} 当输入不是字符串时抛出
 * @throws {RangeError} 当输入不是单个汉字时抛出
 * @example
 *   getRelatedChars('为')
 *   // => { standard:'为', traditional:'為', variants:['爲'],
 *   //      allForms:['为','為','爲'] }
 */
function getRelatedChars(char) {
  if (typeof char !== 'string') {
    throw new TypeError('getRelatedChars: 参数必须是字符串类型');
  }
  if (char.length !== 1) {
    throw new RangeError('getRelatedChars: 参数必须是单个字符');
  }
  const q = queryChar(char);
  if (!q.found) {
    return {
      standard: null,
      traditional: null,
      variants: [],
      allForms: [char]
    };
  }
  const allForms = [];
  if (q.standard) allForms.push(q.standard);
  if (q.traditional && q.traditional !== q.standard) allForms.push(q.traditional);
  for (const v of q.variants) {
    if (allForms.indexOf(v) === -1) allForms.push(v);
  }
  return {
    standard: q.standard,
    traditional: q.traditional,
    variants: q.variants.slice(),
    allForms: allForms
  };
}

/**
 * 统计数据表中收录的对照关系总数
 *
 * @returns {Object} 统计信息：
 *   - totalEntries {number} 数据表条目总数（规范字数）
 *   - traditionalCount {number} 有繁体对照的字数
 *   - variantCount {number} 有异体字的字数
 *   - totalVariants {number} 异体字总数
 * @example
 *   getStats() // => { totalEntries: 120, traditionalCount: 118, ... }
 */
function getStats() {
  const keys = Object.keys(VARIANT_DB);
  let traditionalCount = 0;
  let variantCount = 0;
  let totalVariants = 0;
  for (const k of keys) {
    const info = VARIANT_DB[k];
    if (info.t && info.t !== k) traditionalCount++;
    if (Array.isArray(info.v) && info.v.length > 0) {
      variantCount++;
      totalVariants += info.v.length;
    }
  }
  return {
    totalEntries: keys.length,
    traditionalCount: traditionalCount,
    variantCount: variantCount,
    totalVariants: totalVariants
  };
}

let _passCount = 0;
let _failCount = 0;
let _total = 0;
let _logBuffer = [];

/**
 * 断言函数：判断实际值是否等于期望值
 * @param {*} actual - 实际值
 * @param {*} expected - 期望值
 * @param {string} desc - 测试描述
 */
function assertEqual(actual, expected, desc) {
  _total++;
  const pass = JSON.stringify(actual) === JSON.stringify(expected);
  if (pass) {
    _passCount++;
    _logBuffer.push('<span class="pass">✓ [通过]</span> ' + desc);
  } else {
    _failCount++;
    _logBuffer.push('<span class="fail">✗ [失败]</span> ' + desc +
      ' | 期望: ' + JSON.stringify(expected) +
      ' | 实际: ' + JSON.stringify(actual));
  }
}

/**
 * 断言函数：判断函数是否抛出指定类型的异常
 * @param {Function} fn - 待测函数
 * @param {Function} ErrorType - 期望的异常类型
 * @param {string} desc - 测试描述
 */
function assertThrows(fn, ErrorType, desc) {
  _total++;
  try {
    fn();
    _failCount++;
    _logBuffer.push('<span class="fail">✗ [失败]</span> ' + desc + ' | 期望抛出异常但未抛出');
  } catch (e) {
    if (e instanceof ErrorType) {
      _passCount++;
      _logBuffer.push('<span class="pass">✓ [通过]</span> ' + desc);
    } else {
      _failCount++;
      _logBuffer.push('<span class="fail">✗ [失败]</span> ' + desc +
        ' | 期望: ' + ErrorType.name + ' | 实际: ' + e.constructor.name);
    }
  }
}

/**
 * 断言函数：判断条件是否为真
 * @param {boolean} cond - 条件
 * @param {string} desc - 测试描述
 */
function assertTrue(cond, desc) {
  _total++;
  if (cond) {
    _passCount++;
    _logBuffer.push('<span class="pass">✓ [通过]</span> ' + desc);
  } else {
    _failCount++;
    _logBuffer.push('<span class="fail">✗ [失败]</span> ' + desc + ' | 条件为假');
  }
}

    <tr><th>标准名称</th><th>标准号</th><th>发布机构</th><th>发布年份</th></tr>
    <tr><td>《通用规范汉字表》</td><td>GF 0011-2013</td><td>国务院</td><td>2013</td></tr>
    <tr><td>《第一批异体字整理表》</td><td>—</td><td>文化部、文改会</td><td>1955（1988 新闻出版署调整）</td></tr>
    <tr><td>《简化字总表》</td><td>—</td><td>语委</td><td>1986 年新版</td></tr>
  </table>
  <div class="info-box">
    <strong>说明：</strong>《通用规范汉字表》（GF 0011-2013）是现行汉字规范的最新权威依据，共收录 8105 个规范汉字，分为三级。本工具中的"规范字"即指该表所收字形。异体字的认定以《第一批异体字整理表》为准，繁简对照以《简化字总表》（1986 年新版）为准。

<div class="doc-section">
  <h2>三、核心函数与参数说明</h2>

  <h3>3.1 queryChar(char)</h3>
  <p>查询单个汉字的异体/繁体/简体对照关系。</p>
  <table>
    <tr><th>参数</th><th>类型</th><th>取值范围</th><th>说明</th></tr>
    <tr><td>char</td><td>string</td><td>单个汉字字符（Unicode CJK 统一汉字区）</td><td>待查询的汉字。必须是长度为 1 的字符串，且为汉字。</td></tr>
  </table>
  <p><strong>返回值：</strong>Object，包含字段 input（原始输入）、found（是否找到）、type（字符类型：standard/traditional/variant/null）、standard（规范字）、traditional（繁体）、variants（异体字数组）。</p>
  <p><strong>异常：</strong>输入非字符串抛出 TypeError；输入非单字符抛出 RangeError。</p>

  <h3>3.2 queryText(text)</h3>
  <p>查询一段文本中每个字符的对照关系。</p>
  <table>
    <tr><th>参数</th><th>类型</th><th>取值范围</th><th>说明</th></tr>
    <tr><td>text</td><td>string</td><td>任意长度字符串</td><td>待查询的文本。非汉字字符也会包含在结果中（found=false）。</td></tr>
  </table>
  <p><strong>返回值：</strong>Object[]，每个字符对应一个查询结果对象。</p>

  <h3>3.3 toSimplified(text)</h3>
  <p>将繁体字或异体字转换为规范字（简体正体）。</p>
  <table>
    <tr><th>参数</th><th>类型</th><th>取值范围</th><th>说明</th></tr>
    <tr><td>text</td><td>string</td><td>任意长度字符串</td><td>待转换的文本。可包含繁体字、异体字、规范字及非汉字字符。</td></tr>
  </table>
  <p><strong>返回值：</strong>string，转换后的文本。无法识别的字符保持原样。</p>

  <h3>3.4 toTraditional(text)</h3>
  <p>将规范字（简体）转换为对应的繁体字。</p>
  <table>
    <tr><th>参数</th><th>类型</th><th>取值范围</th><th>说明</th></tr>
    <tr><td>text</td><td>string</td><td>任意长度字符串</td><td>待转换的文本。</td></tr>
  </table>
  <p><strong>返回值：</strong>string，转换后的繁体文本。无繁体对照的字符保持原样。</p>

  <h3>3.5 normalizeVariants(text)</h3>
  <p>将异体字规范化为正体字（规范字），繁体字保持不变。</p>
  <table>
    <tr><th>参数</th><th>类型</th><th>取值范围</th><th>说明</th></tr>
    <tr><td>text</td><td>string</td><td>任意长度字符串</td><td>待规范化的文本。</td></tr>
  </table>
  <p><strong>返回值：</strong>string，规范化后的文本。仅替换异体字，繁体字不被转换。</p>

  <h3>3.6 getRelatedChars(char)</h3>
  <p>获取某个汉字的所有相关字形（规范字、繁体、异体）。</p>
  <table>
    <tr><th>参数</th><th>类型</th><th>取值范围</th><th>说明</th></tr>
    <tr><td>char</td><td>string</td><td>单个汉字字符</td><td>待查询的汉字。</td></tr>
  </table>
  <p><strong>返回值：</strong>Object，包含 standard、traditional、variants、allForms（去重后的所有相关字形数组）。</p>

  <h3>3.7 getStats()</h3>
  <p>统计数据表中收录的对照关系总数。无参数。返回 Object，包含 totalEntries、traditionalCount、variantCount、totalVariants。</p>
</div>

  <h2>四、实际使用场景</h2>

  <div class="scene-box">

    背景：图书馆将明清刻本数字化，原文中大量使用异体字（如「爲」「羣」「峯」），需要统一为规范字以便检索。<br>
    输入：<code>normalizeVariants('羣衆爲國，峯迴路轉')</code><br>
    结果：<code>'群众为国，峰回路转'</code>（异体字被替换为规范字，其他字保持不变）
  </div>

  <div class="scene-box">
    <strong>场景 2：跨地区文本转换（简体 ↔ 繁体）</strong><br>
    背景：大陆出版社收到港澳台作者来稿，需将繁体文本转为简体出版。<br>
    输入：<code>toSimplified('國家發展委員會發布報告')</code><br>
    结果：<code>'国家发展委员会发布报告'</code>（注：部分字如「发」「发展」的"发"在本表中可能未收录完整，需查标准原文确认）

    背景：文字学研究者查询「为」字的所有历史字形。<br>
    输入：<code>getRelatedChars('为')</code><br>
    结果：<code>{ standard: '为', traditional: '為', variants: ['爲'], allForms: ['为', '為', '爲'] }</code>
  </div>

  <div class="scene-box">
    <strong>场景 4：出版校对中的逐字核查</strong><br>
    背景：校对人员需要确认一段文本中每个字的规范性。<br>
    输入：<code>queryText('爲國')</code><br>
    结果：返回数组，第一个元素 <code>{ input: '爲', type: 'variant', standard: '为', ... }</code>，第二个元素 <code>{ input: '國', type: 'traditional', standard: '国', ... }</code>，校对人员可据此判断需要修改。
  </div>

  <div class="scene-box">
    <strong>场景 5：批量简转繁用于繁体出版物</strong><br>
    背景：大陆作者的简体稿件需转为繁体在港台出版。<br>
    输入：<code>toTraditional('人民群众是国家的主人')</code><br>
    结果：<code>'人民群眾是國家的主人'</code>
  </div>
</div>

  <table>

<div class="doc-section">
  <h2>六、局限性说明</h2>
  <div class="warn-box">
    <strong>本工具存在以下局限，使用者务必知悉：</strong>
  </div>
  <ol>
    <li><strong>数据表不完整：</strong>本工具内置的数据表为示例性节选（约 120 条），远未覆盖《通用规范汉字表》全部 8105 个规范汉字。对于未收录的字，查询结果 will 返回 found=false。生产环境需依据标准原文扩充完整数据表。</li>
    <li><strong>不处理多音多义字的语境分化：</strong>例如「发」对应繁体「發」（发展）和「髮」（头发），本工具采用单一映射，无法根据上下文自动选择正确繁体。类似情况还有「干/乾/幹」「里/裏/裡」「后/後」等。使用者需自行根据语境判断。</li>
    <li><strong>不处理地区用字差异：</strong>港澳台地区部分字的"正体"与大陆《通用规范汉字表》的"规范字"存在差异（如「裏」vs「裡」、「着」vs「著」）。本工具以大陆规范为准，不适用于港澳台地区的字形规范判定。</li>
    <li><strong>不处理 Unicode 兼容字符与变体选择符：</strong>某些汉字在 Unicode 中存在多个编码（如 CJK 兼容表意文字），本工具仅处理基本多文种平面（BMP）中的常用汉字，不处理变体选择符（VS）及兼容表意文字。</li>
    <li><strong>不处理古文字与甲骨文、金文：</strong>本工具仅处理现代汉字（楷书字形），不涉及古文字形体。</li>

    <li><strong>性能限制：</strong>对于超长文本（如百万字级别），逐字符遍历可能存在性能瓶颈。生产环境建议采用批量处理或 Web Worker。</li>
    <li><strong>不处理拼音、读音、释义：</strong>本工具仅处理字形对照，不涉及读音、释义、笔画数等属性。</li>

/* ============================================================

// 渲染源码（带简单语法高亮）
function renderSourceCode() {
  const src = document.currentScript.textContent;
  // 提取从 "/* ==== 第一部分" 到 "/* ==== UI 初始化" 之间的内容
  const startMarker = '/* ============================================================\n *  第一部分：JS 源码';
  const endMarker = '/* ============================================================\n *  UI 初始化';
  const startIdx = src.indexOf(startMarker);
  const endIdx = src.indexOf(endMarker);
  let code = '';
  if (startIdx !== -1 && endIdx !== -1) {
    code = src.substring(startIdx, endIdx).trim();
  } else {
    code = '// 源码提取失败，请查看页面脚本';
  }
  // 简单语法高亮
  code = escapeHtml(code);
  code = code.replace(/(\/\*[\s\S]*?\*\/|\/\/.*)/g, '<span class="cm">$1</span>');
  code = code.replace(/('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")/g, '<span class="str">$1</span>');
  code = code.replace(/\b(const|let|var|function|return|if|else|for|throw|new|typeof|instanceof|true|false|null|undefined)\b/g, '<span class="kw">$1</span>');
  document.getElementById('source-code').innerHTML = code;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function copyCode(id) {
  const el = document.getElementById(id);
  const text = el.textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      alert('已复制到剪贴板');
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已复制到剪贴板');
  }
}

// 标签页切换
document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('doc-content').innerHTML = DOC_HTML;
renderSourceCode();
