<script>
// ============================================================
// 第一部分：核心算法（纯函数）
// ============================================================

/**
 * 计算三相电机额定电流
 * 公式：I_N = P_N / (√3 × U_N × cosφ × η)
 * 依据：电工学基本公式，参见 GB/T 1032-2012
 *
 * @param {number} powerKW - 额定功率，单位 kW，必须 > 0
 * @param {number} voltageV - 额定线电压，单位 V，必须 > 0
 * @param {number} powerFactor - 功率因数 cosφ，范围 (0, 1]
 * @param {number} efficiency - 效率 η，范围 (0, 1]
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 *   value: 额定电流（A），valid 为 false 时 value 为 NaN
 */
function calcRatedCurrent(powerKW, voltageV, powerFactor, efficiency) {
  if (!isFinite(powerKW) || !isFinite(voltageV) || !isFinite(powerFactor) || !isFinite(efficiency)) {
    return { value: NaN, unit: 'A', valid: false, error: '输入包含非有限数值（NaN 或 Infinity）' };
  }
  if (powerKW <= 0) {
    return { value: NaN, unit: 'A', valid: false, error: '额定功率必须大于 0' };
  }
  if (voltageV <= 0) {
    return { value: NaN, unit: 'A', valid: false, error: '额定电压必须大于 0' };
  }
  if (powerFactor <= 0 || powerFactor > 1) {
    return { value: NaN, unit: 'A', valid: false, error: '功率因数必须在 (0, 1] 范围内' };
  }
  if (efficiency <= 0 || efficiency > 1) {
    return { value: NaN, unit: 'A', valid: false, error: '效率必须在 (0, 1] 范围内' };
  }
  var value = (powerKW * 1000) / (Math.sqrt(3) * voltageV * powerFactor * efficiency);
  return { value: value, unit: 'A', valid: true };
}

/**
 * 计算三相电机直接启动电流
 * 公式：I_st = k_i × I_N
 *
 * @param {number} ratedCurrent - 额定电流（A），必须 > 0
 * @param {number} startCurrentMultiple - 启动电流倍数 k_i，通常 5~7，必须 > 0
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcDirectStartCurrent(ratedCurrent, startCurrentMultiple) {
  if (!isFinite(ratedCurrent) || !isFinite(startCurrentMultiple)) {
    return { value: NaN, unit: 'A', valid: false, error: '输入包含非有限数值' };
  }
  if (ratedCurrent <= 0) {
    return { value: NaN, unit: 'A', valid: false, error: '额定电流必须大于 0' };
  }
  if (startCurrentMultiple <= 0) {
    return { value: NaN, unit: 'A', valid: false, error: '启动电流倍数必须大于 0' };
  }
  var value = ratedCurrent * startCurrentMultiple;
  return { value: value, unit: 'A', valid: true };
}

/**
 * 计算 Y-Δ 降压启动电流
 * Y-Δ 启动时，绕组电压降为 1/√3，线电流降为直接启动的 1/3
 * 公式：I_st_YΔ = I_st_direct / 3
 *
 * @param {number} directStartCurrent - 直接启动电流（A），必须 > 0
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcYDStartCurrent(directStartCurrent) {
  if (!isFinite(directStartCurrent)) {
    return { value: NaN, unit: 'A', valid: false, error: '输入包含非有限数值' };
  }
  if (directStartCurrent <= 0) {
    return { value: NaN, unit: 'A', valid: false, error: '直接启动电流必须大于 0' };
  }
  var value = directStartCurrent / 3;
  return { value: value, unit: 'A', valid: true };
}

/**
 * 计算自耦变压器降压启动电流（电网侧）
 * 抽头比为 a（0 < a < 1），电机端电压 = a × U_N
 * 电机电流 = a × I_st_direct
 * 电网侧电流 = a² × I_st_direct
 *
 * @param {number} directStartCurrent - 直接启动电流（A），必须 > 0
 * @param {number} tapRatio - 自耦变压器抽头电压比 a，范围 (0, 1]
 * @returns {{ motorCurrent: number, gridCurrent: number, unit: string, valid: boolean, error?: string }}
 */
function calcAutoTransformerStartCurrent(directStartCurrent, tapRatio) {
  if (!isFinite(directStartCurrent) || !isFinite(tapRatio)) {
    return { motorCurrent: NaN, gridCurrent: NaN, unit: 'A', valid: false, error: '输入包含非有限数值' };
  }
  if (directStartCurrent <= 0) {
    return { motorCurrent: NaN, gridCurrent: NaN, unit: 'A', valid: false, error: '直接启动电流必须大于 0' };
  }
  if (tapRatio <= 0 || tapRatio > 1) {
    return { motorCurrent: NaN, gridCurrent: NaN, unit: 'A', valid: false, error: '抽头比必须在 (0, 1] 范围内' };
  }
  var motorCurrent = directStartCurrent * tapRatio;
  var gridCurrent = directStartCurrent * tapRatio * tapRatio;
  return { motorCurrent: motorCurrent, gridCurrent: gridCurrent, unit: 'A', valid: true };
}

/**
 * 计算三相电机额定转矩
 * 公式：T_N = 9550 × P_N / n_N
 * 其中 P_N 单位 kW，n_N 单位 r/min，T_N 单位 N·m
 * 常数 9550 ≈ 60 × 1000 / (2π) = 9549.3，工程取 9550
 *
 * @param {number} powerKW - 额定功率（kW），必须 > 0
 * @param {number} speedRPM - 额定转速（r/min），必须 > 0
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcRatedTorque(powerKW, speedRPM) {
  if (!isFinite(powerKW) || !isFinite(speedRPM)) {
    return { value: NaN, unit: 'N·m', valid: false, error: '输入包含非有限数值' };
  }
  if (powerKW <= 0) {
    return { value: NaN, unit: 'N·m', valid: false, error: '额定功率必须大于 0' };
  }
  if (speedRPM <= 0) {
    return { value: NaN, unit: 'N·m', valid: false, error: '额定转速必须大于 0' };
  }
  var value = 9550 * powerKW / speedRPM;
  return { value: value, unit: 'N·m', valid: true };
}

/**
 * 计算直接启动转矩
 * 公式：T_st = k_t × T_N
 *
 * @param {number} ratedTorque - 额定转矩（N·m），必须 > 0
 * @param {number} startTorqueMultiple - 启动转矩倍数 k_t，必须 > 0
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcDirectStartTorque(ratedTorque, startTorqueMultiple) {
  if (!isFinite(ratedTorque) || !isFinite(startTorqueMultiple)) {
    return { value: NaN, unit: 'N·m', valid: false, error: '输入包含非有限数值' };
  }
  if (ratedTorque <= 0) {
    return { value: NaN, unit: 'N·m', valid: false, error: '额定转矩必须大于 0' };
  }
  if (startTorqueMultiple <= 0) {
    return { value: NaN, unit: 'N·m', valid: false, error: '启动转矩倍数必须大于 0' };
  }
  var value = ratedTorque * startTorqueMultiple;
  return { value: value, unit: 'N·m', valid: true };
}

/**
 * 计算 Y-Δ 降压启动转矩
 * 转矩与电压平方成正比，Y 接法绕组电压为 Δ 的 1/√3
 * 因此启动转矩降为直接启动的 (1/√3)² = 1/3
 * 公式：T_st_YΔ = T_st_direct / 3
 *
 * @param {number} directStartTorque - 直接启动转矩（N·m），必须 > 0
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcYDStartTorque(directStartTorque) {
  if (!isFinite(directStartTorque)) {
    return { value: NaN, unit: 'N·m', valid: false, error: '输入包含非有限数值' };
  }
  if (directStartTorque <= 0) {
    return { value: NaN, unit: 'N·m', valid: false, error: '直接启动转矩必须大于 0' };
  }
  var value = directStartTorque / 3;
  return { value: value, unit: 'N·m', valid: true };
}

/**
 * 计算自耦变压器降压启动转矩
 * 转矩与电压平方成正比
 * 公式：T_st_auto = a² × T_st_direct
 *
 * @param {number} directStartTorque - 直接启动转矩（N·m），必须 > 0
 * @param {number} tapRatio - 抽头电压比 a，范围 (0, 1]
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcAutoTransformerStartTorque(directStartTorque, tapRatio) {
  if (!isFinite(directStartTorque) || !isFinite(tapRatio)) {
    return { value: NaN, unit: 'N·m', valid: false, error: '输入包含非有限数值' };
  }
  if (directStartTorque <= 0) {
    return { value: NaN, unit: 'N·m', valid: false, error: '直接启动转矩必须大于 0' };
  }
  if (tapRatio <= 0 || tapRatio > 1) {
    return { value: NaN, unit: 'N·m', valid: false, error: '抽头比必须在 (0, 1] 范围内' };
  }
  var value = directStartTorque * tapRatio * tapRatio;
  return { value: value, unit: 'N·m', valid: true };
}

/**
 * 计算三相电机输入电功率
 * 公式：P_in = √3 × U × I × cosφ
 *
 * @param {number} voltageV - 线电压（V），必须 > 0
 * @param {number} currentA - 线电流（A），必须 > 0
 * @param {number} powerFactor - 功率因数，范围 (0, 1]
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 *   value 单位为 kW
 */
function calcInputPower(voltageV, currentA, powerFactor) {
  if (!isFinite(voltageV) || !isFinite(currentA) || !isFinite(powerFactor)) {
    return { value: NaN, unit: 'kW', valid: false, error: '输入包含非有限数值' };
  }
  if (voltageV <= 0) {
    return { value: NaN, unit: 'kW', valid: false, error: '电压必须大于 0' };
  }
  if (currentA <= 0) {
    return { value: NaN, unit: 'kW', valid: false, error: '电流必须大于 0' };
  }
  if (powerFactor <= 0 || powerFactor > 1) {
    return { value: NaN, unit: 'kW', valid: false, error: '功率因数必须在 (0, 1] 范围内' };
  }
  var value = Math.sqrt(3) * voltageV * currentA * powerFactor / 1000;
  return { value: value, unit: 'kW', valid: true };
}

/**
 * 计算三相电机输出机械功率
 * 公式：P_out = P_in × η = √3 × U × I × cosφ × η
 *
 * @param {number} voltageV - 线电压（V），必须 > 0
 * @param {number} currentA - 线电流（A），必须 > 0
 * @param {number} powerFactor - 功率因数，范围 (0, 1]
 * @param {number} efficiency - 效率，范围 (0, 1]
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 *   value 单位为 kW
 */
function calcOutputPower(voltageV, currentA, powerFactor, efficiency) {
  if (!isFinite(voltageV) || !isFinite(currentA) || !isFinite(powerFactor) || !isFinite(efficiency)) {
    return { value: NaN, unit: 'kW', valid: false, error: '输入包含非有限数值' };
  }
  if (voltageV <= 0) {
    return { value: NaN, unit: 'kW', valid: false, error: '电压必须大于 0' };
  }
  if (currentA <= 0) {
    return { value: NaN, unit: 'kW', valid: false, error: '电流必须大于 0' };
  }
  if (powerFactor <= 0 || powerFactor > 1) {
    return { value: NaN, unit: 'kW', valid: false, error: '功率因数必须在 (0, 1] 范围内' };
  }
  if (efficiency <= 0 || efficiency > 1) {
    return { value: NaN, unit: 'kW', valid: false, error: '效率必须在 (0, 1] 范围内' };
  }
  var value = Math.sqrt(3) * voltageV * currentA * powerFactor * efficiency / 1000;
  return { value: value, unit: 'kW', valid: true };
}

/**
 * 计算同步转速
 * 公式：n_s = 60 × f / p
 *
 * @param {number} frequencyHz - 电源频率（Hz），通常 50 或 60
 * @param {number} polePairs - 极对数，正整数（2极=1, 4极=2, 6极=3, 8极=4）
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcSynchronousSpeed(frequencyHz, polePairs) {
  if (!isFinite(frequencyHz) || !isFinite(polePairs)) {
    return { value: NaN, unit: 'r/min', valid: false, error: '输入包含非有限数值' };
  }
  if (frequencyHz <= 0) {
    return { value: NaN, unit: 'r/min', valid: false, error: '频率必须大于 0' };
  }
  if (polePairs <= 0 || polePairs !== Math.floor(polePairs)) {
    return { value: NaN, unit: 'r/min', valid: false, error: '极对数必须为正整数' };
  }
  var value = 60 * frequencyHz / polePairs;
  return { value: value, unit: 'r/min', valid: true };
}

/**
 * 计算转差率
 * 公式：s = (n_s - n) / n_s
 *
 * @param {number} synchronousSpeed - 同步转速（r/min），必须 > 0
 * @param {number} actualSpeed - 实际转速（r/min），必须 >= 0 且 < 同步转速
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcSlip(synchronousSpeed, actualSpeed) {
  if (!isFinite(synchronousSpeed) || !isFinite(actualSpeed)) {
    return { value: NaN, unit: '', valid: false, error: '输入包含非有限数值' };
  }
  if (synchronousSpeed <= 0) {
    return { value: NaN, unit: '', valid: false, error: '同步转速必须大于 0' };
  }
  if (actualSpeed < 0) {
    return { value: NaN, unit: '', valid: false, error: '实际转速不能为负' };
  }
  if (actualSpeed >= synchronousSpeed) {
    return { value: NaN, unit: '', valid: false, error: '实际转速必须小于同步转速（异步电机）' };
  }
  var value = (synchronousSpeed - actualSpeed) / synchronousSpeed;
  return { value: value, unit: '', valid: true };
}

/**
 * 比较 Y-Δ 启动与直接启动的参数
 *
 * @param {number} ratedCurrent - 额定电流（A）
 * @param {number} startCurrentMultiple - 启动电流倍数
 * @param {number} ratedTorque - 额定转矩（N·m）
 * @param {number} startTorqueMultiple - 启动转矩倍数
 * @returns {{ directStartCurrent: number, ydStartCurrent: number, currentRatio: number,
 *             directStartTorque: number, ydStartTorque: number, torqueRatio: number,
 *             valid: boolean, error?: string }}
 */
function compareYDStart(ratedCurrent, startCurrentMultiple, ratedTorque, startTorqueMultiple) {
  var dsc = calcDirectStartCurrent(ratedCurrent, startCurrentMultiple);
  if (!dsc.valid) return { valid: false, error: dsc.error };
  var ysc = calcYDStartCurrent(dsc.value);
  if (!ysc.valid) return { valid: false, error: ysc.error };
  var dst = calcDirectStartTorque(ratedTorque, startTorqueMultiple);
  if (!dst.valid) return { valid: false, error: dst.error };
  var yst = calcYDStartTorque(dst.value);
  if (!yst.valid) return { valid: false, error: yst.error };
  return {
    directStartCurrent: dsc.value,
    ydStartCurrent: ysc.value,
    currentRatio: ysc.value / dsc.value,
    directStartTorque: dst.value,
    ydStartTorque: yst.value,
    torqueRatio: yst.value / dst.value,
    valid: true
  };
}

function runAllTests() {
  var output = document.getElementById('test-output');
  var passed = 0;
  var total = 0;
  var log = [];

  function assert(condition, testName, detail) {
    total++;
    if (condition) {
      passed++;
      log.push('<span class="test-pass">✓ PASS</span> [' + total + '] ' + testName);
    } else {
      log.push('<span class="test-fail">✗ FAIL</span> [' + total + '] ' + testName + (detail ? ' — ' + detail : ''));
    }
  }

  function approxEqual(a, b, tolerance) {
    if (tolerance === undefined) tolerance = 1e-6;
    return Math.abs(a - b) < tolerance;
  }

  // === calcRatedCurrent 测试 ===

  // 1. 标准 7.5kW 电机
  (function() {
    var r = calcRatedCurrent(7.5, 380, 0.85, 0.88);
    assert(r.valid && approxEqual(r.value, 14.695, 0.01), '额定电流 7.5kW/380V', 'got ' + r.value);
  })();

  // 2. 标准 15kW 电机
  (function() {
    var r = calcRatedCurrent(15, 380, 0.85, 0.90);
    assert(r.valid && approxEqual(r.value, 28.47, 0.1), '额定电流 15kW/380V', 'got ' + r.value);
  })();

  // 3. 小功率 0.75kW
  (function() {
    var r = calcRatedCurrent(0.75, 380, 0.75, 0.75);
    assert(r.valid && approxEqual(r.value, 2.026, 0.01), '额定电流 0.75kW 小功率', 'got ' + r.value);
  })();

  // 4. 大功率 200kW
  (function() {
    var r = calcRatedCurrent(200, 380, 0.90, 0.95);
    assert(r.valid && approxEqual(r.value, 337.6, 0.5), '额定电流 200kW 大功率', 'got ' + r.value);
  })();

  // 5. 660V 电压
  (function() {
    var r = calcRatedCurrent(7.5, 660, 0.85, 0.88);
    assert(r.valid && approxEqual(r.value, 8.484, 0.01), '额定电流 660V 电压', 'got ' + r.value);
  })();

  // 6. 功率为 0 → 错误
  (function() {
    var r = calcRatedCurrent(0, 380, 0.85, 0.88);
    assert(!r.valid, '额定电流 功率=0 应报错');
  })();

  // 7. 负功率 → 错误
  (function() {
    var r = calcRatedCurrent(-5, 380, 0.85, 0.88);
    assert(!r.valid, '额定电流 负功率 应报错');
  })();

  // 8. 电压为 0 → 错误
  (function() {
    var r = calcRatedCurrent(7.5, 0, 0.85, 0.88);
    assert(!r.valid, '额定电流 电压=0 应报错');
  })();

  // 9. 功率因数 > 1 → 错误
  (function() {
    var r = calcRatedCurrent(7.5, 380, 1.01, 0.88);
    assert(!r.valid, '额定电流 cosφ>1 应报错');
  })();

  // 10. 效率 = 0 → 错误
  (function() {
    var r = calcRatedCurrent(7.5, 380, 0.85, 0);
    assert(!r.valid, '额定电流 η=0 应报错');
  })();

  // 11. NaN 输入
  (function() {
    var r = calcRatedCurrent(NaN, 380, 0.85, 0.88);
    assert(!r.valid, '额定电流 NaN 输入 应报错');
  })();

  // 12. Infinity 输入
  (function() {
    var r = calcRatedCurrent(Infinity, 380, 0.85, 0.88);
    assert(!r.valid, '额定电流 Infinity 输入 应报错');
  })();

  // 13. cosφ = 1 边界
  (function() {
    var r = calcRatedCurrent(7.5, 380, 1, 0.88);
    assert(r.valid, '额定电流 cosφ=1 边界值应有效');
  })();

  // 14. η = 1 边界
  (function() {
    var r = calcRatedCurrent(7.5, 380, 0.85, 1);
    assert(r.valid, '额定电流 η=1 边界值应有效');
  })();

  // === calcDirectStartCurrent 测试 ===

  // 15. 正常启动电流
  (function() {
    var r = calcDirectStartCurrent(15, 6.5);
    assert(r.valid && approxEqual(r.value, 97.5, 0.01), '直接启动电流 15A×6.5', 'got ' + r.value);
  })();

  // 16. 启动倍数 = 5
  (function() {
    var r = calcDirectStartCurrent(10, 5);
    assert(r.valid && approxEqual(r.value, 50, 0.01), '直接启动电流 10A×5');
  })();

  // 17. 负额定电流 → 错误
  (function() {
    var r = calcDirectStartCurrent(-10, 6);
    assert(!r.valid, '直接启动电流 负额定电流 应报错');
  })();

  // === calcYDStartCurrent 测试 ===

  // 18. Y-Δ 启动电流 = 直接启动 / 3
  (function() {
    var r = calcYDStartCurrent(97.5);
    assert(r.valid && approxEqual(r.value, 32.5, 0.01), 'Y-Δ启动电流 97.5/3', 'got ' + r.value);
  })();

  // 19. Y-Δ 负值 → 错误
  (function() {
    var r = calcYDStartCurrent(-50);
    assert(!r.valid, 'Y-Δ启动电流 负值 应报错');
  })();

  // === calcAutoTransformerStartCurrent 测试 ===

  // 20. 自耦 0.8 抽头
  (function() {
    var r = calcAutoTransformerStartCurrent(100, 0.8);

      '自耦启动 a=0.8', 'motor=' + r.motorCurrent + ' grid=' + r.gridCurrent);
  })();

  // 21. 自耦 a=1 等于直接启动
  (function() {
    var r = calcAutoTransformerStartCurrent(100, 1);
    assert(r.valid && approxEqual(r.gridCurrent, 100, 0.01), '自耦启动 a=1 等于直接');
  })();

  // 22. 自耦 a>1 → 错误
  (function() {
    var r = calcAutoTransformerStartCurrent(100, 1.1);
    assert(!r.valid, '自耦启动 a>1 应报错');
  })();

  // === calcRatedTorque 测试 ===

  // 23. 7.5kW 1460rpm
  (function() {
    var r = calcRatedTorque(7.5, 1460);
    assert(r.valid && approxEqual(r.value, 48.87, 0.1), '额定转矩 7.5kW/1460rpm', 'got ' + r.value);
  })();

  // 24. 15kW 1460rpm
  (function() {
    var r = calcRatedTorque(15, 1460);
    assert(r.valid && approxEqual(r.value, 97.77, 0.1), '额定转矩 15kW/1460rpm', 'got ' + r.value);
  })();

  // 25. 高转速 2950rpm
  (function() {
    var r = calcRatedTorque(7.5, 2950);
    assert(r.valid && approxEqual(r.value, 24.27, 0.1), '额定转矩 7.5kW/2950rpm 2极', 'got ' + r.value);
  })();

  // 26. 转速 = 0 → 错误
  (function() {
    var r = calcRatedTorque(7.5, 0);
    assert(!r.valid, '额定转矩 转速=0 应报错');
  })();

  // === calcDirectStartTorque 测试 ===

  // 27. 正常启动转矩
  (function() {
    var r = calcDirectStartTorque(48.87, 2.0);
    assert(r.valid && approxEqual(r.value, 97.74, 0.01), '直接启动转矩 48.87×2');
  })();

  // === calcYDStartTorque 测试 ===

  // 28. Y-Δ 启动转矩 = 直接 / 3
  (function() {
    var r = calcYDStartTorque(97.74);
    assert(r.valid && approxEqual(r.value, 32.58, 0.01), 'Y-Δ启动转矩 97.74/3', 'got ' + r.value);
  })();

  // === calcAutoTransformerStartTorque 测试 ===

  // 29. 自耦启动转矩 a=0.8
  (function() {
    var r = calcAutoTransformerStartTorque(100, 0.8);
    assert(r.valid && approxEqual(r.value, 64, 0.01), '自耦启动转矩 a=0.8 → a²=0.64', 'got ' + r.value);
  })();

  // === calcInputPower 测试 ===

  // 30. 输入功率
  (function() {
    var r = calcInputPower(380, 15, 0.85);
    assert(r.valid && approxEqual(r.value, 8.393, 0.01), '输入功率 380V/15A/cos0.85', 'got ' + r.value);
  })();

  // 31. 输入功率 cosφ=0 → 错误
  (function() {
    var r = calcInputPower(380, 15, 0);
    assert(!r.valid, '输入功率 cosφ=0 应报错');
  })();

  // === calcOutputPower 测试 ===

  // 32. 输出功率
  (function() {
    var r = calcOutputPower(380, 15, 0.85, 0.90);
    assert(r.valid && approxEqual(r.value, 7.554, 0.01), '输出功率 380V/15A/cos0.85/η0.9', 'got ' + r.value);
  })();

  // === calcSynchronousSpeed 测试 ===

  // 33. 50Hz 2极
  (function() {
    var r = calcSynchronousSpeed(50, 1);
    assert(r.valid && r.value === 3000, '同步转速 50Hz/2极=3000');
  })();

  // 34. 50Hz 4极
  (function() {
    var r = calcSynchronousSpeed(50, 2);
    assert(r.valid && r.value === 1500, '同步转速 50Hz/4极=1500');
  })();

  // 35. 60Hz 4极
  (function() {
    var r = calcSynchronousSpeed(60, 2);
    assert(r.valid && r.value === 1800, '同步转速 60Hz/4极=1800');
  })();

  // 36. 极对数非整数 → 错误
  (function() {
    var r = calcSynchronousSpeed(50, 1.5);
    assert(!r.valid, '同步转速 极对数非整数 应报错');
  })();

  // === calcSlip 测试 ===

  // 37. 转差率
  (function() {
    var r = calcSlip(1500, 1460);
    assert(r.valid && approxEqual(r.value, 0.02667, 0.001), '转差率 1500→1460', 'got ' + r.value);
  })();

  // 38. 转速=同步 → 错误
  (function() {
    var r = calcSlip(1500, 1500);
    assert(!r.valid, '转差率 转速=同步 应报错');
  })();

  // === compareYDStart 测试 ===

  // 39. 完整 Y-Δ 对比
  (function() {
    var r = compareYDStart(15, 6.5, 48.87, 2.0);
    assert(r.valid &&
      approxEqual(r.directStartCurrent, 97.5, 0.1) &&
      approxEqual(r.ydStartCurrent, 32.5, 0.1) &&
      approxEqual(r.currentRatio, 1/3, 0.001) &&
      approxEqual(r.torqueRatio, 1/3, 0.001),
      'Y-Δ完整对比 电流比=1/3 转矩比=1/3',
      'I_d=' + r.directStartCurrent + ' I_y=' + r.ydStartCurrent);
  })();

  // 40. 精度测试：大数运算
  (function() {
    var r = calcRatedCurrent(500, 380, 0.89, 0.95);
    assert(r.valid && r.value > 0 && isFinite(r.value), '大数精度 500kW 结果有限', 'got ' + r.value);
  })();

  // 41. 精度测试：极小功率
  (function() {
    var r = calcRatedCurrent(0.001, 380, 0.8, 0.7);
    assert(r.valid && approxEqual(r.value, 0.003066, 0.0001), '极小功率 0.001kW', 'got ' + r.value);
  })();

  // 42. 浮点精度：√3 相关
  (function() {
    var r = calcRatedCurrent(1, 380, 1, 1);
    var expected = 1000 / (Math.sqrt(3) * 380);
    assert(r.valid && approxEqual(r.value, expected, 1e-10), '浮点精度 √3 验证', 'got ' + r.value + ' expected ' + expected);
  })();

  // === 输出结果 ===
  log.push('');
  log.push('<span class="test-summary">通过 ' + passed + ' / 共 ' + total + '</span>');
  if (passed === total) {
    log.push('<span class="test-pass">全部通过 ✓</span>');
  } else {
    log.push('<span class="test-fail">有 ' + (total - passed) + ' 项未通过 ✗</span>');
  }
  output.innerHTML = log.join('\n');
}

<p>运维人员用钳形表测得运行电流为 16A，铭牌额定电流为 14.7A。输入铭牌参数计算额定电流进行对比，判断电机是否过载。若实测值持续超过额定值 10% 以上，需排查原因（负载过大、电压偏低、缺相、轴承问题等）。</p>

<h3>场景 4：自耦变压器降压启动参数选择</h3>
<p>一台 75kW 电机，直接启动电流约 850A，电网不允许。选用自耦变压器 80% 抽头启动：电网侧启动电流 = 850 × 0.8² = 544A，电机端电流 = 850 × 0.8 = 680A。启动转矩 = 直接启动转矩 × 0.64。需确认此转矩能否克服负载静摩擦。</p>

<h3>场景 5：教学演示——理解 Y-Δ 启动原理</h3>
<p>教学中需要直观展示 Y-Δ 启动为什么电流降为 1/3、转矩也降为 1/3。本工具可以输入不同参数，实时看到对比结果，帮助学生理解电压降低对电流和转矩的影响关系。</p>

<h3>场景 6：多电机系统总电流估算</h3>
<p>配电设计时，需要估算多台电机的总运行电流。逐台输入参数计算额定电流后求和（需考虑同时系数和负载率），为电缆截面和变压器容量选择提供依据。</p>
</div>

<div class="manual-section">
<h2>四、常见错误</h2>

<h3>错误 1：混淆输入功率与输出功率</h3>
<p>铭牌上的功率是输出机械功率，不是输入电功率。如果误将输出功率当作输入功率代入 P=√3UIcosφ 反算电流，结果会偏小（少了效率因子）。正确公式：I = P_out / (√3 × U × cosφ × η)。</p>

<h3>错误 2：Y-Δ 启动适用性判断错误</h3>
<p>Y-Δ 启动只适用于正常运行时定子绕组为 Δ 接法的电机。如果电机铭牌标注接法为 Y（星形），则不能使用 Y-Δ 启动。另外，Y-Δ 启动转矩只有直接的 1/3，不适用于重载启动场合。</p>

<h3>错误 3：功率因数取值不当</h3>
<p>功率因数不是固定值，随负载变化。空载时可能低至 0.2~0.3，额定负载时才接近铭牌值。计算额定电流时用铭牌值是正确的，但估算轻载电流时不能直接用铭牌 cosφ。</p>

<h3>错误 4：忽略电压偏差</h3>
<p>实际电网电压可能偏离额定值 ±5% 甚至更多（GB/T 12325 规定 35kV 及以下供电电压偏差不超过标称电压的 ±7%，具体需查标准原文）。电压偏低时电流会增大，电压偏高时空载电流增大。本工具按额定电压计算，不考虑电压偏差。</p>

<h3>错误 5：启动倍数照搬经验值</h3>
<p>不同型号、不同极数、不同厂家的电机，启动电流倍数和启动转矩倍数差异较大。不能简单取 6.5 或 2.0，应以电机铭牌数据或出厂试验报告为准。</p>
</div>

<div class="manual-section">
<h2>五、精度与误差说明</h2>

<div class="warn-box">
<strong>重要声明：</strong>现实世界中的电机参数是连续变化的，受温度、饱和、谐波、老化等多种因素影响。本工具基于理想化数学模型计算，<strong>不承诺绝对精确</strong>，结果仅供工程参考。
</div>

<h3>5.1 算准了什么</h3>
<ul>
<li><strong>数学公式本身是准确的</strong>：三相功率公式 P = √3 × U × I × cosφ、转矩公式 T = 9550 × P/n、Y-Δ 启动的 1/3 关系等，这些都是电工学基本定理的推导结果，数学上没有误差。</li>
<li><strong>浮点运算精度</strong>：JavaScript 使用 IEEE 754 双精度浮点数，有效数字约 15~17 位。对于本工具的输入输出范围，浮点舍入误差远小于工程允许误差，可以忽略。</li>
</ul>

<h3>5.2 哪些因素没算进去</h3>
<ul>
<li><strong>温度影响</strong>：绕组电阻随温度变化（铜绕组温度每升高 1°C，电阻增加约 0.393%），影响铜损和效率，但本工具不考虑温升。</li>
<li><strong>磁路饱和</strong>：实际电机磁路存在饱和效应，启动瞬间电流波形非正弦，含有谐波分量。本工具按正弦稳态计算。</li>
<li><strong>电压波形畸变</strong>：变频器供电或电网谐波会导致电压/电流波形畸变，实际有效值与正弦波假设有偏差。</li>
<li><strong>负载波动</strong>：实际负载不是恒定值，电流随负载实时变化。本工具计算的是额定工况下的理论值。</li>
<li><strong>制造公差</strong>：同一型号不同个体之间存在制造差异，实际参数可能偏离铭牌值。</li>
<li><strong>电缆压降</strong>：从变压器到电机的电缆存在压降，电机端电压可能低于标称值。本工具按铭牌额定电压计算。</li>
<li><strong>频率偏差</strong>：电网频率可能偏离 50Hz（GB/T 15945 规定正常允许偏差 ±0.2Hz，具体需查标准原文），影响同步转速和电机特性。</li>
</ul>

<h3>5.3 误差大概多大</h3>
<ul>
<li><strong>额定电流计算</strong>：如果输入的 cosφ 和 η 准确（来自铭牌或试验报告），计算结果与实际额定电流的偏差通常在 <strong>±3%~5%</strong> 以内。如果 cosφ 和 η 是估算值，偏差可能达到 <strong>±10%</strong> 或更大。</li>
<li><strong>启动电流计算</strong>：启动电流倍数本身就有较大分散性（同一型号电机可能 ±15%），加上启动瞬间的暂态过程，实际峰值启动电流与计算值的偏差可能达到 <strong>±20%</strong>。</li>
<li><strong>转矩计算</strong>：T = 9550 × P/n 的常数 9550 是 60000/(2π) 的工程近似（精确值 9549.296...），引入的误差约 0.007%，可忽略。但启动转矩倍数的分散性同样导致启动转矩估算偏差 <strong>±15%~25%</strong>。</li>
<li><strong>Y-Δ 的 1/3 关系</strong>：理论上严格成立（基于正弦稳态、线性磁路假设），实际因饱和效应，Y 接法时磁路饱和程度不同，实际比值可能在 <strong>0.30~0.36</strong> 之间浮动。</li>
</ul>

<div class="info-box">
<strong>建议：</strong>对于关键工程设计，计算结果应作为初步参考，最终参数应以电机出厂试验报告、现场实测数据为准。选型时应留有适当裕量。
</div>
</div>

<div class="manual-section">
<h2>六、数据依据与参考标准</h2>
<p>本工具涉及的公式和参数范围参考以下标准和技术资料：</p>
<ul>
<li><strong>GB/T 1032-2012</strong>《三相异步电动机试验方法》——规定了电机试验方法和参数测定方法。</li>
<li><strong>GB 18613-2020</strong>《电动机能效限定值及能效等级》——规定了中小型三相异步电动机的能效等级和限定值。</li>
<li><strong>GB/T 12325-2008</strong>《电能质量 供电电压偏差》——规定了供电电压允许偏差。</li>
<li><strong>GB/T 15945-2008</strong>《电能质量 电力系统频率偏差》——规定了频率允许偏差。</li>
<li><strong>GB/T 4772</strong> 系列《旋转电机尺寸和输出功率等级》——规定了电机功率等级。</li>
<li>《电机学》（高等教育出版社）等教材中的基本电磁关系和等效电路理论。</li>
</ul>
<div class="warn-box">
<strong>注意：</strong>上述标准的具体数值、表格、限值等，请以最新发布的标准原文为准。本说明书中引用的数值范围仅为帮助理解的近似描述，不作为合规依据。
</div>
</div>

<div class="manual-section">
<h2>七、局限性</h2>
<ul>
<li><strong>仅适用于三相交流异步电动机</strong>：不适用于直流电机、单相电机、同步电机、永磁电机等特殊类型。</li>
<li><strong>仅计算稳态额定工况</strong>：不计算暂态过程（如启动过程中的电流衰减曲线、加速时间等）。</li>
<li><strong>不考虑变频器供电</strong>：变频运行时电机参数（等效电路参数、损耗分布）与工频正弦供电有显著差异，本工具不适用。</li>
<li><strong>不考虑软启动器</strong>：软启动器通过晶闸管调压启动，电流和转矩特性与 Y-Δ 或自耦启动不同，本工具不涵盖。</li>
<li><strong>不做保护整定计算</strong>：计算出的电流值不能直接作为保护定值，保护整定需考虑启动时间、过载特性、配合关系等因素，应参照相关规程。</li>
<li><strong>不做短路电流计算</strong>：本工具计算的启动电流是电机从静止到额定转速过程中的电流，不是短路电流。短路电流计算需考虑系统阻抗。</li>
<li><strong>不替代专业软件</strong>：对于复杂工程（如大型电机启动对电网的冲击分析、多电机协调启动等），应使用 ETAP、DIgSILENT 等专业电力系统分析软件。</li>
</ul>
</div>

<div class="manual-section">
<h2>八、公式汇总</h2>
<table class="compare-table">
<tr><th>计算项</th><th>公式</th><th>说明</th></tr>
<tr><td>额定电流</td><td>I<sub>N</sub> = P<sub>N</sub> / (√3 × U<sub>N</sub> × cosφ × η)</td><td>P<sub>N</sub> 单位 kW，U<sub>N</sub> 单位 V</td></tr>
<tr><td>直接启动电流</td><td>I<sub>st</sub> = k<sub>i</sub> × I<sub>N</sub></td><td>k<sub>i</sub> 为启动电流倍数</td></tr>

<tr><td>直接启动转矩</td><td>T<sub>st</sub> = k<sub>t</sub> × T<sub>N</sub></td><td>k<sub>t</sub> 为启动转矩倍数</td></tr>
<tr><td>Y-Δ 启动转矩</td><td>T<sub>st(YΔ)</sub> = T<sub>st</sub> / 3</td><td>转矩降为直接启动的 1/3</td></tr>
<tr><td>自耦启动转矩</td><td>T<sub>st(auto)</sub> = a² × T<sub>st</sub></td><td>转矩与电压平方成正比</td></tr>

<tr><td>转差率</td><td>s = (n<sub>s</sub> - n) / n<sub>s</sub></td><td>n 为实际转速</td></tr>

</div>
`;

  document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });

function calculate() {
  var power = parseFloat(document.getElementById('inp-power').value);
  var voltage = parseFloat(document.getElementById('inp-voltage').value);
  var pf = parseFloat(document.getElementById('inp-pf').value);
  var eff = parseFloat(document.getElementById('inp-eff').value);
  var speed = parseFloat(document.getElementById('inp-speed').value);
  var ki = parseFloat(document.getElementById('inp-ki').value);
  var kt = parseFloat(document.getElementById('inp-kt').value);
  var method = document.getElementById('inp-start-method').value;
  var autoRatio = parseFloat(document.getElementById('inp-auto-ratio').value);

  var area = document.getElementById('result-area');
  var errors = [];

  // 额定电流
  var ratedI = calcRatedCurrent(power, voltage, pf, eff);
  if (!ratedI.valid) errors.push('额定电流：' + ratedI.error);

  // 额定转矩
  var ratedT = calcRatedTorque(power, speed);
  if (!ratedT.valid) errors.push('额定转矩：' + ratedT.error);

  // 输入功率
  var inputP = ratedI.valid ? calcInputPower(voltage, ratedI.value, pf) : { valid: false };
  // 输出功率验证
  var outputP = ratedI.valid ? calcOutputPower(voltage, ratedI.value, pf, eff) : { valid: false };

  if (errors.length > 0) {
    area.innerHTML = '<div class="error-msg"><strong>输入错误：</strong><br>' + errors.join('<br>') + '</div>';
    return;
  }

  var html = '';

  // 基本参数
  html += '<div class="result-box"><h3>📊 基本参数</h3>';
  html += resultItem('额定电流 I<sub>N</sub>', ratedI.value.toFixed(2) + ' A');
  html += resultItem('额定转矩 T<sub>N</sub>', ratedT.value.toFixed(2) + ' N·m');
  html += resultItem('输入电功率 P<sub>in</sub>', inputP.value.toFixed(3) + ' kW');
  html += resultItem('输出机械功率 P<sub>out</sub>', outputP.value.toFixed(3) + ' kW');
  html += '</div>';

  // 启动参数
  var directI = calcDirectStartCurrent(ratedI.value, ki);
  var directT = calcDirectStartTorque(ratedT.value, kt);

  html += '<div class="result-box"><h3>⚡ 直接启动参数</h3>';
  html += resultItem('直接启动电流 I<sub>st</sub>', directI.value.toFixed(2) + ' A');
  html += resultItem('直接启动转矩 T<sub>st</sub>', directT.value.toFixed(2) + ' N·m');
  html += '</div>';

  // 降压启动对比
  html += '<div class="result-box"><h3>🔄 启动方式对比</h3>';
  html += '<table class="compare-table">';
  html += '<tr><th>参数</th><th>直接启动</th>';

  if (method === 'yd') {
    var ydI = calcYDStartCurrent(directI.value);
    var ydT = calcYDStartTorque(directT.value);
    html += '<th>Y-Δ 启动</th><th>比值</th></tr>';
    html += '<tr><td>启动电流</td><td>' + directI.value.toFixed(2) + ' A</td><td>' + ydI.value.toFixed(2) + ' A</td><td>' + (ydI.value / directI.value).toFixed(4) + '</td></tr>';
    html += '<tr><td>启动转矩</td><td>' + directT.value.toFixed(2) + ' N·m</td><td>' + ydT.value.toFixed(2) + ' N·m</td><td>' + (ydT.value / directT.value).toFixed(4) + '</td></tr>';
  } else if (method === 'auto') {
    var autoI = calcAutoTransformerStartCurrent(directI.value, autoRatio);
    var autoT = calcAutoTransformerStartTorque(directT.value, autoRatio);
    html += '<th>自耦启动 (a=' + autoRatio + ')</th><th>比值</th></tr>';
    html += '<tr><td>启动电流（电网侧）</td><td>' + directI.value.toFixed(2) + ' A</td><td>' + autoI.gridCurrent.toFixed(2) + ' A</td><td>' + (autoI.gridCurrent / directI.value).toFixed(4) + '</td></tr>';
    html += '<tr><td>启动电流（电机端）</td><td>' + directI.value.toFixed(2) + ' A</td><td>' + autoI.motorCurrent.toFixed(2) + ' A</td><td>' + (autoI.motorCurrent / directI.value).toFixed(4) + '</td></tr>';
    html += '<tr><td>启动转矩</td><td>' + directT.value.toFixed(2) + ' N·m</td><td>' + autoT.value.toFixed(2) + ' N·m</td><td>' + (autoT.value / directT.value).toFixed(4) + '</td></tr>';
  } else {
    html += '<th>—</th></tr>';
    html += '<tr><td colspan="3" style="color:#888;">直接启动，无降压</td></tr>';
  }
  html += '</table></div>';

  // 同步转速与转差率
  var polePairs = guessPolePairs(speed);
  if (polePairs > 0) {
    var syncSpeed = calcSynchronousSpeed(50, polePairs);
    var slip = calcSlip(syncSpeed.value, speed);
    html += '<div class="result-box"><h3>🔧 转速参数（50Hz 假设）</h3>';
    html += resultItem('推断极数', (polePairs * 2) + ' 极（极对数 ' + polePairs + '）');
    html += resultItem('同步转速 n<sub>s</sub>', syncSpeed.value + ' r/min');
    html += resultItem('转差率 s', (slip.value * 100).toFixed(2) + '%');
    html += '</div>';
  }

  // 误差提示
  html += '<div class="warn-box" style="margin-top:16px;">';
  html += '<strong>⚠ 误差提示：</strong>以上结果基于理想化公式计算，实际值受温度、磁路饱和、电压偏差、制造公差等因素影响，偏差通常在 ±5%~20%。关键工程请以实测数据为准。';
  html += '</div>';

  area.innerHTML = html;
}

function resultItem(label, value) {
  return '<div class="result-item"><span class="result-label">' + label + '</span><span class="result-value">' + value + '</span></div>';
}

function guessPolePairs(speed) {
  var syncSpeeds = [
    { p: 1, ns: 3000 },
    { p: 2, ns: 1500 },
    { p: 3, ns: 1000 },
    { p: 4, ns: 750 },
    { p: 5, ns: 600 },
    { p: 6, ns: 500 }
  ];
  var best = -1;
  var minDiff = Infinity;
  for (var i = 0; i < syncSpeeds.length; i++) {
    var diff = syncSpeeds[i].ns - speed;
    if (diff > 0 && diff < minDiff) {
      minDiff = diff;
      best = syncSpeeds[i].p;
    }
  }
  return best;
}

}

// 显示源码
function renderSource() {
  var sourceText = `/**
 * 计算三相电机额定电流
 * 公式：I_N = P_N / (√3 × U_N × cosφ × η)
 * 依据：电工学基本公式，参见 GB/T 1032-2012
 *
 * @param {number} powerKW - 额定功率，单位 kW，必须 > 0
 * @param {number} voltageV - 额定线电压，单位 V，必须 > 0
 * @param {number} powerFactor - 功率因数 cosφ，范围 (0, 1]
 * @param {number} efficiency - 效率 η，范围 (0, 1]
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcRatedCurrent(powerKW, voltageV, powerFactor, efficiency) {
  if (!isFinite(powerKW) || !isFinite(voltageV) || !isFinite(powerFactor) || !isFinite(efficiency)) {
    return { value: NaN, unit: 'A', valid: false, error: '输入包含非有限数值（NaN 或 Infinity）' };
  }
  if (powerKW <= 0) return { value: NaN, unit: 'A', valid: false, error: '额定功率必须大于 0' };
  if (voltageV <= 0) return { value: NaN, unit: 'A', valid: false, error: '额定电压必须大于 0' };
  if (powerFactor <= 0 || powerFactor > 1) return { value: NaN, unit: 'A', valid: false, error: '功率因数必须在 (0, 1] 范围内' };
  if (efficiency <= 0 || efficiency > 1) return { value: NaN, unit: 'A', valid: false, error: '效率必须在 (0, 1] 范围内' };
  var value = (powerKW * 1000) / (Math.sqrt(3) * voltageV * powerFactor * efficiency);
  return { value: value, unit: 'A', valid: true };
}

/**
 * 计算三相电机直接启动电流
 * 公式：I_st = k_i × I_N
 * @param {number} ratedCurrent - 额定电流（A），必须 > 0
 * @param {number} startCurrentMultiple - 启动电流倍数 k_i，通常 5~7，必须 > 0
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcDirectStartCurrent(ratedCurrent, startCurrentMultiple) {
  if (!isFinite(ratedCurrent) || !isFinite(startCurrentMultiple))
    return { value: NaN, unit: 'A', valid: false, error: '输入包含非有限数值' };
  if (ratedCurrent <= 0) return { value: NaN, unit: 'A', valid: false, error: '额定电流必须大于 0' };
  if (startCurrentMultiple <= 0) return { value: NaN, unit: 'A', valid: false, error: '启动电流倍数必须大于 0' };
  return { value: ratedCurrent * startCurrentMultiple, unit: 'A', valid: true };
}

/**
 * 计算 Y-Δ 降压启动电流
 * Y-Δ 启动时线电流降为直接启动的 1/3
 * @param {number} directStartCurrent - 直接启动电流（A），必须 > 0
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcYDStartCurrent(directStartCurrent) {
  if (!isFinite(directStartCurrent))
    return { value: NaN, unit: 'A', valid: false, error: '输入包含非有限数值' };
  if (directStartCurrent <= 0) return { value: NaN, unit: 'A', valid: false, error: '直接启动电流必须大于 0' };
  return { value: directStartCurrent / 3, unit: 'A', valid: true };
}

/**
 * 计算自耦变压器降压启动电流
 * 电机电流 = a × I_st_direct，电网侧电流 = a² × I_st_direct
 * @param {number} directStartCurrent - 直接启动电流（A），必须 > 0
 * @param {number} tapRatio - 抽头电压比 a，范围 (0, 1]
 * @returns {{ motorCurrent: number, gridCurrent: number, unit: string, valid: boolean, error?: string }}
 */
function calcAutoTransformerStartCurrent(directStartCurrent, tapRatio) {
  if (!isFinite(directStartCurrent) || !isFinite(tapRatio))
    return { motorCurrent: NaN, gridCurrent: NaN, unit: 'A', valid: false, error: '输入包含非有限数值' };
  if (directStartCurrent <= 0) return { motorCurrent: NaN, gridCurrent: NaN, unit: 'A', valid: false, error: '直接启动电流必须大于 0' };
  if (tapRatio <= 0 || tapRatio > 1) return { motorCurrent: NaN, gridCurrent: NaN, unit: 'A', valid: false, error: '抽头比必须在 (0, 1] 范围内' };
  return {
    motorCurrent: directStartCurrent * tapRatio,
    gridCurrent: directStartCurrent * tapRatio * tapRatio,
    unit: 'A', valid: true
  };
}

/**
 * 计算三相电机额定转矩
 * 公式：T_N = 9550 × P_N / n_N（P_N 单位 kW，n_N 单位 r/min）
 * @param {number} powerKW - 额定功率（kW），必须 > 0
 * @param {number} speedRPM - 额定转速（r/min），必须 > 0
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcRatedTorque(powerKW, speedRPM) {
  if (!isFinite(powerKW) || !isFinite(speedRPM))
    return { value: NaN, unit: 'N·m', valid: false, error: '输入包含非有限数值' };
  if (powerKW <= 0) return { value: NaN, unit: 'N·m', valid: false, error: '额定功率必须大于 0' };
  if (speedRPM <= 0) return { value: NaN, unit: 'N·m', valid: false, error: '额定转速必须大于 0' };
  return { value: 9550 * powerKW / speedRPM, unit: 'N·m', valid: true };
}

/**
 * 计算直接启动转矩
 * @param {number} ratedTorque - 额定转矩（N·m），必须 > 0
 * @param {number} startTorqueMultiple - 启动转矩倍数 k_t，必须 > 0
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcDirectStartTorque(ratedTorque, startTorqueMultiple) {
  if (!isFinite(ratedTorque) || !isFinite(startTorqueMultiple))
    return { value: NaN, unit: 'N·m', valid: false, error: '输入包含非有限数值' };
  if (ratedTorque <= 0) return { value: NaN, unit: 'N·m', valid: false, error: '额定转矩必须大于 0' };
  if (startTorqueMultiple <= 0) return { value: NaN, unit: 'N·m', valid: false, error: '启动转矩倍数必须大于 0' };
  return { value: ratedTorque * startTorqueMultiple, unit: 'N·m', valid: true };
}

/**
 * 计算 Y-Δ 降压启动转矩（降为直接启动的 1/3）
 * @param {number} directStartTorque - 直接启动转矩（N·m），必须 > 0
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcYDStartTorque(directStartTorque) {
  if (!isFinite(directStartTorque))
    return { value: NaN, unit: 'N·m', valid: false, error: '输入包含非有限数值' };
  if (directStartTorque <= 0) return { value: NaN, unit: 'N·m', valid: false, error: '直接启动转矩必须大于 0' };
  return { value: directStartTorque / 3, unit: 'N·m', valid: true };
}

/**
 * 计算自耦变压器降压启动转矩
 * 公式：T_st_auto = a² × T_st_direct
 * @param {number} directStartTorque - 直接启动转矩（N·m），必须 > 0
 * @param {number} tapRatio - 抽头电压比 a，范围 (0, 1]
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcAutoTransformerStartTorque(directStartTorque, tapRatio) {
  if (!isFinite(directStartTorque) || !isFinite(tapRatio))
    return { value: NaN, unit: 'N·m', valid: false, error: '输入包含非有限数值' };
  if (directStartTorque <= 0) return { value: NaN, unit: 'N·m', valid: false, error: '直接启动转矩必须大于 0' };
  if (tapRatio <= 0 || tapRatio > 1) return { value: NaN, unit: 'N·m', valid: false, error: '抽头比必须在 (0, 1] 范围内' };
  return { value: directStartTorque * tapRatio * tapRatio, unit: 'N·m', valid: true };
}

/**
 * 计算三相电机输入电功率
 * 公式：P_in = √3 × U × I × cosφ
 * @param {number} voltageV - 线电压（V），必须 > 0
 * @param {number} currentA - 线电流（A），必须 > 0
 * @param {number} powerFactor - 功率因数，范围 (0, 1]
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcInputPower(voltageV, currentA, powerFactor) {
  if (!isFinite(voltageV) || !isFinite(currentA) || !isFinite(powerFactor))
    return { value: NaN, unit: 'kW', valid: false, error: '输入包含非有限数值' };
  if (voltageV <= 0) return { value: NaN, unit: 'kW', valid: false, error: '电压必须大于 0' };
  if (currentA <= 0) return { value: NaN, unit: 'kW', valid: false, error: '电流必须大于 0' };
  if (powerFactor <= 0 || powerFactor > 1) return { value: NaN, unit: 'kW', valid: false, error: '功率因数必须在 (0, 1] 范围内' };
  return { value: Math.sqrt(3) * voltageV * currentA * powerFactor / 1000, unit: 'kW', valid: true };
}

/**
 * 计算三相电机输出机械功率
 * 公式：P_out = √3 × U × I × cosφ × η
 * @param {number} voltageV - 线电压（V），必须 > 0
 * @param {number} currentA - 线电流（A），必须 > 0
 * @param {number} powerFactor - 功率因数，范围 (0, 1]
 * @param {number} efficiency - 效率，范围 (0, 1]
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcOutputPower(voltageV, currentA, powerFactor, efficiency) {
  if (!isFinite(voltageV) || !isFinite(currentA) || !isFinite(powerFactor) || !isFinite(efficiency))
    return { value: NaN, unit: 'kW', valid: false, error: '输入包含非有限数值' };
  if (voltageV <= 0) return { value: NaN, unit: 'kW', valid: false, error: '电压必须大于 0' };
  if (currentA <= 0) return { value: NaN, unit: 'kW', valid: false, error: '电流必须大于 0' };
  if (powerFactor <= 0 || powerFactor > 1) return { value: NaN, unit: 'kW', valid: false, error: '功率因数必须在 (0, 1] 范围内' };
  if (efficiency <= 0 || efficiency > 1) return { value: NaN, unit: 'kW', valid: false, error: '效率必须在 (0, 1] 范围内' };
  return { value: Math.sqrt(3) * voltageV * currentA * powerFactor * efficiency / 1000, unit: 'kW', valid: true };
}

/**
 * 计算同步转速
 * 公式：n_s = 60 × f / p
 * @param {number} frequencyHz - 电源频率（Hz），通常 50 或 60
 * @param {number} polePairs - 极对数，正整数
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcSynchronousSpeed(frequencyHz, polePairs) {
  if (!isFinite(frequencyHz) || !isFinite(polePairs))
    return { value: NaN, unit: 'r/min', valid: false, error: '输入包含非有限数值' };
  if (frequencyHz <= 0) return { value: NaN, unit: 'r/min', valid: false, error: '频率必须大于 0' };
  if (polePairs <= 0 || polePairs !== Math.floor(polePairs))
    return { value: NaN, unit: 'r/min', valid: false, error: '极对数必须为正整数' };
  return { value: 60 * frequencyHz / polePairs, unit: 'r/min', valid: true };
}

/**
 * 计算转差率
 * 公式：s = (n_s - n) / n_s
 * @param {number} synchronousSpeed - 同步转速（r/min），必须 > 0
 * @param {number} actualSpeed - 实际转速（r/min），必须 >= 0 且 < 同步转速
 * @returns {{ value: number, unit: string, valid: boolean, error?: string }}
 */
function calcSlip(synchronousSpeed, actualSpeed) {
  if (!isFinite(synchronousSpeed) || !isFinite(actualSpeed))
    return { value: NaN, unit: '', valid: false, error: '输入包含非有限数值' };
  if (synchronousSpeed <= 0) return { value: NaN, unit: '', valid: false, error: '同步转速必须大于 0' };
  if (actualSpeed < 0) return { value: NaN, unit: '', valid: false, error: '实际转速不能为负' };
  if (actualSpeed >= synchronousSpeed) return { value: NaN, unit: '', valid: false, error: '实际转速必须小于同步转速' };
  return { value: (synchronousSpeed - actualSpeed) / synchronousSpeed, unit: '', valid: true };
}

/**
 * 比较 Y-Δ 启动与直接启动的参数
 * @param {number} ratedCurrent - 额定电流（A）
 * @param {number} startCurrentMultiple - 启动电流倍数
 * @param {number} ratedTorque - 额定转矩（N·m）
 * @param {number} startTorqueMultiple - 启动转矩倍数
 * @returns {{ directStartCurrent: number, ydStartCurrent: number, currentRatio: number,
 *             directStartTorque: number, ydStartTorque: number, torqueRatio: number,
 *             valid: boolean, error?: string }}
 */
function compareYDStart(ratedCurrent, startCurrentMultiple, ratedTorque, startTorqueMultiple) {
  var dsc = calcDirectStartCurrent(ratedCurrent, startCurrentMultiple);
  if (!dsc.valid) return { valid: false, error: dsc.error };
  var ysc = calcYDStartCurrent(dsc.value);
  if (!ysc.valid) return { valid: false, error: ysc.error };
  var dst = calcDirectStartTorque(ratedTorque, startTorqueMultiple);
  if (!dst.valid) return { valid: false, error: dst.error };
  var yst = calcYDStartTorque(dst.value);
  if (!yst.valid) return { valid: false, error: yst.error };
  return {
    directStartCurrent: dsc.value, ydStartCurrent: ysc.value,
    currentRatio: ysc.value / dsc.value,
    directStartTorque: dst.value, ydStartTorque: yst.value,
    torqueRatio: yst.value / dst.value,
    valid: true
  };
}`;
