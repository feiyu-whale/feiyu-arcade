<script>
/* ============================================================
   第一部分：核心算法（纯函数）
   ============================================================ */

/**
 * 根据墙厚获取墙厚系数 K（砖数倍数）
 * 依据：《全国统一建筑工程基础定额》及施工手册常用取值
 * @param {number} wallThickness - 墙厚，单位 mm，必须 > 0
 * @param {number} brickWidth - 砖宽，单位 mm，用于自定义墙厚的近似计算
 * @returns {number} 墙厚系数 K（无量纲）
 * @throws {Error} 输入非法时抛出错误
 */
function getWallThicknessFactor(wallThickness, brickWidth) {
  if (typeof wallThickness !== 'number' || isNaN(wallThickness)) {
    throw new Error('墙厚必须为数字');
  }
  if (wallThickness <= 0) {
    throw new Error('墙厚必须大于 0');
  }
  if (typeof brickWidth !== 'number' || isNaN(brickWidth) || brickWidth <= 0) {
    throw new Error('砖宽必须为大于 0 的数字');
  }
  // 标准墙厚对应 K 值（施工手册常用值）
  const standardMap = {
    60: 0.5,    // 1/4 砖墙
    115: 1,     // 1/2 砖墙
    180: 1.5,   // 3/4 砖墙
    240: 2,     // 1 砖墙
    365: 3,     // 1.5 砖墙
    490: 4      // 2 砖墙
  };
  // 允许 ±2mm 的匹配容差（考虑抹灰等）
  for (const key in standardMap) {
    if (Math.abs(wallThickness - Number(key)) <= 2) {
      return standardMap[key];
    }
  }
  // 自定义墙厚：按砖宽近似
  return wallThickness / brickWidth;
}

/**
 * 校验输入参数的合法性
 * @param {Object} params - 参数对象
 * @param {number} params.wallThickness - 墙厚 mm
 * @param {number} params.brickLength - 砖长 mm
 * @param {number} params.brickWidth - 砖宽 mm
 * @param {number} params.brickHeight - 砖厚 mm
 * @param {number} params.mortarThickness - 灰缝 mm
 * @returns {Object} 校验后的参数（已确保为合法数字）
 * @throws {Error} 参数非法时抛出
 */
function validateParams(params) {
  const required = ['wallThickness', 'brickLength', 'brickWidth', 'brickHeight', 'mortarThickness'];
  const result = {};
  for (const key of required) {
    const v = Number(params[key]);
    if (isNaN(v)) {
      throw new Error(`参数 ${key} 必须为数字`);
    }
    if (v <= 0) {
      throw new Error(`参数 ${key} 必须大于 0`);
    }
    result[key] = v;
  }
  return result;
}

/**
 * 计算每立方米砌体的砖净用量（块/m³）
 * 公式：N = K × 10^9 / [墙厚 × (砖长+灰缝) × (砖厚+灰缝)]
 * 其中 K 为墙厚系数，10^9 为 mm³ 到 m³ 的换算
 * @param {number} wallThickness - 墙厚 mm
 * @param {number} brickLength - 砖长 mm
 * @param {number} brickHeight - 砖厚 mm
 * @param {number} mortarThickness - 灰缝 mm
 * @param {number} K - 墙厚系数
 * @returns {number} 每立方米砖净用量（块/m³）
 */
function calcBricksPerCubicMeter(wallThickness, brickLength, brickHeight, mortarThickness, K) {
  const denominator = wallThickness * (brickLength + mortarThickness) * (brickHeight + mortarThickness);
  return (K * 1e9) / denominator;
}

/**
 * 计算每平米砌体的砖净用量（块/㎡）
 * 公式：N_area = N_volume × 墙厚(m)
 * @param {number} bricksPerCubicMeter - 每立方米砖数
 * @param {number} wallThickness - 墙厚 mm
 * @returns {number} 每平米砖净用量（块/㎡）
 */
function calcBricksPerSquareMeter(bricksPerCubicMeter, wallThickness) {
  return bricksPerCubicMeter * (wallThickness / 1000);
}

/**
 * 计算每立方米砌体的砂浆净用量（m³/m³）
 * 公式：V_mortar = 1 - N × 单砖体积
 * @param {number} bricksPerCubicMeter - 每立方米砖数
 * @param {number} brickLength - 砖长 mm
 * @param {number} brickWidth - 砖宽 mm
 * @param {number} brickHeight - 砖厚 mm
 * @returns {number} 每立方米砂浆净用量（m³/m³）
 */
function calcMortarPerCubicMeter(bricksPerCubicMeter, brickLength, brickWidth, brickHeight) {
  const singleBrickVolume = (brickLength * brickWidth * brickHeight) / 1e9; // m³
  const mortar = 1 - bricksPerCubicMeter * singleBrickVolume;
  return Math.max(0, mortar); // 防止负值
}

/**
 * 计算每平米砌体的砂浆净用量（m³/㎡）
 * @param {number} mortarPerCubicMeter - 每立方米砂浆用量
 * @param {number} wallThickness - 墙厚 mm
 * @returns {number} 每平米砂浆净用量（m³/㎡）
 */
function calcMortarPerSquareMeter(mortarPerCubicMeter, wallThickness) {
  return mortarPerCubicMeter * (wallThickness / 1000);
}

/**
 * 计算考虑损耗后的砖消耗量
 * @param {number} netQuantity - 净用量
 * @param {number} lossRatePercent - 损耗率（%）
 * @returns {number} 消耗量
 */
function calcGrossQuantity(netQuantity, lossRatePercent) {
  if (typeof lossRatePercent !== 'number' || isNaN(lossRatePercent) || lossRatePercent < 0) {
    throw new Error('损耗率必须为非负数字');
  }
  return netQuantity * (1 + lossRatePercent / 100);
}

/**
 * 主计算函数：根据输入参数计算全部指标
 * @param {Object} input - 输入参数
 * @param {number} input.wallThickness - 墙厚 mm
 * @param {number} input.brickLength - 砖长 mm
 * @param {number} input.brickWidth - 砖宽 mm
 * @param {number} input.brickHeight - 砖厚 mm
 * @param {number} input.mortarThickness - 灰缝 mm
 * @param {number} [input.brickLossRate=0] - 砖损耗率 %
 * @param {number} [input.mortarLossRate=0] - 砂浆损耗率 %
 * @param {number} [input.area=1] - 计算面积 ㎡
 * @returns {Object} 计算结果
 */
function calculateBrickQuantity(input) {
  const p = validateParams(input);
  const brickLossRate = Number(input.brickLossRate) || 0;
  const mortarLossRate = Number(input.mortarLossRate) || 0;
  const area = Math.max(0, Number(input.area) || 0);

  const K = getWallThicknessFactor(p.wallThickness, p.brickWidth);
  const bricksPerM3 = calcBricksPerCubicMeter(p.wallThickness, p.brickLength, p.brickHeight, p.mortarThickness, K);
  const bricksPerM2 = calcBricksPerSquareMeter(bricksPerM3, p.wallThickness);
  const mortarPerM3 = calcMortarPerCubicMeter(bricksPerM3, p.brickLength, p.brickWidth, p.brickHeight);
  const mortarPerM2 = calcMortarPerSquareMeter(mortarPerM3, p.wallThickness);

  const bricksPerM3Gross = calcGrossQuantity(bricksPerM3, brickLossRate);
  const bricksPerM2Gross = calcGrossQuantity(bricksPerM2, brickLossRate);
  const mortarPerM3Gross = calcGrossQuantity(mortarPerM3, mortarLossRate);
  const mortarPerM2Gross = calcGrossQuantity(mortarPerM2, mortarLossRate);

  const totalBricksNet = bricksPerM2 * area;
  const totalBricksGross = bricksPerM2Gross * area;
  const totalMortarNet = mortarPerM2 * area;
  const totalMortarGross = mortarPerM2Gross * area;

  return {
    K: K,
    bricksPerM3Net: bricksPerM3,
    bricksPerM2Net: bricksPerM2,
    mortarPerM3Net: mortarPerM3,
    mortarPerM2Net: mortarPerM2,
    bricksPerM3Gross: bricksPerM3Gross,
    bricksPerM2Gross: bricksPerM2Gross,
    mortarPerM3Gross: mortarPerM3Gross,
    mortarPerM2Gross: mortarPerM2Gross,
    totalBricksNet: totalBricksNet,
    totalBricksGross: totalBricksGross,
    totalMortarNet: totalMortarNet,
    totalMortarGross: totalMortarGross,
    area: area,
    wallThickness: p.wallThickness
  };
}

/* ============================================================
   第二部分：单元测试框架与用例
   ============================================================ */

let testResults = [];
let testCount = 0;
let passCount = 0;

function assert(condition, message) {
  testCount++;
  if (condition) {
    passCount++;
    testResults.push({ pass: true, msg: message });
  } else {
    testResults.push({ pass: false, msg: message });
  }
}

function assertApprox(actual, expected, tolerance, message) {
  const diff = Math.abs(actual - expected);
  assert(diff <= tolerance, `${message} (期望 ${expected}，实际 ${actual}，容差 ${tolerance})`);
}

function assertThrows(fn, message) {
  testCount++;
  try {
    fn();
    testResults.push({ pass: false, msg: `${message} (期望抛出异常但未抛出)` });
  } catch (e) {
    passCount++;
    testResults.push({ pass: true, msg: `${message} (正确抛出: ${e.message})` });
  }
}

function runAllTests() {
  testResults = [];
  testCount = 0;
  passCount = 0;

  // === 正常值测试 ===
  // 1. 标准砖 240 墙，灰缝 10mm
  let r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assertApprox(r.bricksPerM3Net, 529.1, 1, 'T01: 240 墙每立方米砖数约 529');

  // 2. 标准砖 115 墙
  r = calculateBrickQuantity({ wallThickness: 115, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assertApprox(r.bricksPerM3Net, 552.0, 2, 'T02: 115 墙每立方米砖数约 552');

  // 3. 标准砖 180 墙
  r = calculateBrickQuantity({ wallThickness: 180, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assertApprox(r.bricksPerM3Net, 538.5, 2, 'T03: 180 墙每立方米砖数约 538');

  // 4. 标准砖 365 墙
  r = calculateBrickQuantity({ wallThickness: 365, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assertApprox(r.bricksPerM3Net, 523.0, 2, 'T04: 365 墙每立方米砖数约 523');

  // 5. 标准砖 490 墙
  r = calculateBrickQuantity({ wallThickness: 490, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assertApprox(r.bricksPerM3Net, 518.5, 2, 'T05: 490 墙每立方米砖数约 518');

  // 6. 240 墙每平米砖数
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assertApprox(r.bricksPerM2Net, 127.0, 1, 'T06: 240 墙每平米砖数约 127');

  // 7. 240 墙砂浆净用量
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assertApprox(r.mortarPerM3Net, 0.226, 0.005, 'T07: 240 墙砂浆净用量约 0.226 m³/m³');

  // 8. 灰缝 8mm 时砖数增加
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 8 });
  assert(r.bricksPerM3Net > 529, 'T08: 灰缝 8mm 时砖数应大于 529');

  // 9. 灰缝 12mm 时砖数减少
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 12 });
  assert(r.bricksPerM3Net < 529, 'T09: 灰缝 12mm 时砖数应小于 529');

  // 10. 砖损耗率 1.5%
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10, brickLossRate: 1.5 });
  assertApprox(r.bricksPerM3Gross, r.bricksPerM3Net * 1.015, 0.1, 'T10: 砖损耗率 1.5% 计算正确');

  // 11. 砂浆损耗率 2%
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10, mortarLossRate: 2 });
  assertApprox(r.mortarPerM3Gross, r.mortarPerM3Net * 1.02, 0.001, 'T11: 砂浆损耗率 2% 计算正确');

  // 12. 面积 10 ㎡ 总量
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10, area: 10 });
  assertApprox(r.totalBricksNet, r.bricksPerM2Net * 10, 0.1, 'T12: 10 ㎡ 总砖数计算正确');

  // 13. 多孔砖规格（190×190×90）
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 190, brickWidth: 190, brickHeight: 90, mortarThickness: 10 });
  assert(r.bricksPerM3Net > 0 && r.bricksPerM3Net < 1000, 'T13: 多孔砖计算结果合理');

  // 14. K 值：240 墙 K=2
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assertApprox(r.K, 2, 0.01, 'T14: 240 墙 K 值应为 2');

  // 15. K 值：115 墙 K=1
  r = calculateBrickQuantity({ wallThickness: 115, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assertApprox(r.K, 1, 0.01, 'T15: 115 墙 K 值应为 1');

  // 16. K 值：365 墙 K=3
  r = calculateBrickQuantity({ wallThickness: 365, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assertApprox(r.K, 3, 0.01, 'T16: 365 墙 K 值应为 3');

  // 17. 每平米与每立方米换算
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assertApprox(r.bricksPerM2Net, r.bricksPerM3Net * 0.24, 0.1, 'T17: 每平米 = 每立方米 × 墙厚(m)');

  // 18. 砂浆每平米与每立方米换算
  assertApprox(r.mortarPerM2Net, r.mortarPerM3Net * 0.24, 0.001, 'T18: 砂浆每平米 = 每立方米 × 墙厚(m)');

  // 19. 60 墙（1/4 砖）
  r = calculateBrickQuantity({ wallThickness: 60, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assert(r.bricksPerM3Net > 0, 'T19: 60 墙计算结果为正');

  // 20. 损耗率为 0
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10, brickLossRate: 0, mortarLossRate: 0 });
  assertApprox(r.bricksPerM3Gross, r.bricksPerM3Net, 0.001, 'T20: 损耗率 0 时净=毛');

  // === 边界值测试 ===
  // 21. 极小灰缝 1mm
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 1 });
  assert(r.bricksPerM3Net > 529, 'T21: 灰缝 1mm 时砖数应显著增加');

  // 22. 极大灰缝 20mm
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 20 });
  assert(r.bricksPerM3Net < 529, 'T22: 灰缝 20mm 时砖数应显著减少');

  // 23. 自定义墙厚 300mm
  r = calculateBrickQuantity({ wallThickness: 300, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assertApprox(r.K, 300/115, 0.01, 'T23: 自定义墙厚 K 值按砖宽近似');

  // 24. 大面积 1000 ㎡
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10, area: 1000 });
  assert(r.totalBricksNet > 100000, 'T24: 大面积计算结果合理');

  // 25. 面积 0
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10, area: 0 });
  assertApprox(r.totalBricksNet, 0, 0.001, 'T25: 面积 0 时总量为 0');

  // === 异常输入测试 ===
  // 26. 墙厚为负数
  assertThrows(() => calculateBrickQuantity({ wallThickness: -100, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 }), 'T26: 墙厚负数应抛错');

  // 27. 墙厚为 0
  assertThrows(() => calculateBrickQuantity({ wallThickness: 0, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 }), 'T27: 墙厚 0 应抛错');

  // 28. 砖长为 NaN
  assertThrows(() => calculateBrickQuantity({ wallThickness: 240, brickLength: NaN, brickWidth: 115, brickHeight: 53, mortarThickness: 10 }), 'T28: 砖长 NaN 应抛错');

  // 29. 砖宽为字符串
  assertThrows(() => calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 'abc', brickHeight: 53, mortarThickness: 10 }), 'T29: 砖宽字符串应抛错');

  // 30. 灰缝为负数
  assertThrows(() => calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: -5 }), 'T30: 灰缝负数应抛错');

  // 31. 损耗率为负数
  assertThrows(() => calcGrossQuantity(100, -5), 'T31: 损耗率负数应抛错');

  // 32. 精度：小数位保留
  r = calculateBrickQuantity({ wallThickness: 240, brickLength: 240, brickWidth: 115, brickHeight: 53, mortarThickness: 10 });
  assert(typeof r.bricksPerM3Net === 'number' && isFinite(r.bricksPerM3Net), 'T32: 结果为有限数字');
}

const sourceCodeText = `/**
 * 砌体用砖量计算 - 核心算法
 * 纯函数实现，无外部依赖
 */

/**
 * 根据墙厚获取墙厚系数 K（砖数倍数）
 * 依据：《全国统一建筑工程基础定额》及施工手册常用取值
 * @param {number} wallThickness - 墙厚，单位 mm，必须 > 0
 * @param {number} brickWidth - 砖宽，单位 mm，用于自定义墙厚的近似计算
 * @returns {number} 墙厚系数 K（无量纲）
 * @throws {Error} 输入非法时抛出错误
 */
function getWallThicknessFactor(wallThickness, brickWidth) {
  if (typeof wallThickness !== 'number' || isNaN(wallThickness)) {
    throw new Error('墙厚必须为数字');
  }
  if (wallThickness <= 0) {
    throw new Error('墙厚必须大于 0');
  }
  if (typeof brickWidth !== 'number' || isNaN(brickWidth) || brickWidth <= 0) {
    throw new Error('砖宽必须为大于 0 的数字');
  }
  const standardMap = {
    60: 0.5,    // 1/4 砖墙
    115: 1,     // 1/2 砖墙
    180: 1.5,   // 3/4 砖墙
    240: 2,     // 1 砖墙
    365: 3,     // 1.5 砖墙
    490: 4      // 2 砖墙
  };
  for (const key in standardMap) {
    if (Math.abs(wallThickness - Number(key)) <= 2) {
      return standardMap[key];
    }
  }
  return wallThickness / brickWidth;
}

/**
 * 校验输入参数的合法性
 * @param {Object} params - 参数对象
 * @returns {Object} 校验后的参数
 * @throws {Error} 参数非法时抛出
 */
function validateParams(params) {
  const required = ['wallThickness', 'brickLength', 'brickWidth', 'brickHeight', 'mortarThickness'];
  const result = {};
  for (const key of required) {
    const v = Number(params[key]);
    if (isNaN(v)) throw new Error(\`参数 \${key} 必须为数字\`);
    if (v <= 0) throw new Error(\`参数 \${key} 必须大于 0\`);
    result[key] = v;
  }
  return result;
}

/**
 * 计算每立方米砌体的砖净用量（块/m³）
 * 公式：N = K × 10^9 / [墙厚 × (砖长+灰缝) × (砖厚+灰缝)]
 * @param {number} wallThickness - 墙厚 mm
 * @param {number} brickLength - 砖长 mm
 * @param {number} brickHeight - 砖厚 mm
 * @param {number} mortarThickness - 灰缝 mm
 * @param {number} K - 墙厚系数
 * @returns {number} 每立方米砖净用量（块/m³）
 */
function calcBricksPerCubicMeter(wallThickness, brickLength, brickHeight, mortarThickness, K) {
  const denominator = wallThickness * (brickLength + mortarThickness) * (brickHeight + mortarThickness);
  return (K * 1e9) / denominator;
}

/**
 * 计算每平米砌体的砖净用量（块/㎡）
 * @param {number} bricksPerCubicMeter - 每立方米砖数
 * @param {number} wallThickness - 墙厚 mm
 * @returns {number} 每平米砖净用量（块/㎡）
 */
function calcBricksPerSquareMeter(bricksPerCubicMeter, wallThickness) {
  return bricksPerCubicMeter * (wallThickness / 1000);
}

/**
 * 计算每立方米砌体的砂浆净用量（m³/m³）
 * 公式：V_mortar = 1 - N × 单砖体积
 * @param {number} bricksPerCubicMeter - 每立方米砖数
 * @param {number} brickLength - 砖长 mm
 * @param {number} brickWidth - 砖宽 mm
 * @param {number} brickHeight - 砖厚 mm
 * @returns {number} 每立方米砂浆净用量（m³/m³）
 */
function calcMortarPerCubicMeter(bricksPerCubicMeter, brickLength, brickWidth, brickHeight) {
  const singleBrickVolume = (brickLength * brickWidth * brickHeight) / 1e9;
  const mortar = 1 - bricksPerCubicMeter * singleBrickVolume;
  return Math.max(0, mortar);
}

/**
 * 计算每平米砌体的砂浆净用量（m³/㎡）
 * @param {number} mortarPerCubicMeter - 每立方米砂浆用量
 * @param {number} wallThickness - 墙厚 mm
 * @returns {number} 每平米砂浆净用量（m³/㎡）
 */
function calcMortarPerSquareMeter(mortarPerCubicMeter, wallThickness) {
  return mortarPerCubicMeter * (wallThickness / 1000);
}

/**
 * 计算考虑损耗后的消耗量
 * @param {number} netQuantity - 净用量
 * @param {number} lossRatePercent - 损耗率（%）
 * @returns {number} 消耗量
 */
function calcGrossQuantity(netQuantity, lossRatePercent) {
  if (typeof lossRatePercent !== 'number' || isNaN(lossRatePercent) || lossRatePercent < 0) {
    throw new Error('损耗率必须为非负数字');
  }
  return netQuantity * (1 + lossRatePercent / 100);
}

/**
 * 主计算函数：根据输入参数计算全部指标
 * @param {Object} input - 输入参数
 * @returns {Object} 计算结果
 */
function calculateBrickQuantity(input) {
  const p = validateParams(input);
  const brickLossRate = Number(input.brickLossRate) || 0;
  const mortarLossRate = Number(input.mortarLossRate) || 0;
  const area = Math.max(0, Number(input.area) || 0);

  const K = getWallThicknessFactor(p.wallThickness, p.brickWidth);
  const bricksPerM3 = calcBricksPerCubicMeter(p.wallThickness, p.brickLength, p.brickHeight, p.mortarThickness, K);
  const bricksPerM2 = calcBricksPerSquareMeter(bricksPerM3, p.wallThickness);
  const mortarPerM3 = calcMortarPerCubicMeter(bricksPerM3, p.brickLength, p.brickWidth, p.brickHeight);
  const mortarPerM2 = calcMortarPerSquareMeter(mortarPerM3, p.wallThickness);

  const bricksPerM3Gross = calcGrossQuantity(bricksPerM3, brickLossRate);
  const bricksPerM2Gross = calcGrossQuantity(bricksPerM2, brickLossRate);
  const mortarPerM3Gross = calcGrossQuantity(mortarPerM3, mortarLossRate);
  const mortarPerM2Gross = calcGrossQuantity(mortarPerM2, mortarLossRate);

  const totalBricksNet = bricksPerM2 * area;
  const totalBricksGross = bricksPerM2Gross * area;
  const totalMortarNet = mortarPerM2 * area;
  const totalMortarGross = mortarPerM2Gross * area;

  return {
    K, bricksPerM3Net: bricksPerM3, bricksPerM2Net: bricksPerM2,
    mortarPerM3Net: mortarPerM3, mortarPerM2Net: mortarPerM2,
    bricksPerM3Gross, bricksPerM2Gross, mortarPerM3Gross, mortarPerM2Gross,
    totalBricksNet, totalBricksGross, totalMortarNet, totalMortarGross,
    area, wallThickness: p.wallThickness
  };
}`;

const docHTML = `
<h2>一、工具用途</h2>
<p>本工具用于砌筑工程中标准砖、多孔砖等块材的用量估算。输入墙厚、砖规格、灰缝厚度等参数后，可快速得到：</p>
<ul>
  <li>每立方米砌体的砖净用量（块/m³）与砂浆净用量（m³/m³）</li>
  <li>每平米砌体的砖净用量（块/㎡）与砂浆净用量（m³/㎡）</li>
  <li>考虑施工损耗后的砖与砂浆消耗量</li>
  <li>给定墙面面积后的总用量</li>
</ul>
<p>适用场景：施工图预算编制、材料采购计划、现场备料参考、施工方案对比等。</p>

<h2>二、参数详解</h2>
<h3>2.1 墙厚 (mm)</h3>
<p>砌体墙的实际厚度。工具内置 6 种标准墙厚（60、115、180、240、365、490），对应 1/4 砖至 2 砖墙。若为自定义墙厚（如 200mm 砌块墙），选择"自定义"并输入数值，工具将按砖宽近似计算墙厚系数 K。</p>
<table>
  <tr><th>墙厚 (mm)</th><th>俗称</th><th>墙厚系数 K</th><th>典型应用</th></tr>
  <tr><td>60</td><td>1/4 砖</td><td>0.5</td><td>隔墙、装饰线条</td></tr>
  <tr><td>115</td><td>1/2 砖</td><td>1</td><td>内隔墙</td></tr>
  <tr><td>180</td><td>3/4 砖</td><td>1.5</td><td>部分地区的内墙</td></tr>
  <tr><td>240</td><td>1 砖</td><td>2</td><td>承重墙、外墙（最常见）</td></tr>
  <tr><td>365</td><td>1.5 砖</td><td>3</td><td>寒冷地区外墙</td></tr>
  <tr><td>490</td><td>2 砖</td><td>4</td><td>严寒地区外墙、基础墙</td></tr>
</table>

<h3>2.2 砖规格 (长 × 宽 ×厚 mm)</h3>
<p>默认值为标准砖 240×115×53 mm（依据 GB/T 5101-2017《烧结普通砖》）。若使用多孔砖（如 190×190×90）、空心砖、混凝土砖等，需按实际尺寸输入。注意：本工具按实心砖模型计算，对空心砖的孔洞率未作扣减，结果会偏大，需人工修正。</p>

<h3>2.3 灰缝厚度 (mm)</h3>
<p>砖与砖之间的砂浆缝厚度。依据 GB 50203-2011《砌体结构工程施工质量验收规范》第 5.3.2 条，水平灰缝厚度和竖向灰缝厚度宜为 10mm，不应小于 8mm，也不应大于 12mm。默认取 10mm。灰缝越大，砂浆用量越多，砖用量越少。</p>

<h3>2.4 砖损耗率 (%)</h3>
<p>运输、搬运、砌筑过程中的砖破损率。依据各地预算定额，一般取 1%~2%。本工具默认 1.5%。实际取值需参考当地现行定额说明。</p>

<h3>2.5 砂浆损耗率 (%)</h3>
<p>砂浆搅拌、运输、砌筑过程中的损失率。定额常取 1%~3%，默认 1.5%。</p>

<h3>2.6 计算面积 (㎡)</h3>
<p>待砌筑的墙面面积。填入后工具会计算该面积的总砖数和总砂浆量。若仅需单位用量，可填 1 或 0。</p>

<h2>三、使用场景</h2>
<h3>场景 1：住宅楼 240 外墙备料</h3>
<p>某住宅楼外墙采用标准砖砌筑，墙厚 240mm，灰缝 10mm，外墙面积 800 ㎡。输入参数后得到：每平米砖净用量约 127 块，800 ㎡ 总净用量约 101,600 块；考虑 1.5% 损耗后约 103,124 块。砂浆每平米约 0.054 m³，总量约 43.5 m³。采购时建议再增加 3%~5% 的富余。</p>

<h3>场景 2：内隔墙 115 墙材料计划</h3>
<p>办公室内隔墙采用 115 墙（1/2 砖），总面积 300 ㎡。计算得每平米砖数约 63.5 块（注意：115 墙的每平米砖数少于 240 墙，因为墙薄），总砖数约 19,050 块。砂浆用量相应减少。</p>

<h3>场景 3：使用多孔砖的对比计算</h3>
<p>某项目拟采用 190×190×90 多孔砖替代标准砖，墙厚 240mm。输入新砖规格后，可对比两种方案的用砖量和砂浆量差异，为材料选型提供数据支持。注意多孔砖的孔洞率需另行扣减。</p>

<h3>场景 4：不同灰缝厚度的敏感性分析</h3>
<p>施工队提出将灰缝从 10mm 减小到 8mm 以节约砂浆。通过分别输入 8mm 和 10mm 对比，可量化砂浆节约量和砖用量变化，评估是否值得调整工艺。</p>

<h3>场景 5：基础墙 490 厚的大方量计算</h3>
<p>某厂房基础墙厚 490mm（2 砖墙），总长 200m，高 1.2m，面积 240 ㎡。计算得每立方米砖数约 518 块，总用量约 62,000 块左右。大方量工程建议分批采购，并考虑现场堆放损耗。</p>

<h3>场景 6：预算编制中的砂浆用量估算</h3>
<p>编制施工图预算时，需确定 M5 混合砂浆的用量。输入参数后得到每立方米砌体的砂浆净用量，再乘以定额单价即可得到砂浆费用。注意预算定额中可能已包含损耗，避免重复计取。</p>

<h2>四、常见错误</h2>
<ul>
  <li><strong>错误 1：混淆净用量与消耗量。</strong>净用量是理论值，消耗量包含损耗。采购应按消耗量，成本分析可用净用量。</li>
  <li><strong>错误 2：忽略墙厚系数 K 的差异。</strong>不同墙厚的 K 值不同，不能简单按墙厚比例换算砖数。</li>
  <li><strong>错误 3：将空心砖按实心砖计算。</strong>本工具未考虑孔洞率，空心砖结果需乘以 (1 - 孔洞率) 修正。</li>
  <li><strong>错误 4：灰缝取值不当。</strong>灰缝小于 8mm 或大于 12mm 均不符合规范要求，计算结果无实际意义。</li>
  <li><strong>错误 5：重复计取损耗。</strong>若使用的预算定额已含损耗，不要再叠加本工具的损耗率。</li>
  <li><strong>错误 6：自定义墙厚时 K 值偏差。</strong>非标准墙厚的 K 值按砖宽近似，可能与实际砌筑方式有偏差。</li>
</ul>

<h2>五、数据依据</h2>
<p>本工具的计算公式和参数取值参考以下标准与资料：</p>
<ul>
  <li>GB 50203-2011《砌体结构工程施工质量验收规范》——灰缝厚度要求</li>

<h2>六、局限性</h2>
<ul>
  <li><strong>砌筑方式简化：</strong>公式基于一顺一丁、全顺等典型砌筑方式的平均化模型，未区分具体砌法（如三顺一丁、梅花丁等），不同砌法的实际用砖量会有差异。</li>
  <li><strong>未考虑门窗洞口：</strong>计算结果为实砌墙体的用量，未扣除门窗洞口、过梁、圈梁等占体积，需用户自行扣减。</li>
  <li><strong>未考虑砖的破损与切割：</strong>实际砌筑中砖的切割、破损会产生额外损耗，本工具仅按给定损耗率计算。</li>
  <li><strong>空心砖、砌块不适用：</strong>本工具按实心砖模型计算，对空心砖、混凝土砌块、加气混凝土块等需另行修正。</li>
  <li><strong>未考虑砂浆饱满度：</strong>实际灰缝的饱满度影响砂浆实际用量，本工具按 100% 饱满度计算。</li>
  <li><strong>非标准墙厚精度有限：</strong>自定义墙厚的 K 值按砖宽近似，可能与实际有偏差。</li>
</ul>
