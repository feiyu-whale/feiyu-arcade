<script>
/* ============================================================
 *  第一部分：JS 源码（模板与支撑计算核心算法）
 *  依据：JGJ 162-2008《建筑施工模板安全技术规范》
 * ============================================================ */

/**
 * 模板与支撑计算工具核心模块
 * @namespace TemplateSupportCalc
 */
const TemplateSupportCalc = (function () {

  /**
   * 根据坍落度返回 β2 系数（坍落度影响系数）
   * 依据 JGJ 162-2008 第 4.1.1 条表 4.1.1-2
   *
   * @param {number} slump - 混凝土坍落度，单位 mm
   * @returns {number} β2 系数
   * @throws {Error} 坍落度超出规范范围
   */
  function getBeta2(slump) {
    if (typeof slump !== 'number' || isNaN(slump)) {
      throw new Error('坍落度必须为数字');
    }
    if (slump < 30) throw new Error('坍落度不得小于 30mm');
    if (slump > 200) throw new Error('坍落度不得大于 200mm');
    if (slump <= 50) return 0.85;
    if (slump <= 90) return 1.0;
    if (slump <= 150) return 1.15;
    return 1.25; // 160-200
  }

  /**
   * 根据外加剂类型返回 β1 系数
   * 依据 JGJ 162-2008 第 4.1.1 条表 4.1.1-1
   *
   * @param {string} admixture - 外加剂类型：'none' | 'retarder'
   * @returns {number} β1 系数
   */
  function getBeta1(admixture) {
    if (admixture === 'retarder') return 1.2;
    return 1.0;
  }

  /**
   * 根据混凝土入模温度计算 t0 系数
   * 依据 JGJ 162-2008 第 4.1.1 条：t0 = 200 / (T + 15)
   *
   * @param {number} temperature - 混凝土入模温度，单位 ℃
   * @returns {number} t0 系数
   * @throws {Error} 温度超出合理范围
   */
  function getT0(temperature) {
    if (typeof temperature !== 'number' || isNaN(temperature)) {
      throw new Error('温度必须为数字');
    }
    if (temperature < -15) throw new Error('温度不得低于 -15℃');
    return 200 / (temperature + 15);
  }

  /**
   * 计算新浇混凝土对模板的侧压力
   * 依据 JGJ 162-2008 第 4.1.1 条
   * 公式：F = 0.22·γc·β1·β2·V^(1/2)·t0^(1/2)
   * 且 F ≤ γc·H
   *
   * @param {Object} params - 计算参数
   * @param {number} params.gammaC - 混凝土重力密度，kN/m³，默认 24
   * @param {number} params.slump - 坍落度，mm，范围 30-200
   * @param {string} params.admixture - 外加剂类型 'none'|'retarder'
   * @param {number} params.velocity - 浇筑速度，m/h
   * @param {number} params.temperature - 混凝土入模温度，℃
   * @param {number} params.height - 浇筑高度，m
   * @returns {Object} 计算结果
   * @returns {number} returns.pressure - 侧压力标准值，kN/m²
   * @returns {number} returns.effectiveHeight - 有效压头高度，m
   * @returns {number} returns.gammaH - γc·H 限值，kN/m²
   * @returns {boolean} returns.controlledByHeight - 是否由高度控制
   */
  function calcFormworkLateralPressure(params) {
    if (!params || typeof params !== 'object') {
      throw new Error('参数必须为对象');
    }
    const gammaC = params.gammaC !== undefined ? params.gammaC : 24;
    const slump = params.slump;
    const admixture = params.admixture || 'none';
    const velocity = params.velocity;
    const temperature = params.temperature;
    const height = params.height;

    if (typeof gammaC !== 'number' || gammaC <= 0) {
      throw new Error('混凝土重力密度必须为正数');
    }
    if (typeof velocity !== 'number' || velocity <= 0) {
      throw new Error('浇筑速度必须为正数');
    }
    if (typeof height !== 'number' || height <= 0) {
      throw new Error('浇筑高度必须为正数');
    }

    const beta1 = getBeta1(admixture);
    const beta2 = getBeta2(slump);
    const t0 = getT0(temperature);

    // F = 0.22·γc·β1·β2·V^(1/2)·t0^(1/2)
    const F_formula = 0.22 * gammaC * beta1 * beta2 * Math.sqrt(velocity) * Math.sqrt(t0);
    const F_limit = gammaC * height;

    const pressure = Math.min(F_formula, F_limit);
    const effectiveHeight = pressure / gammaC;

    return {
      pressure: roundTo(pressure, 3),
      effectiveHeight: roundTo(effectiveHeight, 3),
      gammaH: roundTo(F_limit, 3),
      formulaValue: roundTo(F_formula, 3),
      controlledByHeight: F_formula > F_limit,
      beta1: beta1,
      beta2: beta2,
      t0: roundTo(t0, 3)
    };
  }

  /**
   * 计算模板支撑间距（面板、次楞、主楞跨度）
   * 按三跨连续梁模型，同时满足强度和挠度要求
   * 依据 JGJ 162-2008 第 5.2 节
   *
   * 强度：M = km·q·l²，σ = M/W ≤ f → l ≤ sqrt(f·W/(km·q))
   * 挠度：ν = kw·q·l⁴/(100·E·I) ≤ [ν] → l ≤ (([ν]·100·E·I)/(kw·q))^(1/3)
   *
   * @param {Object} params - 计算参数
   * @param {number} params.q - 线荷载标准值，kN/m
   * @param {number} params.qDesign - 线荷载设计值，kN/m（用于强度）
   * @param {number} params.W - 截面抵抗矩，mm³（或 cm³ 需转换）
   * @param {number} params.I - 截面惯性矩，mm⁴
   * @param {number} params.f - 材料抗弯强度设计值，N/mm²
   * @param {number} params.E - 弹性模量，N/mm²
   * @param {number} params.allowDeflection - 允许挠度比，默认 1/250
   * @param {string} params.model - 梁模型 'three-span'|'two-span'，默认 'three-span'
   * @returns {Object} 计算结果
   */
  function calcSupportSpacing(params) {
    if (!params || typeof params !== 'object') {
      throw new Error('参数必须为对象');
    }
    const q = params.q;
    const qDesign = params.qDesign;
    const W = params.W;
    const I = params.I;
    const f = params.f;
    const E = params.E;
    const allowRatio = params.allowDeflection || 250;
    const model = params.model || 'three-span';

    if (typeof q !== 'number' || q <= 0) throw new Error('线荷载标准值必须为正数');
    if (typeof qDesign !== 'number' || qDesign <= 0) throw new Error('线荷载设计值必须为正数');
    if (typeof W !== 'number' || W <= 0) throw new Error('截面抵抗矩必须为正数');
    if (typeof I !== 'number' || I <= 0) throw new Error('截面惯性矩必须为正数');
    if (typeof f !== 'number' || f <= 0) throw new Error('抗弯强度必须为正数');
    if (typeof E !== 'number' || E <= 0) throw new Error('弹性模量必须为正数');

    // 弯矩系数（三跨连续梁：km=0.1, kw=0.677；两跨连续梁：km=0.125, kw=1.0 近似）
    const km = model === 'two-span' ? 0.125 : 0.1;
    const kw = model === 'two-span' ? 1.0 : 0.677;

    // 强度控制跨度（注意单位：q 为 kN/m = N/mm × 10^-3，需统一）
    // σ = km·q·l² / W ≤ f → l² ≤ f·W / (km·q)
    // q 单位 kN/m，W 单位 mm³，f 单位 N/mm²
    // 转换：q(kN/m) = q×10^3 N / 10^3 mm = q N/mm
    // 所以 l²(mm²) = f(N/mm²)·W(mm³) / (km·q(N/mm))
    const lStrength = Math.sqrt((f * W) / (km * qDesign));

    // 挠度控制跨度
    // ν = kw·q·l⁴ / (100·E·I) ≤ l/allowRatio
    // l³ ≤ (100·E·I·allowRatio) / (kw·q)
    const lDeflection = Math.pow((100 * E * I * allowRatio) / (kw * q), 1 / 3);

    // 取较小值，并转换为 m
    const lMin = Math.min(lStrength, lDeflection);
    const lMin_m = lMin / 1000;

    return {
      strengthSpan: roundTo(lStrength / 1000, 3),
      deflectionSpan: roundTo(lDeflection / 1000, 3),
      recommendedSpan: roundTo(lMin_m, 3),
      controlledBy: lStrength < lDeflection ? 'strength' : 'deflection',
      km: km,
      kw: kw
    };
  }

  /**
   * 计算荷载组合（承载能力极限状态 + 正常使用极限状态）
   * 依据 JGJ 162-2008 第 4.3 节
   *
   * 承载能力：1.2×永久荷载 + 1.4×可变荷载（基本组合）
   * 正常使用：标准组合（分项系数均为 1.0）
   *
   * @param {Object} params - 荷载参数
   * @param {number} params.g1 - 模板及支架自重，kN/m²
   * @param {number} params.g2 - 新浇混凝土自重，kN/m²
   * @param {number} params.g3 - 钢筋自重，kN/m²
   * @param {number} params.q1 - 施工人员及设备荷载，kN/m²
   * @param {number} params.q2 - 振捣混凝土荷载，kN/m²
   * @param {number} [params.permanentFactor=1.2] - 永久荷载分项系数
   * @param {number} [params.variableFactor=1.4] - 可变荷载分项系数
   * @returns {Object} 荷载组合结果
   */
  function calcLoadCombination(params) {
    if (!params || typeof params !== 'object') {
      throw new Error('参数必须为对象');
    }
    const g1 = params.g1 || 0;
    const g2 = params.g2 || 0;
    const g3 = params.g3 || 0;
    const q1 = params.q1 || 0;
    const q2 = params.q2 || 0;
    const gammaG = params.permanentFactor !== undefined ? params.permanentFactor : 1.2;
    const gammaQ = params.variableFactor !== undefined ? params.variableFactor : 1.4;

    if (gammaG < 0 || gammaQ < 0) {
      throw new Error('分项系数不得为负');
    }

    const permanentSum = g1 + g2 + g3;
    const variableSum = q1 + q2;

    // 承载能力极限状态（基本组合）
    const designValue = gammaG * permanentSum + gammaQ * variableSum;

    // 正常使用极限状态（标准组合）
    const standardValue = permanentSum + variableSum;

    return {
      permanentSum: roundTo(permanentSum, 3),
      variableSum: roundTo(variableSum, 3),
      designValue: roundTo(designValue, 3),
      standardValue: roundTo(standardValue, 3),
      permanentFactor: gammaG,
      variableFactor: gammaQ
    };
  }

  /**
   * 计算立杆承载力（支撑架立杆）
   * 依据 JGJ 162-2008 第 5.2 节
   *
   * @param {Object} params - 参数
   * @param {number} params.N - 立杆轴向力设计值，kN
   * @param {number} params.Nrd - 立杆承载力设计值，kN
   * @returns {Object} 验算结果
   */
  function checkVerticalPole(params) {
    if (!params || typeof params !== 'object') {
      throw new Error('参数必须为对象');
    }
    const N = params.N;
    const Nrd = params.Nrd;

    if (typeof N !== 'number' || N < 0) throw new Error('轴向力不得为负');
    if (typeof Nrd !== 'number' || Nrd <= 0) throw new Error('承载力设计值必须为正');

    const ratio = N / Nrd;
    return {
      ratio: roundTo(ratio, 3),
      utilization: roundTo(ratio * 100, 1),
      satisfied: ratio <= 1.0,
      margin: roundTo((1 - ratio) * 100, 1)
    };
  }

  /**
   * 数值四舍五入到指定小数位
   *
   * @param {number} value - 数值
   * @param {number} digits - 小数位数
   * @returns {number} 四舍五入后的数值
   */
  function roundTo(value, digits) {
    const factor = Math.pow(10, digits);
    return Math.round(value * factor) / factor;
  }

  // 导出公共接口
  return {
    calcFormworkLateralPressure: calcFormworkLateralPressure,
    calcSupportSpacing: calcSupportSpacing,
    calcLoadCombination: calcLoadCombination,
    checkVerticalPole: checkVerticalPole,
    getBeta2: getBeta2,
    getBeta1: getBeta1,
    getT0: getT0,
    roundTo: roundTo
  };
})();

/* ============================================================
 *  第二部分：单元测试（≥ 30 个用例）
 * ============================================================ */

/**
 * 简易测试框架
 */
const TestRunner = (function () {
  let passed = 0;
  let failed = 0;
  let total = 0;
  const logs = [];

  function assertEqual(actual, expected, message, tolerance) {
    total++;
    tolerance = tolerance || 1e-6;
    let ok;
    if (typeof expected === 'number' && typeof actual === 'number') {
      ok = Math.abs(actual - expected) < tolerance;
    } else {
      ok = actual === expected;
    }
    if (ok) {
      passed++;
      logs.push({ ok: true, msg: '✓ ' + message });
    } else {
      failed++;
      logs.push({
        ok: false,
        msg: '✗ ' + message + ' (期望: ' + expected + ', 实际: ' + actual + ')'
      });
    }
  }

  function assertThrows(fn, message) {
    total++;
    try {
      fn();
      failed++;
      logs.push({ ok: false, msg: '✗ ' + message + ' (应抛出异常但未抛出)' });
    } catch (e) {
      passed++;
      logs.push({ ok: true, msg: '✓ ' + message + ' (正确抛出: ' + e.message + ')' });
    }
  }

  function assertTrue(condition, message) {
    total++;
    if (condition) {
      passed++;
      logs.push({ ok: true, msg: '✓ ' + message });
    } else {
      failed++;
      logs.push({ ok: false, msg: '✗ ' + message });
    }
  }

  function getSummary() {
    return { passed: passed, failed: failed, total: total, logs: logs };
  }

  function reset() {
    passed = 0;
    failed = 0;
    total = 0;
    logs.length = 0;
  }

  return { assertEqual, assertThrows, assertTrue, getSummary, reset };
})();

/**
 * 运行全部测试用例
 */
function runAllTests() {
  TestRunner.reset();
  const C = TemplateSupportCalc;

  // ============ β2 系数测试 ============
  TestRunner.assertEqual(C.getBeta2(30), 0.85, 'β2: 坍落度 30mm → 0.85');
  TestRunner.assertEqual(C.getBeta2(50), 0.85, 'β2: 坍落度 50mm → 0.85');
  TestRunner.assertEqual(C.getBeta2(70), 1.0, 'β2: 坍落度 70mm → 1.0');
  TestRunner.assertEqual(C.getBeta2(90), 1.0, 'β2: 坍落度 90mm → 1.0');
  TestRunner.assertEqual(C.getBeta2(120), 1.15, 'β2: 坍落度 120mm → 1.15');
  TestRunner.assertEqual(C.getBeta2(150), 1.15, 'β2: 坍落度 150mm → 1.15');
  TestRunner.assertEqual(C.getBeta2(180), 1.25, 'β2: 坍落度 180mm → 1.25');
  TestRunner.assertEqual(C.getBeta2(200), 1.25, 'β2: 坍落度 200mm → 1.25');
  TestRunner.assertThrows(() => C.getBeta2(20), 'β2: 坍落度 20mm 应抛异常');
  TestRunner.assertThrows(() => C.getBeta2(210), 'β2: 坍落度 210mm 应抛异常');
  TestRunner.assertThrows(() => C.getBeta2('abc'), 'β2: 非数字应抛异常');

  // ============ β1 系数测试 ============
  TestRunner.assertEqual(C.getBeta1('none'), 1.0, 'β1: 不掺外加剂 → 1.0');
  TestRunner.assertEqual(C.getBeta1('retarder'), 1.2, 'β1: 掺缓凝剂 → 1.2');
  TestRunner.assertEqual(C.getBeta1('other'), 1.0, 'β1: 未知类型默认 1.0');

  // ============ t0 系数测试 ============
  TestRunner.assertEqual(C.getT0(5), 200 / 20, 't0: 5℃ → 10', 0.001);
  TestRunner.assertEqual(C.getT0(20), 200 / 35, 't0: 20℃ → 5.714', 0.001);
  TestRunner.assertEqual(C.getT0(35), 200 / 50, 't0: 35℃ → 4', 0.001);
  TestRunner.assertThrows(() => C.getT0(-20), 't0: 温度 -20℃ 应抛异常');

  // ============ 侧压力计算测试 ============
  // 标准算例：γc=24, 坍落度 120mm(β2=1.15), 不掺外加剂(β1=1.0), V=2m/h, T=20℃, H=4m
  // t0 = 200/35 ≈ 5.714
  // F = 0.22 × 24 × 1.0 × 1.15 × √2 × √5.714 ≈ 0.22 × 24 × 1.15 × 1.414 × 2.390 ≈ 20.31
  // γc·H = 24 × 4 = 96
  // 取小值 20.31
  const r1 = C.calcFormworkLateralPressure({
    gammaC: 24, slump: 120, admixture: 'none',
    velocity: 2, temperature: 20, height: 4
  });
  TestRunner.assertTrue(r1.pressure > 20 && r1.pressure < 21,
    '侧压力: 标准算例 ≈ 20.3 kN/m² (实际 ' + r1.pressure + ')');
  TestRunner.assertEqual(r1.controlledByHeight, false, '侧压力: 标准算例由公式控制');
  TestRunner.assertEqual(r1.gammaH, 96, '侧压力: γc·H = 96');

  // 高度控制算例：H 很小
  const r2 = C.calcFormworkLateralPressure({
    gammaC: 24, slump: 120, admixture: 'none',
    velocity: 2, temperature: 20, height: 0.5
  });
  TestRunner.assertEqual(r2.pressure, 12, '侧压力: H=0.5m 时由高度控制 → 12');
  TestRunner.assertEqual(r2.controlledByHeight, true, '侧压力: H=0.5m 时由高度控制');

  // 缓凝剂影响
  const r3 = C.calcFormworkLateralPressure({
    gammaC: 24, slump: 120, admixture: 'retarder',
    velocity: 2, temperature: 20, height: 4
  });
  TestRunner.assertTrue(r3.pressure > r1.pressure,
    '侧压力: 掺缓凝剂侧压力更大');

  // 异常输入
  TestRunner.assertThrows(() => C.calcFormworkLateralPressure(null), '侧压力: null 应抛异常');
  TestRunner.assertThrows(() => C.calcFormworkLateralPressure({
    gammaC: 24, slump: 120, velocity: -1, temperature: 20, height: 4
  }), '侧压力: 负速度应抛异常');

  // ============ 支撑间距计算测试 ============
  // 标准算例：q=10 kN/m, qDesign=12 kN/m, W=5000 mm³, I=50000 mm⁴, f=13 N/mm², E=9000 N/mm²
  const s1 = C.calcSupportSpacing({
    q: 10, qDesign: 12, W: 5000, I: 50000, f: 13, E: 9000
  });
  TestRunner.assertTrue(s1.recommendedSpan > 0, '支撑间距: 结果为正数');
  TestRunner.assertTrue(s1.strengthSpan > 0, '支撑间距: 强度跨度为正');
  TestRunner.assertTrue(s1.deflectionSpan > 0, '支撑间距: 挠度跨度为正');
  TestRunner.assertTrue(['strength', 'deflection'].includes(s1.controlledBy),
    '支撑间距: 控制因素为 strength 或 deflection');

  // 异常输入
  TestRunner.assertThrows(() => C.calcSupportSpacing({
    q: -1, qDesign: 12, W: 5000, I: 50000, f: 13, E: 9000
  }), '支撑间距: 负荷载应抛异常');

  // ============ 荷载组合测试 ============
  const lc1 = C.calcLoadCombination({
    g1: 0.3, g2: 6.0, g3: 0.275, q1: 2.5, q2: 2.0
  });
  // 永久 = 0.3 + 6.0 + 0.275 = 6.575
  // 可变 = 2.5 + 2.0 = 4.5
  // 设计值 = 1.2 × 6.575 + 1.4 × 4.5 = 7.89 + 6.3 = 14.19
  // 标准值 = 6.575 + 4.5 = 11.075
  TestRunner.assertEqual(lc1.permanentSum, 6.575, '荷载组合: 永久荷载和 = 6.575');
  TestRunner.assertEqual(lc1.variableSum, 4.5, '荷载组合: 可变荷载和 = 4.5');
  TestRunner.assertEqual(lc1.designValue, 14.19, '荷载组合: 设计值 = 14.19');
  TestRunner.assertEqual(lc1.standardValue, 11.075, '荷载组合: 标准值 = 11.075');

  // 自定义分项系数
  const lc2 = C.calcLoadCombination({
    g1: 1, g2: 2, g3: 0, q1: 1, q2: 0,
    permanentFactor: 1.3, variableFactor: 1.5
  });
  // 设计值 = 1.3 × 3 + 1.5 × 1 = 3.9 + 1.5 = 5.4
  TestRunner.assertEqual(lc2.designValue, 5.4, '荷载组合: 自定义分项系数');

  // 异常
  TestRunner.assertThrows(() => C.calcLoadCombination({
    g1: 1, g2: 1, g3: 1, q1: 1, q2: 1, permanentFactor: -1
  }), '荷载组合: 负分项系数应抛异常');

  // ============ 立杆承载力验算 ============
  const vp1 = C.checkVerticalPole({ N: 20, Nrd: 30 });
  TestRunner.assertEqual(vp1.ratio, 20 / 30, '立杆: 利用率 = 0.667', 0.001);
  TestRunner.assertEqual(vp1.satisfied, true, '立杆: 20/30 满足');
  TestRunner.assertEqual(vp1.utilization, 66.7, '立杆: 利用率 66.7%', 0.1);

  const vp2 = C.checkVerticalPole({ N: 35, Nrd: 30 });
  TestRunner.assertEqual(vp2.satisfied, false, '立杆: 35/30 不满足');

  // ============ roundTo 精度测试 ============
  TestRunner.assertEqual(C.roundTo(1.005, 2), 1.01, 'roundTo: 1.005 → 1.01');
  TestRunner.assertEqual(C.roundTo(1.0049, 2), 1.0, 'roundTo: 1.0049 → 1.00');
  TestRunner.assertEqual(C.roundTo(3.14159, 3), 3.142, 'roundTo: 3.14159 → 3.142');

  // ============ 输出结果 ============
  const summary = TestRunner.getSummary();
  const summaryEl = document.getElementById('testSummary');
  const resultEl = document.getElementById('testResult');

  summaryEl.innerHTML = '<div class="summary ' +
    (summary.failed === 0 ? 'ok' : 'bad') + '">' +
    '通过 ' + summary.passed + ' / 共 ' + summary.total +
    (summary.failed > 0 ? ' （失败 ' + summary.failed + '）' : '') +
    '</div>';

  resultEl.innerHTML = summary.logs.map(function (l) {
    return '<div class="' + (l.ok ? 'pass' : 'fail') + '">' + l.msg + '</div>';
  }).join('');
}

/* ============================================================
 *  源码展示（语法高亮简化版）
 * ============================================================ */
const SOURCE_CODE = `/**
 * 模板与支撑计算工具核心模块
 * 依据：JGJ 162-2008《建筑施工模板安全技术规范》
 * @namespace TemplateSupportCalc
 */
const TemplateSupportCalc = (function () {

  /**
   * 根据坍落度返回 β2 系数
   * 依据 JGJ 162-2008 第 4.1.1 条表 4.1.1-2
   * @param {number} slump - 坍落度，mm，范围 30-200
   * @returns {number} β2 系数
   */
  function getBeta2(slump) {
    if (typeof slump !== 'number' || isNaN(slump)) {
      throw new Error('坍落度必须为数字');
    }
    if (slump < 30) throw new Error('坍落度不得小于 30mm');
    if (slump > 200) throw new Error('坍落度不得大于 200mm');
    if (slump <= 50) return 0.85;
    if (slump <= 90) return 1.0;
    if (slump <= 150) return 1.15;
    return 1.25;
  }

  /**
   * 根据外加剂类型返回 β1 系数
   * @param {string} admixture - 'none' | 'retarder'
   * @returns {number} β1 系数
   */
  function getBeta1(admixture) {
    if (admixture === 'retarder') return 1.2;
    return 1.0;
  }

  /**
   * 根据混凝土入模温度计算 t0 系数
   * 依据 JGJ 162-2008：t0 = 200 / (T + 15)
   * @param {number} temperature - 入模温度，℃
   * @returns {number} t0 系数
   */
  function getT0(temperature) {
    if (typeof temperature !== 'number' || isNaN(temperature)) {
      throw new Error('温度必须为数字');
    }
    if (temperature < -15) throw new Error('温度不得低于 -15℃');
    return 200 / (temperature + 15);
  }

  /**
   * 计算新浇混凝土对模板的侧压力
   * 依据 JGJ 162-2008 第 4.1.1 条
   * 公式：F = 0.22·γc·β1·β2·V^(1/2)·t0^(1/2)
   * 且 F ≤ γc·H
   *
   * @param {Object} params - 计算参数
   * @param {number} params.gammaC - 混凝土重力密度，kN/m³
   * @param {number} params.slump - 坍落度，mm
   * @param {string} params.admixture - 外加剂类型
   * @param {number} params.velocity - 浇筑速度，m/h
   * @param {number} params.temperature - 入模温度，℃
   * @param {number} params.height - 浇筑高度，m
   * @returns {Object} { pressure, effectiveHeight, gammaH, ... }
   */
  function calcFormworkLateralPressure(params) {
    if (!params || typeof params !== 'object') {
      throw new Error('参数必须为对象');
    }
    const gammaC = params.gammaC !== undefined ? params.gammaC : 24;
    const slump = params.slump;
    const admixture = params.admixture || 'none';
    const velocity = params.velocity;
    const temperature = params.temperature;
    const height = params.height;

    if (typeof gammaC !== 'number' || gammaC <= 0) {
      throw new Error('混凝土重力密度必须为正数');
    }
    if (typeof velocity !== 'number' || velocity <= 0) {
      throw new Error('浇筑速度必须为正数');
    }
    if (typeof height !== 'number' || height <= 0) {
      throw new Error('浇筑高度必须为正数');
    }

    const beta1 = getBeta1(admixture);
    const beta2 = getBeta2(slump);
    const t0 = getT0(temperature);

    const F_formula = 0.22 * gammaC * beta1 * beta2
                    * Math.sqrt(velocity) * Math.sqrt(t0);
    const F_limit = gammaC * height;

    const pressure = Math.min(F_formula, F_limit);
    const effectiveHeight = pressure / gammaC;

    return {
      pressure: roundTo(pressure, 3),
      effectiveHeight: roundTo(effectiveHeight, 3),
      gammaH: roundTo(F_limit, 3),
      formulaValue: roundTo(F_formula, 3),
      controlledByHeight: F_formula > F_limit,
      beta1: beta1,
      beta2: beta2,
      t0: roundTo(t0, 3)
    };
  }

  /**
   * 计算模板支撑间距
   * 按三跨连续梁模型，同时满足强度和挠度要求
   * 依据 JGJ 162-2008 第 5.2 节
   *
   * @param {Object} params - 计算参数
   * @param {number} params.q - 线荷载标准值，kN/m
   * @param {number} params.qDesign - 线荷载设计值，kN/m
   * @param {number} params.W - 截面抵抗矩，mm³
   * @param {number} params.I - 截面惯性矩，mm⁴
   * @param {number} params.f - 抗弯强度设计值，N/mm²
   * @param {number} params.E - 弹性模量，N/mm²
   * @returns {Object} { strengthSpan, deflectionSpan, recommendedSpan, ... }
   */
  function calcSupportSpacing(params) {
    if (!params || typeof params !== 'object') {
      throw new Error('参数必须为对象');
    }
    const q = params.q;
    const qDesign = params.qDesign;
    const W = params.W;
    const I = params.I;
    const f = params.f;
    const E = params.E;
    const allowRatio = params.allowDeflection || 250;
    const model = params.model || 'three-span';

    if (typeof q !== 'number' || q <= 0) throw new Error('线荷载标准值必须为正数');
    if (typeof qDesign !== 'number' || qDesign <= 0) throw new Error('线荷载设计值必须为正数');
    if (typeof W !== 'number' || W <= 0) throw new Error('截面抵抗矩必须为正数');
    if (typeof I !== 'number' || I <= 0) throw new Error('截面惯性矩必须为正数');
    if (typeof f !== 'number' || f <= 0) throw new Error('抗弯强度必须为正数');
    if (typeof E !== 'number' || E <= 0) throw new Error('弹性模量必须为正数');

    const km = model === 'two-span' ? 0.125 : 0.1;
    const kw = model === 'two-span' ? 1.0 : 0.677;

    const lStrength = Math.sqrt((f * W) / (km * qDesign));
    const lDeflection = Math.pow(
      (100 * E * I * allowRatio) / (kw * q), 1 / 3
    );

    const lMin = Math.min(lStrength, lDeflection);

    return {
      strengthSpan: roundTo(lStrength / 1000, 3),
      deflectionSpan: roundTo(lDeflection / 1000, 3),
      recommendedSpan: roundTo(lMin / 1000, 3),
      controlledBy: lStrength < lDeflection ? 'strength' : 'deflection',
      km: km,
      kw: kw
    };
  }

  /**
   * 计算荷载组合
   * 依据 JGJ 162-2008 第 4.3 节
   *
   * @param {Object} params - 荷载参数
   * @param {number} params.g1 - 模板及支架自重，kN/m²
   * @param {number} params.g2 - 新浇混凝土自重，kN/m²
   * @param {number} params.g3 - 钢筋自重，kN/m²
   * @param {number} params.q1 - 施工人员及设备，kN/m²
   * @param {number} params.q2 - 振捣荷载，kN/m²
   * @returns {Object} { permanentSum, variableSum, designValue, standardValue }
   */
  function calcLoadCombination(params) {
    if (!params || typeof params !== 'object') {
      throw new Error('参数必须为对象');
    }
    const g1 = params.g1 || 0;
    const g2 = params.g2 || 0;
    const g3 = params.g3 || 0;
    const q1 = params.q1 || 0;
    const q2 = params.q2 || 0;
    const gammaG = params.permanentFactor !== undefined
                 ? params.permanentFactor : 1.2;
    const gammaQ = params.variableFactor !== undefined
                 ? params.variableFactor : 1.4;

    if (gammaG < 0 || gammaQ < 0) {
      throw new Error('分项系数不得为负');
    }

    const permanentSum = g1 + g2 + g3;
    const variableSum = q1 + q2;
    const designValue = gammaG * permanentSum + gammaQ * variableSum;
    const standardValue = permanentSum + variableSum;

    return {
      permanentSum: roundTo(permanentSum, 3),
      variableSum: roundTo(variableSum, 3),
      designValue: roundTo(designValue, 3),
      standardValue: roundTo(standardValue, 3),
      permanentFactor: gammaG,
      variableFactor: gammaQ
    };
  }

  /**
   * 立杆承载力验算
   * @param {Object} params - { N: 轴向力, Nrd: 承载力设计值 }
   * @returns {Object} { ratio, utilization, satisfied, margin }
   */
  function checkVerticalPole(params) {
    if (!params || typeof params !== 'object') {
      throw new Error('参数必须为对象');
    }
    const N = params.N;
    const Nrd = params.Nrd;
    if (typeof N !== 'number' || N < 0) throw new Error('轴向力不得为负');
    if (typeof Nrd !== 'number' || Nrd <= 0) throw new Error('承载力必须为正');

    const ratio = N / Nrd;
    return {
      ratio: roundTo(ratio, 3),
      utilization: roundTo(ratio * 100, 1),
      satisfied: ratio <= 1.0,
      margin: roundTo((1 - ratio) * 100, 1)
    };
  }

  /**
   * 数值四舍五入
   * @param {number} value - 数值
   * @param {number} digits - 小数位数
   * @returns {number}
   */
  function roundTo(value, digits) {
    const factor = Math.pow(10, digits);
    return Math.round(value * factor) / factor;
  }

  return {
    calcFormworkLateralPressure: calcFormworkLateralPressure,
    calcSupportSpacing: calcSupportSpacing,
    calcLoadCombination: calcLoadCombination,
    checkVerticalPole: checkVerticalPole,
    getBeta2: getBeta2,
    getBeta1: getBeta1,
    getT0: getT0,
    roundTo: roundTo
  };
})();`;

// 简易语法高亮
function highlightJS(code) {
  // 转义 HTML
  code = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // 注释
  code = code.replace(/(\/\*\*[\s\S]*?\*\/|\/\/.*)/g, '<span class="cmt">$1</span>');
  // 字符串
  code = code.replace(/('[^']*'|"[^"]*")/g, '<span class="str">$1</span>');
  // 关键字
  code = code.replace(/\b(const|let|var|function|return|if|else|throw|new|typeof|isNaN|true|false|null|undefined)\b/g,
    '<span class="kw">$1</span>');
  // 数字
  code = code.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
  // 函数名
  code = code.replace(/\b([a-zA-Z_]\w*)\s*\(/g, '<span class="fn">$1</span>(');
  return code;
}
