<script>
/* ============================================================
 * 第一部分：JS 源码（Modbus CRC16 核心算法）
 * ============================================================ */
const SRC_CODE = `/**
 * Modbus CRC16 计算模块
 * 算法依据：Modicon Modbus Protocol Reference Guide (PI–MBUS–300)
 * 多项式：x^16 + x^15 + x^2 + 1（反转后为 0xA001）
 * 初始值：0xFFFF
 * 对应标准：GB/T 19582.1-2008 / GB/T 19582.2-2008
 */

/**
 * 构建 CRC16 查表（256 项，多项式 0xA001）
 * 使用查表法可将计算复杂度从 O(8n) 降至 O(n)
 *
 * @returns {Uint16Array} 长度为 256 的 CRC 查找表
 * @example
 *   const table = buildCRCTable();
 *   console.log(table[0]); // 0x0000
 */
function buildCRCTable() {
  const table = new Uint16Array(256);
  for (let i = 0; i < 256; i++) {
    let crc = i;
    for (let j = 0; j < 8; j++) {
      if (crc & 1) {
        crc = (crc >>> 1) ^ 0xA001;
      } else {
        crc = crc >>> 1;
      }
    }
    table[i] = crc & 0xFFFF;
  }
  return table;
}

/**
 * 计算 Modbus CRC16 校验值
 *
 * @param {Array<number>|Uint8Array} data - 待校验的字节数组，每个元素必须是 0~255 的整数
 * @returns {{ crc: number, high: number, low: number, bytes: Uint8Array }}
 *   - crc: 16 位 CRC 值（0~65535）
 *   - high: CRC 高字节
 *   - low: CRC 低字节
 *   - bytes: Modbus RTU 帧中实际追加的字节（低字节在前，高字节在后）
 * @throws {TypeError} 当 data 不是数组或类数组时抛出
 * @throws {RangeError} 当数组元素不在 0~255 范围时抛出
 * @example
 *   // 读保持寄存器请求：从站 1，功能码 03，起始 0x0000，数量 0x0001
 *   const r = calculateCRC16([0x01, 0x03, 0x00, 0x00, 0x00, 0x01]);
 *   // r.crc === 0x0A84, r.bytes === Uint8Array [0x84, 0x0A]
 */
function calculateCRC16(data) {
  if (data == null) {
    throw new TypeError('data 不能为 null 或 undefined');
  }
  if (typeof data === 'string') {
    throw new TypeError('data 必须是字节数组，字符串请先用 parseHexString 转换');
  }
  if (typeof data.length !== 'number') {
    throw new TypeError('data 必须是可迭代的类数组对象');
  }

  const TABLE = buildCRCTable();
  let crc = 0xFFFF;
  for (let i = 0; i < data.length; i++) {
    const b = data[i];
    if (typeof b !== 'number' || !Number.isFinite(b)) {
      throw new RangeError('数组元素必须是有限数字，收到: ' + b);
    }
    if (b < 0 || b > 255 || (b | 0) !== b) {
      throw new RangeError('数组元素必须是 0~255 的整数，收到: ' + b);
    }
    crc = (crc >>> 8) ^ TABLE[(crc ^ b) & 0xFF];
  }
  crc &= 0xFFFF;
  const high = (crc >> 8) & 0xFF;
  const low = crc & 0xFF;
  const bytes = new Uint8Array([low, high]); // Modbus RTU 低字节在前
  return { crc, high, low, bytes };
}

/**
 * 将 HEX 字符串解析为字节数组
 * 支持格式：
 *   - 空格分隔："01 03 00 00 00 01"
 *   - 连续字符串："010300000001"
 *   - 带 0x 前缀："0x01 0x03"
 *
 * @param {string} str - HEX 字符串
 * @returns {number[]} 字节数组
 * @throws {TypeError} 当 str 不是字符串时抛出
 * @throws {Error} 当字符串包含非法字符或长度异常时抛出
 * @example
 *   parseHexString("01 03 00 00 00 01"); // [1, 3, 0, 0, 0, 1]
 *   parseHexString("010300000001");      // [1, 3, 0, 0, 0, 1]
 */
function parseHexString(str) {
  if (typeof str !== 'string') {
    throw new TypeError('str 必须是字符串');
  }
  const s = str.trim().replace(/0x/gi, '').replace(/\\s+/g, ' ');
  if (s.length === 0) return [];
  // 若长度为奇数且无空格，视为非法
  if (!s.includes(' ') && s.length % 2 !== 0) {
    throw new Error('HEX 字符串长度必须为偶数: ' + str);
  }
  const parts = s.includes(' ') ? s.split(/\\s+/) : s.match(/.{1,2}/g);
  const result = [];
  for (const p of parts) {
    if (!/^[0-9a-fA-F]+$/.test(p)) {
      throw new Error('非法 HEX 字符: ' + p);
    }
    const v = parseInt(p, 16);
    if (v < 0 || v > 255) {
      throw new RangeError('字节超出范围: ' + p);
    }
    result.push(v);
  }
  return result;
}

/**
 * 将 ASCII 字符串转换为字节数组（按 UTF-8 单字节编码，仅适用于 ASCII 范围）
 *
 * @param {string} str - ASCII 字符串
 * @returns {number[]} 字节数组
 * @throws {TypeError} 当 str 不是字符串时抛出
 * @example
 *   asciiToBytes("123456789"); // [49, 50, 51, 52, 53, 54, 55, 56, 57]
 */
function asciiToBytes(str) {
  if (typeof str !== 'string') {
    throw new TypeError('str 必须是字符串');
  }
  const arr = [];
  for (let i = 0; i < str.length; i++) {
    const code = str.charCodeAt(i);
    if (code > 0xFF) {
      throw new RangeError('非 ASCII 字符: ' + str[i]);
    }
    arr.push(code);
  }
  return arr;
}

/**
 * 将 CRC 结果格式化为可读字符串
 *
 * @param {{ crc: number, high: number, low: number, bytes: Uint8Array }} result - calculateCRC16 的返回值
 * @param {string} [format='full'] - 格式：'full' | 'hex' | 'bytes' | 'lowhigh'
 * @returns {string} 格式化后的字符串
 * @throws {TypeError} 当 result 不是对象时抛出
 * @example
 *   const r = calculateCRC16([0x01, 0x03, 0x00, 0x00, 0x00, 0x01]);
 *   formatCRC(r, 'hex');     // "0x0A84"
 *   formatCRC(r, 'bytes');   // "84 0A"
 */
function formatCRC(result, format = 'full') {
  if (result == null || typeof result !== 'object') {
    throw new TypeError('result 必须是 calculateCRC16 返回的对象');
  }
  const hex2 = n => n.toString(16).toUpperCase().padStart(2, '0');
  const hex4 = n => n.toString(16).toUpperCase().padStart(4, '0');
  switch (format) {
    case 'hex': return '0x' + hex4(result.crc);
    case 'bytes': return hex2(result.bytes[0]) + ' ' + hex2(result.bytes[1]);
    case 'lowhigh': return 'LOW=' + hex2(result.low) + ' HIGH=' + hex2(result.high);
    case 'full':
    default:
      return 'CRC=0x' + hex4(result.crc) +
             ' (HIGH=' + hex2(result.high) + ', LOW=' + hex2(result.low) + ')' +
             ' 帧尾追加: ' + hex2(result.bytes[0]) + ' ' + hex2(result.bytes[1]);
  }
}`;

// 把源码注入到页面（去掉模板字符串转义）
document.getElementById('srcCode').textContent = SRC_CODE
  .replace(/\\\\/g, '\\').replace(/\\'/g, "'").replace(/\\n/g, '\n');

/* ============================================================
 * 实际可执行的核心函数（与上面展示的源码逻辑一致）
 * ============================================================ */
function buildCRCTable() {
  const table = new Uint16Array(256);
  for (let i = 0; i < 256; i++) {
    let crc = i;
    for (let j = 0; j < 8; j++) {
      crc = (crc & 1) ? ((crc >>> 1) ^ 0xA001) : (crc >>> 1);
    }
    table[i] = crc & 0xFFFF;
  }
  return table;
}
const CRC_TABLE = buildCRCTable();

function calculateCRC16(data) {
  if (data == null) throw new TypeError('data 不能为 null 或 undefined');
  if (typeof data === 'string') throw new TypeError('data 必须是字节数组');
  if (typeof data.length !== 'number') throw new TypeError('data 必须是类数组');
  let crc = 0xFFFF;
  for (let i = 0; i < data.length; i++) {
    const b = data[i];
    if (typeof b !== 'number' || !Number.isFinite(b))
      throw new RangeError('元素必须是有限数字: ' + b);
    if (b < 0 || b > 255 || (b | 0) !== b)
      throw new RangeError('元素必须是 0~255 的整数: ' + b);
    crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ b) & 0xFF];
  }
  crc &= 0xFFFF;
  return {
    crc,
    high: (crc >> 8) & 0xFF,
    low: crc & 0xFF,
    bytes: new Uint8Array([crc & 0xFF, (crc >> 8) & 0xFF])
  };
}

function parseHexString(str) {
  if (typeof str !== 'string') throw new TypeError('str 必须是字符串');
  const s = str.trim().replace(/0x/gi, '').replace(/\s+/g, ' ');
  if (s.length === 0) return [];
  if (!s.includes(' ') && s.length % 2 !== 0)
    throw new Error('HEX 字符串长度必须为偶数: ' + str);
  const parts = s.includes(' ') ? s.split(/\s+/) : s.match(/.{1,2}/g);
  const result = [];
  for (const p of parts) {
    if (!/^[0-9a-fA-F]+$/.test(p)) throw new Error('非法 HEX 字符: ' + p);
    const v = parseInt(p, 16);
    if (v < 0 || v > 255) throw new RangeError('字节超出范围: ' + p);
    result.push(v);
  }
  return result;
}

function asciiToBytes(str) {
  if (typeof str !== 'string') throw new TypeError('str 必须是字符串');
  const arr = [];
  for (let i = 0; i < str.length; i++) {
    const code = str.charCodeAt(i);
    if (code > 0xFF) throw new RangeError('非 ASCII 字符: ' + str[i]);
    arr.push(code);
  }
  return arr;
}

function formatCRC(result, format = 'full') {
  if (result == null || typeof result !== 'object')
    throw new TypeError('result 必须是对象');
  const hex2 = n => n.toString(16).toUpperCase().padStart(2, '0');
  const hex4 = n => n.toString(16).toUpperCase().padStart(4, '0');
  switch (format) {
    case 'hex': return '0x' + hex4(result.crc);
    case 'bytes': return hex2(result.bytes[0]) + ' ' + hex2(result.bytes[1]);
    case 'lowhigh': return 'LOW=' + hex2(result.low) + ' HIGH=' + hex2(result.high);
    default:
      return 'CRC=0x' + hex4(result.crc) +
             ' (HIGH=' + hex2(result.high) + ', LOW=' + hex2(result.low) + ')' +
             ' 帧尾追加: ' + hex2(result.bytes[0]) + ' ' + hex2(result.bytes[1]);
  }
}

/* ============================================================
 * 计算器 UI
 * ============================================================ */
function loadExample() {
  document.getElementById('inputFormat').value = 'hex-space';
  document.getElementById('inputData').value = '01 03 00 00 00 01';
}

function doCalc() {
  const fmt = document.getElementById('inputFormat').value;
  const raw = document.getElementById('inputData').value;
  const box = document.getElementById('calcResult');
  box.style.display = 'block';
  try {
    let bytes;
    if (fmt === 'ascii') bytes = asciiToBytes(raw);
    else bytes = parseHexString(raw);
    const r = calculateCRC16(bytes);
    const hex2 = n => n.toString(16).toUpperCase().padStart(2, '0');
    const hex4 = n => n.toString(16).toUpperCase().padStart(4, '0');
    const frameBytes = bytes.concat([r.bytes[0], r.bytes[1]])
      .map(b => hex2(b)).join(' ');
    box.innerHTML = `
      <div class="row"><span class="label">输入字节：</span>${bytes.map(b=>hex2(b)).join(' ')}</div>
      <div class="row"><span class="label">CRC16 值：</span>0x${hex4(r.crc)}（十进制 ${r.crc}）</div>
      <div class="row"><span class="label">高字节 (CRC Hi)：</span>0x${hex2(r.high)}</div>
      <div class="row"><span class="label">低字节 (CRC Lo)：</span>0x${hex2(r.low)}</div>
      <div class="row"><span class="label">帧尾追加顺序：</span>${hex2(r.bytes[0])} ${hex2(r.bytes[1])}（低字节在前）</div>
      <div class="row"><span class="label">完整 RTU 帧：</span>${frameBytes}</div>
    `;
  } catch (e) {
    box.innerHTML = '<span style="color:#c00;">错误：' + e.message + '</span>';
  }
}

/* ============================================================
 * 第二部分：单元测试（32 个用例）
 * ============================================================ */
const TESTS = [
  // —— 标准测试向量（来自 Modbus 规范与公开实现交叉验证）——
  { name: '标准向量 "123456789" ASCII → CRC=0x4B37',
    fn: () => { const r = calculateCRC16(asciiToBytes("123456789")); return r.crc === 0x4B37; } },
  { name: '读保持寄存器请求 01 03 00 00 00 01 → CRC=0x0A84',
    fn: () => { const r = calculateCRC16([0x01,0x03,0x00,0x00,0x00,0x01]); return r.crc === 0x0A84; } },
  { name: '帧尾字节顺序：低字节在前 [0x84, 0x0A]',
    fn: () => { const r = calculateCRC16([0x01,0x03,0x00,0x00,0x00,0x01]);
      return r.bytes[0]===0x84 && r.bytes[1]===0x0A; } },

  // —— 正常值：不同长度数据 ——
  { name: '单字节 [0x00] → CRC=0xFF41（需查表验证）',
    fn: () => { const r = calculateCRC16([0x00]); return r.crc === 0xFF41; } },
  { name: '单字节 [0xFF]',
    fn: () => { const r = calculateCRC16([0xFF]); return typeof r.crc === 'number' && r.crc >= 0 && r.crc <= 0xFFFF; } },
  { name: '双字节 [0x01, 0x02]',
    fn: () => { const r = calculateCRC16([0x01,0x02]); return r.crc >= 0 && r.crc <= 0xFFFF; } },
  { name: '全零 8 字节',
    fn: () => { const r = calculateCRC16([0,0,0,0,0,0,0,0]); return r.crc >= 0; } },
  { name: '全 0xFF 8 字节',
    fn: () => { const r = calculateCRC16([255,255,255,255,255,255,255,255]); return r.crc >= 0; } },
  { name: '递增序列 0..15',
    fn: () => { const arr = Array.from({length:16},(_,i)=>i);
      const r = calculateCRC16(arr); return r.crc >= 0; } },

  // —— 边界值 ——
  { name: '空数组 → CRC=0xFFFF（初始值）',
    fn: () => { const r = calculateCRC16([]); return r.crc === 0xFFFF; } },
  { name: 'Uint8Array 输入',
    fn: () => { const r = calculateCRC16(new Uint8Array([0x01,0x03,0x00,0x00,0x00,0x01]));
      return r.crc === 0x0A84; } },
  { name: '字节最小值 0',
    fn: () => { const r = calculateCRC16([0]); return r.crc >= 0; } },
  { name: '字节最大值 255',
    fn: () => { const r = calculateCRC16([255]); return r.crc >= 0; } },
  { name: 'CRC 结果始终在 0~65535 范围',
    fn: () => { const r = calculateCRC16([0x12,0x34,0x56,0x78,0x9A,0xBC,0xDE,0xF0]);
      return r.crc >= 0 && r.crc <= 0xFFFF && r.high <= 0xFF && r.low <= 0xFF; } },

  // —— 异常输入 ——
  { name: 'null 输入抛 TypeError',
    fn: () => { try { calculateCRC16(null); return false; } catch(e) { return e instanceof TypeError; } } },
  { name: 'undefined 输入抛 TypeError',
    fn: () => { try { calculateCRC16(undefined); return false; } catch(e) { return e instanceof TypeError; } } },
  { name: '字符串直接输入抛 TypeError',

function runAllTests() {
  const log = document.getElementById('testLog');
  const sum = document.getElementById('testSummary');
  log.innerHTML = '';
  let pass = 0, fail = 0;
  const lines = [];
  TESTS.forEach((t, i) => {
    let ok = false, msg = '';
    try {
      ok = !!t.fn();
    } catch (e) {
      msg = ' 异常: ' + e.message;
    }
    if (ok) {
      pass++;
      lines.push(`<span class="log-ok">✓ #${(i+1).toString().padStart(2,'0')} ${t.name}</span>`);
    } else {
      fail++;
      lines.push(`<span class="log-err">✗ #${(i+1).toString().padStart(2,'0')} ${t.name}${msg}</span>`);
    }
  });
  log.innerHTML = lines.join('<br>');
  const total = TESTS.length;
  if (fail === 0) {
    sum.className = 'test-summary test-pass';
    sum.textContent = `通过 ${pass} / 共 ${total}`;
  } else {
    sum.className = 'test-summary test-fail';
    sum.textContent = `通过 ${pass} / 共 ${total}（失败 ${fail}）`;
  }
}

<table>
