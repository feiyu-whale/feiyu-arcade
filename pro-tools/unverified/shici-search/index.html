<script>
/* ============================================================
 * 第一部分：诗词数据（公有领域，真实出处）
 * ============================================================ */
const POEMS_DATA = [
  // 先秦·诗经
  {id:1,title:"关雎",author:"佚名",dynasty:"先秦",content:["关关雎鸠，在河之洲。","窈窕淑女，君子好逑。","参差荇菜，左右流之。","窈窕淑女，寤寐求之。","求之不得，寤寐思服。","悠哉悠哉，辗转反侧。","参差荇菜，左右采之。","窈窕淑女，琴瑟友之。","参差荇菜，左右芼之。","窈窕淑女，钟鼓乐之。"],tags:["爱情","诗经","国风"]},
  {id:2,title:"蒹葭",author:"佚名",dynasty:"先秦",content:["蒹葭苍苍，白露为霜。","所谓伊人，在水一方。","溯洄从之，道阻且长。","溯游从之，宛在水中央。","蒹葭萋萋，白露未晞。","所谓伊人，在水之湄。","溯洄从之，道阻且跻。","溯游从之，宛在水中坻。","蒹葭采采，白露未已。","所谓伊人，在水之涘。","溯洄从之，道阻且右。","溯游从之，宛在水中沚。"],tags:["爱情","诗经","秦风"]},
  {id:3,title:"桃夭",author:"佚名",dynasty:"先秦",content:["桃之夭夭，灼灼其华。","之子于归，宜其室家。","桃之夭夭，有蕡其实。","之子于归，宜其家室。","桃之夭夭，其叶蓁蓁。","之子于归，宜其家人。"],tags:["婚姻","诗经","周南"]},
  {id:4,title:"硕鼠",author:"佚名",dynasty:"先秦",content:["硕鼠硕鼠，无食我黍！","三岁贯女，莫我肯顾。","逝将去女，适彼乐土。","乐土乐土，爰得我所。","硕鼠硕鼠，无食我麦！","三岁贯女，莫我肯德。","逝将去女，适彼乐国。","乐国乐国，爰得我直。","硕鼠硕鼠，无食我苗！","三岁贯女，莫我肯劳。","逝将去女，适彼乐郊。","乐郊乐郊，谁之永号？"],tags:["讽刺","诗经","魏风"]},
  {id:5,title:"采薇（节选）",author:"佚名",dynasty:"先秦",content:["采薇采薇，薇亦作止。","曰归曰归，岁亦莫止。","靡室靡家，猃狁之故。","不遑启居，猃狁之故。","昔我往矣，杨柳依依。","今我来思，雨雪霏霏。","行道迟迟，载渴载饥。","我心伤悲，莫知我哀！"],tags:["战争","思乡","诗经","小雅"]},
  {id:6,title:"黍离",author:"佚名",dynasty:"先秦",content:["彼黍离离，彼稷之苗。","行迈靡靡，中心摇摇。","知我者，谓我心忧；","不知我者，谓我何求。","悠悠苍天，此何人哉？","彼黍离离，彼稷之穗。","行迈靡靡，中心如醉。","知我者，谓我心忧；","不知我者，谓我何求。","悠悠苍天，此何人哉？"],tags:["忧国","诗经","王风"]},
  {id:7,title:"木瓜",author:"佚名",dynasty:"先秦",content:["投我以木瓜，报之以琼琚。","匪报也，永以为好也！","投我以木桃，报之以琼瑶。","匪报也，永以为好也！","投我以木李，报之以琼玖。","匪报也，永以为好也！"],tags:["友情","诗经","卫风"]},
  {id:8,title:"击鼓",author:"佚名",dynasty:"先秦",content:["击鼓其镗，踊跃用兵。","土国城漕，我独南行。","从孙子仲，平陈与宋。","不我以归，忧心有忡。","爰居爰处？爰丧其马？","于以求之？于林之下。","死生契阔，与子成说。","执子之手，与子偕老。","于嗟阔兮，不我活兮。","于嗟洵兮，不我信兮。"],tags:["战争","爱情","诗经","邶风"]},
  {id:9,title:"柏舟",author:"佚名",dynasty:"先秦",content:["泛彼柏舟，亦泛其流。","耿耿不寐，如有隐忧。","微我无酒，以敖以游。","我心匪鉴，不可以茹。","亦有兄弟，不可以据。","薄言往愬，逢彼之怒。","我心匪石，不可转也。","我心匪席，不可卷也。","威仪棣棣，不可选也。"],tags:["忧愤","诗经","邶风"]},
  {id:10,title:"离骚（节选）",author:"屈原",dynasty:"先秦",content:["帝高阳之苗裔兮，朕皇考曰伯庸。","摄提贞于孟陬兮，惟庚寅吾以降。","皇览揆余初度兮，肇锡余以嘉名：","名余曰正则兮，字余曰灵均。","纷吾既有此内美兮，又重之以修能。","扈江离与辟芷兮，纫秋兰以为佩。","汩余若将不及兮，恐年岁之不吾与。","朝搴阰之木兰兮，夕揽洲之宿莽。","日月忽其不淹兮，春与秋其代序。","惟草木之零落兮，恐美人之迟暮。","路漫漫其修远兮，吾将上下而求索。","长太息以掩涕兮，哀民生之多艰。","亦余心之所善兮，虽九死其犹未悔。"],tags:["楚辞","抒怀","理想"]},
  {id:11,title:"九歌·湘夫人",author:"屈原",dynasty:"先秦",content:["帝子降兮北渚，目眇眇兮愁予。","袅袅兮秋风，洞庭波兮木叶下。","登白薠兮骋望，与佳期兮夕张。","鸟何萃兮蘋中，罾何为兮木上？","沅有芷兮澧有兰，思公子兮未敢言。","荒忽兮远望，观流水兮潺湲。"],tags:["楚辞","爱情","九歌"]},
  {id:12,title:"九章·涉江（节选）",author:"屈原",dynasty:"先秦",content:["余幼好此奇服兮，年既老而不衰。","带长铗之陆离兮，冠切云之崔嵬。","被明月兮佩宝璐。","世溷浊而莫余知兮，吾方高驰而不顾。","驾青虬兮骖白螭，吾与重华游兮瑶之圃。","登昆仑兮食玉英，与天地兮同寿，","与日月兮同光。"],tags:["楚辞","抒怀","九章"]},

  // 汉魏六朝
  {id:13,title:"长歌行",author:"佚名",dynasty:"汉",content:["青青园中葵，朝露待日晞。","阳春布德泽，万物生光辉。","常恐秋节至，焜黄华叶衰。","百川东到海，何时复西归？","少壮不努力，老大徒伤悲！"],tags:["劝学","乐府","惜时"]},
  {id:14,title:"上邪",author:"佚名",dynasty:"汉",content:["上邪！","我欲与君相知，长命无绝衰。","山无陵，江水为竭，","冬雷震震，夏雨雪，","天地合，乃敢与君绝！"],tags:["爱情","乐府","誓言"]},
  {id:15,title:"十五从军征",author:"佚名",dynasty:"汉",content:["十五从军征，八十始得归。","道逢乡里人：家中有阿谁？","遥看是君家，松柏冢累累。","兔从狗窦入，雉从梁上飞。","中庭生旅谷，井上生旅葵。","舂谷持作饭，采葵持作羹。","羹饭一时熟，不知饴阿谁。","出门东向看，泪落沾我衣。"],tags:["战争","乐府","悲苦"]},
  {id:16,title:"陌上桑（节选）",author:"佚名",dynasty:"汉",content:["日出东南隅，照我秦氏楼。","秦氏有好女，自名为罗敷。","罗敷喜蚕桑，采桑城南隅。","青丝为笼系，桂枝为笼钩。","头上倭堕髻，耳中明月珠。","缃绮为下裙，紫绮为上襦。","行者见罗敷，下担捋髭须。","少年见罗敷，脱帽著帩头。","耕者忘其犁，锄者忘其锄。","来归相怨怒，但坐观罗敷。"],tags:["乐府","人物","叙事"]},
  {id:17,title:"短歌行",author:"曹操",dynasty:"汉",content:["对酒当歌，人生几何！","譬如朝露，去日苦多。","慨当以慷，忧思难忘。","何以解忧？唯有杜康。","青青子衿，悠悠我心。","但为君故，沉吟至今。","呦呦鹿鸣，食野之苹。","我有嘉宾，鼓瑟吹笙。","明明如月，何时可掇？","忧从中来，不可断绝。","越陌度阡，枉用相存。","契阔谈讌，心念旧恩。","月明星稀，乌鹊南飞。","绕树三匝，何枝可依？","山不厌高，海不厌深。","周公吐哺，天下归心。"],tags:["抒怀","求贤","乐府"]},
  {id:18,title:"观沧海",author:"曹操",dynasty:"汉",content:["东临碣石，以观沧海。","水何澹澹，山岛竦峙。","树木丛生，百草丰茂。","秋风萧瑟，洪波涌起。","日月之行，若出其中；","星汉灿烂，若出其里。","幸甚至哉，歌以咏志。"],tags:["写景","抒怀","乐府"]},
  {id:19,title:"龟虽寿",author:"曹操",dynasty:"汉",content:["神龟虽寿，犹有竟时。","腾蛇乘雾，终为土灰。","老骥伏枥，志在千里。","烈士暮年，壮心不已。","盈缩之期，不但在天；","养怡之福，可得永年。","幸甚至哉，歌以咏志。"],tags:["抒怀","励志","乐府"]},
  {id:20,title:"七步诗",author:"曹植",dynasty:"汉",content:["煮豆持作羹，漉菽以为汁。","萁在釜下燃，豆在釜中泣。","本自同根生，相煎何太急？"],tags:["兄弟","讽喻"]},
  {id:21,title:"饮酒·其五",author:"陶渊明",dynasty:"魏晋",content:["结庐在人境，而无车马喧。","问君何能尔？心远地自偏。","采菊东篱下，悠然见南山。","山气日夕佳，飞鸟相与还。","此中有真意，欲辨已忘言。"],tags:["田园","隐逸","哲理"]},
  {id:22,title:"归园田居·其一",author:"陶渊明",dynasty:"魏晋",content:["少无适俗韵，性本爱丘山。","误落尘网中，一去三十年。","羁鸟恋旧林，池鱼思故渊。","开荒南野际，守拙归园田。","方宅十余亩，草屋八九间。","榆柳荫后檐，桃李罗堂前。","暧暧远人村，依依墟里烟。","狗吠深巷中，鸡鸣桑树颠。","户庭无尘杂，虚室有余闲。","久在樊笼里，复得返自然。"],tags:["田园","隐逸"]},
  {id:23,title:"归园田居·其三",author:"陶渊明",dynasty:"魏晋",content:["种豆南山下，草盛豆苗稀。","晨兴理荒秽，带月荷锄归。","道狭草木长，夕露沾我衣。","衣沾不足惜，但使愿无违。"],tags:["田园","劳动"]},
  {id:24,title:"敕勒歌",author:"佚名",dynasty:"南北朝",content:["敕勒川，阴山下。","天似穹庐，笼盖四野。","天苍苍，野茫茫，","风吹草低见牛羊。"],tags:["民歌","写景","北方"]},
  {id:25,title:"木兰诗（节选）",author:"佚名",dynasty:"南北朝",content:["唧唧复唧唧，木兰当户织。","不闻机杼声，唯闻女叹息。","问女何所思，问女何所忆。","女亦无所思，女亦无所忆。","昨夜见军帖，可汗大点兵，","军书十二卷，卷卷有爷名。","阿爷无大儿，木兰无长兄，","愿为市鞍马，从此替爷征。","万里赴戎机，关山度若飞。","朔气传金柝，寒光照铁衣。","将军百战死，壮士十年归。","归来见天子，天子坐明堂。","策勋十二转，赏赐百千强。","可汗问所欲，木兰不用尚书郎，","愿驰千里足，送儿还故乡。","雄兔脚扑朔，雌兔眼迷离；","双兔傍地走，安能辨我是雄雌？"],tags:["乐府","叙事","女英雄"]},
  {id:26,title:"西洲曲（节选）",author:"佚名",dynasty:"南北朝",content:["忆梅下西洲，折梅寄江北。","单衫杏子红，双鬓鸦雏色。","西洲在何处？两桨桥头渡。","日暮伯劳飞，风吹乌臼树。","树下即门前，门中露翠钿。","开门郎不至，出门采红莲。","采莲南塘秋，莲花过人头。","低头弄莲子，莲子清如水。","置莲怀袖中，莲心彻底红。","忆郎郎不至，仰首望飞鸿。"],tags:["爱情","民歌","南朝"]},

  // 唐代
  {id:27,title:"送杜少府之任蜀州",author:"王勃",dynasty:"唐",content:["城阙辅三秦，风烟望五津。","与君离别意，同是宦游人。","海内存知己，天涯若比邻。","无为在歧路，儿女共沾巾。"],tags:["送别","友情"]},
  {id:28,title:"滕王阁诗",author:"王勃",dynasty:"唐",content:["滕王高阁临江渚，佩玉鸣鸾罢歌舞。","画栋朝飞南浦云，珠帘暮卷西山雨。","闲云潭影日悠悠，物换星移几度秋。","阁中帝子今何在？槛外长江空自流。"],tags:["怀古","写景"]},
  {id:29,title:"春江花月夜",author:"张若虚",dynasty:"唐",content:["春江潮水连海平，海上明月共潮生。","滟滟随波千万里，何处春江无月明！","江流宛转绕芳甸，月照花林皆似霰。","空里流霜不觉飞，汀上白沙看不见。","江天一色无纤尘，皎皎空中孤月轮。","江畔何人初见月？江月何年初照人？","人生代代无穷已，江月年年望相似。","不知江月待何人，但见长江送流水。","白云一片去悠悠，青枫浦上不胜愁。","谁家今夜扁舟子？何处相思明月楼？","可怜楼上月裴回，应照离人妆镜台。","玉户帘中卷不去，捣衣砧上拂还来。","此时相望不相闻，愿逐月华流照君。","鸿雁长飞光不度，鱼龙潜跃水成文。","昨夜闲潭梦落花，可怜春半不还家。","江水流春去欲尽，江潭落月复西斜。","斜月沉沉藏海雾，碣石潇湘无限路。","不知乘月几人归，落月摇情满江树。"],tags:["月","爱情","哲理","长篇"]},
  {id:30,title:"登鹳雀楼",author:"王之涣",dynasty:"唐",content:["白日依山尽，黄河入海流。","欲穷千里目，更上一层楼。"],tags:["哲理","写景","励志"]},
  {id:31,title:"凉州词",author:"王之涣",dynasty:"唐",content:["黄河远上白云间，一片孤城万仞山。","羌笛何须怨杨柳，春风不度玉门关。"],tags:["边塞","思乡"]},
  {id:32,title:"凉州词",author:"王翰",dynasty:"唐",content:["葡萄美酒夜光杯，欲饮琵琶马上催。","醉卧沙场君莫笑，古来征战几人回？"],tags:["边塞","战争","豪放"]},
  {id:33,title:"咏柳",author:"贺知章",dynasty:"唐",content:["碧玉妆成一树高，万条垂下绿丝绦。","不知细叶谁裁出，二月春风似剪刀。"],tags:["咏物","春天"]},
  {id:34,title:"回乡偶书",author:"贺知章",dynasty:"唐",content:["少小离家老大回，乡音无改鬓毛衰。","儿童相见不相识，笑问客从何处来。"],tags:["思乡","感怀"]},
  {id:35,title:"回乡偶书·其二",author:"贺知章",dynasty:"唐",content:["离别家乡岁月多，近来人事半消磨。","惟有门前镜湖水，春风不改旧时波。"],tags:["思乡","感怀"]},
  {id:36,title:"望月怀远",author:"张九龄",dynasty:"唐",content:["海上生明月，天涯共此时。","情人怨遥夜，竟夕起相思。","灭烛怜光满，披衣觉露滋。","不堪盈手赠，还寝梦佳期。"],tags:["月","思乡","爱情"]},
  {id:37,title:"感遇·其一",author:"张九龄",dynasty:"唐",content:["兰叶春葳蕤，桂华秋皎洁。","欣欣此生意，自尔为佳节。","谁知林栖者，闻风坐相悦。","草木有本心，何求美人折！"],tags:["咏物","抒怀"]},
  {id:38,title:"登幽州台歌",author:"陈子昂",dynasty:"唐",content:["前不见古人，后不见来者。","念天地之悠悠，独怆然而涕下！"],tags:["怀古","孤独","抒怀"]},
  {id:39,title:"春晓",author:"孟浩然",dynasty:"唐",content:["春眠不觉晓，处处闻啼鸟。","夜来风雨声，花落知多少。"],tags:["春天","写景"]},
  {id:40,title:"过故人庄",author:"孟浩然",dynasty:"唐",content:["故人具鸡黍，邀我至田家。","绿树村边合，青山郭外斜。","开轩面场圃，把酒话桑麻。","待到重阳日，还来就菊花。"],tags:["田园","友情"]},
  {id:41,title:"宿建德江",author:"孟浩然",dynasty:"唐",content:["移舟泊烟渚，日暮客愁新。","野旷天低树，江清月近人。"],tags:["写景","思乡","月"]},
  {id:42,title:"望洞庭湖赠张丞相",author:"孟浩然",dynasty:"唐",content:["八月湖水平，涵虚混太清。","气蒸云梦泽，波撼岳阳城。","欲济无舟楫，端居耻圣明。","坐观垂钓者，徒有羡鱼情。"],tags:["写景","抒怀","干谒"]},
  {id:43,title:"出塞",author:"王昌龄",dynasty:"唐",content:["秦时明月汉时关，万里长征人未还。","但使龙城飞将在，不教胡马度阴山。"],tags:["边塞","战争"]},
  {id:44,title:"芙蓉楼送辛渐",author:"王昌龄",dynasty:"唐",content:["寒雨连江夜入吴，平明送客楚山孤。","洛阳亲友如相问，一片冰心在玉壶。"],tags:["送别","品格"]},
  {id:45,title:"从军行·其四",author:"王昌龄",dynasty:"唐",content:["青海长云暗雪山，孤城遥望玉门关。","黄沙百战穿金甲，不破楼兰终不还。"],tags:["边塞","战争","壮志"]},
  {id:46,title:"闺怨",author:"王昌龄",dynasty:"唐",content:["闺中少妇不知愁，春日凝妆上翠楼。","忽见陌头杨柳色，悔教夫婿觅封侯。"],tags:["闺怨","战争"]},
  {id:47,title:"别董大",author:"高适",dynasty:"唐",content:["千里黄云白日曛，北风吹雁雪纷纷。","莫愁前路无知己，天下谁人不识君。"],tags:["送别","友情","励志"]},
  {id:48,title:"白雪歌送武判官归京",author:"岑参",dynasty:"唐",content:["北风卷地白草折，胡天八月即飞雪。","忽如一夜春风来，千树万树梨花开。","散入珠帘湿罗幕，狐裘不暖锦衾薄。","将军角弓不得控，都护铁衣冷难着。","瀚海阑干百丈冰，愁云惨淡万里凝。","中军置酒饮归客，胡琴琵琶与羌笛。","纷纷暮雪下辕门，风掣红旗冻不翻。","轮台东门送君去，去时雪满天山路。","山回路转不见君，雪上空留马行处。"],tags:["边塞","送别","雪"]},
  {id:49,title:"走马川行奉送封大夫出师西征（节选）",author:"岑参",dynasty:"唐",content:["君不见走马川行雪海边，平沙莽莽黄入天。","轮台九月风夜吼，一川碎石大如斗，随风满地石乱走。","匈奴草黄马正肥，金山西见烟尘飞，汉家大将西出师。","将军金甲夜不脱，半夜军行戈相拨，风头如刀面如割。","马毛带雪汗气蒸，五花连钱旋作冰，幕中草檄砚水凝。","虏骑闻之应胆慑，料知短兵不敢接，车师西门伫献捷。"],tags:["边塞","战争"]},
  {id:50,title:"静夜思",author:"李白",dynasty:"唐",content:["床前明月光，疑是地上霜。","举头望明月，低头思故乡。"],tags:["月","思乡"]},
  {id:51,title:"将进酒",author:"李白",dynasty:"唐",content:["君不见黄河之水天上来，奔流到海不复回。","君不见高堂明镜悲白发，朝如青丝暮成雪。","人生得意须尽欢，莫使金樽空对月。","天生我材必有用，千金散尽还复来。","烹羊宰牛且为乐，会须一饮三百杯。","岑夫子，丹丘生，将进酒，杯莫停。","与君歌一曲，请君为我倾耳听。","钟鼓馔玉不足贵，但愿长醉不愿醒。","古来圣贤皆寂寞，惟有饮者留其名。","陈王昔时宴平乐，斗酒十千恣欢谑。","主人何为言少钱，径须沽取对君酌。","五花马、千金裘，呼儿将出换美酒，与尔同销万古愁。"],tags:["豪放","饮酒","抒怀"]},
  {id:52,title:"望庐山瀑布",author:"李白",dynasty:"唐",content:["日照香炉生紫烟，遥看瀑布挂前川。","飞流直下三千尺，疑是银河落九天。"],tags:["写景","山水","夸张"]},
  {id:53,title:"早发白帝城",author:"李白",dynasty:"唐",content:["朝辞白帝彩云间，千里江陵一日还。","两岸猿声啼不住，轻舟已过万重山。"],tags:["写景","行旅","欢快"]},
  {id:54,title:"行路难·其一",author:"李白",dynasty:"唐",content:["金樽清酒斗十千，玉盘珍羞直万钱。","停杯投箸不能食，拔剑四顾心茫然。","欲渡黄河冰塞川，将登太行雪满山。","闲来垂钓碧溪上，忽复乘舟梦日边。","行路难，行路难，多歧路，今安在？","长风破浪会有时，直挂云帆济沧海。"],tags:["抒怀","励志","失意"]},
  {id:55,title:"月下独酌",author:"李白",dynasty:"唐",content:["花间一壶酒，独酌无相亲。","举杯邀明月，对影成三人。","月既不解饮，影徒随我身。","暂伴月将影，行乐须及春。","我歌月裴回，我舞影零乱。","醒时同交欢，醉后各分散。","永结无情游，相期邈云汉。"],tags:["月","孤独","饮酒"]},
  {id:56,title:"送友人",author:"李白",dynasty:"唐",content:["青山横北郭，白水绕东城。","此地一为别，孤蓬万里征。","浮云游子意，落日故人情。","挥手自兹去，萧萧班马鸣。"],tags:["送别","友情"]},
  {id:57,title:"渡荆门送别",author:"李白",dynasty:"唐",content:["渡远荆门外，来从楚国游。","山随平野尽，江入大荒流。","月下飞天镜，云生结海楼。","仍怜故乡水，万里送行舟。"],tags:["写景","送别","思乡"]},
  {id:58,title:"宣州谢朓楼饯别校书叔云",author:"李白",dynasty:"唐",content:["弃我去者，昨日之日不可留；","乱我心者，今日之日多烦忧。","长风万里送秋雁，对此可以酣高楼。","蓬莱文章建安骨，中间小谢又清发。","俱怀逸兴壮思飞，欲上青天览明月。","抽刀断水水更流，举杯消愁愁更愁。","人生在世不称意，明朝散发弄扁舟。"],tags:["抒怀","送别","失意"]},
  {id:59,title:"蜀道难（节选）",author:"李白",dynasty:"唐",content:["噫吁嚱，危乎高哉！","蜀道之难，难于上青天！","蚕丛及鱼凫，开国何茫然！","尔来四万八千岁，不与秦塞通人烟。","西当太白有鸟道，可以横绝峨眉巅。","地崩山摧壮士死，然后天梯石栈相钩连。","上有六龙回日之高标，下有冲波逆折之回川。","黄鹤之飞尚不得过，猿猱欲度愁攀援。","青泥何盘盘，百步九折萦岩峦。","扪参历井仰胁息，以手抚膺坐长叹。","问君西游何时还？畏途巉岩不可攀。","但见悲鸟号古木，雄飞雌从绕林间。","又闻子规啼夜月，愁空山。","蜀道之难，难于上青天，使人听此凋朱颜！","连峰去天不盈尺，枯松倒挂倚绝壁。","飞湍瀑流争喧豗，砯崖转石万壑雷。","其险也如此，嗟尔远道之人胡为乎来哉！","剑阁峥嵘而崔嵬，一夫当关，万夫莫开。","所守或匪亲，化为狼与豺。","朝避猛虎，夕避长蛇；","磨牙吮血，杀人如麻。","锦城虽云乐，不如早还家。","蜀道之难，难于上青天，侧身西望长咨嗟！"],tags:["山水","险峻","长篇"]},
  {id:60,title:"梦游天姥吟留别（节选）",author:"李白",dynasty:"唐",content:["海客谈瀛洲，烟涛微茫信难求；","越人语天姥，云霞明灭或可睹。","天姥连天向天横，势拔五岳掩赤城。","天台四万八千丈，对此欲倒东南倾。","我欲因之梦吴越，一夜飞度镜湖月。","湖月照我影，送我至剡溪。","谢公宿处今尚在，渌水荡漾清猿啼。","脚著谢公屐，身登青云梯。","半壁见海日，空中闻天鸡。","千岩万转路不定，迷花倚石忽已暝。","熊咆龙吟殷岩泉，栗深林兮惊层巅。","云青青兮欲雨，水澹澹兮生烟。","列缺霹雳，丘峦崩摧。","洞天石扉，訇然中开。","青冥浩荡不见底，日月照耀金银台。","霓为衣兮风为马，云之君兮纷纷而来下。","虎鼓瑟兮鸾回车，仙之人兮列如麻。","忽魂悸以魄动，恍惊起而长嗟。","惟觉时之枕席，失向来之烟霞。","世间行乐亦如此，古来万事东流水。","别君去兮何时还？且放白鹿青崖间，须行即骑访名山。","安能摧眉折腰事权贵，使我不得开心颜！"],tags:["游仙","抒怀","长篇"]},
  {id:61,title:"独坐敬亭山",author:"李白",dynasty:"唐",content:["众鸟高飞尽，孤云独去闲。","相看两不厌，只有敬亭山。"],tags:["山水","孤独"]},
  {id:62,title:"赠汪伦",author:"李白",dynasty:"唐",content:["李白乘舟将欲行，忽闻岸上踏歌声。","桃花潭水深千尺，不及汪伦送我情。"],tags:["友情","送别"]},
  {id:63,title:"闻王昌龄左迁龙标遥有此寄",author:"李白",dynasty:"唐",content:["杨花落尽子规啼，闻道龙标过五溪。","我寄愁心与明月，随君直到夜郎西。"],tags:["友情","月","送别"]},
  {id:64,title:"黄鹤楼送孟浩然之广陵",author:"李白",dynasty:"唐",content:["故人西辞黄鹤楼，烟花三月下扬州。","孤帆远影碧空尽，唯见长江天际流。"],tags:["送别","友情","写景"]},
  {id:65,title:"望天门山",author:"李白",dynasty:"唐",content:["天门中断楚江开，碧水东流至此回。","两岸青山相对出，孤帆一片日边来。"],tags:["写景","山水"]},
  {id:66,title:"春望",author:"杜甫",dynasty:"唐",content:["国破山河在，城春草木深。","感时花溅泪，恨别鸟惊心。","烽火连三月，家书抵万金。","白头搔更短，浑欲不胜簪。"],tags:["战争","忧国","思乡"]},
  {id:67,title:"登高",author:"杜甫",dynasty:"唐",content:["风急天高猿啸哀，渚清沙白鸟飞回。","无边落木萧萧下，不尽长江滚滚来。","万里悲秋常作客，百年多病独登台。","艰难苦恨繁霜鬓，潦倒新停浊酒杯。"],tags:["秋天","抒怀","悲凉"]},
  {id:68,title:"望岳",author:"杜甫",dynasty:"唐",content:["岱宗夫如何？齐鲁青未了。","造化钟神秀，阴阳割昏晓。","荡胸生曾云，决眦入归鸟。","会当凌绝顶，一览众山小。"],tags:["山水","励志","壮志"]},
  {id:69,title:"春夜喜雨",author:"杜甫",dynasty:"唐",content:["好雨知时节，当春乃发生。","随风潜入夜，润物细无声。","野径云俱黑，江船火独明。","晓看红湿处，花重锦官城。"],tags:["春天","雨","写景"]},
  {id:70,title:"绝句",author:"杜甫",dynasty:"唐",content:["两个黄鹂鸣翠柳，一行白鹭上青天。","窗含西岭千秋雪，门泊东吴万里船。"],tags:["写景","春天"]},
  {id:71,title:"绝句",author:"杜甫",dynasty:"唐",content:["迟日江山丽，春风花草香。","泥融飞燕子，沙暖睡鸳鸯。"],tags:["写景","春天"]},
  {id:72,title:"月夜忆舍弟",author:"杜甫",dynasty:"唐",content:["戍鼓断人行，边秋一雁声。","露从今夜白，月是故乡明。","有弟皆分散，无家问死生。","寄书长不达，况乃未休兵。"],tags:["思乡","兄弟","战争","月"]},
  {id:73,title:"闻官军收河南河北",author:"杜甫",dynasty:"唐",content:["剑外忽传收蓟北，初闻涕泪满衣裳。","却看妻子愁何在，漫卷诗书喜欲狂。","白日放歌须纵酒，青春作伴好还乡。","即从巴峡穿巫峡，便下襄阳向洛阳。"],tags:["战争","喜悦","思乡"]},
  {id:74,title:"江南逢李龟年",author:"杜甫",dynasty:"唐",content:["岐王宅里寻常见，崔九堂前几度闻。","正是江南好风景，落花时节又逢君。"],tags:["感怀","友情","时代"]},
  {id:75,title:"茅屋为秋风所破歌（节选）",author:"杜甫",dynasty:"唐",content:["八月秋高风怒号，卷我屋上三重茅。","茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。","南村群童欺我老无力，忍能对面为盗贼。","公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。","俄顷风定云墨色，秋天漠漠向昏黑。","布衾多年冷似铁，娇儿恶卧踏里裂。","床头屋漏无干处，雨脚如麻未断绝。","自经丧乱少睡眠，长夜沾湿何由彻！","安得广厦千万间，大庇天下寒士俱欢颜！","风雨不动安如山。","呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！"],tags:["忧民","抒怀","长篇"]},
  {id:76,title:"兵车行（节选）",author:"杜甫",dynasty:"唐",content:["车辚辚，马萧萧，行人弓箭各在腰。","耶娘妻子走相送，尘埃不见咸阳桥。","牵衣顿足拦道哭，哭声直上干云霄。","道旁过者问行人，行人但云点行频。","或从十五北防河，便至四十西营田。","去时里正与裹头，归来头白还戍边。","边庭流血成海水，武皇开边意未已。","君不闻汉家山东二百州，千村万落生荆杞。","纵有健妇把锄犁，禾生陇亩无东西。","况复秦兵耐苦战，被驱不异犬与鸡。","长者虽有问，役夫敢申恨？","且如今年冬，未休关西卒。","县官急索租，租税从何出？","信知生男恶，反是生女好。","生女犹得嫁比邻，生男埋没随百草。","君不见青海头，古来白骨无人收。","新鬼烦冤旧鬼哭，天阴雨湿声啾啾！"],tags:["战争","忧民","长篇"]},
  {id:77,title:"石壕吏（节选）",author:"杜甫",dynasty:"唐",content:["暮投石壕村，有吏夜捉人。","老翁逾墙走，老妇出门看。","吏呼一何怒！妇啼一何苦！","听妇前致词：三男邺城戍。","一男附书至，二男新战死。","存者且偷生，死者长已矣！","室中更无人，惟有乳下孙。","有孙母未去，出入无完裙。","老妪力虽衰，请从吏夜归。","急应河阳役，犹得备晨炊。","夜久语声绝，如闻泣幽咽。","天明登前途，独与老翁别。"],tags:["战争","忧民","叙事"]},
  {id:78,title:"相思",author:"王维",dynasty:"唐",content:["红豆生南国，春来发几枝。","愿君多采撷，此物最相思。"],tags:["爱情","咏物"]},
  {id:79,title:"山居秋暝",author:"王维",dynasty:"唐",content:["空山新雨后，天气晚来秋。","明月松间照，清泉石上流。","竹喧归浣女，莲动下渔舟。","随意春芳歇，王孙自可留。"],tags:["山水","田园","秋天","月"]},
  {id:80,title:"九月九日忆山东兄弟",author:"王维",dynasty:"唐",content:["独在异乡为异客，每逢佳节倍思亲。","遥知兄弟登高处，遍插茱萸少一人。"],tags:["节日","思乡","兄弟"]},
  {id:81,title:"送元二使安西",author:"王维",dynasty:"唐",content:["渭城朝雨浥轻尘，客舍青青柳色新。","劝君更尽一杯酒，西出阳关无故人。"],tags:["送别","友情"]},
  {id:82,title:"鹿柴",author:"王维",dynasty:"唐",content:["空山不见人，但闻人语响。","返景入深林，复照青苔上。"],tags:["山水","写景"]},
  {id:83,title:"竹里馆",author:"王维",dynasty:"唐",content:["独坐幽篁里，弹琴复长啸。","深林人不知，明月来相照。"],tags:["隐逸","月","孤独"]},
  {id:84,title:"鸟鸣涧",author:"王维",dynasty:"唐",content:["人闲桂花落，夜静春山空。","月出惊山鸟，时鸣春涧中。"],tags:["山水","月","静"]},
  {id:85,title:"使至塞上",author:"王维",dynasty:"唐",content:["单车欲问边，属国过居延。","征蓬出汉塞，归雁入胡天。","大漠孤烟直，长河落日圆。","萧关逢候骑，都护在燕然。"],tags:["边塞","写景"]},
  {id:86,title:"终南别业",author:"王维",dynasty:"唐",content:["中岁颇好道，晚家南山陲。","兴来每独往，胜事空自知。","行到水穷处，坐看云起时。","偶然值林叟，谈笑无还期。"],tags:["隐逸","哲理"]},
  {id:87,title:"观猎",author:"王维",dynasty:"唐",content:["风劲角弓鸣，将军猎渭城。","草枯鹰眼疾，雪尽马蹄轻。","忽过新丰市，还归细柳营。","回看射雕处，千里暮云平。"],tags:["边塞","狩猎"]},
  {id:88,title:"赋得古原草送别",author:"白居易",dynasty:"唐",content:["离离原上草，一岁一枯荣。","野火烧不尽，春风吹又生。","远芳侵古道，晴翠接荒城。","又送王孙去，萋萋满别情。"],tags:["送别","咏物","生命力"]},
  {id:89,title:"钱塘湖春行",author:"白居易",dynasty:"唐",content:["孤山寺北贾亭西，水面初平云脚低。","几处早莺争暖树，谁家新燕啄春泥。","乱花渐欲迷人眼，浅草才能没马蹄。","最爱湖东行不足，绿杨阴里白沙堤。"],tags:["写景","春天","西湖"]},
  {id:90,title:"暮江吟",author:"白居易",dynasty:"唐",content:["一道残阳铺水中，半江瑟瑟半江红。","可怜九月初三夜，露似真珠月似弓。"],tags:["写景","月","秋天"]},
  {id:91,title:"问刘十九",author:"白居易",dynasty:"唐",content:["绿蚁新醅酒，红泥小火炉。","晚来天欲雪，能饮一杯无？"],tags:["友情","饮酒","冬天"]},
  {id:92,title:"大林寺桃花",author:"白居易",dynasty:"唐",content:["人间四月芳菲尽，山寺桃花始盛开。","长恨春归无觅处，不知转入此中来。"],tags:["写景","春天","哲理"]},
  {id:93,title:"忆江南",author:"白居易",dynasty:"唐",content:["江南好，风景旧曾谙。","日出江花红胜火，春来江水绿如蓝。","能不忆江南？"],tags:["写景","回忆","江南"]},
  {id:94,title:"琵琶行（节选）",author:"白居易",dynasty:"唐",content:["浔阳江头夜送客，枫叶荻花秋瑟瑟。","主人下马客在船，举酒欲饮无管弦。","醉不成欢惨将别，别时茫茫江浸月。","忽闻水上琵琶声，主人忘归客不发。","寻声暗问弹者谁，琵琶声停欲语迟。","移船相近邀相见，添酒回灯重开宴。","千呼万唤始出来，犹抱琵琶半遮面。","转轴拨弦三两声，未成曲调先有情。","弦弦掩抑声声思，似诉平生不得志。","低眉信手续续弹，说尽心中无限事。","轻拢慢捻抹复挑，初为《霓裳》后《六幺》。","大弦嘈嘈如急雨，小弦切切如私语。","嘈嘈切切错杂弹，大珠小珠落玉盘。","间关莺语花底滑，幽咽泉流冰下难。","冰泉冷涩弦凝绝，凝绝不通声暂歇。","别有幽愁暗恨生，此时无声胜有声。","银瓶乍破水浆迸，铁骑突出刀枪鸣。","曲终收拨当心画，四弦一声如裂帛。","东船西舫悄无言，唯见江心秋月白。","同是天涯沦落人，相逢何必曾相识！"],tags:["音乐","抒怀","长篇"]},
  {id:95,title:"长恨歌（节选）",author:"白居易",dynasty:"唐",content:["汉皇重色思倾国，御宇多年求不得。","杨家有女初长成，养在深闺人未识。","天生丽质难自弃，一朝选在君王侧。","回眸一笑百媚生，六宫粉黛无颜色。","春寒赐浴华清池，温泉水滑洗凝脂。","侍儿扶起娇无力，始是新承恩泽时。","云鬓花颜金步摇，芙蓉帐暖度春宵。","春宵苦短日高起，从此君王不早朝。","承欢侍宴无闲暇，春从春游夜专夜。","后宫佳丽三千人，三千宠爱在一身。","金屋妆成娇侍夜，玉楼宴罢醉和春。","姊妹弟兄皆列土，可怜光彩生门户。","遂令天下父母心，不重生男重生女。","骊宫高处入青云，仙乐风飘处处闻。","缓歌慢舞凝丝竹，尽日君王看不足。","渔阳鼙鼓动地来，惊破《霓裳羽衣曲》。","九重城阙烟尘生，千乘万骑西南行。","翠华摇摇行复止，西出都门百余里。","六军不发无奈何，宛转蛾眉马前死。","花钿委地无人收，翠翘金雀玉搔头。","君王掩面救不得，回看血泪相和流。","黄埃散漫风萧索，云栈萦纡登剑阁。","峨嵋山下少人行，旌旗无光日色薄。","蜀江水碧蜀山青，圣主朝朝暮暮情。","行宫见月伤心色，夜雨闻铃肠断声。","天旋地转回龙驭，到此踌躇不能去。","马嵬坡下泥土中，不见玉颜空死处。","君臣相顾尽沾衣，东望都门信马归。","归来池苑皆依旧，太液芙蓉未央柳。","芙蓉如面柳如眉，对此如何不泪垂？","春风桃李花开日，秋雨梧桐叶落时。","西宫南苑多秋草，落叶满阶红不扫。","梨园弟子白发新，椒房阿监青娥老。","夕殿萤飞思悄然，孤灯挑尽未成眠。","迟迟钟鼓初长夜，耿耿星河欲曙天。","鸳鸯瓦冷霜华重，翡翠衾寒谁与共？","悠悠生死别经年，魂魄不曾来入梦。","临邛道士鸿都客，能以精诚致魂魄。","为感君王辗转思，遂教方士殷勤觅。","排空驭气奔如电，升天入地求之遍。","上穷碧落下黄泉，两处茫茫皆不见。","忽闻海上有仙山，山在虚无缥缈间。","楼阁玲珑五云起，其中绰约多仙子。","中有一人字太真，雪肤花貌参差是。","金阙西厢叩玉扃，转教小玉报双成。","闻道汉家天子使，九华帐里梦魂惊。","揽衣推枕起裴回，珠箔银屏迤逦开。","云鬓半偏新睡觉，花冠不整下堂来。","风吹仙袂飘飖举，犹似《霓裳羽衣舞》。","玉容寂寞泪阑干，梨花一枝春带雨。","含情凝睇谢君王，一别音容两渺茫。","昭阳殿里恩爱绝，蓬莱宫中日月长。","回头下望人寰处，不见长安见尘雾。","惟将旧物表深情，钿合金钗寄将去。","钗留一股合一扇，钗擘黄金合分钿。","但教心似金钿坚，天上人间会相见。","临别殷勤重寄词，词中有誓两心知。","七月七日长生殿，夜半无人私语时。","在天愿作比翼鸟，在地愿为连理枝。","天长地久有时尽，此恨绵绵无绝期。"],tags:["爱情","长篇","叙事"]},
  {id:96,title:"锦瑟",author:"李商隐",dynasty:"唐",content:["锦瑟无端五十弦，一弦一柱思华年。","庄生晓梦迷蝴蝶，望帝春心托杜鹃。","沧海月明珠有泪，蓝田日暖玉生烟。","此情可待成追忆，只是当时已惘然。"],tags:["爱情","感怀","朦胧"]},
  {id:97,title:"无题",author:"李商隐",dynasty:"唐",content:["相见时难别亦难，东风无力百花残。","春蚕到死丝方尽，蜡炬成灰泪始干。","晓镜但愁云鬓改，夜吟应觉月光寒。","蓬山此去无多路，青鸟殷勤为探看。"],tags:["爱情","离别"]},
  {id:98,title:"夜雨寄北",author:"李商隐",dynasty:"唐",content:["君问归期未有期，巴山夜雨涨秋池。","何当共剪西窗烛，却话巴山夜雨时。"],tags:["思乡","爱情","雨"]},
  {id:99,title:"嫦娥",author:"李商隐",dynasty:"唐",content:["云母屏风烛影深，长河渐落晓星沉。","嫦娥应悔偷灵药，碧海青天夜夜心。"],tags:["月","孤独","神话"]},
  {id:100,title:"乐游原",author:"李商隐",dynasty:"唐",content:["向晚意不适，驱车登古原。","夕阳无限好，只是近黄昏。"],tags:["感怀","夕阳"]},
  {id:101,title:"清明",author:"杜牧",dynasty:"唐",content:["清明时节雨纷纷，路上行人欲断魂。","借问酒家何处有？牧童遥指杏花村。"],tags:["节日","清明","雨"]},
  {id:102,title:"泊秦淮",author:"杜牧",dynasty:"唐",content:["烟笼寒水月笼沙，夜泊秦淮近酒家。","商女不知亡国恨，隔江犹唱《后庭花》。"],tags:["怀古","讽喻","月"]},
  {id:103,title:"秋夕",author:"杜牧",dynasty:"唐",content:["银烛秋光冷画屏，轻罗小扇扑流萤。","天阶夜色凉如水，卧看牵牛织女星。"],tags:["秋天","宫怨","星"]},
  {id:104,title:"山行",author:"杜牧",dynasty:"唐",content:["远上寒山石径斜，白云生处有人家。","停车坐爱枫林晚，霜叶红于二月花。"],tags:["秋天","写景"]},
  {id:105,title:"江南春",author:"杜牧",dynasty:"唐",content:["千里莺啼绿映红，水村山郭酒旗风。","南朝四百八十寺，多少楼台烟雨中。"],tags:["写景","怀古","江南"]},
  {id:106,title:"赤壁",author:"杜牧",dynasty:"唐",content:["折戟沉沙铁未销，自将磨洗认前朝。","东风不与周郎便，铜雀春深锁二乔。"],tags:["怀古","战争"]},
  {id:107,title:"过华清宫",author:"杜牧",dynasty:"唐",content:["长安回望绣成堆，山顶千门次第开。","一骑红尘妃子笑，无人知是荔枝来。"],tags:["讽喻","历史"]},
  {id:108,title:"寄扬州韩绰判官",author:"杜牧",dynasty:"唐",content:["青山隐隐水迢迢，秋尽江南草未凋。","二十四桥明月夜，玉人何处教吹箫？"],tags:["友情","月","江南"]},
  {id:109,title:"题乌江亭",author:"杜牧",dynasty:"唐",content:["胜败兵家事不期，包羞忍耻是男儿。","江东子弟多才俊，卷土重来未可知。"],tags:["怀古","咏史"]},
  {id:110,title:"江雪",author:"柳宗元",dynasty:"唐",content:["千山鸟飞绝，万径人踪灭。","孤舟蓑笠翁，独钓寒江雪。"],tags:["冬天","雪","孤独"]},
  {id:111,title:"渔翁",author:"柳宗元",dynasty:"唐",content:["渔翁夜傍西岩宿，晓汲清湘燃楚竹。","烟销日出不见人，欸乃一声山水绿。","回看天际下中流，岩上无心云相逐。"],tags:["山水","隐逸"]},
  {id:112,title:"酬乐天扬州初逢席上见赠",author:"刘禹锡",dynasty:"唐",content:["巴山楚水凄凉地，二十三年弃置身。","怀旧空吟闻笛赋，到乡翻似烂柯人。","沉舟侧畔千帆过，病树前头万木春。","今日听君歌一曲，暂凭杯酒长精神。"],tags:["友情","哲理","抒怀"]},
  {id:113,title:"乌衣巷",author:"刘禹锡",dynasty:"唐",content:["朱雀桥边野草花，乌衣巷口夕阳斜。","旧时王谢堂前燕，飞入寻常百姓家。"],tags:["怀古","讽喻"]},
  {id:114,title:"竹枝词",author:"刘禹锡",dynasty:"唐",content:["杨柳青青江水平，闻郎江上踏歌声。","东边日出西边雨，道是无晴却有晴。"],tags:["爱情","民歌"]},
  {id:115,title:"秋词",author:"刘禹锡",dynasty:"唐",content:["自古逢秋悲寂寥，我言秋日胜春朝。","晴空一鹤排云上，便引诗情到碧霄。"],tags:["秋天","励志"]},
  {id:116,title:"望洞庭",author:"刘禹锡",dynasty:"唐",content:["湖光秋月两相和，潭面无风镜未磨。","遥望洞庭山水翠，白银盘里一青螺。"],tags:["写景","月","山水"]},
  {id:117,title:"早春呈水部张十八员外",author:"韩愈",dynasty:"唐",content:["天街小雨润如酥，草色遥看近却无。","最是一年春好处，绝胜烟柳满皇都。"],tags:["春天","写景","友情"]},
  {id:118,title:"左迁至蓝关示侄孙湘",author:"韩愈",dynasty:"唐",content:["一封朝奏九重天，夕贬潮州路八千。","欲为圣明除弊事，肯将衰朽惜残年。","云横秦岭家何在？雪拥蓝关马不前。","知汝远来应有意，好收吾骨瘴江边。"],tags:["抒怀","贬谪","亲情"]},
  {id:119,title:"题都城南庄",author:"崔护",dynasty:"唐",content:["去年今日此门中，人面桃花相映红。","人面不知何处去，桃花依旧笑春风。"],tags:["爱情","感怀"]},
  {id:120,title:"枫桥夜泊",author:"张继",dynasty:"唐",content:["月落乌啼霜满天，江枫渔火对愁眠。","姑苏城外寒山寺，夜半钟声到客船。"],tags:["月","思乡","夜景"]},
  {id:121,title:"滁州西涧",author:"韦应物",dynasty:"唐",content:["独怜幽草涧边生，上有黄鹂深树鸣。","春潮带雨晚来急，野渡无人舟自横。"],tags:["写景","隐逸"]},
  {id:122,title:"游子吟",author:"孟郊",dynasty:"唐",content:["慈母手中线，游子身上衣。","临行密密缝，意恐迟迟归。","谁言寸草心，报得三春晖。"],tags:["亲情","母爱"]},
  {id:123,title:"登科后",author:"孟郊",dynasty:"唐",content:["昔日龌龊不足夸，今朝放荡思无涯。","春风得意马蹄疾，一日看尽长安花。"],tags:["喜悦","功名"]},
  {id:124,title:"题李凝幽居",author:"贾岛",dynasty:"唐",content:["闲居少邻并，草径入荒园。","鸟宿池边树，僧敲月下门。","过桥分野色，移石动云根。","暂去还来此，幽期不负言。"],tags:["隐逸","月"]},
  {id:125,title:"寻隐者不遇",author:"贾岛",dynasty:"唐",content:["松下问童子，言师采药去。","只在此山中，云深不知处。"],tags:["隐逸","山水"]},
  {id:126,title:"雁门太守行",author:"李贺",dynasty:"唐",content:["黑云压城城欲摧，甲光向日金鳞开。","角声满天秋色里，塞上燕脂凝夜紫。","半卷红旗临易水，霜重鼓寒声不起。","报君黄金台上意，提携玉龙为君死。"],tags:["战争","边塞"]},
  {id:127,title:"李凭箜篌引（节选）",author:"李贺",dynasty:"唐",content:["吴丝蜀桐张高秋，空山凝云颓不流。","江娥啼竹素女愁，李凭中国弹箜篌。","昆山玉碎凤凰叫，芙蓉泣露香兰笑。","十二门前融冷光，二十三丝动紫皇。","女娲炼石补天处，石破天惊逗秋雨。","梦入神山教神妪，老鱼跳波瘦蛟舞。","吴质不眠倚桂树，露脚斜飞湿寒兔。"],tags:["音乐","神话"]},
  {id:128,title:"商山早行",author:"温庭筠",dynasty:"唐",content:["晨起动征铎，客行悲故乡。","鸡声茅店月，人迹板桥霜。","槲叶落山路，枳花明驿墙。","因思杜陵梦，凫雁满回塘。"],tags:["行旅","思乡","月"]},
  {id:129,title:"菩萨蛮",author:"温庭筠",dynasty:"唐",content:["小山重叠金明灭，鬓云欲度香腮雪。","懒起画蛾眉，弄妆梳洗迟。","照花前后镜，花面交相映。","新帖绣罗襦，双双金鹧鸪。"],tags:["闺怨","词"]},
  {id:130,title:"虞美人",author:"李煜",dynasty:"五代",content:["春花秋月何时了？往事知多少。","小楼昨夜又东风，故国不堪回首月明中。","雕栏玉砌应犹在，只是朱颜改。","问君能有几多愁？恰似一江春水向东流。"],tags:["亡国","愁","词"]},
  {id:131,title:"相见欢",author:"李煜",dynasty:"五代",content:["无言独上西楼，月如钩。","寂寞梧桐深院锁清秋。","剪不断，理还乱，是离愁。","别是一般滋味在心头。"],tags:["愁","月","词"]},
  {id:132,title:"浪淘沙令",author:"李煜",dynasty:"五代",content:["帘外雨潺潺，春意阑珊。","罗衾不耐五更寒。","梦里不知身是客，一晌贪欢。","独自莫凭栏，无限江山。","别时容易见时难。","流水落花春去也，天上人间。"],tags:["亡国","愁","词"]},
  {id:133,title:"乌夜啼",author:"李煜",dynasty:"五代",content:["林花谢了春红，太匆匆。","无奈朝来寒雨晚来风。","胭脂泪，相留醉，几时重。","自是人生长恨水长东。"],tags:["感伤","词"]},

  // 宋词
  {id:134,title:"水调歌头·明月几时有",author:"苏轼",dynasty:"宋",content:["丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。","明月几时有？把酒问青天。","不知天上宫阙，今夕是何年。","我欲乘风归去，又恐琼楼玉宇，高处不胜寒。","起舞弄清影，何似在人间。","转朱阁，低绮户，照无眠。","不应有恨，何事长向别时圆？","人有悲欢离合，月有阴晴圆缺，此事古难全。","但愿人长久，千里共婵娟。"],tags:["月","中秋","思亲","词"]},
  {id:135,title:"念奴娇·赤壁怀古",author:"苏轼",dynasty:"宋",content:["大江东去，浪淘尽，千古风流人物。","故垒西边，人道是，三国周郎赤壁。","乱石穿空，惊涛拍岸，卷起千堆雪。","江山如画，一时多少豪杰。","遥想公瑾当年，小乔初嫁了，雄姿英发。","羽扇纶巾，谈笑间，樯橹灰飞烟灭。","故国神游，多情应笑我，早生华发。","人生如梦，一尊还酹江月。"],tags:["怀古","豪放","词"]},
  {id:136,title:"江城子·密州出猎",author:"苏轼",dynasty:"宋",content:["老夫聊发少年狂，左牵黄，右擎苍，","锦帽貂裘，千骑卷平冈。","为报倾城随太守，亲射虎，看孙郎。","酒酣胸胆尚开张，鬓微霜，又何妨！","持节云中，何日遣冯唐？","会挽雕弓如满月，西北望，射天狼。"],tags:["豪放","壮志","词"]},
  {id:137,title:"江城子·乙卯正月二十日夜记梦",author:"苏轼",dynasty:"宋",content:["十年生死两茫茫，不思量，自难忘。","千里孤坟，无处话凄凉。","纵使相逢应不识，尘满面，鬓如霜。","夜来幽梦忽还乡，小轩窗，正梳妆。","相顾无言，惟有泪千行。","料得年年肠断处，明月夜，短松冈。"],tags:["悼亡","爱情","梦","词"]},
  {id:138,title:"定风波",author:"苏轼",dynasty:"宋",content:["莫听穿林打叶声，何妨吟啸且徐行。","竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。","料峭春风吹酒醒，微冷，山头斜照却相迎。","回首向来萧瑟处，归去，也无风雨也无晴。"],tags:["哲理","旷达","词"]},
  {id:139,title:"蝶恋花·春景",author:"苏轼",dynasty:"宋",content:["花褪残红青杏小。燕子飞时，绿水人家绕。","枝上柳绵吹又少，天涯何处无芳草！","墙里秋千墙外道。墙外行人，墙里佳人笑。","笑渐不闻声渐悄，多情却被无情恼。"],tags:["春天","爱情","词"]},
  {id:140,title:"题西林壁",author:"苏轼",dynasty:"宋",content:["横看成岭侧成峰，远近高低各不同。","不识庐山真面目，只缘身在此山中。"],tags:["哲理","山水"]},
  {id:141,title:"饮湖上初晴后雨",author:"苏轼",dynasty:"宋",content:["水光潋滟晴方好，山色空蒙雨亦奇。","欲把西湖比西子，淡妆浓抹总相宜。"],tags:["写景","西湖"]},
  {id:142,title:"惠崇春江晚景",author:"苏轼",dynasty:"宋",content:["竹外桃花三两枝，春江水暖鸭先知。","蒌蒿满地芦芽短，正是河豚欲上时。"],tags:["写景","春天","题画"]},
  {id:143,title:"六月二十七日望湖楼醉书",author:"苏轼",dynasty:"宋",content:["黑云翻墨未遮山，白雨跳珠乱入船。","卷地风来忽吹散，望湖楼下水如天。"],tags:["写景","雨","西湖"]},
  {id:144,title:"青玉案·元夕",author:"辛弃疾",dynasty:"宋",content:["东风夜放花千树。更吹落、星如雨。","宝马雕车香满路。凤箫声动，玉壶光转，一夜鱼龙舞。","蛾儿雪柳黄金缕。笑语盈盈暗香去。","众里寻他千百度。蓦然回首，那人却在，灯火阑珊处。"],tags:["元宵","爱情","词"]},
  {id:145,title:"破阵子·为陈同甫赋壮词以寄之",author:"辛弃疾",dynasty:"宋",content:["醉里挑灯看剑，梦回吹角连营。","八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。","马作的卢飞快，弓如霹雳弦惊。","了却君王天下事，赢得生前身后名。可怜白发生！"],tags:["战争","壮志","词"]},
  {id:146,title:"永遇乐·京口北固亭怀古",author:"辛弃疾",dynasty:"宋",content:["千古江山，英雄无觅孙仲谋处。","舞榭歌台，风流总被雨打风吹去。","斜阳草树，寻常巷陌，人道寄奴曾住。","想当年，金戈铁马，气吞万里如虎。","元嘉草草，封狼居胥，赢得仓皇北顾。","四十三年，望中犹记，烽火扬州路。","可堪回首，佛狸祠下，一片神鸦社鼓。","凭谁问：廉颇老矣，尚能饭否？"],tags:["怀古","壮志","词"]},
  {id:147,title:"丑奴儿·书博山道中壁",author:"辛弃疾",dynasty:"宋",content:["少年不识愁滋味，爱上层楼。","爱上层楼，为赋新词强说愁。","而今识尽愁滋味，欲说还休。","欲说还休，却道天凉好个秋。"],tags:["感怀","秋天","词"]},
  {id:148,title:"西江月·夜行黄沙道中",author:"辛弃疾",dynasty:"宋",content:["明月别枝惊鹊，清风半夜鸣蝉。","稻花香里说丰年，听取蛙声一片。","七八个星天外，两三点雨山前。","旧时茅店社林边，路转溪桥忽见。"],tags:["田园","月","夏夜","词"]},
  {id:149,title:"水龙吟·登建康赏心亭",author:"辛弃疾",dynasty:"宋",content:["楚天千里清秋，水随天去秋无际。","遥岑远目，献愁供恨，玉簪螺髻。","落日楼头，断鸿声里，江南游子。","把吴钩看了，栏杆拍遍，无人会，登临意。","休说鲈鱼堪脍，尽西风，季鹰归未？","求田问舍，怕应羞见，刘郎才气。","可惜流年，忧愁风雨，树犹如此！","倩何人唤取，红巾翠袖，揾英雄泪！"],tags:["壮志","感怀","词"]},
  {id:150,title:"如梦令",author:"李清照",dynasty:"宋",content:["常记溪亭日暮，沉醉不知归路。","兴尽晚回舟，误入藕花深处。","争渡，争渡，惊起一滩鸥鹭。"],tags:["回忆","少女","词"]},
  {id:151,title:"如梦令",author:"李清照",dynasty:"宋",content:["昨夜雨疏风骤，浓睡不消残酒。","试问卷帘人，却道海棠依旧。","知否，知否？应是绿肥红瘦。"],tags:["春天","感伤","词"]},
  {id:152,title:"声声慢",author:"李清照",dynasty:"宋",content:["寻寻觅觅，冷冷清清，凄凄惨惨戚戚。","乍暖还寒时候，最难将息。","三杯两盏淡酒，怎敌他、晚来风急！","雁过也，正伤心，却是旧时相识。","满地黄花堆积，憔悴损，如今有谁堪摘？","守着窗儿，独自怎生得黑！","梧桐更兼细雨，到黄昏、点点滴滴。","这次第，怎一个愁字了得！"],tags:["愁","孤独","词"]},
  {id:153,title:"一剪梅",author:"李清照",dynasty:"宋",content:["红藕香残玉簟秋。轻解罗裳，独上兰舟。","云中谁寄锦书来，雁字回时，月满西楼。","花自飘零水自流。一种相思，两处闲愁。","此情无计可消除，才下眉头，却上心头。"],tags:["爱情","相思","词"]},
  {id:154,title:"醉花阴",author:"李清照",dynasty:"宋",content:["薄雾浓云愁永昼，瑞脑消金兽。","佳节又重阳，玉枕纱厨，半夜凉初透。","东篱把酒黄昏后，有暗香盈袖。","莫道不销魂，帘卷西风，人比黄花瘦。"],tags:["重阳","相思","词"]},
  {id:155,title:"武陵春",author:"李清照",dynasty:"宋",content:["风住尘香花已尽，日晚倦梳头。","物是人非事事休，欲语泪先流。","闻说双溪春尚好，也拟泛轻舟。","只恐双溪舴艋舟，载不动许多愁。"],tags:["愁","感伤","词"]},
  {id:156,title:"夏日绝句",author:"李清照",dynasty:"宋",content:["生当作人杰，死亦为鬼雄。","至今思项羽，不肯过江东。"],tags:["咏史","壮志"]},
  {id:157,title:"示儿",author:"陆游",dynasty:"宋",content:["死去元知万事空，但悲不见九州同。","王师北定中原日，家祭无忘告乃翁。"],tags:["爱国","遗言"]},
  {id:158,title:"游山西村",author:"陆游",dynasty:"宋",content:["莫笑农家腊酒浑，丰年留客足鸡豚。","山重水复疑无路，柳暗花明又一村。","箫鼓追随春社近，衣冠简朴古风存。","从今若许闲乘月，拄杖无时夜叩门。"],tags:["田园","哲理","月"]},
  {id:159,title:"书愤",author:"陆游",dynasty:"宋",content:["早岁那知世事艰，中原北望气如山。","楼船夜雪瓜洲渡，铁马秋风大散关。","塞上长城空自许，镜中衰鬓已先斑。","出师一表真名世，千载谁堪伯仲间！"],tags:["壮志","感怀","爱国"]},
  {id:160,title:"钗头凤",author:"陆游",dynasty:"宋",content:["红酥手，黄縢酒，满城春色宫墙柳。","东风恶，欢情薄。","一怀愁绪，几年离索。","错、错、错。","春如旧，人空瘦，泪痕红浥鲛绡透。","桃花落，闲池阁。","山盟虽在，锦书难托。","莫、莫、莫。"],tags:["爱情","离别","词"]},
  {id:161,title:"卜算子·咏梅",author:"陆游",dynasty:"宋",content:["驿外断桥边，寂寞开无主。","已是黄昏独自愁，更着风和雨。","无意苦争春，一任群芳妒。","零落成泥碾作尘，只有香如故。"],tags:["咏物","品格","词"]},
  {id:162,title:"十一月四日风雨大作",author:"陆游",dynasty:"宋",content:["僵卧孤村不自哀，尚思为国戍轮台。","夜阑卧听风吹雨，铁马冰河入梦来。"],tags:["爱国","梦","雨"]},
  {id:163,title:"雨霖铃",author:"柳永",dynasty:"宋",content:["寒蝉凄切，对长亭晚，骤雨初歇。","都门帐饮无绪，留恋处，兰舟催发。","执手相看泪眼，竟无语凝噎。","念去去，千里烟波，暮霭沉沉楚天阔。","多情自古伤离别，更那堪，冷落清秋节！","今宵酒醒何处？杨柳岸，晓风残月。","此去经年，应是良辰好景虚设。","便纵有千种风情，更与何人说？"],tags:["离别","秋天","词"]},
  {id:164,title:"蝶恋花",author:"柳永",dynasty:"宋",content:["伫倚危楼风细细，望极春愁，黯黯生天际。","草色烟光残照里，无言谁会凭阑意。","拟把疏狂图一醉，对酒当歌，强乐还无味。","衣带渐宽终不悔，为伊消得人憔悴。"],tags:["爱情","愁","词"]},
  {id:165,title:"望海潮",author:"柳永",dynasty:"宋",content:["东南形胜，三吴都会，钱塘自古繁华。","烟柳画桥，风帘翠幕，参差十万人家。","云树绕堤沙，怒涛卷霜雪，天堑无涯。","市列珠玑，户盈罗绮，竞豪奢。","重湖叠巘清嘉，有三秋桂子，十里荷花。","羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。","千骑拥高牙，乘醉听箫鼓，吟赏烟霞。","异日图将好景，归去凤池夸。"],tags:["写景","杭州","词"]},
  {id:166,title:"八声甘州",author:"柳永",dynasty:"宋",content:["对潇潇暮雨洒江天，一番洗清秋。","渐霜风凄紧，关河冷落，残照当楼。","是处红衰翠减，苒苒物华休。","唯有长江水，无语东流。","不忍登高临远，望故乡渺邈，归思难收。","叹年来踪迹，何事苦淹留？","想佳人妆楼颙望，误几回、天际识归舟。","争知我，倚阑干处，正恁凝愁！"],tags:["思乡","秋天","词"]},
  {id:167,title:"满江红",author:"岳飞",dynasty:"宋",content:["怒发冲冠，凭栏处、潇潇雨歇。","抬望眼，仰天长啸，壮怀激烈。","三十功名尘与土，八千里路云和月。","莫等闲、白了少年头，空悲切！","靖康耻，犹未雪。臣子恨，何时灭！","驾长车，踏破贺兰山缺。","壮志饥餐胡虏肉，笑谈渴饮匈奴血。","待从头、收拾旧山河，朝天阙。"],tags:["爱国","壮志","词"]},
  {id:168,title:"小重山",author:"岳飞",dynasty:"宋",content:["昨夜寒蛩不住鸣。惊回千里梦，已三更。","起来独自绕阶行。人悄悄，帘外月胧明。","白首为功名。旧山松竹老，阻归程。","欲将心事付瑶琴。知音少，弦断有谁听？"],tags:["壮志","孤独","月","词"]},
  {id:169,title:"渔家傲·秋思",author:"范仲淹",dynasty:"宋",content:["塞下秋来风景异，衡阳雁去无留意。","四面边声连角起，千嶂里，长烟落日孤城闭。","浊酒一杯家万里，燕然未勒归无计。","羌管悠悠霜满地，人不寐，将军白发征夫泪。"],tags:["边塞","思乡","词"]},
  {id:170,title:"苏幕遮·怀旧",author:"范仲淹",dynasty:"宋",content:["碧云天，黄叶地，秋色连波，波上寒烟翠。","山映斜阳天接水，芳草无情，更在斜阳外。","黯乡魂，追旅思，夜夜除非，好梦留人睡。","明月楼高休独倚，酒入愁肠，化作相思泪。"],tags:["思乡","秋天","词"]},
  {id:171,title:"岳阳楼记（名句）",author:"范仲淹",dynasty:"宋",content:["先天下之忧而忧，后天下之乐而乐。","不以物喜，不以己悲。","居庙堂之高则忧其民，处江湖之远则忧其君。","是进亦忧，退亦忧。然则何时而乐耶？","其必曰：先天下之忧而忧，后天下之乐而乐乎。"],tags:["忧国","哲理","散文"]},
  {id:172,title:"生查子·元夕",author:"欧阳修",dynasty:"宋",content:["去年元夜时，花市灯如昼。","月上柳梢头，人约黄昏后。","今年元夜时，月与灯依旧。","不见去年人，泪湿春衫袖。"],tags:["元宵","爱情","月","词"]},
  {id:173,title:"蝶恋花",author:"欧阳修",dynasty:"宋",content:["庭院深深深几许，杨柳堆烟，帘幕无重数。","玉勒雕鞍游冶处，楼高不见章台路。","雨横风狂三月暮，门掩黄昏，无计留春住。","泪眼问花花不语，乱红飞过秋千去。"],tags:["闺怨","春天","词"]},
  {id:174,title:"画堂春",author:"欧阳修",dynasty:"宋",content:["去年元夜时，花市灯如昼。","月上柳梢头，人约黄昏后。","今年元夜时，月与灯依旧。","不见去年人，泪湿春衫袖。"],tags:["元宵","爱情","词"]},
  {id:175,title:"浣溪沙",author:"晏殊",dynasty:"宋",content:["一曲新词酒一杯，去年天气旧亭台。","夕阳西下几时回？","无可奈何花落去，似曾相识燕归来。","小园香径独徘徊。"],tags:["感怀","时光","词"]},
  {id:176,title:"蝶恋花",author:"晏殊",dynasty:"宋",content:["槛菊愁烟兰泣露，罗幕轻寒，燕子双飞去。","明月不谙离恨苦，斜光到晓穿朱户。","昨夜西风凋碧树，独上高楼，望尽天涯路。","欲寄彩笺兼尺素，山长水阔知何处？"],tags:["相思","秋天","词"]},
  {id:177,title:"鹊桥仙",author:"秦观",dynasty:"宋",content:["纤云弄巧，飞星传恨，银汉迢迢暗度。","金风玉露一相逢，便胜却人间无数。","柔情似水，佳期如梦，忍顾鹊桥归路。","两情若是久长时，又岂在朝朝暮暮。"],tags:["爱情","七夕","词"]},
  {id:178,title:"踏莎行·郴州旅舍",author:"秦观",dynasty:"宋",content:["雾失楼台，月迷津渡，桃源望断无寻处。","可堪孤馆闭春寒，杜鹃声里斜阳暮。","驿寄梅花，鱼传尺素，砌成此恨无重数。","郴江幸自绕郴山，为谁流下潇湘去？"],tags:["贬谪","愁","词"]},
  {id:179,title:"满庭芳",author:"秦观",dynasty:"宋",content:["山抹微云，天连衰草，画角声断谯门。","暂停征棹，聊共引离尊。","多少蓬莱旧事，空回首、烟霭纷纷。","斜阳外，寒鸦万点，流水绕孤村。","销魂。当此际，香囊暗解，罗带轻分。","谩赢得、青楼薄幸名存。","此去何时见也？襟袖上、空惹啼痕。","伤情处，高城望断，灯火已黄昏。"],tags:["离别","感伤","词"]},
  {id:180,title:"苏幕遮·燎沉香",author:"周邦彦",dynasty:"宋",content:["燎沉香，消溽暑。鸟雀呼晴，侵晓窥檐语。","叶上初阳干宿雨，水面清圆，一一风荷举。","故乡遥，何日去？家住吴门，久作长安旅。","五月渔郎相忆否？小楫轻舟，梦入芙蓉浦。"],tags:["思乡","夏天","词"]},
  {id:181,title:"扬州慢",author:"姜夔",dynasty:"宋",content:["淮左名都，竹西佳处，解鞍少驻初程。","过春风十里，尽荠麦青青。","自胡马窥江去后，废池乔木，犹厌言兵。","渐黄昏，清角吹寒，都在空城。","杜郎俊赏，算而今重到须惊。","纵豆蔻词工，青楼梦好，难赋深情。","二十四桥仍在，波心荡，冷月无声。","念桥边红药，年年知为谁生？"],tags:["怀古","战争","词"]},
  {id:182,title:"暗香（节选）",author:"姜夔",dynasty:"宋",content:["旧时月色，算几番照我，梅边吹笛？","唤起玉人，不管清寒与攀摘。","何逊而今渐老，都忘却春风词笔。","但怪得竹外疏花，香冷入瑶席。","江国，正寂寂，叹寄与路遥，夜雪初积。","翠尊易泣，红萼无言耿相忆。","长记曾携手处，千树压、西湖寒碧。","又片片吹尽也，几时见得？"],tags:["咏物","回忆","词"]},
  {id:183,title:"过零丁洋",author:"文天祥",dynasty:"宋",content:["辛苦遭逢起一经，干戈寥落四周星。","山河破碎风飘絮，身世浮沉雨打萍。","惶恐滩头说惶恐，零丁洋里叹零丁。","人生自古谁无死？留取丹心照汗青。"],tags:["爱国","壮志","绝命"]},
  {id:184,title:"正气歌（节选）",author:"文天祥",dynasty:"宋",content:["天地有正气，杂然赋流形。","下则为河岳，上则为日星。","于人曰浩然，沛乎塞苍冥。","皇路当清夷，含和吐明庭。","时穷节乃见，一一垂丹青。"],tags:["爱国","正气"]},
  {id:185,title:"春日",author:"朱熹",dynasty:"宋",content:["胜日寻芳泗水滨，无边光景一时新。","等闲识得东风面，万紫千红总是春。"],tags:["春天","哲理"]},
  {id:186,title:"观书有感",author:"朱熹",dynasty:"宋",content:["半亩方塘一鉴开，天光云影共徘徊。","问渠那得清如许？为有源头活水来。"],tags:["哲理","读书"]},
  {id:187,title:"题临安邸",author:"林升",dynasty:"宋",content:["山外青山楼外楼，西湖歌舞几时休？","暖风熏得游人醉，直把杭州作汴州。"],tags:["讽喻","爱国"]},
  {id:188,title:"小池",author:"杨万里",dynasty:"宋",content:["泉眼无声惜细流，树阴照水爱晴柔。","小荷才露尖尖角，早有蜻蜓立上头。"],tags:["写景","夏天"]},
  {id:189,title:"晓出净慈寺送林子方",author:"杨万里",dynasty:"宋",content:["毕竟西湖六月中，风光不与四时同。","接天莲叶无穷碧，映日荷花别样红。"],tags:["写景","夏天","西湖"]},
  {id:190,title:"四时田园杂兴（选一）",author:"范成大",dynasty:"宋",content:["昼出耘田夜绩麻，村庄儿女各当家。","童孙未解供耕织，也傍桑阴学种瓜。"],tags:["田园","儿童"]},
  {id:191,title:"州桥",author:"范成大",dynasty:"宋",content:["州桥南北是天街，父老年年等驾回。","忍泪失声询使者，几时真有六军来？"],tags:["爱国","遗民"]},
  {id:192,title:"冬夜读书示子聿",author:"陆游",dynasty:"宋",content:["古人学问无遗力，少壮工夫老始成。","纸上得来终觉浅，绝知此事要躬行。"],tags:["劝学","哲理"]},
  {id:193,title:"江城子·密州出猎",author:"苏轼",dynasty:"宋",content:["老夫聊发少年狂，左牵黄，右擎苍。","锦帽貂裘，千骑卷平冈。","为报倾城随太守，亲射虎，看孙郎。","酒酣胸胆尚开张，鬓微霜，又何妨？","持节云中，何日遣冯唐？","会挽雕弓如满月，西北望，射天狼。"],tags:["豪放","壮志","词"]},

  // 金元
  {id:194,title:"天净沙·秋思",author:"马致远",dynasty:"元",content:["枯藤老树昏鸦，小桥流水人家，古道西风瘦马。","夕阳西下，断肠人在天涯。"],tags:["秋天","思乡","散曲"]},
  {id:195,title:"山坡羊·潼关怀古",author:"张养浩",dynasty:"元",content:["峰峦如聚，波涛如怒，山河表里潼关路。","望西都，意踌躇。","伤心秦汉经行处，宫阙万间都做了土。","兴，百姓苦；亡，百姓苦。"],tags:["怀古","忧民","散曲"]},
  {id:196,title:"四块玉·别情",author:"关汉卿",dynasty:"元",content:["自送别，心难舍，一点相思几时绝？","凭阑袖拂杨花雪。","溪又斜，山又遮，人去也！"],tags:["离别","相思","散曲"]},
  {id:197,title:"墨梅",author:"王冕",dynasty:"元",content:["我家洗砚池头树，朵朵花开淡墨痕。","不要人夸好颜色，只留清气满乾坤。"],tags:["咏物","品格"]},
  {id:198,title:"石灰吟",author:"于谦",dynasty:"明",content:["千锤万凿出深山，烈火焚烧若等闲。","粉骨碎身浑不怕，要留清白在人间。"],tags:["咏物","品格"]},
  {id:199,title:"临江仙",author:"杨慎",dynasty:"明",content:["滚滚长江东逝水，浪花淘尽英雄。","是非成败转头空。","青山依旧在，几度夕阳红。","白发渔樵江渚上，惯看秋月春风。","一壶浊酒喜相逢。","古今多少事，都付笑谈中。"],tags:["怀古","哲理","词"]},
  {id:200,title:"别云间",author:"夏完淳",dynasty:"明",content:["三年羁旅客，今日又南冠。","无限山河泪，谁言天地宽。","已知泉路近，欲别故乡难。","毅魄归来日，灵旗空际看。"],tags:["爱国","绝命"]},

  // 清代
  {id:201,title:"己亥杂诗·其五",author:"龚自珍",dynasty:"清",content:["浩荡离愁白日斜，吟鞭东指即天涯。","落红不是无情物，化作春泥更护花。"],tags:["抒怀","奉献"]},
  {id:202,title:"己亥杂诗·其一二五",author:"龚自珍",dynasty:"清",content:["九州生气恃风雷，万马齐喑究可哀。","我劝天公重抖擞，不拘一格降人才。"],tags:["讽喻","人才"]},
  {id:203,title:"赴戍登程口占示家人",author:"林则徐",dynasty:"清",content:["力微任重久神疲，再竭衰庸定不支。","苟利国家生死以，岂因祸福避趋之！","谪居正是君恩厚，养拙刚于戍卒宜。","戏与山妻谈故事，试吟断送老头皮。"],tags:["爱国","贬谪"]},
  {id:204,title:"狱中题壁",author:"谭嗣同",dynasty:"清",content:["望门投止思张俭，忍死须臾待杜根。","我自横刀向天笑，去留肝胆两昆仑。"],tags:["爱国","绝命"]},
  {id:205,title:"对酒",author:"秋瑾",dynasty:"清",content:["不惜千金买宝刀，貂裘换酒也堪豪。","一腔热血勤珍重，洒去犹能化碧涛。"],tags:["爱国","壮志"]},
  {id:206,title:"鹧鸪天",author:"秋瑾",dynasty:"清",content:["祖国沉沦感不禁，闲来海外觅知音。","金瓯已缺总须补，为国牺牲敢惜身！","嗟险阻，叹飘零。关山万里作雄行。","休言女子非英物，夜夜龙泉壁上鸣。"],tags:["爱国","女杰","词"]},
  {id:207,title:"长相思",author:"纳兰性德",dynasty:"清",content:["山一程，水一程，身向榆关那畔行，夜深千帐灯。","风一更，雪一更，聒碎乡心梦不成，故园无此声。"],tags:["思乡","行役","词"]},
  {id:208,title:"木兰花令·拟古决绝词柬友",author:"纳兰性德",dynasty:"清",content:["人生若只如初见，何事秋风悲画扇。","等闲变却故人心，却道故人心易变。","骊山语罢清宵半，泪雨霖铃终不怨。","何如薄幸锦衣郎，比翼连枝当日愿。"],tags:["爱情","感伤","词"]},
  {id:209,title:"浣溪沙",author:"纳兰性德",dynasty:"清",content:["谁念西风独自凉，萧萧黄叶闭疏窗，沉思往事立残阳。","被酒莫惊春睡重，赌书消得泼茶香，当时只道是寻常。"],tags:["悼亡","回忆","词"]},
  {id:210,title:"竹石",author:"郑燮",dynasty:"清",content:["咬定青山不放松，立根原在破岩中。","千磨万击还坚劲，任尔东西南北风。"],tags:["咏物","品格"]},
  {id:211,title:"己亥杂诗",author:"龚自珍",dynasty:"清",content:["九州生气恃风雷，万马齐喑究可哀。","我劝天公重抖擞，不拘一格降人才。"],tags:["讽喻","人才"]},
  {id:212,title:"论诗五首·其二",author:"赵翼",dynasty:"清",content:["李杜诗篇万口传，至今已觉不新鲜。","江山代有才人出，各领风骚数百年。"],tags:["文学","哲理"]},
  {id:213,title:"苔",author:"袁枚",dynasty:"清",content:["白日不到处，青春恰自来。","苔花如米小，也学牡丹开。"],tags:["咏物","励志"]},
  {id:214,title:"马嵬",author:"袁枚",dynasty:"清",content:["莫唱当年长恨歌，人间亦自有银河。","石壕村里夫妻别，泪比长生殿上多。"],tags:["讽喻","民生"]},
  {id:215,title:"咏史",author:"龚自珍",dynasty:"清",content:["金粉东南十五州，万重恩怨属名流。","牢盆狎客操全算，团扇才人踞上游。","避席畏闻文字狱，著书都为稻粱谋。","田横五百人安在，难道归来尽列侯？"],tags:["讽喻","时代"]},
  {id:216,title:"咏煤炭",author:"于谦",dynasty:"明",content:["凿开混沌得乌金，藏蓄阳和意最深。","爝火燃回春浩浩，洪炉照破夜沉沉。","鼎彝元赖生成力，铁石犹存死后心。","但愿苍生俱饱暖，不辞辛苦出山林。"],tags:["咏物","忧民"]},
  {id:217,title:"就义诗",author:"杨继盛",dynasty:"明",content:["浩气还太虚，丹心照千古。","生平未报国，留作忠魂补。"],tags:["爱国","绝命"]},
  {id:218,title:"塞上曲",author:"戴叔伦",dynasty:"唐",content:["汉家旌帜满阴山，不遣胡儿匹马还。","愿得此身长报国，何须生入玉门关。"],tags:["边塞","爱国"]},
  {id:219,title:"金缕衣",author:"杜秋娘",dynasty:"唐",content:["劝君莫惜金缕衣，劝君惜取少年时。","花开堪折直须折，莫待无花空折枝。"],tags:["劝学","惜时"]},
  {id:220,title:"贫女",author:"秦韬玉",dynasty:"唐",content:["蓬门未识绮罗香，拟托良媒益自伤。","谁爱风流高格调，共怜时世俭梳妆。","敢将十指夸针巧，不把双眉斗画长。","苦恨年年压金线，为他人作嫁衣裳。"],tags:["讽喻","身世"]},
  {id:221,title:"小松",author:"杜荀鹤",dynasty:"唐",content:["自小刺头深草里，而今渐觉出蓬蒿。","时人不识凌云木，直待凌云始道高。"],tags:["咏物","讽喻"]},
  {id:222,title:"蜂",author:"罗隐",dynasty:"唐",content:["不论平地与山尖，无限风光尽被占。","采得百花成蜜后，为谁辛苦为谁甜？"],tags:["咏物","讽喻"]},
  {id:223,title:"自遣",author:"罗隐",dynasty:"唐",content:["得即高歌失即休，多愁多恨亦悠悠。","今朝有酒今朝醉，明日愁来明日愁。"],tags:["旷达","饮酒"]},
  {id:224,title:"感弄猴人赐朱绂",author:"罗隐",dynasty:"唐",content:["十二三年就试期，五湖烟月奈相违。","何如买取胡孙弄，一笑君王便著绯。"],tags:["讽喻"]},
  {id:225,title:"台城",author:"韦庄",dynasty:"唐",content:["江雨霏霏江草齐，六朝如梦鸟空啼。","无情最是台城柳，依旧烟笼十里堤。"],tags:["怀古","讽喻"]},
  {id:226,title:"菩萨蛮",author:"韦庄",dynasty:"唐",content:["人人尽说江南好，游人只合江南老。","春水碧于天，画船听雨眠。","垆边人似月，皓腕凝霜雪。","未老莫还乡，还乡须断肠。"],tags:["江南","思乡","词"]},
  {id:227,title:"思帝乡",author:"韦庄",dynasty:"唐",content:["春日游，杏花吹满头。","陌上谁家年少，足风流？","妾拟将身嫁与，一生休。","纵被无情弃，不能羞。"],tags:["爱情","词"]},
  {id:228,title:"寄人",author:"张泌",dynasty:"唐",content:["别梦依依到谢家，小廊回合曲阑斜。","多情只有春庭月，犹为离人照落花。"],tags:["爱情","月"]},
  {id:229,title:"金缕衣",author:"无名氏",dynasty:"唐",content:["劝君莫惜金缕衣，劝君惜取少年时。","有花堪折直须折，莫待无花空折枝。"],tags:["劝学","惜时"]},
  {id:230,title:"近试上张水部",author:"朱庆馀",dynasty:"唐",content:["洞房昨夜停红烛，待晓堂前拜舅姑。","妆罢低声问夫婿，画眉深浅入时无。"],tags:["干谒","婚姻"]},
  {id:231,title:"宫词",author:"张祜",dynasty:"唐",content:["故国三千里，深宫二十年。","一声《何满子》，双泪落君前。"],tags:["宫怨"]},
  {id:232,title:"题金陵渡",author:"张祜",dynasty:"唐",content:["金陵津渡小山楼，一宿行人自可愁。","潮落夜江斜月里，两三星火是瓜州。"],tags:["行旅","夜景","月"]},
  {id:233,title:"长安秋望",author:"赵嘏",dynasty:"唐",content:["云物凄清拂曙流，汉家宫阙动高秋。","残星几点雁横塞，长笛一声人倚楼。","紫艳半开篱菊静，红衣落尽渚莲愁。","鲈鱼正美不归去，空戴南冠学楚囚。"],tags:["秋天","思乡"]},
  {id:234,title:"江楼感旧",author:"赵嘏",dynasty:"唐",content:["独上江楼思渺然，月光如水水如天。","同来望月人何处？风景依稀似去年。"],tags:["感怀","月","回忆"]},
  {id:235,title:"咸阳城西楼晚眺",author:"许浑",dynasty:"唐",content:["一上高城万里愁，蒹葭杨柳似汀洲。","溪云初起日沉阁，山雨欲来风满楼。","鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。","行人莫问当年事，故国东来渭水流。"],tags:["怀古","写景"]},
  {id:236,title:"金陵怀古",author:"许浑",dynasty:"唐",content:["玉树歌残王气终，景阳兵合戍楼空。","松楸远近千官冢，禾黍高低六代宫。","石燕拂云晴亦雨，江豚吹浪夜还风。","英雄一去豪华尽，惟有青山似洛中。"],tags:["怀古"]},
  {id:237,title:"苏武庙",author:"温庭筠",dynasty:"唐",content:["苏武魂销汉使前，古祠高树两茫然。","云边雁断胡天月，陇上羊归塞草烟。","回日楼台非甲帐，去时冠剑是丁年。","茂陵不见封侯印，空向秋波哭逝川。"],tags:["怀古","爱国"]},
  {id:238,title:"利州南渡",author:"温庭筠",dynasty:"唐",content:["澹然空水带斜晖，曲岛苍茫接翠微。","波上马嘶看棹去，柳边人歇待船归。","数丛沙草群鸥散，万顷江田一鹭飞。","谁解乘舟寻范蠡，五湖烟水独忘机。"],tags:["写景","隐逸"]},
  {id:239,title:"马嵬其二",author:"李商隐",dynasty:"唐",content:["海外徒闻更九州，他生未卜此生休。","空闻虎旅传宵柝，无复鸡人报晓筹。","此日六军同驻马，当时七夕笑牵牛。","如何四纪为天子，不及卢家有莫愁。"],tags:["怀古","讽喻"]},
  {id:240,title:"安定城楼",author:"李商隐",dynasty:"唐",content:["迢递高城百尺楼，绿杨枝外尽汀洲。","贾生年少虚垂泪，王粲春来更远游。","永忆江湖归白发，欲回天地入扁舟。","不知腐鼠成滋味，猜意鹓雏竟未休。"],tags:["抒怀","壮志"]},
  {id:241,title:"春雨",author:"李商隐",dynasty:"唐",content:["怅卧新春白袷衣，白门寥落意多违。","红楼隔雨相望冷，珠箔飘灯独自归。","远路应悲春晼晚，残霄犹得梦依稀。","玉珰缄札何由达，万里云罗一雁飞。"],tags:["爱情","雨"]},
  {id:242,title:"宿骆氏亭寄怀崔雍崔衮",author:"李商隐",dynasty:"唐",content:["竹坞无尘水槛清，相思迢递隔重城。","秋阴不散霜飞晚，留得枯荷听雨声。"],tags:["友情","雨","秋天"]},
  {id:243,title:"贾生",author:"李商隐",dynasty:"唐",content:["宣室求贤访逐臣，贾生才调更无伦。","可怜夜半虚前席，不问苍生问鬼神。"],tags:["咏史","讽喻"]},
  {id:244,title:"嫦娥",author:"李商隐",dynasty:"唐",content:["云母屏风烛影深，长河渐落晓星沉。","嫦娥应悔偷灵药，碧海青天夜夜心。"],tags:["月","孤独"]},
  {id:245,title:"霜月",author:"李商隐",dynasty:"唐",content:["初闻征雁已无蝉，百尺楼高水接天。","青女素娥俱耐冷，月中霜里斗婵娟。"],tags:["月","秋天"]},
  {id:246,title:"赠别",author:"杜牧",dynasty:"唐",content:["多情却似总无情，唯觉樽前笑不成。","蜡烛有心还惜别，替人垂泪到天明。"],tags:["离别","爱情"]},
  {id:247,title:"遣怀",author:"杜牧",dynasty:"唐",content:["落魄江湖载酒行，楚腰纤细掌中轻。","十年一觉扬州梦，赢得青楼薄幸名。"],tags:["感怀","回忆"]},
  {id:248,title:"叹花",author:"杜牧",dynasty:"唐",content:["自是寻春去校迟，不须惆怅怨芳时。","狂风落尽深红色，绿叶成阴子满枝。"],tags:["感怀","时光"]},
  {id:249,title:"齐安郡中偶题",author:"杜牧",dynasty:"唐",content:["两竿落日溪桥上，半缕轻烟柳影中。","多少绿荷相倚恨，一时回首背西风。"],tags:["写景","秋天"]},
  {id:250,title:"赠别·其一",author:"杜牧",dynasty:"唐",content:["娉娉袅袅十三余，豆蔻梢头二月初。","春风十里扬州路，卷上珠帘总不如。"],tags:["爱情","赠别"]},
  {id:251,title:"登柳州城楼寄漳汀封连四州",author:"柳宗元",dynasty:"唐",content:["城上高楼接大荒，海天愁思正茫茫。","惊风乱飐芙蓉水，密雨斜侵薜荔墙。","岭树重遮千里目，江流曲似九回肠。","共来百越文身地，犹自音书滞一乡。"],tags:["贬谪","友情","愁"]},
  {id:252,title:"晨诣超师院读禅经",author:"柳宗元",dynasty:"唐",content:["汲井漱寒齿，清心拂尘服。","闲持贝叶书，步出东斋读。","真源了无取，妄迹世所逐。","遗言冀可冥，缮性何由熟。","道人庭宇静，苔色连深竹。","日出雾露余，青松如膏沐。","澹然离言说，悟悦心自足。"],tags:["禅","隐逸"]},
  {id:253,title:"与浩初上人同看山寄京华亲故",author:"柳宗元",dynasty:"唐",content:["海畔尖山似剑铓，秋来处处割愁肠。","若为化得身千亿，散上峰头望故乡。"],tags:["思乡","贬谪"]},
  {id:254,title:"重别梦得",author:"柳宗元",dynasty:"唐",content:["二十年来万事同，今朝岐路忽西东。","皇恩若许归田去，晚岁当为邻舍翁。"],tags:["友情","贬谪"]},
  {id:255,title:"再授连州至衡阳酬柳柳州赠别",author:"刘禹锡",dynasty:"唐",content:["去国十年同赴召，渡湘千里又分歧。","重临事异黄丞相，三黜名惭柳士师。","归目并随回雁尽，愁肠正遇断猿时。","桂江东过连山下，相望长吟有所思。"],tags:["友情","贬谪"]},
  {id:256,title:"西塞山怀古",author:"刘禹锡",dynasty:"唐",content:["王濬楼船下益州，金陵王气黯然收。","千寻铁锁沉江底，一片降幡出石头。","人世几回伤往事，山形依旧枕寒流。","今逢四海为家日，故垒萧萧芦荻秋。"],tags:["怀古","战争"]},
  {id:257,title:"元和十年自朗州至京戏赠看花诸君子",author:"刘禹锡",dynasty:"唐",content:["紫陌红尘拂面来，无人不道看花回。","玄都观里桃千树，尽是刘郎去后栽。"],tags:["讽喻","贬谪"]},
  {id:258,title:"再游玄都观",author:"刘禹锡",dynasty:"唐",content:["百亩庭中半是苔，桃花净尽菜花开。","种桃道士归何处，前度刘郎今又来。"],tags:["讽喻","贬谪"]},
  {id:259,title:"石头城",author:"刘禹锡",dynasty:"唐",content:["山围故国周遭在，潮打空城寂寞回。","淮水东边旧时月，夜深还过女墙来。"],tags:["怀古","月"]},
  {id:260,title:"蜀先主庙",author:"刘禹锡",dynasty:"唐",content:["天地英雄气，千秋尚凛然。","势分三足鼎，业复五铢钱。","得相能开国，生儿不象贤。","凄凉蜀故妓，来舞魏宫前。"],tags:["咏史"]},
  {id:261,title:"左迁至蓝关示侄孙湘",author:"韩愈",dynasty:"唐",content:["一封朝奏九重天，夕贬潮州路八千。","欲为圣明除弊事，肯将衰朽惜残年。","云横秦岭家何在？雪拥蓝关马不前。","知汝远来应有意，好收吾骨瘴江边。"],tags:["贬谪","亲情"]},
  {id:262,title:"春雪",author:"韩愈",dynasty:"唐",content:["新年都未有芳华，二月初惊见草芽。","白雪却嫌春色晚，故穿庭树作飞花。"],tags:["春天","雪"]},
  {id:263,title:"晚春",author:"韩愈",dynasty:"唐",content:["草树知春不久归，百般红紫斗芳菲。","杨花榆荚无才思，惟解漫天作雪飞。"],tags:["春天","咏物"]},
  {id:264,title:"调张籍",author:"韩愈",dynasty:"唐",content:["李杜文章在，光焰万丈长。","不知群儿愚，那用故谤伤。","蚍蜉撼大树，可笑不自量。","伊我生其后，举颈遥相望。","夜梦多见之，昼思反微茫。","徒观斧凿痕，不瞩治水航。","想当施手时，巨刃磨天扬。","垠崖划崩豁，乾坤摆雷硠。","惟此两夫子，家居率荒凉。","帝欲长吟哦，故遣起且僵。","翦翎送笼中，使看百鸟翔。","平生千万篇，金薤垂琳琅。","仙官敕六丁，雷电下取将。","流落人间者，太山一毫芒。","我愿生两翅，捕逐出八荒。","精诚忽交通，百怪入我肠。","刺手拔鲸牙，举瓢酌天浆。","腾身跨汗漫，不著织女襄。","顾语地上友，经营无太忙。","乞君飞霞佩，与我高颉颃。"],tags:["文学","长篇"]},
  {id:265,title:"山石",author:"韩愈",dynasty:"唐",content:["山石荦确行径微，黄昏到寺蝙蝠飞。","升堂坐阶新雨足，芭蕉叶大栀子肥。","僧言古壁佛画好，以火来照所见稀。","铺床拂度置膏火，疏粝亦足饱我饥。","夜深静卧百虫绝，清月出岭光入扉。","天明独去无道路，出入高下穷烟霏。","山红涧碧纷烂漫，时见松枥皆十围。","当流赤足踏涧石，水声激激风吹衣。","人生如此自可乐，岂必局束为人鞿。","嗟哉吾党二三子，安得至老不更归。"],tags:["游记","山水"]},
  {id:266,title:"闻乐天授江州司马",author:"元稹",dynasty:"唐",content:["残灯无焰影幢幢，此夕闻君谪九江。","垂死病中惊坐起，暗风吹雨入寒窗。"],tags:["友情","贬谪"]},
  {id:267,title:"离思",author:"元稹",dynasty:"唐",content:["曾经沧海难为水，除却巫山不是云。","取次花丛懒回顾，半缘修道半缘君。"],tags:["爱情","悼亡"]},
  {id:268,title:"遣悲怀·其二",author:"元稹",dynasty:"唐",content:["昔日戏言身后意，今朝都到眼前来。","衣裳已施行看尽，针线犹存未忍开。","尚想旧情怜婢仆，也曾因梦送钱财。","诚知此恨人人有，贫贱夫妻百事哀。"],tags:["悼亡","爱情"]},
  {id:269,title:"菊花",author:"元稹",dynasty:"唐",content:["秋丛绕舍似陶家，遍绕篱边日渐斜。","不是花中偏爱菊，此花开尽更无花。"],tags:["咏物","秋天"]},
  {id:270,title:"题破山寺后禅院",author:"常建",dynasty:"唐",content:["清晨入古寺，初日照高林。","曲径通幽处，禅房花木深。","山光悦鸟性，潭影空人心。","万籁此都寂，但余钟磬音。"],tags:["禅","山水"]},
  {id:271,title:"黄鹤楼",author:"崔颢",dynasty:"唐",content:["昔人已乘黄鹤去，此地空余黄鹤楼。","黄鹤一去不复返，白云千载空悠悠。","晴川历历汉阳树，芳草萋萋鹦鹉洲。","日暮乡关何处是？烟波江上使人愁。"],tags:["怀古","思乡"]},
  {id:272,title:"长干行·其一",author:"李白",dynasty:"唐",content:["妾发初覆额，折花门前剧。","郎骑竹马来，绕床弄青梅。","同居长干里，两小无嫌猜。","十四为君妇，羞颜未尝开。","低头向暗壁，千唤不一回。","十五始展眉，愿同尘与灰。","常存抱柱信，岂上望夫台。","十六君远行，瞿塘滟滪堆。","五月不可触，猿声天上哀。","门前迟行迹，一一生绿苔。","苔深不能扫，落叶秋风早。","八月蝴蝶黄，双飞西园草。","感此伤妾心，坐愁红颜老。","早晚下三巴，预将书报家。","相迎不道远，直至长风沙。"],tags:["爱情","叙事","长篇"]},
  {id:273,title:"子夜吴歌·秋歌",author:"李白",dynasty:"唐",content:["长安一片月，万户捣衣声。","秋风吹不尽，总是玉关情。","何日平胡虏，良人罢远征。"],tags:["月","战争","思妇"]},
  {id:274,title:"关山月",author:"李白",dynasty:"唐",content:["明月出天山，苍茫云海间。","长风几万里，吹度玉门关。","汉下白登道，胡窥青海湾。","由来征战地，不见有人还。","戍客望边邑，思归多苦颜。","高楼当此夜，叹息未应闲。"],tags:["月","边塞","战争"]},
  {id:275,title:"客中行",author:"李白",dynasty:"唐",content:["兰陵美酒郁金香，玉碗盛来琥珀光。","但使主人能醉客，不知何处是他乡。"],tags:["饮酒","行旅"]},
  {id:276,title:"春思",author:"李白",dynasty:"唐",content:["燕草如碧丝，秦桑低绿枝。","当君怀归日，是妾断肠时。","春风不相识，何事入罗帏？"],tags:["爱情","春天"]},
  {id:277,title:"秋浦歌",author:"李白",dynasty:"唐",content:["白发三千丈，缘愁似个长。","不知明镜里，何处得秋霜。"],tags:["愁","夸张"]},
  {id:278,title:"秋浦歌·其十四",author:"李白",dynasty:"唐",content:["炉火照天地，红星乱紫烟。","赧郎明月夜，歌曲动寒川。"],tags:["劳动","冶炼"]},
  {id:279,title:"夜宿山寺",author:"李白",dynasty:"唐",content:["危楼高百尺，手可摘星辰。","不敢高声语，恐惊天上人。"],tags:["山水","夸张"]},
  {id:280,title:"访戴天山道士不遇",author:"李白",dynasty:"唐",content:["犬吠水声中，桃花带露浓。","树深时见鹿，溪午不闻钟。","野竹分青霭，飞泉挂碧峰。","无人知所去，愁倚两三松。"],tags:["山水","隐逸"]},
  {id:281,title:"新安吏",author:"杜甫",dynasty:"唐",content:["客行新安道，喧呼闻点兵。","借问新安吏：县小更无丁？","肥男有母送，瘦男独伶俜。","白水暮东流，青山犹哭声。","莫自使眼枯，收汝泪纵横。","眼枯即见骨，天地终无情。","我军取相州，日夕望其平。","岂意贼难料，归军星散营。","就粮近故垒，练卒依旧京。","掘壕不到水，牧马役亦轻。","况乃王师顺，抚养甚分明。","送行勿泣血，仆射如父兄。"],tags:["战争","忧民","叙事"]},
  {id:282,title:"潼关吏",author:"杜甫",dynasty:"唐",content:["士卒何草草，筑城潼关道。","大城铁不如，小城万丈余。","借问潼关吏：修关还备胡？","要我下马行，为我指山隅：","连云列战格，飞鸟不能逾。","胡来但自守，岂复忧西都。","丈人视要处，窄狭容单车。","艰难奋长戟，万古用一夫。","哀哉桃林战，百万化为鱼。","请嘱防关将，慎勿学哥舒！"],tags:["战争","忧民"]},
  {id:283,title:"无家别",author:"杜甫",dynasty:"唐",content:["寂寞天宝后，园庐但蒿藜。","我里百余家，世乱各东西。","存者无消息，死者为尘泥。","贱子因阵败，归来寻旧蹊。","久行见空巷，日瘦气惨凄。","但对狐与狸，竖毛怒我啼。","四邻何所有？一二老寡妻。","宿鸟恋本枝，安辞且穷栖。","方春独荷锄，日暮还灌畦。","县吏知我至，召令习鼓鞞。","虽从本县役，且无内顾携。","近行止一身，远去终转迷。","家乡既荡尽，远近理亦齐。","永痛长病母，五年委沟溪。","生我不得力，终身两酸嘶。","人生无家别，何以为蒸黎！"],tags:["战争","忧民","叙事"]},
  {id:284,title:"江汉",author:"杜甫",dynasty:"唐",content:["江汉思归客，乾坤一腐儒。","片云天共远，永夜月同孤。","落日心犹壮，秋风病欲苏。","古来存老马，不必取长途。"],tags:["抒怀","壮志"]},
  {id:285,title:"旅夜书怀",author:"杜甫",dynasty:"唐",content:["细草微风岸，危樯独夜舟。","星垂平野阔，月涌大江流。","名岂文章著，官应老病休。","飘飘何所似，天地一沙鸥。"],tags:["行旅","孤独","月"]},
  {id:286,title:"登岳阳楼",author:"杜甫",dynasty:"唐",content:["昔闻洞庭水，今上岳阳楼。","吴楚东南坼，乾坤日夜浮。","亲朋无一字，老病有孤舟。","戎马关山北，凭轩涕泗流。"],tags:["写景","忧国"]},
  {id:287,title:"阁夜",author:"杜甫",dynasty:"唐",content:["岁暮阴阳催短景，天涯霜雪霁寒宵。","五更鼓角声悲壮，三峡星河影动摇。","野哭千家闻战伐，夷歌数处起渔樵。","卧龙跃马终黄土，人事音书漫寂寥。"],tags:["战争","感怀"]},
  {id:288,title:"咏怀古迹·其三",author:"杜甫",dynasty:"唐",content:["群山万壑赴荆门，生长明妃尚有村。","一去紫台连朔漠，独留青冢向黄昏。","画图省识春风面，环珮空归月夜魂。","千载琵琶作胡语，分明怨恨曲中论。"],tags:["咏史","怀古"]},
  {id:289,title:"江南逢李龟年",author:"杜甫",dynasty:"唐",content:["岐王宅里寻常见，崔九堂前几度闻。","正是江南好风景，落花时节又逢君。"],tags:["感怀","友情"]},
  {id:290,title:"戏为六绝句·其二",author:"杜甫",dynasty:"唐",content:["王杨卢骆当时体，轻薄为文哂未休。","尔曹身与名俱灭，不废江河万古流。"],tags:["文学","讽喻"]},
  {id:291,title:"江畔独步寻花·其六",author:"杜甫",dynasty:"唐",content:["黄四娘家花满蹊，千朵万朵压枝低。","留连戏蝶时时舞，自在娇莺恰恰啼。"],tags:["春天","写景"]},
  {id:292,title:"赠花卿",author:"杜甫",dynasty:"唐",content:["锦城丝管日纷纷，半入江风半入云。","此曲只应天上有，人间能得几回闻。"],tags:["音乐","讽喻"]},
  {id:293,title:"江南春",author:"杜牧",dynasty:"唐",content:["千里莺啼绿映红，水村山郭酒旗风。","南朝四百八十寺，多少楼台烟雨中。"],tags:["写景","江南","怀古"]},
  {id:294,title:"寄扬州韩绰判官",author:"杜牧",dynasty:"唐",content:["青山隐隐水迢迢，秋尽江南草未凋。","二十四桥明月夜，玉人何处教吹箫？"],tags:["友情","月","江南"]},
  {id:295,title:"过华清宫绝句",author:"杜牧",dynasty:"唐",content:["长安回望绣成堆，山顶千门次第开。","一骑红尘妃子笑，无人知是荔枝来。"],tags:["讽喻","历史"]},
  {id:296,title:"山行",author:"杜牧",dynasty:"唐",content:["远上寒山石径斜，白云生处有人家。","停车坐爱枫林晚，霜叶红于二月花。"],tags:["秋天","写景"]},
  {id:297,title:"泊秦淮",author:"杜牧",dynasty:"唐",content:["烟笼寒水月笼沙，夜泊秦淮近酒家。","商女不知亡国恨，隔江犹唱后庭花。"],tags:["怀古","讽喻","月"]},
  {id:298,title:"秋夕",author:"杜牧",dynasty:"唐",content:["银烛秋光冷画屏，轻罗小扇扑流萤。","天阶夜色凉如水，卧看牵牛织女星。"],tags:["宫怨","星","秋天"]},
  {id:299,title:"清明",author:"杜牧",dynasty:"唐",content:["清明时节雨纷纷，路上行人欲断魂。","借问酒家何处有？牧童遥指杏花村。"],tags:["清明","雨"]},
  {id:300,title:"赤壁",author:"杜牧",dynasty:"唐",content:["折戟沉沙铁未销，自将磨洗认前朝。","东风不与周郎便，铜雀春深锁二乔。"],tags:["怀古","战争"]},
  {id:301,title:"题乌江亭",author:"杜牧",dynasty:"唐",content:["胜败兵家事不期，包羞忍耻是男儿。","江东子弟多才俊，卷土重来未可知。"],tags:["咏史","怀古"]},
  {id:302,title:"遣怀",author:"杜牧",dynasty:"唐",content:["落魄江南载酒行，楚腰纤细掌中轻。","十年一觉扬州梦，赢得青楼薄幸名。"],tags:["感怀","回忆"]},
  {id:303,title:"赠别·其二",author:"杜牧",dynasty:"唐",content:["多情却似总无情，唯觉樽前笑不成。","蜡烛有心还惜别，替人垂泪到天明。"],tags:["离别","爱情"]},
  {id:304,title:"寄扬州韩绰判官",author:"杜牧",dynasty:"唐",content:["青山隐隐水迢迢，秋尽江南草木凋。","二十四桥明月夜，玉人何处教吹箫。"],tags:["友情","月","江南"]},
  {id:305,title:"过故人庄",author:"孟浩然",dynasty:"唐",content:["故人具鸡黍，邀我至田家。","绿树村边合，青山郭外斜。","开轩面场圃，把酒话桑麻。","待到重阳日，还来就菊花。"],tags:["田园","友情"]},
  {id:306,title:"望洞庭湖赠张丞相",author:"孟浩然",dynasty:"唐",content:["八月湖水平，涵虚混太清。","气蒸云梦泽，波撼岳阳城。","欲济无舟楫，端居耻圣明。","坐观垂钓者，徒有羡鱼情。"],tags:["写景","干谒"]},
  {id:307,title:"早寒江上有怀",author:"孟浩然",dynasty:"唐",content:["木落雁南度，北风江上寒
