<script>
/* ============================================================
 *  第一部分：核心算法（纯函数，完整 JSDoc）
 * ============================================================ */

/**
 * 将流量从 m³/h 换算为 m³/s
 * @param {number} qm3h - 流量，单位 m³/h
 * @returns {number} 流量，单位 m³/s；非法输入返回 NaN
 */
function flowToSI(qm3h) {
  if (typeof qm3h !== 'number' || !isFinite(qm3h) || qm3h < 0) return NaN;
  return qm3h / 3600;
}

/**
 * 将管径从 mm 换算为 m
 * @param {number} dmm - 管径，单位 mm
 * @returns {number} 管径，单位 m；非法输入返回 NaN
 */
function diameterToSI(dmm) {
  if (typeof dmm !== 'number' || !isFinite(dmm) || dmm <= 0) return NaN;
  return dmm / 1000;
}

/**
 * 根据流量与管径计算管内平均流速
 * @param {number} qm3s - 流量，m³/s
 * @param {number} dm   - 管道内径，m
 * @returns {number} 流速，m/s；非法输入返回 NaN
 */
function calcFlowVelocity(qm3s, dm) {
  if (!isFinite(qm3s) || !isFinite(dm) || qm3s <= 0 || dm <= 0) return NaN;
  const A = Math.PI * dm * dm / 4;
  return qm3s / A;
}

/**
 * 计算雷诺数 Re = v·D / ν
 * @param {number} v  - 流速，m/s
 * @param {number} dm - 管径，m
 * @param {number} nu - 运动粘度，m²/s
 * @returns {number} 雷诺数（无量纲）；非法输入返回 NaN
 */
function calcReynolds(v, dm, nu) {
  if (!isFinite(v) || !isFinite(dm) || !isFinite(nu) || v < 0 || dm <= 0 || nu <= 0) return NaN;
  return v * dm / nu;
}

/**
 * 用 Swamee-Jain 显式公式估算 Darcy 摩擦系数 λ
 * 适用于 Re ≥ 4000 的湍流区；层流时返回 64/Re
 * 公式来源：Swamee, P.K. & Jain, A.K. (1976)，工程近似，与 Colebrook-White 误差 < 1%
 * @param {number} Re  - 雷诺数
 * @param {number} eps - 绝对粗糙度，m
 * @param {number} dm  - 管径，m
 * @returns {number} Darcy 摩擦系数 λ；非法输入返回 NaN
 */
function estimateFrictionFactor(Re, eps, dm) {
  if (!isFinite(Re) || !isFinite(eps) || !isFinite(dm) || Re <= 0 || eps < 0 || dm <= 0) return NaN;
  if (Re < 2300) return 64 / Re;
  if (Re < 4000) return NaN; // 过渡区，本工具不承诺精度
  const term = eps / (3.7 * dm) + 5.74 / Math.pow(Re, 0.9);
  if (term <= 0) return NaN;
  return 0.25 / Math.pow(Math.log10(term), 2);
}

/**
 * 计算沿程水头损失（Darcy-Weisbach）
 * h_f = λ · (L/D) · (v² / 2g)
 * @param {number} lambda - Darcy 摩擦系数
 * @param {number} L      - 管长，m
 * @param {number} dm     - 管径，m
 * @param {number} v      - 流速，m/s
 * @param {number} [g=9.81] - 重力加速度，m/s²
 * @returns {number} 沿程损失，m；非法输入返回 NaN
 */
function calcFrictionLoss(lambda, L, dm, v, g = 9.81) {
  if (!isFinite(lambda) || !isFinite(L) || !isFinite(dm) || !isFinite(v) || !isFinite(g)) return NaN;
  if (lambda < 0 || L < 0 || dm <= 0 || g <= 0) return NaN;
  return lambda * (L / dm) * (v * v) / (2 * g);
}

/**
 * 计算局部水头损失
 * h_j = Σζ · (v² / 2g)
 * @param {number} sumZeta - 局部阻力系数之和
 * @param {number} v       - 流速，m/s
 * @param {number} [g=9.81]
 * @returns {number} 局部损失，m
 */
function calcLocalLoss(sumZeta, v, g = 9.81) {
  if (!isFinite(sumZeta) || !isFinite(v) || !isFinite(g)) return NaN;
  if (sumZeta < 0 || g <= 0) return NaN;
  return sumZeta * (v * v) / (2 * g);
}

/**
 * 计算泵所需总扬程
 * H = H_geo + h_f + h_j + (p2-p1)/(ρg) + (v2²-v1²)/(2g)
 * 本工具简化为：H = H_geo + h_f + h_j（忽略压差与速度头差，详见说明书）
 * @param {number} hGeo       - 几何扬程，m
 * @param {number} frictionLoss - 沿程损失，m
 * @param {number} localLoss    - 局部损失，m
 * @returns {number} 总扬程，m
 */
function calcTotalHead(hGeo, frictionLoss, localLoss) {
  if (!isFinite(hGeo) || !isFinite(frictionLoss) || !isFinite(localLoss)) return NaN;
  return hGeo + frictionLoss + localLoss;
}

/**
 * 计算泵轴功率（水力功率 / 效率）
 * P_shaft = ρ · g · Q · H / η  （单位 W）
 * @param {number} qm3s - 流量，m³/s
 * @param {number} H    - 扬程，m
 * @param {number} eta  - 泵效率（0 < η ≤ 1）
 * @param {number} rho  - 液体密度，kg/m³
 * @param {number} [g=9.81]
 * @returns {number} 轴功率，kW；非法输入返回 NaN
 */
function calcShaftPower(qm3s, H, eta, rho, g = 9.81) {
  if (!isFinite(qm3s) || !isFinite(H) || !isFinite(eta) || !isFinite(rho) || !isFinite(g)) return NaN;
  if (qm3s < 0 || H < 0 || eta <= 0 || eta > 1 || rho <= 0 || g <= 0) return NaN;
  return (rho * g * qm3s * H / eta) / 1000;
}

/**
 * 计算配用电动机功率
 * P_motor = P_shaft · K
 * @param {number} shaftPowerKW - 轴功率，kW
 * @param {number} K            - 安全系数（通常 1.05~1.30）
 * @returns {number} 配用功率，kW
 */
function calcMotorPower(shaftPowerKW, K) {
  if (!isFinite(shaftPowerKW) || !isFinite(K)) return NaN;
  if (shaftPowerKW < 0 || K < 1 || K > 2) return NaN;
  return shaftPowerKW * K;
}

/**
 * 综合计算：根据输入参数返回全部结果
 * @param {Object} params
 * @param {number} params.qm3h   - 流量 m³/h
 * @param {number} params.hGeo   - 几何扬程 m
 * @param {number} params.eta    - 效率 0~1
 * @param {number} params.K      - 安全系数
 * @param {number} params.rho    - 密度 kg/m³
 * @param {number} params.dmm    - 管径 mm
 * @param {number} params.L      - 管长 m
 * @param {number} params.eps    - 粗糙度 mm
 * @param {number} params.zeta   - 局部阻力系数和
 * @param {number} params.nu     - 运动粘度 m²/s
 * @returns {Object} 包含各中间量与最终结果的对象；任一非法输入对应字段为 NaN
 */
function computeAll(params) {
  const p = params || {};
  const qm3s = flowToSI(p.qm3h);
  const dm = diameterToSI(p.dmm);
  const epsM = (typeof p.eps === 'number' && isFinite(p.eps) && p.eps >= 0) ? p.eps / 1000 : NaN;

  const v = calcFlowVelocity(qm3s, dm);
  const Re = calcReynolds(v, dm, p.nu);
  const lambda = estimateFrictionFactor(Re, epsM, dm);
  const hf = calcFrictionLoss(lambda, p.L, dm, v);
  const hj = calcLocalLoss(p.zeta, v);
  const H = calcTotalHead(p.hGeo, hf, hj);
  const Pshaft = calcShaftPower(qm3s, H, p.eta, p.rho);
  const Pmotor = calcMotorPower(Pshaft, p.K);

  return {
    q_m3s: qm3s,
    d_m: dm,
    v_m_s: v,
    Re: Re,
    lambda: lambda,
    hf_m: hf,
    hj_m: hj,
    H_m: H,
    P_shaft_kW: Pshaft,
    P_motor_kW: Pmotor,
    flowRegime: !isFinite(Re) ? '未知' : (Re < 2300 ? '层流' : (Re < 4000 ? '过渡区（结果不可靠）' : '湍流'))
  };
}

/* ============================================================
 *  第二部分：单元测试（≥30 个）
 * ============================================================ */

let _pass = 0, _fail = 0, _log = [];

function approx(a, b, tol) {
  if (!isFinite(a) || !isFinite(b)) return a === b;
  tol = (tol === undefined) ? 1e-6 : tol;
  return Math.abs(a - b) <= tol;
}

function assert(name, cond, detail) {
  if (cond) {
    _pass++;
    _log.push('<span class="ok">✓ ' + name + '</span>');
  } else {
    _fail++;
    _log.push('<span class="ng">✗ ' + name + (detail ? '  (' + detail + ')' : '') + '</span>');
  }
}

function assertApprox(name, actual, expected, tol) {
  assert(name, approx(actual, expected, tol),
    '期望 ' + expected + '，实际 ' + actual);
}

function assertNaN(name, val) {
  assert(name, typeof val === 'number' && isNaN(val), '期望 NaN，实际 ' + val);
}

function runAllTests() {
  _pass = 0; _fail = 0; _log = [];

  // ---- flowToSI ----
  assertApprox('flowToSI(3600) = 1', flowToSI(3600), 1, 1e-12);
  assertApprox('flowToSI(0) = 0', flowToSI(0), 0, 1e-12);
  assertNaN('flowToSI(-1) = NaN', flowToSI(-1));
  assertNaN('flowToSI(Infinity) = NaN', flowToSI(Infinity));
  assertNaN('flowToSI("abc") = NaN', flowToSI('abc'));

  // ---- diameterToSI ----
  assertApprox('diameterToSI(100) = 0.1', diameterToSI(100), 0.1, 1e-12);
  assertNaN('diameterToSI(0) = NaN', diameterToSI(0));
  assertNaN('diameterToSI(-5) = NaN', diameterToSI(-5));

  // ---- calcFlowVelocity ----
  // Q=1 m³/s, D=1 m => A=π/4 => v=4/π≈1.2732
  assertApprox('流速：Q=1,D=1 => v=4/π', calcFlowVelocity(1, 1), 4 / Math.PI, 1e-9);
  assertNaN('流速：Q=0 => NaN', calcFlowVelocity(0, 1));
  assertNaN('流速：D=0 => NaN', calcFlowVelocity(1, 0));

  // ---- calcReynolds ----
  // v=1, D=0.1, ν=1e-6 => Re=1e5
  assertApprox('雷诺数：v=1,D=0.1,ν=1e-6 => 1e5', calcReynolds(1, 0.1, 1e-6), 1e5, 1e-3);
  assertNaN('雷诺数：ν=0 => NaN', calcReynolds(1, 0.1, 0));
  assertNaN('雷诺数：v<0 => NaN', calcReynolds(-1, 0.1, 1e-6));

  // ---- estimateFrictionFactor ----
  // 层流 Re=1000 => λ=64/1000=0.064
  assertApprox('摩擦系数：层流 Re=1000 => 0.064', estimateFrictionFactor(1000, 0, 0.1), 0.064, 1e-9);
  // 过渡区返回 NaN
  assertNaN('摩擦系数：Re=3000 过渡区 => NaN', estimateFrictionFactor(3000, 0.00005, 0.1));
  // 湍流光滑管 Re=1e5, ε=0 => 应约为 0.018
  const lamSmooth = estimateFrictionFactor(1e5, 0, 0.1);
  assert('摩擦系数：湍流光滑管 Re=1e5 在合理范围', lamSmooth > 0.015 && lamSmooth < 0.022);
  assertNaN('摩擦系数：Re<0 => NaN', estimateFrictionFactor(-100, 0, 0.1));

  // ---- calcFrictionLoss ----
  // λ=0.02, L=100, D=0.1, v=1, g=9.81 => 0.02*1000*1/19.62 ≈ 1.0194
  assertApprox('沿程损失：λ=0.02,L=100,D=0.1,v=1',
    calcFrictionLoss(0.02, 100, 0.1, 1, 9.81),
    0.02 * 1000 / 19.62, 1e-6);

const SRC_TEXT = `/**
 * 将流量从 m³/h 换算为 m³/s
 * @param {number} qm3h - 流量，单位 m³/h
 * @returns {number} 流量，单位 m³/s；非法输入返回 NaN
 */
function flowToSI(qm3h) {
  if (typeof qm3h !== 'number' || !isFinite(qm3h) || qm3h < 0) return NaN;
  return qm3h / 3600;
}

/**
 * 将管径从 mm 换算为 m
 * @param {number} dmm - 管径，单位 mm
 * @returns {number} 管径，单位 m；非法输入返回 NaN
 */
function diameterToSI(dmm) {
  if (typeof dmm !== 'number' || !isFinite(dmm) || dmm <= 0) return NaN;
  return dmm / 1000;
}

/**
 * 根据流量与管径计算管内平均流速
 * @param {number} qm3s - 流量，m³/s
 * @param {number} dm   - 管道内径，m
 * @returns {number} 流速，m/s
 */
function calcFlowVelocity(qm3s, dm) {
  if (!isFinite(qm3s) || !isFinite(dm) || qm3s <= 0 || dm <= 0) return NaN;
  const A = Math.PI * dm * dm / 4;
  return qm3s / A;
}

/**
 * 计算雷诺数 Re = v·D / ν
 * @param {number} v  - 流速，m/s
 * @param {number} dm - 管径，m
 * @param {number} nu - 运动粘度，m²/s
 * @returns {number} 雷诺数
 */
function calcReynolds(v, dm, nu) {
  if (!isFinite(v) || !isFinite(dm) || !isFinite(nu) || v < 0 || dm <= 0 || nu <= 0) return NaN;
  return v * dm / nu;
}

/**
 * Swamee-Jain 显式公式估算 Darcy 摩擦系数 λ
 * 层流 Re<2300 返回 64/Re；过渡区 2300~4000 返回 NaN
 * @param {number} Re  - 雷诺数
 * @param {number} eps - 绝对粗糙度，m
 * @param {number} dm  - 管径，m
 * @returns {number} Darcy 摩擦系数 λ
 */
function estimateFrictionFactor(Re, eps, dm) {
  if (!isFinite(Re) || !isFinite(eps) || !isFinite(dm) || Re <= 0 || eps < 0 || dm <= 0) return NaN;
  if (Re < 2300) return 64 / Re;
  if (Re < 4000) return NaN;
  const term = eps / (3.7 * dm) + 5.74 / Math.pow(Re, 0.9);
  if (term <= 0) return NaN;
  return 0.25 / Math.pow(Math.log10(term), 2);
}

/**
 * Darcy-Weisbach 沿程水头损失
 * @param {number} lambda - Darcy 摩擦系数
 * @param {number} L      - 管长，m
 * @param {number} dm     - 管径，m
 * @param {number} v      - 流速，m/s
 * @param {number} [g=9.81]
 * @returns {number} 沿程损失，m
 */
function calcFrictionLoss(lambda, L, dm, v, g = 9.81) {
  if (!isFinite(lambda) || !isFinite(L) || !isFinite(dm) || !isFinite(v) || !isFinite(g)) return NaN;
  if (lambda < 0 || L < 0 || dm <= 0 || g <= 0) return NaN;
  return lambda * (L / dm) * (v * v) / (2 * g);
}

/**
 * 局部水头损失
 * @param {number} sumZeta - 局部阻力系数之和
 * @param {number} v       - 流速，m/s
 * @param {number} [g=9.81]
 * @returns {number} 局部损失，m
 */
function calcLocalLoss(sumZeta, v, g = 9.81) {
  if (!isFinite(sumZeta) || !isFinite(v) || !isFinite(g)) return NaN;
  if (sumZeta < 0 || g <= 0) return NaN;
  return sumZeta * (v * v) / (2 * g);
}

/**
 * 总扬程 H = H_geo + h_f + h_j
 */
function calcTotalHead(hGeo, frictionLoss, localLoss) {
  if (!isFinite(hGeo) || !isFinite(frictionLoss) || !isFinite(localLoss)) return NaN;
  return hGeo + frictionLoss + localLoss;
}

/**
 * 轴功率 P_shaft = ρ·g·Q·H / η  （返回 kW）
 */
function calcShaftPower(qm3s, H, eta, rho, g = 9.81) {
  if (!isFinite(qm3s) || !isFinite(H) || !isFinite(eta) || !isFinite(rho) || !isFinite(g)) return NaN;
  if (qm3s < 0 || H < 0 || eta <= 0 || eta > 1 || rho <= 0 || g <= 0) return NaN;
  return (rho * g * qm3s * H / eta) / 1000;
}

/**
 * 配用功率 P_motor = P_shaft · K
 */
function calcMotorPower(shaftPowerKW, K) {
  if (!isFinite(shaftPowerKW) || !isFinite(K)) return NaN;
  if (shaftPowerKW < 0 || K < 1 || K > 2) return NaN;
  return shaftPowerKW * K;
}

 * ============================================================ */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-' + t.dataset.tab).classList.add('active');
  });
});

function fmt(n, digits) {
  if (typeof n !== 'number' || !isFinite(n)) return '—';
  return n.toFixed(digits === undefined ? 3 : digits);
}

function doCalc() {
  const p = {
    qm3h: parseFloat(document.getElementById('q').value),
    hGeo: parseFloat(document.getElementById('hgeo').value),
    eta:  parseFloat(document.getElementById('eta').value),
    K:    parseFloat(document.getElementById('k').value),
    rho:  parseFloat(document.getElementById('rho').value),
    dmm:  parseFloat(document.getElementById('d').value),
    L:    parseFloat(document.getElementById('l').value),
    eps:  parseFloat(document.getElementById('eps').value),
    zeta: parseFloat(document.getElementById('zeta').value),
    nu:   parseFloat(document.getElementById('nu').value)
  };

  // 输入校验
  const errs = [];
  if (!(p.eta > 0 && p.eta <= 1)) errs.push('效率 η 必须在 (0, 1] 之间');
  if (!(p.K >= 1 && p.K <= 2)) errs.push('安全系数 K 必须在 [1, 2] 之间');
  if (!(p.qm3h > 0)) errs.push('流量必须 > 0');
  if (!(p.dmm > 0)) errs.push('管径必须 > 0');
  if (!(p.rho > 0)) errs.push('密度必须 > 0');
  if (!(p.nu > 0)) errs.push('运动粘度必须 > 0');

  const box = document.getElementById('result');
  if (errs.length) {
    box.innerHTML = '<div class="err"><strong>输入错误：</strong><br>' + errs.join('<br>') + '</div>';
    return;
  }

  const r = computeAll(p);

  let html = '<div class="result">';
  html += '<div class="row"><span>流量 Q</span><span class="val">' + fmt(p.qm3h, 2) + ' m³/h （' + fmt(r.q_m3s, 5) + ' m³/s）</span></div>';
  html += '<div class="row"><span>管内流速 v</span><span class="val">' + fmt(r.v_m_s, 3) + ' m/s</span></div>';
  html += '<div class="row"><span>雷诺数 Re</span><span class="val">' + fmt(r.Re, 0) + ' （' + r.flowRegime + '）</span></div>';
  html += '<div class="row"><span>Darcy 摩擦系数 λ</span><span class="val">' + fmt(r.lambda, 5) + '</span></div>';
  html += '<div class="row"><span>沿程损失 h_f</span><span class="val">' + fmt(r.hf_m, 3) + ' m</span></div>';
  html += '<div class="row"><span>局部损失 h_j</span><span class="val">' + fmt(r.hj_m, 3) + ' m</span></div>';
  html += '<div class="row"><span>所需总扬程 H</span><span class="val">' + fmt(r.H_m, 2) + ' m</span></div>';
  html += '<div class="row"><span>轴功率 P_shaft</span><span class="val">' + fmt(r.P_shaft_kW, 3) + ' kW</span></div>';
  html += '<div class="row"><span>配用功率 P_motor</span><span class="val">' + fmt(r.P_motor_kW, 3) + ' kW</span></div>';
  html += '</div>';

  if (!isFinite(r.lambda)) {
    html += '<div class="warn">摩擦系数无法计算（可能处于过渡区 Re=2300~4000），损失与总扬程结果不可靠。</div>';
  }
  html += '<div class="warn">以上结果为工程估算，典型误差 ±10%~±30%，详见《使用说明书·精度与误差说明》。</div>';

  box.innerHTML = html;
}

function doReset() {
  document.getElementById('q').value = 50;
  document.getElementById('hgeo').value = 30;
  document.getElementById('eta').value = 0.75;
  document.getElementById('k').value = 1.15;
  document.getElementById('rho').value = 1000;
  document.getElementById('d').value = 100;
  document.getElementById('l').value = 80;
  document.getElementById('eps').value = 0.05;
  document.getElementById('zeta').value = 8;
  document.getElementById('nu').value = 1.004e-6;
  document.getElementById('result').innerHTML = '';
}
</script>
</body>
</html>
