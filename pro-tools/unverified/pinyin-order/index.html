/**
 * 判断字符是否为汉字
 * @param {string} ch - 单个字符
 * @returns {boolean} 是否为汉字（CJK统一表意文字）
 * @example
 * isChinese('中'); // true
 * isChinese('A');  // false
 */
function isChinese(ch) {
  if (typeof ch !== 'string' || ch.length === 0) return false;
  const code = ch.charCodeAt(0);
  return (code >= 0x4E00 && code <= 0x9FFF) ||
         (code >= 0x3400 && code <= 0x4DBF) ||
         (code >= 0x20000 && code <= 0x2A6DF);
}

/**
 * 将单个汉字转换为拼音（无声调数字）
 * @param {string} char - 单个汉字
 * @returns {string} 拼音字符串（小写，无声调标记）；非汉字返回原字符
 * @throws {TypeError} 参数非字符串时抛出
 * @example
 * charToPinyin('中'); // 'zhong'
 * charToPinyin('国'); // 'guo'
 * charToPinyin('A');  // 'A'
 */
function charToPinyin(char) {
  if (typeof char !== 'string') {
    throw new TypeError('charToPinyin: 参数必须为字符串');
  }
  if (char.length === 0) return '';
  const ch = char.charAt(0);
  return PINYIN_DICT[ch] || ch;
}

/**
 * 将字符串转换为拼音（保留非汉字字符）
 * @param {string} str - 输入字符串
 * @returns {string} 拼音字符串，汉字转为拼音，其他字符保留
 * @throws {TypeError} 参数非字符串时抛出
 * @example
 * toPinyin('中国'); // 'zhongguo'
 * toPinyin('Hello世界'); // 'Helloshijie'
 */
function toPinyin(str) {
  if (typeof str !== 'string') {
    throw new TypeError('toPinyin: 参数必须为字符串');
  }
  let result = '';
  for (let i = 0; i < str.length; i++) {
    result += charToPinyin(str.charAt(i));
  }
  return result;
}

/**
 * 从拼音字符串中分离声母和韵母
 * @param {string} pinyin - 拼音字符串（小写，无声调数字）
 * @returns {{initial: string, final: string}} 声母和韵母
 * @throws {TypeError} 参数非字符串时抛出
 * @example
 * splitInitialFinal('zhong'); // {initial: 'zh', final: 'ong'}
 * splitInitialFinal('a');     // {initial: '', final: 'a'}
 */
function splitInitialFinal(pinyin) {
  if (typeof pinyin !== 'string') {
    throw new TypeError('splitInitialFinal: 参数必须为字符串');
  }
  const py = pinyin.toLowerCase().trim();
  if (py.length === 0) return { initial: '', final: '' };

  // 尝试匹配声母（先匹配长的，如 zh、ch、sh）
  for (const init of INITIALS) {
    if (py.startsWith(init)) {
      const finalPart = py.slice(init.length);
      // 特殊处理：y、w 开头的音节
      if (init === 'y' || init === 'w') {
        return { initial: init, final: finalPart || '' };
      }
      return { initial: init, final: finalPart };
    }
  }
  // 无声母
  return { initial: '', final: py };
}

/**
 * 获取拼音的声调数字（1-5，5表示轻声）
 * @param {string} pinyin - 带声调标记的拼音（如 "zhōng"）或无声调拼音
 * @returns {number} 声调数字 1-5
 * @example
 * getTone('zhōng'); // 1
 * getTone('zhong'); // 5 (默认轻声)
 */
function getTone(pinyin) {
  if (typeof pinyin !== 'string') return 5;
  // 检查是否含有 Unicode 声调符号
  const toneMarks = {
    'ā':'1','á':'2','ǎ':'3','à':'4',
    'ō':'1','ó':'2','ǒ':'3','ò':'4',
    'ē':'1','é':'2','ě':'3','è':'4',
    'ī':'1','í':'2','ǐ':'3','ì':'4',
    'ū':'1','ú':'2','ǔ':'3','ù':'4',
    'ǖ':'1','ǘ':'2','ǚ':'3','ǜ':'4'
  };
  for (const ch of pinyin) {
    if (toneMarks[ch]) return parseInt(toneMarks[ch]);
  }
  return 5; // 默认轻声
}

 * @returns {string} 注音符号字符串
 * @throws {TypeError} 参数类型错误时抛出
 * @example
 * toZhuyin('zhong', 1); // 'ㄓㄨㄥ'
 * toZhuyin('a', 4);     // 'ㄚˋ'
 */
function toZhuyin(pinyin, tone = 1) {
  if (typeof pinyin !== 'string') {
    throw new TypeError('toZhuyin: 第一个参数必须为字符串');
  }
  if (typeof tone !== 'number' || tone < 1 || tone > 5) {
    throw new RangeError('toZhuyin: 声调必须为 1-5 的整数');
  }
  const { initial, final } = splitInitialFinal(pinyin);
  let result = '';
  if (initial && ZHUYIN_MAP[initial]) result += ZHUYIN_MAP[initial];
  if (final && ZHUYIN_MAP[final]) result += ZHUYIN_MAP[final];
  else if (final) result += final; // fallback
  if (TONE_ZHUYIN[tone]) result += TONE_ZHUYIN[tone];
  return result;
}

/**
 * 将拼音转换为国际音标（IPA）
 * @param {string} pinyin - 拼音字符串（无声调）
 * @param {number} [tone=1] - 声调 1-5
 * @returns {string} IPA 字符串，如 "[ʈʂuŋ˥]"
 * @throws {TypeError} 参数类型错误时抛出
 * @example
 * toIPA('zhong', 1); // '[ʈʂuŋ˥]'
 * toIPA('a', 4);     // '[a˥˩]'
 */
function toIPA(pinyin, tone = 1) {
  if (typeof pinyin !== 'string') {
    throw new TypeError('toIPA: 第一个参数必须为字符串');
  }
  if (typeof tone !== 'number' || tone < 1 || tone > 5) {
    throw new RangeError('toIPA: 声调必须为 1-5 的整数');
  }
  const { initial, final } = splitInitialFinal(pinyin);
  let ipa = '';
  if (initial && INITIAL_IPA[initial]) ipa += INITIAL_IPA[initial];
  if (final && FINAL_IPA[final]) ipa += FINAL_IPA[final];
  else if (final) ipa += final;
  if (TONE_IPA[tone]) ipa += TONE_IPA[tone];
  return '[' + ipa + ']';
}

/**
 * 分析单个汉字的完整拼音信息
 * @param {string} char - 单个汉字
 * @returns {Object|null} 包含 pinyin/initial/final/tone/zhuyin/ipa 的对象；非汉字返回 null
 * @throws {TypeError} 参数非字符串时抛出
 * @example
 * analyzeChar('中');
 * // { char:'中', pinyin:'zhong', initial:'zh', final:'ong', tone:1, zhuyin:'ㄓㄨㄥ', ipa:'[ʈʂuŋ]' }
 */
function analyzeChar(char) {
  if (typeof char !== 'string') {
    throw new TypeError('analyzeChar: 参数必须为字符串');
  }
  if (char.length === 0) return null;
  const ch = char.charAt(0);
  if (!isChinese(ch)) return null;
  const pinyin = charToPinyin(ch);
  const { initial, final } = splitInitialFinal(pinyin);
  const tone = 1; // 默认一声（字典中无声调信息）
  return {
    char: ch,
    pinyin: pinyin,
    initial: initial,
    final: final,
    tone: tone,
    zhuyin: toZhuyin(pinyin, tone),
    ipa: toIPA(pinyin, tone)
  };
}

/**
 * 按拼音字母序对字符串数组排序
 * @param {string[]} arr - 待排序的字符串数组
 * @returns {string[]} 排序后的新数组（不修改原数组）
 * @throws {TypeError} 参数非数组时抛出
 * @example
 * sortByPinyin(['北京','上海','广州']); // ['北京','广州','上海']
 */
function sortByPinyin(arr) {
  if (!Array.isArray(arr)) {
    throw new TypeError('sortByPinyin: 参数必须为数组');
  }
  return [...arr].sort((a, b) => {
    const pyA = toPinyin(String(a)).toLowerCase();
    const pyB = toPinyin(String(b)).toLowerCase();
    if (pyA < pyB) return -1;
    if (pyA > pyB) return 1;
    return 0;
  });
}

/**
 * 分析字符串中每个字符的拼音信息
 * @param {string} str - 输入字符串
 * @returns {Array<Object>} 每个字符的分析结果数组
 * @throws {TypeError} 参数非字符串时抛出
 * @example
 * analyzeString('中国');
 * // [{char:'中',...}, {char:'国',...}]
 */
function analyzeString(str) {
  if (typeof str !== 'string') {
    throw new TypeError('analyzeString: 参数必须为字符串');
  }
  const result = [];
  for (const ch of str) {
    if (isChinese(ch)) {
      result.push(analyzeChar(ch));
    } else {
      result.push({ char: ch, pinyin: ch, initial: '', final: '', tone: 0, zhuyin: '', ipa: '' });
    }
  }
  return result;
}

// 导出到全局（浏览器环境）
if (typeof window !== 'undefined') {
  window.PinyinTool = {
    isChinese, charToPinyin, toPinyin, splitInitialFinal, getTone,
    toZhuyin, toIPA, analyzeChar, sortByPinyin, analyzeString,
    PINYIN_DICT, INITIALS, FINALS, ZHUYIN_MAP, INITIAL_IPA, FINAL_IPA
  };
}
</script>

 * @param {*} actual - 实际值
 * @param {*} expected - 期望值
 */
function assert(name, actual, expected) {
  const pass = JSON.stringify(actual) === JSON.stringify(expected);
  if (pass) {
    testPass++;
    testLog.push(`<span class="test-pass">✓ ${name}</span>`);
  } else {
    testFail++;
    testLog.push(`<span class="test-fail">✗ ${name}</span><br>&nbsp;&nbsp;期望: ${JSON.stringify(expected)}<br>&nbsp;&nbsp;实际: ${JSON.stringify(actual)}`);
  }
}

/**
 * 断言抛出异常
 * @param {string} name - 测试名称
 * @param {Function} fn - 被测函数
 * @param {string} errorType - 期望的错误类型名
 */
function assertThrows(name, fn, errorType) {
  try {
    fn();
    testFail++;
    testLog.push(`<span class="test-fail">✗ ${name}</span> - 未抛出异常`);
  } catch (e) {
    if (e.name === errorType || e.constructor.name === errorType) {

      testLog.push(`<span class="test-pass">✓ ${name}</span>`);
    } else {

  }
}

  assert('splitInitialFinal: "bei" 韵母', r3.final, 'ei');

  // ===== analyzeString 测试 =====

  // 汇总
  const total = testPass + testFail;

}

<b>⚠ 严谨性声明</b>：本工具的汉字字典为常用字子集（约 1000 字），多音字仅取最常用读音。如需完整覆盖，需查《现代汉语词典》全文或接入专业拼音库。IPA 转写为宽式标音，未体现语流音变（如"一"的变调、"不"的变调、轻声的音高变化等），如需严式标音需查语音学专著。

<h2>六、局限性说明</h2>

<div class="info">
<b>本工具不能做以下事情：</b>
<ol>
  <li><b>多音字语境识别</b>：如"重"在"重要"中读 zhòng，在"重复"中读 chóng，本工具统一取最常用读音（zhòng），无法根据上下文判断。</li>
  <li><b>生僻字支持</b>：字典仅覆盖约 1000 个常用汉字，生僻字（如"龘"、"饕餮"）无法转换。</li>
  <li><b>语流音变</b>：不处理"一"、"不"的变调，不处理轻声的实际音高，不处理儿化的韵母变化。</li>
  <li><b>词语连写</b>：按 GB/T 16159-2012，词语应连写（如"北京"→"běijīng"），本工具仅做字面拼接，未实现分词连写规则。</li>
  <li><b>繁体字支持</b>：仅支持简体字，繁体字（如"國"、"東"）不在字典中。</li>
  <li><b>方言拼音</b>：仅支持普通话拼音，不支持粤语拼音、闽南语拼音等。</li>
  <li><b>声调自动识别</b>：输入无声调标记的拼音时，默认按一声处理（analyzeChar 中 tone=1），无法自动判断实际声调。</li>
  <li><b>性能限制</b>：字典采用线性查找，对超长文本（&gt;10万字）性能可能不佳。</li>
</ol>

/* ============================================================
 *  第四部分：在线演示
 * ============================================================ */

function runDemo() {
  const T = window.PinyinTool;
  const input = document.getElementById('demoInput').value.trim();
  if (!input) {
    document.getElementById('demoOutput').innerHTML = '<i>请输入内容</i>';
    return;
  }
  // 按空格、逗号、换行分隔
  const items = input.split(/[\s,，;；]+/).filter(s => s.length > 0);
  const sorted = T.sortByPinyin(items);

  let html = '<b>排序结果：</b><br>';
  html += sorted.map(s => s + ' (' + T.toPinyin(s) + ')').join(' → ') + '<br><br>';

  html += '<b>逐字分析：</b><br>';
  html += '<table><tr><th>汉字</th><th>拼音</th><th>声母</th><th>韵母</th><th>声调</th><th>注音</th><th>IPA</th></tr>';
  for (const item of sorted) {
    const analysis = T.analyzeString(item);
    for (const a of analysis) {
      html += `<tr><td>${a.char}</td><td>${a.pinyin}</td><td>${a.initial||'-'}</td><td>${a.final||'-'}</td><td>${a.tone||'-'}</td><td>${a.zhuyin||'-'}</td><td>${a.ipa||'-'}</td></tr>`;
    }
  }
  html += '</table>';

  document.getElementById('demoOutput').innerHTML = html;
}
