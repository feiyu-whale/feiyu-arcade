<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f1e8;
  color: #333;
  line-height: 1.6;
  padding: 16px;
  min-height: 100vh;
}
.container {
  max-width: 640px;
  margin: 0 auto;
  font-size: 15px;
}
h1 {
  text-align: center;
  color: #8b4513;
  margin-bottom: 8px;
  font-size: 24px;
}
.subtitle {
  text-align: center;
  color: #666;
  font-size: 13px;
  margin-bottom: 20px;
}
.search-box {
  margin-bottom: 16px;
}
.search-box input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 15px;
}
.section-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.section-btn {
  padding: 6px 12px;
  background: #fff;
  border: 1px solid #8b4513;
  color: #8b4513;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
}
.section-btn.active {
  background: #8b4513;
  color: #fff;
}
.content {
  background: #fff;
  padding: 16px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.section-title {
  color: #8b4513;
  font-size: 18px;
  margin-bottom: 12px;
  border-bottom: 2px solid #8b4513;
  padding-bottom: 6px;
}
.sentence {
  margin-bottom: 12px;
  font-size: 20px;
  line-height: 2.5;
}
.char {
  display: inline-block;
  position: relative;
  cursor: pointer;
  padding: 2px 4px;
  margin: 0 1px;
}
.char.hard {
  color: #8b4513;
  font-weight: bold;
}
.char .pinyin {
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: #999;
  white-space: nowrap;
}
.char .meaning {
  display: none;
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 13px;
  white-space: nowrap;
  z-index: 10;
  margin-bottom: 4px;
}
.char.show-meaning .meaning {
  display: block;
}
.char.highlight {
  background: #ffeb3b;
}
.data-source {
  margin-top: 24px;
  padding: 16px;
  background: #fff;
  border-radius: 8px;
  font-size: 13px;
  color: #666;
}
.data-source h3 {
  color: #8b4513;
  margin-bottom: 8px;
  font-size: 15px;
}
.data-source p {
  margin-bottom: 8px;
}
.version {
  position: fixed;
  bottom: 8px;
  right: 8px;
  font-size: 11px;
  color: #999;
}
</style>
</head>
<body>
<div class="container">

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入字或词搜索...">
  </div>
  
  <div class="section-nav" id="sectionNav"></div>
  
  <div class="content" id="content"></div>
  
  <div class="data-source">
    <h3>📚 数据依据</h3>
    <p>本文依据南朝梁周兴嗣撰《千字文》通行本。全文共250句，每句4字，合计1000字，字不重复（通行本说法，个别版本有争议字）。</p>
    <p>注音依据《普通话异读词审音表》（国家语委，1985年修订）及《现代汉语词典》（第7版）。释义参考历代注本，以白话简明解释为主。</p>
    <p>注：《千字文》为古典文献，部分字词古义与今义不同，释义以文中语境为准。</p>
  </div>
</div>

let currentSection = 0;
let searchTerm = '';

function renderSectionNav() {
  const nav = document.getElementById('sectionNav');
  nav.innerHTML = '';
  sections.forEach((section, index) => {
    const btn = document.createElement('button');
    btn.className = 'section-btn' + (index === currentSection ? ' active' : '');
    btn.textContent = section.title;
    btn.onclick = () => {
      currentSection = index;
      renderSectionNav();
      renderContent();
    };
    nav.appendChild(btn);
  });
}

function renderContent() {
  const content = document.getElementById('content');
  const section = sections[currentSection];
  
  let html = `<div class="section-title">${section.title}</div>`;
  
  section.sentences.forEach(sentence => {
    html += '<div class="sentence">';
    for (let i = 0; i < sentence.length; i++) {
      const char = sentence[i];
      const isHard = hardChars[char];
      const isHighlight = searchTerm && sentence.includes(searchTerm);
      
      let charHtml = `<span class="char${isHard ? ' hard' : ''}${isHighlight ? ' highlight' : ''}" data-char="${char}">`;
      
      if (isHard) {
        charHtml += `<span class="pinyin">${isHard.pinyin}</span>`;
      }
      
      charHtml += char;
      
      if (isHard) {
        charHtml += `<span class="meaning">${isHard.meaning}</span>`;
      }
      
      charHtml += '</span>';
      html += charHtml;
    }
    html += '</div>';
  });
  
  content.innerHTML = html;
  
  // 添加点击事件
  document.querySelectorAll('.char.hard').forEach(charEl => {
    charEl.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasShowing = charEl.classList.contains('show-meaning');
      document.querySelectorAll('.char.show-meaning').forEach(el => {
        el.classList.remove('show-meaning');
      });
      if (!wasShowing) {
        charEl.classList.add('show-meaning');
      }
    });
  });
  
  // 点击其他地方关闭释义
  document.addEventListener('click', () => {
    document.querySelectorAll('.char.show-meaning').forEach(el => {
      el.classList.remove('show-meaning');
    });
  });
}

function handleSearch() {
  const input = document.getElementById('searchInput');
  searchTerm = input.value.trim();
  renderContent();
}

document.getElementById('searchInput').addEventListener('input', handleSearch);

renderSectionNav();
renderContent();
</script>
