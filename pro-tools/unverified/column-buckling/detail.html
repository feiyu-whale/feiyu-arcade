<script>
// ============================================================
// 第一部分：JS 源码 —— 压杆稳定计算核心算法
// ============================================================

/**
 * 获取有效长度系数 μ
 * 根据压杆的支承条件确定有效长度系数。
 *
 * @param {string} supportType - 支承类型，可选值：
 *   'pinned-pinned'     两端铰支 (μ=1.0)
 *   'fixed-free'        一端固定一端自由 (μ=2.0)
 *   'fixed-fixed'       两端固定 (μ=0.5)
 *   'fixed-pinned'      一端固定一端铰支 (μ=0.7)
 * @returns {number} 有效长度系数 μ（无量纲）
 * @throws {Error} 当 supportType 不是合法值时抛出异常
 * @example
 *   getEffectiveLengthFactor('pinned-pinned'); // 返回 1.0
 *   getEffectiveLengthFactor('fixed-free');    // 返回 2.0
 */
function getEffectiveLengthFactor(supportType) {
  const factors = {
    'pinned-pinned': 1.0,
    'fixed-free': 2.0,
    'fixed-fixed': 0.5,
    'fixed-pinned': 0.7
  };
  if (typeof supportType !== 'string' || !factors.hasOwnProperty(supportType)) {
    throw new Error(`无效的支承类型: "${supportType}"。可选值: pinned-pinned, fixed-free, fixed-fixed, fixed-pinned`);
  }
  return factors[supportType];
}

/**
 * 计算截面回转半径 i
 * i = √(I / A)
 *
 * @param {number} I - 截面惯性矩 (m⁴)，必须 > 0
 * @param {number} A - 截面面积 (m²)，必须 > 0
 * @returns {number} 回转半径 i (m)
 * @throws {Error} 当 I 或 A 不是有限正数时抛出异常
 * @example
 *   calculateRadiusOfGyration(8.33e-6, 0.01); // 返回 ≈ 0.02887 m
 */
function calculateRadiusOfGyration(I, A) {
  if (!Number.isFinite(I) || !Number.isFinite(A)) {
    throw new Error(`I 和 A 必须是有限数字，收到 I=${I}, A=${A}`);
  }
  if (I <= 0) {
    throw new Error(`截面惯性矩 I 必须大于 0，收到 I=${I}`);
  }
  if (A <= 0) {
    throw new Error(`截面面积 A 必须大于 0，收到 A=${A}`);
  }
  return Math.sqrt(I / A);
}

/**
 * 计算长细比 λ
 * λ = μL / i
 *
 * @param {number} mu - 有效长度系数（无量纲），必须 > 0
 * @param {number} L  - 杆件实际长度 (m)，必须 > 0
 * @param {number} i  - 截面回转半径 (m)，必须 > 0
 * @returns {number} 长细比 λ（无量纲）
 * @throws {Error} 当任一参数不是有限正数时抛出异常
 * @example
 *   calculateSlendernessRatio(1.0, 3.0, 0.02); // 返回 150
 */
function calculateSlendernessRatio(mu, L, i) {
  if (!Number.isFinite(mu) || !Number.isFinite(L) || !Number.isFinite(i)) {
    throw new Error(`所有参数必须是有限数字，收到 mu=${mu}, L=${L}, i=${i}`);
  }
  if (mu <= 0) {
    throw new Error(`有效长度系数 mu 必须大于 0，收到 mu=${mu}`);
  }
  if (L <= 0) {
    throw new Error(`杆件长度 L 必须大于 0，收到 L=${L}`);
  }
  if (i <= 0) {
    throw new Error(`回转半径 i 必须大于 0，收到 i=${i}`);
  }
  return (mu * L) / i;
}

/**
 * 计算比例极限长细比 λp
 * λp = π × √(E / σp)
 * 当 λ ≥ λp 时，欧拉公式适用（弹性失稳范围）。
 *
 * @param {number} E     - 弹性模量 (Pa)，必须 > 0
 * @param {number} sigmaP - 比例极限应力 (Pa)，必须 > 0
 * @returns {number} 比例极限长细比 λp（无量纲）
 * @throws {Error} 当参数不是有限正数时抛出异常
 * @example
 *   calculateProportionalLimitSlenderness(206e9, 200e6); // 返回 ≈ 100.8
 */
function calculateProportionalLimitSlenderness(E, sigmaP) {
  if (!Number.isFinite(E) || !Number.isFinite(sigmaP)) {
    throw new Error(`E 和 sigmaP 必须是有限数字，收到 E=${E}, sigmaP=${sigmaP}`);
  }
  if (E <= 0) {
    throw new Error(`弹性模量 E 必须大于 0，收到 E=${E}`);
  }
  if (sigmaP <= 0) {
    throw new Error(`比例极限 sigmaP 必须大于 0，收到 sigmaP=${sigmaP}`);
  }
  return Math.PI * Math.sqrt(E / sigmaP);
}

/**
 * 计算欧拉临界力 Pcr
 * Pcr = π² × E × I / (μ × L)²
 *
 * @param {number} E  - 材料弹性模量 (Pa)，必须 > 0
 * @param {number} I  - 截面最小惯性矩 (m⁴)，必须 > 0
 * @param {number} mu - 有效长度系数（无量纲），必须 > 0
 * @param {number} L  - 杆件实际长度 (m)，必须 > 0
 * @returns {number} 欧拉临界力 Pcr (N)
 * @throws {Error} 当任一参数不是有限正数时抛出异常
 * @example
 *   calculateEulerCriticalLoad(206e9, 8.33e-6, 1.0, 3.0);
 *   // 返回 ≈ 18849.6 N
 */
function calculateEulerCriticalLoad(E, I, mu, L) {
  if (!Number.isFinite(E) || !Number.isFinite(I) || !Number.isFinite(mu) || !Number.isFinite(L)) {
    throw new Error(`所有参数必须是有限数字，收到 E=${E}, I=${I}, mu=${mu}, L=${L}`);
  }
  if (E <= 0) {
    throw new Error(`弹性模量 E 必须大于 0，收到 E=${E}`);
  }
  if (I <= 0) {
    throw new Error(`截面惯性矩 I 必须大于 0，收到 I=${I}`);
  }
  if (mu <= 0) {
    throw new Error(`有效长度系数 mu 必须大于 0，收到 mu=${mu}`);
  }
  if (L <= 0) {
    throw new Error(`杆件长度 L 必须大于 0，收到 L=${L}`);
  }
  const effectiveLength = mu * L;
  return (Math.PI * Math.PI * E * I) / (effectiveLength * effectiveLength);
}

/**
 * 计算欧拉临界应力 σcr
 * σcr = π² × E / λ²
 * 注意：仅当 λ ≥ λp 时适用。
 *
 * @param {number} E      - 材料弹性模量 (Pa)，必须 > 0
 * @param {number} lambda - 长细比（无量纲），必须 > 0
 * @returns {number} 临界应力 σcr (Pa)
 * @throws {Error} 当参数不是有限正数时抛出异常
 * @example
 *   calculateCriticalStress(206e9, 150); // 返回 ≈ 9042382 Pa ≈ 9.04 MPa
 */
function calculateCriticalStress(E, lambda) {
  if (!Number.isFinite(E) || !Number.isFinite(lambda)) {
    throw new Error(`E 和 lambda 必须是有限数字，收到 E=${E}, lambda=${lambda}`);
  }
  if (E <= 0) {
    throw new Error(`弹性模量 E 必须大于 0，收到 E=${E}`);
  }
  if (lambda <= 0) {
    throw new Error(`长细比 lambda 必须大于 0，收到 lambda=${lambda}`);
  }
  return (Math.PI * Math.PI * E) / (lambda * lambda);
}

/**
 * 检查欧拉公式是否适用
 * 当 λ ≥ λp 时，压杆处于弹性失稳范围，欧拉公式适用。
 *
 * @param {number} lambda  - 实际长细比（无量纲），必须 > 0
 * @param {number} lambdaP - 比例极限长细比（无量纲），必须 > 0
 * @returns {boolean} true 表示欧拉公式适用，false 表示不适用
 * @throws {Error} 当参数不是有限正数时抛出异常
 * @example
 *   checkApplicability(150, 100.8); // 返回 true
 *   checkApplicability(80, 100.8);  // 返回 false
 */
function checkApplicability(lambda, lambdaP) {
  if (!Number.isFinite(lambda) || !Number.isFinite(lambdaP)) {
    throw new Error(`lambda 和 lambdaP 必须是有限数字，收到 lambda=${lambda}, lambdaP=${lambdaP}`);
  }
  if (lambda <= 0) {
    throw new Error(`长细比 lambda 必须大于 0，收到 lambda=${lambda}`);
  }
  if (lambdaP <= 0) {
    throw new Error(`比例极限长细比 lambdaP 必须大于 0，收到 lambdaP=${lambdaP}`);
  }
  return lambda >= lambdaP;
}

/**
 * 完整压杆稳定计算（综合函数）
 * 一次性计算所有关键结果，包括适用性判断。
 *
 * @param {Object} params - 输入参数对象
 * @param {number} params.E     - 弹性模量 (Pa)
 * @param {number} params.I     - 截面最小惯性矩 (m⁴)
 * @param {number} params.A     - 截面面积 (m²)
 * @param {number} params.L     - 杆件长度 (m)
 * @param {string} params.supportType - 支承类型
 * @param {number} [params.sigmaP]    - 比例极限 (Pa)，可选，默认 200e6
 * @returns {Object} 计算结果对象
 * @returns {number} returns.mu          - 有效长度系数
 * @returns {number} returns.effectiveLength - 有效长度 (m)
 * @returns {number} returns.i           - 回转半径 (m)
 * @returns {number} returns.lambda      - 长细比
 * @returns {number} returns.lambdaP     - 比例极限长细比
 * @returns {number} returns.Pcr         - 欧拉临界力 (N)
 * @returns {number} returns.sigmaCr     - 临界应力 (Pa)
 * @returns {boolean} returns.isApplicable - 欧拉公式是否适用
 * @returns {string} returns.warning     - 不适用时的警告信息
 * @throws {Error} 当参数不合法时抛出异常
 * @example
 *   fullCalculation({
 *     E: 206e9, I: 8.33e-6, A: 0.01, L: 3.0,
 *     supportType: 'pinned-pinned', sigmaP: 200e6
 *   });
 */
function fullCalculation(params) {
  if (params === null || params === undefined || typeof params !== 'object') {
    throw new Error('参数必须是一个对象');
  }
  const { E, I, A, L, supportType, sigmaP } = params;
  const sp = (sigmaP !== undefined && sigmaP !== null) ? sigmaP : 200e6;

  const mu = getEffectiveLengthFactor(supportType);
  const effectiveLength = mu * L;
  const i = calculateRadiusOfGyration(I, A);
  const lambda = calculateSlendernessRatio(mu, L, i);
  const lambdaP = calculateProportionalLimitSlenderness(E, sp);
  const Pcr = calculateEulerCriticalLoad(E, I, mu, L);
  const sigmaCr = calculateCriticalStress(E, lambda);
  const isApplicable = checkApplicability(lambda, lambdaP);

  let warning = '';
  if (!isApplicable) {
    warning = `警告：长细比 λ=${lambda.toFixed(2)} < λp=${lambdaP.toFixed(2)}，欧拉公式不适用。此杆件处于弹塑性失稳范围，需使用经验公式（如直线公式或抛物线公式）计算临界应力。`;
  }

  return {
    mu,
    effectiveLength,
    i,
    lambda,
    lambdaP,
    Pcr,
    sigmaCr,
    isApplicable,
    warning
  };
}
</script>

<script>
// ============================================================
// 第二部分：单元测试（30+ 用例）
// ============================================================

let testResults = [];
let passCount = 0;
let totalCount = 0;

function assert(condition, testName, detail) {
  totalCount++;
  if (condition) {
    passCount++;
    testResults.push({ pass: true, name: testName, detail: detail || '' });
  } else {
    testResults.push({ pass: false, name: testName, detail: detail || '' });
  }
}

function assertApprox(actual, expected, tolerance, testName, detail) {
  const diff = Math.abs(actual - expected);
  const pass = diff <= tolerance;
  const d = `${detail} | 实际值=${actual}, 期望值=${expected}, 容差=${tolerance}, 差值=${diff}`;
  assert(pass, testName, d);
}

function assertThrows(fn, testName, detail) {
  let threw = false;
  try { fn(); } catch (e) { threw = true; }
  assert(threw, testName, detail || '期望抛出异常');
}

function runAllTests() {
  testResults = [];
  passCount = 0;
  totalCount = 0;

  // ===== getEffectiveLengthFactor 测试 =====

  // 测试1: 两端铰支 μ=1
  assert(
    getEffectiveLengthFactor('pinned-pinned') === 1.0,
    'T01-有效长度系数-两端铰支',
    '输入 pinned-pinned，期望 1.0'
  );

  // 测试2: 一端固定一端自由 μ=2
  assert(
    getEffectiveLengthFactor('fixed-free') === 2.0,
    'T02-有效长度系数-一端固定一端自由',
    '输入 fixed-free，期望 2.0'
  );

  // 测试3: 两端固定 μ=0.5
  assert(
    getEffectiveLengthFactor('fixed-fixed') === 0.5,
    'T03-有效长度系数-两端固定',
    '输入 fixed-fixed，期望 0.5'
  );

  // 测试4: 一端固定一端铰支 μ=0.7
  assert(
    getEffectiveLengthFactor('fixed-pinned') === 0.7,
    'T04-有效长度系数-一端固定一端铰支',
    '输入 fixed-pinned，期望 0.7'
  );

  // 测试5: 无效支承类型抛异常
  assertThrows(
    () => getEffectiveLengthFactor('invalid'),
    'T05-有效长度系数-无效输入抛异常',
    '输入 invalid，期望抛出 Error'
  );

  // 测试6: null 输入抛异常
  assertThrows(
    () => getEffectiveLengthFactor(null),
    'T06-有效长度系数-null输入',
    '输入 null，期望抛出 Error'
  );

  // 测试7: undefined 输入抛异常
  assertThrows(
    () => getEffectiveLengthFactor(undefined),
    'T07-有效长度系数-undefined输入',
    '输入 undefined，期望抛出 Error'
  );

  // 测试8: 空字符串输入抛异常
  assertThrows(
    () => getEffectiveLengthFactor(''),
    'T08-有效长度系数-空字符串输入',
    '输入空字符串，期望抛出 Error'
  );

  // ===== calculateRadiusOfGyration 测试 =====

  // 测试9: 正常值 矩形截面 100mm×100mm
  // I = 0.1^4/12 = 8.333e-6 m⁴, A = 0.01 m², i = sqrt(8.333e-6/0.01) = 0.02887 m
  assertApprox(
    calculateRadiusOfGyration(8.333333e-6, 0.01),
    0.028868, 0.0001,
    'T09-回转半径-矩形截面正常值',
    'I=8.333e-6, A=0.01'
  );

  // 测试10: 圆形截面 d=50mm
  // I = π×0.05^4/64 = 3.068e-7, A = π×0.05^2/4 = 1.963e-3, i = 0.0125
  assertApprox(
    calculateRadiusOfGyration(3.06796e-7, 1.9635e-3),
    0.0125, 0.0001,
    'T10-回转半径-圆形截面',
    'd=50mm圆截面'
  );

  // 测试11: I=0 抛异常
  assertThrows(
    () => calculateRadiusOfGyration(0, 0.01),
    'T11-回转半径-I=0抛异常',
    'I=0 应抛异常'
  );

  // 测试12: A为负数抛异常
  assertThrows(
    () => calculateRadiusOfGyration(1e-6, -0.01),
    'T12-回转半径-A为负数抛异常',
    'A<0 应抛异常'
  );

  // 测试13: NaN 输入抛异常
  assertThrows(
    () => calculateRadiusOfGyration(NaN, 0.01),
    'T13-回转半径-NaN输入',
    'I=NaN 应抛异常'
  );

  // ===== calculateSlendernessRatio 测试 =====

  // 测试14: 正常值 μ=1, L=3m, i=0.02m → λ=150
  assertApprox(
    calculateSlendernessRatio(1.0, 3.0, 0.02),
    150, 0.01,
    'T14-长细比-正常值1',
    'mu=1, L=3, i=0.02, 期望150'
  );

  // 测试15: 正常值 μ=2, L=2m, i=0.01m → λ=400
  assertApprox(
    calculateSlendernessRatio(2.0, 2.0, 0.01),
    400, 0.01,
    'T15-长细比-正常值2',
    'mu=2, L=2, i=0.01, 期望400'
  );

  // 测试16: 正常值 μ=0.5, L=4m, i=0.05m → λ=40
  assertApprox(
    calculateSlendernessRatio(0.5, 4.0, 0.05),
    40, 0.01,
    'T16-长细比-正常值3',
    'mu=0.5, L=4, i=0.05, 期望40'
  );

  // 测试17: L=0 抛异常
  assertThrows(
    () => calculateSlendernessRatio(1.0, 0, 0.02),
    'T17-长细比-L=0抛异常',
    'L=0 应抛异常'
  );

  // 测试18: i为负数抛异常
  assertThrows(
    () => calculateSlendernessRatio(1.0, 3.0, -0.02),
    'T18-长细比-i为负数抛异常',
    'i<0 应抛异常'
  );

  // 测试19: mu=NaN 抛异常
  assertThrows(
    () => calculateSlendernessRatio(NaN, 3.0, 0.02),
    'T19-长细比-mu=NaN抛异常',
    'mu=NaN 应抛异常'
  );

  // ===== calculateEulerCriticalLoad 测试 =====

  // 测试20: 钢杆 E=206GPa, I=8.33e-6, μ=1, L=3m
  // Pcr = π²×206e9×8.33e-6 / (1×3)² = 9.8696×206e9×8.33e-6/9
  // = 9.8696 × 1715980 / 9 = 1693682 / 9 ≈ 1881869... 让我重新算
  // π² = 9.8696
  // 9.8696 × 206e9 × 8.33e-6 = 9.8696 × 1715980 = 16936824.8
  // / 9 = 1881869.4 N
  // 实际上让我精确计算: π²×206e9×8.33e-6/(3²) = π²×206×8.33×10^3/9
  // = 9.86960440 × 1715.98 × 10^3 / 9 = 16936824.8 / 9 = 1881869.4
  // 不对，让我再算: 206e9 × 8.33e-6 = 206 × 8.33 × 10^3 = 1715.98 × 10^3 = 1715980
  // π² × 1715980 = 9.8696 × 1715980 = 16936824
  // / 9 = 1881869 N ≈ 1881.9 kN
  // 嗯这个值偏大，让我用更小的I
  // 用 I = 8.33e-8 (10mm×10mm截面): Pcr = π²×206e9×8.33e-8/9 = 18818.7 N
  (function() {
    const E = 206e9;
    const I = 8.33e-8;
    const mu = 1.0;
    const L = 3.0;
    const expected = Math.PI * Math.PI * E * I / (mu * L * mu * L);
    const actual = calculateEulerCriticalLoad(E, I, mu, L);
    assertApprox(actual, expected, 0.01,
      'T20-欧拉临界力-钢杆正常值',
      `E=206GPa, I=8.33e-8, mu=1, L=3, 期望=${expected.toFixed(2)}`
    );
  })();

  // 测试21: 铝杆 E=70GPa
  (function() {
    const E = 70e9;
    const I = 1e-6;
    const mu = 1.0;
    const L = 2.0;
    const expected = Math.PI * Math.PI * E * I / (mu * L * mu * L);
    const actual = calculateEulerCriticalLoad(E, I, mu, L);
    assertApprox(actual, expected, 0.01,
      'T21-欧拉临界力-铝杆',
      `E=70GPa, I=1e-6, mu=1, L=2, 期望=${expected.toFixed(2)}`
    );
  })();

  // 测试22: 不同μ值 μ=2 (一端固定一端自由)
  (function() {
    const E = 206e9;
    const I = 1e-6;
    const mu = 2.0;
    const L = 2.0;
    const expected = Math.PI * Math.PI * E * I / (mu * L * mu * L);
    const actual = calculateEulerCriticalLoad(E, I, mu, L);
    assertApprox(actual, expected, 0.01,
      'T22-欧拉临界力-μ=2',
      `E=206GPa, I=1e-6, mu=2, L=2, 期望=${expected.toFixed(2)}`
    );
  })();

  // 测试23: E=0 抛异常
  assertThrows(
    () => calculateEulerCriticalLoad(0, 1e-6, 1.0, 2.0),

    'E=0 应抛异常'
  );

  // 测试24: L为负数抛异常
  assertThrows(
    () => calculateEulerCriticalLoad(206e9, 1e-6, 1.0, -3.0),
    'T24-欧拉临界力-L为负数抛异常',
    'L<0 应抛异常'
  );

  // 测试25: I=undefined 抛异常
  assertThrows(
    () => calculateEulerCriticalLoad(206e9, undefined, 1.0, 3.0),
    'T25-欧拉临界力-I=undefined抛异常',
    'I=undefined 应抛异常'
  );

  // 测试26: 所有参数为null抛异常
  assertThrows(
    () => calculateEulerCriticalLoad(null, null, null, null),
    'T26-欧拉临界力-全null抛异常',
    '全null应抛异常'
  );

  // ===== calculateCriticalStress 测试 =====

  // 测试27: 正常值 E=206GPa, λ=150
  // σcr = π²×206e9/150² = 9.8696×206e9/22500 = 2033138/22500 ≈ 90361.7 Pa... 
  // 让我重算: π²×206e9 = 9.8696×206×10^9 = 2033.14×10^9 = 2.03314e12
  // / 22500 = 9.036e7 Pa = 90.36 MPa
  (function() {
    const E = 206e9;
    const lambda = 150;
    const expected = Math.PI * Math.PI * E / (lambda * lambda);
    const actual = calculateCriticalStress(E, lambda);
    assertApprox(actual, expected, 1,
      'T27-临界应力-正常值',
      `E=206GPa, λ=150, 期望=${expected.toFixed(2)} Pa`
    );
  })();

  // 测试28: λ=100
  (function() {
    const E = 206e9;
    const lambda = 100;
    const expected = Math.PI * Math.PI * E / (lambda * lambda);
    const actual = calculateCriticalStress(E, lambda);
    assertApprox(actual, expected, 1,
      'T28-临界应力-λ=100',
      `E=206GPa, λ=100, 期望=${expected.toFixed(2)} Pa`

  // 测试29: λ=0 抛异常

  // 测试30: E=NaN 抛异常

  );

  // ===== calculateProportionalLimitSlenderness 测试 =====

  // 测试31: Q235钢 E=206GPa, σp=200MPa → λp ≈ 100.8
  (function() {
    const E = 206e9;
    const sigmaP = 200e6;
    const expected = Math.PI * Math.sqrt(E / sigmaP);
    const actual = calculateProportionalLimitSlenderness(E, sigmaP);
    assertApprox(actual, expected, 0.1,
      'T31-比例极限长细比-Q235钢',
      `E=206GPa, σp=200MPa, 期望≈${expected.toFixed(2)}`
    );
  })();

  // 测试32: σp=0 抛异常
  assertThrows(
    () => calculateProportionalLimitSlenderness(206e9, 0),
    'T32-比例极限长细比-σp=0抛异常',
    'σp=0 应抛异常'
  );

  // ===== checkApplicability 测试 =====

  // 测试33: λ > λp → true
  assert(
    checkApplicability(150, 100.8) === true,

    'λ=150 > λp=100.8, 期望 true'
  );

  // 测试34: λ < λp → false
  assert(
    checkApplicability(80, 100.8) === false,
    'T34-适用性检查-λ<λp',
    'λ=80 < λp=100.8, 期望 false'
  );

  // 测试35: λ = λp → true (边界)
  assert(
    checkApplicability(100.8, 100.8) === true,
    'T35-适用性检查-λ=λp边界',
    'λ=λp=100.8, 期望 true'
  );

  // ===== 精度测试 =====

  // 测试36: 浮点精度 - 验证 π² 的计算精度
  (function() {
    const E = 200e9;
    const I = 1e-6;
    const mu = 1.0;
    const L = 1.0;
    const expected = Math.PI * Math.PI * 200e9 * 1e-6;
    const actual = calculateEulerCriticalLoad(E, I, mu, L);
    assertApprox(actual, expected, 1e-6,
      'T36-精度-π²计算精度',
      `简单情况验证π²精度, 期望=${expected}, 实际=${actual}`
    );
  })();

  // 测试37: 极大值测试
  (function() {
    const E = 300e9;
    const I = 1e-2;
    const mu = 0.5;
    const L = 0.5;
    const result = calculateEulerCriticalLoad(E, I, mu, L);

      'T37-极大值-有限正数',
      `大参数输入，结果=${result}, 应为有限正数`
    );
  })();

  // 测试38: 极小值测试
  (function() {
    const E = 1e3;
    const I = 1e-12;
    const mu = 1.0;
    const L = 100.0;
    const result = calculateEulerCriticalLoad(E, I, mu, L);
    assert(Number.isFinite(result) && result > 0,
      'T38-极小值-有限正数',
      `小参数输入，结果=${result}, 应为有限正数`
    );
  })();

  // 测试39: fullCalculation 综合测试 - 适用情况
  (function() {
    const result = fullCalculation({
      E: 206e9, I: 8.33e-8, A: 0.0001, L: 3.0,
      supportType: 'pinned-pinned', sigmaP: 200e6
    });
    // i = sqrt(8.33e-8/0.0001) = sqrt(8.33e-4) = 0.02886 m
    // λ = 1×3/0.02886 = 103.95
    // λp ≈ 100.8
    // λ > λp → 适用
    assert(result.isApplicable === true,
      'T39-综合计算-适用情况',
      `λ=${result.lambda.toFixed(2)}, λp=${result.lambdaP.toFixed(2)}, 应适用`
    );
  })();

  // 测试40: fullCalculation 综合测试 - 不适用情况
  (function() {
    const result = fullCalculation({
      E: 206e9, I: 8.33e-6, A: 0.01, L: 1.0,
      supportType: 'fixed-fixed', sigmaP: 200e6
    });
    // i = sqrt(8.33e-6/0.01) = 0.02887 m
    // λ = 0.5×1/0.02887 = 17.32
    // λp ≈ 100.8
    // λ < λp → 不适用
    assert(result.isApplicable === false,
      'T40-综合计算-不适用情况',
      `λ=${result.lambda.toFixed(2)}, λp=${result.lambdaP.toFixed(2)}, 应不适用`
    );
  })();

  // 测试41: fullCalculation 参数为null抛异常
  assertThrows(

    'T41-综合计算-null参数抛异常',

  );

  // 测试42: fullCalculation 无效支承类型抛异常
  assertThrows(

    '无效supportType应抛异常'
  );

  // 测试43: Infinity 输入抛异常
  assertThrows(
    () => calculateEulerCriticalLoad(Infinity, 1e-6, 1.0, 3.0),

    'E=Infinity 应抛异常'
  );

  // 测试44: 字符串数字输入抛异常
  assertThrows(

  );

  // 输出结果
  const resultDiv = document.getElementById('testResult');
  const logDiv = document.getElementById('testLog');

  if (passCount === totalCount) {
    resultDiv.className = 'test-result test-pass';
    resultDiv.textContent = `✅ 全部通过！通过 ${passCount} / 共 ${totalCount}`;
  } else {
    resultDiv.className = 'test-result test-fail';
    resultDiv.textContent = `❌ 通过 ${passCount} / 共 ${totalCount}（${totalCount - passCount} 个失败）`;
  }

  let logHtml = '';
  testResults.forEach((t, idx) => {
    const cls = t.pass ? 'pass' : 'fail';
    const icon = t.pass ? '✅' : '❌';
    logHtml += `<div class="test-item ${cls}">${icon} ${t.name}: ${t.detail}</div>`;
  });

}

<script>
// ============================================================
// 第三部分：使用说明书

document.getElementById('manualContent').innerHTML = `
<div class="manual-section">
<h2>一、工具概述</h2>
<p>本工具用于计算理想细长压杆的弹性稳定问题，核心基于材料力学中的欧拉公式（Euler's formula）。当轴向受压杆件的长细比足够大时，杆件会在达到材料强度极限之前发生弯曲失稳（屈曲），此时的临界载荷由欧拉公式确定。</p>
<p>本工具可计算以下关键参数：</p>
<p>（1）欧拉临界力 Pcr = π²EI / (μL)²，即压杆发生弹性失稳时所能承受的最大轴向压力；</p>
<p>（2）长细比 λ = μL / i，反映压杆的柔度程度，是判断失稳模式的关键无量纲参数；</p>
<p>（3）临界应力 σcr = π²E / λ²，即临界力对应的平均压应力；</p>
<p>（4）适用性判断：自动检测当前长细比是否满足欧拉公式的适用条件（λ ≥ λp）。</p>

<div class="warning">
<strong>重要提示：</strong>欧拉公式仅适用于弹性失稳范围（λ ≥ λp）。当长细比小于比例极限长细比时，压杆处于弹塑性失稳范围，需使用经验公式（如直线公式、抛物线公式或切线模量公式），本工具不提供此类计算。
</div>
</div>

<div class="manual-section">
<h2>二、参数详细说明</h2>
<table>
<tr><th>参数</th><th>符号</th><th>单位</th><th>取值范围</th><th>说明</th></tr>
<tr><td>弹性模量</td><td>E</td><td>Pa (帕斯卡)</td><td>> 0</td><td>材料的弹性模量，也称杨氏模量。常用结构钢 Q235/Q345 取 206 GPa（即 206×10⁹ Pa），铝合金约 70 GPa，木材顺纹约 10 GPa。数据来源：GB/T 50017-2017《钢结构设计标准》表 4.4.1。</td></tr>
<tr><td>截面惯性矩</td><td>I</td><td>m⁴</td><td>> 0</td><td>截面对屈曲轴的最小惯性矩。注意：压杆总是绕惯性矩最小的轴屈曲，因此必须取 Imin。矩形截面 Imin = bh³/12（h为短边），圆形截面 I = πd⁴/64。</td></tr>
<tr><td>截面面积</td><td>A</td><td>m²</td><td>> 0</td><td>杆件横截面的面积，用于计算回转半径 i = √(I/A) 和临界应力。</td></tr>
<tr><td>杆件长度</td><td>L</td><td>m (米)</td><td>> 0</td><td>压杆两支承点之间的实际几何长度。</td></tr>
<tr><td>有效长度系数</td><td>μ</td><td>无量纲</td><td>见下表</td><td>由杆端支承条件决定的系数，反映端部约束对临界力的影响。</td></tr>
<tr><td>比例极限</td><td>σp</td><td>Pa</td><td>> 0</td><td>材料的比例极限应力，用于计算 λp。Q235钢可取 200 MPa（需查标准原文确认具体牌号对应值）。</td></tr>
</table>

<h3>有效长度系数 μ 取值表</h3>
<table>
<tr><th>支承条件</th><th>μ 值</th><th>示意图说明</th></tr>
<tr><td>两端铰支</td><td>1.0</td><td>两端可自由转动，不能移动。如桁架中的腹杆（理想化模型）。</td></tr>
<tr><td>一端固定、一端自由</td><td>2.0</td><td>一端完全嵌固，另一端无任何约束。如悬臂柱、旗杆。</td></tr>
<tr><td>两端固定</td><td>0.5</td><td>两端均完全嵌固，不能转动也不能移动。实际工程中很难完全实现。</td></tr>
<tr><td>一端固定、一端铰支</td><td>0.7</td><td>一端嵌固，另一端可转动但不能移动。如底层柱脚固定、顶部与梁铰接。</td></tr>
</table>

<div class="manual-section">
<h2>三、实际使用场景</h2>

<div class="scenario">
<h4>场景1：钢结构桁架腹杆稳定性校核</h4>
<p><strong>背景：</strong>某钢屋架中的受压腹杆，采用等边角钢 L50×5，杆件几何长度 2.0 m，两端按铰接考虑。</p>
<p><strong>输入参数：</strong></p>
<p>• E = 206×10⁹ Pa（Q235钢）</p>
<p>• I = 最小惯性矩，L50×5 角钢 Imin ≈ 9.77×10⁻⁸ m⁴（需查型钢表确认）</p>
<p>• A = 4.80×10⁻⁴ m²（需查型钢表确认）</p>
<p>• L = 2.0 m</p>
<p>• supportType = 'pinned-pinned'（μ = 1.0）</p>
<p>• sigmaP = 200×10⁶ Pa</p>
<p><strong>计算过程：</strong></p>
<p>• i = √(I/A) = √(9.77×10⁻⁸ / 4.80×10⁻⁴) = √(2.035×10⁻⁴) ≈ 0.01427 m = 14.27 mm</p>
<p>• λ = μL/i = 1.0 × 2.0 / 0.01427 ≈ 140.2</p>
<p>• λp = π√(E/σp) = π√(206×10⁹/200×10⁶) ≈ 100.8</p>
<p>• λ = 140.2 > λp = 100.8 → 欧拉公式适用</p>
<p>• Pcr = π² × 206×10⁹ × 9.77×10⁻⁸ / (1.0 × 2.0)² ≈ 24,757 N ≈ 24.8 kN</p>
<p>• σcr = π² × 206×10⁹ / 140.2² ≈ 103.1 MPa</p>
<p><strong>结论：</strong>该腹杆欧拉临界力约 24.8 kN，临界应力约 103.1 MPa，小于比例极限 200 MPa，处于弹性失稳范围。</p>
</div>

<div class="scenario">
<h4>场景2：悬臂立柱（一端固定一端自由）</h4>
<p><strong>背景：</strong>一根圆形截面的铝制悬臂立柱，直径 30 mm，高度 1.5 m，底部固定，顶部自由，承受顶部轴向荷载。</p>
<p><strong>输入参数：</strong></p>
<p>• E = 70×10⁹ Pa（铝合金）</p>
<p>• I = π×(0.03)⁴/64 = 3.976×10⁻⁸ m⁴</p>
<p>• A = π×(0.03)²/4 = 7.069×10⁻⁴ m²</p>
<p>• L = 1.5 m</p>
<p>• supportType = 'fixed-free'（μ = 2.0）</p>
<p><strong>计算过程：</strong></p>
<p>• i = √(3.976×10⁻⁸ / 7.069×10⁻⁴) = 0.0075 m = 7.5 mm</p>
<p>• λ = 2.0 × 1.5 / 0.0075 = 400</p>
<p>• Pcr = π² × 70×10⁹ × 3.976×10⁻⁸ / (2.0 × 1.5)² = π² × 2783.2 / 9 ≈ 3053 N ≈ 3.05 kN</p>
<p><strong>结论：</strong>长细比 λ=400 远大于 λp，属于典型的细长杆弹性失稳。临界力仅约 3.05 kN，说明悬臂细长铝杆非常容易失稳。</p>
</div>

<div class="scenario">
<h4>场景3：两端固定柱的承载力</h4>
<p><strong>背景：</strong>某框架柱，两端刚接（理想化为两端固定），采用 100mm×100mm 实心方钢柱，柱高 3.0 m，钢材 Q235。</p>
<p><strong>输入参数：</strong></p>
<p>• E = 206×10⁹ Pa</p>
<p>• I = 0.1⁴/12 = 8.333×10⁻⁶ m⁴</p>
<p>• A = 0.1² = 0.01 m²</p>
<p>• L = 3.0 m</p>
<p>• supportType = 'fixed-fixed'（μ = 0.5）</p>
<p><strong>计算过程：</strong></p>
<p>• i = √(8.333×10⁻⁶ / 0.01) = 0.02887 m</p>
<p>• λ = 0.5 × 3.0 / 0.02887 ≈ 51.96</p>
<p>• λp ≈ 100.8</p>
<p>• λ = 51.96 < λp = 100.8 → <strong>欧拉公式不适用！</strong></p>
<p><strong>结论：</strong>该柱长细比仅约 52，属于中长杆或短粗杆，失稳时材料已进入弹塑性阶段。欧拉公式给出的结果偏于不安全，必须使用经验公式（如 GB/T 50017-2017 中的稳定系数 φ 查表法）进行计算。</p>

<div class="scenario">

<p><strong>背景：</strong>同一根杆件（E=206 GPa, I=1×10⁻⁶ m⁴, L=2 m），比较四种支承条件下的临界力。</p>
<p><strong>计算结果：</strong></p>
<table>
<tr><th>支承条件</th><th>μ</th><th>μL (m)</th><th>Pcr (kN)</th><th>相对比值</th></tr>

<tr><td>一端固定一端自由</td><td>2.0</td><td>4.0</td><td>≈ 126.9</td><td>0.25</td></tr>
</table>
<p><strong>结论：</strong>两端固定时临界力最大（是两端铰支的4倍），一端固定一端自由时最小（仅为两端铰支的1/4）。这说明端部约束对压杆稳定性影响极大。</p>
</div>

<div class="scenario">
<h4>场景5：木柱稳定性初步估算</h4>
<p><strong>背景：</strong>一根松木圆木柱，直径 120 mm，高度 3.0 m，两端铰支。木材顺纹弹性模量约 10 GPa。</p>
<p><strong>输入参数：</strong></p>
<p>• E = 10×10⁹ Pa</p>
<p>• I = π×(0.12)⁴/64 = 1.018×10⁻⁵ m⁴</p>
<p>• A = π×(0.12)²/4 = 0.01131 m²</p>
<p>• L = 3.0 m</p>
<p>• supportType = 'pinned-pinned'（μ = 1.0）</p>
<p>• sigmaP = 20×10⁶ Pa（木材比例极限，需查相关标准确认）</p>
<p><strong>计算过程：</strong></p>
<p>• i = √(1.018×10⁻⁵ / 0.01131) = 0.03 m = 30 mm</p>
<p>• λ = 1.0 × 3.0 / 0.03 = 100</p>
<p>• λp = π√(10×10⁹ / 20×10⁶) = π√500 ≈ 70.2</p>
<p>• λ = 100 > λp = 70.2 → 欧拉公式适用</p>
<p>• Pcr = π² × 10×10⁹ × 1.018×10⁻⁵ / 3² ≈ 111,685 N ≈ 111.7 kN</p>
<p><strong>结论：</strong>该木柱欧拉临界力约 111.7 kN。但需注意木材的实际承载力还受含水率、缺陷、荷载持续时间等因素影响，此处仅为弹性稳定理论的初步估算。</p>
</div>
</div>

<div class="manual-section">
<h2>四、常见错误与排查</h2>
<table>
<tr><th>错误现象</th><th>可能原因</th><th>解决方法</th></tr>
<tr><td>计算结果偏大/偏小几个数量级</td><td>单位不统一（如 I 用了 mm⁴ 而非 m⁴）</td><td>确保所有输入量均为国际单位制（SI）：E 用 Pa，I 用 m⁴，L 用 m，A 用 m²</td></tr>
<tr><td>提示"欧拉公式不适用"</td><td>长细比 λ < λp，杆件属于中长杆或短粗杆</td><td>改用经验公式或查稳定系数表（如 GB/T 50017-2017 附录中的 φ 值表）</td></tr>
<tr><td>惯性矩取值错误</td><td>未取最小惯性矩 Imin</td><td>压杆总是绕弱轴屈曲，必须使用截面对两个形心主轴中惯性矩较小的那个值</td></tr>
<tr><td>有效长度系数选错</td><td>实际端部约束与理想化模型不符</td><td>参照 GB/T 50017-2017 第 7.4 节关于计算长度的规定，实际工程中端部约束往往介于铰支和固定之间</td></tr>
<tr><td>输入 NaN 或 undefined</td><td>参数未正确传入或类型错误</td><td>检查输入参数是否为有效数字，字符串形式的数字需先转换为 Number 类型</td></tr>
</table>
</div>

<div class="manual-section">
<h2>五、数据来源与标准依据</h2>
<p>本工具的理论基础为经典材料力学中的欧拉公式，主要参考以下标准和文献：</p>
<p>（1）GB/T 50017-2017《钢结构设计标准》—— 钢材弹性模量取值（表 4.4.1，E = 206 GPa）、压杆计算长度的确定方法（第 7.4 节）、稳定系数 φ 的取值。</p>
<p>（2）《材料力学》（刘鸿文主编，高等教育出版社）—— 欧拉公式的推导与适用范围、四种典型支承条件的有效长度系数。</p>
<p>（3）GB 50005-2017《木结构设计标准》—— 木材弹性模量的参考取值（需查标准原文确认具体树种和等级对应值）。</p>
<p>（4）欧拉公式的适用条件 λ ≥ λp 来源于材料力学中关于比例极限与临界应力关系的理论推导。λp = π√(E/σp)，其中 σp 为材料的比例极限。</p>

<div class="warning">
<strong>注意：</strong>本工具中的比例极限 σp 默认值 200 MPa 为 Q235 钢的近似值。不同钢材牌号、不同材料（铝、木、混凝土等）的 σp 值不同，使用时需根据实际材料查标准原文确认。
</div>
</div>

<div class="manual-section">
<h2>六、局限性说明</h2>
<p>本工具存在以下局限性，使用者必须充分了解：</p>
<p><strong>1. 仅适用于弹性失稳范围。</strong>当 λ < λp 时，欧拉公式不再适用。实际工程中的大多数中短柱都属于弹塑性失稳范围，此时必须使用稳定系数法（如 GB/T 50017-2017 中的 φ 值查表法）或经验公式。</p>
<p><strong>2. 假设为理想压杆。</strong>欧拉公式假设杆件为理想直杆、荷载为理想轴向力、材料为理想弹性体。实际杆件存在初始弯曲、荷载偏心、残余应力等缺陷，这些都会降低实际承载力。工程设计中需通过安全系数或稳定系数来考虑这些不利因素。</p>
<p><strong>3. 不考虑局部失稳。</strong>对于薄壁截面（如薄壁钢管、冷弯薄壁型钢），可能发生局部屈曲先于整体屈曲的情况。本工具仅计算整体稳定，不验算板件的宽厚比。</p>
<p><strong>4. 有效长度系数的理想化。</strong>实际工程中的端部约束很少是理想的铰接或固接，μ 值的选取需要结合具体节点构造和相邻构件的刚度综合判断。GB/T 50017-2017 给出了框架柱计算长度的详细确定方法。</p>
<p><strong>5. 不考虑动力效应和长期荷载。</strong>本工具计算的是静力荷载下的弹性临界力，不考虑冲击荷载、疲劳、蠕变等因素。</p>
<p><strong>6. 不替代工程设计。</strong>本工具仅供学习和初步估算使用，不能替代正式的工程设计计算。实际工程设计必须按照相关国家标准进行完整的承载力验算，包括强度、整体稳定、局部稳定、刚度等多方面校核。</p>
<p><strong>7. 材料参数的不确定性。</strong>弹性模量 E 和比例极限 σp 的取值直接影响计算结果。不同批次材料、不同温度条件下的参数可能有差异，需以实际检测报告或标准规定值为准。</p>
</div>

<div class="manual-section">
<h2>七、公式汇总</h2>
<div class="formula">欧拉临界力：P<sub>cr</sub> = π²EI / (μL)²</div>
<div class="formula">长细比：λ = μL / i</div>
<div class="formula">回转半径：i = √(I / A)</div>
<div class="formula">临界应力：σ<sub>cr</sub> = π²E / λ²</div>
<div class="formula">比例极限长细比：λ<sub>p</sub> = π√(E / σ<sub>p</sub>)</div>
<div class="formula">适用条件：λ ≥ λ<sub>p</sub>（弹性失稳范围）</div>
</div>
`;
