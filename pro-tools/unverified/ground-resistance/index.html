<script>
// ============================================================
// 第一部分：JS 源码
// ============================================================
const SOURCE_CODE = `/**
 * ============================================================
 * 接地电阻计算工具 - 核心算法模块
 * 依据：GB 50065-2011《交流电气装置的接地设计规范》
 * 版本：v2.0.0-完整版 20261021
 * ============================================================
 *
 * 有限精准声明：
 * 本工具基于标准公式进行估算，不承诺绝对精确。
 * 实际接地电阻受土壤不均匀性、季节变化、施工工艺等多种因素影响，
 * 计算结果仅供工程估算参考，最终应以实测值为准。
 */

/**
 * 计算单根垂直接地体的接地电阻
 *
 * 公式来源：GB 50065-2011 附录D，公式(D.0.1-1)
 * R = ρ/(2πL) × ln(4L/d)
 *
 * 适用条件：
 * - 均质土壤（电阻率ρ恒定）
 * - 接地体为圆柱形或等效圆柱形
 * - 接地体长度远大于直径（L >> d）
 * - 接地体垂直打入地下，顶端与地面平齐或略低于地面
 *
 * @param {number} rho - 土壤电阻率，单位 Ω·m，必须 > 0
 * @param {number} L - 接地体长度，单位 m，必须 > 0
 * @param {number} d - 接地体直径（或等效直径），单位 m，必须 > 0
 * @returns {number} 接地电阻估算值，单位 Ω
 * @throws {Error} 参数不合法时抛出错误
 *
 * @example
 * calcVerticalRodResistance(100, 2.5, 0.05);
 * // 返回约 30.3 Ω（ρ=100Ω·m, L=2.5m, d=50mm圆钢）
 */
function calcVerticalRodResistance(rho, L, d) {
  if (!isValidPositive(rho)) throw new Error('土壤电阻率 rho 必须为正数，当前值: ' + rho);
  if (!isValidPositive(L)) throw new Error('接地体长度 L 必须为正数，当前值: ' + L);
  if (!isValidPositive(d)) throw new Error('接地体直径 d 必须为正数，当前值: ' + d);
  if (L / d < 5) {
    console.warn('警告: L/d = ' + (L/d).toFixed(2) + '，比值过小，公式精度可能下降（建议 L/d > 10）');
  }
  return (rho / (2 * Math.PI * L)) * Math.log(4 * L / d);
}

/**
 * 计算单根水平接地体的接地电阻
 *
 * 公式来源：GB 50065-2011 附录D，公式(D.0.1-2)
 * R = ρ/(2πL) × ln(L²/(h × d_eq))
 *
 * 其中：
 * - 对于扁钢：d_eq = b/2（b为扁钢宽度）
 * - 对于圆钢：d_eq = d/2（d为圆钢直径）
 * - h 为埋设深度
 *
 * 适用条件：
 * - 均质土壤
 * - 水平敷设，埋深 h 恒定
 * - 长度远大于截面尺寸
 *
 * @param {number} rho - 土壤电阻率，单位 Ω·m，必须 > 0
 * @param {number} L - 接地体长度，单位 m，必须 > 0
 * @param {number} dEq - 接地体等效直径，单位 m，必须 > 0
 *                        扁钢取 b/2，圆钢取 d/2
 * @param {number} h - 埋设深度，单位 m，必须 > 0
 * @returns {number} 接地电阻估算值，单位 Ω
 * @throws {Error} 参数不合法时抛出错误
 *
 * @example
 * calcHorizontalStripResistance(100, 20, 0.02, 0.8);
 * // 扁钢40×4，b=0.04m，dEq=0.02m，L=20m，h=0.8m
 */
function calcHorizontalStripResistance(rho, L, dEq, h) {
  if (!isValidPositive(rho)) throw new Error('土壤电阻率 rho 必须为正数，当前值: ' + rho);
  if (!isValidPositive(L)) throw new Error('接地体长度 L 必须为正数，当前值: ' + L);
  if (!isValidPositive(dEq)) throw new Error('等效直径 dEq 必须为正数，当前值: ' + dEq);
  if (!isValidPositive(h)) throw new Error('埋设深度 h 必须为正数，当前值: ' + h);
  if (L / dEq < 5) {
    console.warn('警告: L/dEq = ' + (L/dEq).toFixed(2) + '，比值过小，公式精度可能下降');
  }
  return (rho / (2 * Math.PI * L)) * Math.log(L * L / (h * dEq));
}

/**
 * 将扁钢宽度转换为等效直径
 *
 * 依据：GB 50065-2011 中水平接地体等效直径的取法
 * 扁钢等效直径 d_eq = b / 2
 *
 * @param {number} b - 扁钢宽度，单位 m，必须 > 0
 * @returns {number} 等效直径，单位 m
 * @throws {Error} 参数不合法时抛出错误
 */
function flatStripToEquivalentDiameter(b) {
  if (!isValidPositive(b)) throw new Error('扁钢宽度 b 必须为正数，当前值: ' + b);
  return b / 2;
}

/**
 * 将圆钢直径转换为等效直径（用于水平接地体公式）
 *
 * 依据：GB 50065-2011 中水平接地体等效直径的取法
 * 圆钢等效直径 d_eq = d / 2
 *
 * @param {number} d - 圆钢直径，单位 m，必须 > 0
 * @returns {number} 等效直径，单位 m
 * @throws {Error} 参数不合法时抛出错误
 */
function roundSteelToEquivalentDiameter(d) {
  if (!isValidPositive(d)) throw new Error('圆钢直径 d 必须为正数，当前值: ' + d);
  return d / 2;
}

/**
 * 获取多根垂直接地体并联时的利用系数 η
 *
 * 数据来源：GB 50065-2011 附录D 表D.0.1-1（直线排列）和表D.0.1-2（环形排列）
 *
 * 利用系数反映了多根接地体之间的屏蔽效应：
 * - 接地体间距越小，屏蔽越严重，利用系数越低
 * - 接地体数量越多，整体利用系数越低
 *
 * @param {number} n - 接地体根数，整数，>= 2
 * @param {number} aOverL - 间距与长度之比 a/L，必须 > 0
 * @param {string} [arrangement='line'] - 排列方式：'line'（直线排列）或 'ring'（环形排列）
 * @returns {number} 利用系数 η（0 < η <= 1）
 * @throws {Error} 参数不合法时抛出错误
 *
 * @example
 * getUtilizationCoefficient(4, 2, 'line');
 * // 返回 0.80（4根直线排列，a/L=2）
 */
function getUtilizationCoefficient(n, aOverL, arrangement) {
  if (!Number.isInteger(n) || n < 2) throw new Error('接地体根数 n 必须为 >= 2 的整数，当前值: ' + n);
  if (!isValidPositive(aOverL)) throw new Error('间距比 a/L 必须为正数，当前值: ' + aOverL);
  arrangement = arrangement || 'line';
  if (arrangement !== 'line' && arrangement !== 'ring') {
    throw new Error('排列方式 arrangement 必须为 "line" 或 "ring"，当前值: ' + arrangement);
  }

  // GB 50065-2011 表D.0.1-1 垂直接地体直线排列利用系数
  var lineTable = {
    2:  { 1: 0.85, 2: 0.90, 3: 0.94 },
    3:  { 1: 0.75, 2: 0.84, 3: 0.90 },
    4:  { 1: 0.68, 2: 0.80, 3: 0.88 },
    5:  { 1: 0.63, 2: 0.76, 3: 0.85 },
    6:  { 1: 0.58, 2: 0.72, 3: 0.82 },
    8:  { 1: 0.52, 2: 0.66, 3: 0.77 },
    10: { 1: 0.47, 2: 0.61, 3: 0.73 }
  };

  // GB 50065-2011 表D.0.1-2 垂直接地体环形排列利用系数
  var ringTable = {
    4:  { 1: 0.77, 2: 0.85, 3: 0.90 },
    6:  { 1: 0.66, 2: 0.76, 3: 0.83 },
    8:  { 1: 0.58, 2: 0.68, 3: 0.77 },
    10: { 1: 0.52, 2: 0.62, 3: 0.72 },
    12: { 1: 0.47, 2: 0.57, 3: 0.67 },
    16: { 1: 0.41, 2: 0.50, 3: 0.60 },
    20: { 1: 0.37, 2: 0.45, 3: 0.55 }
  };

  var table = (arrangement === 'line') ? lineTable : ringTable;

  // 查找 n 对应的行
  var nKeys = Object.keys(table).map(Number).sort(function(a, b) { return a - b; });
  var nLower = null, nUpper = null;
  for (var i = 0; i < nKeys.length; i++) {
    if (nKeys[i] === n) { nLower = n; nUpper = n; break; }
    if (nKeys[i] < n) nLower = nKeys[i];
    if (nKeys[i] > n && nUpper === null) nUpper = nKeys[i];
  }

  if (nLower === null) {
    // n 小于表中最小值，使用最小值行的数据
    nLower = nKeys[0];
    nUpper = nKeys[0];
  }
  if (nUpper === null) {
    // n 大于表中最大值，使用最大值行的数据
    nUpper = nKeys[nKeys.length - 1];
    nLower = nUpper;
  }

  // 查找 a/L 对应的列（标准表中 a/L 取 1, 2, 3）
  var aOverLKeys = [1, 2, 3];
  var aLower = null, aUpper = null;
  for (var j = 0; j < aOverLKeys.length; j++) {
    if (Math.abs(aOverLKeys[j] - aOverL) < 0.001) { aLower = aOverLKeys[j]; aUpper = aOverLKeys[j]; break; }
    if (aOverLKeys[j] < aOverL) aLower = aOverLKeys[j];
    if (aOverLKeys[j] > aOverL && aUpper === null) aUpper = aOverLKeys[j];
  }

  if (aLower === null) { aLower = aOverLKeys[0]; aUpper = aOverLKeys[0]; }
  if (aUpper === null) { aUpper = aOverLKeys[aOverLKeys.length - 1]; aLower = aUpper; }

  // 双线性插值
  var valLL = table[nLower] && table[nLower][aLower] !== undefined ? table[nLower][aLower] : null;
  var valLU = table[nLower] && table[nLower][aUpper] !== undefined ? table[nLower][aUpper] : null;
  var valUL = table[nUpper] && table[nUpper][aLower] !== undefined ? table[nUpper][aLower] : null;
  var valUU = table[nUpper] && table[nUpper][aUpper] !== undefined ? table[nUpper][aUpper] : null;

  if (valLL === null || valLU === null || valUL === null || valUU === null) {
    throw new Error('利用系数表中无对应数据，n=' + n + ', a/L=' + aOverL + '，请查标准原文');
  }

  if (nLower === nUpper && aLower === aUpper) {
    return valLL;
  }

  var tN = (nLower === nUpper) ? 0 : (n - nLower) / (nUpper - nLower);
  var tA = (aLower === aUpper) ? 0 : (aOverL - aLower) / (aUpper - aLower);

  var result = valLL * (1 - tN) * (1 - tA)
             + valLU * (1 - tN) * tA
             + valUL * tN * (1 - tA)
             + valUU * tN * tA;

  return roundTo(result, 4);
}

/**
 * 计算多根垂直接地体并联后的总接地电阻
 *
 * 公式：R_total = R_single / (n × η)
 *
 * 其中：
 * - R_single 为单根接地体的接地电阻
 * - n 为接地体根数
 * - η 为利用系数（考虑屏蔽效应）
 *
 * @param {number} rho - 土壤电阻率，单位 Ω·m
 * @param {number} L - 单根接地体长度，单位 m
 * @param {number} d - 接地体直径，单位 m
 * @param {number} n - 接地体根数，整数 >= 2
 * @param {number} a - 接地体间距，单位 m
 * @param {string} [arrangement='line'] - 排列方式：'line' 或 'ring'
 * @returns {Object} 包含以下字段：
 *   - R_single: 单根接地电阻 (Ω)
 *   - eta: 利用系数
 *   - R_total: 总接地电阻 (Ω)
 *   - n: 根数
 * @throws {Error} 参数不合法时抛出错误
 *
 * @example
 * calcMultipleVerticalRods(100, 2.5, 0.05, 4, 5, 'line');
 * // 4根垂直接地体，间距5m（a/L=2），直线排列
 */
function calcMultipleVerticalRods(rho, L, d, n, a, arrangement) {
  if (!isValidPositive(a)) throw new Error('接地体间距 a 必须为正数，当前值: ' + a);
  var R_single = calcVerticalRodResistance(rho, L, d);
  var aOverL = a / L;
  var eta = getUtilizationCoefficient(n, aOverL, arrangement);
  var R_total = R_single / (n * eta);
  return {
    R_single: roundTo(R_single, 4),
    eta: eta,
    R_total: roundTo(R_total, 4),
    n: n,
    aOverL: roundTo(aOverL, 4)
  };
}

/**
 * 计算多根水平接地体并联后的总接地电阻
 *
 * 公式：R_total = R_single / (n × η_h)
 *
 * 注意：水平接地体的利用系数与垂直接地体不同，
 * 本工具中水平接地体并联利用系数参考垂直接地体表格进行估算，
 * 实际工程中应查标准原文或进行专门计算。
 *
 * @param {number} rho - 土壤电阻率，单位 Ω·m
 * @param {number} L - 单根接地体长度，单位 m
 * @param {number} dEq - 等效直径，单位 m
 * @param {number} h - 埋设深度，单位 m
 * @param {number} n - 接地体根数，整数 >= 2
 * @param {number} a - 接地体间距，单位 m
 * @param {string} [arrangement='line'] - 排列方式
 * @returns {Object} 包含以下字段：
 *   - R_single: 单根接地电阻 (Ω)
 *   - eta: 利用系数
 *   - R_total: 总接地电阻 (Ω)
 *   - n: 根数
 * @throws {Error} 参数不合法时抛出错误
 */
function calcMultipleHorizontalStrips(rho, L, dEq, h, n, a, arrangement) {
  if (!isValidPositive(a)) throw new Error('接地体间距 a 必须为正数，当前值: ' + a);
  var R_single = calcHorizontalStripResistance(rho, L, dEq, h);
  var aOverL = a / L;
  var eta = getUtilizationCoefficient(n, aOverL, arrangement);
  var R_total = R_single / (n * eta);
  return {
    R_single: roundTo(R_single, 4),
    eta: eta,
    R_total: roundTo(R_total, 4),
    n: n,
    aOverL: roundTo(aOverL, 4)
  };
}

/**
 * 计算复合接地装置的接地电阻（垂直接地体 + 水平连接带）
 *
 * 方法：先分别计算垂直部分和水平部分的电阻，
 * 然后按并联关系计算总电阻，再乘以综合利用系数。
 *
 * R_total = (R_v × R_h) / (R_v + R_h) × 1/η_composite
 *
 * 简化方法（本工具采用）：
 * 分别计算后取并联值，综合系数取 0.85~0.95 的估算范围。
 *
 * 注意：此为简化估算方法，精确计算需考虑更多因素。
 *
 * @param {number} Rv - 所有垂直接地体并联后的电阻，单位 Ω
 * @param {number} Rh - 水平连接带的电阻，单位 Ω
 * @param {number} [etaComposite=0.9] - 综合利用系数，默认0.9
 * @returns {Object} 包含以下字段：
 *   - R_parallel: 简单并联值 (Ω)
 *   - R_total: 考虑综合利用系数后的值 (Ω)
 *   - etaComposite: 综合利用系数
 */
function calcCompositeGrounding(Rv, Rh, etaComposite) {
  if (!isValidPositive(Rv)) throw new Error('垂直部分电阻 Rv 必须为正数，当前值: ' + Rv);
  if (!isValidPositive(Rh)) throw new Error('水平部分电阻 Rh 必须为正数，当前值: ' + Rh);
  etaComposite = (etaComposite !== undefined && etaComposite !== null) ? etaComposite : 0.9;
  if (etaComposite <= 0 || etaComposite > 1) throw new Error('综合利用系数必须在 (0, 1] 范围内，当前值: ' + etaComposite);

  var R_parallel = (Rv * Rh) / (Rv + Rh);
  var R_total = R_parallel / etaComposite;
  return {
    R_parallel: roundTo(R_parallel, 4),
    R_total: roundTo(R_total, 4),
    etaComposite: etaComposite
  };
}

/**
 * 根据所需接地电阻值，反算所需的垂直接地体根数
 *
 * @param {number} rho - 土壤电阻率，单位 Ω·m
 * @param {number} L - 单根接地体长度，单位 m
 * @param {number} d - 接地体直径，单位 m
 * @param {number} a - 接地体间距，单位 m
 * @param {number} targetR - 目标接地电阻，单位 Ω
 * @param {string} [arrangement='line'] - 排列方式
 * @returns {Object} 包含以下字段：
 *   - nRequired: 所需最少根数
 *   - R_actual: 实际可達到的电阻值 (Ω)
 *   - eta: 对应利用系数
 *   - margin: 裕度百分比（负值表示不满足）
 */
function estimateRequiredRodCount(rho, L, d, a, targetR, arrangement) {
  if (!isValidPositive(targetR)) throw new Error('目标电阻 targetR 必须为正数，当前值: ' + targetR);
  var R_single = calcVerticalRodResistance(rho, L, d);
  var aOverL = a / L;

  for (var n = 2; n <= 100; n++) {
    var eta = getUtilizationCoefficient(n, aOverL, arrangement);
    var R_total = R_single / (n * eta);
    if (R_total <= targetR) {
      return {
        nRequired: n,
        R_actual: roundTo(R_total, 4),
        eta: eta,
        margin: roundTo((targetR - R_total) / targetR * 100, 2)
      };
    }
  }
  return {
    nRequired: -1,
    R_actual: null,
    eta: null,
    margin: null,
    message: '在2~100根范围内无法满足目标电阻，请调整参数'
  };
}

/**
 * 判断数值是否为有效正数
 * @param {*} val - 待检查的值
 * @returns {boolean} 是否为有效正数
 */
function isValidPositive(val) {
  return typeof val === 'number' && isFinite(val) && val > 0;
}

/**
 * 四舍五入到指定小数位
 * @param {number} num - 待处理的数值
 * @param {number} digits - 小数位数
 * @returns {number} 四舍五入后的值
 */
function roundTo(num, digits) {
  var factor = Math.pow(10, digits);
  return Math.round(num * factor) / factor;
}

/**
 * 计算土壤电阻率的季节修正系数（简化方法）
 *
 * 注意：精确的季节修正需根据当地气象数据和土壤特性确定，
 * 本函数仅提供粗略估算参考。
 *
 * @param {string} season - 季节：'spring', 'summer', 'autumn', 'winter'
 * @returns {number} 修正系数 ψ（乘以实测电阻率得到设计用值）
 */
function getSeasonalCorrectionFactor(season) {
  var factors = {
    'spring': 1.0,
    'summer': 1.2,
    'autumn': 1.0,
    'winter': 0.8
  };
  if (!factors[season]) {
    throw new Error('季节参数必须为 spring/summer/autumn/winter，当前值: ' + season);
  }
  return factors[season];
}
`;

const MANUAL_HTML = `
<h2>一、工具概述</h2>
<p>本工具用于估算交流电气装置中垂直接地体和水平接地体的接地电阻，以及多根接地体并联后的综合接地电阻。计算依据为 GB 50065-2011《交流电气装置的接地设计规范》附录D中的相关公式和表格。</p>
<p>接地电阻是衡量接地装置性能的核心指标。在电力系统中，接地电阻的大小直接影响设备安全、人身安全和系统运行的可靠性。过大的接地电阻可能导致故障时电位升高、跨步电压超标、继电保护误动或拒动等严重后果。</p>
<p>本工具适用于工程设计阶段的接地电阻估算，帮助工程师快速评估接地方案的可行性，确定接地体数量、尺寸和布置方式。但请注意，本工具提供的是理论估算值，实际接地电阻受多种因素影响，最终应以现场实测值为准。</p>

<h2>二、核心公式与参数详解</h2>

<h3>2.1 单根垂直接地体</h3>
<p>公式（GB 50065-2011 附录D 公式D.0.1-1）：</p>
<p style="text-align:center; font-weight:bold; text-indent:0;">R = ρ / (2πL) × ln(4L / d)</p>
<table>
<tr><th>参数</th><th>含义</th><th>单位</th><th>典型取值范围</th></tr>
<tr><td>ρ</td><td>土壤电阻率</td><td>Ω·m</td><td>10 ~ 10000（视土质而定）</td></tr>

<tr><td>d</td><td>接地体直径（或等效直径）</td><td>m</td><td>0.01 ~ 0.1</td></tr>
<tr><td>R</td><td>接地电阻</td><td>Ω</td><td>—</td></tr>
</table>
<p>适用条件：均质土壤、接地体垂直打入地下、L远大于d（建议L/d > 10）。</p>

<h3>2.2 单根水平接地体</h3>
<p>公式（GB 50065-2011 附录D 公式D.0.1-2）：</p>
<p style="text-align:center; font-weight:bold; text-indent:0;">R = ρ / (2πL) × ln(L² / (h × d_eq))</p>
<table>
<tr><th>参数</th><th>含义</th><th>单位</th><th>说明</th></tr>
<tr><td>ρ</td><td>土壤电阻率</td><td>Ω·m</td><td>同上</td></tr>
<tr><td>L</td><td>接地体长度</td><td>m</td><td>水平敷设长度</td></tr>
<tr><td>d_eq</td><td>等效直径</td><td>m</td><td>扁钢取b/2，圆钢取d/2</td></tr>
<tr><td>h</td><td>埋设深度</td><td>m</td><td>一般取0.6~1.0m</td></tr>
</table>
<p>注意：等效直径的取法是将非圆形截面等效为圆形截面。扁钢宽度为b时，d_eq = b/2；圆钢直径为d时，d_eq = d/2。</p>

<h3>2.3 多根垂直接地体并联</h3>
<p>公式：</p>
<p style="text-align:center; font-weight:bold; text-indent:0;">R_total = R_single / (n × η)</p>
<table>
<tr><th>参数</th><th>含义</th><th>说明</th></tr>
<tr><td>R_single</td><td>单根接地电阻</td><td>由上述公式计算</td></tr>
<tr><td>n</td><td>接地体根数</td><td>整数，≥2</td></tr>
<tr><td>η</td><td>利用系数</td><td>考虑屏蔽效应，0 < η ≤ 1</td></tr>
<tr><td>a</td><td>接地体间距</td><td>一般取L的1~3倍</td></tr>
</table>
<p>利用系数η反映了多根接地体之间的电流屏蔽效应。当接地体间距较小时，相邻接地体的电流场相互重叠，导致每根接地体的散流能力下降。η值越小，说明屏蔽效应越严重。利用系数的具体数值查 GB 50065-2011 表D.0.1-1（直线排列）和表D.0.1-2（环形排列）。</p>

<p>某建筑物防雷接地，要求冲击接地电阻R≤10Ω。土壤电阻率ρ=150Ω·m。采用8根垂直接地体（L=2.5m，∅20圆钢），直线排列，间距5m，顶部用40×4扁钢连接。</p>
<p>计算步骤：①计算单根垂直接地体电阻；②查利用系数（n=8, a/L=2）；③计算并联电阻；④计算连接扁钢电阻；⑤计算复合接地电阻。</p>
<p>注意：防雷接地还需考虑冲击系数的影响，本工具计算的是工频接地电阻，冲击接地电阻通常还需乘以冲击系数（一般小于1）。</p>

<h2>四、常见错误与注意事项</h2>

<h3>4.1 土壤电阻率取值不当</h3>
<p>土壤电阻率是计算中最关键的参数，也是最不确定的参数。常见错误包括：</p>
<ul>
<li>直接采用文献中的典型值而不进行实测。不同地区、不同深度的土壤电阻率差异极大。</li>
<li>仅做少量测量点就确定电阻率。建议采用四极法（Wenner法）进行多点、多深度测量。</li>
<li>忽略土壤电阻率的季节性变化。雨季和旱季的电阻率可能相差数倍。</li>
<li>忽略土壤的分层结构。实际土壤往往是多层的，简单取平均值可能导致较大误差。</li>
</ul>

<h3>4.2 利用系数误用</h3>
<p>利用系数η的取值直接影响计算结果。常见错误包括：</p>
<ul>
<li>忽略利用系数，直接用R/n计算。这会导致结果偏小（过于乐观）。</li>
<li>混淆直线排列和环形排列的利用系数表。</li>
<li>a/L比值不在表格范围内时不做插值处理，直接取边界值。</li>
</ul>

<h3>4.3 等效直径计算错误</h3>
<p>水平接地体公式中需要等效直径d_eq。常见错误包括：</p>
<ul>
<li>将扁钢宽度b直接当作d_eq使用，正确应为d_eq = b/2。</li>
<li>将圆钢直径d直接当作d_eq使用，正确应为d_eq = d/2。</li>
<li>角钢、钢管等异型截面的等效直径取值不当。</li>
</ul>

<h3>4.4 单位混淆</h3>
<p>所有参数必须使用标准单位（Ω·m、m），常见错误包括：</p>
<ul>
<li>将接地体长度以mm输入（应为m）。</li>
<li>将扁钢截面尺寸以mm输入（应转换为m）。</li>
<li>土壤电阻率单位混淆（Ω·m与Ω·cm的换算）。</li>
</ul>

<h2>五、数据依据</h2>
<p>本工具的计算公式和数据来源于以下标准：</p>
<ol>
<li><strong>GB 50065-2011</strong>《交流电气装置的接地设计规范》——主要依据，附录D提供了接地电阻计算公式和利用系数表。</li>
<li><strong>DL/T 621-1997</strong>《交流电气装置的接地》——电力行业标准，部分内容与GB 50065一致。</li>
<li><strong>GB/T 50065 条文说明</strong>——对公式的推导过程和适用条件进行了说明。</li>
</ol>
<p>利用系数表（表D.0.1-1和表D.0.1-2）直接引自GB 50065-2011附录D。对于表中未列出的n值和a/L值，本工具采用双线性插值方法估算，插值结果仅供参考。</p>
<div class="note">
<strong>提示：</strong>如需查阅标准原文中的完整表格和详细推导过程，请获取 GB 50065-2011 正式出版物。本工具中的表格数据为常用值摘录，可能不完整。
</div>

<h2>六、精度与误差说明</h2>
<div class="warning">
<strong>重要声明：</strong>本工具提供的是工程估算值，不承诺绝对精确。现实中的变量是无限的，本工具只做到「方法准、输入项准、结果给误差范围」。
</div>

<h3>6.1 算准了什么</h3>
<ul>
<li><strong>公式实现准确：</strong>严格按照GB 50065-2011附录D中的公式进行编程实现，数学计算无误差（在浮点精度范围内）。</li>
<li><strong>查表数据准确：</strong>利用系数表数据引自标准原文，查表和插值算法正确。</li>
<li><strong>输入参数准确时结果可靠：</strong>如果输入的土壤电阻率、接地体尺寸等参数准确反映了实际情况，则计算结果具有工程参考价值。</li>
</ul>

<h3>6.2 哪些因素没算进去</h3>
<ul>
<li><strong>土壤不均匀性：</strong>公式假设土壤为均质体，实际土壤往往存在分层、含石块、含水量不均等情况。</li>
<li><strong>季节变化：</strong>土壤电阻率随季节（温度、含水量）变化，本工具未自动修正（提供了季节修正系数函数供手动使用）。</li>
<li><strong>邻近接地体的影响：</strong>公式未考虑附近其他接地装置（如相邻变电站、管线）的影响。</li>
<li><strong>接地体腐蚀：</strong>长期运行后接地体截面减小，电阻增大，本工具按初始尺寸计算。</li>
<li><strong>施工偏差：</strong>实际施工中接地体埋深、间距、垂直度等与设计值的偏差。</li>
<li><strong>高频/冲击特性：</strong>公式计算的是工频接地电阻，雷电冲击下的接地特性不同。</li>
<li><strong>降阻剂效果：</strong>使用降阻剂后的实际效果受施工质量、材料性能等影响，难以精确计算。</li>
<li><strong>复杂地形：</strong>山坡、岩石地区等特殊地形的影响未考虑。</li>
</ul>

<h3>6.3 误差大概多大</h3>
<table>
<tr><th>情况</th><th>估计误差范围</th><th>说明</th></tr>
<tr><td>均质土壤、参数准确</td><td>±10%~20%</td><td>公式本身的近似误差</td></tr>
<tr><td>土壤分层但取平均ρ</td><td>±20%~50%</td><td>取决于分层差异程度</td></tr>
<tr><td>季节变化未修正</td><td>±30%~100%</td><td>极端情况下旱季与雨季差异可达数倍</td></tr>
<tr><td>利用系数插值</td><td>±5%~10%</td><td>插值引入的额外误差</td></tr>
<tr><td>复合接地装置简化计算</td><td>±15%~30%</td><td>简化方法引入的误差</td></tr>
</table>
<p>综合来看，在参数取值合理的情况下，本工具的计算结果与实测值的偏差通常在 ±20%~40% 范围内。在土壤条件复杂或参数取值不当时，偏差可能更大。因此，<strong>计算结果仅用于方案比选和初步设计，不能作为验收依据</strong>。最终接地电阻值必须以现场实测为准。</p>

<h2>七、局限性</h2>
<ol>
<li><strong>仅适用于均质土壤模型：</strong>对于多层土壤（如表层为填土、下层为岩石），本工具的公式不适用，需采用更复杂的多层土壤模型或数值计算方法。</li>
<li><strong>利用系数表有限：</strong>标准中的利用系数表仅覆盖了有限的n值和a/L值组合，超出范围时需插值或外推，精度下降。</li>
<li><strong>不考虑互阻的精确计算：</strong>多根接地体的精确计算应考虑互阻矩阵，本工具采用简化的利用系数法。</li>
<li><strong>不适用于特殊接地形式：</strong>如深井接地、水下接地、爆破接地等特殊形式，需采用专门方法。</li>
<li><strong>不替代专业软件：</strong>对于大型接地网（如500kV变电站），建议使用CDEGS等专业接地分析软件进行详细计算。</li>
<li><strong>不替代现场测试：</strong>任何计算都不能替代现场接地电阻测试。设计完成后必须按标准要求进行实测验收。</li>
</ol>
