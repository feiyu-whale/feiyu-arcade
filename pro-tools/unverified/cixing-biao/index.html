/**
 * 标点符号正则
 * @type {RegExp}
 */
const PUNCT_RE = /[，。！？；：""''（）【】《》、…—,.!?;:'"()\[\]{}<>\/\\|`~@#$%^&*_+=]/;

/**
 * 对输入文本进行中文分词（最大正向匹配 + 单字回退）
 *
 * @param {string} text - 待分词的中文文本
 * @returns {Array<{word: string, tag: string}>} 分词结果数组，每项包含词和词性标记
 * @throws {TypeError} 当输入不是字符串时抛出
 * @example
 * tokenize("我爱北京")
 * // => [{word:"我",tag:"r"}, {word:"爱",tag:"v"}, {word:"北京",tag:"n"}]
 * @example
 * tokenize("")
 * // => []
 */
function tokenize(text) {
  if (typeof text !== 'string') {
    throw new TypeError('tokenize: 输入必须是字符串类型，收到 ' + typeof text);
  }
  if (text.length === 0) return [];

  const result = [];
  let i = 0;
  const MAX_LEN = 5; // 词典中最长词长度

  while (i < text.length) {
    const ch = text[i];

    // 跳过空白字符
    if (/\s/.test(ch)) {
      i++;
      continue;
    }

    // 标点符号：直接作为一个 token
    if (PUNCT_RE.test(ch)) {
      result.push({ word: ch, tag: 'w' });
      i++;
      continue;
    }

    // 英文单词：连续字母作为一个 token
    if (/[a-zA-Z]/.test(ch)) {
      let j = i;
      while (j < text.length && /[a-zA-Z]/.test(text[j])) j++;
      result.push({ word: text.slice(i, j), tag: 'x' });
      i = j;
      continue;
    }

    // 数字（含小数）：连续数字作为一个 token
    if (/[0-9]/.test(ch)) {
      let j = i;
      while (j < text.length && /[0-9.]/.test(text[j])) j++;
      result.push({ word: text.slice(i, j), tag: 'm' });
      i = j;
      continue;
    }

    // 最大正向匹配查词典
    let matched = false;
    for (let len = MAX_LEN; len > 1; len--) {
      if (i + len > text.length) continue;
      const word = text.slice(i, i + len);
      if (DICT[word]) {
        result.push({ word: word, tag: DICT[word] });
        i += len;
        matched = true;
        break;
      }
    }

    if (!matched) {
      // 单字：先查词典，再查启发式规则，最后标为未知
      const word = text[i];
      let tag = DICT[word] || CHAR_GUESS[word] || 'x';
      result.push({ word: word, tag: tag });
      i++;
    }
  }

  return result;
}

/**
 * 对输入文本进行词性标注（内部调用 tokenize）
 *
 * @param {string} text - 待标注的中文文本
 * @returns {Array<{word: string, tag: string, desc: string}>} 标注结果，每项含词、标记、说明
 * @throws {TypeError} 当输入不是字符串时抛出
 * @example
 * tagPOS("我爱北京")
 * // => [
 * //   {word:"我", tag:"r", desc:"代词"},
 * //   {word:"爱", tag:"v", desc:"动词"},
 * //   {word:"北京", tag:"n", desc:"名词"}
 * // ]
 */
function tagPOS(text) {
  if (typeof text !== 'string') {
    throw new TypeError('tagPOS: 输入必须是字符串类型，收到 ' + typeof text);
  }
  const tokens = tokenize(text);
  return tokens.map(t => ({
    word: t.word,
    tag: t.tag,
    desc: TAG_DESCRIPTIONS[t.tag] || '未知'
  }));
}

/**
 * 根据词性标记获取中文说明
 *
 * @param {string} tag - 词性标记（如 'n', 'v', 'a'）
 * @returns {string} 词性中文说明；未知标记返回 "未知标记(xxx)"
 * @throws {TypeError} 当输入不是字符串时抛出
 * @example
 * getTagDescription('n')
 * // => "名词 (noun)"
 * @example
 * getTagDescription('zzz')
 * // => "未知标记(zzz)"
 */
function getTagDescription(tag) {
  if (typeof tag !== 'string') {
    throw new TypeError('getTagDescription: 输入必须是字符串，收到 ' + typeof tag);
  }
  return TAG_DESCRIPTIONS[tag] || ('未知标记(' + tag + ')');
}

/**
 * 获取所有支持的词性标记列表
 *
 * @returns {Array<{tag: string, desc: string}>} 标记列表
 * @example
 * getAllTags()
 * // => [{tag:"n", desc:"名词 (noun)"}, ...]
 */
function getAllTags() {
  return Object.keys(TAG_DESCRIPTIONS).map(tag => ({
    tag: tag,
    desc: TAG_DESCRIPTIONS[tag]
  }));
}

/**
 * 统计一段文本中各词性的出现次数
 *
 * @param {string} text - 待统计的文本
 * @returns {Object<string, number>} 各词性计数
 * @throws {TypeError} 当输入不是字符串时抛出
 * @example
 * countTags("我爱北京")
 * // => { r:1, v:1, n:1 }
 */
function countTags(text) {
  if (typeof text !== 'string') {
    throw new TypeError('countTags: 输入必须是字符串');
  }
  const tokens = tokenize(text);
  const counts = {};
  tokens.forEach(t => {
    counts[t.tag] = (counts[t.tag] || 0) + 1;
  });
  return counts;
}

/**
 * 简易测试运行器
 * @type {{total:number, passed:number, failed:number, results:Array}}
 */
const TestRunner = {
  total: 0,
  passed: 0,
  failed: 0,
  results: [],

  /**
   * 断言相等（深度比较）
   * @param {*} actual - 实际值
   * @param {*} expected - 期望值
   * @param {string} msg - 测试描述
   */
  assertEqual(actual, expected, msg) {
    this.total++;
    const pass = JSON.stringify(actual) === JSON.stringify(expected);
    if (pass) {
      this.passed++;
      this.results.push({ pass: true, msg: msg });
    } else {
      this.failed++;
      this.results.push({
        pass: false,
        msg: msg,
        detail: '期望 ' + JSON.stringify(expected) + '，实际 ' + JSON.stringify(actual)
      });
    }
  },

  /**
   * 断言抛出异常
   * @param {Function} fn - 待测函数
   * @param {Function} errCtor - 期望的错误类型
   * @param {string} msg - 测试描述
   */
  assertThrows(fn, errCtor, msg) {
    this.total++;
    try {
      fn();
      this.failed++;
      this.results.push({ pass: false, msg: msg, detail: '期望抛出异常但未抛出' });
    } catch (e) {
      if (e instanceof errCtor) {
        this.passed++;
        this.results.push({ pass: true, msg: msg });
      } else {
        this.failed++;
        this.results.push({
          pass: false,
          msg: msg,
          detail: '期望 ' + errCtor.name + '，实际 ' + e.constructor.name
        });
      }
    }
  },

  /**
   * 断言为真
   * @param {*} val - 待测值
   * @param {string} msg - 测试描述
   */
  assertTrue(val, msg) {
    this.total++;
    if (val) {
      this.passed++;
      this.results.push({ pass: true, msg: msg });
    } else {
      this.failed++;
      this.results.push({ pass: false, msg: msg, detail: '期望为真，实际为假' });
    }
  }
};

  TestRunner.assertThrows(

  );

  // ========== countTags 测试 ==========

  // 33. 正常：统计词性
  const counts = countTags('我爱北京天安门');
  TestRunner.assertTrue(
    counts['r'] >= 1 && counts['v'] >= 1 && counts['n'] >= 1,
    'countTags: 我爱北京天安门 包含 r v n'
  );

  // 34. 边界：空字符串
  TestRunner.assertEqual(
    countTags(''),

    'countTags: 空字符串返回空对象'
  );

  // 35. 异常：null
  TestRunner.assertThrows(
    () => countTags(null),

    'countTags: null 抛出 TypeError'
  );

  // ========== getAllTags 测试 ==========

  // 36. 正常：返回数组
  TestRunner.assertTrue(
    Array.isArray(getAllTags()) && getAllTags().length > 10,
    'getAllTags: 返回非空数组'
  );

  // 37. 正常：每项含 tag 和 desc
  TestRunner.assertTrue(
    getAllTags().every(t => typeof t.tag === 'string' && typeof t.desc === 'string'),
    'getAllTags: 每项含 tag 和 desc'
  );

  // ========== 综合场景测试 ==========

  // 38. 完整流程：标点处理
  TestRunner.assertEqual(
    tokenize('，').map(t => t.tag),
    ['w'],
    '综合: 单个标点 -> w'
  );

  // 39. 完整流程：英文处理
  TestRunner.assertEqual(
    tokenize('AI').map(t => t.tag),
    ['x'],
    '综合: 英文 -> x'
  );

  // 40. 完整流程：数字处理
  TestRunner.assertEqual(
    tokenize('100').map(t => t.tag),
    ['m'],
    '综合: 数字 -> m'
  );

  // 41. 完整流程：副词识别
  TestRunner.assertEqual(
    tokenize('非常').map(t => t.tag),
    ['d'],
    '综合: 非常 -> 副词'
  );

  // 42. 完整流程：介词识别
  TestRunner.assertEqual(
    tokenize('关于').map(t => t.tag),
    ['p'],
    '综合: 关于 -> 介词'
  );

  // 43. 完整流程：连词识别
  TestRunner.assertEqual(
    tokenize('但是').map(t => t.tag),
    ['c'],
    '综合: 但是 -> 连词'
  );

  // 44. 完整流程：代词识别
  TestRunner.assertEqual(
    tokenize('我们').map(t => t.tag),
    ['r'],
    '综合: 我们 -> 代词'
  );

  // 45. 完整流程：量词识别
  TestRunner.assertEqual(
    tokenize('一个').map(t => t.tag),
    ['m', 'q'],
    '综合: 一个 -> 数词 + 量词'
  );

  // 46. 边界：只有标点
  TestRunner.assertEqual(
    tokenize('！！！').map(t => t.tag),
    ['w', 'w', 'w'],
    '综合: 多个标点 -> 多个 w'
  );

  // 47. 边界：空白字符跳过
  TestRunner.assertEqual(
    tokenize('  你  好  ').map(t => t.word),
    ['你', '好'],
    '综合: 空白字符被跳过'
  );

  // 48. 精度：词典词优先于单字
  TestRunner.assertEqual(
    tokenize('北京').map(t => t.word),
    ['北京'],
    '精度: 词典词"北京"优先于单字切分'
  );

  // 49. 精度：最大匹配
  TestRunner.assertEqual(
    tokenize('工程师').map(t => t.word),
    ['工程师'],
    '精度: 最大匹配"工程师"'
  );

  // 50. 综合：完整句子标注
  const full = tagPOS('今天天气很好。');
  TestRunner.assertTrue(
    full.length >= 4 && full.some(t => t.tag === 'n') && full.some(t => t.tag === 'a'),
    '综合: 完整句子包含名词和形容词'
  );

  return {
    total: TestRunner.total,
    passed: TestRunner.passed,
    failed: TestRunner.failed,
    results: TestRunner.results
  };
}

/* ============================================================
 *  UI 交互
 * ============================================================ */

/**
 * 渲染标注结果到页面
 */
function runTagger() {
  const text = document.getElementById('inputText').value;
  const resultBox = document.getElementById('result');
  if (!text.trim()) {
    resultBox.innerHTML = '<span style="color:#999;">请输入内容</span>';
    return;
  }
  try {
    const tagged = tagPOS(text);
    if (tagged.length === 0) {
      resultBox.innerHTML = '<span style="color:#999;">无可标注内容</span>';
      return;
    }
    const html = tagged.map(t =>
      '<span class="word-tag"><span class="w">' + escapeHtml(t.word) +
      '</span><span class="t">' + escapeHtml(t.tag) + '</span></span>'
    ).join('');
    resultBox.innerHTML = html;
  } catch (e) {
    resultBox.innerHTML = '<span style="color:#c00;">错误：' + escapeHtml(e.message) + '</span>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function loadExample(n) {
  const examples = {
    1: '我爱北京天安门。',
    2: '今天天气很好，我们一起去公园玩吧！',
    3: '工程师正在认真地研究新的技术方案。'
  };
  document.getElementById('inputText').value = examples[n] || '';
  runTagger();
}

function clearResult() {
  document.getElementById('inputText').value = '';
  document.getElementById('result').innerHTML = '<span style="color:#999;">点击"开始标注"查看结果</span>';
}

/**
 * 渲染词性图例
 */
function renderLegend() {
  const grid = document.getElementById('legendGrid');
  grid.innerHTML = getAllTags().map(t =>
    '<div class="legend-item"><code>' + t.tag + '</code>' + escapeHtml(t.desc) + '</div>'
  ).join('');
}

/**
 * 渲染源码到页面
 */
function renderSource() {
  const src = document.getElementById('sourceCode');
  // 提取当前 script 标签之前的核心代码（去掉 UI 部分）
  const scripts = document.querySelectorAll('script');
  let coreCode = '';
  for (const s of scripts) {
    if (s.textContent.indexOf('TAG_DESCRIPTIONS') !== -1) {
      coreCode = s.textContent;
      break;
    }
  }
  src.textContent = coreCode;
}

/**
 * 运行测试并渲染结果
 */
function runTestsUI() {
  const result = runAllTests();
  const summary = document.getElementById('testSummary');
  const list = document.getElementById('testList');
  const status = document.getElementById('testStatus');

  summary.className = 'test-summary ' + (result.failed === 0 ? 'pass' : 'fail');
  summary.textContent = '通过 ' + result.passed + ' / 共 ' + result.total +
    (result.failed > 0 ? ' （失败 ' + result.failed + '）' : ' ✓ 全部通过');
  status.textContent = '已运行：' + new Date().toLocaleTimeString();

  list.innerHTML = result.results.map((r, i) =>
    '<div class="test-item ' + (r.pass ? 'pass' : 'fail') + '">' +
    '<span class="status">' + (r.pass ? '✓ PASS' : '✗ FAIL') + '</span>' +
    '#' + (i + 1) + ' ' + escapeHtml(r.msg) +
    (r.detail ? '<div style="color:#c00;margin-left:66px;font-size:12px;">' +
      escapeHtml(r.detail) + '</div>' : '') +
    '</div>'
  ).join('');
}

function runAllTests() {
  // 兼容 UI 调用和内部调用
  if (typeof TestRunner !== 'undefined') {
    TestRunner.total = 0;
    TestRunner.passed = 0;
    TestRunner.failed = 0;
    TestRunner.results = [];
  }

  // ===== tokenize =====
  TestRunner.assertEqual(tokenize('我爱北京').map(t=>t.word),['我','爱','北京'],'tokenize: 简单中文句子');
  TestRunner.assertEqual(tokenize('你好，世界！').map(t=>t.word),['你','好','，','世','界','！'],'tokenize: 含标点');
  TestRunner.assertTrue(tokenize('今天天气很好，我们一起去公园玩吧。').length>5,'tokenize: 长句子');
  TestRunner.assertEqual(tokenize(''),[],'tokenize: 空字符串');
  TestRunner.assertEqual(tokenize('人').map(t=>t.word),['人'],'tokenize: 单字');
  TestRunner.assertTrue(tokenize('人'.repeat(500)).length===500,'tokenize: 超长字符串');
  TestRunner.assertThrows(()=>tokenize(null),TypeError,'tokenize: null');
  TestRunner.assertThrows(()=>tokenize(undefined),TypeError,'tokenize: undefined');
  TestRunner.assertThrows(()=>tokenize(123),TypeError,'tokenize: 数字');
  TestRunner.assertThrows(()=>tokenize({}),TypeError,'tokenize: 对象');
  TestRunner.assertEqual(tokenize('hello').map(t=>t.word),['hello'],'tokenize: 英文');
  TestRunner.assertEqual(tokenize('2024').map(t=>t.word),['2024'],'tokenize: 数字token');
  TestRunner.assertEqual(tokenize('3.14').map(t=>t.word),['3.14'],'tokenize: 小数');
  TestRunner.assertTrue(tokenize('我爱Python编程').length>=4,'tokenize: 中英混合');
  TestRunner.assertEqual(tokenize('北京').map(t=>t.tag),['n'],'tokenize: 北京->n');
  TestRunner.assertEqual(tokenize('学习').map(t=>t.tag),['v'],'tokenize: 学习->v');
  TestRunner.assertEqual(tokenize('美丽').map(t=>t.tag),['a'],'tokenize: 美丽->a');

  // ===== tagPOS =====
  const tagged = tagPOS('我爱北京');
  TestRunner.assertEqual(tagged.map(t=>t.tag),['r','v','n'],'tagPOS: 我爱北京');
  TestRunner.assertTrue(tagged.every(t=>typeof t.desc==='string'&&t.desc.length>0),'tagPOS: 含desc');
  TestRunner.assertEqual(tagPOS(''),[],'tagPOS: 空字符串');
  TestRunner.assertEqual(tagPOS('人').length,1,'tagPOS: 单字');
  TestRunner.assertThrows(()=>tagPOS(null),TypeError,'tagPOS: null');
  TestRunner.assertThrows(()=>tagPOS(undefined),TypeError,'tagPOS: undefined');
  TestRunner.assertThrows(()=>tagPOS(42),TypeError,'tagPOS: 数字');
  TestRunner.assertThrows(()=>tagPOS(true),TypeError,'tagPOS: 布尔');

  // ===== getTagDescription =====
  TestRunner.assertEqual(getTagDescription('n'),'名词 (noun)','getTagDescription: n');
  TestRunner.assertEqual(getTagDescription('v'),'动词 (verb)','getTagDescription: v');
  TestRunner.assertEqual(getTagDescription('a'),'形容词 (adjective)','getTagDescription: a');
  TestRunner.assertTrue(getTagDescription('zzz').indexOf('未知标记')===0,'getTagDescription: 未知');
  TestRunner.assertThrows(()=>getTagDescription(null),TypeError,'getTagDescription: null');
  TestRunner.assertThrows(()=>getTagDescription(undefined),TypeError,'getTagDescription: undefined');
  TestRunner.assertThrows(()=>getTagDescription(123),TypeError,'getTagDescription: 数字');

  // ===== countTags =====
  const counts = countTags('我爱北京天安门');
  TestRunner.assertTrue(counts['r']>=1&&counts['v']>=1&&counts['n']>=1,'countTags: 我爱北京天安门');
  TestRunner.assertEqual(countTags(''),{},'countTags: 空字符串');
  TestRunner.assertThrows(()=>countTags(null),TypeError,'countTags: null');

  // ===== getAllTags =====
  TestRunner.assertTrue(Array.isArray(getAllTags())&&getAllTags().length>10,'getAllTags: 数组');
  TestRunner.assertTrue(getAllTags().every(t=>typeof t.tag==='string'&&typeof t.desc==='string'),'getAllTags: 结构');

  // ===== 综合 =====
  TestRunner.assertEqual(tokenize('，').map(t=>t.tag),['w'],'综合: 标点->w');
  TestRunner.assertEqual(tokenize('AI').map(t=>t.tag),['x'],'综合: 英文->x');
  TestRunner.assertEqual(tokenize('100').map(t=>t.tag),['m'],'综合: 数字->m');
  TestRunner.assertEqual(tokenize('非常').map(t=>t.tag),['d'],'综合: 非常->d');
  TestRunner.assertEqual(tokenize('关于').map(t=>t.tag),['p'],'综合: 关于->p');
  TestRunner.assertEqual(tokenize('但是').map(t=>t.tag),['c'],'综合: 但是->c');
  TestRunner.assertEqual(tokenize('我们').map(t=>t.tag),['r'],'综合: 我们->r');
  TestRunner.assertEqual(tokenize('一个').map(t=>t.tag),['m','q'],'综合: 一个->m q');
  TestRunner.assertEqual(tokenize('！！！').map(t=>t.tag),['w','w','w'],'综合: 多标点');
  TestRunner.assertEqual(tokenize('  你  好  ').map(t=>t.word),['你','好'],'综合: 跳过空白');
  TestRunner.assertEqual(tokenize('北京').map(t=>t.word),['北京'],'精度: 词典优先');
  TestRunner.assertEqual(tokenize('工程师').map(t=>t.word),['工程师'],'精度: 最大匹配');
  const full = tagPOS('今天天气很好。');
  TestRunner.assertTrue(full.length>=4&&full.some(t=>t.tag==='n')&&full.some(t=>t.tag==='a'),'综合: 完整句子');

  return {
    total: TestRunner.total,
    passed: TestRunner.passed,
    failed: TestRunner.failed,
    results: TestRunner.results
  };
}

      <tr><td>某个词被切成单字</td><td>该词不在内置词典中</td><td>本工具词典约 600+ 词条，未登录词会按单字切分并标为 x</td></tr>
      <tr><td>词性标错（如"认真"标为形容词而非副词）</td><td>词典中该词只收录了一种词性</td><td>规则方法无法处理兼类词，需查词典确认</td></tr>
      <tr><td>标点未被识别</td><td>使用了非常见标点</td><td>检查 PUNCT_RE 正则是否包含该字符</td></tr>
      <tr><td>英文被切成单字母</td><td>输入包含非 ASCII 字母</td><td>本工具仅识别 a-zA-Z，其他字母（如希腊字母）会按单字处理</td></tr>
    </table>

    <h3>六、数据来源与标准依据</h3>
    <ul>
      <li><strong>分词规范：</strong>参考 GB/T 13715-1992《信息处理用现代汉语分词规范》（该国标规定了中文分词的基本原则和书写规则）。注：该标准最新版本情况需查标准原文确认。</li>
      <li><strong>词性标记集：</strong>参考北京大学计算语言学研究所《人民日报》语料库词性标注集（俗称"北大标注集"），本工具做了简化，仅保留 14 个大类。具体标记映射关系需查北大语料库文档原文确认。</li>
      <li><strong>词典来源：</strong>内置词典为人工整理的常用词表（约 600+ 词条），覆盖现代汉语高频词，不等同于任何权威词典（如《现代汉语词典》）的完整收录。</li>
      <li><strong>未使用数据：</strong>本工具未使用任何训练数据、语料库统计或机器学习模型，所有标注结果完全来自词典匹配和规则推断。</li>
    </ul>

    <h3>七、局限性说明（重要）</h3>
    <p>本工具存在以下明确的局限性，使用者必须知晓：</p>
    <ol>
      <li><strong>准确率有限：</strong>纯规则方法无法处理歧义。例如"方便"在"方便面"中是形容词，在"方便一下"中是动词，本工具只能按词典主标注给出单一结果。</li>
      <li><strong>词典规模小：</strong>仅收录约 600+ 常用词，大量专业术语、人名、地名、新词、网络用语无法识别，会被切成单字并标为 x。</li>
      <li><strong>无上下文建模：</strong>不考虑前后文语境，无法根据句法结构动态调整词性。例如"锁"在"门锁"中是名词，在"锁门"中是动词，本工具无法区分。</li>
      <li><strong>未登录词处理弱：</strong>对词典外的词只能按单字切分 + 单字启发式规则猜测，准确率很低。</li>
      <li><strong>不支持繁体中文：</strong>词典仅收录简体字，繁体输入会被当作未登录字处理。</li>
      <li><strong>不支持古汉语：</strong>词典基于现代汉语，古汉语词汇和用法无法正确标注。</li>
      <li><strong>不处理嵌套结构：</strong>如成语、固定搭配、专有名词（"北京大学"可能被切成"北京/n 大学/n"而非整体）。</li>
      <li><strong>性能限制：</strong>最大正向匹配算法对超长文本（数万字以上）性能尚可，但未做优化，不建议用于大规模语料处理。</li>
      <li><strong>无置信度输出：</strong>本工具只给出单一标注结果，不输出概率或置信度，无法判断标注的可靠程度。</li>
      <li><strong>不保证与任何标准完全一致：</strong>标记集虽参考北大标注集，但做了简化，与完整标注集存在差异，不可直接用于学术引用或标准合规场景。</li>
    </ol>

    <h3>八、适用与不适用场景</h3>
    <p><strong>适用：</strong>教学演示、NLP 入门学习、前端原型、轻量级文本分析、离线环境下的粗粒度标注。</p>
    <p><strong>不适用：</strong>生产级 NLP 系统、学术语料标注、需要高准确率的商业应用、专业领域（医学、法律、金融）文本处理、大规模语料库建设。</p>
    <p>如需更高准确率，建议使用基于深度学习的工具，如 jieba（Python）、HanLP、LTP、spaCy 等，或调用云端 NLP API。</p>
