<script>
// ============================================================
// 第一部分：JS 源码 — 齿轮传动比计算核心算法
// ============================================================

/**
 * 校验数值参数是否为有效正数
 * @param {number} value - 待校验的值
 * @param {string} name - 参数名称（用于错误信息）
 * @returns {void}
 * @throws {Error} 当值不是有效正数时抛出异常
 */
function validatePositiveNumber(value, name) {
    if (value === null || value === undefined) {
        throw new Error(`参数 ${name} 不能为 null 或 undefined`);
    }
    if (typeof value !== 'number') {
        throw new Error(`参数 ${name} 必须是数字类型，当前为 ${typeof value}`);
    }
    if (Number.isNaN(value)) {
        throw new Error(`参数 ${name} 不能为 NaN`);
    }
    if (!Number.isFinite(value)) {
        throw new Error(`参数 ${name} 不能为 Infinity`);
    }
    if (value <= 0) {
        throw new Error(`参数 ${name} 必须为正数，当前值为 ${value}`);
    }
}

/**
 * 校验数值参数是否为有效非负数
 * @param {number} value - 待校验的值
 * @param {string} name - 参数名称（用于错误信息）
 * @returns {void}
 * @throws {Error} 当值不是有效非负数时抛出异常
 */
function validateNonNegativeNumber(value, name) {
    if (value === null || value === undefined) {
        throw new Error(`参数 ${name} 不能为 null 或 undefined`);
    }
    if (typeof value !== 'number') {
        throw new Error(`参数 ${name} 必须是数字类型，当前为 ${typeof value}`);
    }
    if (Number.isNaN(value)) {
        throw new Error(`参数 ${name} 不能为 NaN`);
    }
    if (!Number.isFinite(value)) {
        throw new Error(`参数 ${name} 不能为 Infinity`);
    }
    if (value < 0) {
        throw new Error(`参数 ${name} 不能为负数，当前值为 ${value}`);
    }
}

/**
 * 校验齿数是否为有效正整数
 * @param {number} value - 待校验的齿数
 * @param {string} name - 参数名称（用于错误信息）
 * @returns {void}
 * @throws {Error} 当齿数不是有效正整数时抛出异常
 */
function validateToothCount(value, name) {
    validatePositiveNumber(value, name);
    if (!Number.isInteger(value)) {
        throw new Error(`参数 ${name} 必须为正整数，当前值为 ${value}`);
    }
    if (value < 4) {
        throw new Error(`参数 ${name} 过小（${value}），标准齿轮齿数一般不小于 17（不根切），最小不应小于 4`);
    }
}

/**
 * 计算传动比（基于齿数）
 * 传动比 i = 从动轮齿数 z2 / 主动轮齿数 z1
 * 对于减速传动，i > 1；对于增速传动，i < 1。
 *
 * @param {number} z1 - 主动轮齿数（正整数，一般 ≥ 17）
 * @param {number} z2 - 从动轮齿数（正整数，一般 ≥ 17）
 * @returns {number} 传动比 i（无量纲）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcRatioByTeeth(20, 80); // => 4
 *   calcRatioByTeeth(40, 40); // => 1
 *   calcRatioByTeeth(30, 15); // => 0.5
 */
function calcRatioByTeeth(z1, z2) {
    validateToothCount(z1, 'z1（主动轮齿数）');
    validateToothCount(z2, 'z2（从动轮齿数）');
    return z2 / z1;
}

/**
 * 计算传动比（基于转速）
 * 传动比 i = 主动轮转速 n1 / 从动轮转速 n2
 *
 * @param {number} n1 - 主动轮转速（单位：r/min，正数）
 * @param {number} n2 - 从动轮转速（单位：r/min，正数）
 * @returns {number} 传动比 i（无量纲）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcRatioBySpeed(1440, 360); // => 4
 *   calcRatioBySpeed(1000, 1000); // => 1
 */
function calcRatioBySpeed(n1, n2) {
    validatePositiveNumber(n1, 'n1（主动轮转速）');
    validatePositiveNumber(n2, 'n2（从动轮转速）');
    return n1 / n2;
}

/**
 * 由传动比和主动轮转速计算从动轮转速
 * n2 = n1 / i
 *
 * @param {number} n1 - 主动轮转速（单位：r/min，正数）
 * @param {number} i - 传动比（正数）
 * @returns {number} 从动轮转速 n2（单位：r/min）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcDrivenSpeed(1440, 4); // => 360
 *   calcDrivenSpeed(1000, 2); // => 500
 */
function calcDrivenSpeed(n1, i) {
    validatePositiveNumber(n1, 'n1（主动轮转速）');
    validatePositiveNumber(i, 'i（传动比）');
    return n1 / i;
}

/**
 * 由传动比和从动轮转速计算主动轮转速
 * n1 = n2 * i
 *
 * @param {number} n2 - 从动轮转速（单位：r/min，正数）
 * @param {number} i - 传动比（正数）
 * @returns {number} 主动轮转速 n1（单位：r/min）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcDrivingSpeed(360, 4); // => 1440
 *   calcDrivingSpeed(500, 2); // => 1000
 */
function calcDrivingSpeed(n2, i) {
    validatePositiveNumber(n2, 'n2（从动轮转速）');
    validatePositiveNumber(i, 'i（传动比）');
    return n2 * i;
}

/**
 * 由传动比和主动轮扭矩计算从动轮扭矩（理想情况，不考虑效率）
 * T2 = T1 * i
 * 注意：实际应用中需考虑传动效率 η，此时 T2 = T1 * i * η
 *
 * @param {number} T1 - 主动轮扭矩（单位：N·m，正数）
 * @param {number} i - 传动比（正数）
 * @returns {number} 从动轮扭矩 T2（单位：N·m）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcDrivenTorque(100, 4); // => 400
 *   calcDrivenTorque(50, 2); // => 100
 */
function calcDrivenTorque(T1, i) {
    validatePositiveNumber(T1, 'T1（主动轮扭矩）');
    validatePositiveNumber(i, 'i（传动比）');
    return T1 * i;
}

/**
 * 由传动比和从动轮扭矩计算主动轮扭矩（理想情况，不考虑效率）
 * T1 = T2 / i
 *
 * @param {number} T2 - 从动轮扭矩（单位：N·m，正数）
 * @param {number} i - 传动比（正数）
 * @returns {number} 主动轮扭矩 T1（单位：N·m）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcDrivingTorque(400, 4); // => 100
 *   calcDrivingTorque(100, 2); // => 50
 */
function calcDrivingTorque(T2, i) {
    validatePositiveNumber(T2, 'T2（从动轮扭矩）');
    validatePositiveNumber(i, 'i（传动比）');
    return T2 / i;
}

/**
 * 考虑传动效率的从动轮扭矩计算
 * T2 = T1 * i * η
 *
 * @param {number} T1 - 主动轮扭矩（单位：N·m，正数）
 * @param {number} i - 传动比（正数）
 * @param {number} eta - 传动效率（0 < η ≤ 1，无量纲）
 * @returns {number} 从动轮扭矩 T2（单位：N·m）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcDrivenTorqueWithEfficiency(100, 4, 0.97); // => 388
 *   calcDrivenTorqueWithEfficiency(100, 4, 1.0); // => 400
 */
function calcDrivenTorqueWithEfficiency(T1, i, eta) {
    validatePositiveNumber(T1, 'T1（主动轮扭矩）');
    validatePositiveNumber(i, 'i（传动比）');
    if (eta === null || eta === undefined) {
        throw new Error('参数 eta（传动效率）不能为 null 或 undefined');
    }
    if (typeof eta !== 'number' || Number.isNaN(eta)) {
        throw new Error('参数 eta（传动效率）必须是有效数字');
    }
    if (eta <= 0 || eta > 1) {
        throw new Error(`参数 eta（传动效率）必须在 (0, 1] 范围内，当前值为 ${eta}`);
    }
    return T1 * i * eta;
}

/**
 * 计算齿轮模数
 * 模数 m = 分度圆直径 d / 齿数 z
 * 模数是齿轮最基本的参数，单位为 mm。
 * 标准模数系列参见 GB/T 1357-2008。
 *
 * @param {number} d - 分度圆直径（单位：mm，正数）
 * @param {number} z - 齿数（正整数）
 * @returns {number} 模数 m（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcModule(100, 50); // => 2
 *   calcModule(200, 40); // => 5
 */
function calcModule(d, z) {
    validatePositiveNumber(d, 'd（分度圆直径）');
    validateToothCount(z, 'z（齿数）');
    return d / z;
}

/**
 * 计算分度圆直径
 * d = m * z
 *
 * @param {number} m - 模数（单位：mm，正数）
 * @param {number} z - 齿数（正整数）
 * @returns {number} 分度圆直径 d（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcPitchDiameter(2, 50); // => 100
 *   calcPitchDiameter(5, 40); // => 200
 */
function calcPitchDiameter(m, z) {
    validatePositiveNumber(m, 'm（模数）');
    validateToothCount(z, 'z（齿数）');
    return m * z;
}

/**
 * 计算标准中心距
 * a = m * (z1 + z2) / 2
 * 适用于标准齿轮传动（无变位）。
 *
 * @param {number} m - 模数（单位：mm，正数）
 * @param {number} z1 - 主动轮齿数（正整数）
 * @param {number} z2 - 从动轮齿数（正整数）
 * @returns {number} 标准中心距 a（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcCenterDistance(2, 20, 80); // => 200
 *   calcCenterDistance(5, 20, 40); // => 150
 */
function calcCenterDistance(m, z1, z2) {
    validatePositiveNumber(m, 'm（模数）');
    validateToothCount(z1, 'z1（主动轮齿数）');
    validateToothCount(z2, 'z2（从动轮齿数）');
    return m * (z1 + z2) / 2;
}

/**
 * 由中心距反算模数
 * m = 2a / (z1 + z2)
 *
 * @param {number} a - 中心距（单位：mm，正数）
 * @param {number} z1 - 主动轮齿数（正整数）
 * @param {number} z2 - 从动轮齿数（正整数）
 * @returns {number} 模数 m（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcModuleFromCenterDistance(200, 20, 80); // => 2
 *   calcModuleFromCenterDistance(150, 20, 40); // => 5
 */
function calcModuleFromCenterDistance(a, z1, z2) {
    validatePositiveNumber(a, 'a（中心距）');
    validateToothCount(z1, 'z1（主动轮齿数）');
    validateToothCount(z2, 'z2（从动轮齿数）');
    return 2 * a / (z1 + z2);
}

/**
 * 计算齿顶高
 * 标准齿轮：ha = ha* * m，其中 ha* = 1.0（正常齿制）
 *
 * @param {number} m - 模数（单位：mm，正数）
 * @param {number} [haStar=1.0] - 齿顶高系数（无量纲，正常齿制为 1.0，短齿制为 0.8）
 * @returns {number} 齿顶高 ha（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcAddendum(2); // => 2
 *   calcAddendum(2, 0.8); // => 1.6
 */
function calcAddendum(m, haStar) {
    if (haStar === undefined || haStar === null) {
        haStar = 1.0;
    }
    validatePositiveNumber(m, 'm（模数）');
    if (typeof haStar !== 'number' || Number.isNaN(haStar) || haStar <= 0) {
        throw new Error(`参数 haStar（齿顶高系数）必须为正数，当前值为 ${haStar}`);
    }
    return haStar * m;
}

/**
 * 计算齿根高
 * 标准齿轮：hf = (ha* + c*) * m，其中 c* = 0.25（顶隙系数）
 * 正常齿制：hf = 1.25 * m
 *
 * @param {number} m - 模数（单位：mm，正数）
 * @param {number} [haStar=1.0] - 齿顶高系数（无量纲）
 * @param {number} [cStar=0.25] - 顶隙系数（无量纲）
 * @returns {number} 齿根高 hf（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcDedendum(2); // => 2.5
 *   calcDedendum(4); // => 5
 */
function calcDedendum(m, haStar, cStar) {
    if (haStar === undefined || haStar === null) {
        haStar = 1.0;
    }
    if (cStar === undefined || cStar === null) {
        cStar = 0.25;
    }
    validatePositiveNumber(m, 'm（模数）');
    if (typeof haStar !== 'number' || Number.isNaN(haStar) || haStar <= 0) {
        throw new Error(`参数 haStar（齿顶高系数）必须为正数，当前值为 ${haStar}`);
    }
    if (typeof cStar !== 'number' || Number.isNaN(cStar) || cStar < 0) {
        throw new Error(`参数 cStar（顶隙系数）不能为负数，当前值为 ${cStar}`);
    }
    return (haStar + cStar) * m;
}

/**
 * 计算全齿高
 * h = ha + hf = (2*ha* + c*) * m
 * 正常齿制：h = 2.25 * m
 *
 * @param {number} m - 模数（单位：mm，正数）
 * @param {number} [haStar=1.0] - 齿顶高系数
 * @param {number} [cStar=0.25] - 顶隙系数
 * @returns {number} 全齿高 h（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcWholeDepth(2); // => 4.5
 *   calcWholeDepth(4); // => 9
 */
function calcWholeDepth(m, haStar, cStar) {
    if (haStar === undefined || haStar === null) {
        haStar = 1.0;
    }
    if (cStar === undefined || cStar === null) {
        cStar = 0.25;
    }
    validatePositiveNumber(m, 'm（模数）');
    if (typeof haStar !== 'number' || Number.isNaN(haStar) || haStar <= 0) {
        throw new Error(`参数 haStar（齿顶高系数）必须为正数，当前值为 ${haStar}`);
    }
    if (typeof cStar !== 'number' || Number.isNaN(cStar) || cStar < 0) {
        throw new Error(`参数 cStar（顶隙系数）不能为负数，当前值为 ${cStar}`);
    }
    return (2 * haStar + cStar) * m;
}

/**
 * 计算齿顶圆直径
 * da = d + 2*ha = m*z + 2*haStar*m = m*(z + 2*haStar)
 *
 * @param {number} m - 模数（单位：mm，正数）
 * @param {number} z - 齿数（正整数）
 * @param {number} [haStar=1.0] - 齿顶高系数
 * @returns {number} 齿顶圆直径 da（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcAddendumDiameter(2, 50); // => 104
 *   calcAddendumDiameter(5, 40); // => 210
 */
function calcAddendumDiameter(m, z, haStar) {
    if (haStar === undefined || haStar === null) {
        haStar = 1.0;
    }
    validatePositiveNumber(m, 'm（模数）');
    validateToothCount(z, 'z（齿数）');
    if (typeof haStar !== 'number' || Number.isNaN(haStar) || haStar <= 0) {
        throw new Error(`参数 haStar（齿顶高系数）必须为正数，当前值为 ${haStar}`);
    }
    return m * (z + 2 * haStar);
}

/**
 * 计算齿根圆直径
 * df = d - 2*hf = m*z - 2*(haStar + cStar)*m = m*(z - 2*haStar - 2*cStar)
 *
 * @param {number} m - 模数（单位：mm，正数）
 * @param {number} z - 齿数（正整数）
 * @param {number} [haStar=1.0] - 齿顶高系数
 * @param {number} [cStar=0.25] - 顶隙系数
 * @returns {number} 齿根圆直径 df（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcDedendumDiameter(2, 50); // => 95
 *   calcDedendumDiameter(5, 40); // => 187.5
 */
function calcDedendumDiameter(m, z, haStar, cStar) {
    if (haStar === undefined || haStar === null) {
        haStar = 1.0;
    }
    if (cStar === undefined || cStar === null) {
        cStar = 0.25;
    }
    validatePositiveNumber(m, 'm（模数）');
    validateToothCount(z, 'z（齿数）');
    if (typeof haStar !== 'number' || Number.isNaN(haStar) || haStar <= 0) {
        throw new Error(`参数 haStar（齿顶高系数）必须为正数，当前值为 ${haStar}`);
    }
    if (typeof cStar !== 'number' || Number.isNaN(cStar) || cStar < 0) {
        throw new Error(`参数 cStar（顶隙系数）不能为负数，当前值为 ${cStar}`);
    }
    return m * (z - 2 * haStar - 2 * cStar);
}

/**
 * 计算基圆直径
 * db = d * cos(α) = m * z * cos(α)
 * 标准压力角 α = 20°
 *
 * @param {number} m - 模数（单位：mm，正数）
 * @param {number} z - 齿数（正整数）
 * @param {number} [alphaDeg=20] - 压力角（单位：度，默认 20°）
 * @returns {number} 基圆直径 db（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcBaseDiameter(2, 50); // ≈ 93.969
 *   calcBaseDiameter(2, 50, 20); // ≈ 93.969
 */
function calcBaseDiameter(m, z, alphaDeg) {
    if (alphaDeg === undefined || alphaDeg === null) {
        alphaDeg = 20;
    }
    validatePositiveNumber(m, 'm（模数）');
    validateToothCount(z, 'z（齿数）');
    if (typeof alphaDeg !== 'number' || Number.isNaN(alphaDeg)) {
        throw new Error(`参数 alphaDeg（压力角）必须是有效数字，当前值为 ${alphaDeg}`);
    }
    if (alphaDeg <= 0 || alphaDeg >= 90) {
        throw new Error(`参数 alphaDeg（压力角）必须在 (0, 90) 范围内，当前值为 ${alphaDeg}`);
    }
    const alphaRad = alphaDeg * Math.PI / 180;
    return m * z * Math.cos(alphaRad);
}

/**
 * 计算分度圆上的齿距（周节）
 * p = π * m
 *
 * @param {number} m - 模数（单位：mm，正数）
 * @returns {number} 齿距 p（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcCircularPitch(2); // ≈ 6.283
 *   calcCircularPitch(5); // ≈ 15.708
 */
function calcCircularPitch(m) {
    validatePositiveNumber(m, 'm（模数）');
    return Math.PI * m;
}

/**
 * 计算分度圆上的齿厚（标准齿轮）
 * s = π * m / 2
 *
 * @param {number} m - 模数（单位：mm，正数）
 * @returns {number} 齿厚 s（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcToothThickness(2); // ≈ 3.142
 *   calcToothThickness(5); // ≈ 7.854
 */
function calcToothThickness(m) {
    validatePositiveNumber(m, 'm（模数）');
    return Math.PI * m / 2;
}

/**
 * 由功率和转速计算扭矩
 * T = 9550 * P / n
 * 其中 P 单位为 kW，n 单位为 r/min，T 单位为 N·m
 *
 * @param {number} P - 功率（单位：kW，正数）
 * @param {number} n - 转速（单位：r/min，正数）
 * @returns {number} 扭矩 T（单位：N·m）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcTorqueFromPower(10, 1440); // ≈ 66.319
 *   calcTorqueFromPower(5, 960); // ≈ 49.740
 */
function calcTorqueFromPower(P, n) {
    validatePositiveNumber(P, 'P（功率）');
    validatePositiveNumber(n, 'n（转速）');
    return 9550 * P / n;
}

/**
 * 由扭矩和转速计算功率
 * P = T * n / 9550
 * 其中 T 单位为 N·m，n 单位为 r/min，P 单位为 kW
 *
 * @param {number} T - 扭矩（单位：N·m，正数）
 * @param {number} n - 转速（单位：r/min，正数）
 * @returns {number} 功率 P（单位：kW）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcPowerFromTorque(66.319, 1440); // ≈ 10
 *   calcPowerFromTorque(100, 1000); // ≈ 10.471
 */
function calcPowerFromTorque(T, n) {
    validatePositiveNumber(T, 'T（扭矩）');
    validatePositiveNumber(n, 'n（转速）');
    return T * n / 9550;
}

/**
 * 查找最接近的标准模数（GB/T 1357-2008）
 * 第一系列优先选用
 *
 * @param {number} mCalc - 计算所得模数（单位：mm，正数）
 * @returns {number} 最接近的标准模数（单位：mm）
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   findStandardModule(2.3); // => 2.5
 *   findStandardModule(3.8); // => 4
 */
function findStandardModule(mCalc) {
    validatePositiveNumber(mCalc, 'mCalc（计算模数）');
    // GB/T 1357-2008 第一系列标准模数
    const standardModules = [
        0.05, 0.06, 0.08, 0.10, 0.12, 0.16, 0.20, 0.25, 0.32, 0.40,
        0.50, 0.60, 0.80, 1.0, 1.25, 1.5, 2.0, 2.5, 3.0, 4.0,
        5.0, 6.0, 8.0, 10, 12, 16, 20, 25, 32, 40, 50
    ];
    let closest = standardModules[0];
    let minDiff = Math.abs(mCalc - closest);
    for (let i = 1; i < standardModules.length; i++) {
        const diff = Math.abs(mCalc - standardModules[i]);
        if (diff < minDiff) {
            minDiff = diff;
            closest = standardModules[i];
        }
    }
    return closest;
}

/**
 * 完整齿轮副参数计算
 * 输入基本参数，输出所有关键几何参数和运动参数
 *
 * @param {Object} params - 输入参数对象
 * @param {number} params.m - 模数（单位：mm）
 * @param {number} params.z1 - 主动轮齿数
 * @param {number} params.z2 - 从动轮齿数
 * @param {number} [params.n1] - 主动轮转速（单位：r/min）
 * @param {number} [params.T1] - 主动轮扭矩（单位：N·m）
 * @param {number} [params.alphaDeg=20] - 压力角（度）
 * @param {number} [params.haStar=1.0] - 齿顶高系数
 * @param {number} [params.cStar=0.25] - 顶隙系数
 * @returns {Object} 计算结果对象，包含所有齿轮参数
 * @throws {Error} 参数无效时抛出异常
 * @example
 *   calcGearPair({ m: 2, z1: 20, z2: 80, n1: 1440, T1: 50 });
 *   // => { ratio: 4, n2: 360, T2: 200, d1: 40, d2: 160, a: 100, ... }
 */
function calcGearPair(params) {
    if (params === null || params === undefined || typeof params !== 'object') {
        throw new Error('参数 params 必须为非空对象');
    }
    const { m, z1, z2, n1, T1, alphaDeg, haStar, cStar } = params;
    validatePositiveNumber(m, 'm（模数）');
    validateToothCount(z1, 'z1（主动轮齿数）');
    validateToothCount(z2, 'z2（从动轮齿数）');

    const result = {};

    // 传动比
    result.ratio = calcRatioByTeeth(z1, z2);

    // 分度圆直径
    result.d1 = calcPitchDiameter(m, z1);
    result.d2 = calcPitchDiameter(m, z2);

    // 中心距
    result.a = calcCenterDistance(m, z1, z2);

    // 齿顶圆直径
    result.da1 = calcAddendumDiameter(m, z1, haStar);
    result.da2 = calcAddendumDiameter(m, z2, haStar);

    // 齿根圆直径
    result.df1 = calcDedendumDiameter(m, z1, haStar, cStar);
    result.df2 = calcDedendumDiameter(m, z2, haStar, cStar);

    // 基圆直径
    result.db1 = calcBaseDiameter(m, z1, alphaDeg);
    result.db2 = calcBaseDiameter(m, z2, alphaDeg);

    // 齿高参数
    result.ha = calcAddendum(m, haStar);
    result.hf = calcDedendum(m, haStar, cStar);
    result.h = calcWholeDepth(m, haStar, cStar);

    // 齿距和齿厚
    result.p = calcCircularPitch(m);
    result.s = calcToothThickness(m);

    // 运动参数
    if (n1 !== undefined && n1 !== null) {
        validatePositiveNumber(n1, 'n1（主动轮转速）');
        result.n1 = n1;
        result.n2 = calcDrivenSpeed(n1, result.ratio);
    }

    // 扭矩参数
    if (T1 !== undefined && T1 !== null) {
        validatePositiveNumber(T1, 'T1（主动轮扭矩）');
        result.T1 = T1;
        result.T2 = calcDrivenTorque(T1, result.ratio);
    }

    return result;
}

// 导出所有函数（浏览器环境挂到 window）
if (typeof window !== 'undefined') {
    window.GearCalc = {
        validatePositiveNumber,
        validateNonNegativeNumber,
        validateToothCount,
        calcRatioByTeeth,
        calcRatioBySpeed,
        calcDrivenSpeed,
        calcDrivingSpeed,
        calcDrivenTorque,
        calcDrivingTorque,
        calcDrivenTorqueWithEfficiency,
        calcModule,
        calcPitchDiameter,
        calcCenterDistance,
        calcModuleFromCenterDistance,
        calcAddendum,
        calcDedendum,
        calcWholeDepth,
        calcAddendumDiameter,
        calcDedendumDiameter,
        calcBaseDiameter,
        calcCircularPitch,
        calcToothThickness,
        calcTorqueFromPower,
        calcPowerFromTorque,
        findStandardModule,
        calcGearPair
    };
}
</script>

            passed++;

    // ===== calcPitchDiameter 测试 =====
    assertEqual('分度圆: m=2, z=50 → d=100', G.calcPitchDiameter(2, 50), 100);

    // ===== calcCenterDistance 测试 =====
    assertEqual('中心距: m=2, z1=20, z2=80 → a=200', G.calcCenterDistance(2, 20, 80), 200);

    // ===== calcBaseDiameter 测试（精度测试）

    // ===== calcGearPair 综合测试 =====
    const pair = G.calcGearPair({ m: 2, z1: 20, z2: 80, n1: 1440, T1: 50 });

    assertEqual('齿轮副: df1=35', pair.df1, 35);

    const resultClass = passed === total ? 'test-pass' : 'test-fail';
    output.innerHTML = `<div class="test-result ${resultClass}">通过 ${passed} / 共 ${total}</div>` +
        `<div class="test-detail">${details.join('')}</div>`;

document.getElementById('manualContent').innerHTML = `
<div class="manual-section">
<h2>一、工具概述</h2>
<p>本工具是一个用于渐开线圆柱直齿轮传动设计的工程计算工具，覆盖传动比计算、转速换算、扭矩换算、齿轮几何参数计算等核心功能。适用于机械设计工程师、设备维护人员、相关专业学生在进行齿轮传动方案设计和校核时的快速计算需求。</p>
<p>本工具解决的核心问题包括：</p>
<ul>
<li>已知齿数求传动比，或已知传动比和某一轴转速求另一轴转速</li>
<li>已知传动比和某一轴扭矩求另一轴扭矩（含效率修正）</li>
<li>由功率和转速计算扭矩，或由扭矩和转速反算功率</li>
<li>由模数和齿数计算齿轮全部几何参数（分度圆、齿顶圆、齿根圆、基圆、中心距等）</li>
<li>由计算模数查找最接近的 GB/T 1357-2008 标准模数</li>
<li>由中心距和齿数反算模数</li>
</ul>
<p>本工具为纯前端 JavaScript 实现，无需安装任何软件，打开浏览器即可使用。所有计算均为纯函数，不依赖任何外部库。</p>
</div>

<h2>三、核心公式说明</h2>
<h3>3.1 传动比</h3>
<p>传动比 i 是齿轮传动最基本的参数，有以下等价关系：</p>
<p style="text-indent:0; text-align:center; font-size:16px;"><strong>i = z₂ / z₁ = n₁ / n₂ = T₂ / T₁</strong></p>
<p>其中 z 为齿数，n 为转速，T 为扭矩。减速传动时 i > 1，转速降低但扭矩增大；增速传动时 i < 1，转速升高但扭矩减小。</p>

<h3>3.2 齿轮几何参数</h3>
<p>标准齿轮（无变位）的主要几何参数计算公式：</p>
<ul>
<li>分度圆直径：d = m × z</li>
<li>齿顶高：ha = ha* × m（正常齿制 ha = m）</li>
<li>齿根高：hf = (ha* + c*) × m（正常齿制 hf = 1.25m）</li>
<li>全齿高：h = ha + hf = (2ha* + c*) × m（正常齿制 h = 2.25m）</li>
<li>齿顶圆直径：da = d + 2ha = m(z + 2ha*)</li>
<li>齿根圆直径：df = d - 2hf = m(z - 2ha* - 2c*)</li>
<li>基圆直径：db = d × cos(α) = mz × cos(α)</li>
<li>标准中心距：a = m(z₁ + z₂) / 2</li>
<li>齿距（周节）：p = π × m</li>
<li>分度圆齿厚：s = π × m / 2</li>
</ul>

<h3>3.3 功率-扭矩-转速关系</h3>
<p>T = 9550 × P / n</p>
<p>其中 T 为扭矩（N·m），P 为功率（kW），n 为转速（r/min）。常数 9550 来源于 9550 = 60 × 1000 / (2π) ≈ 9549.3，工程上取 9550。</p>
</div>

<div class="manual-section">
<h2>四、实际使用场景</h2>

<div class="scenario">
<h4>场景一：减速机设计——确定传动比和各轴参数</h4>
<p><strong>背景：</strong>某输送设备需要设计一级圆柱齿轮减速机。电机转速 1440 r/min，要求输出轴转速 360 r/min，电机输出功率 10 kW。</p>
<p><strong>输入：</strong></p>
<div class="input-output">
主动轮转速 n1 = 1440 r/min<br>
从动轮转速 n2 = 360 r/min<br>
功率 P = 10 kW
</div>
<p><strong>计算步骤与结果：</strong></p>
<div class="input-output">
① 传动比 i = n1/n2 = 1440/360 = <strong>4</strong><br>
② 主动轮扭矩 T1 = 9550 × P / n1 = 9550 × 10 / 1440 ≈ <strong>66.32 N·m</strong><br>
③ 从动轮扭矩 T2 = T1 × i = 66.32 × 4 ≈ <strong>265.28 N·m</strong>（理想值）<br>
④ 考虑效率 η=0.97：T2_实际 = 66.32 × 4 × 0.97 ≈ <strong>257.32 N·m</strong>
</div>
<p><strong>工程意义：</strong>确定减速比为 4:1，输出扭矩约 257 N·m，可据此选择轴径和校核强度。</p>
</div>

<div class="scenario">
<h4>场景二：齿轮几何参数计算——已知模数和齿数求全部尺寸</h4>
<p><strong>背景：</strong>已知一对标准直齿轮，模数 m = 3 mm，主动轮齿数 z1 = 25，从动轮齿数 z2 = 75，压力角 α = 20°。</p>
<p><strong>输入：</strong></p>
<div class="input-output">
模数 m = 3 mm<br>
z1 = 25, z2 = 75<br>
α = 20°, ha* = 1.0, c* = 0.25
</div>
<p><strong>计算结果：</strong></p>
<div class="input-output">
传动比 i = 75/25 = <strong>3</strong><br>
分度圆直径 d1 = 3×25 = <strong>75 mm</strong>，d2 = 3×75 = <strong>225 mm</strong><br>
齿顶圆直径 da1 = 3×(25+2) = <strong>81 mm</strong>，da2 = 3×(75+2) = <strong>231 mm</strong><br>
齿根圆直径 df1 = 3×(25-2.5) = <strong>67.5 mm</strong>，df2 = 3×(75-2.5) = <strong>217.5 mm</strong><br>
基圆直径 db1 = 75×cos20° ≈ <strong>70.48 mm</strong>，db2 = 225×cos20° ≈ <strong>211.43 mm</strong><br>
标准中心距 a = 3×(25+75)/2 = <strong>150 mm</strong><br>
齿顶高 ha = <strong>3 mm</strong>，齿根高 hf = <strong>3.75 mm</strong>，全齿高 h = <strong>6.75 mm</strong><br>
齿距 p = π×3 ≈ <strong>9.42 mm</strong>，齿厚 s = π×3/2 ≈ <strong>4.71 mm</strong>
</div>
</div>

<div class="scenario">
<h4>场景三：由中心距反推模数——设备改造中的齿轮配对</h4>
<p><strong>背景：</strong>设备改造中，两轴中心距已固定为 180 mm，需要配一对齿轮，主动轮齿数 z1 = 30，从动轮齿数 z2 = 60。</p>
<p><strong>输入：</strong></p>
<div class="input-output">
中心距 a = 180 mm<br>
z1 = 30, z2 = 60
</div>
<p><strong>计算结果：</strong></p>
<div class="input-output">
计算模数 m = 2a/(z1+z2) = 2×180/(30+60) = 360/90 = <strong>4 mm</strong><br>
查标准模数：4 mm 恰好是 GB/T 1357-2008 标准值，<strong>可直接采用 m = 4</strong><br>
验证：d1 = 4×30 = 120 mm，d2 = 4×60 = 240 mm，a = (120+240)/2 = 180 mm ✓
</div>
<p><strong>工程意义：</strong>在设备改造中，中心距往往受限于箱体结构无法改变，此时需要由中心距反算模数和齿数的匹配关系。</p>
</div>

<div class="scenario">
<h4>场景四：多级传动的转速和扭矩传递</h4>
<p><strong>背景：</strong>某机床主轴箱有两级齿轮传动。第一级：z1=20, z2=60；第二级：z3=25, z4=50。电机转速 1440 r/min，输入扭矩 30 N·m。</p>
<p><strong>输入与计算：</strong></p>
<div class="input-output">
第一级传动比 i₁ = 60/20 = <strong>3</strong><br>
第二级传动比 i₂ = 50/25 = <strong>2</strong><br>
总传动比 i_total = i₁ × i₂ = 3 × 2 = <strong>6</strong><br><br>
各轴转速：<br>
轴 I（电机轴）：n = <strong>1440 r/min</strong><br>
轴 II（中间轴）：n = 1440/3 = <strong>480 r/min</strong><br>
轴 III（主轴）：n = 480/2 = <strong>240 r/min</strong><br><br>
各轴扭矩（理想值）：<br>
轴 I：T = <strong>30 N·m</strong><br>
轴 II：T = 30 × 3 = <strong>90 N·m</strong><br>
轴 III：T = 90 × 2 = <strong>180 N·m</strong>
</div>
</div>

<div class="scenario">
<h4>场景五：非标准模数的标准化选取</h4>
<p><strong>背景：</strong>设计计算得到所需模数为 3.67 mm，需要选取标准模数。</p>
<p><strong>输入：</strong></p>
<div class="input-output">
计算模数 m_calc = 3.67 mm
</div>
<p><strong>计算结果：</strong></p>
<div class="input-output">
调用 findStandardModule(3.67)<br>
GB/T 1357-2008 标准模数中，3.67 最接近的标准值为 <strong>4 mm</strong><br>
（3 和 4 之间，|3.67-3|=0.67，|3.67-4|=0.33，故取 4）
</div>
<p><strong>注意：</strong>选取标准模数后，需要重新验算中心距、齿面接触强度和齿根弯曲强度是否满足要求。如不满足，可能需要调整齿数或采用变位齿轮。</p>
</div>

<div class="scenario">
<h4>场景六：已知功率和转速校核扭矩</h4>
<p><strong>背景：</strong>某齿轮箱输入端：电机功率 7.5 kW，转速 960 r/min。需要计算输入扭矩以选择联轴器。</p>
<p><strong>输入：</strong></p>
<div class="input-output">
P = 7.5 kW, n = 960 r/min
</div>
<p><strong>计算结果：</strong></p>
<div class="input-output">
T = 9550 × P / n = 9550 × 7.5 / 960 ≈ <strong>74.61 N·m</strong><br>
选择联轴器时，应考虑工况系数（一般取 1.2~1.5），计算扭矩 ≈ 74.61 × 1.5 ≈ <strong>111.9 N·m</strong>
</div>
</div>

<div class="manual-section">
<h2>七、局限性说明</h2>
<div class="warning">
<strong>⚠️ 本工具存在以下局限性，请用户务必了解：</strong>
</div>
<ol>
<li><strong>仅适用于标准直齿圆柱齿轮：</strong>本工具的所有几何参数计算均基于标准齿轮（无变位）假设。不适用于斜齿轮、锥齿轮、蜗轮蜗杆、内齿轮、变位齿轮等。斜齿轮需引入螺旋角修正，本工具未实现。</li>
<li><strong>不进行强度校核：</strong>本工具不计算齿面接触疲劳强度和齿根弯曲疲劳强度。强度校核需按 GB/T 3480 系列标准进行，涉及载荷系数、材料参数、寿命系数等大量参数，远超本工具范围。</li>
<li><strong>不考虑变位：</strong>实际工程中，为满足中心距要求或避免根切，常采用变位齿轮。本工具所有计算均假设变位系数 x = 0。</li>
<li><strong>效率值为手动输入：</strong>传动效率取决于齿轮精度、润滑条件、转速、载荷等多种因素，本工具不提供效率自动计算功能，需用户根据经验或手册自行确定。</li>
<li><strong>精度限制：</strong>本工具使用 JavaScript 的 IEEE 754 双精度浮点数进行计算，对于极端精度要求的场合（如航天航空），建议使用专业 CAE 软件。</li>
<li><strong>不涉及动态分析：</strong>不计算齿轮的振动、噪声、动载荷等动态特性。</li>
<li><strong>不涉及热计算：</strong>不计算齿轮传动的发热和散热。</li>
<li><strong>不涉及材料和热处理：</strong>不提供材料选择、热处理工艺等相关计算。</li>
<li><strong>标准模数表可能不完整：</strong>本工具内置的 GB/T 1357-2008 标准模数表为第一系列常用值，如需第二系列或更大范围的标准模数，需查标准原文确认。</li>
<li><strong>多级传动需手动串联：</strong>本工具每次仅计算一级传动。多级传动的总传动比需用户手动将各级传动比相乘。</li>
</ol>
<p>如需进行完整的齿轮传动设计，建议结合《机械设计手册》（成大先主编）或相关专业软件（如 KISSsoft、MASTA 等）进行综合设计。</p>
</div>
