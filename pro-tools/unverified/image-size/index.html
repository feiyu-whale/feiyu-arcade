<script>
/* ============================================================
 * 第一部分：JS 源码（纯函数实现，无外部依赖）
 * ============================================================ */
const SOURCE_CODE = `/**
 * 图片尺寸与分辨率互算工具
 * 纯函数实现，无外部依赖，可在浏览器直接运行
 *
 * 核心公式：
 *   物理尺寸(英寸) = 像素 / DPI
 *   物理尺寸(cm)   = 像素 / DPI × 2.54
 *   像素           = 物理尺寸(英寸) × DPI
 *   DPI            = 像素 / 物理尺寸(英寸)
 */

/**
 * 判断是否为有效数字（排除 NaN、Infinity、非数字类型）
 * @param {*} v - 待校验值
 * @returns {boolean}
 */
function isValidNumber(v) {
  return typeof v === 'number' && Number.isFinite(v);
}

/**
 * 像素 → 英寸
 * @param {number} pixels - 像素值，必须 >= 0
 * @param {number} dpi - 每英寸点数，必须 > 0
 * @returns {number} 英寸值
 * @throws {Error} 参数非法时抛出
 */
function pixelsToInches(pixels, dpi) {
  if (!isValidNumber(pixels) || pixels < 0) {
    throw new Error('pixels 必须为非负有限数字');
  }
  if (!isValidNumber(dpi) || dpi <= 0) {
    throw new Error('dpi 必须为正有限数字');
  }
  return pixels / dpi;
}

/**
 * 像素 → 厘米
 * @param {number} pixels - 像素值，必须 >= 0
 * @param {number} dpi - 每英寸点数，必须 > 0
 * @returns {number} 厘米值
 */
function pixelsToCm(pixels, dpi) {
  return pixelsToInches(pixels, dpi) * 2.54;
}

/**
 * 像素 → 毫米
 * @param {number} pixels - 像素值，必须 >= 0
 * @param {number} dpi - 每英寸点数，必须 > 0
 * @returns {number} 毫米值
 */
function pixelsToMm(pixels, dpi) {
  return pixelsToInches(pixels, dpi) * 25.4;
}

/**
 * 英寸 → 像素
 * @param {number} inches - 英寸值，必须 >= 0
 * @param {number} dpi - 每英寸点数，必须 > 0
 * @returns {number} 像素值（四舍五入到整数）
 */
function inchesToPixels(inches, dpi) {
  if (!isValidNumber(inches) || inches < 0) {
    throw new Error('inches 必须为非负有限数字');
  }
  if (!isValidNumber(dpi) || dpi <= 0) {
    throw new Error('dpi 必须为正有限数字');
  }
  return Math.round(inches * dpi);
}

/**
 * 厘米 → 像素
 * @param {number} cm - 厘米值，必须 >= 0
 * @param {number} dpi - 每英寸点数，必须 > 0
 * @returns {number} 像素值（四舍五入到整数）
 */
function cmToPixels(cm, dpi) {
  return inchesToPixels(cm / 2.54, dpi);
}

/**
 * 毫米 → 像素
 * @param {number} mm - 毫米值，必须 >= 0
 * @param {number} dpi - 每英寸点数，必须 > 0
 * @returns {number} 像素值（四舍五入到整数）
 */
function mmToPixels(mm, dpi) {
  return inchesToPixels(mm / 25.4, dpi);
}

/**
 * 根据像素与物理尺寸反算 DPI
 * @param {number} pixels - 像素值，必须 > 0
 * @param {number} inches - 物理尺寸（英寸），必须 > 0
 * @returns {number} DPI 值
 */
function calculateDpi(pixels, inches) {
  if (!isValidNumber(pixels) || pixels <= 0) {
    throw new Error('pixels 必须为正有限数字');
  }
  if (!isValidNumber(inches) || inches <= 0) {
    throw new Error('inches 必须为正有限数字');
  }
  return pixels / inches;
}

/**
 * 估算打印尺寸（返回带误差范围的结果）
 * 说明：实际打印尺寸受打印机、纸张、驱动缩放、色彩模式等影响，
 * 本函数仅给出理论值与合理误差区间。
 *
 * @param {number} widthPx - 宽度像素
 * @param {number} heightPx - 高度像素
 * @param {number} dpi - 目标 DPI（如 300）
 * @returns {{ widthCm: number, heightCm: number, tolerance: string, note: string }}
 */
function estimatePrintSize(widthPx, heightPx, dpi) {
  if (!isValidNumber(widthPx) || widthPx <= 0 ||
      !isValidNumber(heightPx) || heightPx <= 0 ||
      !isValidNumber(dpi) || dpi <= 0) {
    throw new Error('参数必须为正有限数字');
  }
  const wCm = pixelsToCm(widthPx, dpi);
  const hCm = pixelsToCm(heightPx, dpi);

  let note = '理论值';
  if (dpi < 150) note = '低分辨率，打印可能可见像素颗粒';
  else if (dpi < 200) note = '普通质量，适合远距离观看';
  else if (dpi < 300) note = '良好质量，适合一般印刷';
  else if (dpi < 600) note = '高质量，适合精细印刷';
  else note = '超高质量，普通印刷难以体现差异';

  return {
    widthCm: +wCm.toFixed(2),
    heightCm: +hCm.toFixed(2),
    tolerance: '±2%（受打印机、纸张、驱动影响）',
    note: note
  };
}

/**
 * 返回常见社交媒体推荐尺寸（参考值）
 * 注意：各平台官方文档会不定期调整，本表仅供参考，
 * 实际使用请以各平台最新官方文档为准。
 *
 * @returns {Array<{platform: string, type: string, width: number, height: number, ratio: string, note: string}>}
 */
function getSocialMediaSizes() {
  return [
    { platform: '微信公众号', type: '封面大图', width: 900, height: 383, ratio: '2.35:1', note: '头条封面' },
    { platform: '微信公众号', type: '次条封面', width: 200, height: 200, ratio: '1:1', note: '次条封面' },
    { platform: '微信朋友圈', type: '单图', width: 1080, height: 1080, ratio: '1:1', note: '推荐正方形' },
    { platform: '微信朋友圈', type: '竖图', width: 1080, height: 1440, ratio: '3:4', note: '信息流占位更大' },
    { platform: '微博', type: '配图', width: 1080, height: 1080, ratio: '1:1', note: '推荐尺寸' },
    { platform: '小红书', type: '竖图', width: 1080, height: 1440, ratio: '3:4', note: '信息流推荐' },
    { platform: '小红书', type: '方图', width: 1080, height: 1080, ratio: '1:1', note: '通用' },
    { platform: '抖音', type: '封面', width: 1080, height: 1920, ratio: '9:16', note: '竖屏全屏' },
    { platform: 'B 站', type: '视频封面', width: 1146, height: 717, ratio: '16:10', note: '投稿封面' },
    { platform: 'Instagram', type: 'Post', width: 1080, height: 1080, ratio: '1:1', note: '正方形' },
    { platform: 'Instagram', type: 'Story/Reels', width: 1080, height: 1920, ratio: '9:16', note: '竖屏全屏' },
    { platform: 'Facebook', type: 'Post', width: 1200, height: 630, ratio: '1.91:1', note: '链接分享' },
    { platform: 'X (Twitter)', type: 'Post', width: 1600, height: 900, ratio: '16:9', note: '推荐比例' },
    { platform: 'YouTube', type: '缩略图', width: 1280, height: 720, ratio: '16:9', note: '最小宽 640' },
    { platform: 'LinkedIn', type: 'Post', width: 1200, height: 627, ratio: '1.91:1', note: '分享图' }
  ];
}

/**
 * 根据给定像素与 DPI，查找最接近的社交媒体尺寸
 * @param {number} widthPx - 宽度像素
 * @param {number} heightPx - 高度像素
 * @returns {Array<{platform: string, type: string, width: number, height: number, ratio: string, note: string, match: string}>}
 */
function matchSocialMediaSize(widthPx, heightPx) {
  if (!isValidNumber(widthPx) || widthPx <= 0 ||
      !isValidNumber(heightPx) || heightPx <= 0) {
    throw new Error('宽高必须为正有限数字');
  }
  const ratio = widthPx / heightPx;
  const sizes = getSocialMediaSizes();
  return sizes
    .map(s => {
      const sr = s.width / s.height;
      const diff = Math.abs(ratio - sr) / sr;
      let match = '不匹配';
      if (diff < 0.02) match = '比例高度匹配';
      else if (diff < 0.08) match = '比例接近';
      return { ...s, match: match, diff: +(diff * 100).toFixed(1) };
    })
    .filter(s => s.match !== '不匹配')
    .sort((a, b) => a.diff - b.diff);
}

/**
 * 格式化带误差范围的结果
 * @param {number} value - 数值
 * @param {number} tolerancePercent - 误差百分比（如 2 表示 ±2%）
 * @param {number} [digits=2] - 小数位数
 * @returns {string} 形如 "10.00 cm（±2%：9.80 ~ 10.20）"
 */
function formatWithTolerance(value, tolerancePercent, digits) {
  if (digits === undefined) digits = 2;
  if (!isValidNumber(value) || !isValidNumber(tolerancePercent)) {
    throw new Error('参数必须为有限数字');
  }
  const d = Math.pow(10, digits);
  const v = Math.round(value * d) / d;
  const delta = Math.round(value * tolerancePercent / 100 * d) / d;
  return v.toFixed(digits) + '（±' + tolerancePercent + '%：' +
    (v - delta).toFixed(digits) + ' ~ ' + (v + delta).toFixed(digits) + '）';
}`;

/* ============================================================
 * 第二部分：单元测试（纯 JS，自带 assert，≥30 个）
 * ============================================================ */
function runTests() {
  const output = document.getElementById('test-output');
  const log = [];
  let passed = 0, failed = 0;
  const results = [];

  function assert(name, fn) {
    try {
      fn();
      passed++;
      results.push('✓ ' + name);
    } catch (e) {
      failed++;
      results.push('✗ ' + name + ' → ' + e.message);
    }
  }

  function assertClose(actual, expected, eps, msg) {
    if (Math.abs(actual - expected) > eps) {
      throw new Error((msg || '') + ' 期望 ' + expected + '，实际 ' + actual + '（eps=' + eps + '）');
    }
  }

  function assertThrows(fn, msg) {
    let threw = false;
    try { fn(); } catch (e) { threw = true; }
    if (!threw) throw new Error(msg || '期望抛出异常但未抛出');
  }

  function assertEqual(actual, expected, msg) {
    if (actual !== expected) {
      throw new Error((msg || '') + ' 期望 ' + expected + '，实际 ' + actual);
    }
  }

  // === pixelsToInches ===
  assert('T01 pixelsToInches 300px@300dpi=1in', () => {
    assertClose(pixelsToInches(300, 300), 1, 1e-9);
  });
  assert('T02 pixelsToInches 150px@300dpi=0.5in', () => {
    assertClose(pixelsToInches(150, 300), 0.5, 1e-9);
  });
  assert('T03 pixelsToInches 0px=0in', () => {
    assertEqual(pixelsToInches(0, 300), 0);
  });
  assert('T04 pixelsToInches 大数 100000px@300dpi', () => {
    assertClose(pixelsToInches(100000, 300), 333.333333, 1e-4);
  });
  assert('T05 pixelsToInches 负数抛错', () => {
    assertThrows(() => pixelsToInches(-1, 300));
  });
  assert('T06 pixelsToInches dpi=0 抛错', () => {
    assertThrows(() => pixelsToInches(100, 0));
  });
  assert('T07 pixelsToInches NaN 抛错', () => {
    assertThrows(() => pixelsToInches(NaN, 300));
  });
  assert('T08 pixelsToInches Infinity 抛错', () => {
    assertThrows(() => pixelsToInches(Infinity, 300));
  });
  assert('T09 pixelsToInches 字符串抛错', () => {
    assertThrows(() => pixelsToInches('100', 300));
  });
  assert('T10 pixelsToInches null 抛错', () => {
    assertThrows(() => pixelsToInches(null, 300));
  });

  // === pixelsToCm ===
  assert('T11 pixelsToCm 300px@300dpi=2.54cm', () => {
    assertClose(pixelsToCm(300, 300), 2.54, 1e-9);
  });
  assert('T12 pixelsToCm 0px=0cm', () => {
    assertEqual(pixelsToCm(0, 300), 0);
  });
  assert('T13 pixelsToCm 负数抛错', () => {
    assertThrows(() => pixelsToCm(-10, 300));
  });

  // === pixelsToMm ===
  assert('T14 pixelsToMm 300px@300dpi=25.4mm', () => {
    assertClose(pixelsToMm(300, 300), 25.4, 1e-9);
  });

  // === inchesToPixels ===
  assert('T15 inchesToPixels 1in@300dpi=300px', () => {
    assertEqual(inchesToPixels(1, 300), 300);
  });
  assert('T16 inchesToPixels 0.5in@300dpi=150px', () => {
    assertEqual(inchesToPixels(0.5, 300), 150);
  });
  assert('T17 inchesToPixels 四舍五入 0.505in@300dpi=152px', () => {
    assertEqual(inchesToPixels(0.505, 300), 152);
  });
  assert('T18 inchesToPixels 0in=0px', () => {
    assertEqual(inchesToPixels(0, 300), 0);
  });
  assert('T19 inchesToPixels 负数抛错', () => {
    assertThrows(() => inchesToPixels(-1, 300));
  });

  // === cmToPixels ===
  assert('T20 cmToPixels 2.54cm@300dpi=300px', () => {
    assertEqual(cmToPixels(2.54, 300), 300);
  });
  assert('T21 cmToPixels 10cm@300dpi≈1181px', () => {
    assertEqual(cmToPixels(10, 300), 1181);
  });

  // === mmToPixels ===
  assert('T22 mmToPixels 25.4mm@300dpi=300px', () => {
    assertEqual(mmToPixels(25.4, 300), 300);
  });

  // === calculateDpi ===
  assert('T23 calculateDpi 300px/1in=300dpi', () => {
    assertEqual(calculateDpi(300, 1), 300);
  });
  assert('T24 calculateDpi 600px/2in=300dpi', () => {
    assertEqual(calculateDpi(600, 2), 300);
  });
  assert('T25 calculateDpi pixels=0 抛错', () => {
    assertThrows(() => calculateDpi(0, 1));
  });
  assert('T26 calculateDpi inches=0 抛错', () => {
    assertThrows(() => calculateDpi(300, 0));
  });

  // === estimatePrintSize ===
  assert('T27 estimatePrintSize 3000x2400@300dpi', () => {
    const r = estimatePrintSize(3000, 2400, 300);
    assertClose(r.widthCm, 25.4, 0.01);
    assertClose(r.heightCm, 20.32, 0.01);
  });
  assert('T28 estimatePrintSize 低 dpi 提示', () => {
    const r = estimatePrintSize(1000, 1000, 100);
    if (!/低分辨率/.test(r.note)) throw new Error('note 应提示低分辨率');
  });
  assert('T29 estimatePrintSize 参数非法抛错', () => {
    assertThrows(() => estimatePrintSize(-1, 100, 300));
  });

  // === getSocialMediaSizes ===
  assert('T30 getSocialMediaSizes 返回数组且非空', () => {
    const s = getSocialMediaSizes();
    if (!Array.isArray(s) || s.length === 0) throw new Error('应为非空数组');
  });
  assert('T31 getSocialMediaSizes 每项字段完整', () => {
    const s = getSocialMediaSizes();
    s.forEach(item => {
      ['platform','type','width','height','ratio','note'].forEach(k => {
        if (!(k in item)) throw new Error('缺少字段 ' + k);
      });
    });
  });
  assert('T32 getSocialMediaSizes 宽高为正整数', () => {
    const s = getSocialMediaSizes();
    s.forEach(item => {
      if (!Number.isInteger(item.width) || item.width <= 0) throw new Error('width 非法');
      if (!Number.isInteger(item.height) || item.height <= 0) throw new Error('height 非法');
    });
  });

  // === matchSocialMediaSize ===
  assert('T33 matchSocialMediaSize 1080x1080 匹配 1:1', () => {
    const m = matchSocialMediaSize(1080, 1080);
    if (m.length === 0) throw new Error('应至少匹配一项');
    if (!m.some(x => x.ratio === '1:1')) throw new Error('应匹配 1:1');
  });
  assert('T34 matchSocialMediaSize 1080x1920 匹配 9:16', () => {
    const m = matchSocialMediaSize(1080, 1920);
    if (!m.some(x => x.ratio === '9:16')) throw new Error('应匹配 9:16');
  });
  assert('T35 matchSocialMediaSize 参数非法抛错', () => {
    assertThrows(() => matchSocialMediaSize(0, 100));
  });

  // === formatWithTolerance ===
  assert('T36 formatWithTolerance 10±2%', () => {
    const s = formatWithTolerance(10, 2);
    if (!/10.00/.test(s)) throw new Error('格式不符：' + s);
    if (!/9.80/.test(s) || !/10.20/.test(s)) throw new Error('区间不符：' + s);
  });
  assert('T37 formatWithTolerance 参数非法抛错', () => {
    assertThrows(() => formatWithTolerance(NaN, 2));
  });

  // === 互逆运算一致性 ===
  assert('T38 互逆：pixelsToInches → inchesToPixels', () => {
    const px = 1234, dpi = 300;
    const inch = pixelsToInches(px, dpi);
    const back = inchesToPixels(inch, dpi);
    if (Math.abs(back - px) > 1) throw new Error('互逆误差过大：' + back);
  });
  assert('T39 互逆：pixelsToCm → cmToPixels', () => {
    const px = 2000, dpi = 300;
    const cm = pixelsToCm(px, dpi);
    const back = cmToPixels(cm, dpi);
    if (Math.abs(back - px) > 1) throw new Error('互逆误差过大：' + back);
  });
  assert('T40 互逆：calculateDpi 反推', () => {
    const px = 1800, inch = 6;
    const dpi = calculateDpi(px, inch);
    assertEqual(dpi, 300);
  });

  // === 浮点精度 ===
  assert('T41 浮点：0.1+0.2 类场景不崩溃', () => {
    const r = pixelsToCm(300, 300);
    if (Math.abs(r - 2.54) > 1e-9) throw new Error('精度异常');
  });
  assert('T42 极小 dpi 0.001 不抛错', () => {
    const r = pixelsToInches(1, 0.001);
    assertEqual(r, 1000);
  });
  assert('T43 极大像素 1e9 不抛错', () => {
    const r = pixelsToInches(1e9, 300);
    assertClose(r, 3333333.33, 0.01);
  });

  // 输出
  const total = passed + failed;
  log.push('========== 单元测试结果 ==========');
  log.push('');
  results.forEach(r => log.push(r));
  log.push('');
  log.push('----------------------------------');
  log.push('通过 ' + passed + ' / 共 ' + total + (failed === 0 ? '  ✅ 全部通过' : '  ❌ 存在失败'));
  output.textContent = log.join('\\n');
}
