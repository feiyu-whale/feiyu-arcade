<script>
// ============================================================
// 第一部分：JS 源码 —— 链传动计算核心算法
// ============================================================

/**
 * 计算链传动的传动比。
 *
 * 公式：i = z2 / z1
 *
 * 传动比定义为从动链轮齿数与主动链轮齿数之比。
 * 当 i > 1 时为减速传动，i < 1 时为增速传动，i = 1 时为等速传动。
 *
 * @param {number} z1 - 主动链轮（小链轮）齿数，必须为正整数且 >= 1。
 * @param {number} z2 - 从动链轮（大链轮）齿数，必须为正整数且 >= 1。
 * @returns {number} 传动比 i（无量纲），保留完整浮点精度。
 * @throws {Error} 当 z1 或 z2 为 null、undefined、NaN、非数字类型时抛出。
 * @throws {Error} 当 z1 或 z2 小于 1 时抛出（齿数必须 >= 1）。
 * @throws {Error} 当 z1 或 z2 不是整数时抛出（齿数必须为整数）。
 * @example
 * calcTransmissionRatio(20, 40); // => 2
 * calcTransmissionRatio(17, 51); // => 3
 * calcTransmissionRatio(25, 25); // => 1
 */
function calcTransmissionRatio(z1, z2) {
    _validateSprocketTeeth(z1, 'z1');
    _validateSprocketTeeth(z2, 'z2');
    return z2 / z1;
}

/**
 * 计算链速（链条线速度）。
 *
 * 公式：v = z1 × p × n1 / 60000
 *
 * 其中 z1 为小链轮齿数，p 为链条节距（mm），n1 为小链轮转速（r/min）。
 * 结果单位为 m/s。
 *
 * 推导：小链轮每转一圈，链条走过 z1 × p mm；
 *       每分钟走过 z1 × p × n1 mm；
 *       换算为 m/s 需除以 60 × 1000 = 60000。
 *
 * @param {number} z1 - 小链轮齿数，必须为正整数且 >= 1。
 * @param {number} p  - 链条节距（mm），必须为正数。标准节距系列见 GB/T 1243。
 * @param {number} n1 - 小链轮转速（r/min），必须为非负数。n1=0 表示静止状态。
 * @returns {number} 链速 v，单位 m/s。
 * @throws {Error} 当参数为 null、undefined、NaN、非数字类型时抛出。
 * @throws {Error} 当 z1 < 1 时抛出。
 * @throws {Error} 当 p <= 0 时抛出。
 * @throws {Error} 当 n1 < 0 时抛出。
 * @throws {Error} 当 z1 不是整数时抛出。
 * @example
 * calcChainSpeed(20, 12.7, 1000); // => 4.2333...
 * calcChainSpeed(17, 15.875, 500); // => 2.2489...
 */
function calcChainSpeed(z1, p, n1) {
    _validateSprocketTeeth(z1, 'z1');
    _validatePositiveNumber(p, 'p（链条节距）');
    _validateNonNegativeNumber(n1, 'n1（小链轮转速）');
    return (z1 * p * n1) / 60000;
}

/**
 * 计算链节数（链条长度，以节距为单位）。
 *
 * 公式：X = 2a/p + (z1+z2)/2 + ((z2-z1)/(2π))² × p/a
 *
 * 这是 GB/T 1243 及机械设计手册中推荐的链节数近似计算公式。
 * 计算结果通常需圆整为偶数（优先取偶数节），以避免使用过渡链节。
 *
 * @param {number} z1 - 小链轮齿数，必须为正整数且 >= 1。
 * @param {number} z2 - 大链轮齿数，必须为正整数且 >= 1。
 * @param {number} p  - 链条节距（mm），必须为正数。
 * @param {number} a  - 初定中心距（mm），必须为正数。
 * @returns {number} 链节数 X（无量纲，以节距 p 为单位），保留完整浮点精度。
 * @throws {Error} 当参数为 null、undefined、NaN、非数字类型时抛出。
 * @throws {Error} 当 z1 或 z2 < 1 时抛出。
 * @throws {Error} 当 p <= 0 时抛出。
 * @throws {Error} 当 a <= 0 时抛出（a=0 会导致除零错误）。
 * @throws {Error} 当 z1 或 z2 不是整数时抛出。
 * @example
 * calcChainLength(20, 40, 12.7, 400); // => 约 93.31
 * calcChainLength(17, 17, 12.7, 300); // => 约 64.24
 */
function calcChainLength(z1, z2, p, a) {
    _validateSprocketTeeth(z1, 'z1');
    _validateSprocketTeeth(z2, 'z2');
    _validatePositiveNumber(p, 'p（链条节距）');
    _validatePositiveNumber(a, 'a（中心距）');

    var term1 = (2 * a) / p;
    var term2 = (z1 + z2) / 2;
    var diff = (z2 - z1) / (2 * Math.PI);
    var term3 = diff * diff * p / a;

    return term1 + term2 + term3;
}

/**
 * 将链节数圆整为推荐值（优先偶数）。
 *
 * 实际选用链条时，链节数应取为偶数，以避免使用过渡链节（弯板链节），
 * 因为过渡链节的强度较低。若计算值已接近偶数则直接取偶，否则向上取偶。
 *
 * @param {number} x - 计算所得链节数（浮点数）。
 * @returns {number} 圆整后的偶数链节数。
 * @throws {Error} 当 x 为 null、undefined、NaN、非数字时抛出。
 * @throws {Error} 当 x <= 0 时抛出。
 * @example
 * roundToEvenPitch(93.31); // => 94
 * roundToEvenPitch(64.24); // => 66
 * roundToEvenPitch(80.0);  // => 80
 */
function roundToEvenPitch(x) {
    _validatePositiveNumber(x, 'x（链节数）');
    var ceil = Math.ceil(x);
    if (ceil % 2 === 0) {
        return ceil;
    }
    return ceil + 1;
}

/**
 * 由链节数反算实际中心距。
 *
 * 当链节数 X 确定后（已圆整），可用以下近似公式反算实际安装中心距：
 * a = (p / 4) × [(X - (z1+z2)/2) + sqrt((X - (z1+z2)/2)² - 8 × ((z2-z1)/(2π))²)]
 *
 * @param {number} X  - 选定的链节数（整数，通常为偶数）。
 * @param {number} z1 - 小链轮齿数，正整数 >= 1。
 * @param {number} z2 - 大链轮齿数，正整数 >= 1。
 * @param {number} p  - 链条节距（mm），正数。
 * @returns {number} 实际中心距 a（mm）。
 * @throws {Error} 参数校验失败时抛出。
 * @throws {Error} 当根号内为负数时抛出（参数组合不合理）。
 * @example
 * calcActualCenterDistance(94, 20, 40, 12.7); // => 约 404.7 mm
 */
function calcActualCenterDistance(X, z1, z2, p) {
    _validatePositiveNumber(X, 'X（链节数）');
    _validateSprocketTeeth(z1, 'z1');
    _validateSprocketTeeth(z2, 'z2');
    _validatePositiveNumber(p, 'p（链条节距）');

    var M = (z1 + z2) / 2;
    var delta = X - M;
    var zDiff = (z2 - z1) / (2 * Math.PI);
    var discriminant = delta * delta - 8 * zDiff * zDiff;

    if (discriminant < 0) {
        throw new Error('参数组合不合理：根号内为负数（判别式 = ' + discriminant.toFixed(6) + '），请检查链节数与齿数是否匹配。');
    }

    var a = (p / 4) * (delta + Math.sqrt(discriminant));
    return a;
}

// ---- 内部校验辅助函数 ----

/**
 * 校验链轮齿数参数。
 * @param {*} value - 待校验值。
 * @param {string} name - 参数名称（用于错误信息）。
 * @throws {Error} 校验失败时抛出。
 * @private
 */
function _validateSprocketTeeth(value, name) {
    if (value === null || value === undefined) {
        throw new Error(name + ' 不能为 null 或 undefined');
    }
    if (typeof value !== 'number' || isNaN(value)) {
        throw new Error(name + ' 必须为有效数字，当前值：' + value);
    }
    if (!Number.isInteger(value)) {
        throw new Error(name + ' 必须为整数，当前值：' + value);
    }
    if (value < 1) {
        throw new Error(name + ' 必须 >= 1，当前值：' + value);
    }
}

/**
 * 校验正数参数（必须 > 0）。
 * @param {*} value - 待校验值。
 * @param {string} name - 参数名称。
 * @throws {Error} 校验失败时抛出。
 * @private
 */
function _validatePositiveNumber(value, name) {
    if (value === null || value === undefined) {
        throw new Error(name + ' 不能为 null 或 undefined');
    }
    if (typeof value !== 'number' || isNaN(value)) {
        throw new Error(name + ' 必须为有效数字，当前值：' + value);
    }
    if (value <= 0) {
        throw new Error(name + ' 必须为正数，当前值：' + value);
    }
}

/**
 * 校验非负数参数（必须 >= 0）。
 * @param {*} value - 待校验值。
 * @param {string} name - 参数名称。
 * @throws {Error} 校验失败时抛出。
 * @private
 */
function _validateNonNegativeNumber(value, name) {
    if (value === null || value === undefined) {
        throw new Error(name + ' 不能为 null 或 undefined');
    }
    if (typeof value !== 'number' || isNaN(value)) {
        throw new Error(name + ' 必须为有效数字，当前值：' + value);
    }
    if (value < 0) {
        throw new Error(name + ' 不能为负数，当前值：' + value);
    }
}

// ============================================================
// 第二部分：单元测试（纯 JS 实现，不依赖任何框架）
// ============================================================

var _testResults = [];

/**
 * 断言函数：判断实际值是否与预期值在容差范围内相等。
 * @param {string} description - 测试描述。
 * @param {number} actual - 实际值。
 * @param {number} expected - 预期值。
 * @param {number} [tolerance=1e-6] - 容差。
 */
function assertClose(description, actual, expected, tolerance) {
    tolerance = tolerance || 1e-6;
    var pass = Math.abs(actual - expected) < tolerance;
    _testResults.push({
        desc: description,
        pass: pass,
        actual: actual,
        expected: expected
    });
}

/**
 * 断言函数：判断函数调用是否抛出异常。
 * @param {string} description - 测试描述。
 * @param {Function} fn - 待测函数。
 */
function assertThrows(description, fn) {
    var threw = false;
    var errorMsg = '';
    try {
        fn();
    } catch (e) {
        threw = true;
        errorMsg = e.message;
    }
    _testResults.push({
        desc: description,
        pass: threw,
        actual: threw ? '抛出异常: ' + errorMsg : '未抛出异常',
        expected: '应抛出异常'
    });
}

/**
 * 运行全部测试用例。
 */
function runAllTests() {
    _testResults = [];

    // ======== calcTransmissionRatio 测试 ========

    // 1. 正常值：z1=20, z2=40
    assertClose('传动比: z1=20, z2=40 → i=2',
        calcTransmissionRatio(20, 40), 2);

    // 2. 正常值：z1=17, z2=51
    assertClose('传动比: z1=17, z2=51 → i=3',
        calcTransmissionRatio(17, 51), 3);

    // 3. 正常值：z1=25, z2=100
    assertClose('传动比: z1=25, z2=100 → i=4',
        calcTransmissionRatio(25, 100), 4);

    // 4. 边界值：等传动比 z1=z2=9
    assertClose('传动比: z1=9, z2=9 → i=1',
        calcTransmissionRatio(9, 9), 1);

    // 5. 边界值：最小齿数 z1=1, z2=1
    assertClose('传动比: z1=1, z2=1 → i=1',
        calcTransmissionRatio(1, 1), 1);

    // 6. 增速传动：z1=100, z2=1
    assertClose('传动比: z1=100, z2=1 → i=0.01',
        calcTransmissionRatio(100, 1), 0.01);

    // 7. 异常：z1=0
    assertThrows('传动比: z1=0 应抛出异常',
        function() { calcTransmissionRatio(0, 40); });

    // 8. 异常：z1=-5
    assertThrows('传动比: z1=-5 应抛出异常',
        function() { calcTransmissionRatio(-5, 40); });

    // 9. 异常：z1=null
    assertThrows('传动比: z1=null 应抛出异常',
        function() { calcTransmissionRatio(null, 40); });

    // 10. 异常：z2=0
    assertThrows('传动比: z2=0 应抛出异常',
        function() { calcTransmissionRatio(20, 0); });

    // 11. 异常：z1=undefined
    assertThrows('传动比: z1=undefined 应抛出异常',
        function() { calcTransmissionRatio(undefined, 40); });

    // 12. 异常：z2=NaN
    assertThrows('传动比: z2=NaN 应抛出异常',
        function() { calcTransmissionRatio(20, NaN); });

    // 13. 异常：z1 为字符串
    assertThrows('传动比: z1="20" 字符串应抛出异常',
        function() { calcTransmissionRatio("20", 40); });

    // 14. 异常：z1 非整数
    assertThrows('传动比: z1=20.5 非整数应抛出异常',
        function() { calcTransmissionRatio(20.5, 40); });

    // ======== calcChainSpeed 测试 ========

    // 15. 正常值：z1=20, p=12.7, n1=1000
    assertClose('链速: z1=20, p=12.7, n1=1000 → v≈4.2333',
        calcChainSpeed(20, 12.7, 1000), 20 * 12.7 * 1000 / 60000);

    // 16. 正常值：z1=17, p=15.875, n1=500
    assertClose('链速: z1=17, p=15.875, n1=500 → v≈2.2490',
        calcChainSpeed(17, 15.875, 500), 17 * 15.875 * 500 / 60000);

    // 17. 正常值：z1=25, p=25.4, n1=2000
    assertClose('链速: z1=25, p=25.4, n1=2000 → v≈21.1667',
        calcChainSpeed(25, 25.4, 2000), 25 * 25.4 * 2000 / 60000);

    // 18. 边界值：n1=0（静止）
    assertClose('链速: n1=0 → v=0',
        calcChainSpeed(20, 12.7, 0), 0);

    // 19. 异常：z1=0
    assertThrows('链速: z1=0 应抛出异常',
        function() { calcChainSpeed(0, 12.7, 1000); });

    // 20. 异常：p=0
    assertThrows('链速: p=0 应抛出异常',
        function() { calcChainSpeed(20, 0, 1000); });

    // 21. 异常：p 为负数
    assertThrows('链速: p=-1 应抛出异常',
        function() { calcChainSpeed(20, -1, 1000); });

    // 22. 异常：n1 为负数
    assertThrows('链速: n1=-100 应抛出异常',
        function() { calcChainSpeed(20, 12.7, -100); });

    // 23. 异常：p=null
    assertThrows('链速: p=null 应抛出异常',
        function() { calcChainSpeed(20, null, 1000); });

    // 24. 异常：n1=undefined
    assertThrows('链速: n1=undefined 应抛出异常',
        function() { calcChainSpeed(20, 12.7, undefined); });

    // 25. 异常：p 为空字符串
    assertThrows('链速: p="" 空字符串应抛出异常',
        function() { calcChainSpeed(20, "", 1000); });

    // ======== calcChainLength 测试 ========

    // 26. 正常值：z1=20, z2=40, p=12.7, a=400
    (function() {
        var expected = 2*400/12.7 + (20+40)/2 + Math.pow((40-20)/(2*Math.PI), 2) * 12.7/400;
        assertClose('链节数: z1=20,z2=40,p=12.7,a=400 → X≈93.314',
            calcChainLength(20, 40, 12.7, 400), expected);
    })();

    // 27. 正常值：等齿数 z1=z2=17
    (function() {
        var expected = 2*300/12.7 + (17+17)/2 + 0;
        assertClose('链节数: z1=17,z2=17,p=12.7,a=300 → X≈64.244',
            calcChainLength(17, 17, 12.7, 300), expected);
    })();

    // 28. 正常值：z1=25, z2=50, p=19.05, a=600
    (function() {
        var expected = 2*600/19.05 + (25+50)/2 + Math.pow((50-25)/(2*Math.PI), 2) * 19.05/600;
        assertClose('链节数: z1=25,z2=50,p=19.05,a=600 → X≈100.995',
            calcChainLength(25, 50, 19.05, 600), expected);
    })();

    // 29. 精度测试：z1=19, z2=57, p=12.7, a=500
    (function() {
        var expected = 2*500/12.7 + (19+57)/2 + Math.pow((57-19)/(2*Math.PI), 2) * 12.7/500;
        assertClose('链节数精度: z1=19,z2=57,p=12.7,a=500',
            calcChainLength(19, 57, 12.7, 500), expected, 1e-10);
    })();

    // 30. 异常：a=0（除零）
    assertThrows('链节数: a=0 应抛出异常',
        function() { calcChainLength(20, 40, 12.7, 0); });

        });

/**
 * 渲染测试结果到页面。
 */
function renderTestResults() {
    var total = _testResults.length;
    var passed = 0;
    var html = '<div class="test-detail">';
    for (var i = 0; i < _testResults.length; i++) {
        var r = _testResults[i];
        if (r.pass) {
            passed++;
            html += '<div class="pass-item">✓ [' + (i+1) + '] ' + r.desc + '</div>';
        } else {
            html += '<div class="fail-item">✗ [' + (i+1) + '] ' + r.desc +
                ' | 实际: ' + (typeof r.actual === 'number' ? r.actual.toFixed(8) : r.actual) +
                ' | 预期: ' + (typeof r.expected === 'number' ? r.expected.toFixed(8) : r.expected) + '</div>';
        }
    }
    html += '</div>';

    var cls = passed === total ? 'test-pass' : 'test-fail';
    var summary = '<div class="test-result ' + cls + '">通过 ' + passed + ' / 共 ' + total + '</div>';

    document.getElementById('test-output').innerHTML = summary + html;
}

'/**\n' +
' * 链传动计算核心算法\n' +
' * 依据：GB/T 1243《传动用短节距精密滚子链》\n' +
' * 版本：v2.0.0-完整版 20261021\n' +
' */\n\n' +
'// ---- 公开 API ----\n\n' +
'/**\n' +
' * 计算传动比 i = z2 / z1\n' +
' * @param {number} z1 - 小链轮齿数（正整数 >= 1）\n' +
' * @param {number} z2 - 大链轮齿数（正整数 >= 1）\n' +
' * @returns {number} 传动比 i\n' +
' * @throws {Error} 参数无效时抛出\n' +
' */\n' +
'function calcTransmissionRatio(z1, z2) {\n' +
'    _validateSprocketTeeth(z1, "z1");\n' +
'    _validateSprocketTeeth(z2, "z2");\n' +
'    return z2 / z1;\n' +
'}\n\n' +
'/**\n' +
' * 计算链速 v = z1 * p * n1 / 60000 (m/s)\n' +
' * @param {number} z1 - 小链轮齿数（正整数 >= 1）\n' +
' * @param {number} p  - 链条节距 mm（正数）\n' +
' * @param {number} n1 - 小链轮转速 r/min（非负数）\n' +
' * @returns {number} 链速 v (m/s)\n' +
' * @throws {Error} 参数无效时抛出\n' +
' */\n' +
'function calcChainSpeed(z1, p, n1) {\n' +
'    _validateSprocketTeeth(z1, "z1");\n' +
'    _validatePositiveNumber(p, "p（链条节距）");\n' +
'    _validateNonNegativeNumber(n1, "n1（小链轮转速）");\n' +
'    return (z1 * p * n1) / 60000;\n' +
'}\n\n' +
'/**\n' +
' * 计算链节数 X = 2a/p + (z1+z2)/2 + ((z2-z1)/(2π))² * p/a\n' +
' * @param {number} z1 - 小链轮齿数（正整数 >= 1）\n' +
' * @param {number} z2 - 大链轮齿数（正整数 >= 1）\n' +
' * @param {number} p  - 链条节距 mm（正数）\n' +
' * @param {number} a  - 中心距 mm（正数）\n' +
' * @returns {number} 链节数 X\n' +
' * @throws {Error} 参数无效时抛出\n' +
' */\n' +
'function calcChainLength(z1, z2, p, a) {\n' +
'    _validateSprocketTeeth(z1, "z1");\n' +
'    _validateSprocketTeeth(z2, "z2");\n' +
'    _validatePositiveNumber(p, "p（链条节距）");\n' +
'    _validatePositiveNumber(a, "a（中心距）");\n' +
'    var term1 = (2 * a) / p;\n' +
'    var term2 = (z1 + z2) / 2;\n' +
'    var diff = (z2 - z1) / (2 * Math.PI);\n' +
'    var term3 = diff * diff * p / a;\n' +
'    return term1 + term2 + term3;\n' +
'}\n\n' +
'/**\n' +
' * 将链节数圆整为推荐偶数值\n' +
' * @param {number} x - 计算所得链节数\n' +
' * @returns {number} 偶数链节数\n' +
' */\n' +
'function roundToEvenPitch(x) {\n' +
'    _validatePositiveNumber(x, "x（链节数）");\n' +
'    var ceil = Math.ceil(x);\n' +
'    return (ceil % 2 === 0) ? ceil : ceil + 1;\n' +
'}\n\n' +
'/**\n' +
' * 由链节数反算实际中心距\n' +
' * @param {number} X  - 链节数\n' +
' * @param {number} z1 - 小链轮齿数\n' +
' * @param {number} z2 - 大链轮齿数\n' +
' * @param {number} p  - 链条节距 mm\n' +
' * @returns {number} 实际中心距 a (mm)\n' +
' */\n' +
'function calcActualCenterDistance(X, z1, z2, p) {\n' +
'    _validatePositiveNumber(X, "X（链节数）");\n' +
'    _validateSprocketTeeth(z1, "z1");\n' +
'    _validateSprocketTeeth(z2, "z2");\n' +
'    _validatePositiveNumber(p, "p（链条节距）");\n' +
'    var M = (z1 + z2) / 2;\n' +
'    var delta = X - M;\n' +
'    var zDiff = (z2 - z1) / (2 * Math.PI);\n' +
'    var disc = delta * delta - 8 * zDiff * zDiff;\n' +
'    if (disc < 0) throw new Error("参数组合不合理：判别式 < 0");\n' +
'    return (p / 4) * (delta + Math.sqrt(disc));\n' +
'}\n\n' +
'// ---- 内部校验函数 ----\n\n' +
'function _validateSprocketTeeth(v, name) {\n' +
'    if (v === null || v === undefined)\n' +
'        throw new Error(name + " 不能为 null 或 undefined");\n' +
'    if (typeof v !== "number" || isNaN(v))\n' +
'        throw new Error(name + " 必须为有效数字");\n' +
'    if (!Number.isInteger(v))\n' +
'        throw new Error(name + " 必须为整数");\n' +
'    if (v < 1)\n' +
'        throw new Error(name + " 必须 >= 1");\n' +
'}\n\n' +
'function _validatePositiveNumber(v, name) {\n' +
'    if (v === null || v === undefined)\n' +
'        throw new Error(name + " 不能为 null 或 undefined");\n' +
'    if (typeof v !== "number" || isNaN(v))\n' +
'        throw new Error(name + " 必须为有效数字");\n' +
'    if (v <= 0)\n' +
'        throw new Error(name + " 必须为正数");\n' +
'}\n\n' +
'function _validateNonNegativeNumber(v, name) {\n' +
'    if (v === null || v === undefined)\n' +
'        throw new Error(name + " 不能为 null 或 undefined");\n' +
'    if (typeof v !== "number" || isNaN(v))\n' +
'        throw new Error(name + " 必须为有效数字");\n' +
'    if (v < 0)\n' +
'        throw new Error(name + " 不能为负数");\n' +
'}';

function switchTab(tabName) {

    var btns = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove('active');
        btns[i].classList.remove('active');
    }
    document.getElementById('tab-' + tabName).classList.add('active');
