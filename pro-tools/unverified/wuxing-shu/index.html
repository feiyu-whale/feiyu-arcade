/**
 * 所有用法类别列表
 * @type {string[]}
 */
const ALL_CATEGORIES = [
  "代词", "助词", "动词", "副词", "连词", "介词", "语气词", "兼词", "名词"
];

/**
 * 获取所有虚词列表
 * @returns {string[]} 所有虚词组成的数组
 * @example
 * getAllWords(); // ["之", "其", "而", "以", ...]
 */
function getAllWords() {
  return Object.keys(WORD_DATABASE);
}

/**
 * 获取指定虚词的完整信息
 * @param {string} word - 要查询的虚词（单个汉字）
 * @returns {Object|null} 虚词信息对象，包含 pinyin 和 usages 数组；若虚词不存在则返回 null
 * @throws {TypeError} 参数不是字符串类型时抛出
 * @example
 * getWordInfo("之");
 * // { pinyin: "zhī", usages: [{ id: "之-1", category: "代词", ... }, ...] }
 *
 * getWordInfo("X");
 * // null
 */
function getWordInfo(word) {
  if (typeof word !== "string") {
    throw new TypeError("参数必须是字符串类型");
  }
  return WORD_DATABASE[word] || null;
}

/**
 * 获取指定虚词的所有用法分类
 * @param {string} word - 要查询的虚词
 * @returns {string[]} 用法类别数组，如 ["代词", "助词", "动词"]；若虚词不存在返回空数组
 * @throws {TypeError} 参数不是字符串类型时抛出
 * @example
 * getCategories("之");
 * // ["代词", "助词", "助词", "动词", "助词"]
 *
 * getUniqueCategories("之");
 * // ["代词", "助词", "动词"]
 */
function getCategories(word) {
  if (typeof word !== "string") {
    throw new TypeError("参数必须是字符串类型");
  }
  const info = WORD_DATABASE[word];
  if (!info) return [];
  return info.usages.map(function(u) { return u.category; });
}

/**
 * 获取指定虚词的不重复用法分类
 * @param {string} word - 要查询的虚词
 * @returns {string[]} 不重复的用法类别数组
 * @throws {TypeError} 参数不是字符串类型时抛出
 * @example
 * getUniqueCategories("而");
 * // ["连词", "代词"]
 */
function getUniqueCategories(word) {
  if (typeof word !== "string") {
    throw new TypeError("参数必须是字符串类型");
  }
  const cats = getCategories(word);
  return cats.filter(function(c, i) { return cats.indexOf(c) === i; });
}

/**
 * 获取指定虚词在特定用法类别下的例句
 * @param {string} word - 虚词
 * @param {string} category - 用法类别，如 "代词"、"连词"
 * @returns {Object[]} 匹配的例句数组，每个例句包含 sentence、source、note
 * @throws {TypeError} 参数类型不正确时抛出
 * @example
 * getExamplesByCategory("之", "动词");
 * // [{ sentence: "吾欲之南海", source: "彭端淑《为学》", note: "..." }, ...]
 */
function getExamplesByCategory(word, category) {
  if (typeof word !== "string") {
    throw new TypeError("第一个参数必须是字符串类型");
  }
  if (typeof category !== "string") {
    throw new TypeError("第二个参数必须是字符串类型");
  }
  const info = WORD_DATABASE[word];
  if (!info) return [];
  var results = [];
  info.usages.forEach(function(usage) {
    if (usage.category === category) {
      usage.examples.forEach(function(ex) {
        results.push({
          sentence: ex.sentence,
          source: ex.source,
          note: ex.note,
          subcategory: usage.subcategory,
          meaning: usage.meaning
        });
      });
    }
  });
  return results;
}

/**
 * 按类别搜索所有虚词中属于该类别的条目
 * @param {string} category - 用法类别名称
 * @returns {Object[]} 匹配结果数组，每项包含 word、subcategory、meaning、examples
 * @throws {TypeError} 参数不是字符串类型时抛出
 * @example
 * searchByCategory("语气词");
 * // [{ word: "也", subcategory: "表判断", meaning: "...", examples: [...] }, ...]
 */
function searchByCategory(category) {
  if (typeof category !== "string") {
    throw new TypeError("参数必须是字符串类型");
  }
  var results = [];
  Object.keys(WORD_DATABASE).forEach(function(word) {
    WORD_DATABASE[word].usages.forEach(function(usage) {
      if (usage.category === category) {
        results.push({
          word: word,
          subcategory: usage.subcategory,
          meaning: usage.meaning,
          examples: usage.examples
        });
      }
    });
  });
  return results;
}

/**
 * 根据关键词搜索例句（在句子、出处、注释中搜索）
 * @param {string} keyword - 搜索关键词
 * @returns {Object[]} 匹配的例句数组，每项包含 word、sentence、source、note、category
 * @throws {TypeError} 参数不是字符串类型时抛出
 * @example
 * searchExamples("岳阳楼");
 * // [{ word: "也", sentence: "此则岳阳楼之大观也", ... }, ...]
 */
function searchExamples(keyword) {
  if (typeof keyword !== "string") {
    throw new TypeError("参数必须是字符串类型");
  }
  if (keyword === "") return [];
  var results = [];
  Object.keys(WORD_DATABASE).forEach(function(word) {
    WORD_DATABASE[word].usages.forEach(function(usage) {
      usage.examples.forEach(function(ex) {
        if (ex.sentence.indexOf(keyword) !== -1 ||
            ex.source.indexOf(keyword) !== -1 ||
            ex.note.indexOf(keyword) !== -1) {
          results.push({
            word: word,
            sentence: ex.sentence,
            source: ex.source,
            note: ex.note,
            category: usage.category,
            subcategory: usage.subcategory
          });
        }
      });
    });
  });
  return results;
}

/**
 * 判定虚词在给定句子中的用法
 * 通过匹配已知例句库来判定用法类别
 * @param {string} sentence - 包含虚词的句子
 * @param {string} targetWord - 要判定的虚词
 * @returns {Object|null} 匹配到的用法信息 { category, subcategory, meaning, matchedExample }，未匹配返回 null
 * @throws {TypeError} 参数类型不正确时抛出
 * @throws {Error} 虚词不在数据库中时抛出
 * @example
 * classifyUsage("学而时习之", "之");
 * // { category: "代词", subcategory: "第三人称代词", meaning: "他、它、他们（作宾语）", matchedExample: "学而时习之" }
 *
 * classifyUsage("吾欲之南海", "之");
 * // { category: "动词", subcategory: "动词", meaning: "到……去、往", matchedExample: "吾欲之南海" }
 */
function classifyUsage(sentence, targetWord) {
  if (typeof sentence !== "string") {
    throw new TypeError("第一个参数必须是字符串类型");
  }
  if (typeof targetWord !== "string") {
    throw new TypeError("第二个参数必须是字符串类型");
  }
  if (sentence === "") {
    throw new Error("句子不能为空字符串");
  }
  if (targetWord === "") {
    throw new Error("目标虚词不能为空字符串");
  }
  if (!WORD_DATABASE[targetWord]) {
    throw new Error("虚词「" + targetWord + "」不在数据库中，支持的虚词：" + getAllWords().join("、"));
  }

  var info = WORD_DATABASE[targetWord];
  var bestMatch = null;
  var bestScore = 0;

  info.usages.forEach(function(usage) {
    usage.examples.forEach(function(ex) {
      // 精确匹配
      if (sentence === ex.sentence) {
        bestMatch = {
          category: usage.category,
          subcategory: usage.subcategory,
          meaning: usage.meaning,
          matchedExample: ex.sentence,
          source: ex.source,
          note: ex.note,
          confidence: "exact"
        };
        bestScore = 100;
        return;
      }
      // 包含匹配
      if (sentence.indexOf(ex.sentence) !== -1 || ex.sentence.indexOf(sentence) !== -1) {
        var score = 50;
        // 计算重叠度
        var shorter = sentence.length < ex.sentence.length ? sentence : ex.sentence;
        var longer = sentence.length >= ex.sentence.length ? sentence : ex.sentence;
        var overlap = shorter.length / longer.length;
        score = Math.round(50 + overlap * 40);
        if (score > bestScore) {
          bestScore = score;
          bestMatch = {
            category: usage.category,
            subcategory: usage.subcategory,
            meaning: usage.meaning,
            matchedExample: ex.sentence,
            source: ex.source,
            note: ex.note,
            confidence: score >= 80 ? "high" : "medium"
          };
        }
      }
    });
  });

  return bestMatch;
}

/**
 * 统计数据库中虚词的总用法数和例句数
 * @returns {Object} 统计信息 { wordCount, usageCount, exampleCount }
 * @example
 * getStats();
 * // { wordCount: 20, usageCount: 82, exampleCount: 200+ }
 */
function getStats() {
  var wordCount = Object.keys(WORD_DATABASE).length;
  var usageCount = 0;
  var exampleCount = 0;
  Object.keys(WORD_DATABASE).forEach(function(word) {
    usageCount += WORD_DATABASE[word].usages.length;
    WORD_DATABASE[word].usages.forEach(function(usage) {
      exampleCount += usage.examples.length;
    });
  });
  return {
    wordCount: wordCount,
    usageCount: usageCount,
    exampleCount: exampleCount
  };
}

/**

 * @param {string} word - 虚词
 * @param {string} category - 用法类别
 * @returns {boolean} 是否具有该用法
 * @throws {TypeError} 参数类型不正确时抛出
 * @example
 * hasCategory("之", "动词"); // true
 * hasCategory("之", "连词"); // false
 */
function hasCategory(word, category) {
  if (typeof word !== "string") {
    throw new TypeError("第一个参数必须是字符串类型");
  }
  if (typeof category !== "string") {
    throw new TypeError("第二个参数必须是字符串类型");
  }
  var cats = getCategories(word);
  return cats.indexOf(category) !== -1;
}

/**
 * 获取虚词用法总数（按类别去重后）
 * @param {string} word - 虚词
 * @returns {number} 不重复的用法数量
 * @throws {TypeError} 参数不是字符串类型时抛出
 * @example
 * getUsageCount("之"); // 4 (代词、助词、动词，其中助词有多种子类但大类算一种)
 */
function getUsageCount(word) {
  if (typeof word !== "string") {
    throw new TypeError("参数必须是字符串类型");
  }
  return getUniqueCategories(word).length;
}

var _testResults = [];
var _testPass = 0;
var _testFail = 0;

/**
 * 断言函数 - 判断实际值是否等于期望值
 * @param {*} actual - 实际值
 * @param {*} expected - 期望值
 * @param {string} description - 测试描述
 */
function assertEqual(actual, expected, description) {
  var pass;
  if (Array.isArray(expected)) {
    pass = Array.isArray(actual) && actual.length === expected.length &&
      actual.every(function(v, i) { return v === expected[i]; });
  } else if (typeof expected === "object" && expected !== null) {
    pass = JSON.stringify(actual) === JSON.stringify(expected);
  } else {
    pass = actual === expected;
  }
  _testResults.push({
    pass: pass,
    description: description,
    actual: actual,
    expected: expected
  });
  if (pass) _testPass++;
  else _testFail++;
}

/**
 * 断言函数 - 判断值是否为真
 * @param {*} value - 要判断的值
 * @param {string} description - 测试描述
 */
function assertTrue(value, description) {
  var pass = value === true || value;
  _testResults.push({
    pass: !!pass,
    description: description,
    actual: value,
    expected: true
  });
  if (pass) _testPass++;
  else _testFail++;
}

/**
 * 断言函数 - 判断值是否为假
 * @param {*} value - 要判断的值
 * @param {string} description - 测试描述
 */
function assertFalse(value, description) {
  var pass = !value;
  _testResults.push({
    pass: pass,
    description: description,
    actual: value,
    expected: false
  });
  if (pass) _testPass++;
  else _testFail++;
}

/**
 * 断言函数 - 判断函数是否抛出异常
 * @param {Function} fn - 要执行的函数
 * @param {string} description - 测试描述
 */
function assertThrows(fn, description) {
  var threw = false;
  try {
    fn();
  } catch (e) {
    threw = true;
  }
  _testResults.push({
    pass: threw,
    description: description,
    actual: threw ? "threw" : "no throw",
    expected: "threw"
  });
  if (threw) _testPass++;
  else _testFail++;
}

/**
 * 断言函数 - 判断值是否为 null
 * @param {*} value - 要判断的值
 * @param {string} description - 测试描述
 */
function assertNull(value, description) {
  var pass = value === null;
  _testResults.push({
    pass: pass,
    description: description,
    actual: value,
    expected: null
  });
  if (pass) _testPass++;
  else _testFail++;
}

 * 运行所有测试用例
 */

  _testResults = [];
  _testPass = 0;
  _testFail = 0;

  // 测试18: 去重效果 - "之"有多个助词但只出现一次

  // ===== getExamplesByCategory 测试 =====
  // 测试19: 正常值 - "之"的动词用法例句

  var exYe = getExamplesByCategory("也", "语气词");
  assertTrue(exYe.length >= 3, "getExamplesByCategory('也','语气词') 至少3条例句");
  // 测试21: 边界值 - 不存在的类别
  assertEqual(getExamplesByCategory("之", "叹词").length, 0, "getExamplesByCategory('之','叹词') 返回空数组");
  // 测试22: 异常输入
  assertThrows(function() { getExamplesByCategory(null, "代词"); }, "getExamplesByCategory(null,'代词') 抛出 TypeError");
  assertThrows(function() { getExamplesByCategory("之", null); }, "getExamplesByCategory('之',null) 抛出 TypeError");

  // ===== searchByCategory 测试 =====
  // 测试23: 正常值 - 搜索"语气词"
  var searchYe = searchByCategory("语气词");
  assertTrue(searchYe.length >= 5, "searchByCategory('语气词') 至少5条结果");
  // 测试24: 正常值 - 搜索"兼词"

  assertTrue(searchJian.length >= 1, "searchByCategory('兼词') 至少1条结果");
  // 测试25: 边界值 - 不存在的类别
  assertEqual(searchByCategory("不存在的类别").length, 0, "searchByCategory('不存在的类别') 返回空数组");

  // ===== searchExamples 测试 =====
  // 测试26: 正常值 - 搜索"岳阳楼"
  var searchYue = searchExamples("岳阳楼");
  assertTrue(searchYue.length >= 1, "searchExamples('岳阳楼') 至少1条结果");
  // 测试27: 正常值 - 搜索"桃花源"
  var searchTao = searchExamples("桃花源");
  assertTrue(searchTao.length >= 1, "searchExamples('桃花源') 至少1条结果");
  // 测试28: 边界值 - 空字符串
  assertEqual(searchExamples("").length, 0, "searchExamples('') 返回空数组");
  // 测试29: 边界值 - 不存在的关键词

  // 测试30: 正常值 - 精确匹配

  // 测试32: 正常值 - 转折连词
  var cls3 = classifyUsage("学而不思则罔", "而");
  assertEqual(cls3.category, "连词", "classifyUsage('学而不思则罔','而') 判定为连词");

  assertThrows(function() { classifyUsage("学而时习之", ""); }, "classifyUsage('学而时习之','') 抛出 Error");
  // 测试35: 异常输入 - 不存在的虚词
  assertThrows(function() { classifyUsage("某句", "X"); }, "classifyUsage('某句','X') 抛出 Error");
  // 测试36: 异常输入 - null
  assertThrows(function() { classifyUsage(null, "之"); }, "classifyUsage(null,'之') 抛出 TypeError");

  // ===== getAllExamples 测试 =====
  // 测试37: 正常值
  var allEx = getAllExamples("耳");
  assertTrue(allEx.length >= 2, "getAllExamples('耳') 至少2条例句");
  // 测试38: 边界值 - 不存在的虚词
  assertEqual(getAllExamples("Z").length, 0, "getAllExamples('Z') 返回空数组");

  // ===== getStats 测试 =====
  // 测试39: 正常值
  var stats = getStats();
  assertEqual(stats.wordCount, 20, "getStats() wordCount 为 20");
  assertTrue(stats.usageCount >= 60, "getStats() usageCount 至少 60");
  assertTrue(stats.exampleCount >= 100, "getStats() exampleCount 至少 100");

  // ===== hasCategory 测试 =====
  // 测试40: 正常值 - true
  assertTrue(hasCategory("之", "动词"), "hasCategory('之','动词') 为 true");
  // 测试41: 正常值 - false
  assertFalse(hasCategory("之", "连词"), "hasCategory('之','连词') 为 false");
  // 测试42: 正常值
  assertTrue(hasCategory("而", "连词"), "hasCategory('而','连词') 为 true");
  // 测试43: 异常输入
  assertThrows(function() { hasCategory(null, "代词"); }, "hasCategory(null,'代词') 抛出 TypeError");

  // ===== getUsageCount 测试 =====
  // 测试44: 正常值

  assertTrue(uc >= 3, "getUsageCount('之') 至少3种用法");

  var search46 = searchExamples("论语");

  var cls47 = classifyUsage("公将鼓之", "之");
  assertEqual(cls47.category, "代词", "classifyUsage('公将鼓之','之') 判定为代词");
  // 测试48: 搜索"捕蛇者说"
  var search48 = searchExamples("捕蛇者说");
  assertTrue(search48.length >= 2, "searchExamples('捕蛇者说') 至少2条结果");
  // 测试49: getWordInfo 返回的 usages 结构完整
  var info49 = getWordInfo("以");
  assertTrue(info49.usages[0].examples.length >= 1, "getWordInfo('以') 第一个用法有例句");
  assertTrue(typeof info49.usages[0].meaning === "string", "getWordInfo('以') 第一个用法有 meaning");
  // 测试50: 所有虚词都有 pinyin
  var allHavePinyin = true;
  getAllWords().forEach(function(w) {
    if (!WORD_DATABASE[w].pinyin) allHavePinyin = false;
  });
  assertTrue(allHavePinyin, "所有虚词都有 pinyin 字段");

  // 输出结果
  var total = _testPass + _testFail;
  var html = "";
  _testResults.forEach(function(r, i) {
    var cls = r.pass ? "test-pass" : "test-fail";
    var icon = r.pass ? "✓" : "✗";
    html += '<div class="' + cls + '">' + icon + ' 测试' + (i + 1) + ': ' + r.description;
    if (!r.pass) {
      html += ' [期望: ' + JSON.stringify(r.expected) + ', 实际: ' + JSON.stringify(r.actual) + ']';
    }
    html += '</div>';
  });
  html += '<div class="test-summary">通过 ' + _testPass + ' / 共 ' + total + '（失败 ' + _testFail + '）</div>';
  document.getElementById("test-results").innerHTML = html;
}

'<tr><td>Error: 句子不能为空字符串</td><td>classifyUsage 的第一个参数为空字符串</td><td>确保传入的句子非空</td></tr>' +
'<tr><td>返回 null</td><td>getWordInfo 传入了不在数据库中的虚词</td><td>检查虚词是否正确，注意不要传入实词</td></tr>' +
'<tr><td>返回空数组</td><td>搜索条件没有匹配结果</td><td>检查关键词是否正确，或尝试更短的关键词</td></tr>' +
'<tr><td>classifyUsage 返回 null</td><td>输入的句子与数据库中任何例句都不匹配</td><td>本工具的判定基于例句匹配，如果句子是改写过的可能无法精确匹配。可尝试输入原文</td></tr>' +
'</table>' +

'<h3>五、数据来源与标准依据</h3>' +
'<p>本工具的虚词分类体系主要依据以下学术文献：</p>' +
'<p>1. <strong>王力《古代汉语》</strong>（中华书局，1962年初版，后续多次修订）。该书是中国高校古代汉语课程的经典教材，其虚词分类体系被广泛采用。本工具中虚词的义项划分、类别归属均以该书为准。</p>' +
'<p>2. <strong>中学语文课程标准</strong>：20个虚词的选取参考了《普通高中语文课程标准》（GB/T 32524-2016 相关教学要求）及人教版、部编版中学语文教材中要求掌握的18个常见文言虚词。</p>' +
'<p>3. <strong>例句出处</strong>：所有例句均标注了原始出处（书名、篇名），主要来自先秦两汉经典及唐宋名篇，均为语文教材常见篇目。</p>' +
'<p>4. 关于国标说明：文言虚词分类属于传统语文学领域，目前无专门的国家标准（GB）规范虚词分类。本工具遵循学术界通行的王力体系，如需查证具体义项划分，需查王力《古代汉语》原文。</p>' +

'<h3>六、局限性说明</h3>' +
'<p>1. <strong>收录范围有限</strong>：本工具仅收录20个最常见的文言虚词，未涵盖"所""者""诸""盍""叵""讵"等其他文言虚词。如需更全面的虚词查询，请参考王力《古代汉语》或《辞源》。</p>' +
'<p>2. <strong>用法判定基于匹配</strong>：classifyUsage 函数通过将输入句子与已知例句进行字符串匹配来判定用法，而非基于自然语言理解的智能分析。如果输入的句子与数据库中的例句不完全一致（如改写、缩写），可能无法正确判定或返回 null。</p>' +
'<p>3. <strong>义项划分从简</strong>：部分虚词的义项划分做了适当简化。例如"以"字在王力原著中义项更为细致，本工具合并了部分相近义项以方便教学使用。</p>' +
'<p>4. <strong>不含音韵信息</strong>：本工具仅提供基本拼音，不包含古音（上古音、中古音）信息。部分虚词（如"夫""为"）有不同读音对应不同用法，本工具仅在 pinyin 字段标注了常见读音。</p>' +
'<p>5. <strong>不含词义演变</strong>：本工具未展示各虚词的历史演变过程（如本义→引申义→假借义的脉络），仅列出共时平面的用法分类。</p>' +
'<p>6. <strong>例句覆盖有限</strong>：每个义项下仅收录2-3条例句，不足以展示该用法的全部语境变化。如需更多例句，请参考相关古籍原文。</p>' +
'<p>7. <strong>不支持连续文本分析</strong>：本工具不支持输入一段完整文言文自动标注所有虚词用法，仅支持单句查询。</p>' +
'</div>';

function switchTab(tabName) {
  document.querySelectorAll('.tab-content').forEach(function(el) {
    el.classList.remove('active');
  });
  document.querySelectorAll('.tab-btn').forEach(function(el) {
    el.classList.remove('active');
  });
  document.getElementById('tab-' + tabName).classList.add('active');
  event.target.classList.add('active');
}

function demoSearch() {
  var word = document.getElementById('search-word').value.trim();
  var container = document.getElementById('demo-results');
  if (!word) {
    container.innerHTML = '<p style="color:red;">请输入虚词</p>';
    return;
  }
  var info = getWordInfo(word);
  if (!info) {
    container.innerHTML = '<p style="color:red;">未找到虚词「' + word + '」，支持的虚词：' + getAllWords().join('、') + '</p>';
    return;
  }
  var html = '<div class="word-card"><h3>' + word + '（' + info.pinyin + '）</h3>';
  info.usages.forEach(function(usage, idx) {
    html += '<div class="usage-item">';
    html += '<span class="usage-label">用法' + (idx + 1) + '：[' + usage.category + '] ' + usage.subcategory + '</span><br>';
    html += '<strong>含义：</strong>' + usage.meaning + '<br>';
    html += '<strong>例句：</strong><br>';
    usage.examples.forEach(function(ex) {
      html += '<div class="example">· ' + ex.sentence + ' <span class="example-source">—— ' + ex.source + '</span></div>';
      html += '<div style="color:#888;font-size:13px;margin-left:1em;">' + ex.note + '</div>';
    });
    html += '</div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function demoShowAll() {
  var container = document.getElementById('demo-results');
  var html = '';
  getAllWords().forEach(function(word) {
    var info = WORD_DATABASE[word];
    var cats = getUniqueCategories(word).join('、');
    var exCount = getAllExamples(word).length;
    html += '<div class="word-card" style="display:inline-block;width:calc(50% - 12px);vertical-align:top;margin:6px;">';
    html += '<h3 style="font-size:18px;">' + word + '（' + info.pinyin + '）</h3>';
    html += '<div>用法类别：' + cats + '</div>';
    html += '<div>例句数量：' + exCount + ' 条</div>';
    html += '<div>用法数：' + info.usages.length + ' 种</div>';
    html += '</div>';
  });
  var stats = getStats();
  html += '<div style="margin-top:16px;padding:12px;background:#e8dcc8;border-radius:6px;">';
  html += '<strong>数据库统计：</strong>收录虚词 ' + stats.wordCount + ' 个，用法分类 ' + stats.usageCount + ' 条，例句 ' + stats.exampleCount + ' 条';
  html += '</div>';
  container.innerHTML = html;
}

function demoSearchCategory() {
  var cat = document.getElementById('search-category').value.trim();
  var container = document.getElementById('demo-results');
  if (!cat) {
    container.innerHTML = '<p style="color:red;">请输入用法类别</p>';
    return;
  }
  var results = searchByCategory(cat);
  if (results.length === 0) {
    container.innerHTML = '<p style="color:red;">未找到类别「' + cat + '」的用法。可用类别：' + ALL_CATEGORIES.join('、') + '</p>';
    return;
  }
  var html = '<p>找到 <strong>' + results.length + '</strong> 条「' + cat + '」类用法：</p>';
  results.forEach(function(r) {
    html += '<div class="usage-item">';
    html += '<span class="usage-label">【' + r.word + '】' + r.subcategory + '</span>：' + r.meaning + '<br>';
    html += '<div class="example">';
    r.examples.forEach(function(ex) {
      html += '· ' + ex.sentence + ' <span class="example-source">—— ' + ex.source + '</span><br>';
    });
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function demoClassify() {
  var sentence = document.getElementById('search-sentence').value.trim();
  var target = document.getElementById('search-target').value.trim();
  var container = document.getElementById('demo-results');
  if (!sentence || !target) {
    container.innerHTML = '<p style="color:red;">请输入句子和目标虚词</p>';
    return;
  }
  try {
    var result = classifyUsage(sentence, target);
    if (!result) {
      container.innerHTML = '<p style="color:orange;">未能匹配到已知用法。可能原因：句子与数据库例句不一致，请尝试输入原文。</p>';
      return;
    }
    var html = '<div class="word-card">';
    html += '<h3>判定结果</h3>';
    html += '<p><strong>句子：</strong>' + sentence + '</p>';
    html += '<p><strong>目标虚词：</strong>' + target + '</p>';
    html += '<p><strong>用法类别：</strong>' + result.category + ' → ' + result.subcategory + '</p>';
    html += '<p><strong>含义：</strong>' + result.meaning + '</p>';
    html += '<p><strong>匹配例句：</strong>' + result.matchedExample + '</p>';
    html += '<p><strong>出处：</strong>' + result.source + '</p>';
    html += '<p><strong>注释：</strong>' + result.note + '</p>';
    html += '<p><strong>匹配置信度：</strong>' + result.confidence + '</p>';
    html += '</div>';
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<p style="color:red;">错误：' + e.message + '</p>';
  }
}
