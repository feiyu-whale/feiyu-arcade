      summary: '可作动词、代词、连词、副词',
      uses: [
        {
          type: '动词',
          desc: '意为"像""如""比得上"。',
          examples: [
            { src: '《庄子·逍遥游》', cls: '其翼<em>若</em>垂天之云。', trans: '它的翅膀像挂在天边的云彩。' },
            { src: '《史记·陈涉世家》', cls: '曾不<em>若</em>孀妻弱子。', trans: '还比不上寡妇和小孩。' }
          ]
        },
        {
          type: '代词',
          desc: '第二人称代词，相当于"你""你的"。',
          examples: [
            { src: '《史记·陈涉世家》', cls: '为佣耕，何<em>若</em>富贵也？（按：例见《陈涉世家》）', trans: '——' },
            { src: '《左传》', cls: '更<em>若</em>役，复<em>若</em>赋，则何如？', trans: '更换你的差事，恢复你的赋税，那怎么样？' }

          desc: '相当于"如果""假如"。',
          examples: [
            { src: '《史记》', cls: '<em>若</em>舍郑以为东道主。', trans: '如果放弃攻打郑国而把它作为东方道路上（招待过客）的主人。' }
          ]
        },
        {
          type: '连词（表选择）',
          desc: '相当于"或""或者"。',

            { src: '《汉书》', cls: '以万人<em>若</em>十万人叛。', trans: '——' }

    '为': {
      pinyin: 'wéi / wèi',
      summary: '可作动词、介词、语气词，读音随义而变',
      uses: [
        {
          type: '动词（读 wéi）',
          desc: '意为"做""作为""担任""是"等。',
          examples: [
            { src: '《论语》', cls: '知不<em>为</em>不知，是知也。', trans: '——' },
            { src: '《孟子》', cls: '冰，水<em>为</em>之。', trans: '——' },
            { src: '《史记·陈涉世家》', cls: '吴广素爱人，士卒多<em>为</em>用者。', trans: '吴广一向爱护士兵，士兵大多愿意听他差遣。' }
          ]
        },
        {
          type: '介词（表被动，读 wéi）',
          desc: '相当于"被"，常与"所"配合。',
          examples: [
            { src: '《史记》', cls: '身死人手，<em>为</em>天下笑。', trans: '自己死在别人手里，被天下人耻笑。' },
            { src: '《庄子》', cls: '恐见欺<em>于</em>王而负赵（按：例见《史记》）', trans: '——' }
          ]
        },
        {

          desc: '相当于"替""给""对"。',
          examples: [
            { src: '《庄子·养生主》', cls: '庖丁<em>为</em>文惠君解牛。', trans: '庖丁替文惠君宰牛。' },
            { src: '《史记》', cls: '不足<em>为</em>外人道也。', trans: '不值得对外面的人说。' }

          ]
        },
        {

          desc: '用于句末，常与"何""奚"配合，表疑问或反问。',
          examples: [
            { src: '《史记》', cls: '如今人方为刀俎，我为鱼肉，何辞<em>为</em>？', trans: '现在人家正是刀和砧板，我们是鱼和肉，为什么要告辞呢？' }
          ]
        }
      ]
    },
    '因': {
      pinyin: 'yīn',
      summary: '可作介词、连词、动词、副词',
      uses: [
        {
          type: '介词（表凭借）',
          desc: '相当于"凭借""依靠""通过"。',
          examples: [
            { src: '《史记·廉颇蔺相如列传》', cls: '<em>因</em>宾客至蔺相如门谢罪。', trans: '通过宾客（引导）到蔺相如门前谢罪。' }
          ]
        },
        {
          type: '介词（表原因）',
          desc: '相当于"因为""由于"。',
          examples: [
            { src: '《史记》', cls: '<em>因</em>前以绝。', trans: '——' }
          ]
        },
        {
          type: '连词',
          desc: '相当于"于是""就"。',
          examples: [
            { src: '《史记·廉颇蔺相如列传》', cls: '相如<em>因</em>持璧立。', trans: '蔺相如于是拿着璧站起。' },
            { src: '《史记》', cls: '<em>因</em>屏人曰。', trans: '于是支开旁人说道。' }
          ]
        },
        {
          type: '动词',
          desc: '意为"沿袭""顺着""接续"。',
          examples: [
            { src: '贾谊《过秦论》', cls: '<em>因</em>遗策。', trans: '沿袭（前代君主）遗留下来的策略。' },
            { src: '《庄子》', cls: '批大郤，导大窾，<em>因</em>其固然。', trans: '——' }
          ]
        }
      ]
    },
    '且': {
      pinyin: 'qiě / jū',
      summary: '主要作连词、副词',
      uses: [
        {
          type: '连词（表并列/递进）',
          desc: '相当于"而且""并且""又……又……"。',
          examples: [
            { src: '《论语》', cls: '不义而富<em>且</em>贵，于我如浮云。', trans: '用不义的手段得到的富和贵，对于我来讲就像天上的浮云一样。' },
            { src: '《左传》', cls: '凡我父兄昆弟及国子姓，有能助寡人谋而退吴者，吾与之共知越国之政。', trans: '——' }
          ]
        },
        {
          type: '连词（表让步）',
          desc: '相当于"尚且""还"。',
          examples: [
            { src: '《列子·汤问》', cls: '曾不能毁山之一毛，其如土石何？（按：例见《愚公移山》）', trans: '——' },
            { src: '《史记》', cls: '臣死<em>且</em>不避，卮酒安足辞！', trans: '我连死尚且不躲避，一杯酒哪里值得推辞！' }
          ]
        },
        {
          type: '副词（表将然）',
          desc: '相当于"将要""将近"。',
          examples: [
            { src: '《列子·汤问》', cls: '北山愚公者，年<em>且</em>九十。', trans: '北山愚公，年纪将近九十岁。' }
          ]
        },
        {
          type: '副词（表姑且）',
          desc: '相当于"姑且""暂且"。',
          examples: [
            { src: '《史记》', cls: '<em>且</em>放白鹿青崖间。', trans: '——' }
          ]
        }
      ]
    },
    '然': {
      pinyin: 'rán',
      summary: '可作代词、连词、助词、形容词',
      uses: [
        {
          type: '代词',
          desc: '指示代词，相当于"这样""如此"。',
          examples: [
            { src: '《孟子·梁惠王上》', cls: '河内凶，则移其民于河东，移其粟于河内；河东凶亦<em>然</em>。', trans: '——' },
            { src: '《史记》', cls: '虽有槁暴，不复挺者，輮使之<em>然</em>也。', trans: '即使又晒干了，也不会再挺直，是因为用火烤使它变成这样的。' }
          ]
        },
        {
          type: '连词（表转折）',

            { src: '《孟子》', cls: '<em>然</em>则王之所大欲可知已。', trans: '那么大王最大的欲望就可以知道了。' }
          ]
        },
        {
          type: '助词（形容词/副词词尾）',
          desc: '相当于"……的样子""地"。',
          examples: [
            { src: '柳宗元《小石潭记》', cls: '满目萧<em>然</em>。', trans: '满眼萧条的样子。' },
            { src: '《史记·项羽本纪》', cls: '项王默<em>然</em>不应。', trans: '项王沉默着不回答。' }
          ]
        },
        {
          type: '应对之词',
          desc: '表示同意、肯定，相当于"是的""对的"。',
          examples: [
            { src: '《史记》', cls: '<em>然</em>，诚有百姓者。', trans: '是的，确实有这样的百姓。' }
          ]
        },
        {
          type: '形容词',
          desc: '意为"燃烧"，后作"燃"。',
          examples: [
            { src: '《孟子》', cls: '若火之始<em>然</em>，泉之始达。', trans: '像火刚刚开始燃烧，泉水刚刚开始涌出。' }
          ]
        }
      ]
    }
  };

  const wordList = ['之','其','而','以','于','乃','则','者','也','乎','焉','哉','矣','耳','夫','若','为','因','且','然'];

  const grid = document.getElementById('wordGrid');
  const panel = document.getElementById('resultPanel');
  const searchInput = document.getElementById('searchInput');

  let currentWord = null;

  function renderGrid(filter){
    grid.innerHTML = '';
    wordList.forEach(w => {
      if(filter && w.indexOf(filter) === -1) return;
      const btn = document.createElement('button');
      btn.className = 'word-btn';
      btn.textContent = w;
      btn.dataset.word = w;
      if(currentWord === w) btn.classList.add('active');
      btn.addEventListener('click', () => {
        currentWord = w;
        renderGrid(filter);
        renderResult(w);
      });
      grid.appendChild(btn);
    });
  }

  function renderResult(word){
    const data = WORDS[word];
    if(!data){
      panel.innerHTML = '<div class="placeholder"><span class="big">🤔</span>未收录该虚词</div>';
      return;
    }
    let html = '<div class="result-header">';
    html += '<div class="result-char">' + word + '</div>';
    html += '<div><div class="result-pinyin">拼音：' + data.pinyin + '</div>';
    html += '<div class="result-summary">' + data.summary + '</div></div>';
    html += '</div>';

    data.uses.forEach(use => {
      html += '<div class="use-section">';
      html += '<div class="use-title">📌 ' + use.type + '</div>';
      html += '<div class="use-desc">' + use.desc + '</div>';
      use.examples.forEach(ex => {
        html += '<div class="example">';
        if(ex.src && ex.src !== '—') html += '<div class="src">📖 ' + ex.src + '</div>';
        html += '<div class="cls">' + ex.cls + '</div>';
        if(ex.trans && ex.trans !== '—') html += '<div class="trans">➡️ ' + ex.trans + '</div>';
        html += '</div>';
      });
      html += '</div>';
    });

    panel.innerHTML = html;
    panel.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  }

  searchInput.addEventListener('input', function(){
    const v = this.value.trim();
    renderGrid(v);
    if(WORDS[v]){
      currentWord = v;
      renderGrid(v);
      renderResult(v);
    }
  });

  renderGrid();
})();
</script>

</html>
