<script>
/* ============================================================
 * 第一部分：JS 源码（空调制冷量计算与选型）
 * 依据：GB 50736《采暖通风与空气调节设计规范》冷负荷估算方法
 *       + 空调行业通行经验值（住宅 150-200 W/㎡）
 * 注意：本工具为估算值，精确选型需按 GB 50736 做逐时冷负荷计算
 * ============================================================ */

const AC_CALCULATOR_SOURCE = `
/**
 * 空调制冷量估算与选型核心模块
 *
 * 算法依据：
 *   1. GB 50736-2012《民用建筑供暖通风与空气调节设计规范》冷负荷估算思路
 *   2. 住宅空调行业通行经验值：基础冷指标 150~200 W/㎡
 *   3. 人员显热+潜热负荷：约 100 W/人（轻活动，夏季）
 *   4. 设备负荷：台式机 ~200W，厨房设备 ~500W（经验值）
 *
 * 重要声明：
 *   本工具输出为估算值，不能替代按 GB 50736 进行的逐时冷负荷计算。
 *   西晒、顶层、大面积玻璃幕墙、高人员密度等场景应适当加大选型。
 */

/**
 * 参数合法性校验辅助函数
 * @param {number} value - 待校验数值
 * @param {string} name - 参数名称（用于错误信息）
 * @param {number} min - 最小值（含）
 * @param {number} max - 最大值（含）
 * @returns {number} 校验通过的数值
 * @throws {TypeError} 非有限数字时抛出
 * @throws {RangeError} 超出范围时抛出
 */
function validateNumber(value, name, min, max) {
  if (value === null || value === undefined || value === '') {
    throw new TypeError(name + ' 不能为空');
  }
  const num = Number(value);
  if (!Number.isFinite(num)) {
    throw new TypeError(name + ' 必须是有限数字，收到: ' + value);
  }
  if (num < min || num > max) {
    throw new RangeError(name + ' 超出范围 [' + min + ', ' + max + ']，收到: ' + num);
  }
  return num;
}

/**
 * 校验枚举值是否在允许列表中
 * @param {*} value - 待校验值
 * @param {string} name - 参数名称
 * @param {Array} allowed - 允许值列表
 * @returns {*} 校验通过的值
 * @throws {TypeError} 值不在允许列表中
 */
function validateEnum(value, name, allowed) {
  if (value === null || value === undefined || value === '') {
    throw new TypeError(name + ' 不能为空');
  }
  if (allowed.indexOf(value) === -1) {
    throw new TypeError(name + ' 必须是 ' + JSON.stringify(allowed) + ' 之一，收到: ' + value);
  }
  return value;
}

/**
 * 计算朝向修正系数
 * 依据：行业经验值，西晒房间冷负荷明显偏高
 * @param {string} orientation - 朝向：'北' | '东' | '南' | '西'
 * @returns {number} 修正系数（0.95 ~ 1.15）
 * @throws {TypeError} 非法朝向
 * @example
 *   getOrientationFactor('西') // 1.15
 *   getOrientationFactor('北') // 0.95
 */
function getOrientationFactor(orientation) {
  validateEnum(orientation, '朝向', ['北', '东', '南', '西']);
  const map = { '北': 0.95, '东': 1.00, '南': 1.05, '西': 1.15 };
  return map[orientation];
}

/**
 * 计算楼层修正系数
 * 顶层受屋顶辐射热影响较大，底层受地面影响较小
 * @param {string} floorLevel - 楼层：'顶层' | '中间层' | '底层'
 * @returns {number} 修正系数（0.95 ~ 1.15）
 * @throws {TypeError} 非法楼层
 * @example
 *   getFloorFactor('顶层') // 1.15
 */
function getFloorFactor(floorLevel) {
  validateEnum(floorLevel, '楼层', ['顶层', '中间层', '底层']);
  const map = { '顶层': 1.15, '中间层': 1.00, '底层': 0.95 };
  return map[floorLevel];
}

/**
 * 计算保温情况修正系数
 * @param {string} insulation - 保温：'好' | '中' | '差'
 * @returns {number} 修正系数（0.90 ~ 1.15）
 * @throws {TypeError} 非法保温等级
 * @example
 *   getInsulationFactor('差') // 1.15
 */
function getInsulationFactor(insulation) {
  validateEnum(insulation, '保温情况', ['好', '中', '差']);
  const map = { '好': 0.90, '中': 1.00, '差': 1.15 };
  return map[insulation];
}

/**
 * 计算窗户大小修正系数
 * 窗墙比越大，冷负荷越高
 * @param {string} windowSize - 窗户大小：'小'（窗墙比<15%）| '中'（15%~30%）| '大'（>30%）
 * @returns {number} 修正系数（1.00 ~ 1.15）
 * @throws {TypeError} 非法窗户大小
 * @example
 *   getWindowFactor('大') // 1.15
 */
function getWindowFactor(windowSize) {
  validateEnum(windowSize, '窗户大小', ['小', '中', '大']);
  const map = { '小': 1.00, '中': 1.05, '大': 1.15 };
  return map[windowSize];
}

/**
 * 计算层高修正系数
 * 标准层高 2.8m，每增加 0.1m 约增加 3% 冷负荷
 * @param {number} height - 层高（m），范围 [2.0, 6.0]
 * @returns {number} 修正系数（≥ 0.70）
 * @throws {RangeError} 超出范围
 * @example
 *   getHeightFactor(3.2) // 1.12
 */
function getHeightFactor(height) {
  const h = validateNumber(height, '层高', 2.0, 6.0);
  // 基准 2.8m，每 0.1m 增减 3%
  const factor = 1 + (h - 2.8) * 0.3;
  return Math.max(0.70, factor);
}

/**
 * 计算人员附加冷负荷
 * 夏季室内人员显热+潜热约 100W/人（轻活动，行业经验值）
 * @param {number} people - 人数，范围 [0, 50]
 * @returns {number} 人员附加冷负荷（W）
 * @throws {RangeError} 超出范围
 * @example
 *   getPeopleLoad(4) // 400
 */
function getPeopleLoad(people) {
  const n = validateNumber(people, '人数', 0, 50);
  return n * 100;
}

/**
 * 计算设备附加冷负荷
 * @param {boolean} hasComputer - 是否有大功率电脑（台式机/游戏本等）
 * @param {boolean} hasKitchen - 是否为厨房或紧邻厨房
 * @returns {number} 设备附加冷负荷（W）
 * @example
 *   getEquipmentLoad(true, false) // 200
 *   getEquipmentLoad(true, true)  // 700
 */
function getEquipmentLoad(hasComputer, hasKitchen) {
  let load = 0;
  if (hasComputer) load += 200;
  if (hasKitchen) load += 500;
  return load;
}

/**
 * 根据所需制冷量（W）推荐匹数
 * 行业惯例：1 匹 ≈ 2500W 制冷量
 * 推荐向上取整到常见匹数档位
 * @param {number} coolingW - 所需制冷量（W）
 * @returns {{hp: number, hpLabel: string}} 匹数与标签
 * @throws {RangeError} 制冷量为负
 * @example
 *   recommendHorsepower(3200) // {hp: 1.5, hpLabel: '1.5匹'}
 */
function recommendHorsepower(coolingW) {
  if (!Number.isFinite(coolingW) || coolingW < 0) {
    throw new RangeError('制冷量必须为非负有限数字');
  }
  // 常见匹数档位（制冷量上限）
  const tiers = [
    { hp: 1,   max: 2500,  label: '1匹' },
    { hp: 1.5, max: 3500,  label: '1.5匹' },
    { hp: 2,   max: 5000,  label: '2匹' },
    { hp: 2.5, max: 6250,  label: '2.5匹' },
    { hp: 3,   max: 7500,  label: '3匹' },
    { hp: 5,   max: 12500, label: '5匹' },
    { hp: 10,  max: Infinity, label: '10匹及以上' }
  ];
  for (let i = 0; i < tiers.length; i++) {
    if (coolingW <= tiers[i].max) {
      return { hp: tiers[i].hp, hpLabel: tiers[i].label };
    }
  }
  return { hp: 10, hpLabel: '10匹及以上' };
}

/**
 * 根据匹数推荐机型（挂机/柜机/中央空调）
 * 行业惯例：
 *   ≤ 1.5匹：壁挂式
 *   2~3匹：柜机或大挂机
 *   > 3匹：柜机或中央空调
 * @param {number} hp - 匹数
 * @returns {string} 推荐机型
 * @example
 *   recommendMachineType(1.5) // '壁挂式'
 */
function recommendMachineType(hp) {
  if (hp <= 1.5) return '壁挂式';
  if (hp <= 3) return '柜机或大挂机';
  return '柜机或中央空调';
}

/**
 * 计算房间所需制冷量（核心函数）
 *
 * 公式：
 *   Q = 面积 × 基础冷指标 × 朝向系数 × 楼层系数 × 保温系数 × 窗户系数 × 层高系数
 *       + 人员负荷 + 设备负荷
 *
 * 基础冷指标默认 175 W/㎡（住宅 150~200 W/㎡ 的中间值）
 *
 * @param {Object} params - 输入参数
 * @param {number} params.area - 房间面积（㎡），范围 [1, 500]
 * @param {number} [params.height=2.8] - 层高（m），范围 [2.0, 6.0]
 * @param {string} params.orientation - 朝向：'北'|'东'|'南'|'西'
 * @param {string} params.floorLevel - 楼层：'顶层'|'中间层'|'底层'
 * @param {string} params.windowSize - 窗户大小：'小'|'中'|'大'
 * @param {string} params.insulation - 保温：'好'|'中'|'差'
 * @param {number} [params.people=0] - 人数，范围 [0, 50]
 * @param {boolean} [params.hasComputer=false] - 是否有大功率电脑
 * @param {boolean} [params.hasKitchen=false] - 是否为厨房
 * @param {number} [params.baseLoad=175] - 基础冷指标（W/㎡），范围 [100, 300]
 * @returns {{coolingW: number, hp: number, hpLabel: string, machineType: string, heatingW: number, detail: Object}}
 * @throws {TypeError|RangeError} 参数非法时抛出
 * @example
 *   calculateAC({
 *     area: 20, orientation: '南', floorLevel: '中间层',
 *     windowSize: '中', insulation: '中', people: 2
 *   })
 *   // => { coolingW: 4165, hp: 2, hpLabel: '2匹', machineType: '柜机或大挂机', ... }
 */
function calculateAC(params) {
  if (!params || typeof params !== 'object') {
    throw new TypeError('参数必须是对象');
  }

  const area = validateNumber(params.area, '面积', 1, 500);
  const height = params.height === undefined ? 2.8 : validateNumber(params.height, '层高', 2.0, 6.0);
  const orientation = validateEnum(params.orientation, '朝向', ['北', '东', '南', '西']);
  const floorLevel = validateEnum(params.floorLevel, '楼层', ['顶层', '中间层', '底层']);
  const windowSize = validateEnum(params.windowSize, '窗户大小', ['小', '中', '大']);
  const insulation = validateEnum(params.insulation, '保温情况', ['好', '中', '差']);
  const people = params.people === undefined ? 0 : validateNumber(params.people, '人数', 0, 50);
  const hasComputer = Boolean(params.hasComputer);
  const hasKitchen = Boolean(params.hasKitchen);
  const baseLoad = params.baseLoad === undefined ? 175 : validateNumber(params.baseLoad, '基础冷指标', 100, 300);

  const fOrient = getOrientationFactor(orientation);
  const fFloor = getFloorFactor(floorLevel);
  const fInsul = getInsulationFactor(insulation);
  const fWindow = getWindowFactor(windowSize);
  const fHeight = getHeightFactor(height);

  const baseTotal = area * baseLoad;
  const adjustedBase = baseTotal * fOrient * fFloor * fInsul * fWindow * fHeight;
  const peopleLoad = getPeopleLoad(people);
  const equipLoad = getEquipmentLoad(hasComputer, hasKitchen);

  const coolingW = Math.round(adjustedBase + peopleLoad + equipLoad);
  const { hp, hpLabel } = recommendHorsepower(coolingW);
  const machineType = recommendMachineType(hp);

  // 制热量参考：制冷量 × 1.15（取 1.1~1.2 中间值）
  const heatingW = Math.round(coolingW * 1.15);

  return {
    coolingW: coolingW,
    hp: hp,
    hpLabel: hpLabel,
    machineType: machineType,
    heatingW: heatingW,
    detail: {
      area: area,
      height: height,
      baseLoad: baseLoad,
      orientationFactor: fOrient,
      floorFactor: fFloor,
      insulationFactor: fInsul,
      windowFactor: fWindow,
      heightFactor: fHeight,
      peopleLoad: peopleLoad,
      equipmentLoad: equipLoad
    }
  };
}

/**
 * 将计算结果格式化为可读字符串
 * @param {Object} result - calculateAC 的返回值
 * @returns {string} 格式化字符串
 * @example
 *   formatResult(calculateAC({...}))
 */
function formatResult(result) {
  return [
    '所需制冷量：' + result.coolingW + ' W',
    '推荐匹数：' + result.hpLabel,
    '推荐机型：' + result.machineType,
    '参考制热量：' + result.heatingW + ' W（按制冷量×1.15 估算）',
    '',
    '【计算明细】',
    '  面积基础负荷：' + Math.round(result.detail.area * result.detail.baseLoad) + ' W',
    '  朝向系数：' + result.detail.orientationFactor,
    '  楼层系数：' + result.detail.floorFactor,
    '  保温系数：' + result.detail.insulationFactor,
    '  窗户系数：' + result.detail.windowFactor,
    '  层高系数：' + result.detail.heightFactor.toFixed(2),
    '  人员附加：' + result.detail.peopleLoad + ' W',
    '  设备附加：' + result.detail.equipmentLoad + ' W'
  ].join('\\n');
}
`;

// 把源码字符串里的函数真正注册到全局，供测试使用
eval(AC_CALCULATOR_SOURCE);

/* ============================================================
 * 第二部分：单元测试（纯 JS 实现，至少 30 个）
 * ============================================================ */

const UNIT_TEST_SOURCE = `
/**
 * 空调制冷量计算工具 - 单元测试
 * 纯 JS 实现，不依赖 Jest/Mocha
 * 覆盖：正常值、边界值、异常输入、精度问题
 */

let passCount = 0;
let failCount = 0;
const failDetails = [];

/**
 * 简易断言函数
 * @param {boolean} condition - 断言条件
 * @param {string} name - 测试用例名称
 */
function assert(condition, name) {
  if (condition) {
    passCount++;
    console.log('  ✓ ' + name);
  } else {
    failCount++;
    failDetails.push(name);
    console.log('  ✗ ' + name);
  }
}

/**
 * 断言抛出指定类型异常
 * @param {Function} fn - 待测函数
 * @param {Function} ErrorType - 期望的异常类型
 * @param {string} name - 测试名称
 */
function assertThrows(fn, ErrorType, name) {
  try {
    fn();
    failCount++;
    failDetails.push(name + ' (未抛出异常)');
    console.log('  ✗ ' + name + ' (未抛出异常)');
  } catch (e) {
    if (e instanceof ErrorType) {
      passCount++;
      console.log('  ✓ ' + name);

    <td>按日常使用情况填写；保温等级如实评估</td>
  </tr>
  <tr>
    <td>报错"参数超出范围"</td>
    <td>面积、层高、人数超出工具允许范围</td>
    <td>检查输入数值；超大空间建议分区域计算或联系专业工程师</td>
  </tr>
  <tr>
    <td>报错"参数不能为空"</td>
    <td>必填项未填写</td>
    <td>检查朝向、楼层、窗户、保温是否都已选择</td>
  </tr>
  <tr>
    <td>计算结果与空调商家推荐不符</td>
    <td>商家可能按"宁大勿小"原则推荐，或本工具按标准估算</td>
    <td>本工具为估算下限参考，商家推荐偏大属正常；以本工具结果 + 一档为稳妥选择</td>
  </tr>
</table>

<h2>五、数据来源与标准依据</h2>

<ol>
  <li><strong>GB 50736-2012《民用建筑供暖通风与空气调节设计规范》</strong>：冷负荷计算方法的权威依据。本工具采用其估算思路，但未做逐时计算。</li>
  <li><strong>住宅基础冷指标 150~200 W/㎡</strong>：空调行业长期积累的经验值，默认取中间值 175 W/㎡。该数值在多个暖通设计手册中均有引用，但<strong>并非国标强制规定</strong>。</li>
  <li><strong>人员负荷 100W/人</strong>：夏季室内轻活动状态下，成人显热+潜热的行业经验值。精确数值需查 GB 50736 表 4.2 或相关手册。</li>
  <li><strong>设备负荷（电脑 200W、厨房 500W）</strong>：行业经验值，非国标强制数据。</li>
  <li><strong>1 匹 ≈ 2500W 制冷量</strong>：行业惯例，源于早期空调能效标定。</li>
  <li><strong>制热量 = 制冷量 × 1.1~1.2</strong>：热泵空调在冬季制热时，因室外温度低、结霜除霜等，能力衰减，需按此比例放大配置。本工具取中间值 1.15。</li>
</ol>

<div class="info">
  <strong>说明：</strong>本工具中的朝向、楼层、保温、窗户等修正系数为行业经验值，<strong>并非 GB 50736 的强制规定</strong>。GB 50736 要求精确计算时应采用逐时冷负荷法，考虑围护结构传热、太阳辐射、人员设备灯光等全部因素。
</div>

<h2>六、局限性说明</h2>

<ol>
  <li><strong>估算性质：</strong>本工具为快速估算，不能替代按 GB 50736 进行的逐时冷负荷计算。对于大型住宅、别墅、商业场所、机房等，必须做专业计算。</li>
  <li><strong>未考虑因素：</strong>
    <ul>
      <li>相邻房间传热（如隔壁无空调）</li>
      <li>新风负荷（开窗通风、新风系统）</li>
      <li>灯光负荷</li>
      <li>具体围护结构传热系数（K 值）</li>
      <li>当地夏季室外设计参数（不同城市差异大）</li>
      <li>玻璃类型（单层/双层/Low-E/中空）</li>
      <li>遮阳措施（窗帘、外遮阳）</li>
    </ul>
  </li>
  <li><strong>修正系数为经验值：</strong>朝向、楼层、保温、窗户的修正系数为行业经验，不同地区、不同建筑年代可能有差异。</li>
  <li><strong>人员密度假设：</strong>按轻活动（静坐、办公）估算，剧烈活动（健身、聚会）需另行增加。</li>
  <li><strong>气候差异：</strong>本工具未区分城市。华南（广州、海口）与华东（上海、南京）、华北（北京、沈阳）的室外设计温度差异显著，极端高温地区建议在结果基础上再上浮 10%~15%。</li>
  <li><strong>空调实际能力：</strong>标称匹数对应的制冷量因品牌、能效等级、变频/定频而异，选购时应以铭牌标称制冷量为准。</li>
  <li><strong>制热场景：</strong>本工具以制冷为主，制热仅按 1.15 倍粗略估算。北方集中供暖地区无需参考；长江流域冬季湿冷，热泵空调制热能力衰减严重，建议按制冷量 × 1.2 甚至更高配置，或考虑辅助电加热。</li>
</ol>

<h2>七、API 参考</h2>

<h3>7.1 calculateAC(params)</h3>
<p>核心计算函数，返回完整计算结果。</p>
<p><strong>参数：</strong></p>
<table>
  <tr><th>字段</th><th>类型</th><th>必填</th><th>默认值</th><th>说明</th></tr>
  <tr><td>area</td><td>number</td><td>是</td><td>-</td><td>面积（㎡），1~500</td></tr>
  <tr><td>height</td><td>number</td><td>否</td><td>2.8</td><td>层高（m），2.0~6.0</td></tr>
  <tr><td>orientation</td><td>string</td><td>是</td><td>-</td><td>朝向：北/东/南/西</td></tr>
  <tr><td>floorLevel</td><td>string</td><td>是</td><td>-</td><td>楼层：顶层/中间层/底层</td></tr>
  <tr><td>windowSize</td><td>string</td><td>是</td><td>-</td><td>窗户：小/中/大</td></tr>
  <tr><td>insulation</td><td>string</td><td>是</td><td>-</td><td>保温：好/中/差</td></tr>
  <tr><td>people</td><td>number</td><td>否</td><td>0</td><td>人数，0~50</td></tr>
  <tr><td>hasComputer</td><td>boolean</td><td>否</td><td>false</td><td>是否有大功率电脑</td></tr>
  <tr><td>hasKitchen</td><td>boolean</td><td>否</td><td>false</td><td>是否为厨房</td></tr>
  <tr><td>baseLoad</td><td>number</td><td>否</td><td>175</td><td>基础冷指标（W/㎡），100~300</td></tr>
</table>

<p><strong>返回值：</strong></p>
<table>
  <tr><th>字段</th><th>类型</th><th>说明</th></tr>
  <tr><td>coolingW</td><td>number</td><td>所需制冷量（W）</td></tr>
  <tr><td>hp</td><td>number</td><td>推荐匹数</td></tr>
  <tr><td>hpLabel</td><td>string</td><td>匹数标签（如"1.5匹"）</td></tr>
  <tr><td>machineType</td><td>string</td><td>推荐机型</td></tr>
  <tr><td>heatingW</td><td>number</td><td>参考制热量（W）</td></tr>
  <tr><td>detail</td><td>Object</td><td>计算明细（各项系数与负荷）</td></tr>
</table>

<h3>7.2 辅助函数</h3>
<ul>
  <li><code>getOrientationFactor(orientation)</code>：返回朝向修正系数</li>
  <li><code>getFloorFactor(floorLevel)</code>：返回楼层修正系数</li>
  <li><code>getInsulationFactor(insulation)</code>：返回保温修正系数</li>
  <li><code>getWindowFactor(windowSize)</code>：返回窗户修正系数</li>
  <li><code>getHeightFactor(height)</code>：返回层高修正系数</li>
  <li><code>getPeopleLoad(people)</code>：返回人员附加冷负荷（W）</li>
  <li><code>getEquipmentLoad(hasComputer, hasKitchen)</code>：返回设备附加冷负荷（W）</li>
  <li><code>recommendHorsepower(coolingW)</code>：根据制冷量推荐匹数</li>
  <li><code>recommendMachineType(hp)</code>：根据匹数推荐机型</li>
  <li><code>formatResult(result)</code>：将结果格式化为可读字符串</li>
</ul>
