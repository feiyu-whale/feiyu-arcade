<div class="container">
  <h1>作物播种时间与株距计算器</h1>
  <p class="subtitle">常见农作物播种期、行株距与用种量参考工具</p>

  <div class="warning">
    <strong>重要提示：</strong>本工具给出的播种期、行株距、用种量等数据为<strong>全国通行参考范围</strong>，
    基于《中国农业百科全书》与农业农村部主推技术的公开数据整理。<strong>具体播种时间、密度、用种量请以当地农业农村部门或农技推广机构的指导为准</strong>，
    不同地区、年份、品种、土壤条件差异较大，本工具不作精确到县一级的播期推荐，也不替代田间试验与本地化示范。
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="tool">🌾 工具</button>
    <button class="tab-btn" data-tab="test">🧪 测试</button>
    <button class="tab-btn" data-tab="doc">📖 说明书</button>
  </div>

  <div id="tool" class="tab-content active">
    <div class="card">
      <div class="form-row">
        <div class="form-group">
          <label for="crop">选择作物</label>
          <select id="crop"></select>
        </div>
        <div class="form-group">
          <label for="area">播种面积（亩）</label>
          <input type="number" id="area" min="0" step="0.01" placeholder="例如：10">
          <span class="hint">1 公顷 = 15 亩</span>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="rowSpacing">行距（cm）</label>
          <input type="number" id="rowSpacing" min="0" step="0.1" placeholder="自动填充推荐值">
        </div>
        <div class="form-group">
          <label for="plantSpacing">株距（cm）</label>
          <input type="number" id="plantSpacing" min="0" step="0.01" placeholder="自动填充推荐值">
          <span class="hint" id="plantSpacingHint"></span>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="emergenceRate">预计出苗率（0-1，可留空）</label>
          <input type="number" id="emergenceRate" min="0.01" max="1" step="0.01" placeholder="默认使用作物推荐值">
          <span class="hint">种子发芽率 × 田间成苗率，一般 0.7-0.9</span>
        </div>
        <div class="form-group">
          <label>&nbsp;</label>
          <div class="btn-row">
            <button class="btn" id="calcBtn">计算用种量</button>
            <button class="btn btn-secondary" id="resetBtn">重置</button>
          </div>
        </div>
      </div>
    </div>
    <div id="cropInfo" class="crop-info" style="display:none;"></div>
    <div id="result" class="result" style="display:none;"></div>
  </div>

  <div id="test" class="tab-content">
    <div class="test-summary" id="testSummary"></div>
    <div class="test-list" id="testList"></div>
  </div>

  <div id="doc" class="tab-content">
    <div class="doc-content" id="docContent"></div>
  </div>
</div>

<div class="version">v2.0.0-完整版 20261021</div>

  }
};

/**
 * 1 亩对应的平方厘米数
 * 1 亩 = 666.67 m² = 6666700 cm²
 * @constant {number}
 */
const MU_TO_CM2 = 6666700;

/**
 * 根据行距和株距计算每亩理论株（穴）数
 *
 * 公式：每亩株数 = 6666700 / (行距cm × 株距cm)
 *
 * @param {number} rowSpacingCm - 行距，单位厘米，必须大于 0
 * @param {number} plantSpacingCm - 株距，单位厘米，必须大于 0
 * @returns {number} 每亩理论株数（保留 2 位小数）
 * @throws {TypeError} 参数非数字或为 NaN 时抛出
 * @throws {Error} 参数非正数或非有限数时抛出
 * @example
 * calcPlantsPerMu(60, 30);   // 3703.7  - 玉米 60cm×30cm
 * calcPlantsPerMu(20, 0.25); // 1333340 - 小麦条播等效
 */
function calcPlantsPerMu(rowSpacingCm, plantSpacingCm) {
  if (typeof rowSpacingCm !== 'number' || typeof plantSpacingCm !== 'number') {
    throw new TypeError('行距和株距必须为数字');
  }
  if (Number.isNaN(rowSpacingCm) || Number.isNaN(plantSpacingCm)) {
    throw new TypeError('行距和株距不能为 NaN');
  }
  if (!Number.isFinite(rowSpacingCm) || !Number.isFinite(plantSpacingCm)) {
    throw new Error('行距和株距必须为有限数');
  }
  if (rowSpacingCm <= 0 || plantSpacingCm <= 0) {
    throw new Error('行距和株距必须大于 0');
  }
  return Number((MU_TO_CM2 / (rowSpacingCm * plantSpacingCm)).toFixed(2));
}

/**
 * 根据目标株数、千粒重和出苗率计算每亩种子重量
 *
 * 公式：每亩种子重量(g) = (目标株数 / 出苗率) × 千粒重(g) / 1000
 *
 * @param {number} targetPlantsPerMu - 目标株数/亩，必须大于 0
 * @param {number} thousandGrainWeightG - 千粒重，单位克，必须大于 0
 * @param {number} emergenceRate - 出苗率，取值范围 (0, 1]
 * @returns {number} 每亩种子重量，单位克（保留 2 位小数）
 * @throws {TypeError} 参数非数字或为 NaN 时抛出
 * @throws {Error} 参数超出范围时抛出
 * @example
 * calcSeedWeightPerMu(4000, 320, 0.9); // 1422.22 g
 */
function calcSeedWeightPerMu(targetPlantsPerMu, thousandGrainWeightG, emergenceRate) {
  if (typeof targetPlantsPerMu !== 'number' ||
      typeof thousandGrainWeightG !== 'number' ||
      typeof emergenceRate !== 'number') {
    throw new TypeError('所有参数必须为数字');
  }
  if (Number.isNaN(targetPlantsPerMu) ||
      Number.isNaN(thousandGrainWeightG) ||
      Number.isNaN(emergenceRate)) {
    throw new TypeError('参数不能为 NaN');
  }
  if (targetPlantsPerMu <= 0) {
    throw new Error('目标株数必须大于 0');
  }
  if (thousandGrainWeightG <= 0) {
    throw new Error('千粒重必须大于 0');
  }
  if (emergenceRate <= 0 || emergenceRate > 1) {
    throw new Error('出苗率必须在 (0, 1] 范围内');
  }
  const seedsNeeded = targetPlantsPerMu / emergenceRate;
  const weightG = seedsNeeded * thousandGrainWeightG / 1000;
  return Number(weightG.toFixed(2));
}

/**
 * 根据面积和每亩用种量计算总用种量
 *
 * @param {number} areaMu - 面积，单位亩，必须 ≥ 0
 * @param {number} seedWeightPerMu - 每亩用种量，单位与返回值一致
 * @returns {number} 总用种量（保留 2 位小数）
 * @throws {TypeError} 参数非数字或为 NaN 时抛出
 * @throws {Error} 参数为负数时抛出
 * @example
 * calcTotalSeed(10, 1500); // 15000
 */
function calcTotalSeed(areaMu, seedWeightPerMu) {
  if (typeof areaMu !== 'number' || typeof seedWeightPerMu !== 'number') {
    throw new TypeError('参数必须为数字');
  }
  if (Number.isNaN(areaMu) || Number.isNaN(seedWeightPerMu)) {
    throw new TypeError('参数不能为 NaN');
  }
  if (areaMu < 0) {
    throw new Error('面积不能为负数');
  }
  if (seedWeightPerMu < 0) {
    throw new Error('每亩用种量不能为负数');
  }
  return Number((areaMu * seedWeightPerMu).toFixed(2));
}

/**
 * 获取作物数据
 *
 * @param {string} cropKey - 作物键名，必须为 CROPS 中存在的键
 * @returns {Object} 作物数据对象
 * @throws {TypeError} 参数非字符串时抛出
 * @throws {Error} 作物不存在时抛出
 * @example
 * getCropData('winter_wheat'); // { name: '冬小麦', ... }
 */
function getCropData(cropKey) {
  if (typeof cropKey !== 'string') {
    throw new TypeError('作物键名必须为字符串');
  }
  if (!cropKey || !Object.prototype.hasOwnProperty.call(CROPS, cropKey)) {
    throw new Error('未找到作物数据：' + String(cropKey));
  }
  return CROPS[cropKey];
}

/**
 * 验证输入参数
 *
 * @param {Object} input - 输入对象
 * @param {string} input.cropKey - 作物键名
 * @param {number} input.areaMu - 面积（亩），≥ 0
 * @param {number} input.rowSpacingCm - 行距（cm），> 0
 * @param {number} input.plantSpacingCm - 株距（cm），> 0
 * @param {number} [input.emergenceRate] - 出苗率（可选），(0, 1]
 * @returns {Object} 验证后的输入对象
 * @throws {Error} 参数无效时抛出
 * @example
 * validateInput({ cropKey: 'winter_wheat', areaMu: 10, rowSpacingCm: 20, plantSpacingCm: 0.25 });
 */
function validateInput(input) {
  if (!input || typeof input !== 'object') {
    throw new Error('输入必须为对象');
  }
  if (typeof input.cropKey !== 'string' || !input.cropKey) {
    throw new Error('作物键名不能为空');
  }
  if (!Object.prototype.hasOwnProperty.call(CROPS, input.cropKey)) {
    throw new Error('未找到作物：' + input.cropKey);
  }
  if (typeof input.areaMu !== 'number' || Number.isNaN(input.areaMu)) {
    throw new Error('面积必须为有效数字');
  }
  if (input.areaMu < 0) {
    throw new Error('面积不能为负数');
  }
  if (typeof input.rowSpacingCm !== 'number' || Number.isNaN(input.rowSpacingCm)) {
    throw new Error('行距必须为有效数字');
  }
  if (input.rowSpacingCm <= 0) {
    throw new Error('行距必须大于 0');
  }
  if (typeof input.plantSpacingCm !== 'number' || Number.isNaN(input.plantSpacingCm)) {
    throw new Error('株距必须为有效数字');
  }
  if (input.plantSpacingCm <= 0) {
    throw new Error('株距必须大于 0');
  }
  if (input.emergenceRate !== undefined && input.emergenceRate !== null && input.emergenceRate !== '') {
    if (typeof input.emergenceRate !== 'number' || Number.isNaN(input.emergenceRate)) {
      throw new Error('出苗率必须为有效数字');
    }
    if (input.emergenceRate <= 0 || input.emergenceRate > 1) {
      throw new Error('出苗率必须在 (0, 1] 范围内');
    }
  }
  return input;
}

/**
 * 计算作物播种参数（主入口）
 *
 * @param {Object} input - 输入参数
 * @param {string} input.cropKey - 作物键名
 * @param {number} input.areaMu - 面积（亩）
 * @param {number} input.rowSpacingCm - 行距（cm）
 * @param {number} input.plantSpacingCm - 株距（cm）
 * @param {number} [input.emergenceRate] - 出苗率（可选）
 * @returns {Object} 计算结果
 * @returns {Object} returns.crop - 作物数据
 * @returns {number} returns.plantsPerMu - 理论株数/亩
 * @returns {number} returns.seedWeightPerMu - 每亩用种量
 * @returns {string} returns.seedUnit - 用种量单位（g 或 kg）
 * @returns {number} returns.totalSeed - 总用种量
 * @returns {number} returns.areaMu - 面积
 * @throws {Error} 输入无效时抛出
 * @example
 * calculate({ cropKey: 'spring_maize', areaMu: 10, rowSpacingCm: 60, plantSpacingCm: 30 });
 */
function calculate(input) {
  const validated = validateInput(input);
  const crop = getCropData(validated.cropKey);

  const plantsPerMu = calcPlantsPerMu(validated.rowSpacingCm, validated.plantSpacingCm);

  let seedWeightPerMu;
  let seedUnit;

  if (crop.seedMode === 'tuber') {
    seedWeightPerMu = crop.seedWeightPerMu.default;
    seedUnit = 'kg';
  } else {
    const emergenceRate = (validated.emergenceRate !== undefined &&
                           validated.emergenceRate !== null &&
                           validated.emergenceRate !== '')
                          ? validated.emergenceRate
                          : crop.emergenceRate.default;
    seedWeightPerMu = calcSeedWeightPerMu(
      crop.targetDensity.default,
      crop.thousandGrainWeight.default,
      emergenceRate
    );
    seedUnit = 'g';
  }

  const totalSeed = calcTotalSeed(validated.areaMu, seedWeightPerMu);

  return {
    crop: crop,
    plantsPerMu: plantsPerMu,
    seedWeightPerMu: seedWeightPerMu,
    seedUnit: seedUnit,
    totalSeed: totalSeed,
    areaMu: validated.areaMu
  };
}

const testResults = [];

/**
 * 通用断言
 * @param {boolean} condition - 断言条件
 * @param {string} [message] - 失败信息
 * @throws {Error} 条件为 false 时抛出
 */
function assert(condition, message) {
  if (!condition) {
    throw new Error(message || '断言失败');
  }
}

/**
 * 严格相等断言
 * @param {*} actual - 实际值
 * @param {*} expected - 期望值
 * @param {string} [message] - 失败信息
 */
function assertEqual(actual, expected, message) {
  if (actual !== expected) {
    throw new Error((message || '断言失败') + '：期望 ' + expected + '，实际 ' + actual);
  }
}

/**
 * 近似相等断言
 * @param {number} actual - 实际值
 * @param {number} expected - 期望值
 * @param {number} tolerance - 容差
 * @param {string} [message] - 失败信息
 */
function assertApprox(actual, expected, tolerance, message) {
  if (Math.abs(actual - expected) > tolerance) {
    throw new Error((message || '断言失败') + '：期望约 ' + expected + '，实际 ' + actual);
  }
}

/**
 * 断言函数抛出异常
 * @param {Function} fn - 待测函数
 * @param {string} [message] - 失败信息
 */
function assertThrows(fn, message) {
  let threw = false;
  try { fn(); } catch (e) { threw = true; }
  if (!threw) {
    throw new Error(message || '期望抛出异常但未抛出');
  }
}

/**
 * 运行单个测试用例
 * @param {string} name - 测试名称
 * @param {Function} fn - 测试函数
 */
function runTest(name, fn) {
  try {
    fn();
    testResults.push({ name: name, pass: true });
  } catch (e) {
    testResults.push({ name: name, pass: false, error: e.message });
  }
}

  <li><strong>密度估算</strong>：根据行距、株距反推每亩理论株（穴）数，辅助制定种植密度方案。</li>
  <li><strong>用种量计算</strong>：结合千粒重与出苗率，估算每亩与整块地的种子需求量（按重量计）。</li>
  <li><strong>方案对比</strong>：调整行株距或出苗率，观察用种量变化，辅助选择种植模式。</li>
</ul>

<p>
  工具内置 12 种作物/茬口组合，每种作物均给出全国通行范围的数据，而非精确到县一级的本地化数据。

<h3>3.2 播种面积（areaMu）</h3>
<p>
  单位：亩。1 公顷 = 15 亩，1 亩 ≈ 666.67 m²。取值范围：≥ 0。
  当输入 0 时，总用种量返回 0；不允许输入负数。
</p>

<h3>3.3 行距（rowSpacingCm）</h3>
<p>
  单位：厘米（cm）。指相邻两行中心线之间的距离。不同作物差异较大：
  小麦 15-25 cm，玉米 55-65 cm，棉花 80-100 cm。必须大于 0。
</p>

<h3>3.4 株距（plantSpacingCm）</h3>
<p>
  单位：厘米（cm）。指同一行内相邻两株（穴）中心之间的距离。
  对于条播作物（如小麦），工具给出的是按基本苗折算的「等效株距」，
  例如冬小麦基本苗 20 万/亩、行距 20 cm 时，等效株距约 0.25 cm。
  必须大于 0。
</p>

<h3>3.5 预计出苗率（emergenceRate）</h3>
<p>
  取值范围：(0, 1]。出苗率 = 种子发芽率 × 田间成苗率，综合反映种子质量与田间条件。
  一般大田作物在 0.7-0.9 之间。若留空，则使用作物默认值。
</p>

<h3>3.6 千粒重（thousandGrainWeight）</h3>
<p>
  单位：克（g）。指 1000 粒自然干燥种子的重量，是估算用种量的关键参数。
  不同作物差异极大：油菜约 3-4.5 g，小麦约 35-50 g，玉米约 250-400 g。
  工具内置的是通行范围，具体品种需查种子标签或品种审定数据。
</p>

<h2>四、完整使用场景</h2>

<h3>场景 1：华北平原冬小麦备种</h3>
<p><strong>背景</strong>：河北某种植大户计划种植冬小麦 50 亩，采用 20 cm 行距机播。</p>
<p><strong>输入</strong>：</p>
<ul>
  <li>作物：冬小麦</li>
  <li>面积：50 亩</li>
  <li>行距：20 cm</li>
  <li>株距：0.25 cm（等效株距，对应基本苗约 20 万/亩）</li>
  <li>出苗率：留空（使用默认 0.75）</li>
</ul>
<p><strong>计算过程</strong>：</p>
<ol>
  <li>每亩理论株数 = 6666700 / (20 × 0.25) = 1333340 株/亩</li>
  <li>每亩需播种粒数 = 200000 / 0.75 ≈ 266667 粒（按目标密度 20 万/亩）</li>
  <li>每亩种子重量 = 266667 × 42 / 1000 ≈ 11200 g = 11.2 kg</li>
  <li>总用种量 = 50 × 11.2 = 560 kg</li>
</ol>
<p><strong>结果</strong>：约需种子 560 kg。实际采购建议在此基础上增加 5%-10% 的余量。</p>

<h3>场景 2：东北春玉米备种</h3>
<p><strong>背景</strong>：黑龙江某家庭农场计划种植春玉米 120 亩，采用 60 cm 行距、30 cm 株距精量播种。</p>
<p><strong>输入</strong>：</p>
<ul>
  <li>作物：春玉米</li>
  <li>面积：120 亩</li>
  <li>行距：60 cm</li>
  <li>株距：30 cm</li>
  <li>出苗率：0.9</li>
</ul>
<p><strong>计算过程</strong>：</p>
<ol>
  <li>每亩理论株数 = 6666700 / (60 × 30) ≈ 3703.7 株/亩</li>
  <li>每亩需播种粒数 = 4000 / 0.9 ≈ 4444 粒</li>
  <li>每亩种子重量 = 4444 × 320 / 1000 ≈ 1422.22 g</li>
  <li>总用种量 = 120 × 1422.22 ≈ 170666.67 g ≈ 170.67 kg</li>
</ol>
<p><strong>结果</strong>：约需种子 170.67 kg。若使用包衣种子，按袋装规格采购即可。</p>

<h3>场景 3：长江流域油菜移栽</h3>
<p><strong>背景</strong>：湖南某合作社计划移栽油菜 30 亩，行距 25 cm，株距 17 cm。</p>
<p><strong>输入</strong>：</p>
<ul>
  <li>作物：油菜</li>
  <li>面积：30 亩</li>
  <li>行距：25 cm</li>
  <li>株距：17 cm</li>
  <li>出苗率：留空（默认 0.8）</li>
</ul>
<p><strong>计算过程</strong>：</p>
<ol>
  <li>每亩理论穴数 = 6666700 / (25 × 17) ≈ 15686 穴/亩</li>
  <li>每亩需播种粒数 = 12000 / 0.8 = 15000 粒</li>
  <li>每亩种子重量 = 15000 × 3.8 / 1000 = 57 g</li>
  <li>总用种量 = 30 × 57 = 1710 g ≈ 1.71 kg</li>
</ol>
<p><strong>结果</strong>：约需种子 1.71 kg。油菜种子细小，实际育苗需考虑苗床损耗，建议多备 20%。</p>

<h3>场景 4：新疆棉花高密度栽培</h3>
<p><strong>背景</strong>：新疆某团场计划种植棉花 200 亩，采用 90 cm 行距、25 cm 株距。</p>
<p><strong>输入</strong>：</p>
<ul>
  <li>作物：棉花</li>
  <li>面积：200 亩</li>
  <li>行距：90 cm</li>
  <li>株距：25 cm</li>
  <li>出苗率：0.85</li>
</ul>
<p><strong>计算过程</strong>：</p>
<ol>
  <li>每亩理论株数 = 6666700 / (90 × 25) ≈ 2962.96 株/亩</li>
  <li>每亩需播种粒数 = 4000 / 0.85 ≈ 4705.88 粒</li>
  <li>每亩种子重量 = 4705.88 × 105 / 1000 ≈ 494.12 g</li>
  <li>总用种量 = 200 × 494.12 ≈ 98823.53 g ≈ 98.82 kg</li>
</ol>
<p><strong>结果</strong>：约需种子 98.82 kg。<strong>注意</strong>：新疆高密度栽培模式目标密度可达 12000-15000 株/亩，
本工具默认值 4000 株/亩不适用于该模式，需用户自行调整目标密度参数或咨询当地农技部门。</p>

<h3>场景 5：中原地区马铃薯备种</h3>
<p><strong>背景</strong>：河南某农场计划种植马铃薯 40 亩，行距 65 cm，株距 27 cm。</p>
<p><strong>输入</strong>：</p>
<ul>
  <li>作物：马铃薯</li>
  <li>面积：40 亩</li>
  <li>行距：65 cm</li>
  <li>株距：27 cm</li>
</ul>
<p><strong>计算过程</strong>：</p>
<ol>
  <li>每亩理论穴数 = 6666700 / (65 × 27) ≈ 3798.12 穴/亩</li>
  <li>马铃薯按种薯重量计，每亩默认用种量 135 kg</li>
  <li>总用种量 = 40 × 135 = 5400 kg</li>
</ol>
<p><strong>结果</strong>：约需种薯 5400 kg（5.4 吨）。马铃薯用种按重量计，不按千粒重估算。</p>

<h2>七、局限性说明</h2>
<ul>
  <li><strong>地域差异</strong>：我国幅员辽阔，同一作物在不同省份、不同海拔、不同气候带的适宜播期可相差 1 个月以上。本工具给出的是全国通行范围，<strong>不能替代当地农技部门的播期预报</strong>。</li>
  <li><strong>品种差异</strong>：同一作物不同品种的千粒重、分蘖力、株型差异较大，本工具使用通行范围的中位值，可能与具体品种不符。</li>
  <li><strong>栽培模式差异</strong>：如新疆棉花高密度栽培、东北玉米大垄双行等特殊模式，本工具默认参数不适用，需用户自行调整。</li>
  <li><strong>出苗率估算</strong>：出苗率受种子质量、整地质量、墒情、气温、病虫害等多因素影响，本工具默认值仅供参考。</li>
  <li><strong>马铃薯特殊性</strong>：马铃薯生产上用种薯（块茎）繁殖，用种量按重量计，不按千粒重估算。本工具对马铃薯采用固定每亩用种量，未考虑种薯切块大小、芽眼数等因素。</li>
  <li><strong>水稻移栽</strong>：水稻移栽的用种量还与育秧方式（水育秧、旱育秧、机插秧盘）密切相关，本工具仅按穴数估算，未区分育秧方式。</li>
  <li><strong>不替代田间试验</strong>：本工具为参考估算工具，不能替代品种试验、密度试验、播期试验等田间验证。</li>
  <li><strong>数据时效性</strong>：作物主推技术、品种推荐会随年份调整，本工具数据基于公开资料整理，不保证与最新年度推荐完全一致。</li>
</ul>

<h2>八、算法说明</h2>
<p>核心计算公式如下：</p>
<ol>
  <li><strong>每亩理论株（穴）数</strong> = 6666700 / (行距cm × 株距cm)</li>
  <li><strong>每亩需播种粒数</strong> = 目标密度 / 出苗率</li>
  <li><strong>每亩种子重量(g)</strong> = 每亩需播种粒数 × 千粒重(g) / 1000</li>
  <li><strong>总用种量</strong> = 每亩种子重量 × 面积（亩）</li>
</ol>
<p>
  其中 6666700 是 1 亩对应的平方厘米数（1 亩 = 666.67 m² = 6666700 cm²）。
  所有中间结果保留 2 位小数，最终结果保留 2 位小数。
</p>

      '</div>';

    resultDiv.innerHTML = html;
  } catch (e) {
    alert('计算错误：' + e.message);
  }
});

// 重置按钮
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('area').value = '';
  document.getElementById('emergenceRate').value = '';
  document.getElementById('result').style.display = 'none';
  updateCropInfo();
});

// 标签切换
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

// 渲染测试结果
function renderTests() {
  const summary = document.getElementById('testSummary');
  const list = document.getElementById('testList');

  const passed = testResults.filter(r => r.pass).length;
  const total = testResults.length;

  summary.innerHTML =
    '<h3>单元测试结果</h3>' +
    '<p>通过 <span class="test-pass">' + passed + '</span> / 共 <strong>' + total + '</strong> 个测试</p>' +
    '<p>通过率：' + (passed / total * 100).toFixed(1) + '%</p>';

  list.innerHTML = testResults.map(r =>
    '<div class="test-item ' + (r.pass ? 'pass' : 'fail') + '">' +
    (r.pass ? '✓' : '✗') + ' ' + r.name + (r.error ? ' - ' + r.error : '') +
    '</div>'
  ).join('');

  console.log('通过 ' + passed + ' / 共 ' + total);
}

renderTests();
</script>
</body>
</html>
