/* ============================================================
   第一部分：核心算法源码
   ============================================================ */
const SOURCE_CODE = `
/**
 * 螺栓强度校核工具 - 核心算法
 * 依据标准：
 *   - GB 50017-2017《钢结构设计标准》
 *   - GB/T 3098.1-2010《紧固件机械性能 螺栓、螺钉和螺柱》
 * 
 * 注意：强度设计值等数据需查标准原文确认，本工具提供的是常用值。
 */

/**
 * 螺栓相关常量数据
 * 数据来源：GB/T 3098.1-2010、GB 50017-2017
 * 注：具体数值需查标准原文确认
 */
const BOLT_CONSTANTS = {
  // 螺栓有效截面积 A_e (mm²) - 依据 GB/T 3098.1-2010 表 1
  effectiveArea: {
    12: 84.3,
    16: 157,
    20: 245,
    22: 303,
    24: 353,
    27: 459,
    30: 561
  },

  // 普通螺栓强度设计值 (N/mm²) - 依据 GB 50017-2017 表 4.4.3
  // 注：具体数值需查标准原文确认
  ordinaryBolt: {
    'C': {
      tensile: 170,   // 抗拉 f_t^b
      shear: 140,     // 抗剪 f_v^b
      bearing: {      // 承压 f_c^b，按钢材牌号
        'Q235': 305,
        'Q345': 405,
        'Q390': 440,
        'Q420': 470
      }
    },
    'AB': {
      tensile: 210,
      shear: 190,
      bearing: {
        'Q235': 405,
        'Q345': 510,
        'Q390': 555,
        'Q420': 590
      }
    }
  },

  // 高强度螺栓强度设计值 (N/mm²) - 依据 GB 50017-2017
  // 注：具体数值需查标准原文确认
  highStrengthBolt: {
    '8.8': { tensile: 400, shear: 250 },
    '10.9': { tensile: 500, shear: 310 }
  },

  // 高强度螺栓预拉力 P (kN) - 依据 GB 50017-2017 表 11.4.2-2
  // 注：具体数值需查标准原文确认
  preloadForce: {
    '8.8':  { 16: 80,  20: 125, 22: 150, 24: 175 },
    '10.9': { 16: 100, 20: 155, 22: 190, 24: 225 }
  }
};

/**
 * 获取螺栓有效截面积
 * @param {number} d - 螺栓公称直径 (mm)，支持 12, 16, 20, 22, 24, 27, 30
 * @returns {number} 螺栓有效截面积 A_e (mm²)
 * @throws {Error} 当直径不是有效数字、小于等于 0、或不在支持范围内时抛出异常
 * @example
 * getBoltEffectiveArea(20); // 返回 245
 * getBoltEffectiveArea(12); // 返回 84.3
 */
function getBoltEffectiveArea(d) {
  if (typeof d !== 'number' || isNaN(d)) {
    throw new Error('螺栓直径必须是有效数字');
  }
  if (d <= 0) {
    throw new Error('螺栓直径必须大于 0');
  }
  const area = BOLT_CONSTANTS.effectiveArea[d];
  if (area === undefined) {
    throw new Error(
      '不支持的螺栓直径: ' + d + 'mm，支持: 12, 16, 20, 22, 24, 27, 30'
    );
  }
  return area;
}

/**
 * 获取螺栓强度设计值
 * @param {string} grade - 螺栓性能等级，如 '4.6', '8.8', '10.9'
 * @param {string} boltType - 螺栓类型：'ordinary-C'(C级普通螺栓),
 *        'ordinary-AB'(A/B级普通螺栓), 'high-strength'(高强度螺栓)
 * @returns {Object} 包含 tensile(抗拉)、shear(抗剪) 强度设计值 (N/mm²)，
 *          普通螺栓还包含 bearing(承压，按钢材牌号)
 * @throws {Error} 当参数为空、等级或类型不支持时抛出异常
 * @example
 * getStrengthDesignValues('8.8', 'high-strength');
 * // 返回 { tensile: 400, shear: 250 }
 */
function getStrengthDesignValues(grade, boltType) {
  if (!grade || !boltType) {
    throw new Error('螺栓等级和类型不能为空');
  }
  if (typeof grade !== 'string' || typeof boltType !== 'string') {
    throw new Error('螺栓等级和类型必须是字符串');
  }

  if (boltType === 'high-strength') {
    const values = BOLT_CONSTANTS.highStrengthBolt[grade];
    if (!values) {
      throw new Error(
        '不支持的高强度螺栓等级: ' + grade + '，支持: 8.8, 10.9'
      );
    }
    return { tensile: values.tensile, shear: values.shear };
  } else if (boltType === 'ordinary-C') {
    const v = BOLT_CONSTANTS.ordinaryBolt['C'];
    return { tensile: v.tensile, shear: v.shear, bearing: Object.assign({}, v.bearing) };
  } else if (boltType === 'ordinary-AB') {
    const v = BOLT_CONSTANTS.ordinaryBolt['AB'];
    return { tensile: v.tensile, shear: v.shear, bearing: Object.assign({}, v.bearing) };
  } else {
    throw new Error(
      '不支持的螺栓类型: ' + boltType +
      '，支持: ordinary-C, ordinary-AB, high-strength'
    );
  }
}

/**
 * 获取高强度螺栓预拉力
 * @param {string} grade - 螺栓性能等级，'8.8' 或 '10.9'
 * @param {number} d - 螺栓公称直径 (mm)，支持 16, 20, 22, 24
 * @returns {number} 预拉力 P (kN)
 * @throws {Error} 当参数不支持时抛出异常
 * @example
 * getPreloadForce('10.9', 20); // 返回 155
 */
function getPreloadForce(grade, d) {
  if (!BOLT_CONSTANTS.preloadForce[grade]) {
    throw new Error('不支持的高强度螺栓等级: ' + grade);
  }
  const p = BOLT_CONSTANTS.preloadForce[grade][d];
  if (p === undefined) {
    throw new Error(
      '不支持的直径: ' + d + 'mm (等级 ' + grade + ')，支持: 16, 20, 22, 24'
    );
  }
  return p;
}

/**
 * 计算单个螺栓抗拉承载力设计值
 * 公式：N_t^b = A_e × f_t^b
 * @param {number} d - 螺栓公称直径 (mm)
 * @param {string} grade - 螺栓性能等级
 * @param {string} boltType - 螺栓类型
 * @returns {number} 抗拉承载力设计值 (kN)，保留 2 位小数
 * @throws {Error} 当参数无效时抛出异常
 * @example
 * calculateTensileCapacity(20, '8.8', 'high-strength');
 * // 返回 98 (kN) = 245 mm² × 400 N/mm² / 1000
 */
function calculateTensileCapacity(d, grade, boltType) {
  const A_e = getBoltEffectiveArea(d);
  const values = getStrengthDesignValues(grade, boltType);
  const N_t = A_e * values.tensile / 1000;
  return Math.round(N_t * 100) / 100;
}

/**
 * 计算单个螺栓抗剪承载力设计值
 * 公式：N_v^b = n_v × (π×d²/4) × f_v^b
 * @param {number} d - 螺栓公称直径 (mm)
 * @param {string} grade - 螺栓性能等级
 * @param {string} boltType - 螺栓类型
 * @param {number} nShearPlanes - 受剪面数，1=单剪，2=双剪
 * @returns {number} 抗剪承载力设计值 (kN)，保留 2 位小数
 * @throws {Error} 当参数无效或受剪面数不是 1 或 2 时抛出异常
 * @example
 * calculateShearCapacity(20, '8.8', 'high-strength', 1);
 * // 返回 78.54 (kN)
 */
function calculateShearCapacity(d, grade, boltType, nShearPlanes) {
  if (typeof nShearPlanes !== 'number' || isNaN(nShearPlanes)) {
    throw new Error('受剪面数必须是有效数字');
  }
  if (nShearPlanes !== 1 && nShearPlanes !== 2) {
    throw new Error('受剪面数必须是 1（单剪）或 2（双剪）');
  }
  const A = Math.PI * d * d / 4;
  const values = getStrengthDesignValues(grade, boltType);
  const N_v = nShearPlanes * A * values.shear / 1000;
  return Math.round(N_v * 100) / 100;
}

/**
 * 计算单个螺栓承压承载力设计值
 * 公式：N_c^b = d × Σt × f_c^b
 * @param {number} d - 螺栓公称直径 (mm)
 * @param {number} sumT - 同一受力方向承压板件总厚度的较小值 (mm)
 * @param {string} steelGrade - 钢材牌号，如 'Q235', 'Q345', 'Q390', 'Q420'
 * @param {string} boltType - 螺栓类型，仅支持 'ordinary-C' 或 'ordinary-AB'
 * @returns {number} 承压承载力设计值 (kN)，保留 2 位小数
 * @throws {Error} 当参数无效时抛出异常
 * @example
 * calculateBearingCapacity(20, 10, 'Q235', 'ordinary-C');
 * // 返回 61 (kN) = 20 × 10 × 305 / 1000
 */
function calculateBearingCapacity(d, sumT, steelGrade, boltType) {
  if (typeof sumT !== 'number' || isNaN(sumT)) {
    throw new Error('承压板件总厚度必须是有效数字');
  }
  if (sumT <= 0) {
    throw new Error('承压板件总厚度必须大于 0');
  }
  if (!steelGrade) {
    throw new Error('钢材牌号不能为空');
  }

  const values = getStrengthDesignValues('4.6', boltType);
  const f_c = values.bearing[steelGrade];
  if (!f_c) {
    throw new Error(
      '不支持的钢材牌号: ' + steelGrade +
      '，支持: Q235, Q345, Q390, Q420'
    );
  }

  const N_c = d * sumT * f_c / 1000;
  return Math.round(N_c * 100) / 100;
}

/**
 * 受拉螺栓强度校核
 * 校核条件：N ≤ N_t^b
 * @param {number} N - 单个螺栓承受的拉力设计值 (kN)
 * @param {number} d - 螺栓公称直径 (mm)
 * @param {string} grade - 螺栓性能等级
 * @param {string} boltType - 螺栓类型
 * @returns {Object} 校核结果
 * @returns {boolean} returns.passed - 是否满足要求
 * @returns {number} returns.ratio - 应力比 N/N_t^b
 * @returns {number} returns.capacity - 承载力设计值 (kN)
 * @returns {number} returns.demand - 荷载效应 (kN)
 * @throws {Error} 当拉力为负数或参数无效时抛出异常
 * @example
 * checkBoltTension(80, 20, '8.8', 'high-strength');
 * // 返回 { passed: true, ratio: 0.816, capacity: 98, demand: 80 }
 */
function checkBoltTension(N, d, grade, boltType) {
  if (typeof N !== 'number' || isNaN(N)) {
    throw new Error('拉力设计值必须是有效数字');
  }
  if (N < 0) {
    throw new Error('拉力设计值不能为负数');
  }
  const capacity = calculateTensileCapacity(d, grade, boltType);
  const ratio = capacity > 0 ? N / capacity : (N > 0 ? Infinity : 0);
  return {
    passed: N <= capacity,
    ratio: Math.round(ratio * 1000) / 1000,
    capacity: capacity,
    demand: N
  };
}

/**
 * 受剪螺栓强度校核
 * 校核条件：V ≤ N_v^b
 * @param {number} V - 单个螺栓承受的剪力设计值 (kN)
 * @param {number} d - 螺栓公称直径 (mm)
 * @param {string} grade - 螺栓性能等级
 * @param {string} boltType - 螺栓类型
 * @param {number} nShearPlanes - 受剪面数
 * @returns {Object} 校核结果
 * @returns {boolean} returns.passed - 是否满足要求
 * @returns {number} returns.ratio - 应力比 V/N_v^b
 * @returns {number} returns.capacity - 承载力设计值 (kN)
 * @returns {number} returns.demand - 荷载效应 (kN)
 * @throws {Error} 当剪力为负数或参数无效时抛出异常
 * @example
 * checkBoltShear(60, 20, '8.8', 'high-strength', 1);
 * // 返回 { passed: true, ratio: 0.764, capacity: 78.54, demand: 60 }
 */
function checkBoltShear(V, d, grade, boltType, nShearPlanes) {
  if (typeof V !== 'number' || isNaN(V)) {
    throw new Error('剪力设计值必须是有效数字');
  }
  if (V < 0) {
    throw new Error('剪力设计值不能为负数');
  }
  const capacity = calculateShearCapacity(d, grade, boltType, nShearPlanes);
  const ratio = capacity > 0 ? V / capacity : (V > 0 ? Infinity : 0);
  return {
    passed: V <= capacity,
    ratio: Math.round(ratio * 1000) / 1000,
    capacity: capacity,
    demand: V
  };
}

/**
 * 拉剪联合受力螺栓强度校核
 * 依据 GB 50017-2017 公式 (11.4.1-3)：
 *   sqrt((N/N_t^b)² + (V/N_v^b)²) ≤ 1
 * @param {number} N - 单个螺栓承受的拉力设计值 (kN)
 * @param {number} V - 单个螺栓承受的剪力设计值 (kN)
 * @param {number} d - 螺栓公称直径 (mm)
 * @param {string} grade - 螺栓性能等级
 * @param {string} boltType - 螺栓类型
 * @param {number} nShearPlanes - 受剪面数
 * @returns {Object} 校核结果
 * @returns {boolean} returns.passed - 是否满足要求
 * @returns {number} returns.ratio - 综合应力比
 * @returns {number} returns.tensionRatio - 拉应力比 N/N_t^b
 * @returns {number} returns.shearRatio - 剪应力比 V/N_v^b
 * @returns {number} returns.tensionCapacity - 抗拉承载力 (kN)
 * @returns {number} returns.shearCapacity - 抗剪承载力 (kN)
 * @throws {Error} 当参数无效时抛出异常
 * @example
 * checkBoltCombined(50, 40, 20, '8.8', 'high-strength', 1);
 */
function checkBoltCombined(N, V, d, grade, boltType, nShearPlanes) {
  if (typeof N !== 'number' || isNaN(N)) {
    throw new Error('拉力设计值必须是有效数字');
  }
  if (typeof V !== 'number' || isNaN(V)) {
    throw new Error('剪力设计值必须是有效数字');
  }
  if (N < 0) {
    throw new Error('拉力设计值不能为负数');
  }
  if (V < 0) {
    throw new Error('剪力设计值不能为负数');
  }

  const N_t = calculateTensileCapacity(d, grade, boltType);
  const N_v = calculateShearCapacity(d, grade, boltType, nShearPlanes);

  const tensionRatio = N_t > 0 ? N / N_t : (N > 0 ? Infinity : 0);
  const shearRatio = N_v > 0 ? V / N_v : (V > 0 ? Infinity : 0);

  const combinedRatio = Math.sqrt(
    tensionRatio * tensionRatio + shearRatio * shearRatio
  );

  return {
    passed: combinedRatio <= 1,
    ratio: Math.round(combinedRatio * 1000) / 1000,
    tensionRatio: Math.round(tensionRatio * 1000) / 1000,
    shearRatio: Math.round(shearRatio * 1000) / 1000,
    tensionCapacity: N_t,
    shearCapacity: N_v,
    tensionDemand: N,
    shearDemand: V
  };
}
`;

// 执行源码，让函数在全局可用
eval(SOURCE_CODE);

// 显示源码
document.getElementById('sourceCode').textContent = SOURCE_CODE.trim();

/* ============================================================
   第二部分：单元测试
   ============================================================ */
let testCount = 0;
let passCount = 0;
let failCount = 0;
const testResults = [];

function logTest(passed, message, detail) {
  testCount++;
  if (passed) {
    passCount++;
    testResults.push({ passed: true, message: message });
  } else {
    failCount++;
    testResults.push({ passed: false, message: message + ' - ' + detail });
  }
}

function assertEqual(actual, expected, message) {
  const passed = actual === expected;
  logTest(passed, message, '期望 ' + expected + ', 实际 ' + actual);
}

function assertApprox(actual, expected, tolerance, message) {
  const passed = Math.abs(actual - expected) <= tolerance;
  logTest(passed, message, '期望 ' + expected + '±' + tolerance + ', 实际 ' + actual);
}

function assertTrue(condition, message) {
  logTest(condition === true, message, '期望 true, 实际 ' + condition);
}

function assertFalse(condition, message) {
  logTest(condition === false, message, '期望 false, 实际 ' + condition);
}

function assertThrows(fn, message) {
  try {
    fn();
    logTest(false, message, '应该抛出异常但没有');
  } catch (e) {
    logTest(true, message + ' (异常: ' + e.message + ')');
  }
}

function assertType(value, type, message) {
  const passed = typeof value === type;
  logTest(passed, message, '期望类型 ' + type + ', 实际 ' + typeof value);
}

<li>螺栓杆截面积 A = π × 24² / 4 = 452.39 mm²</li>
<li>10.9 级高强螺栓抗剪强度设计值 f_v^b = 310 N/mm²</li>
<li>抗剪承载力 N_v^b = 1 × 452.39 × 310 / 1000 = 140.24 kN</li>
<li>应力比 = 120 / 140.24 = 0.856</li>
</ul>
<p><strong>校核结果：</strong>passed = true，应力比 0.856 < 1，满足要求。利用率较高，设计较为经济。</p>
<p><strong>调用示例：</strong><code>checkBoltShear(120, 24, '10.9', 'high-strength', 1)</code></p>
</div>

<div class="scenario">
<div class="scenario-title">场景 3：高强度螺栓双剪连接校核</div>
<p><strong>工程背景：</strong>某支撑连接采用三块板拼接，中间板与两侧板形成双剪连接，使用 8.8 级 M20 高强度螺栓，单个螺栓承受剪力设计值 140 kN。</p>
<p><strong>输入参数：</strong></p>
<ul>
<li>螺栓直径 d = 20 mm</li>
<li>性能等级 grade = '8.8'</li>
<li>螺栓类型 boltType = 'high-strength'</li>
<li>受剪面数 nShearPlanes = 2（双剪）</li>
<li>剪力设计值 V = 140 kN</li>
</ul>
<p><strong>计算过程：</strong></p>
<ul>
<li>螺栓杆截面积 A = π × 20² / 4 = 314.16 mm²</li>
<li>8.8 级高强螺栓抗剪强度设计值 f_v^b = 250 N/mm²</li>
<li>抗剪承载力 N_v^b = 2 × 314.16 × 250 / 1000 = 157.08 kN</li>
<li>应力比 = 140 / 157.08 = 0.891</li>
</ul>
<p><strong>校核结果：</strong>passed = true，应力比 0.891 < 1，满足要求。双剪连接使承载力提高一倍。</p>
<p><strong>调用示例：</strong><code>checkBoltShear(140, 20, '8.8', 'high-strength', 2)</code></p>
</div>

<div class="scenario">
<div class="scenario-title">场景 4：拉剪联合受力校核</div>
<p><strong>工程背景：</strong>某悬挑梁端部连接螺栓同时承受拉力和剪力，采用 10.9 级 M22 高强度螺栓，单个螺栓承受拉力设计值 100 kN、剪力设计值 80 kN，单剪连接。</p>
<p><strong>输入参数：</strong></p>
<ul>
<li>螺栓直径 d = 22 mm</li>
<li>性能等级 grade = '10.9'</li>
<li>螺栓类型 boltType = 'high-strength'</li>
<li>受剪面数 nShearPlanes = 1</li>
<li>拉力设计值 N = 100 kN</li>
<li>剪力设计值 V = 80 kN</li>
</ul>
<p><strong>计算过程：</strong></p>
<ul>
<li>抗拉承载力 N_t^b = 303 × 500 / 1000 = 151.5 kN</li>
<li>抗剪承载力 N_v^b = 1 × π × 22² / 4 × 310 / 1000 = 117.18 kN</li>
<li>拉应力比 = 100 / 151.5 = 0.660</li>
<li>剪应力比 = 80 / 117.18 = 0.683</li>
<li>综合应力比 = √(0.660² + 0.683²) = √(0.4356 + 0.4665) = √0.9021 = 0.950</li>
</ul>
<p><strong>校核结果：</strong>passed = true，综合应力比 0.950 < 1，满足要求。但利用率较高，接近极限，建议复核荷载取值或增大螺栓直径。</p>
<p><strong>调用示例：</strong><code>checkBoltCombined(100, 80, 22, '10.9', 'high-strength', 1)</code></p>
</div>

<div class="scenario">
<div class="scenario-title">场景 5：普通螺栓承压校核</div>
<p><strong>工程背景：</strong>某节点采用 M20 C 级普通螺栓连接 Q345 钢板，板厚 12 mm，单个螺栓承受的剪力设计值 50 kN，需校核承压承载力。</p>
<p><strong>输入参数：</strong></p>
<ul>
<li>螺栓直径 d = 20 mm</li>
<li>承压板件总厚度 sumT = 12 mm</li>
<li>钢材牌号 steelGrade = 'Q345'</li>
<li>螺栓类型 boltType = 'ordinary-C'</li>
</ul>
<p><strong>计算过程：</strong></p>
<ul>
<li>Q345 钢 C 级螺栓承压强度设计值 f_c^b = 405 N/mm²</li>
<li>承压承载力 N_c^b = 20 × 12 × 405 / 1000 = 97.2 kN</li>
</ul>
<p><strong>校核结果：</strong>承压承载力 97.2 kN > 剪力设计值 50 kN，满足要求。可配合 checkBoltShear 同时校核螺栓抗剪承载力，取两者较小值作为连接承载力。</p>
<p><strong>调用示例：</strong><code>calculateBearingCapacity(20, 12, 'Q345', 'ordinary-C')</code></p>
</div>

<h2>四、常见错误与排查</h2>

<h3>4.1 "不支持的螺栓直径"</h3>
<p><strong>原因：</strong>输入的直径不在支持列表（12, 16, 20, 22, 24, 27, 30）中。常见错误包括输入 M10、M14、M18 等规格，或输入非整数（如 20.5）。</p>
<p><strong>解决：</strong>确认螺栓规格是否为标准规格。如需计算非标准规格，请查 GB/T 3098.1-2010 获取有效截面积后，使用 calculateTensileCapacity 等函数的手动计算方式。</p>

<h3>4.2 "不支持的高强度螺栓等级"</h3>
<p><strong>原因：</strong>高强度螺栓仅支持 8.8 级和 10.9 级。输入 12.9 级或其他等级会报错。</p>
<p><strong>解决：</strong>确认螺栓性能等级。12.9 级螺栓在钢结构中较少使用，如需计算请查标准原文获取强度设计值。</p>

<h3>4.3 "受剪面数必须是 1 或 2"</h3>
<p><strong>原因：</strong>受剪面数输入了 0、3 或其他值。</p>
<p><strong>解决：</strong>单剪连接（两块板搭接）输入 1；双剪连接（三块板拼接）输入 2。实际工程中不存在 3 个及以上受剪面的情况。</p>

<h3>4.4 "拉力/剪力设计值不能为负数"</h3>
<p><strong>原因：</strong>输入的荷载为负值。螺栓校核仅考虑拉力或剪力，不考虑压力。</p>
<p><strong>解决：</strong>确认荷载方向。如果螺栓受压，则无需进行螺栓强度校核（压力由板件直接接触传递）。</p>

<h3>4.5 单位混淆</h3>
<p><strong>原因：</strong>荷载单位应为 kN（千牛），直径和厚度单位应为 mm（毫米），强度设计值单位为 N/mm²（等同于 MPa）。常见错误是将 N 当作 kN 输入，或将 m 当作 mm 输入。</p>
<p><strong>解决：</strong>输入前统一单位。荷载以 kN 为单位，几何尺寸以 mm 为单位。</p>

<h3>4.6 校核通过但应力比接近 1</h3>
<p><strong>原因：</strong>虽然满足规范要求，但承载力富余很小，可能存在荷载取值偏小、材料强度取值偏高等风险。</p>
<p><strong>解决：</strong>建议复核荷载组合、材料强度取值，或适当增大螺栓直径、提高性能等级。</p>

<h2>六、局限性说明</h2>

<p>本工具存在以下局限性，使用者应充分了解：</p>

<ol>
<li><strong>仅计算单个螺栓：</strong>工具仅校核单个螺栓的承载力，不涉及螺栓群的整体受力分析、螺栓群形心计算、偏心受力分析等。螺栓群设计需另行计算。</li>

<li><strong>不涉及连接板验算：</strong>工具不验算被连接板件的强度（净截面强度、毛截面强度）、刚度、稳定性等。连接板设计需按 GB 50017-2017 相关章节另行计算。</li>

<li><strong>不考虑疲劳：</strong>工具仅考虑静力强度校核，不考虑疲劳荷载作用下的螺栓疲劳验算。承受重复荷载的连接需按 GB 50017-2017 第 16 章进行疲劳验算。</li>

<li><strong>不考虑温度影响：</strong>工具假设常温工作环境（-20℃ ~ +100℃）。高温或低温环境下的螺栓强度需按相关标准进行折减。</li>

<li><strong>不考虑腐蚀：</strong>工具不考虑腐蚀环境对螺栓承载力的影响。腐蚀环境下的连接设计需考虑防腐措施及承载力折减。</li>

<li><strong>不考虑施工偏差：</strong>工具假设螺栓安装符合规范要求，不考虑施工偏差（如螺栓孔偏差、预拉力偏差等）对承载力的影响。</li>

<li><strong>高强度螺栓仅考虑承压型：</strong>本工具中高强度螺栓的校核按承压型连接计算，未涉及摩擦型连接的抗滑移系数验算。摩擦型连接需另行按 GB 50017-2017 第 11.4 节计算。</li>

<li><strong>螺栓规格有限：</strong>仅支持 M12 ~ M30 的 7 种常用规格，不支持 M10、M14、M18、M33、M36 等规格。</li>

<li><strong>钢材牌号有限：</strong>承压计算仅支持 Q235、Q345、Q390、Q420 四种常用钢材牌号，不支持 Q460 及以上牌号或进口钢材。</li>

<li><strong>不提供构造建议：</strong>工具不提供螺栓间距、边距、端距等构造要求的检查。构造设计需按 GB 50017-2017 第 11.5 节执行。</li>
</ol>
