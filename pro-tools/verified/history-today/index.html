<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史上的今天</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(170deg,#12100c 0%,#1a1710 55%,#0d0b08 100%);
    color:#e8dcc0;padding:8px 8px 20px;display:flex;flex-direction:column;align-items:center}
  .back{align-self:flex-start;text-decoration:none;font-size:11px;margin-bottom:6px;
    padding:3px 9px;border:1px solid currentColor;border-radius:12px;opacity:.6;color:#c9b98e}
  .wrap{width:100%;max-width:720px}
  header{text-align:center;margin-bottom:8px}
  h1{font-size:17px;letter-spacing:2px;color:#e5c576;font-weight:700}
  .sub{font-size:11px;opacity:.6;margin-top:4px}
  .sub2{font-size:10px;text-align:center;color:#a89870;margin-top:3px;opacity:.85}
  .datebar{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 6px;font-size:12px}
  .datebar input{background:#1e1a12;border:1px solid #4a3f28;color:#e8dcc0;border-radius:6px;
    padding:4px 6px;font-size:12px;font-family:inherit}
  .datebar button{background:#2a2418;border:1px solid #5a4a2c;color:#e5c576;border-radius:6px;
    padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}
  .datebar button:active{background:#3a3120}
  .tabs{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
  .tab{flex:1;min-width:70px;text-align:center;font-size:11px;padding:6px 4px;border-radius:6px;
    background:#1a1710;border:1px solid #3a3220;color:#b5a882;cursor:pointer;user-select:none}
  .tab.on{background:#3a3020;border-color:#e5c576;color:#f0d894}
  .tab .n{font-size:10px;opacity:.65;margin-left:2px}
  .list{display:flex;flex-direction:column;gap:6px}
  .item{background:linear-gradient(160deg,#1d1a12,#16130d);border:1px solid #332b1c;
    border-radius:8px;padding:9px 10px;border-left:3px solid #6a5a34}
  .item.k-event{border-left-color:#c9a227}
  .item.k-birth{border-left-color:#4f9d69}
  .item.k-death{border-left-color:#8a6a9c}
  .yr{font-size:11px;font-weight:700;color:#e5c576;letter-spacing:.5px}
  .lz{font-size:10.5px;color:#b8a878;margin-top:2px;letter-spacing:.3px}
  .lz b{color:#d8c48e;font-weight:600}
  .tt{font-size:12.5px;line-height:1.5;margin-top:2px;color:#eee2c4}
  .tt a{color:#eee2c4;text-decoration:none;border-bottom:1px dotted #6a5a34}
  .item{cursor:pointer}
  .dd.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .dyn{display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(160deg,#1d1a12,#16130d);
    border:1px solid #332b1c;border-radius:8px;padding:9px 10px;border-left:3px solid #c9a227}
  .dyn .nm{font-size:12.5px;font-weight:700;color:#f0d894;min-width:52px}
  .dyn .rg{font-size:11px;color:#d2c39c;flex:1;line-height:1.5}
  .dyn .yr2{font-size:10px;color:#a89870;white-space:nowrap}
  .dyn-note{font-size:10px;color:#8a7d5e;margin-top:3px;line-height:1.4}
  .grp{font-size:11.5px;font-weight:700;color:#e5c576;margin:10px 0 4px;padding-left:4px;border-left:3px solid #c9a227}
  .fz{font-size:10px;font-weight:400;color:#8a7d5e;margin-left:6px}
  .expand-hint{font-size:10.5px;color:#f5dc9a;font-weight:600;margin-top:6px;padding:3px 7px;display:inline-block;background:#3a3020;border:1px solid #6a5a34;border-radius:10px}
  .item.k-event .yr,.item.k-birth .yr,.item.k-death .yr{color:#f0d894}
  .dd{font-size:11.5px;line-height:1.62;margin-top:5px;color:#d2c39c}
  .badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px;
    vertical-align:middle;border:1px solid}
  .b-event{color:#c9a227;border-color:#5a4a20}
  .b-birth{color:#4f9d69;border-color:#2c4a34}
  .b-death{color:#a98ab8;border-color:#4a3a52}
  .more{text-align:center;font-size:11px;padding:10px;color:#8a7d5e}
  .empty{text-align:center;font-size:12px;padding:20px;color:#8a7d5e}
  .foot{max-width:720px;text-align:center;font-size:10px;margin-top:12px;line-height:1.7;
    color:#6a6048;border-top:1px dashed #3a3220;padding-top:8px}
  .foot a{color:#8a7d5e}
  .ver{text-align:center;font-size:9px;margin-top:6px;opacity:.35}
</style>
</head>
<body>
<a class="back" href="../">← 回已审查工具</a>
<div class="wrap">
  <header>
    <h1>📜 历史上的今天</h1>
    <div class="sub">365 天全收录 · 4700+ 条 · 离线可用</div>
    <div class="sub2">古代名人 1571 位 · 王朝年表 46 个 · 均标注出处</div>
  </header>
  <div class="datebar">
    <span>日期</span>
    <input id="dateInput" type="date">
    <button id="todayBtn">回到今天</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
  <div class="more" id="more" style="display:none">向下滚动加载更多…</div>
  <div class="foot">
    数据来源：百度百科「历史上的今天」公开接口 · 本工具离线打包，不联网、不收集数据<br>
    内容为百科条目原文摘要，年份与人物信息请点链接核对原条目
  </div>
  <div class="ver">v1.3.0-加王朝年表 20261023</div>
</div>
<script>
(function(){
  var PAGE = 10;
  var DATA = null;
  var state = { day:null, filter:'all', shown:0, items:[] };
  var TYPE_LABEL = { event:'历史事件', birth:'出生', death:'逝世' };
  var TABS = [
    {k:'all', label:'全部'},
    {k:'event', label:'历史事件'},
    {k:'birth', label:'出生'},
    {k:'death', label:'逝世'},
    {k:'famous', label:'古代名人'},
    {k:'dynasty', label:'王朝年表'}
  ];

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function todayKey(){
    var d = new Date();
    return pad(d.getMonth()+1) + pad(d.getDate());
  }
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function renderTabs(){
    if (state.filter === 'famous'){ renderFamousTabs(); return; }
    if (state.filter === 'dynasty'){
      var bx = document.getElementById('tabs'); bx.innerHTML = '';
      var t = el('div','tab on','🏛 王朝年表');
      bx.appendChild(t);
      return;
    }
    var box = document.getElementById('tabs');
    box.innerHTML = '';
    var all = (DATA && DATA.days[state.day]) || [];
    TABS.forEach(function(t){
      var n = t.k === 'all' ? all.length
        : t.k === 'famous' ? (FAMOUS ? FAMOUS.length : 0)
        : t.k === 'dynasty' ? (DYNASTY ? DYNASTY.length : 0)
        : all.filter(function(x){ return x.k === t.k; }).length;
      var d = el('div', 'tab' + (state.filter===t.k?' on':''), t.label);
      d.appendChild(el('span','n', n+''));
      d.onclick = function(){ state.filter = t.k; state.shown = PAGE; renderTabs(); renderList(true); };
      box.appendChild(d);
    });
  }

  var FAMOUS = null;
  var ERA_ORDER = ['秦汉及以前','三国','晋','南北朝','隋','唐','五代十国','宋','元','明','清','近代'];
  var famousState = { region:'中国', shown:30 };

  function famousGroups(){
    if (!FAMOUS) return [];
    var list = FAMOUS.filter(function(x){ return x.r === famousState.region; });
    var map = {}, order = [];
    list.forEach(function(x){
      var key = x.r === '中国' ? x.e : '外国';
      if (!map[key]){ map[key] = []; order.push(key); }
      map[key].push(x);
    });
    order.sort(function(a,b){
      var ia = ERA_ORDER.indexOf(a), ib = ERA_ORDER.indexOf(b);
      if (a === '外国') return 1;
      if (b === '外国') return -1;
      return ia - ib;
    });
    return order.map(function(k){
      var arr = map[k].slice().sort(function(a,b){ return a.y - b.y; });
      return { name:k, items:arr };
    });
  }

  function famousNode(x){
    var d = el('div','item k-' + (x.k === 'birth' ? 'birth' : 'death'));
    var top = el('div','yr', x.y + ' 年 · ' + (x.k === 'birth' ? '生' : '卒'));
    if (x.gz) top.appendChild(el('span','badge b-event', x.gz + (x.sx ? '·' + x.sx : '')));
    d.appendChild(top);
    if (x.ly) d.appendChild(el('div','lz','农历 ' + x.ly));
    var tt = el('div','tt');
    if (x.l){
      var a = document.createElement('a');
      a.href = x.l; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = x.t;
      tt.appendChild(a);
    } else tt.textContent = x.t;
    d.appendChild(tt);
    return d;
  }

  function renderFamous(reset){
    var list = document.getElementById('list');
    if (reset) list.innerHTML = '';
    var groups = famousGroups();
    var shown = 0;
    groups.forEach(function(g){
      if (shown >= famousState.shown) return;
      list.appendChild((function(){
        var hd = el('div','grp', g.name);
        hd.appendChild(el('span','fz','共 ' + g.items.length + ' 位'));
        return hd;
      })());
      for (var i = 0; i < g.items.length && shown < famousState.shown; i++){
        list.appendChild(famousNode(g.items[i]));
        shown++;
      }
    });
    var total = FAMOUS.filter(function(x){ return x.r === famousState.region; }).length;
    var more = document.getElementById('more');
    more.style.display = 'block';
    more.textContent = famousState.shown < total
      ? '向下滚动加载更多…（已显示 ' + shown + ' / ' + total + '）'
      : '—— 已全部显示（共 ' + total + ' 位）——';
  }

  var DYNASTY = null;

  function fmtYear(y, withGz){
    if (y === null || y === undefined) return '';
    var s = y < 0 ? '前' + (-y) : '' + y;
    return s;
  }

  function renderDynasty(){
    var list = document.getElementById('list');
    list.innerHTML = '';
    if (!DYNASTY || !DYNASTY.length){
      list.appendChild(el('div','empty','王朝数据未加载。'));
      return;
    }
    var hd = el('div','grp','🏛 中国历代王朝（共 ' + DYNASTY.length + ' 个）');
    list.appendChild(hd);
    DYNASTY.forEach(function(d){
      var row = el('div','dyn');
      row.appendChild(el('div','nm', d.n));
      var rg = el('div','rg', fmtYear(d.s) + ' 年 — ' + fmtYear(d.e) + ' 年');
      if (d.gzS) rg.textContent += '（' + d.gzS + '—' + d.gzE + '）';
      if (d.note) {
        var nt = el('div','dyn-note','※ ' + d.note);
        rg.appendChild(nt);
      }
      row.appendChild(rg);
      var span = Math.abs(d.e - d.s);
      row.appendChild(el('div','yr2', span + ' 年'));
      list.appendChild(row);
    });
    var more = document.getElementById('more');
    more.style.display = 'block';
    more.textContent = '—— 已全部显示（共 ' + DYNASTY.length + ' 个）——';
  }

  function renderFamousTabs(){
    var box = document.getElementById('tabs');
    box.innerHTML = '';
    var cn = FAMOUS.filter(function(x){ return x.r === '中国'; }).length;
    var fo = FAMOUS.length - cn;
    [['中国','中国 '+cn],['外国','外国 '+fo]].forEach(function(pair){
      var d = el('div','tab' + (famousState.region===pair[0]?' on':''), pair[1]);
      d.onclick = function(){ famousState.region = pair[0]; famousState.shown = 30; renderFamousTabs(); renderFamous(true); };
      box.appendChild(d);
    });
  }

  function filtered(){
    var all = (DATA && DATA.days[state.day]) || [];
    if (state.filter === 'all') return all;
    return all.filter(function(x){ return x.k === state.filter; });
  }

  function itemNode(it){
    var d = el('div', 'item k-' + (it.k || 'event'));
    var top = el('div', 'yr', (it.y ? it.y + ' 年' : '日期不详'));
    var badge = el('span', 'badge b-' + (it.k || 'event'), TYPE_LABEL[it.k] || '事件');
    top.appendChild(badge);
    d.appendChild(top);
    if (it.gz || it.ly){
      var lz = el('div','lz');
      var parts = [];
      if (it.gz) parts.push('农历 <b>' + it.gz + '年</b>' + (it.sx ? '（' + it.sx + '）' : ''));
      if (it.ly) parts.push(it.ly);
      lz.innerHTML = parts.join(' · ');
      d.appendChild(lz);
    }
    var tt = el('div', 'tt');
    if (it.l){
      var a = document.createElement('a');
      a.href = it.l; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = it.t;
      tt.appendChild(a);
    } else {
      tt.textContent = it.t;
    }
    d.appendChild(tt);
    if (it.d){
      var dd = el('div', 'dd', it.d);
      d.appendChild(dd);
      if (it.d.length > 90){
        dd.className = 'dd clip';
        var hint = el('div','expand-hint','▾ 点击展开全文');
        d.appendChild(hint);
        d.addEventListener('click', function(ev){
          if (ev.target.tagName === 'A') return;
          var clipped = dd.classList.toggle('clip');
          hint.textContent = clipped ? '▾ 点击展开全文' : '▴ 收起';
        });
      }
    }
    return d;
  }

  function renderList(reset){
    if (state.filter === 'famous'){ renderFamous(reset); return; }
    if (state.filter === 'dynasty'){ renderDynasty(); return; }
    var list = document.getElementById('list');
    if (reset) list.innerHTML = '';
    var arr = filtered();
    if (!arr.length){
      list.innerHTML = '';
      list.appendChild(el('div','empty','这一天没有收录条目。'));
      document.getElementById('more').style.display = 'none';
      return;
    }
    var end = Math.min(state.shown, arr.length);
    for (var i = (reset?0:0); i < end; i++){
      if (reset || i >= list.childElementCount){
        list.appendChild(itemNode(arr[i]));
      }
    }
    var more = document.getElementById('more');
    if (state.shown < arr.length){
      more.style.display = 'block';
      more.textContent = '向下滚动加载更多…（已显示 ' + end + ' / ' + arr.length + '）';
    } else {
      more.style.display = 'block';
      more.textContent = '—— 已全部显示（共 ' + arr.length + ' 条）——';
    }
  }

  function loadMore(){
    if (state.filter === 'dynasty') return;
    if (state.filter === 'famous'){
      if (!FAMOUS) return;
      var tot = FAMOUS.filter(function(x){ return x.r === famousState.region; }).length;
      if (famousState.shown >= tot) return;
      famousState.shown += 30;
      renderFamous(false);
      return;
    }
    var arr = filtered();
    if (state.shown >= arr.length) return;
    state.shown = Math.min(state.shown + PAGE, arr.length);
    renderList(false);
  }

  function setDay(key){
    state.day = key;
    state.shown = PAGE;
    if (state.filter !== 'famous') state.filter = 'all';
    var inp = document.getElementById('dateInput');
    var now = new Date();
    var y = now.getFullYear();
    var mo = parseInt(key.slice(0,2),10), da = parseInt(key.slice(2),10);
    inp.value = y + '-' + pad(mo) + '-' + pad(da);
    renderTabs();
    renderList(true);
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  document.getElementById('dateInput').addEventListener('change', function(e){
    if (!e.target.value) return;
    var p = e.target.value.split('-');
    setDay(p[1] + p[2]);
  });
  document.getElementById('todayBtn').onclick = function(){ setDay(todayKey()); };

  var ticking = false;
  window.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      var list = document.getElementById('list');
      var bottom = list.getBoundingClientRect().bottom;
      if (bottom - window.innerHeight < 300) loadMore();
      ticking = false;
    });
  }, { passive:true });

  document.getElementById('list').appendChild(el('div','empty','正在加载数据…'));

  function gzOfYear(y){
    var stems='甲乙丙丁戊己庚辛壬癸', branches='子丑寅卯辰巳午未申酉戌亥';
    if (!y || y===0) return '';
    var yy = y > 0 ? y - 4 : y - 3;
    var i = ((yy % 10) + 10) % 10, j = ((yy % 12) + 12) % 12;
    return stems[i] + branches[j];
  }

  Promise.all([
    fetch('data/events.json').then(function(r){ if(!r.ok) throw new Error('events '+r.status); return r.json(); }),
    fetch('data/famous.json').then(function(r){ if(!r.ok) throw new Error('famous '+r.status); return r.json(); }),
    fetch('data/dynasty.json').then(function(r){ if(!r.ok) throw new Error('dynasty '+r.status); return r.json(); })
  ])
    .then(function(res){
      DATA = res[0];
      FAMOUS = res[1];
      DYNASTY = res[2];
      DYNASTY.forEach(function(d){
        d.gzS = gzOfYear(d.s);
        d.gzE = gzOfYear(d.e);
      });
      setDay(todayKey());
    })
    .catch(function(err){
      document.getElementById('list').innerHTML = '';
      document.getElementById('list').appendChild(el('div','empty','数据加载失败（' + err.message + '），请刷新重试。'));
    });
})();
</script>
</body>
</html>
