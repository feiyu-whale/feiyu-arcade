<script>
// ============================================================
// 第一部分：核心算法源码
// ============================================================

/**
 * GB/T 6451 标准规定的油浸式电力变压器标准容量档位（kVA）
 * 采用 R10 优先数系，覆盖 30kVA 至 10000kVA
 * 数据来源：GB/T 6451-2015《油浸式电力变压器技术参数和要求》
 * @type {number[]}
 */
const STANDARD_CAPACITIES = [
  30, 50, 63, 80, 100, 125, 160, 200, 250, 315,
  400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150,
  4000, 5000, 6300, 8000, 10000
];

/**
 * 计算变压器所需容量（kVA）
 *
 * 公式：S = P × Kd / cosφ
 * 其中：
 *   S  —— 变压器额定容量（kVA）
 *   P  —— 负载总有功功率（kW）
 *   Kd —— 需用系数（0 < Kd ≤ 1），反映负载同时使用率
 *   cosφ —— 功率因数（0 < cosφ ≤ 1）
 *
 * @param {number} loadPower - 负载总有功功率，单位 kW，必须 > 0
 * @param {number} powerFactor - 功率因数 cosφ，范围 (0, 1]，典型值 0.8~0.95
 * @param {number} demandFactor - 需用系数 Kd，范围 (0, 1]，典型值 0.6~0.9
 * @returns {number} 计算所得变压器容量（kVA），未经档位选取
 * @throws {Error} 参数不合法时抛出错误
 *
 * @example
 * calculateCapacity(500, 0.85, 0.75); // 返回约 441.18 kVA
 */
function calculateCapacity(loadPower, powerFactor, demandFactor) {
  if (typeof loadPower !== 'number' || typeof powerFactor !== 'number' || typeof demandFactor !== 'number') {
    throw new Error('所有参数必须为数字类型');
  }
  if (!Number.isFinite(loadPower) || !Number.isFinite(powerFactor) || !Number.isFinite(demandFactor)) {
    throw new Error('所有参数必须为有限数值，不允许 NaN 或 Infinity');
  }
  if (loadPower <= 0) {
    throw new Error('负载功率必须大于 0 kW');
  }
  if (powerFactor <= 0 || powerFactor > 1) {
    throw new Error('功率因数必须在 (0, 1] 范围内');
  }
  if (demandFactor <= 0 || demandFactor > 1) {
    throw new Error('需用系数必须在 (0, 1] 范围内');
  }
  return (loadPower * demandFactor) / powerFactor;
}

/**
 * 从标准容量档位中选取不小于计算值的最小标准容量
 *
 * 依据 GB/T 6451 标准容量序列，向上选取最近的标准档位。
 * 若计算值超出最大标准档位（10000kVA），返回 null 并附带提示。
 *
 * @param {number} calculatedCapacity - 计算所得容量（kVA），必须 > 0
 * @returns {{ selected: number, isExact: boolean, exceedsMax: boolean, message: string }}
 *   - selected: 选取的标准容量（kVA），超出范围时为 null
 *   - isExact: 计算值是否恰好等于某标准档位
 *   - exceedsMax: 是否超出最大标准档位
 *   - message: 附加说明信息
 * @throws {Error} 参数不合法时抛出错误
 *
 * @example
 * selectStandardCapacity(441.18);
 * // { selected: 500, isExact: false, exceedsMax: false, message: "向上选取标准档位 500 kVA" }
 */
function selectStandardCapacity(calculatedCapacity) {
  if (typeof calculatedCapacity !== 'number' || !Number.isFinite(calculatedCapacity)) {
    throw new Error('参数必须为有限数值');
  }
  if (calculatedCapacity <= 0) {
    throw new Error('容量必须大于 0');
  }

  // 检查是否恰好等于某标准档位（考虑浮点精度）
  const epsilon = 1e-9;
  const isExact = STANDARD_CAPACITIES.some(c => Math.abs(c - calculatedCapacity) < epsilon);

  if (calculatedCapacity > STANDARD_CAPACITIES[STANDARD_CAPACITIES.length - 1]) {
    return {
      selected: null,
      isExact: false,
      exceedsMax: true,
      message: `计算值 ${calculatedCapacity.toFixed(2)} kVA 超出本标准工具最大档位 ${STANDARD_CAPACITIES[STANDARD_CAPACITIES.length - 1]} kVA，需选用特殊规格或多台变压器并联`
    };
  }

  // 向上选取不小于计算值的最小标准档位
  let selected = null;
  for (let i = 0; i < STANDARD_CAPACITIES.length; i++) {
    if (STANDARD_CAPACITIES[i] >= calculatedCapacity - epsilon) {
      selected = STANDARD_CAPACITIES[i];
      break;
    }
  }

  return {
    selected: selected,
    isExact: isExact,
    exceedsMax: false,
    message: isExact
      ? `计算值恰好等于标准档位 ${selected} kVA`
      : `向上选取标准档位 ${selected} kVA（计算值 ${calculatedCapacity.toFixed(2)} kVA）`
  };
}

/**
 * 完整计算流程：输入参数 → 计算容量 → 选取标准档位 → 返回结果
 *
 * @param {number} loadPower - 负载总有功功率（kW）
 * @param {number} powerFactor - 功率因数 cosφ
 * @param {number} demandFactor - 需用系数 Kd
 * @returns {{
 *   loadPower: number,
 *   powerFactor: number,
 *   demandFactor: number,
 *   rawCapacity: number,
 *   selectedCapacity: number|null,
 *   isExact: boolean,
 *   exceedsMax: boolean,
 *   loadRate: number|null,
 *   message: string,
 *   warning: string|null
 * }}
 *   - rawCapacity: 原始计算容量
 *   - selectedCapacity: 选取的标准容量
 *   - loadRate: 负载率（rawCapacity / selectedCapacity），仅当选取成功时有效
 *   - warning: 负载率过低或过高时的警告
 *
 * @example
 * fullCalculation(500, 0.85, 0.75);
 */
function fullCalculation(loadPower, powerFactor, demandFactor) {
  const rawCapacity = calculateCapacity(loadPower, powerFactor, demandFactor);
  const selection = selectStandardCapacity(rawCapacity);

  let loadRate = null;
  let warning = null;

  if (selection.selected !== null) {
    loadRate = rawCapacity / selection.selected;
    if (loadRate < 0.4) {
      warning = `负载率仅 ${(loadRate * 100).toFixed(1)}%，变压器长期轻载运行效率偏低，建议复核负载数据或考虑更小容量`;
    } else if (loadRate > 0.85) {
      warning = `负载率达 ${(loadRate * 100).toFixed(1)}%，接近满载运行，建议考虑留有裕量或选高一档容量`;
    }
  }

  return {
    loadPower: loadPower,
    powerFactor: powerFactor,
    demandFactor: demandFactor,
    rawCapacity: rawCapacity,
    selectedCapacity: selection.selected,
    isExact: selection.isExact,
    exceedsMax: selection.exceedsMax,
    loadRate: loadRate,
    message: selection.message,
    warning: warning
  };
}

/**
 * 获取所有标准容量档位列表
 * @returns {number[]} 标准容量数组的副本
 */
function getStandardCapacities() {
  return [...STANDARD_CAPACITIES];
}

/**
 * 格式化计算结果为可读字符串
 * @param {object} result - fullCalculation 返回的结果对象
 * @returns {string} 格式化的结果文本
 */
function formatResult(result) {
  let text = '';
  text += `═══════════════════════════════════════\n`;
  text += `  变压器容量计算结果\n`;
  text += `═══════════════════════════════════════\n`;
  text += `输入参数：\n`;
  text += `  负载功率：${result.loadPower} kW\n`;
  text += `  功率因数：${result.powerFactor}\n`;
  text += `  需用系数：${result.demandFactor}\n`;
  text += `───────────────────────────────────────\n`;
  text += `计算结果：\n`;
  text += `  理论容量：${result.rawCapacity.toFixed(2)} kVA\n`;
  if (result.selectedCapacity !== null) {
    text += `  标准容量：${result.selectedCapacity} kVA\n`;
    text += `  负载率：${(result.loadRate * 100).toFixed(1)}%\n`;
  } else {
    text += `  标准容量：超出范围\n`;
  }
  text += `  说明：${result.message}\n`;
  if (result.warning) {
    text += `  ⚠ 警告：${result.warning}\n`;
  }
  text += `═══════════════════════════════════════\n`;
  return text;
}


// ============================================================
// 第二部分：单元测试
// ============================================================

let testResults = [];

/**
 * 断言函数：判断条件是否为真
 * @param {boolean} condition - 断言条件
 * @param {string} testName - 测试名称
 * @param {string} [detail] - 失败时的详细信息
 */
function assert(condition, testName, detail) {
  if (condition) {
    testResults.push({ name: testName, pass: true });
  } else {
    testResults.push({ name: testName, pass: false, detail: detail || '' });
  }
}

/**
 * 断言两个数值近似相等（考虑浮点精度）
 * @param {number} actual - 实际值
 * @param {number} expected - 期望值
 * @param {string} testName - 测试名称
 * @param {number} [tolerance=1e-6] - 容差
 */
function assertApprox(actual, expected, testName, tolerance) {
  tolerance = tolerance || 1e-6;
  const pass = Math.abs(actual - expected) < tolerance;
  if (pass) {
    testResults.push({ name: testName, pass: true });
  } else {
    testResults.push({
      name: testName,
      pass: false,
      detail: `期望 ${expected}，实际 ${actual}，差值 ${Math.abs(actual - expected)}`
    });
  }
}

/**
 * 断言函数抛出指定类型的错误
 * @param {Function} fn - 被测试的函数
 * @param {string} testName - 测试名称
 * @param {string} [errorMsgPart] - 期望错误信息中包含的字符串
 */
function assertThrows(fn, testName, errorMsgPart) {
  try {
    fn();
    testResults.push({ name: testName, pass: false, detail: '期望抛出异常但未抛出' });
  } catch (e) {
    if (errorMsgPart && !e.message.includes(errorMsgPart)) {
      testResults.push({ name: testName, pass: false, detail: `期望错误包含"${errorMsgPart}"，实际为"${e.message}"` });
    } else {
      testResults.push({ name: testName, pass: true });
    }
  }
}

/**
 * 运行全部单元测试
 */
function runAllTests() {
  testResults = [];

  // ---- calculateCapacity 正常值测试 ----

  // 测试1：基本计算 500kW, pf=0.85, kd=0.75
  assertApprox(
    calculateCapacity(500, 0.85, 0.75),
    (500 * 0.75) / 0.85,
    'T01: 基本计算 500kW/pf0.85/kd0.75'
  );

  // 测试2：100kW, pf=0.9, kd=0.8
  assertApprox(
    calculateCapacity(100, 0.9, 0.8),
    (100 * 0.8) / 0.9,
    'T02: 基本计算 100kW/pf0.9/kd0.8'
  );

  // 测试3：1000kW, pf=0.8, kd=0.7
  assertApprox(
    calculateCapacity(1000, 0.8, 0.7),
    (1000 * 0.7) / 0.8,
    'T03: 基本计算 1000kW/pf0.8/kd0.7'
  );

  // 测试4：功率因数为1（纯阻性负载）
  assertApprox(
    calculateCapacity(200, 1.0, 0.8),
    200 * 0.8,
    'T04: 功率因数=1时 S=P×Kd'
  );

  // 测试5：需用系数为1（全部负载同时运行）
  assertApprox(
    calculateCapacity(300, 0.85, 1.0),
    300 / 0.85,
    'T05: 需用系数=1时 S=P/cosφ'
  );

  // 测试6：极小负载
  assertApprox(
    calculateCapacity(0.1, 0.8, 0.5),
    (0.1 * 0.5) / 0.8,
    'T06: 极小负载 0.1kW'
  );

  // 测试7：极大负载
  assertApprox(
    calculateCapacity(50000, 0.9, 0.85),
    (50000 * 0.85) / 0.9,
    'T07: 极大负载 50000kW'
  );

  // 测试8：低功率因数 0.5
  assertApprox(
    calculateCapacity(100, 0.5, 0.8),
    (100 * 0.8) / 0.5,
    'T08: 低功率因数 0.5'
  );

  // 测试9：低需用系数 0.3
  assertApprox(
    calculateCapacity(500, 0.85, 0.3),
    (500 * 0.3) / 0.85,
    'T09: 低需用系数 0.3'
  );

  // 测试10：典型工业场景 800kW, pf=0.85, kd=0.75
  assertApprox(
    calculateCapacity(800, 0.85, 0.75),
    (800 * 0.75) / 0.85,
    'T10: 典型工业场景 800kW'
  );

  // ---- calculateCapacity 异常输入测试 ----

  // 测试11：负载功率为0
  assertThrows(
    () => calculateCapacity(0, 0.85, 0.75),
    'T11: 负载功率为0应抛异常',
    '大于 0'
  );

  // 测试12：负载功率为负
  assertThrows(
    () => calculateCapacity(-100, 0.85, 0.75),
    'T12: 负载功率为负应抛异常',
    '大于 0'
  );

  // 测试13：功率因数为0
  assertThrows(
    () => calculateCapacity(100, 0, 0.75),
    'T13: 功率因数为0应抛异常',
    '(0, 1]'
  );

  // 测试14：功率因数大于1
  assertThrows(
    () => calculateCapacity(100, 1.1, 0.75),
    'T14: 功率因数>1应抛异常',
    '(0, 1]'
  );

  // 测试15：功率因数为负
  assertThrows(
    () => calculateCapacity(100, -0.5, 0.75),
    'T15: 功率因数为负应抛异常'
  );

  // 测试16：需用系数为0
  assertThrows(
    () => calculateCapacity(100, 0.85, 0),
    'T16: 需用系数为0应抛异常',
    '(0, 1]'
  );

  // 测试17：需用系数大于1
  assertThrows(
    () => calculateCapacity(100, 0.85, 1.5),
    'T17: 需用系数>1应抛异常',
    '(0, 1]'
  );

  // 测试18：参数为字符串
  assertThrows(
    () => calculateCapacity('100', 0.85, 0.75),
    'T18: 字符串类型参数应抛异常',
    '数字类型'
  );

  // 测试19：参数为NaN
  assertThrows(
    () => calculateCapacity(NaN, 0.85, 0.75),
    'T19: NaN参数应抛异常',
    '有限数值'
  );

  // 测试20：参数为Infinity
  assertThrows(
    () => calculateCapacity(Infinity, 0.85, 0.75),

  );

  // 测试29：selectStandardCapacity 异常 - 0

  );

  // ---- fullCalculation 综合测试 ----

  // 测试31：完整流程 - 标准档位选取

  // 测试32：完整流程 - 负载率计算

  // ---- 精度与边界测试 ----

  // 测试36：浮点精度 - 0.1+0.2 场景

  // 测试38：getStandardCapacities 返回副本

  return testResults;
}

/**
 * 在页面上运行测试并展示结果
 */
function runTests() {
  const results = runAllTests();
  const passed = results.filter(r => r.pass).length;
  const total = results.length;
  const allPass = passed === total;

  let html = `<div class="test-result ${allPass ? 'test-pass' : 'test-fail'}">`;
  html += allPass ? `✅ 全部通过 ${passed} / 共 ${total}` : `❌ 通过 ${passed} / 共 ${total}（${total - passed} 项失败）`;
  html += `</div>`;
  html += `<div class="test-detail">`;
  results.forEach(r => {
    html += `<div class="test-item ${r.pass ? 'pass' : 'fail'}">`;
    html += r.pass ? `✓ ${r.name}` : `✗ ${r.name} —— ${r.detail}`;
    html += `</div>`;
  });
  html += `</div>`;

  document.getElementById('testOutput').innerHTML = html;
}

<h2>六、常见错误与注意事项</h2>

<p>最常见错误是将未补偿的功率因数与补偿后的混淆。若系统已安装无功补偿装置，必须使用补偿后的功率因数。错误取值可导致容量偏差 20%~40%。</p>

<h3>6.2 需用系数选取不当</h3>
<p>需用系数不是固定值，与负载类型、运行模式、行业特性密切相关。照搬其他项目的需用系数可能导致严重偏差。建议参考《工业与民用配电设计手册》或同类项目实测数据。</p>

<h3>6.3 忽略谐波影响</h3>
<p>非线性负载（变频器、LED 照明、开关电源等）产生谐波电流，增加变压器额外损耗和温升。本工具未考虑谐波因素。当谐波畸变率 THD > 5% 时，建议容量增加 10%~25%（需查相关标准确认具体修正方法）。</p>

<h3>6.4 未考虑未来发展裕量</h3>

<li><strong>变压器自身损耗：</strong>空载损耗和负载损耗影响实际可用容量。</li>

// 填充源码
document.getElementById('sourceCode').textContent = `/**
 * 变压器容量计算工具 - 核心算法
 * 依据 GB/T 6451-2015 标准容量档位
 * 版本：v2.0.0-完整版 20261021
 */

/**
 * GB/T 6451 标准规定的油浸式电力变压器标准容量档位（kVA）
 * 采用 R10 优先数系，覆盖 30kVA 至 10000kVA
 * @type {number[]}
 */
const STANDARD_CAPACITIES = [
  30, 50, 63, 80, 100, 125, 160, 200, 250, 315,
  400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150,
  4000, 5000, 6300, 8000, 10000
];

/**
 * 计算变压器所需容量（kVA）
 * 公式：S = P × Kd / cosφ
 * @param {number} loadPower - 负载总有功功率（kW），必须 > 0
 * @param {number} powerFactor - 功率因数 cosφ，范围 (0, 1]
 * @param {number} demandFactor - 需用系数 Kd，范围 (0, 1]
 * @returns {number} 计算所得变压器容量（kVA）
 * @throws {Error} 参数不合法时抛出错误
 */
function calculateCapacity(loadPower, powerFactor, demandFactor) {
  if (typeof loadPower !== 'number' || typeof powerFactor !== 'number' || typeof demandFactor !== 'number') {
    throw new Error('所有参数必须为数字类型');
  }
  if (!Number.isFinite(loadPower) || !Number.isFinite(powerFactor) || !Number.isFinite(demandFactor)) {
    throw new Error('所有参数必须为有限数值，不允许 NaN 或 Infinity');
  }
  if (loadPower <= 0) {
    throw new Error('负载功率必须大于 0 kW');
  }
  if (powerFactor <= 0 || powerFactor > 1) {
    throw new Error('功率因数必须在 (0, 1] 范围内');
  }
  if (demandFactor <= 0 || demandFactor > 1) {
    throw new Error('需用系数必须在 (0, 1] 范围内');
  }
  return (loadPower * demandFactor) / powerFactor;
}

/**
 * 从标准容量档位中选取不小于计算值的最小标准容量
 * @param {number} calculatedCapacity - 计算所得容量（kVA），必须 > 0
 * @returns {{ selected: number, isExact: boolean, exceedsMax: boolean, message: string }}
 * @throws {Error} 参数不合法时抛出错误
 */
function selectStandardCapacity(calculatedCapacity) {
  if (typeof calculatedCapacity !== 'number' || !Number.isFinite(calculatedCapacity)) {
    throw new Error('参数必须为有限数值');
  }
  if (calculatedCapacity <= 0) {
    throw new Error('容量必须大于 0');
  }
  const epsilon = 1e-9;
  const isExact = STANDARD_CAPACITIES.some(c => Math.abs(c - calculatedCapacity) < epsilon);
  if (calculatedCapacity > STANDARD_CAPACITIES[STANDARD_CAPACITIES.length - 1]) {
    return {
      selected: null, isExact: false, exceedsMax: true,
      message: \`计算值 \${calculatedCapacity.toFixed(2)} kVA 超出最大档位 \${STANDARD_CAPACITIES[STANDARD_CAPACITIES.length - 1]} kVA\`
    };
  }
  let selected = null;
  for (let i = 0; i < STANDARD_CAPACITIES.length; i++) {
    if (STANDARD_CAPACITIES[i] >= calculatedCapacity - epsilon) {
      selected = STANDARD_CAPACITIES[i];
      break;
    }
  }
  return { selected, isExact, exceedsMax: false, message: isExact ? \`恰好等于标准档位 \${selected} kVA\` : \`向上选取标准档位 \${selected} kVA\` };
}

/**
 * 完整计算流程
 * @param {number} loadPower - 负载总有功功率（kW）
 * @param {number} powerFactor - 功率因数
 * @param {number} demandFactor - 需用系数
 * @returns {object} 完整计算结果
 */
function fullCalculation(loadPower, powerFactor, demandFactor) {
  const rawCapacity = calculateCapacity(loadPower, powerFactor, demandFactor);
  const selection = selectStandardCapacity(rawCapacity);
  let loadRate = null, warning = null;
  if (selection.selected !== null) {
    loadRate = rawCapacity / selection.selected;
    if (loadRate < 0.4) warning = \`负载率仅 \${(loadRate*100).toFixed(1)}%，建议复核\`;
    else if (loadRate > 0.85) warning = \`负载率达 \${(loadRate*100).toFixed(1)}%，接近满载\`;
  }
  return { loadPower, powerFactor, demandFactor, rawCapacity, selectedCapacity: selection.selected, isExact: selection.isExact, exceedsMax: selection.exceedsMax, loadRate, message: selection.message, warning };
}

/**
 * 获取所有标准容量档位列表
 * @returns {number[]} 标准容量数组的副本
 */
function getStandardCapacities() { return [...STANDARD_CAPACITIES]; }

/**
 * 格式化计算结果为可读字符串
 * @param {object} result - fullCalculation 返回的结果对象
 * @returns {string} 格式化的结果文本
 */
function formatResult(result) {
  let text = '═══════════════════════════════════════\\n';
  text += '  变压器容量计算结果\\n';
  text += '═══════════════════════════════════════\\n';
  text += \`输入参数：负载 \${result.loadPower}kW, cosφ=\${result.powerFactor}, Kd=\${result.demandFactor}\\n\`;
  text += \`理论容量：\${result.rawCapacity.toFixed(2)} kVA\\n\`;
  text += result.selectedCapacity ? \`标准容量：\${result.selectedCapacity} kVA, 负载率：\${(result.loadRate*100).toFixed(1)}%\\n\` : '标准容量：超出范围\\n';
  text += \`说明：\${result.message}\\n\`;
  if (result.warning) text += \`⚠ \${result.warning}\\n\`;
  text += '═══════════════════════════════════════';
  return text;
}`;

// ====== 计算界面逻辑（v2.1.0 新增） ======
function trCalc(){
  var out=document.getElementById('trOut'), err=document.getElementById('trErr');
  out.classList.remove('show'); err.classList.remove('show');
  function num(id){ var e=document.getElementById(id); if(!e) return NaN; var v=String(e.value).trim(); return v===''?NaN:parseFloat(v); }
  var load=num('trLoad'), pf=num('trPF'), df=num('trDF');
  if(isNaN(load)||isNaN(pf)||isNaN(df)){ err.textContent='⚠ 三项都要填'; err.classList.add('show'); return; }
  try{
    var r=fullCalculation(load, pf, df);
    var f2=function(v){ return (v===null||v===undefined)?'—':(Math.round(v*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); };
    var html='<div><span class="k">计算容量：</span><span class="v">'+f2(r.rawCapacity)+' kVA</span></div>';
    if(r.selectedCapacity!==null){
      html+='<div><span class="k">选用标准档位：</span><span class="v">'+r.selectedCapacity+' kVA</span>'+(r.isExact?' <span style="color:#1a7f37;font-size:13px">（正好等于标准值）</span>':'')+'</div>';
      if(r.loadRate!==null) html+='<div><span class="k">实际负载率：</span><span class="v">'+(r.loadRate*100).toFixed(1)+'%</span></div>';
    } else {
      html+='<div><span class="k">选用标准档位：</span><span class="v" style="color:#c0392b">超出最大标准档位（10000 kVA）</span></div>';
    }
    if(r.message) html+='<div style="font-size:13px;color:#5a6a7a;margin-top:6px">'+r.message+'</div>';
    if(r.warning) html+='<div class="tr-warn">💡 '+r.warning+'</div>';
    out.innerHTML=html;
    out.classList.add('show');
  }catch(e){ err.textContent='⚠ '+e.message; err.classList.add('show'); }
}
