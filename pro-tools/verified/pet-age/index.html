<script>
// ============================================================
// 第一部分：JS 源码
// ============================================================

/**
 * 宠物年龄换算核心模块
 * 依据：AAHA（美国动物医院协会）犬猫生命阶段指南、
 *       WSAVA（世界小动物兽医协会）年龄换算建议
 * 注意：本换算为通行估算，个体差异大，不构成兽医诊断依据。
 */

/**
 * 犬体型分类枚举
 * @readonly
 * @enum {string}
 */
const DogSize = Object.freeze({
  SMALL: 'small',     // 小型犬 <10kg
  MEDIUM: 'medium',   // 中型犬 10-25kg
  LARGE: 'large',     // 大型犬 25-45kg
  GIANT: 'giant'      // 巨型犬 >45kg
});

/**
 * 生命阶段枚举
 * @readonly
 * @enum {string}
 */
const LifeStage = Object.freeze({
  JUVENILE: '幼年',
  YOUNG: '青年',
  ADULT: '成年',
  SENIOR: '老年'
});

/**
 * 犬体型对应的每年老化速率（第3年起，每年增加的等效人类年龄）
 * 数据来源：AAHA Canine Life Stages 指南中的通行估算值
 * @type {Object.<string, number>}
 */
const DOG_AGING_RATE = Object.freeze({
  [DogSize.SMALL]: 4,
  [DogSize.MEDIUM]: 5,
  [DogSize.LARGE]: 6,
  [DogSize.GIANT]: 7
});

/**
 * 犬各体型的老年起始年龄（犬龄，单位：年）
 * 数据来源：AAHA 犬生命阶段划分
 * @type {Object.<string, number>}
 */
const DOG_SENIOR_THRESHOLD = Object.freeze({
  [DogSize.SMALL]: 11,
  [DogSize.MEDIUM]: 10,
  [DogSize.LARGE]: 8,
  [DogSize.GIANT]: 7
});

/**
 * 猫每年老化速率（第3年起）
 * 数据来源：AAHA/AAFP 猫生命阶段指南
 * @type {number}
 */
const CAT_AGING_RATE = 4;

/**
 * 猫的老年起始年龄（猫龄，单位：年）
 * @type {number}
 */
const CAT_SENIOR_THRESHOLD = 10;

/**
 * 犬最大合理寿命（年）
 * @type {number}
 */
const DOG_MAX_AGE = 30;

/**
 * 猫最大合理寿命（年）
 * @type {number}
 */
const CAT_MAX_AGE = 35;

/**
 * 根据犬体重（kg）判断体型分类
 *
 * @param {number} weightKg - 犬体重，单位千克，必须 > 0
 * @returns {string} 体型分类，值为 DogSize 枚举之一
 * @throws {Error} 当 weightKg 不是正数时抛出
 *
 * @example
 * getDogSizeByWeight(8);   // 'small'
 * getDogSizeByWeight(10);  // 'medium'（边界归入中型）
 * getDogSizeByWeight(25);  // 'large'（边界归入大型）
 * getDogSizeByWeight(45);  // 'giant'（边界归入巨型）
 * getDogSizeByWeight(60);  // 'giant'
 */
function getDogSizeByWeight(weightKg) {
  if (typeof weightKg !== 'number' || !isFinite(weightKg)) {
    throw new Error('体重必须为有限数字');
  }
  if (weightKg <= 0) {
    throw new Error('体重必须为正数');
  }
  if (weightKg < 10) return DogSize.SMALL;
  if (weightKg < 25) return DogSize.MEDIUM;
  if (weightKg < 45) return DogSize.LARGE;
  return DogSize.GIANT;
}

/**
 * 将犬年龄换算为等效人类年龄
 *
 * 换算规则（依据 AAHA 通行估算）：
 * - 第 1 年：等效人类 15 岁
 * - 第 2 年：累计等效人类 24 岁（即第 2 年增加 9 岁）
 * - 第 3 年起：每年按体型增加 4-7 岁
 *   - 小型犬：每年 +4
 *   - 中型犬：每年 +5
 *   - 大型犬：每年 +6
 *   - 巨型犬：每年 +7
 *
 * @param {number} dogAge - 犬年龄，单位年，范围 [0, 30]，支持小数
 * @param {string} size - 体型分类，值为 DogSize 枚举之一
 * @returns {number} 等效人类年龄（保留一位小数）
 * @throws {Error} 当参数非法时抛出
 *
 * @example
 * convertDogAgeToHuman(1, 'small');   // 15
 * convertDogAgeToHuman(2, 'small');   // 24
 * convertDogAgeToHuman(5, 'small');   // 36
 * convertDogAgeToHuman(5, 'giant');   // 45
 * convertDogAgeToHuman(0.5, 'small'); // 7.5
 */
function convertDogAgeToHuman(dogAge, size) {
  if (typeof dogAge !== 'number' || !isFinite(dogAge)) {
    throw new Error('犬年龄必须为有限数字');
  }
  if (dogAge < 0) {
    throw new Error('犬年龄不能为负数');
  }
  if (dogAge > DOG_MAX_AGE) {
    throw new Error('犬年龄超出合理范围（最大 ' + DOG_MAX_AGE + ' 岁）');
  }
  if (!Object.values(DogSize).includes(size)) {
    throw new Error('无效的体型分类：' + size);
  }

  if (dogAge <= 1) {
    return Math.round(dogAge * 15 * 10) / 10;
  }
  if (dogAge <= 2) {
    return Math.round((15 + (dogAge - 1) * 9) * 10) / 10;
  }
  var rate = DOG_AGING_RATE[size];
  var humanAge = 24 + (dogAge - 2) * rate;
  return Math.round(humanAge * 10) / 10;
}

/**
 * 将猫年龄换算为等效人类年龄
 *
 * 换算规则（依据 AAHA/AAFP 通行估算）：
 * - 第 1 年：等效人类 15 岁
 * - 第 2 年：累计等效人类 24 岁（即第 2 年增加 9 岁）
 * - 第 3 年起：每年增加 4 岁
 *
 * @param {number} catAge - 猫年龄，单位年，范围 [0, 35]，支持小数
 * @returns {number} 等效人类年龄（保留一位小数）
 * @throws {Error} 当参数非法时抛出
 *
 * @example
 * convertCatAgeToHuman(1);    // 15
 * convertCatAgeToHuman(2);    // 24
 * convertCatAgeToHuman(5);    // 36
 * convertCatAgeToHuman(10);   // 56
 * convertCatAgeToHuman(0.5);  // 7.5
 */
function convertCatAgeToHuman(catAge) {
  if (typeof catAge !== 'number' || !isFinite(catAge)) {
    throw new Error('猫年龄必须为有限数字');
  }
  if (catAge < 0) {
    throw new Error('猫年龄不能为负数');
  }
  if (catAge > CAT_MAX_AGE) {
    throw new Error('猫年龄超出合理范围（最大 ' + CAT_MAX_AGE + ' 岁）');
  }

  if (catAge <= 1) {
    return Math.round(catAge * 15 * 10) / 10;
  }
  if (catAge <= 2) {
    return Math.round((15 + (catAge - 1) * 9) * 10) / 10;
  }
  var humanAge = 24 + (catAge - 2) * CAT_AGING_RATE;
  return Math.round(humanAge * 10) / 10;
}

/**
 * 获取犬的生命阶段
 *
 * 划分依据（参考 AAHA 犬生命阶段指南）：
 * - 幼年：0 - 1 岁
 * - 青年：1 - 2 岁
 * - 成年：2 岁 - 老年阈值（按体型不同：小型11岁、中型10岁、大型8岁、巨型7岁）
 * - 老年：老年阈值及以上
 *
 * @param {number} dogAge - 犬年龄，单位年
 * @param {string} size - 体型分类
 * @returns {string} 生命阶段，值为 LifeStage 枚举之一
 * @throws {Error} 当参数非法时抛出
 *
 * @example
 * getDogLifeStage(0.5, 'small');  // '幼年'
 * getDogLifeStage(1.5, 'small');  // '青年'
 * getDogLifeStage(5, 'small');    // '成年'
 * getDogLifeStage(12, 'small');   // '老年'
 * getDogLifeStage(8, 'large');    // '老年'
 */
function getDogLifeStage(dogAge, size) {
  if (typeof dogAge !== 'number' || !isFinite(dogAge)) {
    throw new Error('犬年龄必须为有限数字');
  }
  if (dogAge < 0) {
    throw new Error('犬年龄不能为负数');
  }
  if (!Object.values(DogSize).includes(size)) {
    throw new Error('无效的体型分类：' + size);
  }

  if (dogAge < 1) return LifeStage.JUVENILE;
  if (dogAge < 2) return LifeStage.YOUNG;
  if (dogAge < DOG_SENIOR_THRESHOLD[size]) return LifeStage.ADULT;
  return LifeStage.SENIOR;
}

/**
 * 获取猫的生命阶段
 *
 * 划分依据（参考 AAHA/AAFP 猫生命阶段指南）：
 * - 幼年：0 - 1 岁
 * - 青年：1 - 3 岁
 * - 成年：3 - 10 岁
 * - 老年：10 岁及以上
 *
 * @param {number} catAge - 猫年龄，单位年
 * @returns {string} 生命阶段，值为 LifeStage 枚举之一
 * @throws {Error} 当参数非法时抛出
 *
 * @example
 * getCatLifeStage(0.5);  // '幼年'
 * getCatLifeStage(2);    // '青年'
 * getCatLifeStage(5);    // '成年'
 * getCatLifeStage(12);   // '老年'
 */
function getCatLifeStage(catAge) {
  if (typeof catAge !== 'number' || !isFinite(catAge)) {
    throw new Error('猫年龄必须为有限数字');
  }
  if (catAge < 0) {
    throw new Error('猫年龄不能为负数');
  }

  if (catAge < 1) return LifeStage.JUVENILE;
  if (catAge < 3) return LifeStage.YOUNG;
  if (catAge < CAT_SENIOR_THRESHOLD) return LifeStage.ADULT;
  return LifeStage.SENIOR;
}

/**
 * 综合换算：输入宠物类型、年龄、体重（犬），返回完整结果
 *
 * @param {Object} params - 输入参数
 * @param {string} params.species - 物种，'dog' 或 'cat'
 * @param {number} params.age - 宠物年龄，单位年
 * @param {number} [params.weightKg] - 体重（仅犬需要），单位千克
 * @returns {Object} 换算结果
 * @returns {number} returns.humanAge - 等效人类年龄
 * @returns {string} returns.lifeStage - 生命阶段
 * @returns {string} [returns.dogSize] - 体型分类（仅犬）
 * @returns {string} returns.disclaimer - 免责声明
 * @throws {Error} 当参数非法时抛出
 *
 * @example
 * calculatePetAge({ species: 'dog', age: 5, weightKg: 8 });
 * // { humanAge: 36, lifeStage: '成年', dogSize: 'small', disclaimer: '...' }
 *
 * calculatePetAge({ species: 'cat', age: 3 });
 * // { humanAge: 28, lifeStage: '青年', disclaimer: '...' }
 */
function calculatePetAge(params) {
  if (!params || typeof params !== 'object') {
    throw new Error('参数必须为对象');
  }
  var species = params.species;
  var age = params.age;
  var weightKg = params.weightKg;

  if (species !== 'dog' && species !== 'cat') {
    throw new Error('物种必须为 "dog" 或 "cat"');
  }
  if (typeof age !== 'number' || !isFinite(age)) {
    throw new Error('年龄必须为有限数字');
  }

  var disclaimer = '换算为通行估算，个体差异大，不构成兽医诊断依据。数据来源：AAHA/WSAVA 通行标准。';

  if (species === 'dog') {
    if (typeof weightKg !== 'number' || !isFinite(weightKg)) {
      throw new Error('犬需要体重参数（weightKg）');
    }
    var size = getDogSizeByWeight(weightKg);
    var humanAge = convertDogAgeToHuman(age, size);
    var lifeStage = getDogLifeStage(age, size);
    return {
      humanAge: humanAge,
      lifeStage: lifeStage,
      dogSize: size,
      disclaimer: disclaimer
    };
  }

  // cat
  var catHumanAge = convertCatAgeToHuman(age);
  var catLifeStage = getCatLifeStage(age);
  return {
    humanAge: catHumanAge,
    lifeStage: catLifeStage,
    disclaimer: disclaimer
  };
}

// 导出到全局（浏览器环境）
if (typeof window !== 'undefined') {
  window.DogSize = DogSize;
  window.LifeStage = LifeStage;
  window.getDogSizeByWeight = getDogSizeByWeight;
  window.convertDogAgeToHuman = convertDogAgeToHuman;
  window.convertCatAgeToHuman = convertCatAgeToHuman;
  window.getDogLifeStage = getDogLifeStage;
  window.getCatLifeStage = getCatLifeStage;
  window.calculatePetAge = calculatePetAge;
}
</script>

<script>
// ============================================================
// 第二部分：单元测试
// ============================================================

var testResults = [];
var testCount = 0;
var passCount = 0;

/**
 * 简易断言函数
 * @param {string} name - 测试名称
 * @param {boolean} condition - 断言条件
 * @param {string} [detail] - 失败时的详细信息
 */
function assert(name, condition, detail) {
  testCount++;
  if (condition) {
    passCount++;
    testResults.push('✅ PASS: ' + name);
  } else {
    testResults.push('❌ FAIL: ' + name + (detail ? ' — ' + detail : ''));
  }
}

/**
 * 断言两个值近似相等（浮点数比较）
 * @param {string} name - 测试名称
 * @param {number} actual - 实际值
 * @param {number} expected - 期望值
 * @param {number} [tolerance=0.15] - 容差
 */
function assertApprox(name, actual, expected, tolerance) {
  tolerance = tolerance || 0.15;
  var pass = Math.abs(actual - expected) <= tolerance;
  assert(name, pass, '期望 ' + expected + '，实际 ' + actual);
}

/**
 * 断言函数抛出异常
 * @param {string} name - 测试名称
 * @param {Function} fn - 要执行的函数
 */
function assertThrows(name, fn) {
  var threw = false;
  try {
    fn();
  } catch (e) {
    threw = true;
  }
  assert(name, threw, '期望抛出异常但未抛出');
}

function runAllTests() {
  testResults = [];
  testCount = 0;
  passCount = 0;

  // === 犬年龄换算测试 ===

  // 1. 犬 0 岁 → 人类 0 岁
  assertApprox('犬0岁(small)→人类0岁', convertDogAgeToHuman(0, 'small'), 0);

  // 2. 犬 1 岁 → 人类 15 岁
  assertApprox('犬1岁(small)→人类15岁', convertDogAgeToHuman(1, 'small'), 15);

  // 3. 犬 2 岁 → 人类 24 岁
  assertApprox('犬2岁(small)→人类24岁', convertDogAgeToHuman(2, 'small'), 24);

  // 4. 犬 3 岁(small) → 人类 28 岁 (24+4)
  assertApprox('犬3岁(small)→人类28岁', convertDogAgeToHuman(3, 'small'), 28);

  // 5. 犬 5 岁(small) → 人类 36 岁 (24+3*4)
  assertApprox('犬5岁(small)→人类36岁', convertDogAgeToHuman(5, 'small'), 36);

  // 6. 犬 10 岁(small) → 人类 56 岁 (24+8*4)
  assertApprox('犬10岁(small)→人类56岁', convertDogAgeToHuman(10, 'small'), 56);

  // 7. 犬 1 岁(medium) → 人类 15 岁
  assertApprox('犬1岁(medium)→人类15岁', convertDogAgeToHuman(1, 'medium'), 15);

  // 8. 犬 2 岁(medium) → 人类 24 岁

<tr><td>"物种必须为 dog 或 cat"</td><td>传入了其他物种</td><td>本工具仅支持犬和猫</td></tr>
<tr><td>"参数必须为对象"</td><td>calculatePetAge 未传入对象参数</td><td>传入 { species, age, weightKg } 格式的对象</td></tr>
</table>

<h2>七、生命阶段划分说明</h2>

<h3>7.1 犬生命阶段</h3>
<table>
<tr><th>阶段</th><th>年龄范围</th><th>说明</th></tr>
<tr><td>幼年</td><td>0 ~ 1 岁</td><td>快速生长期，相当于人类 0-15 岁</td></tr>
<tr><td>青年</td><td>1 ~ 2 岁</td><td>性成熟完成，体型基本定型</td></tr>
<tr><td>成年</td><td>2 岁 ~ 老年阈值</td><td>稳定期，老年阈值因体型而异</td></tr>
<tr><td>老年</td><td>老年阈值 ~ 寿命终点</td><td>需关注老年病、关节、器官功能</td></tr>
</table>

<h3>7.2 猫生命阶段</h3>
<table>
<tr><th>阶段</th><th>年龄范围</th><th>说明</th></tr>
<tr><td>幼年</td><td>0 ~ 1 岁</td><td>快速生长期</td></tr>
<tr><td>青年</td><td>1 ~ 3 岁</td><td>完全成熟</td></tr>
<tr><td>成年</td><td>3 ~ 10 岁</td><td>稳定期</td></tr>
<tr><td>老年</td><td>10 岁以上</td><td>需关注肾脏、甲状腺等</td></tr>
</table>

<h2>八、局限性说明</h2>

<div class="warning">
<strong>⚠️ 以下局限性使用者必须了解：</strong>
</div>

<ol>
<li><strong>无国家标准：</strong>经查询，中国目前没有针对宠物年龄换算的国家标准（GB/T）。本工具依据的是 AAHA、WSAVA 等国际组织的通行做法，属于行业惯例而非强制标准。</li>

<li><strong>个体差异大：</strong>同一品种、同一体型的犬猫，因遗传、营养、疾病、生活环境等因素，实际衰老速度可能差异显著。本工具给出的是群体统计意义上的估算值。</li>

<li><strong>品种差异未细分：</strong>犬的换算仅按体重分 4 档，未考虑具体品种。例如同样 8kg 的吉娃娃和迷你腊肠犬，衰老模式可能有差异。如需更精确的品种级数据，需查标准原文或咨询兽医。</li>

<li><strong>换算公式为线性近似：</strong>实际衰老曲线并非完美线性，本工具在第 3 年后采用线性外推，是一种简化处理。部分研究提出对数模型或分段非线性模型，但尚未形成统一标准。</li>

<li><strong>不精确到月：</strong>本工具不输出精确到月的等效人类年龄。对于幼年期（0-2 岁）的换算，月龄差异可能导致较大的人龄差异，但本工具仅以年为单位（支持小数年）。</li>

<li><strong>最大年龄限制：</strong>犬 30 岁、猫 35 岁为合理上限。超出此范围的输入将被拒绝。实际中极少数个体可能超过此年龄，但对应的换算结果可靠性极低。</li>

<li><strong>不构成兽医诊断：</strong>本工具仅供科普和参考，不能替代兽医的专业评估。宠物的实际健康状况需通过体检、血液检查等手段综合判断。</li>

<li><strong>数据来源的时效性：</strong>AAHA/WSAVA 的指南可能随研究进展更新。本工具基于截至编写时的通行数据，如有更新需同步修订。</li>

<li><strong>混种/杂交动物：</strong>对于混种犬猫，体重分类可能不完全适用其实际衰老模式。建议以实际体重为准，但理解结果可能有偏差。</li>

<li><strong>绝育/去势影响：</strong>有研究表明绝育/去势可能影响宠物寿命和衰老速度，但本工具未纳入此因素。</li>
</ol>

<h2>九、API 接口说明</h2>

<h3>9.1 calculatePetAge(params)</h3>
<p>综合换算入口函数。</p>
<table>
<tr><th>参数</th><th>类型</th><th>必填</th><th>说明</th></tr>
<tr><td>params.species</td><td>string</td><td>是</td><td>"dog" 或 "cat"</td></tr>
<tr><td>params.age</td><td>number</td><td>是</td><td>宠物年龄（年），支持小数</td></tr>
<tr><td>params.weightKg</td><td>number</td><td>犬必填</td><td>体重（kg），仅犬需要</td></tr>
</table>
<p><strong>返回值：</strong></p>
<table>
<tr><th>字段</th><th>类型</th><th>说明</th></tr>
<tr><td>humanAge</td><td>number</td><td>等效人类年龄</td></tr>
<tr><td>lifeStage</td><td>string</td><td>生命阶段（幼年/青年/成年/老年）</td></tr>
<tr><td>dogSize</td><td>string</td><td>体型分类（仅犬返回）</td></tr>
<tr><td>disclaimer</td><td>string</td><td>免责声明文本</td></tr>
</table>

<p>犬年龄→人类年龄纯换算函数。</p>

<h3>9.3 convertCatAgeToHuman(catAge)</h3>
<p>猫年龄→人类年龄纯换算函数。</p>

// ====== 换算界面逻辑（v2.1.0 新增） ======
function paToggleWeight(){
  var sp=document.getElementById('paSpecies').value;
  document.getElementById('paWeightWrap').style.display = (sp==='cat')?'none':'block';
}
function paCalc(){
  var err=document.getElementById('paErr'), out=document.getElementById('paOut');
  err.classList.remove('show'); out.classList.remove('show');
  var sp=document.getElementById('paSpecies').value;
  var ageRaw=document.getElementById('paAge').value.trim();
  var wRaw=document.getElementById('paWeight').value.trim();
  if(ageRaw===''){ err.textContent='⚠ 请填写宠物的实际年龄'; err.classList.add('show'); return; }
  var age=parseFloat(ageRaw);
  if(isNaN(age)||age<0){ err.textContent='⚠ 年龄必须是不小于 0 的数字'; err.classList.add('show'); return; }
  var params={species:sp, age:age};
  if(sp==='dog'){
    if(wRaw===''){ err.textContent='⚠ 狗的换算需要体重（体型会影响老化速度）'; err.classList.add('show'); return; }
    var w=parseFloat(wRaw);
    if(isNaN(w)||w<=0){ err.textContent='⚠ 体重必须是大于 0 的数字'; err.classList.add('show'); return; }
    params.weightKg=w;
  }
  try{
    var r=calculatePetAge(params);
    var sizeText='';
    if(r.dogSize){
      var m={small:'小型犬',medium:'中型犬',large:'大型犬',giant:'巨型犬'};
      sizeText='<div class="row"><span class="lab">体型判定：</span> <b>'+(m[r.dogSize]||r.dogSize)+'</b></div>';
    }
    out.innerHTML='<div class="row"><span class="lab">相当于人类</span></div>'+
      '<div class="row"><span class="big">'+r.humanAge+'</span> <span class="lab">岁</span></div>'+
      '<div class="row"><span class="lab">生命阶段：</span> <b>'+r.lifeStage+'</b></div>'+
      sizeText+
      '<div class="row" style="margin-top:12px;font-size:12px;color:#8899aa">'+r.disclaimer+'</div>';
    out.classList.add('show');
  }catch(e){ err.textContent='⚠ '+e.message; err.classList.add('show'); }
}
paToggleWeight();

function switchTab(index) {
  var btns = document.querySelectorAll('.tab-btn');
  var contents = document.querySelectorAll('.tab-content');
  btns.forEach(function(btn, i) {
    btn.classList.toggle('active', i === index);
  });
  contents.forEach(function(content, i) {
    content.classList.toggle('active', i === index);
  });
}
