<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🍚 白饭大爆炸</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0604;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}

  /* ── 启动页 ── */
  #gate{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#1a1208,#080502 70%);color:#e8d9b8;text-align:center;padding:24px}
  #gate h1{font-size:30px;letter-spacing:3px;margin-bottom:14px;
    background:linear-gradient(180deg,#fff8e0,#e0b040 60%,#8a5a10);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,200,80,.45))}
  #gate p{font-size:13px;line-height:2;color:#a89070;margin-bottom:24px}
  #gate button{padding:15px 52px;font-size:19px;font-weight:700;letter-spacing:4px;cursor:pointer;
    background:linear-gradient(180deg,#f0c060,#d09020);border:none;border-radius:50px;color:#2a1a05;
    box-shadow:0 0 34px rgba(240,190,90,.55),inset 0 -3px 0 rgba(0,0,0,.22);
    font-family:inherit;opacity:1;transition:opacity .2s}
  /* 呼吸光改到外层伪元素，避免按钮本体缩放导致点击抖动 */
  #gate button::after{content:'';position:absolute;inset:-6px;border-radius:56px;
    border:2px solid rgba(255,210,120,.5);animation:pulse 1.5s ease-in-out infinite;pointer-events:none}
  #gate button{position:relative}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.07);opacity:.2}}
  #gate .esc{margin-top:22px;font-size:11px;color:#6a5a44;letter-spacing:1px}

  /* ── 舞台 ── */
  #stage{position:fixed;inset:0;display:none}
  #stage.on{display:block}

  /* 背景脉冲 */
  #bg{position:absolute;inset:0;
    background:radial-gradient(circle at 50% 50%,#3a1c08 0%,#150a04 55%,#000 100%);
    animation:bgpulse 2.6s ease-in-out infinite}
  @keyframes bgpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.55)}}

  /* 旋转符文环（魔性） */
  #ring{position:absolute;left:50%;top:50%;width:150vmin;height:150vmin;margin:-75vmin 0 0 -75vmin;
    border:2px dashed rgba(255,190,80,.10);border-radius:50%;animation:spin 22s linear infinite}
  #ring2{position:absolute;left:50%;top:50%;width:110vmin;height:110vmin;margin:-55vmin 0 0 -55vmin;
    border:1px solid rgba(255,120,40,.08);border-radius:50%;animation:spinR 16s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinR{to{transform:rotate(-360deg)}}

  /* 饭碗 */
  .bowl{position:absolute;font-size:64px;line-height:1;pointer-events:none;
    animation:hop var(--d,1.1s) cubic-bezier(.34,1.56,.64,1) infinite;
    filter:drop-shadow(0 0 14px rgba(255,210,110,.75)) drop-shadow(0 0 30px rgba(255,150,40,.35));
    will-change:transform}
  @keyframes hop{
    0%{transform:translateY(0) scale(1) rotate(0deg)}
    22%{transform:translateY(-58px) scale(1.22) rotate(9deg)}
    45%{transform:translateY(0) scale(.86,1.14) rotate(-6deg)}
    60%{transform:translateY(-14px) scale(1.06) rotate(3deg)}
    100%{transform:translateY(0) scale(1) rotate(0deg)}
  }
  .bowl.rage{animation:hop .34s linear infinite, shkv .09s linear infinite}
  @keyframes shkv{0%,100%{margin-left:0}50%{margin-left:3px}}

  /* 冲击波 */
  .shock{position:absolute;border-radius:50%;border:3px solid rgba(255,220,140,.85);
    pointer-events:none;animation:shock .8s ease-out forwards}
  @keyframes shock{from{width:0;height:0;opacity:1;margin:0}
    to{width:70vmin;height:70vmin;opacity:0;margin:-35vmin 0 0 -35vmin}}

  /* 台词 */
  #line{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:clamp(22px,5.6vw,52px);
    font-weight:900;letter-spacing:5px;color:#fff4d0;pointer-events:none;
    text-shadow:0 0 22px rgba(255,190,70,.95),0 0 46px rgba(255,110,20,.65),0 4px 0 #6a3000;
    animation:linePop .5s cubic-bezier(.2,1.8,.4,1)}
  @keyframes linePop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

  /* 红色警告闪烁 */
  #flash{position:absolute;inset:0;background:rgba(255,20,20,.42);opacity:0;pointer-events:none;mix-blend-mode:screen}
  #flash.on{animation:fl .22s steps(2) infinite}
  @keyframes fl{0%,100%{opacity:0}50%{opacity:1}}

  /* 抖动整个舞台 */
  #stage.shake{animation:shk .3s linear infinite}
  @keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}
    50%{transform:translate(4px,-4px)}75%{transform:translate(-3px,-2px)}}

  /* 退出按钮 */
  #quit{position:fixed;top:12px;right:12px;z-index:9000;width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(255,220,150,.4);background:rgba(20,12,6,.72);color:#e8cf98;
    font-size:17px;cursor:pointer;display:none;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);font-family:inherit}
  #quit.on{display:flex}
  #quit:hover{background:rgba(60,30,10,.9)}

  /* 角落提示 */
  #hint2{position:fixed;left:12px;bottom:10px;z-index:9000;font-size:10px;color:rgba(255,220,160,.28);
    letter-spacing:.5px;display:none}
  #hint2.on{display:block}

  .ver{position:fixed;right:12px;bottom:10px;font-size:9px;color:rgba(255,220,160,.16);z-index:9000}
</style>
</head>
<body>

<div id="gate">
  <h1>🍚 白饭大爆炸</h1>
  <p>
    这是一个纯前端的小玩笑，<b>不是病毒</b>，不读写文件、不联网、不收集任何数据。<br>
    点下面的按钮开始 —— 随时按 <b>Esc</b> 退出。
  </p>
  <button id="startBtn">开 饭</button>
  <div class="esc">Esc / Q 退出 · 右上角 × 退出 · 连点屏幕五下也能退出</div>
</div>

<div id="stage">
  <div id="bg"></div>
  <div id="ring"></div>
  <div id="ring2"></div>
  <div id="layer"></div>
  <div id="line"></div>
  <div id="flash"></div>
</div>

<button id="quit" title="退出 (Esc)">✕</button>
<div id="hint2">Esc 退出</div>
<div class="ver">v1.1.0-加大音量 20261024</div>

<script>
(function(){
  'use strict';

  var gate    = document.getElementById('gate');
  var stage   = document.getElementById('stage');
  var layer   = document.getElementById('layer');
  var lineEl  = document.getElementById('line');
  var flash   = document.getElementById('flash');
  var quitBtn = document.getElementById('quit');
  var hint2   = document.getElementById('hint2');

  var running = false;
  var timers  = [];
  var audioCtx = null;
  var masterGain = null;
  var bowlCount = 0;
  var MAX_BOWLS = 120;
  var tapCount = 0, tapTimer = null;

  var LINES = [
    '开——饭——了——',
    '白 饭 ！',
    '才、才不胖！',
    '老爹，吃饭了',
    '再吃一碗嘛……',
    '米饭真香……',
    '你 饿 了 吗',
    '这条鱼不吃饭',
    '🍚 饭 🍚 饭 🍚',
    '别熬夜，吃饭',
    '一粒都不能剩',
    '吃 ！饭 ！'
  ];

  /* ────────── 音频：全部 Web Audio 实时合成，零外部文件 ────────── */
  function initAudio(){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.55;          // 2026-10-24 老爹要求：要吓人，音量拉高
      masterGain.connect(audioCtx.destination);
      startDrone();
    } catch(e){ audioCtx = null; }
  }

  // 低频嗡鸣（压迫感铺底）
  function startDrone(){
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    var lfo = audioCtx.createOscillator();
    var lfoGain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.value = 42;                 // 更深沉的低频
    gain.gain.value = 0.14;

    // 低通滤波，闷一点
    var filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 220;
    filt.Q.value = 6;

    // 缓慢起伏
    lfo.frequency.value = 0.18;
    lfoGain.gain.value = 0.035;
    lfo.connect(lfoGain);
    lfoGain.connect(gain.gain);

    osc.connect(filt);
    filt.connect(gain);
    gain.connect(masterGain);

    osc.start();
    lfo.start();

    // 再加一个五度，制造不和谐感
    var osc2 = audioCtx.createOscillator();
    var g2 = audioCtx.createGain();
    osc2.type = 'triangle';
    osc2.frequency.value = 63.0;              // 加厚五度
    g2.gain.value = 0.075;
    osc2.connect(g2);
    g2.connect(masterGain);
    osc2.start();

    window.__drone = [osc, osc2, lfo];
  }

  // 跳动音：啵
  function blip(freq, dur, type, vol){
    if (!audioCtx) return;
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.45), audioCtx.currentTime + dur);
      g.gain.setValueAtTime((vol || 0.13) * 2.2, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g);
      g.connect(masterGain);
      o.start();
      o.stop(audioCtx.currentTime + dur + 0.02);
    } catch(e){}
  }

  // 木鱼/鼓点
  function knock(){
    if (!audioCtx) return;
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      var f = audioCtx.createBiquadFilter();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(58, audioCtx.currentTime + 0.12);
      f.type = 'lowpass';
      f.frequency.value = 800;
      g.gain.setValueAtTime(0.55, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);
      o.connect(f); f.connect(g); g.connect(masterGain);
      o.start(); o.stop(audioCtx.currentTime + 0.2);
    } catch(e){}
  }

  // 语音念白（系统 TTS，压低音调拖长）
  function speak(text){
    try {
      if (!('speechSynthesis' in window)) return;
      var u = new SpeechSynthesisUtterance(text.replace(/[🍚！]/g, ''));
      u.lang = 'zh-CN';
      u.rate = 0.52;        // 更拖
      u.pitch = 0.35;       // 压得更低
      u.volume = 1.0;
      var vs = speechSynthesis.getVoices().filter(function(v){ return /zh|Chinese/i.test(v.lang); });
      if (vs.length) u.voice = vs[0];
      speechSynthesis.speak(u);
    } catch(e){}
  }

  /* ────────── 饭碗生成 ────────── */
  var GLYPHS = ['🍚','🍚','🍚','🍙','🥢','🍚'];
  function spawnBowl(){
    if (bowlCount >= MAX_BOWLS) return;
    var b = document.createElement('div');
    b.className = 'bowl';
    var g = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    b.textContent = g;
    var size = 40 + Math.random() * 72;
    b.style.fontSize = size + 'px';
    b.style.left = (Math.random() * 92) + 'vw';
    b.style.top  = (Math.random() * 82) + 'vh';
    b.style.setProperty('--d', (0.55 + Math.random() * 0.95) + 's');
    b.style.animationDelay = (Math.random() * 0.6) + 's';
    layer.appendChild(b);
    bowlCount++;

    // 落地音
    if (Math.random() < 0.34) blip(320 + Math.random() * 420, 0.14, 'sine', 0.07);
  }

  function rageMode(){
    // 狂暴：所有碗加速乱抖 + 红屏 + 震屏
    var all = layer.querySelectorAll('.bowl');
    for (var i = 0; i < all.length; i++) all[i].classList.add('rage');
    flash.classList.add('on');
    stage.classList.add('shake');
    knock();
    speak('开——饭——了——');

    timers.push(setTimeout(function(){
      flash.classList.remove('on');
      stage.classList.remove('shake');
      var b2 = layer.querySelectorAll('.bowl');
      for (var j = 0; j < b2.length; j++) b2[j].classList.remove('rage');
    }, 2600));
  }

  function shockwave(){
    var s = document.createElement('div');
    s.className = 'shock';
    s.style.left = (20 + Math.random() * 60) + 'vw';
    s.style.top  = (20 + Math.random() * 50) + 'vh';
    layer.appendChild(s);
    setTimeout(function(){ try{ layer.removeChild(s); }catch(e){} }, 900);
  }

  var li = 0;
  function nextLine(){
    lineEl.textContent = LINES[li % LINES.length];
    lineEl.style.animation = 'none';
    void lineEl.offsetWidth;
    lineEl.style.animation = 'linePop .5s cubic-bezier(.2,1.8,.4,1)';
    li++;
  }

  /* ────────── 主循环 ────────── */
  function start(){
    if (running) return;
    running = true;

    gate.style.display = 'none';
    stage.classList.add('on');
    quitBtn.classList.add('on');
    hint2.classList.add('on');

    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    speak('开——饭——了——');

    // 起始爆一波
    for (var i = 0; i < 14; i++) spawnBowl();

    // 持续生成
    timers.push(setInterval(function(){
      spawnBowl();
      if (Math.random() < 0.4) blip(280 + Math.random() * 500, 0.11, 'square', 0.05);
    }, 230));

    // 台词轮播
    nextLine();
    timers.push(setInterval(nextLine, 1900));

    // 冲击波
    timers.push(setInterval(function(){ if (Math.random() < 0.55) shockwave(); }, 1500));

    // 低频敲击节奏
    timers.push(setInterval(knock, 820));

    // 每 7 秒来一次狂暴
    timers.push(setInterval(rageMode, 7000));

    // 开场 2 秒：全音量炸一次（吓一跳的关键）
    timers.push(setTimeout(function(){
      if (!audioCtx) return;
      // 低频重击三连
      knock();
      timers.push(setTimeout(knock, 180));
      timers.push(setTimeout(knock, 400));
      // 高频扫频尖叫
      try {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(120, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.9);
        g.gain.setValueAtTime(0.34, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.0);
        o.connect(g); g.connect(masterGain);
        o.start(); o.stop(audioCtx.currentTime + 1.05);
      } catch(e){}
      speak('开——饭——了——');
      rageMode();
    }, 2000));

    // 第一轮狂暴再往后
    timers.push(setTimeout(rageMode, 9000));
  }

  /* ────────── 退出 ────────── */
  function stop(){
    if (!running) return;
    running = false;

    for (var i = 0; i < timers.length; i++){ clearInterval(timers[i]); clearTimeout(timers[i]); }
    timers = [];

    try {
      if ('speechSynthesis' in window) speechSynthesis.cancel();
    } catch(e){}

    if (audioCtx){
      try {
        if (window.__drone){
          window.__drone.forEach(function(o){ try{ o.stop(); }catch(e){} });
          window.__drone = null;
        }
        audioCtx.close();
      } catch(e){}
      audioCtx = null;
      masterGain = null;
    }

    // 清空舞台
    layer.innerHTML = '';
    bowlCount = 0;
    lineEl.textContent = '';
    flash.classList.remove('on');
    stage.classList.remove('shake');
    stage.classList.remove('on');
    quitBtn.classList.remove('on');
    hint2.classList.remove('on');

    // 回到启动页
    gate.style.display = 'flex';
    li = 0;
    lineEl.style.animation = 'none';
  }

  /* ────────── 退出触发 ────────── */
  document.addEventListener('keydown', function(e){
    if (!running) return;
    var k = (e.key || '').toLowerCase();
    if (k === 'escape' || k === 'esc' || k === 'q'){
      e.preventDefault();
      stop();
    }
  });

  quitBtn.addEventListener('click', function(e){
    e.stopPropagation();
    stop();
  });

  // 连点五下退出（手机用）
  document.addEventListener('pointerdown', function(){
    if (!running) return;
    tapCount++;
    if (tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(function(){ tapCount = 0; }, 1200);
    if (tapCount >= 5){ tapCount = 0; stop(); }
  });

  document.getElementById('startBtn').addEventListener('click', function(e){
    e.stopPropagation();
    start();
  });

  // 预加载语音列表
  try { if ('speechSynthesis' in window) speechSynthesis.getVoices(); } catch(e){}

  // 页面隐藏时暂停声音，避免切后台还在响
  document.addEventListener('visibilitychange', function(){
    if (document.hidden && running){
      try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){}
    }
  });

})();
</script>
</body>
</html>
