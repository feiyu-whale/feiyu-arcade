<script>
/* ============================================================
   第一部分：JS 源码（固定资产折旧核心算法）
   ============================================================ */

/**
 * 将数值四舍五入到 2 位小数
 * @param {number} n - 待处理数值
 * @returns {number} 保留 2 位小数的数值
 */
function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

/**
 * 校验折旧计算的输入参数
 * @param {number} cost - 固定资产原值（元），必须 > 0
 * @param {number} salvage - 预计净残值（元），必须 >= 0 且 < cost
 * @param {number} life - 预计使用年限（年），必须为正整数
 * @throws {TypeError} 参数类型不正确或非数值
 * @throws {RangeError} 参数超出合理范围
 * @returns {void}
 * @example
 *   validateInputs(10000, 1000, 5); // 通过
 *   validateInputs(0, 0, 5);        // 抛出 RangeError
 *   validateInputs(-100, 0, 5);     // 抛出 RangeError
 */
function validateInputs(cost, salvage, life) {
  if (typeof cost !== 'number' || isNaN(cost)) {
    throw new TypeError('原值必须为有效数字');
  }
  if (typeof salvage !== 'number' || isNaN(salvage)) {
    throw new TypeError('预计净残值必须为有效数字');
  }
  if (typeof life !== 'number' || isNaN(life)) {
    throw new TypeError('使用年限必须为有效数字');
  }
  if (cost <= 0) {
    throw new RangeError('原值必须大于 0');
  }
  if (salvage < 0) {
    throw new RangeError('预计净残值不能为负数');
  }
  if (salvage >= cost) {
    throw new RangeError('预计净残值必须小于原值');
  }
  if (!Number.isInteger(life) || life <= 0) {
    throw new RangeError('使用年限必须为正整数');
  }
}

/**
 * 直线法（年限平均法）折旧计算
 * 公式：年折旧额 = (原值 - 预计净残值) / 预计使用年限
 * 依据：《企业会计准则第4号——固定资产》第十七条
 *
 * @param {number} cost - 固定资产原值（元），> 0
 * @param {number} salvage - 预计净残值（元），>= 0 且 < cost
 * @param {number} life - 预计使用年限（年），正整数
 * @returns {Array<{year:number, beginningValue:number, depreciation:number, accumulatedDepreciation:number, endingValue:number}>}
 *   返回每年的折旧明细数组，包含期初账面价值、当年折旧额、累计折旧、期末账面价值
 * @throws {TypeError} 参数类型错误
 * @throws {RangeError} 参数超出范围
 * @example
 *   straightLineDepreciation(10000, 1000, 5);
 *   // => [
 *   //   {year:1, beginningValue:10000, depreciation:1800, accumulatedDepreciation:1800, endingValue:8200},
 *   //   {year:2, beginningValue:8200, depreciation:1800, accumulatedDepreciation:3600, endingValue:6400},
 *   //   ...
 *   // ]
 */
function straightLineDepreciation(cost, salvage, life) {
  validateInputs(cost, salvage, life);
  const depreciableBase = cost - salvage;
  const annualDepreciation = depreciableBase / life;

  const schedule = [];
  let accumulated = 0;

  for (let year = 1; year <= life; year++) {
    const beginningValue = cost - accumulated;
    // 最后一年用减法保证累计折旧精确等于应折旧总额，避免浮点误差
    const depreciation = (year === life)
      ? depreciableBase - annualDepreciation * (life - 1)
      : annualDepreciation;
    accumulated += depreciation;

    schedule.push({
      year: year,
      beginningValue: round2(beginningValue),
      depreciation: round2(depreciation),
      accumulatedDepreciation: round2(accumulated),
      endingValue: round2(cost - accumulated)
    });
  }
  return schedule;
}

/**
 * 双倍余额递减法折旧计算
 * 公式：年折旧率 = 2 / 预计使用年限
 *       年折旧额 = 期初账面净值 × 年折旧率
 *       最后两年改为直线法：(账面净值 - 残值) / 2
 * 依据：《企业会计准则第4号——固定资产》第十九条
 *
 * @param {number} cost - 固定资产原值（元），> 0
 * @param {number} salvage - 预计净残值（元），>= 0 且 < cost
 * @param {number} life - 预计使用年限（年），正整数
 * @returns {Array<{year:number, beginningValue:number, depreciation:number, accumulatedDepreciation:number, endingValue:number}>}
 *   返回每年的折旧明细数组
 * @throws {TypeError} 参数类型错误
 * @throws {RangeError} 参数超出范围
 * @example
 *   doubleDecliningBalance(10000, 1000, 5);
 *   // => 第1年折旧 4000，第2年折旧 2400，第3、4、5年按直线法分摊剩余
 */
function doubleDecliningBalance(cost, salvage, life) {
  validateInputs(cost, salvage, life);
  const rate = 2 / life;
  const schedule = [];
  let bookValue = cost;
  let accumulated = 0;

  for (let year = 1; year <= life; year++) {
    const beginningValue = bookValue;
    let depreciation;

    if (year >= life - 1) {
      // 最后两年（含）改为直线法，平均分摊剩余应折旧金额
      const remainingYears = life - year + 1;
      depreciation = (bookValue - salvage) / remainingYears;
    } else {
      depreciation = bookValue * rate;
    }

    bookValue -= depreciation;
    accumulated += depreciation;

    schedule.push({
      year: year,
      beginningValue: round2(beginningValue),
      depreciation: round2(depreciation),
      accumulatedDepreciation: round2(accumulated),
      endingValue: round2(bookValue)
    });
  }
  return schedule;
}

/**
 * 年数总和法折旧计算
 * 公式：年数总和 = n(n+1)/2
 *       第 k 年折旧率 = (n - k + 1) / 年数总和
 *       年折旧额 = (原值 - 残值) × 折旧率
 * 依据：《企业会计准则第4号——固定资产》第十九条
 *
 * @param {number} cost - 固定资产原值（元），> 0
 * @param {number} salvage - 预计净残值（元），>= 0 且 < cost
 * @param {number} life - 预计使用年限（年），正整数
 * @returns {Array<{year:number, beginningValue:number, depreciation:number, accumulatedDepreciation:number, endingValue:number}>}
 *   返回每年的折旧明细数组
 * @throws {TypeError} 参数类型错误
 * @throws {RangeError} 参数超出范围
 * @example
 *   sumOfYearsDigits(10000, 1000, 5);
 *   // => 年数总和 = 15
 *   //   第1年折旧 = 9000 × 5/15 = 3000
 *   //   第2年折旧 = 9000 × 4/15 = 2400
 *   //   ...
 */
function sumOfYearsDigits(cost, salvage, life) {
  validateInputs(cost, salvage, life);
  const depreciableBase = cost - salvage;
  const sumOfYears = life * (life + 1) / 2;
  const schedule = [];
  let accumulated = 0;

  for (let year = 1; year <= life; year++) {
    const beginningValue = cost - accumulated;
    const remainingLife = life - year + 1;
    const depreciation = depreciableBase * remainingLife / sumOfYears;
    accumulated += depreciation;

    schedule.push({
      year: year,
      beginningValue: round2(beginningValue),
      depreciation: round2(depreciation),
      accumulatedDepreciation: round2(depreciation + (accumulated - depreciation)),
      endingValue: round2(cost - accumulated)
    });
  }

  // 修正最后一年的累计折旧，保证等于应折旧总额
  if (schedule.length > 0) {
    const last = schedule[schedule.length - 1];
    last.accumulatedDepreciation = round2(depreciableBase);
    last.endingValue = round2(salvage);
  }
  return schedule;
}

/**
 * 根据方法名称统一调度折旧计算
 * @param {'sl'|'ddb'|'syd'} method - 折旧方法代码
 * @param {number} cost - 原值
 * @param {number} salvage - 残值
 * @param {number} life - 年限
 * @returns {Array<Object>} 折旧明细
 * @throws {Error} 方法代码不支持
 */
function calculateDepreciation(method, cost, salvage, life) {
  switch (method) {
    case 'sl':  return straightLineDepreciation(cost, salvage, life);
    case 'ddb': return doubleDecliningBalance(cost, salvage, life);
    case 'syd': return sumOfYearsDigits(cost, salvage, life);
    default: throw new Error('不支持的折旧方法：' + method);
  }
}

/* ============================================================
   第二部分：单元测试（纯 JS 实现，35 个用例）
   ============================================================ */

let testPass = 0;
let testTotal = 0;
let testLog = [];

function log(msg) { testLog.push(msg); }

function assertEqual(actual, expected, msg) {
  testTotal++;
  if (JSON.stringify(actual) === JSON.stringify(expected)) {
    testPass++;
    log('[PASS] ' + msg);
  } else {
    log('[FAIL] ' + msg + ' | 期望 ' + JSON.stringify(expected) + '，实际 ' + JSON.stringify(actual));
  }
}

function assertApprox(actual, expected, tolerance, msg) {
  testTotal++;
  if (Math.abs(actual - expected) <= tolerance) {
    testPass++;
    log('[PASS] ' + msg);
  } else {
    log('[FAIL] ' + msg + ' | 期望 ~' + expected + '，实际 ' + actual + '（容差 ' + tolerance + '）');
  }
}

function assertThrows(fn, msg) {
  testTotal++;
  try {
    fn();
    log('[FAIL] ' + msg + ' | 期望抛出异常但未抛出');
  } catch (e) {
    testPass++;
    log('[PASS] ' + msg + ' | 抛出：' + e.message);
  }
}

function runAllTests() {
  testPass = 0;
  testTotal = 0;
  testLog = [];

  log('========== 固定资产折旧单元测试 ==========\n');

  // ---------- 直线法 ----------
  log('--- 直线法 ---');

  // 1. 正常值：10000, 1000, 5
  let r = straightLineDepreciation(10000, 1000, 5);
  assertEqual(r.length, 5, 'SL-1: 返回 5 年明细');
  assertEqual(r[0].depreciation, 1800, 'SL-2: 第1年折旧 1800');
  assertEqual(r[4].endingValue, 1000, 'SL-3: 第5年末账面价值 = 残值 1000');

  // 2. 正常值：50000, 5000, 10
  r = straightLineDepreciation(50000, 5000, 10);
  assertEqual(r[0].depreciation, 4500, 'SL-4: 50000/10年/残值5000，年折旧 4500');
  assertEqual(r[9].endingValue, 5000, 'SL-5: 第10年末账面价值 = 5000');

  // 3. 正常值：100000, 0, 20
  r = straightLineDepreciation(100000, 0, 20);
  assertEqual(r[0].depreciation, 5000, 'SL-6: 残值0，年折旧 5000');
  assertEqual(r[19].endingValue, 0, 'SL-7: 第20年末账面价值 = 0');

  // 4. 边界：残值 = 0
  r = straightLineDepreciation(1000, 0, 5);
  assertEqual(r[0].depreciation, 200, 'SL-8: 残值0边界，年折旧 200');

  // 5. 边界：年限 = 1
  r = straightLineDepreciation(1000, 100, 1);
  assertEqual(r.length, 1, 'SL-9: 年限1，返回1条');
  assertEqual(r[0].depreciation, 900, 'SL-10: 年限1，一次性折旧 900');

  // 6. 边界：最小正整数
  r = straightLineDepreciation(1, 0, 1);
  assertEqual(r[0].depreciation, 1, 'SL-11: 原值1，残值0，年限1，折旧1');

  // 7. 异常：原值 = 0
  assertThrows(() => straightLineDepreciation(0, 0, 5), 'SL-12: 原值0应抛异常');

  // 8. 异常：原值负数
  assertThrows(() => straightLineDepreciation(-100, 0, 5), 'SL-13: 原值负数应抛异常');

  // 9. 异常：残值 >= 原值
  assertThrows(() => straightLineDepreciation(1000, 1000, 5), 'SL-14: 残值=原值应抛异常');
  assertThrows(() => straightLineDepreciation(1000, 2000, 5), 'SL-15: 残值>原值应抛异常');

  // 10. 异常：年限 = 0
  assertThrows(() => straightLineDepreciation(1000, 100, 0), 'SL-16: 年限0应抛异常');

  // ---------- 双倍余额递减法 ----------
  log('\n--- 双倍余额递减法 ---');

  // 11. 正常值：10000, 1000, 5
  r = doubleDecliningBalance(10000, 1000, 5);
  assertEqual(r.length, 5, 'DDB-1: 返回 5 年明细');
  assertEqual(r[0].depreciation, 4000, 'DDB-2: 第1年折旧 = 10000 × 2/5 = 4000');

const DOC_HTML = `
<h2>一、工具介绍</h2>
<p>本工具用于计算固定资产在不同折旧方法下的折旧明细，支持<strong>直线法（年限平均法）</strong>、<strong>双倍余额递减法</strong>、<strong>年数总和法</strong>三种中国会计准则认可的折旧方法。输入固定资产原值、预计净残值、预计使用年限后，即可得到逐年折旧额、累计折旧、账面价值等完整明细表。</p>

<h2>二、参数说明</h2>
<h3>1. 固定资产原值（cost）</h3>
<ul>
  <li><strong>含义</strong>：企业取得固定资产时实际支付的全部价款，包括购买价款、相关税费、使固定资产达到预定可使用状态前所发生的可归属于该项资产的运输费、装卸费、安装费和专业人员服务费等。</li>

</ul>

<h3>2. 预计净残值（salvage）</h3>
<ul>
  <li><strong>含义</strong>：假定固定资产预计使用寿命已满并处于使用寿命终了时的预期状态，企业目前从该项资产处置中获得的扣除预计处置费用后的金额。</li>

</ul>

<h3>3. 预计使用年限（life）</h3>
<ul>
  <li><strong>含义</strong>：企业预期使用该项固定资产的期间，或者该项资产所能生产产品或提供劳务的数量。</li>

  <li><strong>双倍余额递减法</strong>：加速折旧法，前期折旧多、后期折旧少，最后两年改为直线法。适用于技术更新较快、前期使用效率高的资产。</li>

<h2>三、三种方法详解</h2>

<h3>1. 直线法（Straight-Line Method）</h3>
<p><strong>公式</strong>：</p>
<ul>
  <li>年折旧额 = (原值 - 预计净残值) ÷ 预计使用年限</li>

</ul>
<p><strong>特点</strong>：每年折旧额相等，账面价值呈直线下降。计算最简单，应用最广泛。</p>
<p><strong>适用场景</strong>：房屋建筑物、使用强度稳定的机器设备、办公家具等。</p>

<h3>2. 双倍余额递减法（Double Declining Balance Method）</h3>
<p><strong>公式</strong>：</p>
<ul>
  <li>年折旧率 = 2 ÷ 预计使用年限 × 100%</li>
  <li>年折旧额 = 期初账面净值 × 年折旧率</li>

</ul>
<p><strong>特点</strong>：不考虑残值计算前期折旧（仅最后两年考虑），折旧速度比年数总和法更快。由于最后两年必须改为直线法，才能保证折旧期满后账面价值等于残值。</p>
<p><strong>适用场景</strong>：技术更新快的电子设备、车辆、前期使用效率高的生产设备。</p>

<h3>3. 年数总和法（Sum-of-the-Years'-Digits Method）</h3>
<p><strong>公式</strong>：</p>
<ul>
  <li>年数总和 = n × (n + 1) ÷ 2（n 为预计使用年限）</li>

<p><strong>适用场景</strong>：使用强度前期较大的设备、季节性使用的资产。</p>

  <li><strong>错误 2：预计净残值大于等于原值</strong><br>
    排查：残值必须小于原值，否则应折旧基数为负或零，无意义。检查是否将"原值"和"残值"填反。</li>
  <li><strong>错误 3：使用年限输入小数或 0</strong><br>
    排查：使用年限必须为正整数。如果资产按工作量法折旧，本工具暂不支持。</li>
  <li><strong>错误 4：双倍余额递减法最后两年未切换</strong><br>

    <li><strong>不处理月度折旧</strong>：本工具按年计算，如需月度折旧请自行除以 12（直线法）或按月份分摊。</li>
    <li><strong>不考虑资产处置、报废、出售</strong>：使用中途的资产处置需另行计算。</li>
    <li><strong>不处理税会差异</strong>：税法加速折旧、一次性扣除等优惠政策不在本工具范围内。</li>
    <li><strong>不考虑通货膨胀、汇率变动</strong>：本工具按历史成本计量。</li>
    <li><strong>不支持分组折旧、综合折旧</strong>：仅支持单项资产折旧计算。</li>
    <li><strong>不支持非整数年限</strong>：如 3.5 年等需自行处理。</li>
  </ul>
</div>
<p>如需更复杂的固定资产管理（含减值、处置、税会差异、多币种等），建议使用专业财务软件或 ERP 系统。</p>
`;

   源码展示

const SOURCE_CODE = `/**
 * 将数值四舍五入到 2 位小数
 * @param {number} n - 待处理数值
 * @returns {number} 保留 2 位小数的数值
 */
function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

/**
 * 校验折旧计算的输入参数
 * @param {number} cost - 固定资产原值（元），必须 > 0
 * @param {number} salvage - 预计净残值（元），必须 >= 0 且 < cost
 * @param {number} life - 预计使用年限（年），必须为正整数
 * @throws {TypeError} 参数类型不正确或非数值
 * @throws {RangeError} 参数超出合理范围
 * @returns {void}
 */
function validateInputs(cost, salvage, life) {
  if (typeof cost !== 'number' || isNaN(cost)) {
    throw new TypeError('原值必须为有效数字');
  }
  if (typeof salvage !== 'number' || isNaN(salvage)) {
    throw new TypeError('预计净残值必须为有效数字');
  }
  if (typeof life !== 'number' || isNaN(life)) {
    throw new TypeError('使用年限必须为有效数字');
  }
  if (cost <= 0) throw new RangeError('原值必须大于 0');
  if (salvage < 0) throw new RangeError('预计净残值不能为负数');
  if (salvage >= cost) throw new RangeError('预计净残值必须小于原值');
  if (!Number.isInteger(life) || life <= 0) {
    throw new RangeError('使用年限必须为正整数');
  }
}

/**
 * 直线法（年限平均法）折旧计算
 * 公式：年折旧额 = (原值 - 预计净残值) / 预计使用年限
 * 依据：《企业会计准则第4号——固定资产》第十七条
 *
 * @param {number} cost - 固定资产原值（元），> 0
 * @param {number} salvage - 预计净残值（元），>= 0 且 < cost
 * @param {number} life - 预计使用年限（年），正整数
 * @returns {Array<{year:number, beginningValue:number, depreciation:number,
 *           accumulatedDepreciation:number, endingValue:number}>}
 * @throws {TypeError} 参数类型错误
 * @throws {RangeError} 参数超出范围
 */
function straightLineDepreciation(cost, salvage, life) {
  validateInputs(cost, salvage, life);
  const depreciableBase = cost - salvage;
  const annualDepreciation = depreciableBase / life;
  const schedule = [];
  let accumulated = 0;

  for (let year = 1; year <= life; year++) {
    const beginningValue = cost - accumulated;
    const depreciation = (year === life)
      ? depreciableBase - annualDepreciation * (life - 1)
      : annualDepreciation;
    accumulated += depreciation;
    schedule.push({
      year, beginningValue: round2(beginningValue),
      depreciation: round2(depreciation),
      accumulatedDepreciation: round2(accumulated),
      endingValue: round2(cost - accumulated)
    });
  }
  return schedule;
}

/**
 * 双倍余额递减法折旧计算
 * 公式：年折旧率 = 2 / 预计使用年限
 *       年折旧额 = 期初账面净值 × 年折旧率
 *       最后两年改为直线法
 * 依据：《企业会计准则第4号——固定资产》第十九条
 *
 * @param {number} cost - 固定资产原值（元），> 0
 * @param {number} salvage - 预计净残值（元），>= 0 且 < cost
 * @param {number} life - 预计使用年限（年），正整数
 * @returns {Array<Object>} 折旧明细数组
 */
function doubleDecliningBalance(cost, salvage, life) {
  validateInputs(cost, salvage, life);
  const rate = 2 / life;
  const schedule = [];
  let bookValue = cost;
  let accumulated = 0;

  for (let year = 1; year <= life; year++) {
    const beginningValue = bookValue;
    let depreciation;
    if (year >= life - 1) {
      const remainingYears = life - year + 1;
      depreciation = (bookValue - salvage) / remainingYears;
    } else {
      depreciation = bookValue * rate;
    }
    bookValue -= depreciation;
    accumulated += depreciation;
    schedule.push({
      year, beginningValue: round2(beginningValue),
      depreciation: round2(depreciation),
      accumulatedDepreciation: round2(accumulated),
      endingValue: round2(bookValue)
    });
  }
  return schedule;
}

/**
 * 年数总和法折旧计算
 * 公式：年数总和 = n(n+1)/2
 *       第 k 年折旧率 = (n - k + 1) / 年数总和
 *       年折旧额 = (原值 - 残值) × 折旧率
 * 依据：《企业会计准则第4号——固定资产》第十九条
 *
 * @param {number} cost - 固定资产原值（元），> 0
 * @param {number} salvage - 预计净残值（元），>= 0 且 < cost
 * @param {number} life - 预计使用年限（年），正整数
 * @returns {Array<Object>} 折旧明细数组
 */
function sumOfYearsDigits(cost, salvage, life) {
  validateInputs(cost, salvage, life);
  const depreciableBase = cost - salvage;
  const sumOfYears = life * (life + 1) / 2;
  const schedule = [];
  let accumulated = 0;

  for (let year = 1; year <= life; year++) {
    const beginningValue = cost - accumulated;
    const remainingLife = life - year + 1;
    const depreciation = depreciableBase * remainingLife / sumOfYears;
    accumulated += depreciation;
    schedule.push({
      year, beginningValue: round2(beginningValue),
      depreciation: round2(depreciation),
      accumulatedDepreciation: round2(accumulated),
      endingValue: round2(cost - accumulated)
    });
  }
  if (schedule.length > 0) {
    const last = schedule[schedule.length - 1];
    last.accumulatedDepreciation = round2(depreciableBase);
    last.endingValue = round2(salvage);
  }
  return schedule;
}

/**
 * 根据方法名称统一调度折旧计算
 * @param {'sl'|'ddb'|'syd'} method - 折旧方法代码
 * @param {number} cost - 原值
 * @param {number} salvage - 残值
 * @param {number} life - 年限
 * @returns {Array<Object>} 折旧明细
 */
function calculateDepreciation(method, cost, salvage, life) {
  switch (method) {
    case 'sl':  return straightLineDepreciation(cost, salvage, life);
    case 'ddb': return doubleDecliningBalance(cost, salvage, life);
    case 'syd': return sumOfYearsDigits(cost, salvage, life);
    default: throw new Error('不支持的折旧方法：' + method);
  }
}`;

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');

// 计算
function calculate() {
  const method = document.getElementById('method').value;
  const cost = parseFloat(document.getElementById('cost').value);
  const salvage = parseFloat(document.getElementById('salvage').value);
  const life = parseInt(document.getElementById('life').value);
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = '';

  try {
    const schedule = calculateDepreciation(method, cost, salvage, life);
    renderResult(schedule, method, cost, salvage, life);
  } catch (e) {
    errorMsg.textContent = '计算错误：' + e.message;
    document.getElementById('resultCard').style.display = 'none';
  }
}

function renderResult(schedule, method, cost, salvage, life) {
  const methodNames = { sl: '直线法', ddb: '双倍余额递减法', syd: '年数总和法' };
  const tbody = document.querySelector('#resultTable tbody');
  tbody.innerHTML = '';
  schedule.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = \`
      <td>\${row.year}</td>
      <td>\${row.beginningValue.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td>
      <td>\${row.depreciation.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td>
      <td>\${row.accumulatedDepreciation.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td>
      <td>\${row.endingValue.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td>
    \`;
    tbody.appendChild(tr);
  });

  const totalDepreciation = schedule[schedule.length - 1].accumulatedDepreciation;
  const firstYearDep = schedule[0].depreciation;
  const lastYearDep = schedule[schedule.length - 1].depreciation;

  document.getElementById('summaryBox').innerHTML = \`
    <div class="summary-item">
      <div class="label">折旧方法</div>
      <div class="value">\${methodNames[method]}</div>
    </div>
    <div class="summary-item">
      <div class="label">固定资产原值</div>
      <div class="value">¥\${cost.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</div>
    </div>
    <div class="summary-item">
      <div class="label">预计净残值</div>
      <div class="value">¥\${salvage.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</div>
    </div>
    <div class="summary-item">
      <div class="label">使用年限</div>
      <div class="value">\${life} 年</div>
    </div>
    <div class="summary-item">
      <div class="label">累计折旧总额</div>
      <div class="value">¥\${totalDepreciation.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</div>
    </div>
    <div class="summary-item">
      <div class="label">第 1 年折旧</div>
      <div class="value">¥\${firstYearDep.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</div>
    </div>
    <div class="summary-item">
      <div class="label">最后一年折旧</div>
      <div class="value">¥\${lastYearDep.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</div>
    </div>
    <div class="summary-item">
      <div class="label">期末账面价值</div>
      <div class="value">¥\${schedule[schedule.length - 1].endingValue.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</div>
    </div>
  \`;

  document.getElementById('resultCard').style.display = 'block';
}

  document.getElementById('method').value = 'sl';
