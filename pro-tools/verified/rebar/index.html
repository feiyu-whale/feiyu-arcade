<script>
/* ============================================================
 * 第一部分：核心算法源码
 * 依据：GB/T 1499.2-2018《钢筋混凝土用钢 第2部分：热轧带肋钢筋》附录A
 * ============================================================ */

/**
 * 热轧带肋钢筋公称直径与理论重量对照表（GB/T 1499.2-2018 附录A）
 * 单位：kg/m
 * 注：表中数值为国标附录A给出的理论重量，非由公式 0.00617×d² 计算所得，
 *     两者存在微小差异，本工具以国标原文为准。
 * @type {Object.<number, number>}
 */
const UNIT_WEIGHT_TABLE = {
  6:  0.222,
  8:  0.395,
  10: 0.617,
  12: 0.888,
  14: 1.21,
  16: 1.58,
  18: 2.00,
  20: 2.47,
  22: 2.98,
  25: 3.85,
  28: 4.83,
  32: 6.31,
  36: 7.99,
  40: 9.87
};

/**
 * 支持的公称直径列表（mm）
 * @type {number[]}
 */
const VALID_DIAMETERS = Object.keys(UNIT_WEIGHT_TABLE).map(Number).sort((a,b)=>a-b);

/**
 * 根据公称直径查询每米理论重量
 *
 * @param {number} diameter - 公称直径，单位 mm。必须是 UNIT_WEIGHT_TABLE 中的键值之一
 * @returns {number} 每米理论重量，单位 kg/m
 * @throws {TypeError} 当参数不是有限数字时抛出
 * @throws {RangeError} 当直径不在国标规定范围内时抛出
 * @example
 *   getUnitWeight(20); // 2.47
 *   getUnitWeight(6);  // 0.222
 */
function getUnitWeight(diameter) {
  if (typeof diameter !== 'number' || !Number.isFinite(diameter)) {
    throw new TypeError('直径必须是有限数字');
  }
  if (!UNIT_WEIGHT_TABLE.hasOwnProperty(diameter)) {
    throw new RangeError(
      '直径 ' + diameter + ' mm 不在 GB/T 1499.2-2018 附录A 规定范围内，' +
      '支持：' + VALID_DIAMETERS.join('/') + ' mm'
    );
  }
  return UNIT_WEIGHT_TABLE[diameter];
}

/**
 * 计算钢筋总理论重量
 * 公式：W = w × L × n，其中 w 为每米理论重量，L 为单根长度，n 为根数
 *
 * @param {number} diameter - 公称直径，单位 mm
 * @param {number} length   - 单根长度，单位 m，必须 ≥ 0
 * @param {number} count    - 根数，必须为非负整数
 * @returns {number} 总理论重量，单位 kg，保留 3 位小数
 * @throws {TypeError} 当任一参数类型非法时抛出
 * @throws {RangeError} 当参数超出合理范围时抛出
 * @example
 *   calcWeight(20, 9, 100); // 2223.000
 *   calcWeight(12, 1, 1);   // 0.888
 */
function calcWeight(diameter, length, count) {
  if (typeof diameter !== 'number' || !Number.isFinite(diameter)) {
    throw new TypeError('直径必须是有限数字');
  }
  if (typeof length !== 'number' || !Number.isFinite(length)) {
    throw new TypeError('长度必须是有限数字');
  }
  if (typeof count !== 'number' || !Number.isFinite(count)) {
    throw new TypeError('根数必须是有限数字');
  }
  if (length < 0) {
    throw new RangeError('长度不能为负数');
  }
  if (count < 0) {
    throw new RangeError('根数不能为负数');
  }
  if (!Number.isInteger(count)) {
    throw new RangeError('根数必须为整数');
  }
  const w = getUnitWeight(diameter);
  // 使用 Math.round 避免浮点误差（如 0.222*9*100 = 199.79999999999998）
  const raw = w * length * count;
  return Math.round(raw * 1000) / 1000;
}

/**
 * 根据总重量反查单根长度
 * 公式：L = W / (w × n)
 *
 * @param {number} diameter - 公称直径，单位 mm
 * @param {number} weight   - 总重量，单位 kg，必须 ≥ 0
 * @param {number} count    - 根数，必须为正整数（反查时分母不能为 0）
 * @returns {number} 单根长度，单位 m，保留 3 位小数
 * @throws {TypeError} 当任一参数类型非法时抛出
 * @throws {RangeError} 当参数超出合理范围或根数为 0 时抛出
 * @example
 *   calcLength(20, 2223, 100); // 9.000
 *   calcLength(12, 0.888, 1);  // 1.000
 */
function calcLength(diameter, weight, count) {
  if (typeof diameter !== 'number' || !Number.isFinite(diameter)) {
    throw new TypeError('直径必须是有限数字');
  }
  if (typeof weight !== 'number' || !Number.isFinite(weight)) {
    throw new TypeError('重量必须是有限数字');
  }
  if (typeof count !== 'number' || !Number.isFinite(count)) {
    throw new TypeError('根数必须是有限数字');
  }
  if (weight < 0) {
    throw new RangeError('重量不能为负数');
  }
  if (count <= 0) {
    throw new RangeError('反查长度时根数必须为正整数');
  }
  if (!Number.isInteger(count)) {
    throw new RangeError('根数必须为整数');
  }
  const w = getUnitWeight(diameter);
  const raw = weight / (w * count);
  return Math.round(raw * 1000) / 1000;
}

/* ============================================================
 * 第二部分：单元测试（纯 JS 实现，无外部依赖）
 * ============================================================ */

let _passed = 0;
let _failed = 0;
let _total  = 0;
const _results = [];

/**
 * 断言函数
 * @param {string} name - 用例名称
 * @param {boolean} cond - 断言条件
 * @param {string} detail - 失败时的详细信息
 */
function assert(name, cond, detail) {
  _total++;
  if (cond) {
    _passed++;
    _results.push({ name, pass: true, detail: '' });
  } else {
    _failed++;
    _results.push({ name, pass: false, detail: detail || '' });
  }
}

/**
 * 近似相等断言（处理浮点误差）
 * @param {string} name
 * @param {number} actual
 * @param {number} expected
 * @param {number} [eps=1e-6]
 */
function assertClose(name, actual, expected, eps) {
  eps = eps === undefined ? 1e-6 : eps;
  assert(name, Math.abs(actual - expected) < eps,
    '期望 ' + expected + '，实际 ' + actual);
}

/**
 * 断言抛出指定类型异常
 * @param {string} name
 * @param {Function} fn
 * @param {Function} ErrCtor
 */
function assertThrows(name, fn, ErrCtor) {
  _total++;
  try {
    fn();
    _failed++;
    _results.push({ name, pass: false, detail: '未抛出异常' });
  } catch (e) {
    if (e instanceof ErrCtor) {
      _passed++;
      _results.push({ name, pass: true, detail: '' });
    } else {
      _failed++;
      _results.push({ name, pass: false, detail: '抛出异常类型不符：' + e.constructor.name });
    }
  }
}

// ---------- 测试用例 ----------

// 1-3. getUnitWeight 正常值
assertClose('getUnitWeight(6) = 0.222',   getUnitWeight(6),  0.222);
assertClose('getUnitWeight(20) = 2.47',   getUnitWeight(20), 2.47);
assertClose('getUnitWeight(40) = 9.87',   getUnitWeight(40), 9.87);

// 4-6. getUnitWeight 覆盖更多直径
assertClose('getUnitWeight(8) = 0.395',   getUnitWeight(8),  0.395);
assertClose('getUnitWeight(12) = 0.888',  getUnitWeight(12), 0.888);
assertClose('getUnitWeight(25) = 3.85',   getUnitWeight(25), 3.85);

// 7-9. getUnitWeight 异常输入
assertThrows('getUnitWeight(null) 抛 TypeError',     () => getUnitWeight(null),     TypeError);
assertThrows('getUnitWeight(undefined) 抛 TypeError',() => getUnitWeight(undefined),TypeError);
assertThrows('getUnitWeight(NaN) 抛 TypeError',      () => getUnitWeight(NaN),      TypeError);

// 10-11. getUnitWeight 超范围
assertThrows('getUnitWeight(5) 抛 RangeError',  () => getUnitWeight(5),  RangeError);
assertThrows('getUnitWeight(50) 抛 RangeError', () => getUnitWeight(50), RangeError);

// 12-14. calcWeight 正常值
assertClose('calcWeight(20,9,100) = 2223',     calcWeight(20, 9, 100), 2223);
assertClose('calcWeight(12,1,1) = 0.888',      calcWeight(12, 1, 1),   0.888);
assertClose('calcWeight(6,12,50) = 133.2',     calcWeight(6, 12, 50),  133.2);

// 15. calcWeight 长度为 0
assertClose('calcWeight(20,0,100) = 0', calcWeight(20, 0, 100), 0);

// 16. calcWeight 根数为 0
assertClose('calcWeight(20,9,0) = 0', calcWeight(20, 9, 0), 0);

// 17. calcWeight 浮点精度（0.222*9*100 应得 199.8 而非 199.79999999999998）
assertClose('calcWeight(6,9,100) 浮点精度 = 199.8', calcWeight(6, 9, 100), 199.8);

// 18. calcWeight 大数
assertClose('calcWeight(40,12,1000) = 118440', calcWeight(40, 12, 1000), 118440);

// 19-21. calcWeight 异常
assertThrows('calcWeight 负长度 抛 RangeError', () => calcWeight(20, -1, 10), RangeError);
assertThrows('calcWeight 负根数 抛 RangeError', () => calcWeight(20, 9, -1),  RangeError);
assertThrows('calcWeight 非整数根数 抛 RangeError', () => calcWeight(20, 9, 1.5), RangeError);

// 22-24. calcWeight 非法类型
assertThrows('calcWeight(null,...) 抛 TypeError', () => calcWeight(null, 9, 10), TypeError);
assertThrows('calcWeight(20,NaN,10) 抛 TypeError',() => calcWeight(20, NaN, 10), TypeError);
assertThrows('calcWeight(20,9,"10") 抛 TypeError',() => calcWeight(20, 9, "10"), TypeError);

// 25-27. calcLength 正常值
assertClose('calcLength(20,2223,100) = 9',   calcLength(20, 2223, 100), 9);
assertClose('calcLength(12,0.888,1) = 1',    calcLength(12, 0.888, 1),  1);
assertClose('calcLength(25,3850,100) = 10',  calcLength(25, 3850, 100), 10);

// 28. calcLength 重量为 0
assertClose('calcLength(20,0,10) = 0', calcLength(20, 0, 10), 0);

// 29. calcLength 根数为 0 抛异常
assertThrows('calcLength 根数=0 抛 RangeError', () => calcLength(20, 100, 0), RangeError);

// 30. calcLength 负重量 抛异常
assertThrows('calcLength 负重量 抛 RangeError', () => calcLength(20, -100, 10), RangeError);

// 31. calcLength 非法类型
assertThrows('calcLength(null,...) 抛 TypeError', () => calcLength(null, 100, 10), TypeError);

// 32. 反查与正算互逆
(function(){
  const d = 16, L = 7.5, n = 200;
  const W = calcWeight(d, L, n);
  const L2 = calcLength(d, W, n);
  assertClose('calcLength(calcWeight(...)) 互逆', L2, L);
})();

  const d = parseFloat(document.getElementById('diameter').value);

  const box = document.getElementById('result-weight');

  if (isNaN(n)) { box.innerHTML = '<div class="error-box">请输入根数</div>'; return; }
  try {
    const w = getUnitWeight(d);
    const W = calcWeight(d, L, n);
    box.innerHTML =
      '<div class="result-box">' +
      '<div class="sub">每米理论重量：' + w + ' kg/m</div>' +
      '<div class="big">' + W + ' kg</div>' +
      '<div class="sub">计算过程：' + w + ' × ' + L + ' × ' + n + ' = ' + W + '</div>' +
      '</div>';
  } catch (e) {
    box.innerHTML = '<div class="error-box">' + e.message + '</div>';
  }
}

// 渲染源码
(function(){
  const src =
`/**
 * 热轧带肋钢筋公称直径与理论重量对照表
 * 依据：GB/T 1499.2-2018 附录 A
 * 单位：kg/m
 */
const UNIT_WEIGHT_TABLE = {
  6:  0.222,  8:  0.395, 10: 0.617, 12: 0.888,
  14: 1.21,  16: 1.58,  18: 2.00,  20: 2.47,
  22: 2.98,  25: 3.85,  28: 4.83,  32: 6.31,
  36: 7.99,  40: 9.87
};

const VALID_DIAMETERS = Object.keys(UNIT_WEIGHT_TABLE).map(Number).sort((a,b)=>a-b);

/**
 * 查询每米理论重量
 * @param {number} diameter - 公称直径 (mm)
 * @returns {number} 每米理论重量 (kg/m)
 * @throws {TypeError} 参数非法
 * @throws {RangeError} 直径不在国标范围
 */
function getUnitWeight(diameter) {
  if (typeof diameter !== 'number' || !Number.isFinite(diameter)) {
    throw new TypeError('直径必须是有限数字');
  }
  if (!UNIT_WEIGHT_TABLE.hasOwnProperty(diameter)) {
    throw new RangeError('直径 ' + diameter + ' mm 不在 GB/T 1499.2-2018 附录A 范围内');
  }
  return UNIT_WEIGHT_TABLE[diameter];
}

/**
 * 计算总理论重量
 * @param {number} diameter - 公称直径 (mm)
 * @param {number} length   - 单根长度 (m)
 * @param {number} count    - 根数（非负整数）
 * @returns {number} 总重量 (kg)，保留 3 位小数
 */
function calcWeight(diameter, length, count) {
  if (typeof diameter !== 'number' || !Number.isFinite(diameter))
    throw new TypeError('直径必须是有限数字');
  if (typeof length !== 'number' || !Number.isFinite(length))
    throw new TypeError('长度必须是有限数字');
  if (typeof count !== 'number' || !Number.isFinite(count))
    throw new TypeError('根数必须是有限数字');
  if (length < 0) throw new RangeError('长度不能为负数');
  if (count < 0)  throw new RangeError('根数不能为负数');
  if (!Number.isInteger(count)) throw new RangeError('根数必须为整数');
  const w = getUnitWeight(diameter);
  return Math.round(w * length * count * 1000) / 1000;
}

/**
 * 反查单根长度
 * @param {number} diameter - 公称直径 (mm)
 * @param {number} weight   - 总重量 (kg)
 * @param {number} count    - 根数（正整数）
 * @returns {number} 单根长度 (m)，保留 3 位小数
 */
function calcLength(diameter, weight, count) {
  if (typeof diameter !== 'number' || !Number.isFinite(diameter))
    throw new TypeError('直径必须是有限数字');
  if (typeof weight !== 'number' || !Number.isFinite(weight))
    throw new TypeError('重量必须是有限数字');
  if (typeof count !== 'number' || !Number.isFinite(count))
    throw new TypeError('根数必须是有限数字');
  if (weight < 0) throw new RangeError('重量不能为负数');
  if (count <= 0) throw new RangeError('反查长度时根数必须为正整数');
  if (!Number.isInteger(count)) throw new RangeError('根数必须为整数');
  const w = getUnitWeight(diameter);
  return Math.round(weight / (w * count) * 1000) / 1000;
}`;
  document.getElementById('source-code').textContent = src;
})();
