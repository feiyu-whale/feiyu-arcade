<h1>NPV 净现值 / IRR 内部收益率 · 完整交付物</h1>

<div class="npv-calc" style="background:#fff;border-radius:10px;padding:16px;margin:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);">
  <div style="font-size:15px;font-weight:600;color:#2c3e50;margin-bottom:12px;border-left:3px solid #2980b9;padding-left:8px;">🔢 即时计算</div>
  <div style="margin-bottom:12px;">
    <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">现金流（第0期起，逗号分隔；负数表示投入）</label>
    <input type="text" id="npvCF" value="-10000, 3000, 4000, 5000, 3000" style="width:100%;padding:8px 10px;border:1px solid #d5dbe1;border-radius:6px;font-size:14px;font-family:monospace;">
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;">
    <div style="flex:1;min-width:130px;">
      <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">折现率（%）</label>
      <input type="number" id="npvRate" value="10" step="0.1" style="width:100%;padding:8px 10px;border:1px solid #d5dbe1;border-radius:6px;font-size:14px;">
    </div>
  </div>
  <div id="npvResult" style="margin-top:14px;padding:12px;background:#f8fafc;border:1px solid #e3e9ef;border-radius:8px;font-size:14px;"></div>
  <div style="font-size:11px;color:#95a5a6;margin-top:8px;">公式：NPV = Σ CFt / (1+r)^t；IRR 用牛顿迭代求 NPV=0 的折现率</div>
</div>

<script>
(function(){
  function parseCF(s){
    return s.split(/[,，\s]+/).filter(function(x){return x!=='';}).map(function(x){ return Number(x); });
  }
  function npvCalc(cf, r){
    var v=0, d=1;
    for(var t=0;t<cf.length;t++){ v += cf[t]/d; d *= (1+r); }
    return v;
  }
  function irrCalc(cf){
    // 二分法，稳健不依赖导数
    function f(r){ return npvCalc(cf,r); }
    var lo=-0.9999, hi=10;
    var flo=f(lo), fhi=f(hi);
    if(isNaN(flo)||isNaN(fhi)) return null;
    if(flo*fhi>0) return null;
    for(var i=0;i<300;i++){
      var mid=(lo+hi)/2, fm=f(mid);
      if(Math.abs(fm)<1e-9) return mid;
      if(flo*fm<=0){ hi=mid; fhi=fm; } else { lo=mid; flo=fm; }
    }
    return (lo+hi)/2;
  }
  function run(){
    var box=document.getElementById('npvResult');
    var cf=parseCF(document.getElementById('npvCF').value);
    var ratePct=parseFloat(document.getElementById('npvRate').value);
    if(cf.length<2){ box.innerHTML='<span style="color:#e74c3c">现金流至少需要 2 期</span>'; return; }
    for(var i=0;i<cf.length;i++){
      if(!isFinite(cf[i])){ box.innerHTML='<span style="color:#e74c3c">第 '+i+' 期不是有效数字</span>'; return; }
    }
    if(!isFinite(ratePct)){ box.innerHTML='<span style="color:#e74c3c">请填写折现率</span>'; return; }
    var r=ratePct/100;
    if(r<=-1){ box.innerHTML='<span style="color:#e74c3c">折现率必须大于 -100%</span>'; return; }

    var v=npvCalc(cf,r);
    var irr=irrCalc(cf);
    var line='';
    line+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e3e9ef"><span style="color:#666">NPV 净现值</span><b style="color:'+(v>=0?'#27ae60':'#e74c3c')+';font-size:16px">'+v.toFixed(2)+'</b></div>';
    line+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e3e9ef"><span style="color:#666">IRR 内部收益率</span><b>'+(irr===null?'无解（现金流不改变符号）':(irr*100).toFixed(3)+'%')+'</b></div>';
    line+='<div style="display:flex;justify-content:space-between;padding:5px 0"><span style="color:#666">期数</span><b>'+cf.length+' 期</b></div>';
    box.innerHTML=line;
  }
  ['npvCF','npvRate'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.addEventListener('input',run);
  });
  run();
})();
</script>

<script>
/* ============================================================
 * 第一部分：核心算法源码（纯函数，无外部依赖）
 * ============================================================ */
const NPVModule = (function () {

  /**
   * 校验现金流数组是否合法。
   * @param {any} cashflows 待校验的现金流
   * @throws {TypeError} 非数组 / 元素非有限数字
   * @throws {RangeError} 现金流长度 < 2
   * @returns {number[]} 校验通过后的现金流副本
   */
  function validateCashflows(cashflows) {
    if (!Array.isArray(cashflows)) {
      throw new TypeError('cashflows 必须是数组');
    }
    if (cashflows.length < 2) {
      throw new RangeError('现金流至少需要 2 期（含第 0 期）');
    }
    const out = [];
    for (let i = 0; i < cashflows.length; i++) {
      const v = cashflows[i];
      if (typeof v !== 'number' || !Number.isFinite(v)) {
        throw new TypeError('现金流第 ' + i + ' 期不是有限数字：' + v);
      }
      out.push(v);
    }
    return out;
  }

  /**
   * 校验折现率。
   * @param {any} rate 折现率（小数形式，例如 0.1 表示 10%）
   * @throws {TypeError} 非有限数字
   * @throws {RangeError} rate <= -1（会导致分母为 0 或负数幂次）
   * @returns {number} 校验通过的折现率
   */
  function validateRate(rate) {
    if (typeof rate !== 'number' || !Number.isFinite(rate)) {
      throw new TypeError('rate 必须是有限数字');
    }
    if (rate <= -1) {
      throw new RangeError('rate 必须 > -1，否则 (1+rate) 非正');
    }
    return rate;
  }

  /**
   * 计算净现值 NPV。
   *   NPV = Σ_{t=0}^{n} CF_t / (1 + r)^t
   *
   * @param {number[]} cashflows 现金流数组，索引 0 为第 0 期（通常为初始投资，负值）
   * @param {number} rate 折现率（小数形式，如 0.08 表示 8%）
   * @returns {number} 净现值
   * @throws {TypeError} 参数类型错误
   * @throws {RangeError} 现金流长度 < 2 或 rate <= -1
   *
   * @example
   *   calculateNPV([-1000, 300, 400, 500], 0.1);
   *   // => 约 23.03（单位与现金流一致）
   *
   * @example
   *   calculateNPV([-100, 100], 0); // => 0
   */
  function calculateNPV(cashflows, rate) {
    const cf = validateCashflows(cashflows);
    const r = validateRate(rate);
    let npv = 0;
    let discount = 1; // (1+r)^t
    for (let t = 0; t < cf.length; t++) {
      npv += cf[t] / discount;
      discount *= (1 + r);
    }
    return npv;
  }

  /**
   * 计算 NPV 关于折现率 r 的导数，用于牛顿迭代。
   *   dNPV/dr = Σ_{t=1}^{n} -t * CF_t / (1 + r)^{t+1}
   *
   * @param {number[]} cf 已校验的现金流
   * @param {number} r 折现率
   * @returns {number} 导数值
   */
  function npvDerivative(cf, r) {
    let d = 0;
    let denom = (1 + r) * (1 + r); // (1+r)^2，对应 t=1
    for (let t = 1; t < cf.length; t++) {
      d += -t * cf[t] / denom;
      denom *= (1 + r);
    }
    return d;
  }

  /**
   * 计算内部收益率 IRR（牛顿迭代法）。
   *   求解 r 使得 NPV(r) = 0
   *
   * @param {number[]} cashflows 现金流数组
   * @param {number} [guess=0.1] 初始猜测值（小数形式）
   * @param {number} [maxIter=200] 最大迭代次数
   * @param {number} [tolerance=1e-10] 收敛容差（NPV 绝对值）
   * @returns {number} IRR（小数形式，如 0.12 表示 12%）
   * @throws {TypeError} 参数类型错误
   * @throws {RangeError} 现金流长度 < 2 或 guess <= -1
   * @throws {Error} 迭代未收敛 / 导数为 0 无法继续
   *
   * @example
   *   calculateIRR([-1000, 300, 400, 500]);
   *   // => 约 0.1038（即 10.38%）
   */
  function calculateIRR(cashflows, guess, maxIter, tolerance) {
    const cf = validateCashflows(cashflows);
    const g = (guess === undefined || guess === null) ? 0.1 : guess;
    if (typeof g !== 'number' || !Number.isFinite(g)) {
      throw new TypeError('guess 必须是有限数字');
    }
    if (g <= -1) {
      throw new RangeError('guess 必须 > -1');
    }
    const maxI = (maxIter === undefined) ? 200 : maxIter;
    const tol = (tolerance === undefined) ? 1e-10 : tolerance;
    if (typeof maxI !== 'number' || maxI < 1) {
      throw new RangeError('maxIter 必须是正整数');
    }
    if (typeof tol !== 'number' || tol <= 0) {
      throw new RangeError('tolerance 必须是正数');
    }

    // 判断现金流是否全为 0 或符号未变化（无 IRR 或无穷多解）
    let hasPos = false, hasNeg = false;
    for (let i = 0; i < cf.length; i++) {
      if (cf[i] > 0) hasPos = true;
      if (cf[i] < 0) hasNeg = true;
    }
    if (!hasPos || !hasNeg) {
      throw new Error('现金流符号未变化，不存在唯一 IRR');
    }

    let r = g;
    for (let i = 0; i < maxI; i++) {
      const f = calculateNPV(cf, r);
      if (Math.abs(f) < tol) return r;
      const fp = npvDerivative(cf, r);
      if (Math.abs(fp) < 1e-14) {
        throw new Error('牛顿迭代导数为 0，无法继续（r=' + r + '）');
      }
      const next = r - f / fp;
      if (next <= -1) {
        // 回退：步长减半
        r = (r + (-0.9999)) / 2;
        continue;
      }
      if (Math.abs(next - r) < tol * 0.01) return next;
      r = next;
    }
    throw new Error('IRR 迭代未收敛（已达 ' + maxI + ' 次）');
  }

  /**
   * 一次性计算 NPV 与 IRR。
   *
   * @param {number[]} cashflows 现金流数组
   * @param {number} rate 折现率
   * @returns {{ npv: number, irr: number|null, irrConverged: boolean }}
   *   irr 为 null 表示无法计算（如现金流符号未变化）
   *
   * @example
   *   analyze([-1000, 300, 400, 500], 0.1);
   *   // => { npv: 23.03..., irr: 0.1038..., irrConverged: true }
   */
  function analyze(cashflows, rate) {
    const npv = calculateNPV(cashflows, rate);
    let irr = null, irrConverged = false;
    try {
      irr = calculateIRR(cashflows);
      irrConverged = true;
    } catch (e) {
      irr = null;
      irrConverged = false;
    }
    return { npv: npv, irr: irr, irrConverged: irrConverged };
  }

  return {
    calculateNPV: calculateNPV,
    calculateIRR: calculateIRR,
    analyze: analyze,
    validateCashflows: validateCashflows,
    validateRate: validateRate
  };
})();

/* 把源码以文本形式展示 */
(function showSource() {
  const scripts = document.querySelectorAll('script');
  // 第一个 script 标签即为本源码
  document.getElementById('src-code').textContent = scripts[0].textContent;
})();

/* ============================================================
 * 第二部分：单元测试（纯 JS，自写 assert）
 * ============================================================ */
const TestRunner = (function () {
  let passed = 0, failed = 0, total = 0;
  const log = [];

  function approxEqual(a, b, eps) {
    if (typeof a !== 'number' || typeof b !== 'number') return false;
    if (!isFinite(a) || !isFinite(b)) return a === b;
    return Math.abs(a - b) <= eps;
  }

  function assertApprox(name, actual, expected, eps) {
    total++;
    eps = eps === undefined ? 1e-6 : eps;
    if (approxEqual(actual, expected, eps)) {
      passed++;
      log.push({ ok: true, name: name, msg: '≈ ' + expected });
    } else {
      failed++;
      log.push({ ok: false, name: name, msg: '期望 ' + expected + '，实际 ' + actual });
    }
  }

  function assertThrows(name, fn, errType) {
    total++;
    try {
      fn();
      failed++;
      log.push({ ok: false, name: name, msg: '期望抛出异常但未抛出' });
    } catch (e) {
      if (errType && !(e instanceof errType)) {
        failed++;
        log.push({ ok: false, name: name, msg: '期望 ' + errType.name + '，实际 ' + e.constructor.name + ': ' + e.message });
      } else {
        passed++;
        log.push({ ok: true, name: name, msg: '抛出 ' + e.constructor.name });
      }
    }
  }

  function assertTrue(name, cond, msg) {
    total++;
    if (cond) {
      passed++;
      log.push({ ok: true, name: name, msg: msg || 'ok' });
    } else {
      failed++;
      log.push({ ok: false, name: name, msg: msg || 'false' });
    }
  }

  function run() {
    passed = 0; failed = 0; total = 0; log.length = 0;
    const NPV = NPVModule.calculateNPV;
    const IRR = NPVModule.calculateIRR;
    const analyze = NPVModule.analyze;

    /* ---------- NPV 正常值 ---------- */
    // 1. 经典 3 期现金流，r=10%
    assertApprox('NPV-01 经典 3 期 r=0.1',
      NPV([-1000, 300, 400, 500], 0.1), 23.029834, 1e-4);
    // 2. r=0 时 NPV 等于现金流之和
    assertApprox('NPV-02 r=0 求和',
      NPV([-1000, 300, 400, 500], 0), 200, 1e-9);
    // 3. 单期（2 元素）
    assertApprox('NPV-03 两期',
      NPV([-100, 110], 0.1), 0, 1e-9);
    // 4. 全部为正
    assertApprox('NPV-04 全正',
      NPV([100, 200, 300], 0.05), 572.748299, 1e-4);
    // 5. 全部为负
    assertApprox('NPV-05 全负',
      NPV([-100, -200, -300], 0.05), -572.748299, 1e-4);
    // 6. 高折现率 50%
    assertApprox('NPV-06 r=0.5',
      NPV([-1000, 600, 600], 0.5), -111.111111, 1e-4);
    // 7. 低折现率 1%
    assertApprox('NPV-07 r=0.01',
      NPV([-1000, 500, 600], 0.01), 72.168415, 1e-4);
    // 8. 大额现金流
    assertApprox('NPV-08 大额',
      NPV([-1e9, 5e8, 6e8], 0.08), 41149068, 1);

    /* ---------- NPV 边界值 ---------- */
    // 9. 现金流含 0
    assertApprox('NPV-09 含零期',
      NPV([-100, 0, 121], 0.1), 0, 1e-9);
    // 10. 极小折现率
    assertApprox('NPV-10 r=1e-9',
      NPV([-100, 100], 1e-9), 0, 1e-4);
    // 11. 接近 -1 的折现率
    assertApprox('NPV-11 r=-0.999',
      NPV([-100, 200], -0.999), 199900, 1);

    /* ---------- NPV 异常输入 ---------- */
    // 12. cashflows 非数组
    assertThrows('NPV-12 非数组', () => NPV(null, 0.1), TypeError);
    // 13. cashflows 为 undefined
    assertThrows('NPV-13 undefined', () => NPV(undefined, 0.1), TypeError);
    // 14. 现金流长度 < 2
    assertThrows('NPV-14 长度 1', () => NPV([100], 0.1), RangeError);
    // 15. 现金流含 NaN
    assertThrows('NPV-15 含 NaN', () => NPV([100, NaN], 0.1), TypeError);
    // 16. 现金流含字符串
    assertThrows('NPV-16 含字符串', () => NPV([100, '200'], 0.1), TypeError);
    // 17. 现金流含 Infinity
    assertThrows('NPV-17 含 Infinity', () => NPV([100, Infinity], 0.1), TypeError);
    // 18. rate 为 null
    assertThrows('NPV-18 rate null', () => NPV([100, 200], null), TypeError);
    // 19. rate 为 NaN
    assertThrows('NPV-19 rate NaN', () => NPV([100, 200], NaN), TypeError);
    // 20. rate 为字符串
    assertThrows('NPV-20 rate 字符串', () => NPV([100, 200], '0.1'), TypeError);
    // 21. rate = -1
    assertThrows('NPV-21 rate=-1', () => NPV([100, 200], -1), RangeError);
    // 22. rate < -1
    assertThrows('NPV-22 rate<-1', () => NPV([100, 200], -2), RangeError);
    // 23. 空数组
    assertThrows('NPV-23 空数组', () => NPV([], 0.1), RangeError);

    /* ---------- IRR 正常值 ---------- */
    // 24. 经典案例
    assertApprox('IRR-24 经典',
      IRR([-1000, 300, 400, 500]), 0.103819, 1e-4);
    // 25. 两期简单案例
    assertApprox('IRR-25 两期',
      IRR([-100, 110]), 0.1, 1e-9);
    // 26. 两期 50% 收益
    assertApprox('IRR-26 两期 50%',
      IRR([-100, 150]), 0.5, 1e-9);
    // 27. 多期
    assertApprox('IRR-27 5 期',
      IRR([-1000, 200, 300, 400, 500]), 0.128260, 1e-4);

    /* ---------- IRR 异常 ---------- */
    // 28. 全正现金流
    assertThrows('IRR-28 全正', () => IRR([100, 200, 300]), Error);
    // 29. 全负现金流
    assertThrows('IRR-29 全负', () => IRR([-100, -200, -300]), Error);
    // 30. 全零
    assertThrows('IRR-30 全零', () => IRR([0, 0, 0]), Error);
    // 31. guess <= -1
    assertThrows('IRR-31 guess=-1', () => IRR([-100, 200], -1), RangeError);
    // 32. 非数组
    assertThrows('IRR-32 非数组', () => IRR('abc'), TypeError);

    /* ---------- 精度 / 浮点 ---------- */
    // 33. 浮点精度：NPV 在 IRR 处应为 0
    const irr33 = IRR([-1000, 300, 400, 500]);
    assertApprox('NPV-33 NPV@IRR≈0',
      NPV([-1000, 300, 400, 500], irr33), 0, 1e-6);
    // 34. 对称现金流 NPV 在 r=0 应为 0
    assertApprox('NPV-34 对称 r=0',
      NPV([-100, 100], 0), 0, 1e-12);
    // 35. 大数相消
    assertApprox('NPV-35 大数相消',
      NPV([-1e12, 1e12], 0), 0, 1);

    /* ---------- analyze 综合 ---------- */
    // 36. analyze 正常
    const r36 = analyze([-1000, 300, 400, 500], 0.1);
    assertTrue('analyze-36 npv', approxEqual(r36.npv, 23.03, 0.01), 'npv ok');
    assertTrue('analyze-36 irr', approxEqual(r36.irr, 0.1038, 0.001), 'irr ok');
    assertTrue('analyze-36 converged', r36.irrConverged === true, 'converged');
    // 37. analyze 无 IRR
    const r37 = analyze([100, 200, 300], 0.1);
    assertTrue('analyze-37 irr null', r37.irr === null, 'irr null');
    assertTrue('analyze-37 not converged', r37.irrConverged === false, 'not converged');

    // 输出
    const out = document.getElementById('test-output');
    let html = '';
    for (let i = 0; i < log.length; i++) {
      const it = log[i];
      html += '<div class="' + (it.ok ? 'pass' : 'fail') + '">'
        + (it.ok ? '✓' : '✗') + ' ' + it.name + ' — ' + it.msg + '</div>';
    }
    html += '<hr><div style="color:#fff;font-weight:bold;">通过 ' + passed + ' / 共 ' + total + '（失败 ' + failed + '）</div>';
    out.innerHTML = html;
    console.log('通过 ' + passed + ' / 共 ' + total);
  }

  return { run: run };
})();

function runAllTests() { TestRunner.run(); }
