<!DOCTYPE html>

<head>

<title>🐳 肥鱼游戏厅</title>
<!-- v2.6.0-加开屏动画 20261104 -->
<script>
/* 开屏引导：本次会话没看过开屏 → 跳 startup/；看过 → 直接进首页
   用 sessionStorage，同一个标签页只播一次 */
try {
  if (!sessionStorage.getItem('feiyuEntered')) {
    location.replace('./startup/');
  }
} catch (e) { /* 隐私模式禁存储时直接进首页 */ }
</script>
</head>

<script>location.replace('./arcade.html');</script>
</body>
