<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>消息 · 云巢电竞</title>
<link rel="stylesheet" href="style.css">
<style>
  .msg-item { display:flex; gap:10px; padding:12px; border-bottom:1px solid var(--line);
              cursor:pointer; }
  .msg-item:active { background:var(--card); }
  .msg-av { width:44px; height:44px; border-radius:11px; flex-shrink:0;
            display:flex; align-items:center; justify-content:center; font-size:22px;
            background:linear-gradient(135deg,#1e3a5f,#312e81); position:relative; }
  .badge { position:absolute; top:-3px; right:-3px; background:var(--red); color:#fff;
           font-size:9.5px; min-width:16px; height:16px; border-radius:8px;
           display:flex; align-items:center; justify-content:center; padding:0 4px; }
  .msg-bd { flex:1; min-width:0; }
  .msg-top { display:flex; justify-content:space-between; align-items:baseline; }
  .msg-name { font-size:13px; font-weight:600; }
  .msg-time { font-size:10px; color:var(--dim); }
  .msg-prev { font-size:11.5px; color:var(--dim); margin-top:3px;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msg-item.unread .msg-prev { color:#cbd5e1; }
</style>
</head>
<body data-tab="message">

<div class="topbar">
  <div class="logo">消息</div>
  <div style="flex:1"></div>
  <div class="wallet" id="wallet">🍚 <b>—</b></div>
</div>

<div class="rolebar" id="rolebar"></div>

<div class="tabs" id="mtabs">
  <span class="on" data-k="all">全部</span>
  <span data-k="worker">打手</span>
  <span data-k="system">系统</span>
</div>

<div id="list"></div>

<div class="version" id="ver"></div>
<div class="tabbar" id="tabbar"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
const S = YCApp.init();
document.getElementById('ver').textContent = YC.VERSION;

/* 生成会话：基于已下单的打手 + 系统通知 */
function buildThreads() {
  const threads = [];

  // 系统通知
  const sysMsgs = [];
  if (S.orders.length) {
    sysMsgs.push({ t: '订单动态', c: `你有 ${S.orders.length} 笔订单，点击查看进度`, at: Date.now() - 1800000 });
  }
  if (S.reports.length) {
    const pending = S.reports.filter(r => r.state === 'pending').length;
    if (pending) sysMsgs.push({ t: '举报处理中', c: `${pending} 条举报待管理员审核`, at: Date.now() - 900000 });
  }
  if (!S.firstOrderUsed) {
    sysMsgs.push({ t: '首单立减', c: '新用户首单立减 20 白饭，别错过', at: Date.now() - 7200000 });
  }
  sysMsgs.push({ t: '欢迎来到云巢电竞', c: '本系统为演示版本，无真实交易', at: Date.now() - 86400000 });

  threads.push({
    id: 'sys', kind: 'system', name: '系统通知', avatar: '🔔',
    time: sysMsgs[0].at, prev: sysMsgs[0].c, msgs: sysMsgs
  });

  // 客服
  threads.push({
    id: 'cs', kind: 'system', name: '在线客服', avatar: '🎧',
    time: Date.now() - 3600000, prev: '有任何问题随时找我',
    msgs: [{ t: '在线客服', c: '你好，我是云巢电竞客服。演示系统不提供真实服务，有疑问可以随便问。', at: Date.now() - 3600000 }]
  });

  // 与打手的会话（按订单里的打手去重）
  const seen = new Set();
  S.orders.forEach(o => {
    if (seen.has(o.workerId)) return;
    seen.add(o.workerId);
    const w = YC.WORKERS.find(x => x.id === o.workerId);
    if (!w) return;
    const last = o.status === YCStatus.DONE ? '这单已完成，欢迎再来' :
                 o.status === YCStatus.PENDING ? '老板你好，这单我接了马上开始' :
                 '正在准备，稍等我一下';
    threads.push({
      id: 'w_' + o.workerId, kind: 'worker', name: w.name, avatar: w.avatar,
      time: o.createdAt + 60000, prev: last,
      msgs: [
        { t: '系统', c: `订单 ${o.id} 已创建`, at: o.createdAt },
        { t: w.name, c: last, at: o.createdAt + 60000 }
      ]
    });
  });

  threads.sort((a, b) => b.time - a.time);
  return threads;
}

let threads = buildThreads();
let filter = 'all';

document.querySelectorAll('#mtabs span').forEach(el => {
  el.onclick = () => {
    filter = el.dataset.k;
    document.querySelectorAll('#mtabs span').forEach(x =>
      x.classList.toggle('on', x.dataset.k === filter));
    renderList();
  };
});

function renderList() {
  let list = threads;
  if (filter === 'worker') list = threads.filter(t => t.kind === 'worker');
  if (filter === 'system') list = threads.filter(t => t.kind === 'system');

  const box = document.getElementById('list');
  if (!list.length) {
    box.innerHTML = `<div class="empty"><span class="icon">💬</span>暂无消息<br><br>
      <a href="index.html" class="btn" style="display:inline-block">去找打手聊聊</a></div>`;
    return;
  }

  box.innerHTML = list.map(t => `
    <div class="msg-item" data-tid="${t.id}">
      <div class="msg-av">${t.avatar}</div>
      <div class="msg-bd">
        <div class="msg-top">
          <span class="msg-name">${t.name}</span>
          <span class="msg-time">${YCUtil.time(t.time)}</span>
        </div>
        <div class="msg-prev">${t.prev}</div>
      </div>
    </div>`).join('');

  box.querySelectorAll('[data-tid]').forEach(el => {
    el.onclick = () => openThread(threads.find(t => t.id === el.dataset.tid));
  });
}

/* 会话窗口 */
function openThread(t) {
  if (!t) return;
  const msgsHtml = t.msgs.map(m => `
    <div style="margin-bottom:11px">
      <div style="font-size:10px;color:#64748b;margin-bottom:3px">${m.t} · ${YCUtil.time(m.at)}</div>
      <div style="background:var(--card);border:1px solid var(--line);border-radius:9px;
                  padding:9px 11px;font-size:12.5px;line-height:1.6">${m.c}</div>
    </div>`).join('');

  const mask = YCApp.modal(t.name, `
    <div style="max-height:46vh;overflow-y:auto">${msgsHtml}</div>
    <div class="field" style="margin-top:12px;margin-bottom:0">
      <input id="replyInput" placeholder="演示系统：消息不会真的发出" disabled
        style="opacity:.55">
    </div>
  `, [{ t: '关闭', cls: 'btn-ghost' }]);
}

renderList();
YCApp.renderTabbar('message');
</script>
</body>
</html>
