<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>管理后台 · 云巢电竞</title>
<link rel="stylesheet" href="style.css">
<style>
  .pending-item { background:var(--card); border:1px solid var(--line);
                  border-radius:10px; padding:11px; margin-bottom:9px; }
  .pending-item .hd { display:flex; justify-content:space-between;
                      margin-bottom:7px; padding-bottom:7px; border-bottom:1px dashed var(--line); }
  .pending-item .row { display:flex; justify-content:space-between;
                       font-size:12px; margin-bottom:3px; }
  .pending-item .row span:first-child { color:var(--dim); }
  .wk-row { display:flex; justify-content:space-between; align-items:center;
            background:var(--card); border:1px solid var(--line);
            border-radius:9px; padding:9px; margin-bottom:6px; font-size:12px; }
</style>
</head>
<body data-tab="admin">

<div class="topbar">
  <a href="index.html" style="font-size:16px">←</a>
  <div class="logo">管理后台</div>
  <div style="flex:1"></div>
  <div class="wallet" id="wallet">🛡️ <b>—</b></div>
</div>

<div class="rolebar" id="rolebar"></div>
<div id="denied" style="display:none"></div>

<div id="panel">
  <div class="stats" id="stats"></div>

  <div class="section">
    <div class="section-title">待审核举报</div>
    <div id="reports"></div>
  </div>

  <div class="section">
    <div class="section-title">打手信用总览</div>
    <div id="workers"></div>
  </div>

  <div class="section">
    <div class="section-title">全部订单</div>
    <div id="allOrders"></div>
  </div>
</div>

<div class="version" id="ver"></div>
<div class="tabbar" id="tabbar"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
const S = YCApp.init();
document.getElementById('ver').textContent = YC.VERSION;

if (S.role !== 'admin') {
  document.getElementById('panel').style.display = 'none';
  document.getElementById('rolebar').style.display = 'none';
  document.getElementById('denied').style.display = '';
  document.getElementById('denied').innerHTML =
    `<div class="empty" style="padding-top:100px">
       <span class="icon">🚫</span>此页面为管理员专用<br><br>
       <a href="index.html" class="btn" style="display:inline-block;margin-top:10px">回首页</a>
     </div>`;
} else {
  render();
}

function render() {
  const pending = S.reports.filter(r => r.state === 'pending');
  const done = S.orders.filter(o => o.status === YCStatus.DONE).length;
  const totalBf = S.orders.reduce((a, o) => a + o.price, 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${S.orders.length}</b><span>总订单</span></div>
    <div class="stat"><b>${done}</b><span>已完成</span></div>
    <div class="stat"><b style="color:#f87171">${pending.length}</b><span>待审举报</span></div>
  `;

  /* 举报审核 */
  const rBox = document.getElementById('reports');
  if (!pending.length) {
    rBox.innerHTML = '<div class="empty"><span class="icon">✅</span>暂无待审核举报</div>';
  } else {
    rBox.innerHTML = pending.map(r => `
      <div class="pending-item" data-r="${r.id}">
        <div class="hd">
          <span style="font-size:11px;color:var(--dim);font-family:ui-monospace,monospace">${r.id} · ${r.orderId}</span>
          <span class="status" style="background:#fbbf2422;color:#fbbf24">待审核</span>
        </div>
        <div class="row"><span>被举报打手</span><span>${r.workerName}</span></div>
        <div class="row"><span>事由</span><span>${r.ruleName}</span></div>
        <div class="row"><span>拟处罚</span><span style="color:#f87171">扣 ${r.penalty} 信用分</span></div>
        <div class="row"><span>老板补偿</span><span style="color:#4ade80">+${Math.round(r.penalty / 4)} 白饭</span></div>
        <div class="row"><span>举证</span><span>${r.proof ? '✅ 已上传录屏' : '❌ 无'}</span></div>
        ${r.note ? `<div class="row"><span>说明</span><span style="max-width:62%;text-align:right">${r.note}</span></div>` : ''}
      </div>`).join('');

    rBox.querySelectorAll('.pending-item').forEach(el => {
      const rid = el.dataset.r;
      const acts = document.createElement('div');
      acts.className = 'order-actions';
      acts.innerHTML = `
        <button class="btn btn-sm btn-danger" data-ok="1">受理并处罚</button>
        <button class="btn btn-sm btn-ghost" data-no="1">驳回</button>`;
      el.appendChild(acts);
      acts.querySelector('[data-ok]').onclick = () => acceptReport(rid);
      acts.querySelector('[data-no]').onclick = () => rejectReport(rid);
    });
  }

  /* 打手信用 */
  document.getElementById('workers').innerHTML = YC.WORKERS.map(w => {
    const c = YCUtil.creditOf(S, w.id);
    const ded = S.workerCredit[w.id] || 0;
    return `<div class="wk-row">
      <span>${w.avatar} ${w.name} <span class="rank ${w.rank}">${w.rank}</span></span>
      <span style="color:${c >= 80 ? '#4ade80' : c >= 60 ? '#fbbf24' : '#f87171'}">
        ${c} 分${ded ? `（-${ded}）` : ''}
      </span>
    </div>`;
  }).join('');

  /* 全部订单 */
  const oBox = document.getElementById('allOrders');
  oBox.innerHTML = S.orders.length ? S.orders.map(o => `
    <div class="order">
      <div class="order-head">
        <span class="order-no">${o.id}</span>
        <span class="status" style="background:${YCStatus.COLOR[o.status]}22;color:${YCStatus.COLOR[o.status]}">
          ${YCStatus.LABEL[o.status]}</span>
      </div>
      <div class="order-body">
        <div class="order-row"><span>服务</span><span>${YCUtil.gameIcon(o.gid)} ${o.service}</span></div>
        <div class="order-row"><span>打手</span><span>${o.workerName}</span></div>
        <div class="order-row"><span>金额</span><span style="color:#fbbf24">${YCUtil.money(o.price)}</span></div>
      </div>
    </div>`).join('') : '<div class="empty"><span class="icon">📋</span>还没有订单</div>';
}

function acceptReport(rid) {
  const r = S.reports.find(x => x.id === rid);
  if (!r) return;
  YCApp.modal('确认处罚', `
    <div class="modal-row"><span>打手</span><span>${r.workerName}</span></div>
    <div class="modal-row"><span>事由</span><span>${r.ruleName}</span></div>
    <div class="modal-row"><span>扣信用分</span><span style="color:#f87171">-${r.penalty}</span></div>
    <div class="modal-row"><span>老板补偿</span><span style="color:#4ade80">+${Math.round(r.penalty / 4)} 白饭</span></div>
    <p style="font-size:11px;color:#7d93ad;margin-top:9px">处罚会同步扣减打手信用分，订单将转为已取消并退款。</p>
  `, [
    { t: '确认执行', cls: 'btn-danger', fn: () => {
        r.state = 'accepted';
        r.decidedAt = Date.now();
        S.workerCredit[r.workerId] = (S.workerCredit[r.workerId] || 0) + r.penalty;
        S.baofan += Math.round(r.penalty / 4);
        const o = S.orders.find(x => x.id === r.orderId);
        if (o && o.status !== YCStatus.DONE && o.status !== YCStatus.CANCELLED) {
          // 退款给老板
          S.baofan += o.price;
          o.status = YCStatus.CANCELLED;
          o.history = o.history || [];
          o.history.push({ to: YCStatus.CANCELLED, at: Date.now(), by: 'admin' });
        }
        YCApp.save();
        YCApp.toast('已受理：扣分 + 补偿 + 退款');
        render();
      }},
    { t: '取消', cls: 'btn-ghost' }
  ]);
}

function rejectReport(rid) {
  const r = S.reports.find(x => x.id === rid);
  if (!r) return;
  YCApp.modal('驳回举报', '<p style="font-size:12.5px;color:#7d93ad">证据不足则驳回，举报记录保留备查。</p>', [
    { t: '确认驳回', cls: 'btn-ghost', fn: () => {
        r.state = 'rejected';
        r.decidedAt = Date.now();
        YCApp.save();
        YCApp.toast('已驳回');
        render();
      }},
    { t: '取消', cls: 'btn-ghost' }
  ]);
}

YCApp.renderTabbar('admin');
</script>
</body>
</html>
