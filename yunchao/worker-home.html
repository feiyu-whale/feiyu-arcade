<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打手主页 · 云巢电竞</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding-bottom:64px; }
  .cover {
    height:132px; position:relative;
    background:linear-gradient(135deg,#1e3a5f,#312e81 60%,#4c1d95);
  }
  .cover::after {
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(34,211,238,.25), transparent 60%);
  }
  .back-btn {
    position:absolute; top:10px; left:11px; z-index:5;
    background:rgba(0,0,0,.42); color:#fff; border-radius:50%;
    width:31px; height:31px; display:flex; align-items:center; justify-content:center;
    font-size:15px;
  }
  .profile { position:relative; margin-top:-34px; padding:0 14px; }
  .p-row { display:flex; align-items:flex-end; gap:11px; }
  .p-ava {
    width:70px; height:70px; border-radius:18px; flex-shrink:0;
    background:linear-gradient(135deg,#1e3a5f,#312e81);
    border:3px solid var(--bg); display:flex; align-items:center;
    justify-content:center; font-size:35px; position:relative;
  }
  .p-name { font-size:17px; font-weight:700; display:flex; align-items:center; gap:6px; padding-bottom:5px; }
  .cert { font-size:9.5px; background:#1e3a8a; color:#93c5fd; padding:1px 6px; border-radius:6px; }
  .p-status { font-size:11px; color:var(--dim); padding-bottom:5px; }

  .p-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin:13px 0; }
  .p-stats div { background:var(--card); border:1px solid var(--line); border-radius:9px;
                 padding:8px 4px; text-align:center; }
  .p-stats b { display:block; font-size:14.5px; color:var(--cyan); }
  .p-stats span { font-size:9.5px; color:var(--dim); }

  .tags { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:13px; }
  .tags span { font-size:10.5px; color:var(--cyan); background:#0e2a3a;
               padding:2px 8px; border-radius:8px; }

  .intro-box { background:var(--card); border:1px solid var(--line);
               border-radius:10px; padding:11px; font-size:12.5px;
               line-height:1.65; color:#b6c8dc; margin-bottom:14px; }

  .sec-t { font-size:13px; font-weight:600; margin:16px 0 9px; display:flex;
           align-items:center; gap:6px; }
  .sec-t::before { content:''; width:3px; height:12px; border-radius:2px;
                   background:linear-gradient(180deg,var(--cyan),var(--blue)); }
  .sec-t .more { margin-left:auto; font-size:11px; color:var(--dim); font-weight:400; }

  .svc-card { display:flex; gap:9px; background:var(--card); border:1px solid var(--line);
              border-radius:10px; padding:10px; margin-bottom:8px; cursor:pointer; }
  .svc-card.on { border-color:var(--cyan); background:#0e2a3a; }
  .svc-ic { width:42px; height:42px; border-radius:10px; flex-shrink:0;
            background:linear-gradient(135deg,#1e3a5f,#312e81);
            display:flex; align-items:center; justify-content:center; font-size:20px; }

  .review { background:var(--card); border:1px solid var(--line);
            border-radius:10px; padding:10px; margin-bottom:8px; }
  .rev-head { display:flex; justify-content:space-between; font-size:11px; color:var(--dim);
              margin-bottom:5px; }
  .rev-stars { color:#fbbf24; }
  .rev-body { font-size:12.5px; line-height:1.6; }
  .rev-tags { display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
  .rev-tags span { font-size:10px; background:#0e2a3a; color:var(--cyan);
                   padding:1px 7px; border-radius:7px; }

  .buybar {
    position:fixed; left:0; right:0; bottom:0; z-index:56;
    background:rgba(20,32,52,.98); backdrop-filter:blur(9px);
    border-top:1px solid var(--line);
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:9px;
  }
  .buybar .l { flex:1; font-size:11px; color:var(--dim); }
  .buybar .l b { display:block; font-size:16px; color:var(--gold); }
  .buybar .ico { width:40px; text-align:center; font-size:19px; color:var(--dim); }
</style>
</head>
<body data-tab="index">

<div class="cover">
  <a class="back-btn" href="javascript:history.back()">←</a>
</div>

<div class="profile">
  <div class="p-row">
    <div class="p-ava" id="pAva">🐋</div>
    <div style="flex:1">
      <div class="p-name" id="pName">—</div>
      <div class="p-status" id="pStatus">—</div>
    </div>
  </div>

  <div class="p-stats" id="pStats"></div>
  <div class="tags" id="pTags"></div>
  <div class="intro-box" id="pIntro"></div>

  <div class="sec-t">服务项目<span class="more" id="svcCount"></span></div>
  <div id="svcList"></div>

  <div class="sec-t">评价<span class="more" id="revMore"></span></div>
  <div id="revList"></div>
</div>

<div class="buybar">
  <div class="ico" id="icChat">💬</div>
  <div class="l">
    <span id="selName">请选择服务</span>
    <b id="selPrice">—</b>
  </div>
  <button class="btn" id="buyBtn" disabled>立即下单</button>
</div>

<div class="version" id="ver"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
const S = YCApp.init();
document.getElementById('ver').textContent = YC.VERSION;

const params = new URLSearchParams(location.search);
const wid = params.get('id') || 'w1';
const presetSid = params.get('sid');

const w = YC.WORKERS.find(x => x.id === wid);

// 声明放前面，避免 init() 里 TDZ 报错
let curService = null;

if (!w) {
  document.body.innerHTML = '<div class="empty" style="padding-top:120px"><span class="icon">❓</span>打手不存在</div>';
} else {
  init();
}

function init() {
  const credit = YCUtil.creditOf(S, w.id);
  const avg = YCUtil.avgOfReviews(S, w.id);
  const reviews = S.reviews[w.id] || [];

  document.getElementById('pAva').textContent = w.avatar;
  document.getElementById('pName').innerHTML =
    `${w.name} <span class="rank ${w.rank}">${w.rank}</span>
     <span class="cert">已认证</span>`;
  document.getElementById('pStatus').textContent =
    `${w.online ? '🟢 在线接单' : '⚫ 当前离线'} · ${w.games.map(g => YCUtil.gameIcon(g) + YCUtil.gameName(g)).join(' ')}`;

  document.getElementById('pStats').innerHTML = `
    <div><b>${credit}</b><span>信用分</span></div>
    <div><b>${w.goodRate}%</b><span>好评率</span></div>
    <div><b>${w.orders}</b><span>接单量</span></div>
    <div><b>${avg || '—'}</b><span>评分</span></div>`;

  document.getElementById('pTags').innerHTML =
    w.tags.map(t => `<span>${t}</span>`).join('');

  document.getElementById('pIntro').innerHTML =
    `${w.intro}<br><span style="font-size:11px;color:#64748b">
      到店押金 ${w.deposit} 白饭（虚拟） · 已通过平台资质审核</span>`;

  /* 服务项目 */
  const svcs = YC.SERVICES.filter(s => !s.gid || w.games.includes(s.gid));
  document.getElementById('svcCount').textContent = `${svcs.length} 项`;
  document.getElementById('svcList').innerHTML = svcs.map(s => {
    const t = YCUtil.tierOf(s.tier);
    return `<div class="svc-card" data-s="${s.id}">
      <div class="svc-ic">${YCUtil.gameIcon(s.gid)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:600">${s.title}
          <span style="font-size:9px;color:${t.color}">${t.name}</span></div>
        <div style="font-size:10.5px;color:#7d93ad;margin-top:2px">${s.sub} · ${s.dur}</div>
      </div>
      <div style="text-align:right">
        <div class="price" style="font-size:14px">${s.price}<small>白饭</small></div>
        <div style="font-size:9.5px;color:#64748b;margin-top:2px">已售 ${s.sold}</div>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('[data-s]').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('[data-s]').forEach(x => x.classList.remove('on'));
      el.classList.add('on');
      curService = YC.SERVICES.find(x => x.id === el.dataset.s);
      document.getElementById('selName').textContent = curService.title;
      document.getElementById('selPrice').innerHTML =
        curService.price + ' <small style="font-size:10px;color:#7d93ad">白饭</small>';
      document.getElementById('buyBtn').disabled = false;
    };
  });

  /* 评价 */
  const revBox = document.getElementById('revList');
  if (!reviews.length) {
    document.getElementById('revMore').textContent = '暂无';
    revBox.innerHTML = `<div class="empty" style="padding:26px"><span class="icon">💬</span>还没有评价</div>`;
  } else {
    document.getElementById('revMore').textContent = `${reviews.length} 条`;
    revBox.innerHTML = reviews.slice().reverse().map(r => `
      <div class="review">
        <div class="rev-head">
          <span>匿名老板</span>
          <span>${YCUtil.time(r.at)}</span>
        </div>
        <div class="rev-stars">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</div>
        <div class="rev-body" style="margin-top:4px">${YCSec.esc(r.text) || '（未填写文字评价）'}</div>
        ${r.stars >= 4 ? '<div class="rev-tags"><span>技术好</span><span>守时</span></div>' : ''}
      </div>`).join('');
  }

  /* 预选服务 */
  if (presetSid) {
    const el = document.querySelector(`[data-s="${presetSid}"]`);
    if (el) el.click();
  }

  /* 联系打手 */
  document.getElementById('icChat').onclick = () => {
    YCApp.modal(w.name, `
      <div style="font-size:10px;color:#64748b;margin-bottom:4px">系统 · ${YCUtil.time(Date.now())}</div>
      <div style="background:var(--card);border:1px solid var(--line);border-radius:9px;
                  padding:9px 11px;font-size:12.5px">
        你好，我是${w.name}。看中哪个服务直接下单就行，有疑问也可以先问。
      </div>
      <div class="field" style="margin-top:12px;margin-bottom:0">
        <input placeholder="演示系统：消息不会真的发出" disabled style="opacity:.55">
      </div>`, [{ t: '关闭', cls: 'btn-ghost' }]);
  };

  /* 下单 */
  document.getElementById('buyBtn').onclick = () => {
    if (S.role !== 'boss') { YCApp.toast('只有老板身份可以下单', true); return; }
    if (!curService) { YCApp.toast('请先选择服务', true); return; }
    if (!w.online) { YCApp.toast('该打手当前离线', true); return; }
    if (S.baofan < curService.price) { YCApp.toast('白饭不够', true); return; }
    location.href = `order-confirm.html?wid=${w.id}&sid=${curService.id}`;
  };
}
</script>
</body>
</html>
