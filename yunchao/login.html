<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>欢迎 · 云巢电竞</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding-bottom:0; }
  .splash {
    position:fixed; inset:0; z-index:300;
    background:linear-gradient(160deg,#0a1628,#12233d 55%,#1e1b4b);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .5s;
  }
  .splash .mark { font-size:76px; animation:float 2.4s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  .splash h1 { font-size:23px; margin-top:14px; letter-spacing:5px; color:#e0f2fe; }
  .splash .sub { font-size:11.5px; color:#64748b; margin-top:7px; letter-spacing:2.5px; }

  .login { padding:0 22px; max-width:440px; margin:0 auto; }
  .login-head { text-align:center; padding:46px 0 26px; }
  .login-head .mk { font-size:52px; }
  .login-head h2 { font-size:19px; margin-top:11px; letter-spacing:2px; }
  .login-head p { font-size:11.5px; color:var(--dim); margin-top:5px; }

  .inp-group { margin-bottom:13px; }
  .inp-group label { font-size:11.5px; color:var(--dim); display:block; margin-bottom:5px; }
  .inp-group input {
    width:100%; background:var(--bg2); border:1px solid var(--line);
    color:var(--txt); border-radius:9px; padding:12px 13px; font-size:14px;
    font-family:inherit; outline:none; letter-spacing:.5px;
  }
  .inp-group input:focus { border-color:var(--cyan); }
  .code-row { display:flex; gap:8px; }
  .code-row input { flex:1; }
  .code-row button {
    background:var(--card); border:1px solid var(--line); color:var(--cyan);
    border-radius:9px; padding:0 14px; font-size:12px; white-space:nowrap;
  }
  .code-row button:disabled { color:#475569; }

  .agree { display:flex; align-items:flex-start; gap:8px; font-size:11.5px; color:var(--dim); margin:16px 0; line-height:1.6; }
  .agree input { margin-top:2px; accent-color:var(--cyan); }
  .agree a { color:var(--cyan); }

  .btn-login {
    width:100%; padding:14px; border-radius:10px; font-size:15px; font-weight:600;
    background:linear-gradient(90deg,#3b82f6,#22d3ee); color:#04121f;
  }
  .btn-login:disabled { background:#334155; color:#64748b; }

  .other { text-align:center; margin-top:20px; font-size:11.5px; color:var(--dim); }
  .other .line { display:flex; align-items:center; gap:11px; margin-bottom:14px; }
  .other .line::before, .other .line::after {
    content:''; flex:1; height:1px; background:var(--line);
  }
  .oauth { display:flex; justify-content:center; gap:22px; font-size:25px; }
  .oauth span { opacity:.6; cursor:pointer; }

  .legal { position:fixed; bottom:0; left:0; right:0; text-align:center;
           font-size:10px; color:#33475f; padding:13px; }
</style>
</head>
<body data-nologin="1">

<!-- 启动闪屏 -->
<div class="splash" id="splash">
  <div class="mark">🐋</div>
  <h1>云巢电竞</h1>
  <div class="sub">YUNCHAO ESPORTS</div>
</div>

<!-- 登录页 -->
<div class="login" id="loginPage" style="display:none">
  <div class="login-head">
    <div class="mk">🐋</div>
    <h2>云巢电竞</h2>
    <p>找到对的人 · 一起打得痛快</p>
  </div>

  <div class="inp-group">
    <label>手机号</label>
    <input id="phone" type="tel" maxlength="11" placeholder="请输入手机号" value="13800138000">
  </div>

  <div class="inp-group">
    <label>验证码</label>
    <div class="code-row">
      <input id="code" type="tel" maxlength="6" placeholder="请输入验证码">
      <button id="sendCode">获取验证码</button>
    </div>
  </div>

  <div class="agree">
    <input type="checkbox" id="agree">
    <span>我已阅读并同意 <a href="javascript:;" id="linkTerms">《用户协议》</a> 与 <a href="javascript:;" id="linkPrivacy">《隐私政策》</a>，并知悉本系统为演示版本，不存在真实交易</span>
  </div>

  <button class="btn-login" id="doLogin" disabled>登 录</button>

  <div class="other">
    <div class="line">其他登录方式</div>
    <div class="oauth">
      <span title="微信（演示不可用）">💬</span>
      <span title="QQ（演示不可用）">🐧</span>
      <span title="游客体验" id="guest">👤</span>
    </div>
  </div>
</div>

<div class="legal">演示系统 · 无真实交易 · 全部数据仅存储于本机浏览器</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
/* ============ 闪屏 ============ */
setTimeout(() => {
  const sp = document.getElementById('splash');
  sp.style.opacity = '0';
  setTimeout(() => { sp.style.display = 'none'; }, 480);

  // 已登录则直接进首页
  const logged = localStorage.getItem('yunchao_logged');
  if (logged === '1') {
    location.replace('index.html');
    return;
  }
  document.getElementById('loginPage').style.display = '';
}, 1600);

/* ============ 表单 ============ */
const phoneEl = document.getElementById('phone');
const codeEl = document.getElementById('code');
const agreeEl = document.getElementById('agree');
const loginBtn = document.getElementById('doLogin');
const sendBtn = document.getElementById('sendCode');

function checkForm() {
  const okPhone = /^1\d{10}$/.test(phoneEl.value.trim());
  const okCode = codeEl.value.trim().length >= 4;
  loginBtn.disabled = !(okPhone && okCode && agreeEl.checked);
}

phoneEl.oninput = checkForm;
codeEl.oninput = checkForm;
agreeEl.onchange = checkForm;

let countdown = 0;
sendBtn.onclick = () => {
  if (countdown > 0) return;
  const p = phoneEl.value.trim();
  if (!/^1\d{10}$/.test(p)) { YCApp.toast('请输入正确的手机号', true); return; }

  // 演示：验证码自动填入
  countdown = 60;
  sendBtn.disabled = true;
  codeEl.value = '8888';
  checkForm();
  YCApp.toast('演示模式：验证码已自动填入 8888');

  const t = setInterval(() => {
    countdown--;
    sendBtn.textContent = countdown + 's 后重发';
    if (countdown <= 0) {
      clearInterval(t);
      sendBtn.disabled = false;
      sendBtn.textContent = '获取验证码';
    }
  }, 1000);
};

loginBtn.onclick = () => {
  if (!agreeEl.checked) { YCApp.toast('请先同意用户协议', true); return; }
  const p = phoneEl.value.trim();
  localStorage.setItem('yunchao_logged', '1');
  localStorage.setItem('yunchao_phone', p);

  // 初始化用户数据
  const s = YCStore.load();
  s.phone = p;
  const masked = p.slice(0, 3) + '****' + p.slice(7);
  s.nickname = s.nickname || ('老板' + masked.slice(-4));
  YCStore.save(s);

  YCApp.toast('登录成功');
  setTimeout(() => location.replace('index.html'), 500);
};

/* 游客 */
document.getElementById('guest').onclick = () => {
  localStorage.setItem('yunchao_logged', '1');
  const s = YCStore.load();
  s.phone = '';
  s.nickname = s.nickname || '游客老板';
  YCStore.save(s);
  YCApp.toast('已进入游客模式');
  setTimeout(() => location.replace('index.html'), 500);
};

/* 协议弹层 */
function showLegal(title, body) {
  YCApp.modal(title, `<div style="font-size:12px;color:#94a3b8;line-height:1.85;max-height:52vh;overflow:auto">${body}</div>`, [
    { t: '我知道了', fn: () => {
        agreeEl.checked = true;
        checkForm();
      }}
  ]);
}

document.getElementById('linkTerms').onclick = () => showLegal('用户协议（演示）', `
  <b>一、服务说明</b><br>
  本系统为技术演示版本，不提供任何真实陪玩、代练或交易服务。页面内所有打手、
  订单、金额均为虚构数据，仅存储于您本机浏览器。<br><br>
  <b>二、虚拟货币</b><br>
  「白饭」为虚拟积分，不可充值、不可提现、不可转让、不具备任何货币价值。<br><br>
  <b>三、禁止行为</b><br>
  请勿将本系统页面用于任何实际经营活动，或据此向他人收取费用。<br><br>
  <b>四、免责</b><br>
  本系统按「现状」提供，不对任何使用后果承担责任。
`);

document.getElementById('linkPrivacy').onclick = () => showLegal('隐私政策（演示）', `
  <b>一、数据存储</b><br>
  本系统没有任何后端服务器。您输入的手机号、产生的订单与评价，
  全部仅保存在当前浏览器的 localStorage 中，不会上传至任何地方。<br><br>
  <b>二、数据删除</b><br>
  您可在「我的 → 重置演示数据」中一键清除全部本地数据，
  或在浏览器设置中清除本站站点数据。<br><br>
  <b>三、第三方</b><br>
  本系统不接入任何第三方统计、广告或推送服务。<br><br>
  <b>四、联系方式</b><br>
  本系统为演示项目，不设真实客服渠道。
`);
</script>
</body>
</html>
